  <style nonce="scummOPL2">
    :root {
      --cab-bg: #0c0b09;
      --cab-walnut-dark: #2a180d;
      --cab-walnut-mid: #472815;
      --cab-bezel: #17181c;
      --cab-bezel-inner: #090a0d;
      --cab-brass: #d49b35;
      --cab-amber: #ffaa00;
      --cab-cream: #e8dec8;
      --cab-muted: #9a9282;
      --cab-btn-bg: #23252b;
      --cab-btn-hover: #32353e;
      --cab-btn-border: #4a4e59;
      --cab-led-on: #55ff55;
      --cab-led-off: #550000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--cab-bg);
      background-image:
        radial-gradient(circle at 50% 18%, #1d1812 0%, #0c0b09 72%);
      color: var(--cab-cream);
      font-family: "Courier New", Courier, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
    }

    #arcade-cabinet {
      width: min(980px, 96vw, calc((100vh - 148px) * 1.6));
      min-width: 320px;
      background: linear-gradient(90deg,
        var(--cab-walnut-dark) 0%,
        var(--cab-walnut-mid) 2.2%,
        var(--cab-bezel) 2.6%,
        var(--cab-bezel) 97.4%,
        var(--cab-walnut-mid) 97.8%,
        var(--cab-walnut-dark) 100%);
      border: 3px solid #3a2312;
      border-radius: 14px 14px 10px 10px;
      box-shadow:
        0 26px 64px rgba(0, 0, 0, 0.88),
        inset 0 1px 0 rgba(255, 220, 160, 0.14);
      padding: 14px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .marquee-bar {
      background: linear-gradient(180deg, #241b10 0%, #14100b 100%);
      border: 2px solid #5c4018;
      border-radius: 6px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: inset 0 0 18px rgba(255, 170, 0, 0.12);
    }

    .marquee-title-group {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .marquee-bar h1 {
      font-size: clamp(1rem, 2.1vw, 1.45rem);
      letter-spacing: 0.14em;
      color: var(--cab-amber);
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 0 2px 0 #552200;
    }

    .marquee-sub {
      font-size: clamp(0.68rem, 1.2vw, 0.8rem);
      letter-spacing: 0.08em;
      color: var(--cab-cream);
      opacity: 0.85;
    }

    .audio-lamp {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--cab-muted);
      white-space: nowrap;
    }

    .led-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--cab-led-off);
      border: 1px solid #220000;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .led-dot.is-online {
      background: var(--cab-led-on);
      border-color: #00aa00;
      box-shadow: 0 0 8px rgba(85, 255, 85, 0.75);
    }

    .crt-housing {
      position: relative;
      width: 100%;
      aspect-ratio: 320 / 200;
      background: var(--cab-bezel-inner);
      border: 8px solid #101115;
      border-radius: 10px;
      box-shadow:
        inset 0 0 24px rgba(0, 0, 0, 0.95),
        0 2px 0 rgba(255, 255, 255, 0.05);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      cursor: crosshair;
    }

    .crt-scanlines {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0.22) 3px,
          rgba(0, 0, 0, 0.22) 4px
        );
      opacity: 0.65;
      transition: opacity 0.2s ease;
    }

    .crt-scanlines.is-hidden {
      opacity: 0;
    }

    .control-deck {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #121317;
      border: 1px solid #2b2e37;
      border-radius: 6px;
      padding: 8px 12px;
    }

    .deck-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .arcade-btn {
      appearance: none;
      background: var(--cab-btn-bg);
      color: var(--cab-cream);
      border: 1px solid var(--cab-btn-border);
      border-bottom-width: 3px;
      border-radius: 4px;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 0.73rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background-color 0.12s ease, transform 0.06s ease;
    }

    .arcade-btn:hover {
      background: var(--cab-btn-hover);
      color: #ffff55;
    }

    .arcade-btn:active {
      transform: translateY(1px);
      border-bottom-width: 2px;
    }

    .arcade-btn.btn-primary {
      background: #4e3208;
      border-color: var(--cab-brass);
      color: #ffff55;
    }

    .arcade-btn.btn-primary:hover {
      background: #6b450c;
    }

    .deck-readout {
      font-size: 0.72rem;
      color: var(--cab-muted);
      letter-spacing: 0.04em;
      text-align: right;
      flex: 1 1 240px;
    }

    @media (max-width: 640px) {
      #arcade-cabinet {
        padding: 10px 12px;
      }
      .crt-housing {
        border-width: 4px;
      }
      .deck-readout {
        text-align: left;
      }
    }
  </style>
</head>

  <main id="arcade-cabinet" aria-label="SCUMM-ANOID Retro Arcade Cabinet">
    <header class="marquee-bar">
      <div class="marquee-title-group">
        <h1>SCUMM-ANOID</h1>
        <span class="marquee-sub">EGA 320x200 &bull; ADLIB YM3812 OPL2 FM</span>
      </div>
      <div class="audio-lamp" title="AdLib OPL2 Synthesizer Status">
        <span id="opl-led" class="led-dot"></span>
        <span id="opl-status-text">OPL2 STANDBY</span>
      </div>
    </header>

    <section class="crt-housing" aria-label="320x200 EGA Viewport">
      <canvas id="game-canvas" width="320" height="200"></canvas>
      <div id="crt-overlay" class="crt-scanlines"></div>
    </section>

    <footer class="control-deck">
      <div class="deck-buttons">
        <button id="btn-start" class="arcade-btn btn-primary" type="button">START / LAUNCH [SPACE]</button>
        <button id="btn-prev-lvl" class="arcade-btn" type="button" title="Select Previous Level">&lt; LVL</button>
        <button id="btn-next-lvl" class="arcade-btn" type="button" title="Select Next Level">LVL &gt;</button>
        <button id="btn-pause" class="arcade-btn" type="button">PAUSE [P]</button>
        <button id="btn-mute" class="arcade-btn" type="button">ADLIB: ON [M]</button>
        <button id="btn-crt" class="arcade-btn" type="button">SCANLINES [V]</button>
      </div>
      <div id="cabinet-status" class="deck-readout">
        MOUSE OR A/D/ARROWS TO STEER &bull; SPACE/CLICK TO LAUNCH &amp; FIRE
      </div>
    </footer>
  </main>

        curve[i] = ((3 + drive) * x * 20 * (Math.PI / 180)) / (Math.PI + drive * Math.abs(x));
      }
      return curve;
    }

    buildBitCrushCurve(steps) {
      const n = 512;
      const curve = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const x = (i * 2) / n - 1;
        curve[i] = Math.round(x * steps) / steps;
      }
      return curve;
    }

    unlock() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return false;
        this.ctx = new AudioCtx();

        this.limiter = this.ctx.createDynamicsCompressor();
        this.limiter.threshold.value = -4;
        this.limiter.knee.value = 4;
        this.limiter.ratio.value = 14;
        this.limiter.attack.value = 0.002;
        this.limiter.release.value = 0.09;

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = this.muted ? 0 : 0.78;

        this.musicBus = this.ctx.createGain();
        this.musicBus.gain.value = 0.56;

        this.sfxBus = this.ctx.createGain();
        this.sfxBus.gain.value = 0.86;

        /* Cavern stereo echo send for Atlantis & Loom */
        this.echoDelay = this.ctx.createDelay(1.0);
        this.echoDelay.delayTime.value = 0.31;
        this.echoFeedback = this.ctx.createGain();
        this.echoFeedback.gain.value = 0.34;
        this.echoWet = this.ctx.createGain();
        this.echoWet.gain.value = 0.28;
        this.echoDelay.connect(this.echoFeedback);
        this.echoFeedback.connect(this.echoDelay);
        this.echoDelay.connect(this.echoWet);
        this.echoWet.connect(this.musicBus);

        this.musicBus.connect(this.limiter);
        this.sfxBus.connect(this.limiter);
        this.limiter.connect(this.masterGain);
        this.masterGain.connect(this.ctx.destination);

        /* Synthesize deterministic LFSR-flavored retro white noise buffer */
        const len = this.ctx.sampleRate * 2;
        this.noiseBuffer = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const data = this.noiseBuffer.getChannelData(0);
        let lfsr = 0xACE1;
        for (let i = 0; i < len; i++) {
          const bit = ((lfsr >> 0) ^ (lfsr >> 2) ^ (lfsr >> 3) ^ (lfsr >> 5)) & 1;
          lfsr = (lfsr >> 1) | (bit << 15);
          const white = (Math.random() * 2 - 1) * 0.65;
          data[i] = white + ((lfsr & 1) ? 0.35 : -0.35);
        }
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      return true;
    }

    setMuted(flag) {
      this.muted = flag;
      if (this.masterGain && this.ctx) {
        this.masterGain.gain.setTargetAtTime(this.muted ? 0 : 0.78, this.ctx.currentTime, 0.015);
      }
    }

    startMusic(worldIndex, levelIndex) {
      this.worldIndex = Math.max(0, Math.min(SOUNDTRACKS.length - 1, worldIndex));
      this.levelIndex = levelIndex;
      if (!this.ctx) return;
      this.stepIndex = 0;
      this.nextNoteTime = this.ctx.currentTime + 0.04;
      this.playing = true;
      if (!this.schedulerTimer) {
        this.schedulerTimer = setInterval(() => this.schedulerTick(), 25);
      }
    }

    stopMusic() {
      this.playing = false;
    }

    getLevelVariation() {
      /* Distinct iMUSE-style per-level musical variation across all 33 levels */
      const withinWorld = this.levelIndex % 6;
      const semitoneShifts = [0, 2, -2, 5, 3, 7];
      const tempoScales = [1.0, 1.03, 0.98, 1.05, 1.02, 1.07];
      if (this.worldIndex === 6) {
        return { transpose: 0, tempoScale: 1.0, octaveSparkle: true };
      }
      return {
        transpose: semitoneShifts[withinWorld],
        tempoScale: tempoScales[withinWorld],
        octaveSparkle: (withinWorld % 2) === 1
      };
    }

    schedulerTick() {
      if (!this.playing || !this.ctx || this.ctx.state !== 'running') return;
      const track = SOUNDTRACKS[this.worldIndex];
      const variation = this.getLevelVariation();
      const bpm = track.bpm * variation.tempoScale;
      const baseStepSec = 60 / bpm / 4;

      while (this.nextNoteTime < this.ctx.currentTime + 0.12) {
        const step = this.stepIndex % 64;
        const swingOffset = (step % 2 === 1) ? baseStepSec * track.swing : 0;
        const t = this.nextNoteTime + swingOffset;

        const leadEv = track.lead[step];
        if (leadEv) {
          this.triggerFMVoice(
            track.leadPatch,
            leadEv[0] + variation.transpose,
            leadEv[1] * baseStepSec,
            leadEv[2] / 100,
            t
          );
        } else if (this.worldIndex === 2 && (step % 4 === 2) && Math.random() < 0.42) {
          /* Procedural haunting pentatonic chime ornament in The Atlantis Crypt */
          const pool = track.pentatonicPool;
          const chimeNote = pool[(step * 3 + this.levelIndex) % pool.length] + variation.transpose;
          this.triggerFMVoice('CRYPT_CHIME', chimeNote, baseStepSec * 3.5, 0.55, t);
        }

        const harmEv = track.harmony && track.harmony[step];
        if (harmEv) {
          const harmOct = (variation.octaveSparkle && (step % 8 === 6)) ? 12 : 0;
          this.triggerFMVoice(
            track.harmPatch,
            harmEv[0] + variation.transpose + harmOct,
            harmEv[1] * baseStepSec,
            harmEv[2] / 100,
            t
          );
        }

        if (track.counter && track.counter[step]) {
          const cEv = track.counter[step];
          this.triggerFMVoice(
            track.counterPatch,
            cEv[0] + variation.transpose,
            cEv[1] * baseStepSec,
            cEv[2] / 100,
            t
          );
        }

        const bassEv = track.bass[step];
        if (bassEv) {
          this.triggerBassVoice(
            track.bassPatch,
            bassEv[0] + variation.transpose,
            bassEv[1] * baseStepSec,
            bassEv[2] / 100,
            t
          );
        }

        const drumCode = track.drums[step % track.drums.length];
        if (drumCode) {
          this.triggerDrum(drumCode, t);
        }

        this.nextNoteTime += baseStepSec;
        this.stepIndex = (this.stepIndex + 1) % 64;
      }
    }

    /* 2-Operator Yamaha YM3812 (OPL2) FM Instrument Patch Renderer */
    triggerFMVoice(patch, midi, dur, vel, time) {
      const ctx = this.ctx;
      const freq = midiToHz(midi);
      const carrier = ctx.createOscillator();
      const modulator = ctx.createOscillator();
      const modGain = ctx.createGain();
      const ampGain = ctx.createGain();
      const p = OPL2_PATCH_BANK[patch] || OPL2_PATCH_BANK.STEEL_PAN;
      const modPeak = freq * p.mp;
      const modEnd = freq * p.me;
      const attack = p.a;
      const release = p.rel;
      const peakAmp = p.amp * vel;
      const vibratoHz = p.vibHz || 0;
      const vibratoDepth = freq * (p.vibD || 0);

      carrier.type = p.c;
      modulator.type = p.m;

      if (p.bend) {
        carrier.frequency.setValueAtTime(freq * 0.91, time);
        carrier.frequency.exponentialRampToValueAtTime(freq, time + 0.048);
      } else {
        carrier.frequency.setValueAtTime(freq, time);
      }
      modulator.frequency.setValueAtTime(freq * p.r, time);

      modGain.gain.setValueAtTime(0.01, time);
      modGain.gain.linearRampToValueAtTime(modPeak, time + attack);
      modGain.gain.exponentialRampToValueAtTime(Math.max(1, modEnd), time + dur + release);

      const stopTime = time + dur + release + 0.02;
      ampGain.gain.setValueAtTime(0.0001, time);
      ampGain.gain.linearRampToValueAtTime(peakAmp, time + attack);
      ampGain.gain.setValueAtTime(peakAmp * 0.78, time + Math.max(attack, dur * 0.75));
      ampGain.gain.exponentialRampToValueAtTime(0.0001, stopTime);

      modulator.connect(modGain);
      modGain.connect(carrier.frequency);

      if (vibratoHz > 0) {
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        lfo.frequency.setValueAtTime(vibratoHz, time);
        lfoGain.gain.setValueAtTime(vibratoDepth, time);
        lfo.connect(lfoGain);
        lfoGain.connect(carrier.frequency);
        lfo.start(time);
        lfo.stop(stopTime);
      }

      if (p.dist) {
        const shaper = ctx.createWaveShaper();
        shaper.curve = this.metalCurve;
        const cabFilter = ctx.createBiquadFilter();
        cabFilter.type = 'lowpass';
        cabFilter.frequency.setValueAtTime(3100, time);
        carrier.connect(shaper);
        shaper.connect(cabFilter);
        cabFilter.connect(ampGain);
      } else {
        carrier.connect(ampGain);
      }

      ampGain.connect(this.musicBus);
      if (p.echo) {
        ampGain.connect(this.echoDelay);
      }

      modulator.start(time);
      carrier.start(time);
      modulator.stop(stopTime);
      carrier.stop(stopTime);
    }

    /* Fat Triangle Bass Synth with Fast-Decaying Resonant Low-Pass Filter */
    triggerBassVoice(patch, midi, dur, vel, time) {
      const ctx = this.ctx;
      const freq = midiToHz(midi);
      const osc = ctx.createOscillator();
      const sub = ctx.createOscillator();
      const subMix = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      const amp = ctx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, time);

      sub.type = (patch === 'METAL_BASS' || patch === 'SPACE_BASS') ? 'sawtooth' : 'sine';
      sub.frequency.setValueAtTime(freq, time);
      subMix.gain.value = (patch === 'CRYPT_SUB') ? 0.2 : 0.42;

      filter.type = 'lowpass';
      filter.Q.value = (patch === 'CRYPT_SUB') ? 1.8 : 4.2;
      const startCut = (patch === 'CRYPT_SUB') ? 420 : 1850;
      const endCut = (patch === 'METAL_BASS') ? 260 : 155;
      filter.frequency.setValueAtTime(startCut, time);
      filter.frequency.exponentialRampToValueAtTime(endCut, time + Math.min(0.13, dur * 0.85));

      const stopTime = time + dur + 0.05;
      const peak = 0.28 * vel;
      amp.gain.setValueAtTime(0.0001, time);
      amp.gain.linearRampToValueAtTime(peak, time + 0.006);
      amp.gain.exponentialRampToValueAtTime(0.0001, stopTime);

      osc.connect(filter);
      sub.connect(subMix);
      subMix.connect(filter);
      filter.connect(amp);
      amp.connect(this.musicBus);

      osc.start(time);
      sub.start(time);
      osc.stop(stopTime);
      sub.stop(stopTime);
    }

    /* Synthesized Noise & Pitch-Swept Retro Drum Kit */
    triggerDrum(code, time) {
      if (code === 'B') {
        this.triggerDrum('K', time);
        this.triggerDrum('H', time);
        return;
      }
      if (code === 'X') {
        this.triggerDrum('K', time);
        this.triggerDrum('O', time);
        return;
      }
      const ctx = this.ctx;
      if (code === 'K') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(155, time);
        osc.frequency.exponentialRampToValueAtTime(36, time + 0.085);
        gain.gain.setValueAtTime(0.36, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.095);
        osc.connect(gain);
        gain.connect(this.musicBus);
        osc.start(time);
        osc.stop(time + 0.1);
        return;
      }

      if (code === 'R') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(920, time);
        osc.frequency.exponentialRampToValueAtTime(380, time + 0.028);
        gain.gain.setValueAtTime(0.17, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.032);
        osc.connect(gain);
        gain.connect(this.musicBus);
        osc.start(time);
        osc.stop(time + 0.035);
        return;
      }

      if (!this.noiseBuffer) return;
      const src = ctx.createBufferSource();
      src.buffer = this.noiseBuffer;
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();

      if (code === 'S') {
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1450, time);
        filter.Q.value = 1.1;
        gain.gain.setValueAtTime(0.24, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.11);

        const body = ctx.createOscillator();
        const bodyGain = ctx.createGain();
        body.type = 'triangle';
        body.frequency.setValueAtTime(195, time);
        body.frequency.exponentialRampToValueAtTime(95, time + 0.05);
        bodyGain.gain.setValueAtTime(0.16, time);
        bodyGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.055);
        body.connect(bodyGain);
        bodyGain.connect(this.musicBus);
        body.start(time);
        body.stop(time + 0.06);

        src.connect(filter);
        filter.connect(gain);
        gain.connect(this.musicBus);
        src.start(time, (this.stepIndex * 0.03) % 1.4, 0.12);
      } else if (code === 'H' || code === 'O') {
        const dur = (code === 'O') ? 0.14 : 0.035;
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(6800, time);
        gain.gain.setValueAtTime(code === 'O' ? 0.13 : 0.09, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
        src.connect(filter);
        filter.connect(gain);
        gain.connect(this.musicBus);
        src.start(time, (this.stepIndex * 0.05) % 1.4, dur + 0.01);
      }
    }

    /* Dedicated Low-Fi Bit-Crushed SFX Channel */
    playSFX(kind, param = 0) {
      if (!this.ctx || this.muted || this.ctx.state !== 'running') return;
      const ctx = this.ctx;
      const now = ctx.currentTime;

      const connectCrushed = (node, gainVal, dur) => {
        const crusher = ctx.createWaveShaper();
        crusher.curve = this.crushCurve;
        const g = ctx.createGain();
        g.gain.setValueAtTime(gainVal, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        node.connect(crusher);
        crusher.connect(g);
        g.connect(this.sfxBus);
      };

      switch (kind) {
        case 'paddle': {
          const osc = ctx.createOscillator();
          osc.type = 'square';
          const base = 310 + param * 55;
          osc.frequency.setValueAtTime(base, now);
          osc.frequency.exponentialRampToValueAtTime(base * 1.65, now + 0.065);
          connectCrushed(osc, 0.22, 0.075);
          osc.start(now);
          osc.stop(now + 0.08);
          break;
        }
        case 'wall': {
          const osc = ctx.createOscillator();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(210, now);
          osc.frequency.exponentialRampToValueAtTime(125, now + 0.04);
          connectCrushed(osc, 0.18, 0.045);
          osc.start(now);
          osc.stop(now + 0.05);
          break;
        }
        case 'brick': {
          const osc = ctx.createOscillator();
          const mod = ctx.createOscillator();
          const mg = ctx.createGain();
          const pitch = 440 * Math.pow(1.06, Math.min(14, param));
          osc.type = 'sine';
          mod.type = 'square';
          osc.frequency.setValueAtTime(pitch, now);
          osc.frequency.exponentialRampToValueAtTime(pitch * 1.25, now + 0.07);
          mod.frequency.setValueAtTime(pitch * 2, now);
          mg.gain.setValueAtTime(pitch * 1.8, now);
          mg.gain.exponentialRampToValueAtTime(10, now + 0.07);
          mod.connect(mg);
          mg.connect(osc.frequency);
          connectCrushed(osc, 0.24, 0.085);
          mod.start(now);
          osc.start(now);
          mod.stop(now + 0.09);
          osc.stop(now + 0.09);
          break;
        }
        case 'armor': {
          const osc = ctx.createOscillator();
          const mod = ctx.createOscillator();
          const mg = ctx.createGain();
          osc.type = 'triangle';
          mod.type = 'square';
          osc.frequency.setValueAtTime(520, now);
          mod.frequency.setValueAtTime(520 * 2.73, now);
          mg.gain.setValueAtTime(980, now);
          mg.gain.exponentialRampToValueAtTime(20, now + 0.09);
          mod.connect(mg);
          mg.connect(osc.frequency);
          connectCrushed(osc, 0.25, 0.1);
          mod.start(now);
          osc.start(now);
          mod.stop(now + 0.11);
          osc.stop(now + 0.11);
          break;
        }
        case 'steel': {
          const osc = ctx.createOscillator();
          osc.type = 'square';
          osc.frequency.setValueAtTime(1180, now);
          osc.frequency.exponentialRampToValueAtTime(740, now + 0.045);
          connectCrushed(osc, 0.16, 0.05);
          osc.start(now);
          osc.stop(now + 0.055);
          break;
        }
        case 'grog': {
          if (this.noiseBuffer) {
            const src = ctx.createBufferSource();
            src.buffer = this.noiseBuffer;
            const lp = ctx.createBiquadFilter();
            lp.type = 'bandpass';
            lp.frequency.setValueAtTime(620, now);
            lp.frequency.exponentialRampToValueAtTime(110, now + 0.34);
            lp.Q.value = 1.8;
            src.connect(lp);
            connectCrushed(lp, 0.38, 0.36);
            src.start(now, 0, 0.38);
          }
          const boom = ctx.createOscillator();
          boom.type = 'sawtooth';
          boom.frequency.setValueAtTime(160, now);
          boom.frequency.exponentialRampToValueAtTime(34, now + 0.32);
          connectCrushed(boom, 0.30, 0.34);
          boom.start(now);
          boom.stop(now + 0.35);
          break;
        }
        case 'laser': {
          const osc = ctx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(1180, now);
          osc.frequency.exponentialRampToValueAtTime(175, now + 0.095);
          connectCrushed(osc, 0.20, 0.10);
          osc.start(now);
          osc.stop(now + 0.105);
          break;
        }
        case 'powerup': {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((hz, i) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'square';
            const t0 = now + i * 0.045;
            osc.frequency.setValueAtTime(hz, t0);
            g.gain.setValueAtTime(0.18, t0);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
            osc.connect(g);
            g.connect(this.sfxBus);
            osc.start(t0);
            osc.stop(t0 + 0.095);
          });
          break;
        }
        case 'special': {
          const notes = [587.33, 698.46, 880.0, 1174.66];
          notes.forEach((hz, i) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'triangle';
            const t0 = now + i * 0.055;
            osc.frequency.setValueAtTime(hz, t0);
            g.gain.setValueAtTime(0.22, t0);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
            osc.connect(g);
            g.connect(this.sfxBus);
            osc.start(t0);
            osc.stop(t0 + 0.15);
          });
          break;
        }
        case 'warp': {
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(980, now + 0.11);
          osc.frequency.exponentialRampToValueAtTime(420, now + 0.2);
          connectCrushed(osc, 0.22, 0.21);
          osc.start(now);
          osc.stop(now + 0.22);
          break;
        }
        case 'lose': {
          const steps = [392, 369.99, 349.23, 311.13];
          steps.forEach((hz, i) => {
            const osc = ctx.createOscillator();
            osc.type = 'sawtooth';
            const g = ctx.createGain();
            const t0 = now + i * 0.13;
            osc.frequency.setValueAtTime(hz, t0);
            osc.frequency.linearRampToValueAtTime(hz * 0.92, t0 + 0.12);
            g.gain.setValueAtTime(0.22, t0);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.13);
            osc.connect(g);
            g.connect(this.sfxBus);
            osc.start(t0);
            osc.stop(t0 + 0.14);
          });
          break;
        }
        case 'clear': {
          const fanfare = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
          const times = [0, 0.08, 0.16, 0.24, 0.36, 0.46];
          fanfare.forEach((hz, i) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'square';
            const t0 = now + times[i];
            osc.frequency.setValueAtTime(hz, t0);
            g.gain.setValueAtTime(0.20, t0);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
            osc.connect(g);
            g.connect(this.sfxBus);
            osc.start(t0);
            osc.stop(t0 + 0.17);
          });
          break;
        }
      }
    }
  }

  /* =========================================================================
   * Geometry & Deterministic Sub-Stepped Circle-vs-AABB Collision Solver
   * ========================================================================= */
  function clamp(v, lo, hi) {
    return v < lo ? lo : (v > hi ? hi : v);
  }

  /**
   * Resolves circle (ball) vs axis-aligned rectangle (brick) penetration and
   * corner/edge velocity reflection without tunneling or seam double-flips.
   *
   * @param {object} ball - { x, y, vx, vy, r }
   * @param {object} rect - { x, y, w, h }
   * @return {object|null} Contact descriptor { nx, ny, pen } if intersecting.
   */
  function testCircleAABB(ball, rect) {
    const px = clamp(ball.x, rect.x, rect.x + rect.w);
    const py = clamp(ball.y, rect.y, rect.y + rect.h);
    const dx = ball.x - px;
    const dy = ball.y - py;
    const distSq = dx * dx + dy * dy;
    if (distSq >= ball.r * ball.r) {
      return null;
    }

    if (distSq > 1e-6) {
      const dist = Math.sqrt(distSq);
      return {
        nx: dx / dist,
        ny: dy / dist,
        pen: ball.r - dist
      };
    }

    /* Circle center inside AABB: push out along minimum face overlap */
    const leftPen = (ball.x - rect.x) + ball.r;
    const rightPen = (rect.x + rect.w - ball.x) + ball.r;
    const topPen = (ball.y - rect.y) + ball.r;
    const botPen = (rect.y + rect.h - ball.y) + ball.r;
    const minPen = Math.min(leftPen, rightPen, topPen, botPen);
    if (minPen === leftPen) return { nx: -1, ny: 0, pen: leftPen };
    if (minPen === rightPen) return { nx: 1, ny: 0, pen: rightPen };
    if (minPen === topPen) return { nx: 0, ny: -1, pen: topPen };
    return { nx: 0, ny: 1, pen: botPen };
  }

  function applyContactBounce(ball, contact) {
    ball.x += contact.nx * (contact.pen + 0.02);
    ball.y += contact.ny * (contact.pen + 0.02);

    const speed = Math.hypot(ball.vx, ball.vy) || 1;
    const dot = ball.vx * contact.nx + ball.vy * contact.ny;
    if (dot < 0) {
      ball.vx -= 2 * dot * contact.nx;
      ball.vy -= 2 * dot * contact.ny;
    }

    /* Prevent near-horizontal infinite wall-to-wall lock */
    const minVy = speed * 0.25;
    if (Math.abs(ball.vy) < minVy) {
      const signY = ball.vy >= 0 ? 1 : -1;
      const signX = ball.vx >= 0 ? 1 : -1;
      ball.vy = signY * minVy;
      ball.vx = signX * Math.sqrt(Math.max(0.01, speed * speed - ball.vy * ball.vy));
    } else {
      const cur = Math.hypot(ball.vx, ball.vy) || 1;
      ball.vx = (ball.vx / cur) * speed;
      ball.vy = (ball.vy / cur) * speed;
    }
  }

  const HIGHSCORE_KEY = 'scummanoid_ega_highscore_v1';

  function loadHighScore() {
    try {
      const raw = localStorage.getItem(HIGHSCORE_KEY);
      if (raw === null) return 10000;
      const parsed = Number(raw);
      if (Number.isSafeInteger(parsed) && parsed >= 0 && parsed <= 99999999) {
        return parsed;
      }
    } catch (_) {
      /* Storage blocked in strict sandbox; fallback cleanly */
    }
    return 10000;
  }

  function saveHighScore(score) {
    const clean = Math.max(0, Math.min(99999999, Math.floor(score)));
    try {
      localStorage.setItem(HIGHSCORE_KEY, String(clean));
    } catch (_) {
      /* Ignore sandbox quota/permission restrictions */
    }
  }

    buildStars() {
      this.stars = [];
      for (let i = 0; i < 42; i++) {
        this.stars.push({
          x: (i * 73 + 19) % 296 + 12,
          y: (i * 41 + 11) % 168 + 20,
          depth: (i % 3) + 1,
          twinkle: i * 0.7
        });
      }
    }

    unlockAndSyncAudio() {
      const ok = this.audio.unlock();
      if (ok && this.ui.led) {
        this.ui.led.classList.toggle('is-online', !this.audio.muted);
        this.ui.ledText.textContent = this.audio.muted ? 'OPL2 MUTED' : 'OPL2 ACTIVE';
      }
    }

    startNewGame(startLvl) {
      this.unlockAndSyncAudio();
      this.score = 0;
      this.lives = 3;
      this.paused = false;
      this.loadLevel(startLvl, true);
      this.state = 'PLAYING';
      this.updateCabinetStatus();
    }

    loadLevel(idx, startAudio) {
      this.levelIndex = clamp(idx, 0, LEVELS.length - 1);
      this.selectedLevel = this.levelIndex;
      const spec = LEVELS[this.levelIndex];
      const theme = WORLD_THEMES[spec.world];

      this.bricks = [];
      for (let r = 0; r < spec.grid.length; r++) {
        const rowStr = spec.grid[r];
        for (let c = 0; c < rowStr.length; c++) {
          const ch = rowStr[c];
          if (ch === '.') continue;
          let type = 'normal';
          let hp = 1;
          let maxHp = 1;
          let color = theme.bricks[0];
          let shade = theme.shades[0];

          if (ch >= '1' && ch <= '6') {
            const ci = Number(ch) - 1;
            color = theme.bricks[ci];
            shade = theme.shades[ci];
          } else if (ch === 'A') {
            type = 'armor'; hp = 2; maxHp = 2;
            color = C.LGRAY; shade = C.DGRAY;
          } else if (ch === 'B') {
            type = 'armor'; hp = 3; maxHp = 3;
            color = C.GOLD; shade = C.BROWN;
          } else if (ch === 'X') {
            type = 'steel'; hp = 999; maxHp = 999;
            color = C.SLATE; shade = C.DGRAY;
          } else if (ch === 'G') {
            type = 'grog'; hp = 1; maxHp = 1;
            color = C.BGREEN; shade = C.GREEN;
          }

          this.bricks.push({
            col: c,
            row: r,
            x: ARENA.GRID_X + c * ARENA.BRICK_W,
            y: ARENA.GRID_Y + r * ARENA.BRICK_H,
            w: ARENA.BRICK_W - 1,
            h: ARENA.BRICK_H - 1,
            type,
            hp,
            maxHp,
            color,
            shade,
            flash: 0,
            alive: true
          });
        }
      }

      this.powerups = [];
      this.lasers = [];
      this.particles = [];
      this.hazards = [];
      this.combo = 0;
      this.portalCooldown = 0;
      this.dartTimer = 2.8;
