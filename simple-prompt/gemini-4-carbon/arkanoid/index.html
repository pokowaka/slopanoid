          flash: 0
        };
      } else {
        this.boss = null;
      }

      this.resetPaddleAndBall(true);
      this.showBanner(`LVL ${String(this.levelIndex + 1).padStart(2, '0')}: ${spec.name}`, C.BYELLOW, 2.8);

      if (startAudio) {
        this.audio.startMusic(spec.world, this.levelIndex);
      }
      this.updateCabinetStatus();
    }

    resetPaddleAndBall(resetPowers) {
      if (resetPowers) {
        this.paddle.laser = false;
        this.paddle.catchMode = false;
        this.paddle.expanded = false;
      }
      this.paddle.shrinkTimer = 0;
      this.syncPaddleWidth();
      this.paddle.x = clamp(160 - this.paddle.w / 2, ARENA.LEFT + 2, ARENA.RIGHT - this.paddle.w - 2);

      const baseSpd = 118 + Math.min(36, this.levelIndex * 1.1);
      this.ball.baseSpeed = baseSpd;
      this.ball.slowFactor = 1.0;
      this.ball.stuck = true;
      this.ball.stuckOffset = 0;
      this.ball.stuckTimer = 0;
      this.ball.x = this.paddle.x + this.paddle.w / 2;
      this.ball.y = this.paddle.y - this.ball.r - 0.5;
      this.ball.vx = baseSpd * 0.52;
      this.ball.vy = -baseSpd * 0.85;
    }

    syncPaddleWidth() {
      let w = this.paddle.expanded ? 56 : 38;
      if (this.paddle.shrinkTimer > 0) {
        w = Math.max(24, w - 12);
      }
      this.paddle.w = w;
      this.paddle.x = clamp(this.paddle.x, ARENA.LEFT + 1, ARENA.RIGHT - this.paddle.w - 1);
    }

    showBanner(text, color, duration) {
      this.bannerText = text;
      this.bannerColor = color || C.BYELLOW;
      this.bannerTimer = duration || 2.2;
    }

    addScore(pts) {
      this.score += pts;
      if (this.score > this.highScore) {
        this.highScore = this.score;
        saveHighScore(this.highScore);
      }
    }

    launchOrFire() {
      this.unlockAndSyncAudio();

      if (this.state === 'MENU') {
        this.startNewGame(this.selectedLevel);
        return;
      }
      if (this.state === 'LEVEL_CLEAR') {
        if (this.levelIndex + 1 < LEVELS.length) {
          this.loadLevel(this.levelIndex + 1, true);
          this.state = 'PLAYING';
        } else {
          this.enterVictory();
        }
        return;
      }
      if (this.state === 'GAME_OVER' || this.state === 'VICTORY') {
        this.state = 'MENU';
        this.audio.stopMusic();
        this.updateCabinetStatus();
        return;
      }
      if (this.paused) return;

      if (this.ball.stuck) {
        this.ball.stuck = false;
        const speed = this.ball.baseSpeed * this.ball.slowFactor;
        const rel = clamp(this.ball.stuckOffset / (this.paddle.w * 0.5), -0.8, 0.8);
        const angle = rel * 0.95 + (rel === 0 ? 0.28 : 0);
        this.ball.vx = Math.sin(angle) * speed;
        this.ball.vy = -Math.cos(angle) * speed;
        this.audio.playSFX('paddle', 1);
        return;
      }

      if (this.paddle.laser && this.paddle.laserCooldown <= 0) {
        this.paddle.laserCooldown = 0.22;
        this.lasers.push(
          { x: this.paddle.x + 3, y: this.paddle.y - 4, vy: -220, alive: true },
          { x: this.paddle.x + this.paddle.w - 4, y: this.paddle.y - 4, vy: -220, alive: true }
        );
        this.audio.playSFX('laser');
      }
    }

    enterVictory() {
      this.state = 'VICTORY';
      this.audio.stopMusic();
      this.audio.playSFX('clear');
      this.fireworks = [];
      this.updateCabinetStatus();
    }

    updateCabinetStatus() {
      if (!this.ui.status) return;
      const spec = LEVELS[this.levelIndex];
      const worldTheme = WORLD_THEMES[spec.world];
      if (this.state === 'MENU') {
        this.ui.status.textContent = `SELECT START LEVEL [${this.selectedLevel + 1}/33]: ${LEVELS[this.selectedLevel].name}`;
      } else if (this.state === 'PLAYING') {
        this.ui.status.textContent = `${worldTheme.title} (${this.levelIndex + 1}/33) - ${worldTheme.mechanicLabel}`;
      } else if (this.state === 'LEVEL_CLEAR') {
        this.ui.status.textContent = `STAGE ${this.levelIndex + 1} CLEARED! PRESS SPACE OR CLICK TO CONTINUE`;
      } else if (this.state === 'VICTORY') {
        this.ui.status.textContent = `LECHUCK DEFEATED! FINAL SCORE: ${this.score}`;
      } else {
        this.ui.status.textContent = `GAME OVER - PRESS SPACE OR CLICK FOR MAIN MENU`;
      }
    }

    spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const ang = (Math.PI * 2 * i) / count + Math.random() * 0.5;
        const spd = 22 + Math.random() * 68;
        this.particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 0.28 + Math.random() * 0.28,
          color
        });
      }
    }

    maybeSpawnPowerup(x, y, forceDrop) {
      if (!forceDrop && Math.random() > 0.21) return;
      const pool = ['L', 'E', 'C', 'S', 'L', 'E', 'C', 'S', 'P'];
      const kind = pool[Math.floor(Math.random() * pool.length)];
      this.powerups.push({ x: clamp(x - 5, ARENA.LEFT + 4, ARENA.RIGHT - 16), y, w: 11, h: 7, vy: 42, kind, alive: true });
    }

    applyPowerup(kind) {
      this.audio.playSFX('powerup');
      this.addScore(250);
      switch (kind) {
        case 'L':
          this.paddle.laser = true;
          this.showBanner('SPACE-RANGER BLASTERS ARMED! [SPACE/CLICK]', C.BRED, 2.0);
          break;
        case 'E':
          this.paddle.expanded = true;
          this.syncPaddleWidth();
          this.showBanner('RUBBER CHICKEN PULLEY EXPANSION!', C.BYELLOW, 2.0);
          break;
        case 'C':
          this.paddle.catchMode = true;
          this.showBanner('MAGNETIC COMPASS CATCH ENGAGED!', C.BCYAN, 2.0);
          break;
        case 'S':
          this.ball.slowFactor = 0.72;
          this.rescaleBallSpeed();
          this.showBanner('SANDS OF TIME: BALL DECELERATED!', C.BGREEN, 2.0);
          break;
        case 'P':
          this.lives = Math.min(9, this.lives + 1);
          this.showBanner('LUCASARTS GOLD GUY: +1 EXTRA LIFE!', C.GOLD, 2.2);
          break;
      }
    }

    rescaleBallSpeed() {
      if (this.ball.stuck) return;
      const target = this.ball.baseSpeed * this.ball.slowFactor;
      const cur = Math.hypot(this.ball.vx, this.ball.vy) || 1;
      this.ball.vx = (this.ball.vx / cur) * target;
      this.ball.vy = (this.ball.vy / cur) * target;
    }

    /* Damages a brick and triggers recursive 3x3 Scumm Bar Grog chain explosions! */
    damageBrick(brick, amount, silent) {
      if (!brick.alive || brick.type === 'steel') {
        brick.flash = 0.12;
        if (!silent) this.audio.playSFX('steel');
        return;
      }

      brick.hp -= amount;
      brick.flash = 0.12;

      if (brick.hp > 0) {
        if (!silent) this.audio.playSFX('armor');
        this.addScore(35);
        this.spawnParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, C.WHITE, 4);
        return;
      }

      brick.alive = false;
      this.combo++;
      const cx = brick.x + brick.w / 2;
      const cy = brick.y + brick.h / 2;
      this.addScore(brick.type === 'grog' ? 150 : (brick.maxHp * 60 + Math.min(100, this.combo * 10)));
      this.spawnParticles(cx, cy, brick.color, brick.type === 'grog' ? 14 : 7);
      this.maybeSpawnPowerup(cx, cy, false);

      /* World 4 (LOOM) Musical Draft 4-Note Spell-Weaving */
      if (LEVELS[this.levelIndex].world === 4) {
        this.advanceLoomDraft();
      }

      if (brick.type === 'grog') {
        if (!silent) this.audio.playSFX('grog');
        this.triggerGrogExplosion(brick);
      } else if (!silent) {
        this.audio.playSFX('brick', this.combo);
      }
    }

    triggerGrogExplosion(originBrick) {
      const queue = [originBrick];
      const visited = new Set([originBrick]);
      while (queue.length > 0) {
        const src = queue.shift();
        const sx = src.x + src.w / 2;
        const sy = src.y + src.h / 2;
        this.spawnParticles(sx, sy, C.BGREEN, 10);
        for (let i = 0; i < this.bricks.length; i++) {
          const nb = this.bricks[i];
          if (!nb.alive || nb.type === 'steel' || visited.has(nb)) continue;
          if (Math.abs(nb.col - src.col) <= 1 && Math.abs(nb.row - src.row) <= 1) {
            if (nb.type === 'grog') {
              visited.add(nb);
              nb.alive = false;
              this.addScore(180);
              queue.push(nb);
            } else {
              this.damageBrick(nb, 3, true);
            }
          }
        }
      }
    }

    advanceLoomDraft() {
      const noteIdx = (this.combo + this.levelIndex) % LOOM_NOTES.length;
      this.loomNotes.push(LOOM_NOTES[noteIdx]);
      if (this.loomNotes.length >= 4) {
        const spellStr = this.loomNotes.join('-');
        this.loomNotes = [];
        this.audio.playSFX('special');
        this.addScore(500);
        let crackedAny = false;
        for (let i = 0; i < this.bricks.length; i++) {
          const b = this.bricks[i];
          if (b.alive && b.type === 'armor' && b.hp > 1) {
            b.hp -= 1;
            b.flash = 0.25;
            crackedAny = true;
          }
        }
        if (crackedAny) {
          this.showBanner(`DRAFT ${spellStr}: OPENING CRACKS ARMOR! +500`, C.ICE, 2.2);
        } else {
          this.maybeSpawnPowerup(this.ball.x, this.ball.y, true);
          this.showBanner(`DRAFT ${spellStr}: TRANSCENDENCE GIFT! +500`, C.BMAGENTA, 2.2);
        }
      }
    }

    countRemainingTargets() {
      let count = 0;
      for (let i = 0; i < this.bricks.length; i++) {
        const b = this.bricks[i];
        if (b.alive && b.type !== 'steel') count++;
      }
      if (this.boss && this.boss.hp > 0) count += this.boss.hp;
      return count;
    }

    update(dt) {
      this.clock += dt;
      if (this.bannerTimer > 0) {
        this.bannerTimer = Math.max(0, this.bannerTimer - dt);
      }

      if (this.state === 'VICTORY') {
        this.updateVictoryFireworks(dt);
        return;
      }
      if (this.state !== 'PLAYING' || this.paused) {
        return;
      }

      /* Update Paddle Timers & Steering */
      if (this.paddle.laserCooldown > 0) this.paddle.laserCooldown -= dt;
      if (this.paddle.shrinkTimer > 0) {
        this.paddle.shrinkTimer -= dt;
        if (this.paddle.shrinkTimer <= 0) this.syncPaddleWidth();
      }

      const moveSpeed = 215;
      if (this.keys.left) {
        this.paddle.x -= moveSpeed * dt;
        this.useMouse = false;
      }
      if (this.keys.right) {
        this.paddle.x += moveSpeed * dt;
        this.useMouse = false;
      }
      if (this.useMouse) {
        const targetX = this.mouseX - this.paddle.w / 2;
        this.paddle.x += (targetX - this.paddle.x) * Math.min(1, dt * 24);
      }
      this.paddle.x = clamp(this.paddle.x, ARENA.LEFT + 1, ARENA.RIGHT - this.paddle.w - 1);

      /* Gradually restore slow-ball speed back toward 1.0 */
      if (this.ball.slowFactor < 1.0 && !this.ball.stuck) {
        this.ball.slowFactor = Math.min(1.0, this.ball.slowFactor + dt * 0.022);
        this.rescaleBallSpeed();
      }

      /* Update Brick Flash */
      for (let i = 0; i < this.bricks.length; i++) {
        if (this.bricks[i].flash > 0) this.bricks[i].flash = Math.max(0, this.bricks[i].flash - dt);
      }

      /* Update World-Specific Mechanics */
      this.updateWorldMechanics(dt);

      /* Update Ball (Sub-Stepped for Tunnel-Free Corner Accuracy) */
      if (this.ball.stuck) {
        this.ball.x = clamp(
          this.paddle.x + this.paddle.w / 2 + this.ball.stuckOffset,
          this.paddle.x + 2,
          this.paddle.x + this.paddle.w - 2
        );
        this.ball.y = this.paddle.y - this.ball.r - 0.4;
        this.ball.stuckTimer += dt;
        if (this.paddle.catchMode && this.ball.stuckTimer > 5.5) {
          this.launchOrFire();
        }
      } else {
        const totalMove = Math.hypot(this.ball.vx * dt, this.ball.vy * dt);
        const steps = Math.max(1, Math.ceil(totalMove / 1.4));
        const subDt = dt / steps;
        for (let s = 0; s < steps; s++) {
          if (!this.stepBallPhysics(subDt)) break;
        }
      }

      /* Update Space-Ranger Lasers */
      for (let i = this.lasers.length - 1; i >= 0; i--) {
        const lz = this.lasers[i];
        lz.y += lz.vy * dt;
        if (lz.y < ARENA.TOP) {
          this.lasers.splice(i, 1);
          continue;
        }
        /* Check Boss Hit */
        if (this.boss && this.boss.hp > 0 &&
            lz.x >= this.boss.x && lz.x <= this.boss.x + this.boss.w &&
            lz.y >= this.boss.y && lz.y <= this.boss.y + this.boss.h) {
          this.damageBoss(1);
          this.lasers.splice(i, 1);
          continue;
        }
        /* Check Sword Parry Hit */
        if (this.swordTarget && this.swordTarget.active &&
            Math.abs(lz.x - this.swordTarget.x) < 9 && Math.abs(lz.y - this.swordTarget.y) < 6) {
          this.triggerInsultParry();
          this.lasers.splice(i, 1);
          continue;
        }
        /* Check Brick Hit */
        for (let bIdx = 0; bIdx < this.bricks.length; bIdx++) {
          const b = this.bricks[bIdx];
          if (b.alive && lz.x >= b.x && lz.x <= b.x + b.w && lz.y >= b.y && lz.y <= b.y + b.h) {
            this.damageBrick(b, 1, false);
            this.lasers.splice(i, 1);
            break;
          }
        }
      }

      /* Update Falling Power-ups */
      for (let i = this.powerups.length - 1; i >= 0; i--) {
        const p = this.powerups[i];
        p.y += p.vy * dt;
        if (p.y > ARENA.BOTTOM) {
          this.powerups.splice(i, 1);
          continue;
        }
        if (p.x + p.w >= this.paddle.x && p.x <= this.paddle.x + this.paddle.w &&
            p.y + p.h >= this.paddle.y && p.y <= this.paddle.y + this.paddle.h + 3) {
          this.applyPowerup(p.kind);
          this.powerups.splice(i, 1);
        }
      }

      /* Update Particles */
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const pt = this.particles[i];
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.life -= dt;
        if (pt.life <= 0) this.particles.splice(i, 1);
      }

      /* Check Level Completion */
      if (this.countRemainingTargets() === 0) {
        this.addScore(500 + this.lives * 100);
        if (this.levelIndex === LEVELS.length - 1) {
          this.enterVictory();
        } else {
          this.state = 'LEVEL_CLEAR';
          this.audio.playSFX('clear');
          this.updateCabinetStatus();
        }
      }
    }

    stepBallPhysics(subDt) {
      const ball = this.ball;
      ball.x += ball.vx * subDt;
      ball.y += ball.vy * subDt;

      /* Arena Walls */
      if (ball.x - ball.r < ARENA.LEFT) {
        ball.x = ARENA.LEFT + ball.r;
        ball.vx = Math.abs(ball.vx);
        this.audio.playSFX('wall');
      } else if (ball.x + ball.r > ARENA.RIGHT) {
        ball.x = ARENA.RIGHT - ball.r;
        ball.vx = -Math.abs(ball.vx);
        this.audio.playSFX('wall');
      }
      if (ball.y - ball.r < ARENA.TOP) {
        ball.y = ARENA.TOP + ball.r;
        ball.vy = Math.abs(ball.vy);
        this.audio.playSFX('wall');
      }

      /* Bottom Pit Loss */
      if (ball.y - ball.r > ARENA.BOTTOM) {
        this.handleBallLost();
        return false;
      }

      /* Paddle Bounce / Magnetic Catch */
      if (ball.vy > 0) {
        const padRect = { x: this.paddle.x, y: this.paddle.y, w: this.paddle.w, h: this.paddle.h };
        const pContact = testCircleAABB(ball, padRect);
        if (pContact) {
          this.combo = 0;
          const hitOffset = clamp(ball.x - (this.paddle.x + this.paddle.w / 2), -this.paddle.w / 2, this.paddle.w / 2);
          if (this.paddle.catchMode) {
            ball.stuck = true;
            ball.stuckOffset = hitOffset;
            ball.stuckTimer = 0;
            ball.y = this.paddle.y - ball.r - 0.4;
            this.audio.playSFX('paddle', 0);
            return false;
          }
          const normOffset = hitOffset / (this.paddle.w / 2);
          const maxBounceAngle = 1.12;
          const bounceAngle = normOffset * maxBounceAngle;
          const speed = ball.baseSpeed * ball.slowFactor;
          ball.vx = Math.sin(bounceAngle) * speed;
          ball.vy = -Math.cos(bounceAngle) * speed;
          ball.y = this.paddle.y - ball.r - 0.05;
          this.audio.playSFX('paddle', Math.abs(normOffset));
          return true;
        }
      }

      /* Moving Boss LeChuck Collision (Level 33) */
      if (this.boss && this.boss.hp > 0) {
        const bContact = testCircleAABB(ball, this.boss);
        if (bContact) {
          applyContactBounce(ball, bContact);
          this.damageBoss(2);
        }
      }

      /* Deepest-Penetration Brick Contact Resolution (Prevents Two-Brick Seam Bugs) */
      let bestBrick = null;
      let bestContact = null;
      for (let i = 0; i < this.bricks.length; i++) {
        const b = this.bricks[i];
        if (!b.alive) continue;
        const c = testCircleAABB(ball, b);
        if (c && (!bestContact || c.pen > bestContact.pen)) {
          bestContact = c;
          bestBrick = b;
        }
      }

      if (bestBrick && bestContact) {
        applyContactBounce(ball, bestContact);
        this.damageBrick(bestBrick, 1, false);
      }

      return true;
    }

    handleBallLost() {
      this.lives -= 1;
      this.audio.playSFX('lose');
      if (this.lives <= 0) {
        this.state = 'GAME_OVER';
        this.audio.stopMusic();
        this.updateCabinetStatus();
      } else {
        this.resetPaddleAndBall(true);
      }
    }

    damageBoss(amt) {
      if (!this.boss || this.boss.hp <= 0) return;
      this.boss.hp = Math.max(0, this.boss.hp - amt);
      this.boss.flash = 0.16;
      this.addScore(120 * amt);
      this.spawnParticles(this.boss.x + this.boss.w / 2, this.boss.y + this.boss.h / 2, C.BGREEN, 9);
      if (this.boss.hp === 0) {
        this.audio.playSFX('grog');
        this.spawnParticles(this.boss.x + 18, this.boss.y + 10, C.BYELLOW, 28);
        this.showBanner('ROOT BEER OVERLOAD! LECHUCK VAPORIZED!', C.BGREEN, 3.0);
      } else {
        this.audio.playSFX('armor');
      }
    }

    triggerInsultParry() {
      if (!this.swordTarget || !this.swordTarget.active) return;
      const pair = INSULT_PAIRS[this.swordTarget.pairIdx];
      this.swordTarget.active = false;
      this.swordTarget.cooldown = 6.5;
      this.swordTarget.pairIdx = (this.swordTarget.pairIdx + 1) % INSULT_PAIRS.length;
      this.addScore(500);
      this.audio.playSFX('special');
      this.spawnParticles(this.swordTarget.x, this.swordTarget.y, C.GOLD, 12);
      this.showBanner(pair[1], C.BGREEN, 2.8);
    }

    updateWorldMechanics(dt) {
      const world = LEVELS[this.levelIndex].world;

      /* World 0: Insult Sword-Fighting Cutlass Parry */
      if (world === 0 && this.swordTarget) {
        const st = this.swordTarget;
        if (st.active) {
          st.x += st.vx * dt;
          if (st.x < 34 || st.x > 286) st.vx = -st.vx;
          if (!this.ball.stuck && Math.hypot(this.ball.x - st.x, this.ball.y - st.y) < 8.5) {
            this.ball.vy = -Math.abs(this.ball.vy);
            this.triggerInsultParry();
          }
        } else {
          st.cooldown -= dt;
          if (st.cooldown <= 0) {
            st.active = true;
            this.showBanner(INSULT_PAIRS[st.pairIdx][0], C.CORAL, 2.5);
          }
        }
      }

      /* World 1: Day of the Tentacle Chron-o-John Twin Portals */
      if (world === 1) {
        if (this.portalCooldown > 0) this.portalCooldown -= dt;
        const leftPortal = { x: 30, y: 126 };
        const rightPortal = { x: 290, y: 126 };
        if (!this.ball.stuck && this.portalCooldown <= 0) {
          if (Math.hypot(this.ball.x - leftPortal.x, this.ball.y - leftPortal.y) < 8) {
            this.ball.x = rightPortal.x - 9;
            this.ball.y = rightPortal.y;
            this.portalCooldown = 0.85;
            this.audio.playSFX('warp');
            this.spawnParticles(leftPortal.x, leftPortal.y, C.BCYAN, 8);
            this.spawnParticles(rightPortal.x, rightPortal.y, C.BMAGENTA, 8);
          } else if (Math.hypot(this.ball.x - rightPortal.x, this.ball.y - rightPortal.y) < 8) {
            this.ball.x = leftPortal.x + 9;
            this.ball.y = leftPortal.y;
            this.portalCooldown = 0.85;
            this.audio.playSFX('warp');
            this.spawnParticles(rightPortal.x, rightPortal.y, C.BMAGENTA, 8);
            this.spawnParticles(leftPortal.x, leftPortal.y, C.BCYAN, 8);
          }
        }
      }

      /* World 2: Fate of Atlantis Ancient Poison Dart Traps */
      if (world === 2) {
        this.dartTimer -= dt;
        if (this.dartTimer < 0.9 && this.dartTelegraphSide === 0) {
          this.dartTelegraphSide = (Math.random() < 0.5) ? -1 : 1;
        }
        if (this.dartTimer <= 0) {
          const fromLeft = this.dartTelegraphSide <= 0;
          this.hazards.push({
            kind: 'dart',
            x: fromLeft ? ARENA.LEFT + 2 : ARENA.RIGHT - 10,
            y: 138 + ((Math.floor(this.clock * 10) % 3) * 12),
            vx: fromLeft ? 78 : -78,
            vy: 28,
            w: 8,
            h: 3
          });
          this.dartTelegraphSide = 0;
          this.dartTimer = 3.4;
        }
      }

      /* World 3: Space Combat Subspace Gravity Well */
      if (world === 3) {
        this.gravityWell.phase += dt * 2.4;
        this.gravityWell.x = 160 + Math.sin(this.gravityWell.phase * 0.6) * 52;
        if (!this.ball.stuck) {
          const dx = this.gravityWell.x - this.ball.x;
          const dy = this.gravityWell.y - this.ball.y;
          const dist = Math.max(18, Math.hypot(dx, dy));
          if (dist < 76) {
            const pull = (1650 / (dist * dist)) * dt * 60;
            this.ball.vx += (dx / dist) * pull;
            this.ball.vy += (dy / dist) * pull;
            this.rescaleBallSpeed();
          }
        }
      }

      /* World 5: Sam & Max Highway Wak-A-Rat Patrol */
      if (world === 5) {
        const rat = this.wakRat;
        if (rat.stun > 0) {
          rat.stun -= dt;
        } else {
          rat.x += rat.vx * dt;
          if (rat.x < 28 || rat.x > 282) rat.vx = -rat.vx;
          if (!this.ball.stuck && Math.hypot(this.ball.x - rat.x, this.ball.y - rat.y) < 9) {
            rat.stun = 3.0;
            this.ball.vy = -Math.abs(this.ball.vy);
            this.addScore(600);
            this.audio.playSFX('special');
            this.maybeSpawnPowerup(rat.x, rat.y, true);
            this.showBanner('FREELANCE POLICE WAK-A-RAT BOUNTY! +600', C.BYELLOW, 2.0);
          }
        }
      }

      /* World 6 (Level 33): Moving Ghost Pirate LeChuck Boss & Voodoo Projectiles */
      if (world === 6 && this.boss && this.boss.hp > 0) {
        const b = this.boss;
        if (b.flash > 0) b.flash = Math.max(0, b.flash - dt);
        const rage = 1 + (1 - b.hp / b.maxHp) * 0.65;
        b.x += b.vx * rage * dt;
        if (b.x < ARENA.LEFT + 10) { b.x = ARENA.LEFT + 10; b.vx = Math.abs(b.vx); }
        if (b.x + b.w > ARENA.RIGHT - 10) { b.x = ARENA.RIGHT - 10 - b.w; b.vx = -Math.abs(b.vx); }

        b.fireTimer -= dt * rage;
        if (b.fireTimer <= 0) {
          b.fireTimer = 1.75;
          this.hazards.push({
            kind: 'voodoo',
            x: b.x + b.w / 2 - 3,
            y: b.y + b.h,
            vx: clamp((this.paddle.x + this.paddle.w / 2 - (b.x + b.w / 2)) * 0.25, -34, 34),
            vy: 74,
            w: 6,
            h: 6
          });
          this.audio.playSFX('laser');
        }
      }

      /* Update Active Hazards (Atlantean Darts & LeChuck Voodoo Skulls) */
      for (let i = this.hazards.length - 1; i >= 0; i--) {
        const hz = this.hazards[i];
        hz.x += hz.vx * dt;
        hz.y += hz.vy * dt;
        if (hz.x < ARENA.LEFT || hz.x > ARENA.RIGHT || hz.y > ARENA.BOTTOM) {
          this.hazards.splice(i, 1);
          continue;
        }
        /* Ball shatters hazard in mid-air */
        if (!this.ball.stuck &&
            this.ball.x + this.ball.r >= hz.x && this.ball.x - this.ball.r <= hz.x + hz.w &&
            this.ball.y + this.ball.r >= hz.y && this.ball.y - this.ball.r <= hz.y + hz.h) {
          this.spawnParticles(hz.x + 3, hz.y + 2, C.GOLD, 7);
          this.addScore(150);
          this.audio.playSFX('brick', 3);
          this.hazards.splice(i, 1);
          continue;
        }
        /* Hazard strikes paddle */
        if (hz.x + hz.w >= this.paddle.x && hz.x <= this.paddle.x + this.paddle.w &&
            hz.y + hz.h >= this.paddle.y && hz.y <= this.paddle.y + this.paddle.h + 2) {
          this.hazards.splice(i, 1);
          this.spawnParticles(this.paddle.x + this.paddle.w / 2, this.paddle.y, C.BRED, 10);
          if (hz.kind === 'voodoo') {
            if (this.paddle.expanded || this.paddle.laser) {
              this.paddle.expanded = false;
              this.paddle.laser = false;
              this.paddle.shrinkTimer = 5.0;
              this.syncPaddleWidth();
              this.audio.playSFX('armor');
              this.showBanner('VOODOO BLAST CURSED YOUR PADDLE!', C.BRED, 2.0);
            } else {
              this.handleBallLost();
              return;
            }
          } else {
            this.paddle.shrinkTimer = 6.0;
            this.paddle.laser = false;
            this.syncPaddleWidth();
            this.audio.playSFX('armor');
            this.showBanner('POISON DART! PADDLE SHRUNK!', C.ORANGE, 1.8);
          }
        }
      }
    }

    updateVictoryFireworks(dt) {
      if (Math.random() < dt * 3.5) {
        const fx = 40 + Math.random() * 240;
        const fy = 36 + Math.random() * 75;
        const colors = [C.BYELLOW, C.BCYAN, C.BMAGENTA, C.BGREEN, C.BRED];
        const col = colors[Math.floor(Math.random() * colors.length)];
        this.spawnParticles(fx, fy, col, 16);
      }
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const pt = this.particles[i];
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.vy += 35 * dt;
        pt.life -= dt;
        if (pt.life <= 0) this.particles.splice(i, 1);
      }
    }

    /* =======================================================================
     * 320x200 64-Color EGA Pixel-Art Rendering Pipeline
     * ======================================================================= */
    drawPixelText(str, x, y, color, shadow) {
      const upper = String(str).toUpperCase();
      let cx = Math.floor(x);
      const cy = Math.floor(y);
      for (let i = 0; i < upper.length; i++) {
        const ch = upper[i];
        if (ch === ' ') {
          cx += 4;
          continue;
        }
        const mask = FONT_3X5[ch];
        if (mask !== undefined) {
          if (shadow) {
            this.ctx.fillStyle = shadow;
            for (let r = 0; r < 5; r++) {
              for (let c = 0; c < 3; c++) {
                if ((mask >> (14 - (r * 3 + c))) & 1) {
                  this.ctx.fillRect(cx + c + 1, cy + r + 1, 1, 1);
                }
              }
            }
          }
          this.ctx.fillStyle = color;
          for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 3; c++) {
              if ((mask >> (14 - (r * 3 + c))) & 1) {
                this.ctx.fillRect(cx + c, cy + r, 1, 1);
              }
            }
          }
        }
        cx += 4;
      }
    }

    drawCenteredText(str, y, color, shadow) {
      const w = String(str).length * 4 - 1;
      this.drawPixelText(str, Math.floor((320 - w) / 2), y, color, shadow);
    }

    drawParallaxBackground(world) {
      const ctx = this.ctx;
      const par = Math.floor((this.paddle.x - 140) * 0.12);
      const parNear = Math.floor((this.paddle.x - 140) * 0.24);

      if (world === 0) {
        /* Night Over Melee Island */
        ctx.fillStyle = C.NAVY;
        ctx.fillRect(8, 16, 304, 184);
        ctx.fillStyle = C.BLUE;
        ctx.fillRect(8, 132, 304, 30);
        ctx.fillStyle = C.BLACK;
        ctx.fillRect(8, 162, 304, 38);
        /* Moon & Twinkling Stars */
        ctx.fillStyle = C.CREAM;
        ctx.fillRect(256 - par, 28, 12, 12);
        ctx.fillStyle = C.NAVY;
        ctx.fillRect(260 - par, 29, 9, 9);
        this.drawStarLayer(par, C.WHITE);
        /* Cliffside Lookout & Scumm Bar Pier Silhouette */
        ctx.fillStyle = C.BLACK;
        ctx.fillRect(14 - parNear, 118, 36, 44);
        ctx.fillRect(26 - parNear, 108, 18, 12);
        ctx.fillRect(220 - parNear, 148, 78, 14);
        /* Warm Scumm Bar Window & Water Shimmer */
        ctx.fillStyle = C.GOLD;
        ctx.fillRect(244 - parNear, 151, 5, 4);
        ctx.fillRect(256 - parNear, 151, 5, 4);
        for (let i = 0; i < 6; i++) {
          ctx.fillStyle = (i % 2 === 0) ? C.BYELLOW : C.ORANGE;
          ctx.fillRect(245 - parNear + ((i * 3 + Math.floor(this.clock * 5)) % 14), 165 + i * 4, 6, 1);
        }
      } else if (world === 1) {
        /* Edison Mansion & Sludge Lab */
        ctx.fillStyle = C.EGGPLANT;
        ctx.fillRect(8, 16, 304, 184);
        ctx.fillStyle = C.NAVY;
        ctx.fillRect(8, 16, 304, 68);
        this.drawStarLayer(par, C.LAVENDER);
        /* Crooked Mansard Silhouette */
        ctx.fillStyle = C.BLACK;
        ctx.fillRect(46 - par, 124, 54, 76);
        ctx.fillRect(54 - par, 110, 38, 16);
        ctx.fillRect(216 - par, 118, 56, 82);
        ctx.fillStyle = C.BYELLOW;
        ctx.fillRect(64 - par, 132, 6, 8);
        ctx.fillRect(236 - par, 130, 6, 8);
        /* Bubbling Radioactive Sludge River */
        ctx.fillStyle = C.FOREST;
        ctx.fillRect(8, 186, 304, 14);
        ctx.fillStyle = C.BGREEN;
        for (let i = 0; i < 9; i++) {
          const bx = 20 + ((i * 33 + Math.floor(this.clock * 18)) % 280);
          ctx.fillRect(bx, 188 + (i % 3) * 2, 4, 2);
        }
      } else if (world === 2) {
        /* Dusty Mayan / Atlantean Temple Vault */
        ctx.fillStyle = C.BLACK;
        ctx.fillRect(8, 16, 304, 184);
        ctx.fillStyle = C.MAROON;
        for (let y = 24; y < 192; y += 22) {
          ctx.fillRect(8, y, 304, 1);
          for (let x = 16 + ((y % 44 === 0) ? 14 : 0); x < 304; x += 36) {
            ctx.fillRect(x - par, y, 1, 22);
          }
        }
        /* Glowing Orichalcum Lava Conduits */
        ctx.fillStyle = C.ORANGE;
        ctx.fillRect(58 - parNear, 16, 3, 184);
        ctx.fillRect(258 - parNear, 16, 3, 184);
        ctx.fillStyle = C.BYELLOW;
        const pulseY = 20 + (Math.floor(this.clock * 45) % 170);
        ctx.fillRect(59 - parNear, pulseY, 1, 10);
        ctx.fillRect(259 - parNear, pulseY, 1, 10);
      } else if (world === 3) {
        /* Deep Space Combat Flight & Death Star Horizon */
        ctx.fillStyle = C.BLACK;
        ctx.fillRect(8, 16, 304, 184);
        for (let i = 0; i < this.stars.length; i++) {
          const st = this.stars[i];
          const sx = 10 + ((st.x + Math.floor(this.clock * 14 * st.depth) - par * st.depth + 600) % 296);
          ctx.fillStyle = st.depth === 3 ? C.WHITE : (st.depth === 2 ? C.BCYAN : C.DGRAY);
          ctx.fillRect(sx, st.y, 1, 1);
        }
        /* Trench Surface Grid */
        ctx.fillStyle = C.DGRAY;
        ctx.fillRect(8, 174, 304, 1);
        for (let i = 0; i < 8; i++) {
          const gx = 16 + ((i * 38 - parNear + 304) % 296);
          ctx.fillRect(gx, 175, 1, 25);
        }
      } else if (world === 4) {
        /* Island of Loom Crystal Spires */
        ctx.fillStyle = C.NAVY;
        ctx.fillRect(8, 16, 304, 184);
        this.drawStarLayer(par, C.ICE);
        ctx.fillStyle = C.COBALT;
        ctx.fillRect(68 - par, 118, 18, 82);
        ctx.fillRect(72 - par, 98, 10, 20);
        ctx.fillRect(232 - par, 124, 20, 76);
        ctx.fillRect(237 - par, 104, 10, 20);
        ctx.fillStyle = C.ICE;
        ctx.fillRect(76 - par, 92, 2, 6);
        ctx.fillRect(241 - par, 98, 2, 6);
      } else if (world === 5) {
        /* Sam & Max Noir Highway */
        ctx.fillStyle = C.NAVY;
        ctx.fillRect(8, 16, 304, 120);
        ctx.fillStyle = C.BLACK;
        ctx.fillRect(8, 136, 304, 64);
        /* City Skyline */
        ctx.fillStyle = C.DGRAY;
        for (let i = 0; i < 9; i++) {
          const bx = 14 + i * 33 - par;
          const bh = 18 + ((i * 17) % 28);
          ctx.fillRect(bx, 136 - bh, 24, bh);
        }
        /* Perspective Highway Dashes */
        ctx.fillStyle = C.BYELLOW;
        for (let i = 0; i < 4; i++) {
          const dy = 142 + ((i * 14 + Math.floor(this.clock * 40)) % 54);
          ctx.fillRect(158 - parNear, dy, 4, 7);
        }
      } else {
        /* Level 33: LeChuck's Subterranean Lava Cavern */
        ctx.fillStyle = C.BLACK;
        ctx.fillRect(8, 16, 304, 184);
        ctx.fillStyle = C.MAROON;
        for (let i = 0; i < 10; i++) {
          const sx = 12 + i * 30 - par;
          ctx.fillRect(sx, 16, 12, 10 + (i % 3) * 6);
        }
        ctx.fillStyle = C.RED;
        ctx.fillRect(8, 182, 304, 18);
        ctx.fillStyle = C.ORANGE;
        ctx.fillRect(8, 190, 304, 10);
        ctx.fillStyle = C.BYELLOW;
        for (let i = 0; i < 10; i++) {
          const lx = 14 + ((i * 31 + Math.floor(this.clock * 26)) % 290);
          ctx.fillRect(lx, 192 + (i % 2) * 3, 8, 2);
        }
      }
    }

    drawStarLayer(par, color) {
      const ctx = this.ctx;
      for (let i = 0; i < 26; i++) {
        const st = this.stars[i];
        if (st.y > 128) continue;
        const blink = Math.sin(this.clock * 3 + st.twinkle) > -0.4;
        ctx.fillStyle = blink ? color : C.DGRAY;
        ctx.fillRect(clamp(st.x - Math.floor(par * 0.5), 10, 308), st.y, 1, 1);
      }
    }

    drawArenaFrame(theme) {
      const ctx = this.ctx;
      /* Top HUD Bar */
      ctx.fillStyle = C.BLACK;
      ctx.fillRect(0, 0, 320, 16);
      ctx.fillStyle = theme.wallMid;
      ctx.fillRect(0, 15, 320, 1);

      /* Left & Right Architectural EGA Pillars */
      for (const wx of [0, 312]) {
        ctx.fillStyle = theme.wallDark;
        ctx.fillRect(wx, 16, 8, 184);
        ctx.fillStyle = theme.wallMid;
        ctx.fillRect(wx + 2, 16, 4, 184);
        ctx.fillStyle = theme.wallHi;
        ctx.fillRect(wx + 3, 16, 1, 184);
        for (let y = 20; y < 196; y += 14) {
          ctx.fillStyle = C.BLACK;
          ctx.fillRect(wx, y, 8, 1);
        }
      }
    }

    drawGoldGuyIcon(x, y) {
      const ctx = this.ctx;
      ctx.fillStyle = C.GOLD;
      ctx.fillRect(x + 2, y, 2, 2);
      ctx.fillRect(x + 1, y + 2, 4, 2);
      ctx.fillRect(x + 5, y + 1, 1, 2);
      ctx.fillRect(x + 1, y + 4, 1, 2);
      ctx.fillRect(x + 4, y + 4, 1, 2);
      ctx.fillStyle = C.BYELLOW;
      ctx.fillRect(x, y + 6, 6, 1);
    }

    drawHUD(spec, theme) {
      this.drawPixelText(`SCR:${String(this.score).padStart(6, '0')}`, 4, 5, C.WHITE, C.BLUE);
      this.drawPixelText(`HI:${String(this.highScore).padStart(6, '0')}`, 86, 5, C.BYELLOW, C.BROWN);
      this.drawPixelText(`L:${String(this.levelIndex + 1).padStart(2, '0')}/33`, 164, 5, C.BCYAN, C.TEAL);

      if (spec.world === 4) {
        const runes = this.loomNotes.length ? this.loomNotes.join('') : '----';
        this.drawPixelText(`LOOM:${runes}`, 206, 5, C.ICE, C.NAVY);
      } else {
        this.drawPixelText(theme.hudTag, 206, 5, C.BGREEN, C.FOREST);
      }

      const shownLives = Math.min(5, this.lives);
      for (let i = 0; i < shownLives; i++) {
        this.drawGoldGuyIcon(312 - (i + 1) * 8, 4);
      }
    }

    drawBricks() {
      const ctx = this.ctx;
      for (let i = 0; i < this.bricks.length; i++) {
        const b = this.bricks[i];
        if (!b.alive) continue;

        if (b.flash > 0) {
          ctx.fillStyle = C.WHITE;
          ctx.fillRect(b.x, b.y, b.w, b.h);
          continue;
        }

        /* Shadow bevel + Main EGA body + Top-Left Highlight */
        ctx.fillStyle = b.shade;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w - 1, b.h - 1);
        ctx.fillStyle = C.WHITE;
        ctx.fillRect(b.x, b.y, b.w - 2, 1);

        if (b.type === 'steel') {
          ctx.fillStyle = C.BLACK;
          ctx.fillRect(b.x + 2, b.y + 2, 2, 2);
          ctx.fillRect(b.x + b.w - 4, b.y + 2, 2, 2);
        } else if (b.type === 'grog') {
          /* Bubbling Scumm Bar Grog Acid Highlights */
          const fizz = Math.floor(this.clock * 8 + b.col) % 3;
          ctx.fillStyle = C.BYELLOW;
          ctx.fillRect(b.x + 3 + fizz * 3, b.y + 2, 2, 2);
          ctx.fillStyle = C.ACID;
          ctx.fillRect(b.x + 11 - fizz * 2, b.y + 3, 2, 1);
        } else if (b.type === 'armor' && b.hp < b.maxHp) {
          /* Visible Progressive Crack Lines on Damaged Armor Bricks */
          ctx.fillStyle = C.BLACK;
          ctx.fillRect(b.x + 5, b.y, 1, 3);
          ctx.fillRect(b.x + 6, b.y + 2, 2, 2);
          ctx.fillRect(b.x + 8, b.y + 4, 1, 2);
          if (b.maxHp === 3 && b.hp === 1) {
            ctx.fillRect(b.x + 12, b.y + 1, 1, 4);
            ctx.fillRect(b.x + 10, b.y + 3, 3, 1);
          }
        }
      }
    }

    drawWorldMechanics(world) {
      const ctx = this.ctx;

      /* World 0: Spinning Cutlass Parry Target */
      if (world === 0 && this.swordTarget && this.swordTarget.active) {
        const sx = Math.floor(this.swordTarget.x);
        const sy = Math.floor(this.swordTarget.y);
        const spin = Math.floor(this.clock * 12) % 2;
        ctx.fillStyle = C.WHITE;
        if (spin === 0) {
          ctx.fillRect(sx - 6, sy - 1, 12, 2);
        } else {
          ctx.fillRect(sx - 1, sy - 6, 2, 12);
        }
        ctx.fillStyle = C.GOLD;
        ctx.fillRect(sx - 2, sy - 2, 4, 4);
      }

      /* World 1: Chron-o-John Twin Time Portals */
      if (world === 1) {
        const pulse = Math.floor(this.clock * 10) % 2;
        for (const [px, colA, colB] of [[30, C.BCYAN, C.WHITE], [290, C.BMAGENTA, C.BYELLOW]]) {
          ctx.fillStyle = colA;
          ctx.fillRect(px - 5, 119, 10, 14);
          ctx.fillStyle = C.BLACK;
          ctx.fillRect(px - 3, 121, 6, 10);
          ctx.fillStyle = pulse ? colB : colA;
          ctx.fillRect(px - 1, 123, 2, 6);
        }
      }

      /* World 2: Atlantean Wall Gargoyle Telegraph */
      if (world === 2 && this.dartTelegraphSide !== 0) {
        const gx = this.dartTelegraphSide < 0 ? 8 : 308;
        ctx.fillStyle = (Math.floor(this.clock * 16) % 2) ? C.BYELLOW : C.BRED;
        ctx.fillRect(gx, 136, 4, 30);
      }

      /* World 3: Subspace Gravity Well Concentric Radar Rings */
      if (world === 3) {
        const gx = Math.floor(this.gravityWell.x);
        const gy = Math.floor(this.gravityWell.y);
        const rPhase = Math.floor(this.clock * 12) % 10;
        ctx.strokeStyle = C.INDIGO;
        ctx.strokeRect(gx - 14 + rPhase, gy - 14 + rPhase, Math.max(2, 28 - rPhase * 2), Math.max(2, 28 - rPhase * 2));
        ctx.fillStyle = C.BCYAN;
        ctx.fillRect(gx - 1, gy - 1, 3, 3);
      }

      /* World 5: Sam & Max Highway Wak-A-Rat */
      if (world === 5 && this.wakRat.stun <= 0) {
        const rx = Math.floor(this.wakRat.x);
        const ry = Math.floor(this.wakRat.y);
        ctx.fillStyle = C.LGRAY;
        ctx.fillRect(rx - 5, ry - 2, 10, 5);
        ctx.fillStyle = C.PINK;
        ctx.fillRect(rx - 7, ry, 2, 2);
        ctx.fillRect(rx + 4, ry - 4, 2, 2);
        ctx.fillStyle = C.BRED;
        ctx.fillRect(rx + 2, ry - 1, 2, 1);
      }

      /* World 6 (Level 33): Ghost Pirate LeChuck Moving Boss Sprite & Health Bar! */
      if (world === 6 && this.boss && this.boss.hp > 0) {
        const bx = Math.floor(this.boss.x);
        const by = Math.floor(this.boss.y);
        const flash = this.boss.flash > 0;
        /* Tricorne Pirate Hat */
        ctx.fillStyle = flash ? C.WHITE : C.NAVY;
        ctx.fillRect(bx + 4, by, 28, 5);
        ctx.fillRect(bx + 10, by - 3, 16, 3);
        ctx.fillStyle = C.GOLD;
        ctx.fillRect(bx + 16, by, 4, 3);
        /* Ghostly Green Skull Face & Red Eyes */
        ctx.fillStyle = flash ? C.WHITE : C.BGREEN;
        ctx.fillRect(bx + 9, by + 5, 18, 7);
        ctx.fillStyle = C.BRED;
        ctx.fillRect(bx + 12, by + 7, 3, 2);
        ctx.fillRect(bx + 21, by + 7, 3, 2);
        /* Flaming Ghost Beard & Pirate Coat */
        const flick = Math.floor(this.clock * 14) % 2;
        ctx.fillStyle = flick ? C.ORANGE : C.BRED;
        ctx.fillRect(bx + 7, by + 12, 22, 5);
        ctx.fillStyle = C.BYELLOW;
        ctx.fillRect(bx + 10 + flick * 2, by + 17, 4, 3);
        ctx.fillRect(bx + 20 - flick * 2, by + 17, 4, 3);
        /* Boss Health Bar */
        ctx.fillStyle = C.DGRAY;
        ctx.fillRect(110, 17, 100, 3);
        ctx.fillStyle = C.BGREEN;
        ctx.fillRect(110, 17, Math.ceil((this.boss.hp / this.boss.maxHp) * 100), 3);
      }

      /* Active Projectiles (Atlantean Darts & LeChuck Voodoo Skulls) */
      for (let i = 0; i < this.hazards.length; i++) {
        const hz = this.hazards[i];
        const hx = Math.floor(hz.x);
        const hy = Math.floor(hz.y);
        if (hz.kind === 'voodoo') {
          ctx.fillStyle = C.BGREEN;
          ctx.fillRect(hx, hy, 6, 6);
          ctx.fillStyle = C.BRED;
          ctx.fillRect(hx + 1, hy + 1, 1, 2);
          ctx.fillRect(hx + 4, hy + 1, 1, 2);
        } else {
          ctx.fillStyle = C.GOLD;
          ctx.fillRect(hx, hy, 8, 2);
          ctx.fillStyle = C.BGREEN;
          ctx.fillRect(hz.vx > 0 ? hx + 6 : hx, hy, 2, 2);
        }
      }
    }

    drawPaddleAndBall() {
      const ctx = this.ctx;
      const px = Math.floor(this.paddle.x);
      const py = Math.floor(this.paddle.y);
      const pw = Math.floor(this.paddle.w);

      /* Paddle Core */
      ctx.fillStyle = C.BLUE;
      ctx.fillRect(px, py + 1, pw, 4);
      ctx.fillStyle = this.paddle.catchMode ? C.BCYAN : C.LGRAY;
      ctx.fillRect(px + 3, py, pw - 6, 3);
      ctx.fillStyle = C.WHITE;
      ctx.fillRect(px + 4, py, pw - 8, 1);

      /* Rubber Chicken Endcaps when Expanded, else Classic Red Bumper Tips */
      if (this.paddle.expanded) {
        ctx.fillStyle = C.BYELLOW;
        ctx.fillRect(px - 2, py - 1, 6, 5);
        ctx.fillRect(px + pw - 4, py - 1, 6, 5);
        ctx.fillStyle = C.BRED;
        ctx.fillRect(px - 3, py, 2, 2);
        ctx.fillRect(px + pw + 1, py, 2, 2);
      } else {
        ctx.fillStyle = C.BRED;
        ctx.fillRect(px, py, 4, 5);
        ctx.fillRect(px + pw - 4, py, 4, 5);
      }

      /* Space-Ranger Twin Blaster Turrets */
      if (this.paddle.laser) {
        ctx.fillStyle = C.WHITE;
        ctx.fillRect(px + 2, py - 3, 2, 3);
        ctx.fillRect(px + pw - 4, py - 3, 2, 3);
        ctx.fillStyle = C.BRED;
        ctx.fillRect(px + 2, py - 4, 2, 1);
        ctx.fillRect(px + pw - 4, py - 4, 2, 1);
      }

      /* Magnetic Compass Aura */
      if (this.paddle.catchMode && (Math.floor(this.clock * 10) % 2 === 0)) {
        ctx.fillStyle = C.BCYAN;
        ctx.fillRect(px + 5, py - 1, pw - 10, 1);
      }

      /* Lasers */
      ctx.fillStyle = C.BYELLOW;
      for (let i = 0; i < this.lasers.length; i++) {
        const lz = this.lasers[i];
        ctx.fillRect(Math.floor(lz.x), Math.floor(lz.y), 2, 5);
      }

      /* Crisp Pixel Ball */
      const bx = Math.round(this.ball.x - 2);
      const by = Math.round(this.ball.y - 2);
      ctx.fillStyle = C.BCYAN;
      ctx.fillRect(bx, by + 1, 5, 3);
      ctx.fillRect(bx + 1, by, 3, 5);
      ctx.fillStyle = C.WHITE;
      ctx.fillRect(bx + 1, by + 1, 3, 3);
    }

    drawPowerups() {
      const ctx = this.ctx;
      for (let i = 0; i < this.powerups.length; i++) {
        const p = this.powerups[i];
        const x = Math.floor(p.x);
        const y = Math.floor(p.y);

        if (p.kind === 'L') {
          /* Space-Ranger Blaster Capsule */
          ctx.fillStyle = C.RED;
          ctx.fillRect(x, y, 11, 7);
          ctx.fillStyle = C.BYELLOW;
          ctx.fillRect(x + 2, y - 1, 2, 3);
          ctx.fillRect(x + 7, y - 1, 2, 3);
          this.drawPixelText('L', x + 4, y + 1, C.WHITE, null);
        } else if (p.kind === 'E') {
          /* Rubber Chicken With a Pulley Icon */
          ctx.fillStyle = C.BROWN;
          ctx.fillRect(x, y, 11, 7);
          ctx.fillStyle = C.BYELLOW;
          ctx.fillRect(x + 1, y + 2, 8, 3);
          ctx.fillStyle = C.BRED;
          ctx.fillRect(x + 9, y + 2, 2, 2);
          ctx.fillStyle = C.LGRAY;
          ctx.fillRect(x + 4, y + 1, 3, 5);
        } else if (p.kind === 'C') {
          /* Magnetic Compass Icon */
          ctx.fillStyle = C.BLUE;
          ctx.fillRect(x, y, 11, 7);
          ctx.fillStyle = C.GOLD;
          ctx.fillRect(x + 2, y + 1, 7, 5);
          ctx.fillStyle = C.BRED;
          ctx.fillRect(x + 5, y + 1, 2, 2);
          ctx.fillStyle = C.WHITE;
          ctx.fillRect(x + 4, y + 3, 2, 2);
        } else if (p.kind === 'S') {
          /* Tiny Hourglass Icon */
          ctx.fillStyle = C.FOREST;
          ctx.fillRect(x, y, 11, 7);
          ctx.fillStyle = C.GOLD;
          ctx.fillRect(x + 3, y, 5, 1);
          ctx.fillRect(x + 3, y + 6, 5, 1);
          ctx.fillStyle = C.BYELLOW;
          ctx.fillRect(x + 4, y + 1, 3, 2);
          ctx.fillRect(x + 5, y + 3, 1, 1);
          ctx.fillRect(x + 4, y + 4, 3, 2);
        } else if (p.kind === 'P') {
          /* Pixelated LucasArts Gold Guy Extra Life Logo */
          ctx.fillStyle = C.NAVY;
          ctx.fillRect(x, y, 11, 7);
          this.drawGoldGuyIcon(x + 3, y);
        }
      }
    }

    drawParticles() {
      const ctx = this.ctx;
      for (let i = 0; i < this.particles.length; i++) {
        const pt = this.particles[i];
        ctx.fillStyle = pt.color;
        ctx.fillRect(Math.floor(pt.x), Math.floor(pt.y), 2, 2);
      }
    }

    drawMenuScreen() {
      const ctx = this.ctx;
      const previewSpec = LEVELS[this.selectedLevel];
      const previewTheme = WORLD_THEMES[previewSpec.world];
      this.drawParallaxBackground(previewSpec.world);
      this.drawArenaFrame(previewTheme);
      this.drawPixelText('1UP 000000', 8, 5, C.WHITE, C.BLUE);
      this.drawCenteredText('INSERT COIN / FREE PLAY', 5, C.BYELLOW, C.BROWN);
      this.drawPixelText('OPL2 FM', 284, 5, C.BGREEN, C.FOREST);

      /* Recessed EGA Title Card */
      ctx.fillStyle = C.BLACK;
      ctx.fillRect(24, 24, 272, 162);
      ctx.strokeStyle = C.GOLD;
      ctx.strokeRect(25.5, 25.5, 269, 159);
      ctx.strokeStyle = C.BROWN;
      ctx.strokeRect(27.5, 27.5, 265, 155);

      /* Iconic Gold Guy Emblem + Title */
      this.drawGoldGuyIcon(157, 32);
      this.drawCenteredText('LUCASARTS ARCHIVE TRIBUTE', 42, C.GOLD, C.BROWN);
      this.drawCenteredText('SCUMM-ANOID: EGA & ADLIB OPL2', 52, C.BYELLOW, C.RED);

      /* Power-up Legend Row */
      this.drawCenteredText('POWER-UPS: L-BLASTER E-CHICKEN C-COMPASS', 67, C.BCYAN, C.NAVY);
      this.drawCenteredText('S-HOURGLASS P-GOLDGUY   G-GROG 3X3 BLAST', 75, C.BGREEN, C.FOREST);

      /* Interactive 33-Level & 7-Soundtrack Selector */
      ctx.fillStyle = C.NAVY;
      ctx.fillRect(38, 88, 244, 42);
      ctx.strokeStyle = C.BCYAN;
      ctx.strokeRect(38.5, 88.5, 243, 41);

      const lvlNum = String(this.selectedLevel + 1).padStart(2, '0');
      this.drawCenteredText(`< STAGE ${lvlNum}/33: ${previewSpec.name} >`, 94, C.WHITE, C.BLUE);
      this.drawCenteredText(`WORLD: ${previewTheme.title}`, 104, C.BYELLOW, C.BROWN);
      this.drawCenteredText(`ADLIB TRACK: ${SOUNDTRACKS[previewSpec.world].name}`, 114, C.BMAGENTA, C.EGGPLANT);

      this.drawCenteredText(`HIGH SCORE: ${String(this.highScore).padStart(7, '0')}`, 138, C.GOLD, C.BLACK);

      if (Math.floor(this.clock * 3) % 2 === 0) {
        this.drawCenteredText('CLICK OR PRESS SPACE TO START & UNLOCK OPL2', 154, C.BGREEN, C.BLACK);
      }
      this.drawCenteredText('USE < LVL / LVL > BUTTONS TO JUMP TO ANY WORLD', 168, C.LGRAY, C.BLACK);
    }

    drawOverlayCard(title, line1, line2, line3, borderColor) {
      const ctx = this.ctx;
      ctx.fillStyle = C.BLACK;
      ctx.fillRect(34, 64, 252, 76);
      ctx.strokeStyle = borderColor;
      ctx.strokeRect(35.5, 65.5, 249, 73);
      this.drawCenteredText(title, 74, borderColor, C.NAVY);
      this.drawCenteredText(line1, 90, C.WHITE, C.BLACK);
      this.drawCenteredText(line2, 102, C.BCYAN, C.BLACK);
      if (Math.floor(this.clock * 3) % 2 === 0) {
        this.drawCenteredText(line3, 120, C.BGREEN, C.BLACK);
      }
    }

    render() {
      if (this.state === 'MENU') {
        this.drawMenuScreen();
        return;
      }

      const spec = LEVELS[this.levelIndex];
      const theme = WORLD_THEMES[spec.world];

      this.drawParallaxBackground(spec.world);
      this.drawArenaFrame(theme);
      this.drawHUD(spec, theme);
      this.drawBricks();
      this.drawWorldMechanics(spec.world);
      this.drawPowerups();
      this.drawPaddleAndBall();
      this.drawParticles();

      if (this.bannerTimer > 0 && this.state === 'PLAYING') {
        this.ctx.fillStyle = C.BLACK;
        this.ctx.fillRect(12, 192, 296, 7);
        this.drawCenteredText(this.bannerText.slice(0, 48), 193, this.bannerColor, null);
      }

      if (this.paused && this.state === 'PLAYING') {
        this.drawOverlayCard(
          'GAME PAUSED',
          spec.name,
          spec.lore.slice(0, 42),
          'PRESS P OR CLICK PAUSE TO RESUME',
          C.BYELLOW
        );
      } else if (this.state === 'LEVEL_CLEAR') {
        this.drawOverlayCard(
          `STAGE ${this.levelIndex + 1} COMPLETE!`,
          spec.name,
          `SCORE: ${this.score}   LIVES BONUS: +${this.lives * 100}`,
          'PRESS SPACE OR CLICK FOR NEXT STAGE',
          C.BGREEN
        );
      } else if (this.state === 'GAME_OVER') {
        this.drawOverlayCard(
          'GAME OVER - YOU FIGHT LIKE A COW!',
          `FINAL SCORE: ${this.score}`,
          `HIGH SCORE: ${this.highScore}`,
          'PRESS SPACE OR CLICK FOR MAIN MENU',
          C.BRED
        );
      } else if (this.state === 'VICTORY') {
        this.drawOverlayCard(
          'VICTORY OVER GHOST PIRATE LECHUCK!',
          `ALL 33 LUCASARTS ARCHIVES CLEARED!`,
          `FINAL SCORE: ${this.score}  HI: ${this.highScore}`,
          'FIREWORKS OVER MELEE! PRESS SPACE FOR MENU',
          C.GOLD
        );
      }
    }
  }

  /* =========================================================================
   * Self-Verification Physics Invariant Suite (Used by Automated Test Harness)
   * ========================================================================= */
  function testPhysicsInvariants() {
    /* Verify 45-degree corner bounce reflects away from corner cleanly */
    const cornerBall = { x: 48.4, y: 48.4, vx: 60, vy: 60, r: 2.5 };
    const brick = { x: 50, y: 50, w: 17, h: 6 };
    const cHit = testCircleAABB(cornerBall, brick);
    if (!cHit) throw new Error('Expected diagonal corner collision');
    applyContactBounce(cornerBall, cHit);
    if (!(cornerBall.vx < 0 && cornerBall.vy < 0)) {
      throw new Error('Expected 45-deg corner hit to reflect both vx and vy outward');
    }

    /* Verify seam hit across two adjacent horizontal bricks reflects vy once without flipping vx */
    const seamBall = { x: 68, y: 57.2, vx: 45, vy: -80, r: 2.5 };
    const leftBrick = { x: 50, y: 50, w: 18, h: 6 };
    const rightBrick = { x: 68, y: 50, w: 18, h: 6 };
    let best = null;
    for (const b of [leftBrick, rightBrick]) {
      const c = testCircleAABB(seamBall, b);
      if (c && (!best || c.pen > best.pen)) best = c;
    }
    if (!best) throw new Error('Expected seam collision');
    applyContactBounce(seamBall, best);
    if (!(seamBall.vy > 0 && seamBall.vx > 0)) {
      throw new Error('Expected seam bounce to invert vy while keeping vx sign intact');
    }

    /* Verify Grog 3x3 chain explosion clears adjacent normal, armored, and chained Grog bricks */
    const dummyAudio = { unlock() { return false; }, startMusic() {}, stopMusic() {}, playSFX() {}, muted: true };
    const dummyCanvas = {
      getContext: () => ({
        imageSmoothingEnabled: false,
        fillRect() {},
        strokeRect() {}
      })
    };
    const g = new ScummAnoidGame(dummyCanvas, dummyAudio, {});
    g.loadLevel(0, false);
    const grogBrick = g.bricks.find((b) => b.type === 'grog' && b.alive);
    if (!grogBrick) throw new Error('Level 1 must contain Grog bricks');
    const beforeAlive = g.bricks.filter((b) => b.alive).length;
    g.damageBrick(grogBrick, 1, true);
    const afterAlive = g.bricks.filter((b) => b.alive).length;
    if (!(afterAlive <= beforeAlive - 4)) {
      throw new Error('Expected Grog brick 3x3 chain explosion to destroy multiple neighboring bricks');
    }
  }

  /* =========================================================================
   * Browser Bootstrap & User-Interaction Audio / Input Wiring
   * ========================================================================= */
  const canvas = document.getElementById('game-canvas');
  const uiRefs = {
    led: document.getElementById('opl-led'),
    ledText: document.getElementById('opl-status-text'),
    status: document.getElementById('cabinet-status'),
    btnStart: document.getElementById('btn-start'),
    btnPrev: document.getElementById('btn-prev-lvl'),
    btnNext: document.getElementById('btn-next-lvl'),
    btnPause: document.getElementById('btn-pause'),
    btnMute: document.getElementById('btn-mute'),
    btnCrt: document.getElementById('btn-crt'),
    crtOverlay: document.getElementById('crt-overlay')
  };

  const audio = new AdLibOPL2Engine();
  const game = new ScummAnoidGame(canvas, audio, uiRefs);

  function togglePause() {
    if (game.state !== 'PLAYING') return;
    game.paused = !game.paused;
    if (game.paused) {
      audio.stopMusic();
    } else {
      audio.startMusic(LEVELS[game.levelIndex].world, game.levelIndex);
    }
  }

  function toggleMute() {
    game.unlockAndSyncAudio();
    audio.setMuted(!audio.muted);
    if (uiRefs.btnMute) {
      uiRefs.btnMute.textContent = audio.muted ? 'ADLIB: OFF [M]' : 'ADLIB: ON [M]';
    }
    if (uiRefs.led) {
      uiRefs.led.classList.toggle('is-online', !audio.muted);
      uiRefs.ledText.textContent = audio.muted ? 'OPL2 MUTED' : 'OPL2 ACTIVE';
    }
  }

  function shiftSelectedLevel(delta) {
    game.unlockAndSyncAudio();
    if (game.state === 'MENU') {
      game.selectedLevel = (game.selectedLevel + delta + LEVELS.length) % LEVELS.length;
      audio.playSFX('paddle', (game.selectedLevel % 5) * 0.2);
      game.updateCabinetStatus();
    } else {
      const nextIdx = (game.levelIndex + delta + LEVELS.length) % LEVELS.length;
      game.loadLevel(nextIdx, true);
      game.state = 'PLAYING';
    }
  }

  canvas.addEventListener('mousemove', (ev) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width > 0) {
      game.mouseX = ((ev.clientX - rect.left) / rect.width) * ARENA.W;
      game.useMouse = true;
    }
  });

  canvas.addEventListener('mousedown', (ev) => {
    if (ev.button === 0) {
      game.launchOrFire();
    }
  });

  canvas.addEventListener('touchmove', (ev) => {
    if (ev.touches && ev.touches.length > 0) {
      const rect = canvas.getBoundingClientRect();
      if (rect.width > 0) {
        game.mouseX = ((ev.touches[0].clientX - rect.left) / rect.width) * ARENA.W;
        game.useMouse = true;
      }
      ev.preventDefault();
    }
  }, { passive: false });

  canvas.addEventListener('touchstart', (ev) => {
    if (ev.touches && ev.touches.length > 0) {
      const rect = canvas.getBoundingClientRect();
      if (rect.width > 0) {
        game.mouseX = ((ev.touches[0].clientX - rect.left) / rect.width) * ARENA.W;
        game.useMouse = true;
      }
    }
    game.launchOrFire();
  }, { passive: true });

  document.addEventListener('keydown', (ev) => {
    if (ev.code === 'ArrowLeft' || ev.code === 'KeyA') {
      if (game.state === 'MENU') {
        shiftSelectedLevel(-1);
      } else {
        game.keys.left = true;
      }
    } else if (ev.code === 'ArrowRight' || ev.code === 'KeyD') {
      if (game.state === 'MENU') {
        shiftSelectedLevel(1);
      } else {
        game.keys.right = true;
      }
    } else if (ev.code === 'Space' || ev.code === 'Enter') {
      ev.preventDefault();
      game.launchOrFire();
    } else if (ev.code === 'KeyP' || ev.code === 'Escape') {
      togglePause();
    } else if (ev.code === 'KeyM') {
      toggleMute();
    } else if (ev.code === 'KeyV') {
      if (uiRefs.crtOverlay) uiRefs.crtOverlay.classList.toggle('is-hidden');
    } else if (ev.code === 'BracketLeft') {
      shiftSelectedLevel(-1);
    } else if (ev.code === 'BracketRight') {
      shiftSelectedLevel(1);
    }
  });

  document.addEventListener('keyup', (ev) => {
    if (ev.code === 'ArrowLeft' || ev.code === 'KeyA') {
      game.keys.left = false;
    } else if (ev.code === 'ArrowRight' || ev.code === 'KeyD') {
      game.keys.right = false;
    } else if (ev.code === 'Space') {
      ev.preventDefault();
    }
  });

  function bindDeckButton(btn, fn) {
    if (!btn) return;
    btn.addEventListener('click', (ev) => {
      ev.currentTarget.blur();
      fn();
    });
  }

  bindDeckButton(uiRefs.btnStart, () => game.launchOrFire());
  bindDeckButton(uiRefs.btnPrev, () => shiftSelectedLevel(-1));
  bindDeckButton(uiRefs.btnNext, () => shiftSelectedLevel(1));
  bindDeckButton(uiRefs.btnPause, () => togglePause());
  bindDeckButton(uiRefs.btnMute, () => toggleMute());
  bindDeckButton(uiRefs.btnCrt, () => {
    if (uiRefs.crtOverlay) uiRefs.crtOverlay.classList.toggle('is-hidden');
  });

  let lastTimestamp = performance.now();
  function frameLoop(now) {
    const dt = Math.min(0.033, Math.max(0.001, (now - lastTimestamp) / 1000));
    lastTimestamp = now;
    game.update(dt);
    game.render();
    requestAnimationFrame(frameLoop);
  }

  game.updateCabinetStatus();
  game.render();
  requestAnimationFrame(frameLoop);

  if (window.__ARKANOID_TEST_HOOK__) {
    window.__ARKANOID_DEBUG__ = {
      EGA_PALETTE,
      LEVELS,
      SOUNDTRACKS,
      game,
      audio,
      testPhysicsInvariants
    };
  }
  })();
  </script>
</body>
