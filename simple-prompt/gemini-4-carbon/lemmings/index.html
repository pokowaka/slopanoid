<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lemmings: Beat Tribe — Playing Is Composing</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="crt-on">
  <div class="stage">
    <header class="bezel-topbar">
      <div class="brand">
        <span class="power-led" aria-hidden="true"></span>
        <span class="brand-title">OCS-1084S // LEMMINGS: BEAT TRIBE</span>
      </div>
      <nav class="quick-bar" aria-label="Game controls">
        <button id="hdr-levels" type="button" title="Level Select & Passwords (Esc)">LEVELS [ESC]</button>
        <button id="hdr-demo" type="button" title="Watch Solution Demo (D / Shift+D)">DEMO [D]</button>
        <button id="hdr-restart" type="button" title="Restart Current Level (R)">RETRY [R]</button>
        <button id="hdr-mixer" type="button" title="Live ProTracker & Stem Mixer (T)">MIXER [T]</button>
        <button id="hdr-mute" type="button" title="Mute / Unmute Audio (M)">MUTE [M]</button>
        <button id="hdr-crt" type="button" class="active" title="Toggle CRT Scanline Bezel (C)">CRT [ON]</button>
      </nav>
    </header>

    <main class="monitor-shell">
      <div class="crt-screen">
        <canvas id="game-canvas" width="320" height="200"></canvas>
        <div class="crt-scanlines" aria-hidden="true"></div>
        <div class="crt-vignette" aria-hidden="true"></div>
      </div>
    </main>

    <footer class="hotkey-strip">
      <span><b>1–8</b> Skills</span>
      <span><b>-/+</b> Rate</span>
      <span><b>&larr;/&rarr;</b> or <b>A/D</b> Scroll</span>
      <span><b>R-Drag</b> / <b>Minimap</b> Pan</span>
      <span><b>P</b> Pause</span>
      <span><b>F</b> 2x Speed</span>
      <span><b>N</b> Nuke (2x)</span>
      <span><b>T</b> Stem Mixer</span>
      <span><b>D</b> Demo</span>
      <span><b>C</b> CRT</span>
    </footer>
  </div>

  <script src="font.js"></script>
  <script src="sprites.js"></script>
  <script src="terrain.js"></script>
  <script src="audio.js"></script>
  <script src="sim.js"></script>
  <script src="levels.js"></script>
  <script src="renderer.js"></script>
  <script src="main.js"></script>
</body>
</html>
