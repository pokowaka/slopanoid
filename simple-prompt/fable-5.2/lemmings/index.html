<!DOCTYPE html>
<html lang="en">
<head>

<title>BEAT TRIBE - Lemmings where playing is composing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="monitor" class="crt">
    <div id="tube">
      <canvas id="screen" width="320" height="200"></canvas>
      <div id="scan"></div>
      <div id="glass"></div>
    </div>
    <div id="chin"><span class="badge">BEAT TRIBE</span><span class="model">MODEL 1084S-BT &middot; 320x200 &middot; 60 HZ</span><span class="led"></span></div>
  </div>
  <p id="help">
    <b>1-8</b> skill &nbsp; <b>click</b> a lemming &nbsp; <b>&larr; &rarr;</b> / <b>A D</b> scroll &nbsp; <b>P</b> pause &nbsp; <b>F</b> fast-forward &nbsp;
    <b>N N</b> nuke &nbsp; <b>- +</b> release rate &nbsp; <b>T</b> stem mixer &nbsp; <b>M</b> mute &nbsp; <b>C</b> CRT &nbsp; <b>Shift+D</b> demo &nbsp; <b>Esc</b> levels
  </p>
</div>
