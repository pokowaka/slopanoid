<script>
'use strict';

/* ==========================================================================
   1. CORE CONSTANTS, EGA PALETTE AND PIXEL HELPERS
   ========================================================================== */

const VIEW_W = 320, VIEW_H = 200;            // the golden-era LucasArts viewport
const FIELD_L = 8, FIELD_R = 248, FIELD_T = 8; // playfield walls (HUD panel lives at x >= 256)
const FIELD_W = FIELD_R - FIELD_L;
const BRICK_W = 8, BRICK_H = 6, GRID_COLS = 30, GRID_ROWS = 20;
const BALL_R = 2;
const PADDLE_Y = 183, PADDLE_H = 6;
const STEP = 1 / 120;                        // fixed physics timestep

/* The 64 EGA palette registers (6-bit rgbRGB), indexed by register number. */
const EGA = [
  '#000000', '#0000AA', '#00AA00', '#00AAAA', '#AA0000', '#AA00AA', '#AAAA00', '#AAAAAA',
  '#000055', '#0000FF', '#00AA55', '#00AAFF', '#AA0055', '#AA00FF', '#AAAA55', '#AAAAFF',
  '#005500', '#0055AA', '#00FF00', '#00FFAA', '#AA5500', '#AA55AA', '#AAFF00', '#AAFFAA',
  '#005555', '#0055FF', '#00FF55', '#00FFFF', '#AA5555', '#AA55FF', '#AAFF55', '#AAFFFF',
  '#550000', '#5500AA', '#55AA00', '#55AAAA', '#FF0000', '#FF00AA', '#FFAA00', '#FFAAAA',
  '#550055', '#5500FF', '#55AA55', '#55AAFF', '#FF0055', '#FF00FF', '#FFAA55', '#FFAAFF',
  '#555500', '#5555AA', '#55FF00', '#55FFAA', '#FF5500', '#FF55AA', '#FFFF00', '#FFFFAA',
  '#555555', '#5555FF', '#55FF55', '#55FFFF', '#FF5555', '#FF55FF', '#FFFF55', '#FFFFFF',
];

/* Named registers used throughout the renderer. */
const C = {
  BLACK: 0, BLUE: 1, GREEN: 2, CYAN: 3, RED: 4, MAGENTA: 5, OLIVE: 6, LGRAY: 7,
  NAVY: 8, AZURE: 11, TAN: 14, DGREEN: 16, DBLUE: 17, BROWN: 20, MAUVE: 21, TEAL: 24,
  VIOLET: 29, MAROON: 32, INDIGO: 33, ORANGE: 38, PINK: 39, DPURPLE: 40, FLESH: 46,
  BRONZE: 48, SLATE: 49, GOLD: 54, CREAM: 55, DGRAY: 56, LBLUE: 57, LGREEN: 58, LCYAN: 59,
  LRED: 60, LMAGENTA: 61, YELLOW: 62, WHITE: 63,
};

/* One-letter "inks" shared by the level mosaics and the sprite sheets. */
const INK = {
  a: 11, b: 1, c: 3, d: 56, e: 16, f: 46, g: 2, h: 59, i: 57, j: 58, k: 0, l: 7, m: 5,
  n: 20, o: 38, p: 39, q: 61, r: 4, s: 60, t: 14, u: 40, v: 29, w: 63, x: 32, y: 62, z: 48,
};

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;

/* Deterministic PRNG (mulberry32) so procedural art is identical on every run. */
function makeRng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* EGA register <-> per-channel intensity (0..3) conversion, used for bevel shading. */
function egaLevels(i) {
  return [((i >> 2) & 1) * 2 + ((i >> 5) & 1), ((i >> 1) & 1) * 2 + ((i >> 4) & 1), (i & 1) * 2 + ((i >> 3) & 1)];
}
function egaFromLevels(r, g, b) {
  return ((r >> 1) << 2) | ((r & 1) << 5) | ((g >> 1) << 1) | ((g & 1) << 4) | (b >> 1) | ((b & 1) << 3);
}
function egaShade(i, delta) {
  const [r, g, b] = egaLevels(i);
  return egaFromLevels(clamp(r + delta, 0, 3), clamp(g + delta, 0, 3), clamp(b + delta, 0, 3));
}

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

function makeLayer(w, h) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  return { cv, g, w, h };
}
function rect(g, x, y, w, h, c) { g.fillStyle = EGA[c]; g.fillRect(x | 0, y | 0, w | 0, h | 0); }
function pset(g, x, y, c) { g.fillStyle = EGA[c]; g.fillRect(x | 0, y | 0, 1, 1); }

/* Ordered (Bayer) dithering: the EGA artist's substitute for gradients. level = 0..16. */
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function dither(g, x, y, w, h, ca, cb, level) {
  rect(g, x, y, w, h, ca);
  if (level <= 0) return;
  g.fillStyle = EGA[cb];
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      if (BAYER[((y + j) & 3) * 4 + ((x + i) & 3)] < level) g.fillRect(x + i, y + j, 1, 1);
    }
  }
}
/* Vertical dithered gradient through a list of palette registers. */
function ditherGradient(g, x, y, w, h, colors) {
  const bands = colors.length - 1;
  for (let j = 0; j < h; j++) {
    const f = (j / h) * bands, k = Math.min(bands - 1, f | 0);
    dither(g, x, y + j, w, 1, colors[k], colors[k + 1], Math.round((f - k) * 16));
  }
}

/* Sprites are arrays of ink strings ('.' is transparent). */
function makeSprite(rows) {
  const L = makeLayer(rows[0].length, rows.length);
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const ink = INK[row[x]];
      if (ink !== undefined) pset(L.g, x, y, ink);
    }
  });
  return L.cv;
}

/* --------------------------------------------------------------------------
   5x7 bitmap font (ASCII 32..127, five column bytes per glyph, bit 0 = top row).
   Glyph 126 is a music note and 127 a heart. Text is rendered proportionally.
   -------------------------------------------------------------------------- */
const FONT_HEX =
  '000000000000005F00000007000700147F147F14242A7F2A12231308646236495522500005030000' +
  '001C2241000041221C00082A1C2A0808083E08080050300000080808080800606000002010080402' +
  '3E5149453E00427F400042615149462141454B311814127F1027454545393C4A4949300171090503' +
  '3649494936064949291E003636000000563600000008142241141414141441221408000201510906' +
  '324979413E7E1111117E7F494949363E414141227F4141221C7F494949417F090901013E41415132' +
  '7F0808087F00417F41002040413F017F081422417F404040407F0204027F7F0408107F3E4141413E' +
  '7F090909063E4151215E7F09192946464949493101017F01013F4040403F1F2040201F7F2018207F' +
  '63140814630304780403615149454300007F4141020408102041417F000004020102044040404040' +
  '000102040020545454787F484444383844444420384444487F3854545418087E090102081454543C' +
  '7F0804047800447D40002040443D00007F10284400417F40007C041804787C080404783844444438' +
  '7C14141408081414187C7C080404084854545420043F4440203C4040207C1C2040201C3C4030403C' +
  '44281028440C5050503C4464544C44000836410000007F0000004136080020703F01060E1F3E1F0E';

const Font = {
  atlas: null, tinted: new Map(), left: [], width: [],
  init() {
    const L = makeLayer(96 * 6, 8);
    L.g.fillStyle = '#FFFFFF';
    for (let ch = 0; ch < 96; ch++) {
      let first = 5, last = -1;
      for (let col = 0; col < 5; col++) {
        const bits = parseInt(FONT_HEX.substr(ch * 10 + col * 2, 2), 16);
        if (bits) { first = Math.min(first, col); last = col; }
        for (let row = 0; row < 7; row++) if (bits & (1 << row)) L.g.fillRect(ch * 6 + col, row, 1, 1);
      }
      this.left[ch] = last < 0 ? 0 : first;
      this.width[ch] = last < 0 ? 2 : last - first + 1;
    }
    this.atlas = L.cv;
  },
  sheet(color) {
    let cv = this.tinted.get(color);
    if (!cv) {
      const L = makeLayer(96 * 6, 8);
      L.g.drawImage(this.atlas, 0, 0);
      L.g.globalCompositeOperation = 'source-in';
      L.g.fillStyle = EGA[color];
      L.g.fillRect(0, 0, L.w, L.h);
      cv = L.cv;
      this.tinted.set(color, cv);
    }
    return cv;
  },
  code(str, i) { const c = str.charCodeAt(i) - 32; return c >= 0 && c < 96 ? c : 31; },
  measure(str, mono) {
    if (mono) return str.length * 6 - 1;
    let w = 0;
    for (let i = 0; i < str.length; i++) w += this.width[this.code(str, i)] + 1;
    return Math.max(0, w - 1);
  },
  /* opts: align (0 left, 1 centre, 2 right), mono (fixed 6px cells), outline (register or -1), scale */
  draw(g, str, x, y, color, opts) {
    const o = opts || {}, scale = o.scale || 1, mono = !!o.mono;
    const total = this.measure(str, mono) * scale;
    let x0 = Math.round(o.align === 1 ? x - total / 2 : o.align === 2 ? x - total : x);
    if (o.outline !== undefined && o.outline >= 0) {
      const inner = { mono, scale };
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (dx || dy) this.draw(g, str, x0 + dx * scale, y + dy * scale, o.outline, inner);
      }
    }
    const sheet = this.sheet(color);
    for (let i = 0; i < str.length; i++) {
      const c = this.code(str, i);
      const sx = c * 6 + (mono ? 0 : this.left[c]), w = mono ? 5 : this.width[c];
      if (c !== 0) g.drawImage(sheet, sx, 0, w, 7, x0, y, w * scale, 7 * scale);
      x0 += (w + 1) * scale;
    }
    return total;
  },
};

/* Fit the canvas to the bezel using the largest whole-number device-pixel scale. */
function fitScreen() {
  const bezel = document.getElementById('bezel');
  const cs = getComputedStyle(bezel);
  const availW = bezel.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = bezel.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const dpr = window.devicePixelRatio || 1;
  let scale = Math.floor(Math.min((availW * dpr) / VIEW_W, (availH * dpr) / VIEW_H)) / dpr;
  if (!(scale >= 1 / dpr)) scale = Math.max(0.25, Math.min(availW / VIEW_W, availH / VIEW_H));
  canvas.style.width = VIEW_W * scale + 'px';
  canvas.style.height = VIEW_H * scale + 'px';
  document.documentElement.style.setProperty('--px', Math.max(1, Math.round(scale)) + 'px');
}

/* ==========================================================================
   2. ADLIB / OPL2-STYLE FM SYNTHESIZER
   Every melodic voice is a two-operator FM pair exactly like one OPL2 channel:
   a modulator oscillator drives the carrier's frequency through a GainNode whose
   gain is the modulation index (in Hz). The four OPL2 operator waveforms and the
   modulator self-feedback are reproduced as PeriodicWaves built by a small DFT.
   ========================================================================== */

const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

function buildOplWaves(ac) {
  const N = 1024, H = 48, waves = {};
  const shapes = {
    half: (p) => (p < Math.PI ? Math.sin(p) : 0),                         // OPL2 waveform 1
    abs: (p) => Math.abs(Math.sin(p)),                                    // OPL2 waveform 2
    pulse: (p) => (p % Math.PI < Math.PI / 2 ? Math.abs(Math.sin(p)) : 0), // OPL2 waveform 3
  };
  const feedback = { fb1: Math.PI / 4, fb2: Math.PI / 2, fb3: Math.PI * 0.85 };
  const table = (name) => {
    const x = new Float32Array(N);
    if (shapes[name]) {
      for (let n = 0; n < N; n++) x[n] = shapes[name]((n / N) * TAU);
    } else {                                    // self-modulating operator (OPL2 feedback)
      let y1 = 0, y2 = 0;
      for (let pass = 0; pass < 4; pass++) {
        for (let n = 0; n < N; n++) {
          const y = Math.sin((n / N) * TAU + feedback[name] * (y1 + y2) * 0.5);
          y2 = y1; y1 = y; x[n] = y;
        }
      }
    }
    return x;
  };
  for (const name of ['half', 'abs', 'pulse', 'fb1', 'fb2', 'fb3']) {
    const x = table(name), re = new Float32Array(H + 1), im = new Float32Array(H + 1);
    for (let k = 1; k <= H; k++) {
      let a = 0, b = 0;
      for (let n = 0; n < N; n++) {
        a += x[n] * Math.cos((TAU * k * n) / N);
        b += x[n] * Math.sin((TAU * k * n) / N);
      }
      re[k] = (2 * a) / N; im[k] = (2 * b) / N;
    }
    waves[name] = ac.createPeriodicWave(re, im);
  }
  return waves;
}

/* Instrument patches. FM fields: cw/mw operator waves, cm/mm frequency multiples,
   idx peak modulation index with its own envelope (ma, md, ms), a/d/s/r carrier envelope. */
const PATCHES = {
  steelpan: { cw: 'sine', mw: 'sine', cm: 1, mm: 2, idx: 2.6, ma: 0.002, md: 0.09, ms: 0.22, a: 0.003, d: 0.35, s: 0.12, r: 0.18, vol: 0.3, scoop: 18, uni: 4, ksl: 0.5 },
  marimba: { cw: 'sine', mw: 'sine', cm: 1, mm: 4, idx: 1.8, ma: 0.001, md: 0.04, ms: 0.05, a: 0.002, d: 0.22, s: 0.02, r: 0.12, vol: 0.36, ksl: 0.6 },
  brass: { cw: 'sine', mw: 'fb1', cm: 1, mm: 1, idx: 3.2, ma: 0.05, md: 0.15, ms: 0.6, a: 0.03, d: 0.1, s: 0.8, r: 0.12, vol: 0.24, vib: { rate: 5.5, depth: 10, delay: 0.2 }, ksl: 0.5 },
  reed: { cw: 'sine', mw: 'sine', cm: 1, mm: 2, idx: 1.5, ma: 0.03, md: 0.2, ms: 0.75, a: 0.04, d: 0.1, s: 0.85, r: 0.14, vol: 0.26, vib: { rate: 5, depth: 7, delay: 0.25 } },
  flute: { cw: 'sine', mw: 'sine', cm: 1, mm: 1, idx: 0.7, ma: 0.06, md: 0.2, ms: 0.5, a: 0.05, d: 0.1, s: 0.9, r: 0.16, vol: 0.3, vib: { rate: 5.2, depth: 9, delay: 0.18 } },

/* ==========================================================================
   3. STEP SEQUENCER / TRACKER
   A state-driven tracker clock: a coarse JS timer wakes up every 25 ms and
   schedules every step that falls inside a look-ahead window using sample-accurate
   AudioContext timestamps, so tempo never drifts with the browser's timers.
   ========================================================================== */

class Sequencer {
  constructor(synth) {
    this.synth = synth;
    this.state = 'stopped';            // 'stopped' | 'playing'
    this.song = null; this.tracks = [];
    this.step = 0; this.next = 0; this.stepDur = 0.125; this.transpose = 0; this.timer = 0;
    this.lookAhead = 0.14;
  }

  load(song, variantIndex) {
    const synth = this.synth, v = song.variants[variantIndex % song.variants.length];
    const mute = v.mute || [], swap = v.patch || {};
    this.song = song;
    this.transpose = v.t || 0;
    this.stepDur = 60 / (v.bpm || song.bpm) / song.spb;
    const now = synth.ac.currentTime;
    synth.delay.delayTime.setValueAtTime(song.echo.steps * this.stepDur, now);
    synth.echoFb.gain.setValueAtTime(song.echo.fb, now);
    this.tracks = song.tracks.filter((tr) => !mute.includes(tr.name)).map((tr) => {
      const at = Array.from({ length: tr.len }, () => []);
      if (tr.note) tr.note.forEach((s, i) => at[s].push(i));
      return { src: tr, patch: swap[tr.name] || tr.patch, at, strip: synth.makeStrip(tr, song.gain), last: 0, walk: 2 };
    });
  }

  play(song, variantIndex) {
    this.stop(0.25);
    this.load(song, variantIndex);
    this.step = 0;
    this.next = this.synth.ac.currentTime + 0.08;
    this.state = 'playing';
    this.timer = setInterval(() => this.tick(), 25);
  }

  stop(fade) {
    if (this.timer) { clearInterval(this.timer); this.timer = 0; }
    this.state = 'stopped';
    const now = this.synth.ac.currentTime, old = this.tracks;
    this.tracks = [];
    old.forEach((tr) => tr.strip.out.gain.setTargetAtTime(0, now, Math.max(0.01, fade / 3)));
    if (old.length) setTimeout(() => old.forEach((tr) => tr.strip.dispose()), fade * 1000 + 2500);
  }

  tick() {
    if (this.state !== 'playing') return;
    const now = this.synth.ac.currentTime;
    if (this.next < now - 0.05) this.next = now + 0.05;      // resync after a stalled tab
    while (this.next < now + this.lookAhead) {
      this.scheduleStep(this.step, this.next);
      this.step++;
      this.next += this.stepDur;
    }
  }

  /* Schedule every channel's events for one tracker row at audio time t. */
  scheduleStep(step, t0) {
    const synth = this.synth, song = this.song, tp = this.transpose;
    const t = t0 + (step & 1 ? song.swing * this.stepDur : 0);
    for (const tr of this.tracks) {
      const src = tr.src, dest = tr.strip.input;
      if (src.rand) {                               // generative channel: random walk over a scale
        const r = src.rand;
        if (step % r.every === 0 && Math.random() < r.prob) {
          tr.walk = clamp(tr.walk + ((Math.random() * 5) | 0) - 2, 0, r.scale.length - 1);
          const vel = (r.vel[0] + Math.random() * (r.vel[1] - r.vel[0])) / 127;
          synth.note(tr.patch, t, r.scale[tr.walk] + tp, r.dur * this.stepDur, vel, dest, 0, 0);
        }
        continue;
      }
      const kit = PATCHES[tr.patch].k === 'kit';
      for (const i of tr.at[step % src.len]) {
        const pitch = src.pitch[i], vel = src.vel[i] / 127, dur = src.dur[i] * this.stepDur;
        const bend = src.bend ? src.bend[i] : 0;
        if (Array.isArray(pitch)) {
          for (const n of pitch) synth.note(tr.patch, t, n + tp, dur, vel, dest, bend, 0);
        } else {
          const n = kit ? pitch : pitch + tp;
          synth.note(tr.patch, t, n, dur, vel, dest, bend, tr.last);
          tr.last = n;
        }
      }
    }
  }
}

/* ==========================================================================
   4. SOUND EFFECTS BANK
   Four dedicated FX channels, each with its own bit-crusher (staircase
   WaveShaper) and low-pass. A new effect steals the oldest / lowest-priority
   channel with a click-free fade, so the FX bus can never sum past four voices.
   ========================================================================== */

class FxBank {
  constructor(synth) {
    this.synth = synth; this.last = {};
    const ac = synth.ac;

      const crush = ac.createWaveShaper(), curve = new Float32Array(2049);

      crush.curve = curve;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5600;
      const out = ac.createGain(); out.gain.value = 0.42;
      crush.connect(lp); lp.connect(out); out.connect(synth.sfx);
      return { crush, voice: null, until: 0, pri: 0, born: 0 };
    });
  }

  /* Claim an FX channel; returns the voice bus to connect generators to (or null). */
  open(pri, dur) {
    const ac = this.synth.ac, now = ac.currentTime;
    let ch = this.channels.find((c) => c.until <= now);
    if (!ch) {
      ch = this.channels.reduce((a, b) => (b.pri < a.pri || (b.pri === a.pri && b.born < a.born) ? b : a));
      if (ch.pri > pri) return null;
      ch.voice.gain.setTargetAtTime(0, now, 0.004);
    }
    const voice = ac.createGain();
    voice.connect(ch.crush);
    ch.voice = voice; ch.until = now + dur; ch.pri = pri; ch.born = now;
    if (pri >= 2) {
      const duck = this.synth.duck.gain;
      duck.setTargetAtTime(0.6, now, 0.012);
      duck.setTargetAtTime(1, now + Math.min(dur, 0.6), 0.14);
    }
    return voice;
  }

  /* Swept tone. st > 0 quantises the sweep into st audible steps (arcade-style). */
  tone(v, t, w, f0, f1, d, vol, st) {
    const o = this.synth.osc(w, f0), g = this.synth.ac.createGain();
    o.frequency.setValueAtTime(f0, t);
    if (f1 && st) for (let k = 1; k <= st; k++) o.frequency.setValueAtTime(f0 * Math.pow(f1 / f0, k / st), t + (d * k) / st);
    else if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + d);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.003);
    g.gain.setTargetAtTime(0, t + d * 0.55, d * 0.16 + 0.004);
    o.connect(g); g.connect(v);
    o.start(t); o.stop(t + d + 0.08);
  }
  noise(v, t, type, f0, f1, q, d, vol) {
    const ac = this.synth.ac, src = ac.createBufferSource(), flt = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = this.synth.grit; src.loop = true;
    flt.type = type; flt.Q.value = q;
    flt.frequency.setValueAtTime(f0, t);
    if (f1) flt.frequency.exponentialRampToValueAtTime(f1, t + d);
    g.gain.setValueAtTime(vol, t);
    g.gain.setTargetAtTime(0, t + d * 0.4, d * 0.2 + 0.004);
    src.connect(flt); flt.connect(g); g.connect(v);
    src.start(t, (t * 3.7) % 0.8); src.stop(t + d + 0.1);
  }
  arp(v, t, notes, gap, w, vol, d) {
    notes.forEach((m, i) => this.tone(v, t + i * gap, w, mtof(m), 0, d || gap * 1.6, vol, 0));
  }

  play(name, o) {
    const fx = FxBank.RECIPES[name], ac = this.synth.ac, now = ac.currentTime;
    if (!fx || now - (this.last[name] || -1) < 0.034) return;
    this.last[name] = now;
    const v = this.open(fx[0], fx[1]);
    if (v) fx[2](this, v, now + 0.004, o || {});
  }
}

/* Facade used by the game: owns the AudioContext, created on the first user gesture. */
const Sound = {
  ac: null, synth: null, seq: null, fx: null, musicOn: true, current: -1, variant: 0,

  unlock() {
    if (!this.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ac = new AC();
      this.synth = new AdlibSynth(this.ac);
      this.seq = new Sequencer(this.synth);
      this.fx = new FxBank(this.synth);
      if (this.current >= 0 && this.musicOn) this.seq.play(SONGS[this.current], this.variant);
    }
    if (this.ac.state === 'suspended' && !this.held) this.ac.resume();
    return true;
  },
  song(index, variant) {
    if (index === this.current && variant === this.variant && this.seq && this.seq.state === 'playing') return;
    this.current = index; this.variant = variant;
    if (this.ac && this.musicOn) this.seq.play(SONGS[index], variant);
  },
  stopMusic(fade) {
    this.current = -1;
    if (this.seq) this.seq.stop(fade === undefined ? 0.4 : fade);
  },
  toggleMusic() {
    this.musicOn = !this.musicOn;
    if (!this.seq) return;
    if (!this.musicOn) this.seq.stop(0.15);
    else if (this.current >= 0) this.seq.play(SONGS[this.current], this.variant);
  },
  hold(paused) {
    this.held = paused;
    if (!this.ac) return;
    if (paused) this.ac.suspend(); else this.ac.resume();
  },
  sfx(name, o) { if (this.fx && this.ac.state === 'running') this.fx.play(name, o); },
  /* Brick hits are tuned to the current soundtrack's scale so play harmonises with the music. */
  scaleFreq(i) {
    const song = SONGS[this.current >= 0 ? this.current : 0], sc = song.scale;
    const tp = this.seq && this.seq.song === song ? this.seq.transpose : 0;
    const k = ((i % (sc.length * 2)) + sc.length * 2) % (sc.length * 2);
    return mtof(song.root + tp + 12 * ((k / sc.length) | 0) + sc[k % sc.length]);
  },
};

function loadHiscore() {
  try {
    const v = Number.parseInt(window.localStorage.getItem(HISCORE_KEY), 10);
    return Number.isFinite(v) ? clamp(v, 0, 99999999) : 0;
  } catch (e) { return 0; }
}
function saveHiscore() {
  try { window.localStorage.setItem(HISCORE_KEY, String(G.hiscore)); } catch (e) { /* storage unavailable */ }
}

function worldIndexOf(level) { return WORLDS.findIndex((w) => level >= w.from && level <= w.to); }
function say(text, sub, ink, t) { G.banner = { text, sub: sub || '', ink: ink === undefined ? C.WHITE : ink, t: t || 2.2 }; }

function addScore(n) {
  G.score += n * G.gold;
  if (G.score > G.hiscore) { G.hiscore = G.score; G.newHigh = true; }
  if (G.score >= G.nextLife) {
    G.nextLife += 50000;
    if (G.lives < 9) { G.lives++; Sound.sfx('life'); say('EXTRA LIFE!', '', C.YELLOW, 1.6); }
  }
}

function startGame(level) {
  G.score = 0; G.lives = 3; G.nextLife = 20000; G.newHigh = false;
  loadLevel(level);
}

function makeBrick(ch, armorHits) {
  if (ch === '.') return null;
  const lower = ch.toLowerCase();
  if (ch === '#') return { t: BK.STEEL, c: C.LGRAY, hp: 1, max: 1 };
  if (ch === '*') return { t: BK.GROG, c: C.LGREEN, hp: 1, max: 1 };
  if (ch === '!') return { t: BK.INSULT, c: C.LRED, hp: 1, max: 1 };
  if (ch === '@') return { t: BK.JOHN, c: C.LCYAN, hp: 1, max: 1 };
  if (ch === '^') return { t: BK.TRAP, c: C.TAN, hp: 2, max: 2, trapT: 4 + Math.random() * 5 };
  if (ch >= '1' && ch <= '8') return { t: BK.NOTE, c: NOTE_INKS[ch - 1], hp: 1, max: 1, note: Number(ch) };
  if (ch !== lower) return { t: BK.ARMOR, c: INK[lower], hp: armorHits, max: armorHits };
  return { t: BK.NORMAL, c: INK[ch], hp: 1, max: 1 };
}
const countsToClear = (b) => b.t !== BK.STEEL && b.t !== BK.JOHN && b.t !== BK.NOTE;
/* Causality: a brick from an earlier era still exists in every later one. */
const brickSolid = (b) => !b.era || b.era <= G.era;

/* Build the brick grid and per-level mechanics (also used for the menu preview). */
function buildLevel(n) {
  const def = LEVELS[n - 1], wi = worldIndexOf(n), world = WORLDS[wi];
  G.level = n; G.def = def; G.world = world; G.worldIndex = wi;
  G.armorHits = wi < 2 ? 2 : 3;
  G.grid = Array.from({ length: GRID_ROWS }, () => new Array(GRID_COLS).fill(null));
  const w = def.map[0].length, c0 = (GRID_COLS - w) >> 1;
  G.left = 0;
  def.map.forEach((row, r) => {
    for (let c = 0; c < w; c++) {
      const b = makeBrick(row[c], G.armorHits);
      if (!b) continue;
      b.flash = 0; b.era = 0;
      for (const e of def.eras || []) if (c >= e[1] && c <= e[3] && r >= e[2] && r <= e[4]) b.era = e[0];
      if (b.t === BK.JOHN) b.era = 0;
      G.grid[r + def.top][c + c0] = b;
      if (countsToClear(b)) G.left++;
    }
  });
  G.total = G.left;
  G.form = { x: 0, y: 0, vx: 0, t: 0, dir: 1, minX: -c0 * BRICK_W + 10, maxX: (GRID_COLS - c0 - w) * BRICK_W - 10 };
  G.caps = []; G.bolts = []; G.shots = []; G.parts = []; G.booms = []; G.floats = [];
  G.ramp = 0; G.slow = 0; G.pierce = 0; G.idle = 0; G.gold = 1; G.shake = 0; G.flash = 0;
  G.duel = null; G.era = 2; G.eraT = ERA_SECONDS;
  G.wells = (def.wells || []).map((q) => ({ x: q[0], y: q[1], r: q[2], k: q[3] }));
  G.draft = def.draft ? { name: def.draft.name, notes: def.draft.notes, spell: def.draft.spell, pos: 0, done: false } : null;
  G.boss = def.boss ? { shotT: 3, tauntT: 5, taunt: '', tauntShow: 0 } : null;
  G.paddle.mode = 'normal'; G.paddle.stun = 0; G.paddle.shrink = 0;
  G.balls = [];
}

function loadLevel(n) {
  buildLevel(n);
  serveBall();
  G.state = ST.PLAYING; G.t = 0; G.paused = false; G.lock = 0.6;
  say(`LEVEL ${n}`, G.def.name, C.YELLOW, 2.6);
  Sound.song(G.world.song, n - G.world.from);
}

function serveBall() {
  G.balls = [{ x: G.paddle.x + 5, y: PADDLE_Y - BALL_R, vx: 0, vy: 0, stuck: true, off: 5, hold: 0, idle: 0, serve: true }];
  G.ramp = 0; G.slow = 0; G.pierce = 0;
  G.paddle.mode = 'normal';
}

function ballSpeed() {
  let v = (130 + G.level * 1.1) * (1 + Math.min(G.ramp, 45) * 0.009);
  if (G.slow > 0) v *= 0.62;
  if (G.duel && !G.duel.result) v *= 0.7;
  return v;
}

/* ----- particles and floating text ----- */
function burst(x, y, ink, n, power) {
  for (let i = 0; i < n && G.parts.length < 260; i++) {
    const a = Math.random() * TAU, s = (0.3 + Math.random()) * (power || 40);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, life: 0.3 + Math.random() * 0.5, ink });
  }
}
function floatText(x, y, text, ink) { G.floats.push({ x, y, text, ink, life: 1.1 }); }

/* ----- brick damage, destruction, explosions ----- */
function brickCenter(c, r) {
  return [FIELD_L + G.form.x + c * BRICK_W + BRICK_W / 2, FIELD_T + G.form.y + r * BRICK_H + BRICK_H / 2];
}

/* Returns true when the brick was destroyed. src: 'ball' | 'bolt' | 'boom' | 'spell' */
function damageBrick(c, r, dmg, src) {
  const row = G.grid[r], b = row && row[c];
  if (!b || !brickSolid(b)) return false;
  const [x, y] = brickCenter(c, r);
  b.flash = 0.12;
  if (b.t === BK.STEEL) { if (src !== 'boom') Sound.sfx('steel'); return false; }
  if (b.t === BK.JOHN) { if (src === 'ball') flushTime(); return false; }
  if (b.t === BK.NOTE) { if (src === 'ball') hitNote(b); return false; }
  if (b.t === BK.TRAP && src === 'ball') fireDart(x, y + 4, true);
  b.hp -= dmg;
  if (b.hp > 0) {
    Sound.sfx('armor');
    burst(x, y, C.WHITE, 3, 30);
    addScore(20);
    return false;
  }
  row[c] = null;
  G.left--; G.idle = 0;
  burst(x, y, b.c, 5, 45);
  const value = { [BK.NORMAL]: 50, [BK.ARMOR]: 120, [BK.GROG]: 150, [BK.INSULT]: 200, [BK.TRAP]: 200 }[b.t];
  addScore(value);
  if (b.t === BK.GROG) {
    G.booms.push({ c, r, t: 0.07 });
  } else if (src !== 'boom') {
    Sound.sfx('brick', { f: Sound.scaleFreq(GRID_ROWS - r + (c % 3)) });
  }
  if (b.t === BK.INSULT && !G.duel) startDuel(x, y);
  if (src !== 'spell' && b.t !== BK.GROG && Math.random() < (src === 'boom' ? 0.05 : 0.13)) spawnCapsule(x, y);
  return true;
}

function explode(c, r) {
  const [x, y] = brickCenter(c, r);
  Sound.sfx('grog');
  G.shake = Math.max(G.shake, 0.25);
  burst(x, y, C.LGREEN, 10, 90); burst(x, y, C.YELLOW, 6, 70); burst(x, y, C.WHITE, 4, 50);
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (dr || dc) damageBrick(c + dc, r + dr, 99, 'boom');
  }
}

/* ----- power-up capsules ----- */
function spawnCapsule(x, y, forced) {
  if (G.caps.length >= 3 && !forced) return;
  let type = forced;
  if (!type) {
    const bag = Object.entries(CAPSULES);
    let roll = Math.random() * bag.reduce((s, e) => s + e[1], 0);
    for (const [k, wgt] of bag) { roll -= wgt; if (roll <= 0) { type = k; break; } }
    if (type === 'P' && G.lives >= 6) type = 'S';
  }
  G.caps.push({ x: clamp(x, FIELD_L + 8, FIELD_R - 8), y, type });
}

function applyCapsule(type) {
  const p = G.paddle, boss = !!G.boss;
  addScore(100);
  if (type === 'L') { p.mode = 'laser'; Sound.sfx('capsule'); say(boss ? 'ROOT BEER BLASTERS!' : 'SPACE-RANGER BLASTERS!', 'SPACE TO FIRE', C.LRED, 1.6); }
  else if (type === 'E') { p.mode = 'expand'; p.shrink = 0; Sound.sfx('expand'); say('RUBBER CHICKEN!', 'WITH A PULLEY IN THE MIDDLE', C.YELLOW, 1.6); }
  else if (type === 'C') { p.mode = 'catch'; Sound.sfx('catch'); say('MAGNETIC COMPASS!', 'SPACE TO RELEASE', C.LCYAN, 1.6); }
  else if (type === 'S') { G.slow = 10; G.ramp = Math.max(0, G.ramp - 12); Sound.sfx('slow'); say('HOURGLASS!', 'TIME SLOWS DOWN', C.TAN, 1.6); }
  else if (type === 'P') { if (G.lives < 9) G.lives++; Sound.sfx('life'); say('GOLD GUY!', 'EXTRA LIFE', C.GOLD, 1.6); }
  if (type !== 'C') G.balls.forEach((b) => { if (b.stuck && !b.serve) releaseBall(b); });
}

function releaseBall(b) {
  const p = G.paddle, rel = clamp(b.off / (p.w / 2), -1, 1), ang = rel * 1.05, v = ballSpeed();
  b.stuck = false; b.serve = false; b.hold = 0;
  b.vx = Math.sin(ang) * v; b.vy = -Math.cos(ang) * v;
}

/* ==========================================================================
   8. WORLD MECHANICS
   ========================================================================== */

/* ----- World 1: insult sword fighting ----- */
function startDuel(x, y) {
  const pick = (Math.random() * INSULTS.length) | 0;
  const wrong = INSULTS.map((_, i) => i).filter((i) => i !== pick).sort(() => Math.random() - 0.5).slice(0, 2);
  const texts = [[INSULTS[pick][1], true], [INSULTS[wrong[0]][1], false], [INSULTS[wrong[1]][1], false]].sort(() => Math.random() - 0.5);
  const inks = [C.YELLOW, C.LCYAN, C.LMAGENTA], lanes = [FIELD_L + 44, FIELD_L + 120, FIELD_L + 196].sort(() => Math.random() - 0.5);
  G.duel = {
    q: INSULTS[pick][0], result: '', t: 0,
    opts: texts.map((o, i) => ({ text: o[0], ok: o[1], ink: inks[i], tag: 'ABC'[i], x: lanes[i], y: 22 - i * 8, alive: true })),
  };
  Sound.sfx('duel');
  say('INSULT SWORD FIGHT!', 'CATCH THE RIGHT COMEBACK', C.LRED, 1.8);
}

function updateDuel(dt) {
  const d = G.duel, p = G.paddle;
  d.t += dt;
  if (d.result) { if (d.t > 2.2) G.duel = null; return; }
  let alive = 0;
  for (const o of d.opts) {
    if (!o.alive) continue;
    o.y += 16 * dt;
    if (o.y > VIEW_H + 6) { o.alive = false; continue; }
    alive++;
    if (o.y > PADDLE_Y - 5 && o.y < PADDLE_Y + PADDLE_H + 4 && Math.abs(o.x - p.x) < p.w / 2 + 6) {
      d.opts.forEach((q) => { q.alive = false; });
      d.t = 0;
      if (o.ok) {
        d.result = 'win'; G.pierce = 9; addScore(1000);
        Sound.sfx('win'); say('TOUCHE!', 'CUTLASS BALL: SLICES THROUGH BRICKS', C.LGREEN, 2.2);
        floatText(p.x, PADDLE_Y - 12, '+1000', C.YELLOW);
      } else {
        d.result = 'lose'; p.shrink = 10; if (p.mode === 'expand') p.mode = 'normal';
        Sound.sfx('wrong'); say('OUT-INSULTED!', 'YOUR PADDLE SHRINKS IN SHAME', C.LRED, 2.2);
      }
      return;
    }
  }
  if (!alive) { d.result = 'none'; d.t = 1.4; }
}

/* ----- World 2: time travel ----- */
function eraPlayable(era) {
  return G.grid.some((row) => row.some((b) => b && b.era <= era && countsToClear(b)));
}
function flushTime() {
  G.era = (G.era % 3) + 1;
  for (let hop = 0; hop < 2 && !eraPlayable(G.era); hop++) G.era = (G.era % 3) + 1;   // skip eras with nothing left to hit
  G.eraT = ERA_SECONDS; G.flash = 0.18;
  Sound.sfx('flush');
  say('FLUSH!', `WELCOME TO ${ERA_NAMES[G.era]}`, C.LCYAN, 1.5);
}

/* ----- World 3 and boss: projectiles ----- */
function fireDart(x, y, aimed) {
  const p = G.paddle, dx = aimed ? clamp((p.x - x) * 0.35, -30, 30) : 0;
  G.shots.push({ x, y, vx: dx, vy: 88, kind: 'dart' });
  Sound.sfx('dart');
}
function updateTraps(dt) {
  for (let r = 0; r < GRID_ROWS; r++) for (let c = 0; c < GRID_COLS; c++) {
    const b = G.grid[r][c];
    if (!b || b.t !== BK.TRAP) continue;
    b.trapT -= dt;
    if (b.trapT <= 0) {
      const [x, y] = brickCenter(c, r);
      fireDart(x, y + 4, false);
      b.trapT = 5 + Math.random() * 5;
    }
  }
}
function stunPaddle(t) {
  G.paddle.stun = t; G.shake = Math.max(G.shake, 0.2);
  Sound.sfx('stun');
}

/* ----- World 5: Loom drafts ----- */
function hitNote(b) {
  const d = G.draft, tp = Sound.seq ? Sound.seq.transpose : 0;
  Sound.sfx('chime', { midi: NOTE_MIDI[b.note - 1] + tp });
  b.flash = 0.35;
  if (!d || d.done) return;
  if (b.note === d.notes[d.pos]) {
    d.pos++;
    if (d.pos === d.notes.length) castSpell();
  } else if (b.note === d.notes[0]) {
    d.pos = 1;
  }
}
function unmake(count) {
  const cells = [];
  for (let r = 0; r < GRID_ROWS; r++) for (let c = 0; c < GRID_COLS; c++) {
    const b = G.grid[r][c];
    if (b && countsToClear(b)) cells.push([c, r]);
  }
  cells.sort(() => Math.random() - 0.5).slice(0, count).forEach(([c, r], i) => G.booms.push({ c, r, t: 0.2 + i * 0.04, spell: true }));
}
function castSpell() {
  const d = G.draft, tp = Sound.seq ? Sound.seq.transpose : 0;
  d.done = true; G.flash = 0.2;
  Sound.sfx('spell', { notes: d.notes.map((n) => NOTE_MIDI[n - 1] + tp) });
  addScore(2000);
  const open = () => {
    for (let r = 0; r < GRID_ROWS; r++) for (let c = 0; c < GRID_COLS; c++) {
      const b = G.grid[r][c];
      if (b && b.t === BK.STEEL) { G.grid[r][c] = null; const [x, y] = brickCenter(c, r); burst(x, y, C.LCYAN, 4, 50); }
    }
  };
  const spells = {
    open: ['STEEL UNRAVELS INTO THREAD', open],
    gold: ['STRAW INTO GOLD: DOUBLE SCORE', () => {
      G.gold = 2;
      G.grid.forEach((row) => row.forEach((b) => { if (b && b.t === BK.ARMOR) { b.t = BK.NORMAL; b.hp = b.max = 1; b.c = C.GOLD; } }));
    }],
    multi: ['YOUR BALL IS MIRRORED', () => {
      const src = G.balls.find((b) => !b.stuck) || G.balls[0];
      for (const a of [-0.5, 0.5]) {
        const v = ballSpeed(), ang = Math.atan2(src.vx || 0.3, -(src.vy || -1)) + a;
        G.balls.push({ x: src.x, y: src.y, vx: Math.sin(ang) * v, vy: -Math.abs(Math.cos(ang) * v) - 20, stuck: false, off: 0, hold: 0, idle: 0, serve: false });
      }
    }],
    unmake: ['THE WALL COMES UNDONE', () => unmake(28)],
    heal: ['A LIFE IS RESTORED', () => { if (G.lives < 9) G.lives++; }],
    all: ['THE PATTERN IS REWOVEN', () => { open(); unmake(18); if (G.lives < 9) G.lives++; }],
  };
  const [text, fn] = spells[d.spell];
  fn();
  say(`DRAFT OF ${d.name}!`, text, C.LCYAN, 2.6);
}

/* ----- Worlds 6 and 7: travelling walls and the LeChuck boss ----- */
function updateFormation(dt) {
  const m = G.def.motion, f = G.form;
  if (!m) return;
  const rage = G.boss ? 1 - G.left / G.total : 0, prev = f.x;
  if (m.type === 'sway') {
    f.t += dt * (1 + rage * 1.3);
    const amp = Math.min(m.amp, f.maxX, -f.minX);
    f.x = Math.sin((f.t / m.period) * TAU) * amp;
  } else {
    f.x += m.speed * f.dir * dt;
    if (f.x > f.maxX) { f.x = f.maxX; f.dir = -1; }
    if (f.x < f.minX) { f.x = f.minX; f.dir = 1; }
  }
  f.vx = (f.x - prev) / dt;
}

function updateBoss(dt) {
  const boss = G.boss, rage = 1 - G.left / G.total;
  if (!G.balls.some((b) => !b.stuck)) return;
  boss.shotT -= dt; boss.tauntT -= dt; boss.tauntShow -= dt;
  if (boss.shotT <= 0) {
    boss.shotT = 3 - rage * 1.3;
    const x = FIELD_L + G.form.x + 15 * BRICK_W, y = FIELD_T + (G.def.top + 12) * BRICK_H;
    const speed = 72 + rage * 36, spread = rage > 0.6 && Math.random() < 0.35 ? [-0.5, 0, 0.5] : [0];
    const base = Math.atan2(G.paddle.x - x, PADDLE_Y - y);
    for (const a of spread) G.shots.push({ x, y, vx: Math.sin(base + a) * speed, vy: Math.cos(base + a) * speed, kind: 'fire' });
    Sound.sfx('bossShot');
  }
  if (boss.tauntT <= 0) {
    boss.tauntT = 9 + Math.random() * 5;
    boss.taunt = TAUNTS[(Math.random() * TAUNTS.length) | 0];
    boss.tauntShow = 3;
  }
}

/* ==========================================================================
   9. PHYSICS AND PER-TICK SIMULATION
   ========================================================================== */

function setSpeed(b, v) {
  const m = Math.hypot(b.vx, b.vy) || 1;
  b.vx = (b.vx / m) * v; b.vy = (b.vy / m) * v;
}

/* Keep trajectories playable: never flatter than ~16 degrees, and break up endless loops. */
function afterBounce(b, v) {
  b.idle++;
  if (b.idle > 26) {
    const a = (Math.random() - 0.5) * 0.3, cs = Math.cos(a), sn = Math.sin(a), x = b.vx;
    b.vx = x * cs - b.vy * sn; b.vy = x * sn + b.vy * cs; b.idle = 0;
  }
  const minY = v * 0.28;
  if (Math.abs(b.vy) < minY) {
    b.vy = (b.vy < 0 ? -1 : 1) * minY;
    b.vx = (b.vx < 0 ? -1 : 1) * Math.sqrt(v * v - minY * minY);
  }
  setSpeed(b, v);
}

/* Gravity wells steer the ball without changing its speed. Because the turn rate is
   k/r * (1 - d/r) per pixel travelled with k < 4, no closed orbit can ever form. */
function wellPull(b, v, ds) {
  for (const w of G.wells) {
    const dx = w.x - b.x, dy = w.y - b.y, d = Math.hypot(dx, dy);
    if (d >= w.r || d < 0.5) continue;
    const cross = (b.vx * dy - b.vy * dx) / (v * d);
    const a = (w.k / w.r) * (1 - d / w.r) * cross * ds, cs = Math.cos(a), sn = Math.sin(a), x = b.vx;
    b.vx = x * cs - b.vy * sn; b.vy = x * sn + b.vy * cs;
  }
}

/* Circle vs AABB against the brick grid (in formation space). The deepest contact is
   resolved first and the test is repeated, so a seam between two bricks acts as a flat
   wall, an exposed corner reflects about the true corner normal, and the ball is always
   pushed fully out of the brick: it can never tunnel or clip through. */
function collideBricks(b, v) {
  const f = G.form, R = BALL_R;
  for (let pass = 0; pass < 3; pass++) {
    const lx = b.x - FIELD_L - f.x, ly = b.y - FIELD_T - f.y;
    const c0 = Math.floor((lx - R) / BRICK_W), c1 = Math.floor((lx + R) / BRICK_W);
    const r0 = Math.floor((ly - R) / BRICK_H), r1 = Math.floor((ly + R) / BRICK_H);
    let best = null, pen = 0, nx = 0, ny = 0, bc = 0, br = 0;
    for (let r = Math.max(0, r0); r <= r1 && r < GRID_ROWS; r++) {
      for (let c = Math.max(0, c0); c <= c1 && c < GRID_COLS; c++) {
        const k = G.grid[r][c];
        if (!k || !brickSolid(k)) continue;
        const x0 = c * BRICK_W, y0 = r * BRICK_H;
        const dx = lx - clamp(lx, x0, x0 + BRICK_W), dy = ly - clamp(ly, y0, y0 + BRICK_H);
        const d2 = dx * dx + dy * dy;
        if (d2 >= R * R) continue;
        let p, ux, uy;
        if (d2 > 1e-8) {
          const d = Math.sqrt(d2);
          p = R - d; ux = dx / d; uy = dy / d;
        } else {                                    // centre inside the brick: least-penetration axis
          const l = lx - x0, rr = x0 + BRICK_W - lx, t = ly - y0, bt = y0 + BRICK_H - ly, m = Math.min(l, rr, t, bt);
          if (m === t) { ux = 0; uy = -1; } else if (m === bt) { ux = 0; uy = 1; } else if (m === l) { ux = -1; uy = 0; } else { ux = 1; uy = 0; }
          p = m + R;
        }
        if (p > pen) { pen = p; best = k; nx = ux; ny = uy; bc = c; br = r; }
      }
    }
    if (!best) return;
    const soft = best.t !== BK.STEEL && best.t !== BK.JOHN && best.t !== BK.NOTE;
    if (G.pierce > 0 && soft) {                     // cutlass ball slices straight through
      damageBrick(bc, br, 99, 'ball');
      continue;
    }
    b.x += nx * pen; b.y += ny * pen;
    const rvx = b.vx - f.vx, dot = rvx * nx + b.vy * ny;
    if (dot < 0) {
      b.vx = rvx - 2 * dot * nx + f.vx; b.vy -= 2 * dot * ny;
      afterBounce(b, v);
    }
    damageBrick(bc, br, 1, 'ball');
    if (best.t === BK.NORMAL || best.hp <= 0) b.idle = 0;
  }
}

function collidePaddle(b, v) {
  const p = G.paddle;
  if (b.vy <= 0 || b.y + BALL_R < PADDLE_Y || b.y >= PADDLE_Y + PADDLE_H) return;
  if (Math.abs(b.x - p.x) > p.w / 2 + BALL_R) return;
  const rel = clamp((b.x - p.x) / (p.w / 2), -1, 1);
  b.y = PADDLE_Y - BALL_R; b.idle = 0;
  G.ramp++;
  if (p.mode === 'catch') {
    b.stuck = true; b.off = clamp(b.x - p.x, -p.w / 2, p.w / 2); b.hold = 0;
    Sound.sfx('catch');
    return;
  }
  const ang = rel * 1.05;
  b.vx = Math.sin(ang) * v; b.vy = -Math.cos(ang) * v;
  Sound.sfx('paddle', { pos: rel });
}

/* Advance one ball; returns false when it has fallen off the bottom. */
function moveBall(b, dt) {
  const p = G.paddle;
  if (b.stuck) {
    b.x = clamp(p.x + b.off, FIELD_L + BALL_R, FIELD_R - BALL_R); b.y = PADDLE_Y - BALL_R;
    if (!b.serve) { b.hold += dt; if (b.hold > 3.5) releaseBall(b); }
    return true;
  }
  const v = ballSpeed();
  setSpeed(b, v);
  const steps = Math.max(1, Math.ceil(v * dt)), ds = (v * dt) / steps;   // sub-steps of at most 1px
  for (let i = 0; i < steps && !b.stuck; i++) {
    if (G.wells.length) wellPull(b, v, ds);
    b.x += (b.vx / v) * ds; b.y += (b.vy / v) * ds;
    if (b.x < FIELD_L + BALL_R) { b.x = FIELD_L + BALL_R; b.vx = Math.abs(b.vx); afterBounce(b, v); Sound.sfx('wall'); }
    else if (b.x > FIELD_R - BALL_R) { b.x = FIELD_R - BALL_R; b.vx = -Math.abs(b.vx); afterBounce(b, v); Sound.sfx('wall'); }
    if (b.y < FIELD_T + BALL_R) { b.y = FIELD_T + BALL_R; b.vy = Math.abs(b.vy); afterBounce(b, v); Sound.sfx('wall'); }
    collideBricks(b, v);
    collidePaddle(b, v);
    if (b.y - BALL_R > VIEW_H + 4) return false;
  }
  return true;
}

function updatePaddle(dt) {
  const p = G.paddle, target = p.shrink > 0 ? 20 : p.mode === 'expand' ? 48 : 32;
  p.w += clamp(target - p.w, -90 * dt, 90 * dt);
  p.shrink = Math.max(0, p.shrink - dt); p.cool -= dt;
  if (p.stun > 0) p.stun -= dt;
  else if (Input.axis) { p.x += Input.axis * 210 * dt; Input.mouseOn = false; }
  else if (Input.mouseOn) p.x += (Input.mouseX - p.x) * Math.min(1, dt * 32);
  p.x = clamp(p.x, FIELD_L + p.w / 2, FIELD_R - p.w / 2);

  const pressed = Input.takeFire();
  if (pressed && G.lock <= 0) G.balls.forEach((b) => { if (b.stuck) releaseBall(b); });
  if (p.mode === 'laser' && p.stun <= 0 && (pressed || Input.held) && p.cool <= 0 && G.bolts.length < 8) {
    p.cool = 0.24;
    G.bolts.push({ x: p.x - p.w / 2 + 3, y: PADDLE_Y - 3 }, { x: p.x + p.w / 2 - 3, y: PADDLE_Y - 3 });
    Sound.sfx('laser');
  }
}

function loseLife() {
  G.lives--;
  G.caps = []; G.bolts = []; G.shots = []; G.duel = null;
  G.paddle.stun = 0; G.paddle.shrink = 0; G.shake = 0.3;
  burst(G.paddle.x, PADDLE_Y, C.LRED, 16, 80);
  if (G.lives <= 0) {
    G.lives = 0; G.state = ST.OVER; G.t = 0; G.balls = [];
    Sound.stopMusic(0.3); Sound.sfx('over');
    saveHiscore();
    return;
  }
  Sound.sfx('lose');
  serveBall();
}

function levelCleared() {
  G.state = ST.CLEAR; G.t = 0;
  G.bonus = 500 + G.level * 100 + G.lives * 100;
  addScore(G.bonus);
  G.shots = []; G.caps = []; G.bolts = []; G.duel = null;
  Sound.stopMusic(0.3);
  Sound.sfx(G.boss ? 'bossDie' : 'clear');
  saveHiscore();
}

function updateParticles(dt) {
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const q = G.parts[i];
    q.life -= dt; q.vy += 160 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.life <= 0) G.parts.splice(i, 1);
  }
  for (let i = G.floats.length - 1; i >= 0; i--) {
    const q = G.floats[i];
    q.life -= dt; q.y -= 14 * dt;
    if (q.life <= 0) G.floats.splice(i, 1);
  }
  G.shake = Math.max(0, G.shake - dt); G.flash = Math.max(0, G.flash - dt);
  G.banner.t = Math.max(0, G.banner.t - dt);
}

function updatePlaying(dt) {
  const p = G.paddle, mech = G.world.mech;
  const flying = G.balls.some((b) => !b.stuck);
  updatePaddle(dt);
  updateFormation(dt);
  G.slow = Math.max(0, G.slow - dt); G.pierce = Math.max(0, G.pierce - dt); G.lock = Math.max(0, G.lock - dt);
  if (flying) G.idle += dt;
  if (G.duel) updateDuel(dt);
  if (mech === 'time' && flying) { G.eraT -= dt; if (G.eraT <= 0) flushTime(); }
  if (mech === 'traps' && flying) updateTraps(dt);
  if (G.boss) updateBoss(dt);

  for (let i = G.balls.length - 1; i >= 0; i--) if (!moveBall(G.balls[i], dt)) G.balls.splice(i, 1);

  for (let i = G.bolts.length - 1; i >= 0; i--) {
    const q = G.bolts[i];
    q.y -= 320 * dt;
    const c = Math.floor((q.x - FIELD_L - G.form.x) / BRICK_W), r = Math.floor((q.y - FIELD_T - G.form.y) / BRICK_H);
    const k = r >= 0 && r < GRID_ROWS && c >= 0 && c < GRID_COLS ? G.grid[r][c] : null;
    if (k && brickSolid(k)) { damageBrick(c, r, 1, 'bolt'); burst(q.x, q.y, C.YELLOW, 2, 30); G.bolts.splice(i, 1); }
    else if (q.y < FIELD_T) G.bolts.splice(i, 1);
  }
  for (let i = G.caps.length - 1; i >= 0; i--) {
    const q = G.caps[i];
    q.y += 34 * dt;
    if (q.y > PADDLE_Y - 4 && q.y < PADDLE_Y + PADDLE_H + 4 && Math.abs(q.x - p.x) < p.w / 2 + 7) { applyCapsule(q.type); G.caps.splice(i, 1); }
    else if (q.y > VIEW_H + 8) G.caps.splice(i, 1);
  }
  for (let i = G.shots.length - 1; i >= 0; i--) {
    const q = G.shots[i];
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.y > PADDLE_Y - 2 && q.y < PADDLE_Y + PADDLE_H + 2 && Math.abs(q.x - p.x) < p.w / 2 + 2) {
      stunPaddle(q.kind === 'fire' ? 0.9 : 0.8);
      burst(q.x, q.y, q.kind === 'fire' ? C.ORANGE : C.LGREEN, 8, 60);
      G.shots.splice(i, 1);
    } else if (q.y > VIEW_H + 6 || q.x < FIELD_L || q.x > FIELD_R) G.shots.splice(i, 1);
  }
  for (let i = G.booms.length - 1; i >= 0; i--) {
    const q = G.booms[i];
    q.t -= dt;
    if (q.t > 0) continue;
    G.booms.splice(i, 1);
    if (q.spell) damageBrick(q.c, q.r, 99, 'spell'); else explode(q.c, q.r);
  }
  for (const row of G.grid) for (const k of row) if (k && k.flash > 0) k.flash -= dt;

  /* mercy drop: when only a few stubborn bricks remain, send down the blasters */
  if (G.left <= 8 && G.idle > 9 && !G.caps.length && p.mode !== 'laser') { spawnCapsule(p.x, FIELD_T + 16, 'L'); G.idle = 0; }

  if (G.left <= 0 && !G.booms.length) levelCleared();
  else if (!G.balls.length) loseLife();
}

/* ==========================================================================
   10. PARALLAX EGA BACKDROPS (one per world, generated procedurally)
   Each backdrop is a stack of pre-rendered layers wider than the playfield; they
   slide by different amounts as the paddle moves, and some scroll on their own.
   ========================================================================== */

const BG_W = FIELD_W + 32, BG_H = VIEW_H - FIELD_T;

function scatterStars(g, rng, n, inks, h) {
  for (let i = 0; i < n; i++) pset(g, rng() * BG_W, rng() * h, inks[(rng() * inks.length) | 0]);
}
/* Random-walk skyline filled down to the bottom of the layer. */
function ridge(g, rng, base, amp, step, ink, inkDither) {
  let y = base;
  for (let x = 0; x < BG_W; x += step) {
    y = clamp(y + (rng() - 0.5) * amp, base - amp * 2, base + amp * 2);
    if (inkDither === undefined) rect(g, x, y, step, BG_H - y, ink);
    else dither(g, x, y | 0, step, BG_H - (y | 0), ink, inkDither, 6);
  }
}
/* Pixel-exact triangle (no anti-aliasing, so the palette stays pure EGA). */
function peak(g, cx, top, halfBase, height, ink) {
  for (let y = 0; y < height; y++) {
    const half = Math.round((halfBase * (y + 1)) / height);
    rect(g, cx - half, top + y, half * 2, 1, ink);
  }
}
function litWindows(g, rng, x, y, w, h, n, ink) {
  for (let i = 0; i < n; i++) rect(g, x + ((rng() * w) | 0), y + ((rng() * h) | 0), 1, 2, ink);
}

const Backdrop = {
  cache: [],
  layers(world) {
    if (!this.cache[world]) this.cache[world] = BACKDROPS[world](makeRng(4200 + world * 97));

  draw(g, world, parallax, time) {

      if (L.scroll) {
        const off = Math.floor(time * L.scroll) % BG_H;
        g.drawImage(L.cv, sx, 0, FIELD_W, BG_H - off, FIELD_L, FIELD_T + off, FIELD_W, BG_H - off);
        if (off) g.drawImage(L.cv, sx, BG_H - off, FIELD_W, off, FIELD_L, FIELD_T, FIELD_W, off);
      } else {
        g.drawImage(L.cv, sx, 0, FIELD_W, BG_H, FIELD_L, FIELD_T, FIELD_W, BG_H);

const Tiles = {
  cache: new Map(),
  /* Build (or fetch) the 8x6 tile for a brick state. */
  get(b, frame, ghost) {
    const stage = b.max - b.hp, hot = b.t === BK.TRAP && b.trapT < 0.7 ? 1 : 0;
    const key = `${b.t}:${b.c}:${stage}:${ghost ? 9 : frame}:${hot}:${b.flash > 0 ? 1 : 0}:${b.note || 0}`;
    let cv = this.cache.get(key);
    if (!cv) { cv = this.paint(b, stage, frame, ghost, hot); this.cache.set(key, cv); }
    return cv;
  },
  paint(b, stage, frame, ghost, hot) {
    const L = makeLayer(BRICK_W, BRICK_H), g = L.g, W = BRICK_W, H = BRICK_H;
    const base = b.flash > 0 ? C.WHITE : b.c;
    const hi = base === C.BLACK ? C.DGRAY : egaShade(base, 1), lo = egaShade(base, -1);
    if (ghost) {                                    // phased out of the current era: stippled echo
      const ink = base === C.BLACK ? C.DGRAY : base;
      for (let y = 0; y < H; y++) for (let x = (y & 1); x < W; x += 2) pset(g, x, y, ink);
      return L.cv;
    }
    rect(g, 0, 0, W, H, base);
    rect(g, 0, 0, W, 1, hi); rect(g, 0, 0, 1, H, hi);
    rect(g, 0, H - 1, W, 1, lo); rect(g, W - 1, 0, 1, H, lo);
    const dots = (list, ink) => list.forEach((q) => pset(g, q[0], q[1], ink));
    switch (b.t) {
      case BK.ARMOR: {
        const crack = base === C.BLACK ? C.LGRAY : C.BLACK;
        rect(g, 1, 1, W - 2, 1, hi); dots([[1, 1], [W - 2, H - 2]], C.WHITE); dots([[W - 2, 1], [1, H - 2]], lo);
        if (stage >= 1) dots([[2, 1], [3, 2], [3, 3], [4, 4], [2, 4]], crack);
        if (stage >= 2) dots([[5, 1], [5, 2], [6, 3], [1, 3], [4, 3], [5, 4]], crack);
        break;
      }
      case BK.STEEL:
        dither(g, 1, 1, W - 2, H - 2, C.LGRAY, C.WHITE, 5);
        rect(g, 0, 0, W, 1, C.WHITE); rect(g, 0, H - 1, W, 1, C.DGRAY); rect(g, W - 1, 0, 1, H, C.DGRAY);
        dots([[1, 1], [W - 2, 1], [1, H - 2], [W - 2, H - 2]], C.DGRAY);
        break;
      case BK.GROG:
        rect(g, 1, 1, W - 2, 1, C.CREAM); rect(g, 0, 0, W, 1, C.WHITE);
        dots(frame ? [[2, 3], [5, 2], [4, 4]] : [[2, 2], [5, 4], [3, 4]], C.GREEN);
        dots(frame ? [[6, 3]] : [[1, 3]], C.YELLOW);
        break;
      case BK.INSULT:
        dots([[1, 1], [2, 2], [3, 3], [4, 4], [6, 1], [5, 2], [4, 3], [3, 4], [2, 4], [5, 4]], C.WHITE);
        dots([[1, 4], [6, 4]], C.YELLOW);
        break;
      case BK.JOHN:
        rect(g, 1, 1, W - 2, H - 2, frame ? C.BLUE : C.DBLUE);
        dots([[3, 1], [4, 1], [2, 2], [5, 2], [2, 3], [5, 3], [3, 4], [4, 4]], C.WHITE);
        dots(frame ? [[3, 2], [4, 3]] : [[4, 2], [3, 3]], C.LCYAN);
        break;
      case BK.TRAP:
        dots([[2, 2], [5, 2]], hot ? C.LRED : C.MAROON);
        rect(g, 2, 4, 4, 1, C.BLACK); dots([[1, 1], [6, 1]], C.BRONZE);
        if (stage >= 1) dots([[3, 1], [4, 2], [3, 3], [6, 3]], C.BLACK);
        break;
      case BK.NOTE:
        rect(g, 1, 1, W - 2, H - 2, C.BLACK);
        dots([[4, 1], [5, 1], [4, 2], [4, 3], [2, 3], [3, 3], [2, 4], [3, 4]], b.flash > 0 ? C.WHITE : b.c);
        break;
      default:
    }
    return L.cv;
  },
};

function drawPaddle(g, time) {
  const p = G.paddle, w = Math.round(p.w), x = Math.round(p.x - w / 2), y = PADDLE_Y;
  if (p.stun > 0 && ((time * 20) | 0) % 2) { rect(g, x, y + 1, w, PADDLE_H - 2, C.DGRAY); return; }
  if (p.mode === 'expand') {                        // the rubber chicken (with a pulley in the middle)
    rect(g, x + 2, y, w - 4, PADDLE_H, C.YELLOW); rect(g, x + 2, y, w - 4, 1, C.CREAM); rect(g, x + 2, y + 5, w - 4, 1, C.ORANGE);
    rect(g, x, y + 1, 3, 3, C.ORANGE); rect(g, x + 3, y - 2, 4, 2, C.LRED); pset(g, x + 5, y + 2, C.BLACK);
    rect(g, x + w - 3, y + 1, 3, 1, C.ORANGE); rect(g, x + w - 3, y + 4, 3, 1, C.ORANGE);
    rect(g, x + (w >> 1) - 2, y + 1, 4, 4, C.LGRAY); rect(g, x + (w >> 1) - 1, y + 2, 2, 2, C.DGRAY);
    return;
  }
  const cap = p.mode === 'catch' ? C.LCYAN : p.shrink > 0 ? C.MAGENTA : C.LRED;
  rect(g, x + 2, y, w - 4, PADDLE_H, C.LGRAY); rect(g, x + 2, y, w - 4, 1, C.WHITE); rect(g, x + 2, y + 5, w - 4, 1, C.DGRAY);
  rect(g, x, y + 1, 5, 4, cap); rect(g, x + w - 5, y + 1, 5, 4, cap);
  rect(g, x + 1, y, 3, 1, egaShade(cap, 1)); rect(g, x + w - 4, y, 3, 1, egaShade(cap, 1));
  rect(g, x + 1, y + 5, 3, 1, egaShade(cap, -1)); rect(g, x + w - 4, y + 5, 3, 1, egaShade(cap, -1));
  if (p.mode === 'laser') {                         // space-ranger blasters
    rect(g, x + 2, y - 3, 2, 4, C.DGRAY); rect(g, x + w - 4, y - 3, 2, 4, C.DGRAY);
    pset(g, x + 2, y - 4, C.YELLOW); pset(g, x + w - 4, y - 4, C.YELLOW);
  }
  if (p.mode === 'catch') {                         // compass needle
    rect(g, x + (w >> 1) - 3, y + 2, 3, 2, C.LRED); rect(g, x + (w >> 1), y + 2, 3, 2, C.LBLUE);
  }
}

function drawWell(g, w, time) {
  const turns = 3;
  for (let i = 0; i < 44; i++) {
    const f = i / 44, a = f * TAU * turns - time * 2.2, rad = f * w.r;
    for (let arm = 0; arm < 2; arm++) {
      const ang = a + arm * Math.PI;
      pset(g, w.x + Math.cos(ang) * rad, w.y + Math.sin(ang) * rad * 0.8, f < 0.35 ? C.LMAGENTA : f < 0.7 ? C.VIOLET : C.INDIGO);
    }
  }
  rect(g, w.x - 1, w.y - 1, 3, 3, C.BLACK); pset(g, w.x, w.y - 2, C.WHITE); pset(g, w.x, w.y + 2, C.WHITE);
  pset(g, w.x - 2, w.y, C.WHITE); pset(g, w.x + 2, w.y, C.WHITE);
}

/* ==========================================================================
   12. RENDERER: PLAYFIELD, HUD PANEL AND STATE OVERLAYS
   ========================================================================== */

const MID = FIELD_L + FIELD_W / 2;
const EPITAPHS = [
  'YOU HAVE BEEN KEELHAULED.', 'THE TENTACLES TOOK OVER THE WORLD.', 'ATLANTIS KEEPS ITS SECRETS.',
  'YOU ARE ONE WITH THE VACUUM.', 'THE PATTERN HAS UNRAVELLED.', 'CASE CLOSED, LITTLE BUDDY.',
  'LECHUCK PICKS HIS TEETH WITH YOUR PADDLE.',
];
const Menu = { level: 1 };

function label(g, text, x, y, ink, scale) { Font.draw(g, text, x, y, ink, { align: 1, outline: C.BLACK, scale: scale || 1 }); }

function drawBricks(g, time) {
  const fx = FIELD_L + Math.round(G.form.x), frame = ((time * 3) | 0) & 1, d = G.draft;
  const want = d && !d.done ? d.notes[d.pos] : 0, blink = ((time * 6) | 0) & 1;
  for (let r = 0; r < GRID_ROWS; r++) {
    const row = G.grid[r];
    for (let c = 0; c < GRID_COLS; c++) {
      const b = row[c];
      if (!b) continue;
      const x = fx + c * BRICK_W, y = FIELD_T + r * BRICK_H;
      g.drawImage(Tiles.get(b, frame, !brickSolid(b)), x, y);
      if (want && b.note === want && blink) { rect(g, x, y, BRICK_W, 1, C.WHITE); rect(g, x, y + BRICK_H - 1, BRICK_W, 1, C.WHITE); }
    }
  }
}

function drawField(g, time, playing) {
  Backdrop.draw(g, G.worldIndex, clamp((G.paddle.x - MID) / 120, -1, 1), time);
  if (G.worldIndex === 6) {                         // lava flicker in LeChuck's lair
    for (let x = FIELD_L; x < FIELD_R; x += 3) pset(g, x + ((time * 9 + x) & 1), 196 + (((time * 5 + x * 7) | 0) % 3), ((x + (time * 6 | 0)) % 5) ? C.RED : C.ORANGE);
  }
  for (const w of G.wells) drawWell(g, w, time);
  drawBricks(g, time);
  if (!playing) return;
  for (const q of G.caps) g.drawImage(Sprites.caps[q.type], Math.round(q.x - 9), Math.round(q.y - 4));
  const beer = !!G.boss;
  for (const q of G.bolts) { rect(g, q.x - 1, q.y - 4, 2, 5, beer ? C.ORANGE : C.YELLOW); rect(g, q.x - 1, q.y - 5, 2, 1, C.WHITE); }
  for (const q of G.shots) {
    if (q.kind === 'dart') { rect(g, q.x, q.y - 4, 1, 5, C.LGRAY); rect(g, q.x - 1, q.y, 3, 2, C.LGREEN); pset(g, q.x, q.y - 5, C.LRED); }
    else {
      const f = ((time * 14) | 0) & 1;
      rect(g, q.x - 2, q.y - 2, 5, 5, f ? C.ORANGE : C.LRED); rect(g, q.x - 1, q.y - 1, 3, 3, C.YELLOW);
      pset(g, q.x - 1, q.y, C.BLACK); pset(g, q.x + 1, q.y, C.BLACK); rect(g, q.x - 1 + f, q.y - 4, 2, 2, C.LRED);
    }
  }
  drawPaddle(g, time);
  for (const b of G.balls) {
    if (G.pierce > 0 && !b.stuck) pset(g, b.x - b.vx * 0.03, b.y - b.vy * 0.03, C.ORANGE);
    g.drawImage(G.pierce > 0 ? Sprites.cutlass : Sprites.ball, Math.round(b.x) - 2, Math.round(b.y) - 2);
  }
  for (const q of G.parts) pset(g, q.x, q.y, q.ink);
  for (const q of G.floats) label(g, q.text, q.x, q.y, q.ink);
}

function drawFrame(g) {
  const [hi, mid, lo] = G.world.frame;
  const pipe = (x, y, w, h, vertical) => {
    rect(g, x, y, w, h, mid);
    if (vertical) { rect(g, x + 1, y, 2, h, hi); rect(g, x + w - 2, y, 2, h, lo); rect(g, x, y, 1, h, lo); }
    else { rect(g, x, y + 1, w, 2, hi); rect(g, x, y + h - 2, w, 2, lo); rect(g, x, y, w, 1, lo); }
  };
  pipe(0, 0, FIELD_L, VIEW_H, true); pipe(FIELD_R, 0, 8, VIEW_H, true); pipe(0, 0, FIELD_R + 8, FIELD_T, false);
  for (let y = 20; y < VIEW_H; y += 24) { rect(g, 0, y, 8, 2, lo); rect(g, FIELD_R, y, 8, 2, lo); pset(g, 3, y + 5, C.BLACK); pset(g, FIELD_R + 3, y + 5, C.BLACK); }
  for (let x = 20; x < FIELD_R; x += 24) rect(g, x, 0, 2, 8, lo);
  rect(g, 0, 0, 8, 8, lo); rect(g, 1, 1, 6, 6, mid); rect(g, 2, 2, 2, 2, hi);
  rect(g, FIELD_R, 0, 8, 8, lo); rect(g, FIELD_R + 1, 1, 6, 6, mid); rect(g, FIELD_R + 2, 2, 2, 2, hi);
}

function drawHud(g, time) {
  const x0 = 258, cx = 288, level = G.state === ST.MENU ? Menu.level : G.level;
  const world = WORLDS[worldIndexOf(level)], mech = world.mech;
  dither(g, 256, 0, 64, VIEW_H, C.BLACK, C.NAVY, 4);
  rect(g, 256, 0, 1, VIEW_H, C.BLACK);
  const text = (s, y, ink, mono) => Font.draw(g, s, cx, y, ink, { align: 1, mono });
  text('GROGANOID', 3, C.ORANGE);
  rect(g, x0, 12, 60, 1, C.BRONZE);
  text('SCORE', 16, C.LGRAY); text(String(G.score).padStart(7, '0'), 25, C.WHITE, true);
  text('HI-SCORE', 37, C.LGRAY); text(String(G.hiscore).padStart(7, '0'), 46, C.YELLOW, true);
  text('LEVEL', 58, C.LGRAY); text(`${String(level).padStart(2, '0')}/33`, 67, C.LCYAN, true);
  rect(g, x0, 78, 60, 1, C.BRONZE);
  let line = '', y = 82;                           // word-wrap the world name
  for (const word of world.name.split(' ')) {
    if (line && Font.measure(`${line} ${word}`) > 60) { text(line, y, world.frame[0]); y += 9; line = word; } else line = line ? `${line} ${word}` : word;
  }
  text(line, y, world.frame[0]);
  text('LIVES', 104, C.LGRAY);
  for (let i = 0; i < G.lives; i++) { const lx = x0 + 2 + (i % 5) * 12, ly = 114 + ((i / 5) | 0) * 5; rect(g, lx, ly, 9, 3, C.LGRAY); rect(g, lx, ly, 2, 3, C.LRED); rect(g, lx + 7, ly, 2, 3, C.LRED); }
  rect(g, x0, 126, 60, 1, C.BRONZE);
  const bar = (yy, f, ink) => { rect(g, x0 + 4, yy, 52, 4, C.DGRAY); rect(g, x0 + 5, yy + 1, Math.round(50 * clamp(f, 0, 1)), 2, ink); };
  if (mech === 'insult') { text('CUTLASS', 130, C.LGRAY); bar(140, G.pierce / 9, C.YELLOW); text(G.duel && !G.duel.result ? 'EN GARDE!' : 'HIT RED X', 148, C.LRED); }
  else if (mech === 'time') { text(ERA_NAMES[G.era].slice(4), 130, [0, C.TAN, C.LGREEN, C.LMAGENTA][G.era]); bar(140, G.eraT / ERA_SECONDS, C.LCYAN); text('NEXT FLUSH', 148, C.LGRAY); }
  else if (mech === 'traps') { text('BEWARE', 130, C.LGRAY); text('THE DARTS', 139, C.LRED); if (G.paddle.stun > 0) text('STUNNED!', 148, C.LGREEN); }
  else if (mech === 'gravity') { text('GRAVITY', 130, C.LGRAY); text(`WELLS: ${G.wells.length}`, 139, C.VIOLET); }
  else if (mech === 'loom') {
    const d = G.draft;
    text('DRAFT OF', 130, C.LGRAY); text(d ? d.name : '', 139, C.LCYAN);
    if (d) d.notes.forEach((n, i) => Font.draw(g, d.done ? '~' : NOTE_NAMES[n - 1], x0 + 9 + i * 13, 149, d.done || i < d.pos ? NOTE_INKS[n - 1] : C.DGRAY, { align: 1 }));
  }
  else if (mech === 'road') { text('ROAD TRIP', 130, C.LGRAY); text('TO NOWHERE', 139, C.YELLOW); }
  else { text('LECHUCK', 130, C.LRED); bar(140, G.left / Math.max(1, G.total), C.LRED); if (G.paddle.stun > 0) text('SCORCHED!', 148, C.ORANGE); }
  rect(g, x0, 160, 60, 1, C.BRONZE);
  const mode = { laser: 'L', expand: 'E', catch: 'C' }[G.paddle.mode];
  if (mode && G.state === ST.PLAYING) g.drawImage(Sprites.caps[mode], x0 + 2, 164);
  if (G.slow > 0) { g.drawImage(Sprites.caps.S, x0 + 40, 164); }
  if (G.gold > 1) text('SCORE x2', 164, C.GOLD);
  const song = SONGS[world.song].name, tick = ((time * 14) | 0) % (Font.measure(song) + 70);
  g.save(); g.beginPath(); g.rect(x0, 180, 60, 18); g.clip();
  Font.draw(g, '~ MUSIC', x0 + 30, 181, Sound.musicOn ? C.LGRAY : C.DGRAY, { align: 1 });
  Font.draw(g, Sound.musicOn ? song : 'MUSIC OFF (M)', x0 + 62 - tick, 190, Sound.musicOn ? C.LGREEN : C.DGRAY);
  g.restore();
}

function drawOverlay(g, time) {
  const blink = ((time * 2.5) | 0) & 1, d = G.duel, bn = G.banner;
  if (G.state === ST.MENU) {
    const def = LEVELS[Menu.level - 1];
    Font.draw(g, 'GROGANOID', MID, 114, C.ORANGE, { align: 1, scale: 3, outline: C.BLACK });
    label(g, 'THE SECRET OF BRICK ISLAND', MID, 138, C.CREAM);
    label(g, `${blink ? '<' : ' '} LEVEL ${Menu.level}: ${def.name} ${blink ? '>' : ' '}`, MID, 158, C.YELLOW);
    label(g, 'LEFT/RIGHT: PICK A LEVEL   1-7: SOUND TEST', MID, 169, C.LGRAY);
    if (blink) label(g, 'PRESS SPACE OR CLICK TO PLAY', MID, 182, C.WHITE);
    return;
  }
  if (G.state === ST.PLAYING) {
    if (d && !d.result) {
      label(g, d.q, MID, 124, C.LRED);
      d.opts.forEach((o, i) => { if (o.alive) label(g, `${o.tag}: ${o.text}`, MID, 136 + i * 10, o.ink); });
      for (const o of d.opts) {                     // falling comeback bubbles, drawn over the dialogue
        if (!o.alive) continue;
        const x = Math.round(o.x), y = Math.round(o.y);
        rect(g, x - 8, y - 6, 17, 12, C.BLACK); rect(g, x - 7, y - 5, 15, 10, o.ink); rect(g, x - 6, y - 4, 13, 8, C.WHITE);
        rect(g, x - 2, y + 5, 5, 2, C.BLACK); rect(g, x - 1, y + 5, 3, 1, o.ink);
        Font.draw(g, o.tag, x, y - 3, C.BLACK, { align: 1 });
      }
    }
    if (G.boss && G.boss.tauntShow > 0) label(g, G.boss.taunt, MID, 124, C.LGREEN);
    if (bn.t > 0 && !(d && !d.result && bn.t < 1)) {
      const big = Font.measure(bn.text) * 2 <= FIELD_W - 8 ? 2 : 1, yy = d && !d.result ? 98 : 132;
      label(g, bn.text, MID, yy, bn.ink, big);
      if (bn.sub) label(g, bn.sub, MID, yy + 7 * big + 4, C.WHITE);
    } else if (G.balls.some((b) => b.serve) && blink) {
      label(g, 'SPACE OR CLICK TO LAUNCH', MID, 150, C.WHITE);
      label(g, G.world.hint, MID, 161, G.world.frame[0]);
    }
    if (G.paused) { rect(g, MID - 50, 86, 100, 30, C.BLACK); rect(g, MID - 49, 87, 98, 28, C.NAVY); label(g, 'PAUSED', MID, 91, C.YELLOW, 2); label(g, 'P TO RESUME', MID, 107, C.WHITE); }
    return;
  }
  if (G.state === ST.CLEAR) {
    label(g, G.level === 33 ? 'LECHUCK IS TOAST!' : 'LEVEL CLEAR!', MID, 120, C.YELLOW, 2);
    label(g, `BONUS ${G.bonus}`, MID, 142, C.WHITE);
    const next = WORLDS[worldIndexOf(G.level + 1)];
    if (next && next !== G.world && G.t > 1) label(g, `NEXT: ${next.name}`, MID, 156, next.frame[0]);
    return;
  }
  if (G.state === ST.OVER) {
    label(g, 'GAME OVER', MID, 96, C.LRED, 3);
    label(g, EPITAPHS[G.worldIndex], MID, 126, C.CREAM);
    label(g, `SCORE ${G.score}   LEVEL ${G.level}`, MID, 142, C.WHITE);
    if (G.newHigh) label(g, 'A NEW HIGH SCORE!', MID, 154, C.YELLOW);
    if (blink && G.t > 1.2) label(g, 'PRESS SPACE OR CLICK', MID, 172, C.WHITE);
    return;
  }
  label(g, 'VICTORY!', MID, 24, C.YELLOW, 3);
  const lines = ['YOU DEFEATED THE GHOST PIRATE LECHUCK', 'AND UNCOVERED THE SECRET OF BRICK ISLAND.', '', `FINAL SCORE ${G.score}`,
    G.newHigh ? 'A NEW HIGH SCORE!' : '', '', 'NEVER PAY MORE THAN 20 BUCKS', 'FOR A COMPUTER BRICK.'];
  lines.forEach((s, i) => { if (s && G.t > 0.6 + i * 0.5) label(g, s, MID, 58 + i * 11, i === 3 ? C.LCYAN : i === 4 ? C.YELLOW : C.CREAM); });
  if (blink && G.t > 6) label(g, 'PRESS SPACE OR CLICK', MID, 172, C.WHITE);
}

function render(time) {
  const g = ctx, playing = G.state !== ST.MENU && G.state !== ST.VICTORY;
  const sh = G.shake > 0 ? Math.round(Math.sin(time * 90) * 2) : 0;
  g.save();
  g.translate(sh, G.shake > 0 ? Math.round(Math.cos(time * 70)) : 0);
  drawField(g, time, playing);
  if (G.state === ST.VICTORY) for (const q of G.parts) pset(g, q.x, q.y, q.ink);
  g.restore();
  if (G.flash > 0) {                                // EGA-style white stipple flash
    g.fillStyle = EGA[C.WHITE];
    for (let y = FIELD_T + (((time * 60) | 0) & 1); y < VIEW_H; y += 2) g.fillRect(FIELD_L, y, FIELD_W, 1);
  }
  drawFrame(g);
  drawHud(g, time);
  drawOverlay(g, time);
}

/* ==========================================================================
   13. INPUT, STATE MACHINE AND MAIN LOOP
   ========================================================================== */

const Input = {
  left: false, right: false, axis: 0, key: false, ptr: false, fire: false, mouseX: MID, mouseOn: false,
  get held() { return this.key || this.ptr; },
  takeFire() { const f = this.fire; this.fire = false; return f; },
};

function selectLevel(n) {
  Menu.level = ((n - 1 + LEVELS.length) % LEVELS.length) + 1;
  buildLevel(Menu.level);
  Sound.sfx('select');
  Sound.song(G.world.song, Menu.level - G.world.from);
}

function toMenu() {
  G.state = ST.MENU; G.t = 0; G.paused = false;
  G.parts = []; G.floats = []; G.shake = 0; G.banner.t = 0;
  Menu.level = clamp(G.level, 1, LEVELS.length);
  buildLevel(Menu.level);
  Sound.song(G.world.song, Menu.level - G.world.from);
}

function victory() {
  G.state = ST.VICTORY; G.t = 0;
  G.grid.forEach((row) => row.fill(null));
  G.balls = []; G.wells = []; G.form.x = 0;
  saveHiscore();
  Sound.song(0, 5);
}

function setPaused(on) {
  if (G.state !== ST.PLAYING || G.paused === on) return;
  G.paused = on;
  Sound.hold(on);
}

function fireworks(dt, every) {
  if (Math.random() < dt / every) {
    const inks = [C.YELLOW, C.LRED, C.LGREEN, C.LCYAN, C.LMAGENTA, C.WHITE, C.ORANGE];
    burst(FIELD_L + 20 + Math.random() * (FIELD_W - 40), FIELD_T + 16 + Math.random() * 90, inks[(Math.random() * inks.length) | 0], 26, 85);
    Sound.sfx('grog');
  }
}

function tick(dt) {
  G.time += dt; G.t += dt;
  updateParticles(dt);
  if (G.state === ST.PLAYING) { updatePlaying(dt); return; }
  const pressed = Input.takeFire();
  if (G.state === ST.MENU) {
    if (pressed) { Sound.sfx('start'); startGame(Menu.level); }
  } else if (G.state === ST.CLEAR) {
    if (G.boss) fireworks(dt, 0.3);
    if (G.t > (G.boss ? 5 : 3.4)) { if (G.level >= LEVELS.length) victory(); else loadLevel(G.level + 1); }
  } else if (G.state === ST.OVER) {
    if (pressed && G.t > 1.2) toMenu();
  } else {
    fireworks(dt, 0.45);
    if (pressed && G.t > 6) toMenu();
  }
}

function onKey(e, down) {
  const k = e.code;
  if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === 'Space') e.preventDefault();
  if (k === 'ArrowLeft' || k === 'KeyA') Input.left = down;
  if (k === 'ArrowRight' || k === 'KeyD') Input.right = down;
  Input.axis = (Input.right ? 1 : 0) - (Input.left ? 1 : 0);
  if (!down) { if (k === 'Space' || k === 'Enter') Input.key = false; return; }
  if (k === 'Space' || k === 'Enter') {
    if (G.paused) { if (!e.repeat) setPaused(false); return; }
    Input.key = true;
    if (!e.repeat) Input.fire = true;
  }
  Sound.unlock();
  if (G.state === ST.MENU) {
    if (k === 'ArrowLeft' || k === 'KeyA') selectLevel(Menu.level - 1);
    else if (k === 'ArrowRight' || k === 'KeyD') selectLevel(Menu.level + 1);
    else if (k === 'ArrowUp') selectLevel(Menu.level + 6);
    else if (k === 'ArrowDown') selectLevel(Menu.level - 6);
    else if (/^Digit[1-7]$/.test(k)) selectLevel(WORLDS[Number(k[5]) - 1].from);
  }
  if (e.repeat) return;
  if (k === 'KeyP' || k === 'Escape') setPaused(!G.paused);
  else if (k === 'KeyM') Sound.toggleMusic();
  else if (k === 'KeyF') {
    const root = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (root.requestFullscreen) {
      const request = root.requestFullscreen();
      if (request && request.catch) request.catch(() => {});
    }
  }
}

function onPointer(e) {
  const box = canvas.getBoundingClientRect();
  Input.mouseX = ((e.clientX - box.left) / box.width) * VIEW_W;
  Input.mouseOn = true;
  return ((e.clientY - box.top) / box.height) * VIEW_H;
}

function boot() {
  Font.init();
  Sprites.init();
  G.hiscore = loadHiscore();
  buildLevel(1);
  fitScreen();
  window.addEventListener('resize', fitScreen);
  window.addEventListener('keydown', (e) => onKey(e, true));
  window.addEventListener('keyup', (e) => onKey(e, false));
  window.addEventListener('pointermove', onPointer);
  window.addEventListener('pointerup', () => { Input.ptr = false; });
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    canvas.focus();
    Sound.unlock();
    const y = onPointer(e), x = Input.mouseX;
    if (G.state === ST.MENU && y > 152 && y < 168 && (x < 70 || x > 186)) { selectLevel(Menu.level + (x < 70 ? -1 : 1)); return; }
    if (G.paused) { setPaused(false); return; }
    Input.ptr = true; Input.fire = true;
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('blur', () => { Input.left = Input.right = Input.key = Input.ptr = false; Input.axis = 0; setPaused(true); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { setPaused(true); Sound.hold(true); } else if (!G.paused) Sound.hold(false);
  });

  let last = 0, acc = 0, clock = 0;
  const frame = (ts) => {
    const dt = Math.min(0.1, (ts - last) / 1000 || 0);
    last = ts; clock += dt;
    if (!G.paused) {
      acc += dt;
      while (acc >= STEP) { tick(STEP); acc -= STEP; }
    }
    render(clock);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

boot();
</script>
