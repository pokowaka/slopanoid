<!DOCTYPE html>

<title>Arkanoid: The Secret of Brick Island</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #060608; overflow: hidden; font-family: "Courier New", Courier, monospace; }
  #cabinet { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, #1c1c26 0%, #0b0b10 55%, #030304 100%); }
  #marquee { color: #ffaa00; letter-spacing: 3px; font-size: 11px; text-transform: uppercase; margin-bottom: 10px;
    text-shadow: 0 0 6px #ff5500, 0 0 14px #aa3300; user-select: none; }
  #bezel { position: relative; padding: 16px; border-radius: 12px;
    background: linear-gradient(145deg, #2e2e38 0%, #15151b 45%, #0c0c10 100%);
    border: 3px solid #4a4a58;
    box-shadow: 0 0 0 5px #000, 0 0 0 9px #33333f, 0 0 0 11px #000, 0 25px 70px rgba(0,0,0,0.85), inset 0 0 40px #000; }
  #bezel::before { content: ""; position: absolute; left: 8px; right: 8px; top: 8px; bottom: 8px; border-radius: 8px;
    border: 1px solid #5a5a6a; pointer-events: none; }

    box-shadow: 0 0 24px rgba(85,120,255,0.18), inset 0 0 0 1px #000; }
  #hint { color: #6a6a7a; font-size: 10px; margin-top: 10px; letter-spacing: 1px; user-select: none; }
  #hint b { color: #a0a0b4; }
</style>
</head>
<body>
<div id="cabinet">
  <div id="marquee">&#9733; Arkanoid &middot; The Secret of Brick Island &#9733;</div>
  <div id="bezel"><canvas id="screen" width="320" height="200"></canvas></div>
  <div id="hint"><b>MOUSE</b> / <b>&larr; &rarr;</b> / <b>A D</b> move &nbsp;&middot;&nbsp; <b>SPACE</b> launch / fire &nbsp;&middot;&nbsp; <b>P</b> pause &nbsp;&middot;&nbsp; <b>M</b> mute</div>
</div>
<script>
'use strict';
/* =====================================================================================
   ARKANOID: THE SECRET OF BRICK ISLAND
   A single-file EGA-styled brick breaker with an OPL2-flavoured Web Audio FM engine.
   ===================================================================================== */

// ------------------------------------------------------------------ constants
const W = 320, H = 200;              // virtual EGA resolution
const PX = 8, PY = 8, PW = 240, PH = 192, PR = PX + PW;   // playfield
const BX = 8, BY = 16, BW = 12, BH = 8, COLS = 20, ROWS = 14; // brick grid
const HUDX = 256;
const PADDLE_Y = 184;

// ------------------------------------------------------------------ EGA palette (64 hardware registers: rgbRGB)
const EGA = [];
for (let i = 0; i < 64; i++) {
  const r = ((i >> 2) & 1) * 0xAA + ((i >> 5) & 1) * 0x55;
  const g = ((i >> 1) & 1) * 0xAA + ((i >> 4) & 1) * 0x55;
  const b = (i & 1) * 0xAA + ((i >> 3) & 1) * 0x55;
  EGA.push('#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join(''));
}
// Classic default 16-colour register set
const C16 = [0, 1, 2, 3, 4, 5, 20, 7, 56, 57, 58, 59, 60, 61, 62, 63];
const K = {
  BLACK: 0, BLUE: 1, GREEN: 2, CYAN: 3, RED: 4, MAGENTA: 5, BROWN: 20, LGRAY: 7,
  DGRAY: 56, LBLUE: 57, LGREEN: 58, LCYAN: 59, LRED: 60, LMAGENTA: 61, YELLOW: 62, WHITE: 63,
  ORANGE: 52, PEACH: 46, TAN: 14, SKY: 43, VIOLET: 33, LAVENDER: 29, DKGREEN: 16, OLIVE: 48,
  NAVY: 8, GOLD: 38, PINK: 53, DKRED: 32, DKBLUE: 9, DKCYAN: 24, DKMAG: 40, MIDBLUE: 11, SEA: 19
};
const pal = i => EGA[i & 63];
const lighter = i => (i | 0x38) & 63;
const darker = i => (i & 0x07);

// ------------------------------------------------------------------ 3x5 bitmap font
const FONT = {
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111',
  F: '111100110100100', G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010',
  K: '101101110101101', L: '100100100100111', M: '101111111101101', N: '110101101101101', O: '010101101101010',
  P: '110101110100100', Q: '010101101111011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
  U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101', Y: '101101010010010',
  Z: '111001010100111', '0': '111101101101111', '1': '010110010010111', '2': '110001010100111', '3': '110001010001110',
  '4': '101101111001001', '5': '111100110001110', '6': '011100110101010', '7': '111001010010010', '8': '010101010101010',
  '9': '010101011001110', '.': '000000000000010', ',': '000000000010100', '!': '010010010000010', '?': '110001010000010',
  ':': '000010000010000', '-': '000000111000000', "'": '010010000000000', '&': '010101010101011', '/': '001001010100100',
  '+': '000010111010000', '"': '101101000000000', '(': '001010010010001', ')': '100010010010100', '%': '101001010100101',
  '<': '001010100010001', '>': '100010001010100', '_': '000000000000111', '=': '000111000111000', '*': '101010111010101',
  '#': '101111101111101', ' ': '000000000000000'
};

// ------------------------------------------------------------------ utilities
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const TAU = Math.PI * 2;

let seedState = 1234567;
function srand(seed) { seedState = seed >>> 0 || 1; }
function srnd() { // deterministic LCG for backgrounds
  seedState = (seedState * 1664525 + 1013904223) >>> 0;
  return seedState / 4294967296;
}

// =====================================================================================
//  AUDIO: OPL2-flavoured FM synthesizer, step sequencer and FX channels
// =====================================================================================
const AU = (() => {
  let ctx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;
  let echoIn = null, echoDelay = null, echoFb = null;
  let muted = false, ready = false;
  let song = null, songId = -1, step = 0, nextTime = 0, timer = null, songGain = null;

  const NOTE = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
  const noteFreq = n => {
    const m = /^([A-G]#?)(\d)$/.exec(n);
    return 440 * Math.pow(2, (NOTE[m[1]] + (parseInt(m[2], 10) - 4) * 12 - 9) / 12);
  };

  // ---------------------------------------------------------------- wave shaping curves
  function softClip(k) {
    const n = 1024, c = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = (1 + k) * x / (1 + k * Math.abs(x)); }
    return c;
  }
  function bitCrush(levels) {
    const n = 2048, c = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = Math.round(x * levels) / levels; }
    return c;
  }

  function init() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.9;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 20; comp.ratio.value = 6; comp.attack.value = 0.004; comp.release.value = 0.2;
    master.connect(comp); comp.connect(ctx.destination);

    // music channel group
    musicBus = ctx.createGain(); musicBus.gain.value = 0.55;
    const mComp = ctx.createDynamicsCompressor(); mComp.threshold.value = -18; mComp.ratio.value = 4; mComp.attack.value = 0.01; mComp.release.value = 0.25;
    musicBus.connect(mComp); mComp.connect(master);

    // echo send (used by pads, chimes and soaring leads)
    echoIn = ctx.createGain(); echoIn.gain.value = 1;
    echoDelay = ctx.createDelay(2.0); echoDelay.delayTime.value = 0.375;
    echoFb = ctx.createGain(); echoFb.gain.value = 0.35;
    const echoLp = ctx.createBiquadFilter(); echoLp.type = 'lowpass'; echoLp.frequency.value = 2600;
    const echoWet = ctx.createGain(); echoWet.gain.value = 0.45;
    echoIn.connect(musicBus);
    echoIn.connect(echoDelay); echoDelay.connect(echoLp); echoLp.connect(echoFb); echoFb.connect(echoDelay);
    echoLp.connect(echoWet); echoWet.connect(musicBus);

    // dedicated FX channel: bit-crusher -> soft clip -> own compressor -> master
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.8;
    const crush = ctx.createWaveShaper(); crush.curve = bitCrush(24); crush.oversample = 'none';
    const clip = ctx.createWaveShaper(); clip.curve = softClip(1.5);
    const sComp = ctx.createDynamicsCompressor(); sComp.threshold.value = -10; sComp.ratio.value = 8; sComp.attack.value = 0.002; sComp.release.value = 0.12;
    sfxBus.connect(crush); crush.connect(clip); clip.connect(sComp); sComp.connect(master);

    // white noise buffer (2 s)
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    ready = true;
    return true;
  }
  function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }

  // ---------------------------------------------------------------- instrument patches (2-operator style)
  const PATCH = {
    // --- Monkey Island
    steelpan:  { t: 'fm', cw: 'sine', mw: 'sine', ratio: 3.01, idx: 2.4, idxDec: 0.12, idxSus: 0.08, a: 0.002, d: 0.38, s: 0.12, r: 0.3, vol: 0.5 },
    skank:     { t: 'fm', cw: 'square', mw: 'sine', ratio: 2, idx: 0.5, idxDec: 0.05, idxSus: 0.2, a: 0.003, d: 0.09, s: 0.25, r: 0.05, vol: 0.12, lp: 2600 },
    reggaeBass:{ t: 'bass', vol: 0.62, lp0: 900, lp1: 150, lpDec: 0.18, a: 0.005, d: 0.3, s: 0.5, r: 0.08, sub: 0.45 },
    // --- Day of the Tentacle
    marchLead: { t: 'fm', cw: 'square', mw: 'sine', ratio: 1, idx: 1.3, idxDec: 0.1, idxSus: 0.45, a: 0.004, d: 0.1, s: 0.6, r: 0.06, vol: 0.2, vib: 1.1, vibR: 8, lp: 5200 },
    tuba:      { t: 'bass', vol: 0.58, lp0: 700, lp1: 200, lpDec: 0.12, a: 0.01, d: 0.2, s: 0.4, r: 0.08, wave: 'sawtooth', sub: 0.3 },
    pah:       { t: 'fm', cw: 'triangle', mw: 'sine', ratio: 3, idx: 0.6, idxDec: 0.05, idxSus: 0.1, a: 0.002, d: 0.1, s: 0, r: 0.05, vol: 0.2 },
    // --- Atlantis
    pad:       { t: 'pad', vol: 0.17, a: 1.1, r: 1.4, det: 9, lp0: 250, lp1: 1700, lpT: 2.2 },
    hum:       { t: 'bass', vol: 0.5, lp0: 220, lp1: 90, lpDec: 1.6, a: 0.6, d: 1.0, s: 0.8, r: 1.2, sub: 0.7 },
    chime:     { t: 'fm', cw: 'sine', mw: 'sine', ratio: 5.02, idx: 1.6, idxDec: 0.25, idxSus: 0.05, a: 0.002, d: 0.9, s: 0, r: 0.7, vol: 0.3 },
    // --- Space combat
    spaceLead: { t: 'fm', cw: 'sawtooth', mw: 'sine', ratio: 1, idx: 0.9, idxDec: 0.3, idxSus: 0.4, a: 0.02, d: 0.2, s: 0.7, r: 0.15, vol: 0.2, vib: 0.5, vibR: 5.5, vibDelay: 0.2, bend: 2, bendT: 0.07, lp: 4500 },
    spaceBass: { t: 'bass', vol: 0.55, lp0: 1900, lp1: 170, lpDec: 0.08, a: 0.002, d: 0.12, s: 0.3, r: 0.03, sub: 0.3 },
    pluck:     { t: 'fm', cw: 'sine', mw: 'sine', ratio: 2, idx: 3, idxDec: 0.06, idxSus: 0.05, a: 0.001, d: 0.13, s: 0, r: 0.05, vol: 0.17 },
    // --- Loom
    flute:     { t: 'fm', cw: 'sine', mw: 'sine', ratio: 1, idx: 0.45, idxDec: 0.3, idxSus: 0.6, a: 0.04, d: 0.2, s: 0.8, r: 0.12, vol: 0.24, vib: 0.3, vibR: 5, vibDelay: 0.25 },
    oboe:      { t: 'fm', cw: 'sine', mw: 'sine', ratio: 2, idx: 1.4, idxDec: 0.2, idxSus: 0.7, a: 0.03, d: 0.1, s: 0.75, r: 0.1, vol: 0.17 },
    harp:      { t: 'fm', cw: 'triangle', mw: 'sine', ratio: 3, idx: 1.0, idxDec: 0.1, idxSus: 0.1, a: 0.002, d: 0.5, s: 0.1, r: 0.2, vol: 0.2 },
    cello:     { t: 'bass', vol: 0.42, lp0: 420, lp1: 280, lpDec: 0.4, a: 0.06, d: 0.3, s: 0.8, r: 0.15, wave: 'sawtooth' },
    // --- Sam & Max
    sax:       { t: 'fm', cw: 'sine', mw: 'sine', ratio: 1, idx: 2.7, idxDec: 0.15, idxSus: 0.55, a: 0.03, d: 0.15, s: 0.7, r: 0.1, vol: 0.27, bend: 1.7, bendT: 0.11, vib: 0.7, vibR: 5.2, vibDelay: 0.18, lp: 3200 },
    jazzBass:  { t: 'bass', vol: 0.5, lp0: 600, lp1: 180, lpDec: 0.15, a: 0.005, d: 0.35, s: 0.4, r: 0.06 },
    epiano:    { t: 'fm', cw: 'sine', mw: 'sine', ratio: 1, idx: 1.8, idxDec: 0.15, idxSus: 0.1, a: 0.002, d: 0.4, s: 0.2, r: 0.15, vol: 0.13 },
    // --- LeChuck
    metalGtr:  { t: 'fm', cw: 'sawtooth', mw: 'square', ratio: 1, idx: 1.8, idxDec: 0.2, idxSus: 0.7, a: 0.002, d: 0.1, s: 0.8, r: 0.05, vol: 0.13, dist: 60, lp: 3800 },
    metalLead: { t: 'fm', cw: 'sawtooth', mw: 'sine', ratio: 2, idx: 1.5, idxDec: 0.1, idxSus: 0.6, a: 0.002, d: 0.1, s: 0.8, r: 0.08, vol: 0.13, dist: 40, lp: 5000, vib: 0.6, vibR: 6.5, vibDelay: 0.1 },
    metalBass: { t: 'bass', vol: 0.5, lp0: 1400, lp1: 200, lpDec: 0.06, a: 0.001, d: 0.1, s: 0.5, r: 0.03, dist: 12, wave: 'sawtooth' },
    // --- FX patches
    fxBlip:    { t: 'fm', cw: 'square', mw: 'sine', ratio: 2, idx: 0.8, idxDec: 0.03, idxSus: 0.1, a: 0.001, d: 0.06, s: 0, r: 0.03, vol: 0.5 },
    fxMetal:   { t: 'fm', cw: 'sine', mw: 'sine', ratio: 3.53, idx: 3.5, idxDec: 0.08, idxSus: 0.1, a: 0.001, d: 0.2, s: 0, r: 0.1, vol: 0.5 },
    fxPing:    { t: 'fm', cw: 'sine', mw: 'sine', ratio: 7.1, idx: 2.5, idxDec: 0.1, idxSus: 0.05, a: 0.001, d: 0.3, s: 0, r: 0.15, vol: 0.45 },
    fxJingle:  { t: 'fm', cw: 'square', mw: 'sine', ratio: 1, idx: 1.0, idxDec: 0.08, idxSus: 0.3, a: 0.002, d: 0.1, s: 0.5, r: 0.08, vol: 0.45, lp: 4000 },
    fxBell:    { t: 'fm', cw: 'sine', mw: 'sine', ratio: 4.0, idx: 2.0, idxDec: 0.2, idxSus: 0.05, a: 0.001, d: 0.6, s: 0, r: 0.4, vol: 0.5 },
    fxGrowl:   { t: 'fm', cw: 'sawtooth', mw: 'square', ratio: 0.5, idx: 3, idxDec: 0.4, idxSus: 0.8, a: 0.01, d: 0.3, s: 0.6, r: 0.2, vol: 0.5, dist: 50, lp: 1800 }
  };

  // ---------------------------------------------------------------- voices
  function envGain(g, t, a, d, s, r, dur, peak) {
    const p = Math.max(0.0001, peak);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(p, t + a);
    const sus = Math.max(0.0001, p * s);
    g.gain.exponentialRampToValueAtTime(sus, t + a + d);
    const end = Math.max(t + a + d, t + dur);
    g.gain.setValueAtTime(sus, end);
    g.gain.exponentialRampToValueAtTime(0.0001, end + r);
    return end + r;
  }

  function fmVoice(p, f, t, dur, vel, out) {
    const car = ctx.createOscillator(); car.type = p.cw || 'sine';
    const mod = ctx.createOscillator(); mod.type = p.mw || 'sine';
    mod.frequency.setValueAtTime(f * (p.ratio || 1), t);
    const mg = ctx.createGain();
    const idx = f * (p.idx || 1) * (0.6 + 0.4 * vel);
    mg.gain.setValueAtTime(idx, t);
    mg.gain.exponentialRampToValueAtTime(Math.max(0.5, idx * (p.idxSus == null ? 0.2 : p.idxSus)), t + (p.idxDec || 0.2));
    mod.connect(mg); mg.connect(car.frequency);
    if (p.bend) {
      car.frequency.setValueAtTime(f * Math.pow(2, -p.bend / 12), t);
      car.frequency.exponentialRampToValueAtTime(f, t + (p.bendT || 0.08));
    } else car.frequency.setValueAtTime(f, t);
    let lfo = null;
    if (p.vib) {
      lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = p.vibR || 6;
      const lg = ctx.createGain(); lg.gain.setValueAtTime(0, t);
      lg.gain.linearRampToValueAtTime(f * p.vib / 100, t + (p.vibDelay || 0) + 0.1);
      lfo.connect(lg); lg.connect(car.frequency); lfo.start(t);
    }
    let node = car;
    if (p.dist) { const ws = ctx.createWaveShaper(); ws.curve = softClip(p.dist); ws.oversample = '2x'; node.connect(ws); node = ws; }
    if (p.lp) { const lpf = ctx.createBiquadFilter(); lpf.type = 'lowpass'; lpf.frequency.value = p.lp; lpf.Q.value = 0.7; node.connect(lpf); node = lpf; }
    const g = ctx.createGain();
    const end = envGain(g, t, p.a, p.d, p.s, p.r, dur, p.vol * vel);
    node.connect(g); g.connect(out);
    car.start(t); mod.start(t); car.stop(end + 0.05); mod.stop(end + 0.05);
    if (lfo) lfo.stop(end + 0.05);
  }

  function bassVoice(p, f, t, dur, vel, out) {
    const o = ctx.createOscillator(); o.type = p.wave || 'triangle'; o.frequency.setValueAtTime(f, t);
    const lpf = ctx.createBiquadFilter(); lpf.type = 'lowpass'; lpf.Q.value = 3;
    lpf.frequency.setValueAtTime(Math.max(p.lp0, f * 1.5), t);
    lpf.frequency.exponentialRampToValueAtTime(Math.max(p.lp1, f * 1.1), t + p.lpDec);
    let node = o;
    if (p.dist) { const ws = ctx.createWaveShaper(); ws.curve = softClip(p.dist); node.connect(ws); node = ws; }
    node.connect(lpf);
    const g = ctx.createGain();
    const end = envGain(g, t, p.a, p.d, p.s, p.r, dur, p.vol * vel);
    lpf.connect(g); g.connect(out);
    o.start(t); o.stop(end + 0.05);
    if (p.sub) {
      const s = ctx.createOscillator(); s.type = 'sine'; s.frequency.setValueAtTime(f / 2, t);
      const sg = ctx.createGain(); envGain(sg, t, p.a, p.d, p.s, p.r, dur, p.vol * vel * p.sub);
      s.connect(sg); sg.connect(out); s.start(t); s.stop(end + 0.05);
    }
  }

  function padVoice(p, f, t, dur, vel, out) {
    const g = ctx.createGain();
    const end = envGain(g, t, p.a, 0.2, 0.9, p.r, dur, p.vol * vel);
    const lpf = ctx.createBiquadFilter(); lpf.type = 'lowpass'; lpf.Q.value = 2;
    lpf.frequency.setValueAtTime(p.lp0, t);
    lpf.frequency.exponentialRampToValueAtTime(p.lp1, t + p.lpT);
    lpf.frequency.exponentialRampToValueAtTime(p.lp0, Math.max(t + p.lpT + 0.1, t + dur));
    lpf.connect(g); g.connect(out);
    [-1, 1, 0].forEach((side, i) => {
      const o = ctx.createOscillator(); o.type = i === 2 ? 'triangle' : 'sawtooth';
      o.frequency.setValueAtTime(f * (i === 2 ? 0.5 : 1), t);
      o.detune.setValueAtTime(side * p.det, t);
      o.connect(lpf); o.start(t); o.stop(end + 0.05);
    });
  }

  function voice(name, f, t, dur, vel, out) {
    const p = PATCH[name]; if (!p || !ctx) return;
    out = out || musicBus;
    if (p.t === 'fm') fmVoice(p, f, t, dur, vel, out);
    else if (p.t === 'bass') bassVoice(p, f, t, dur, vel, out);
    else if (p.t === 'pad') padVoice(p, f, t, dur, vel, out);
  }

  // ---------------------------------------------------------------- percussion
  function noiseSrc(t, dur) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05); return s;
  }
  function noiseHit(t, vel, filt, fq, q, dur, out) {
    const s = noiseSrc(t, dur);
    const f = ctx.createBiquadFilter(); f.type = filt; f.frequency.value = fq; f.Q.value = q;
    const g = ctx.createGain(); g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(out);
  }
  function toneHit(t, vel, f0, f1, dur, out, type) {
    const o = ctx.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.6);
    const g = ctx.createGain(); g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.05);
  }
  function drum(k, t, vel, out) {
    out = out || musicBus;
    switch (k) {

  // ---------------------------------------------------------------- sequencer (look-ahead scheduling on the audio clock)
  function schedule() {
    if (!song || !ctx) return;
    const ahead = ctx.currentTime + 0.18;
    const stepDur = 60 / song.bpm / song.div;
    while (nextTime < ahead) {
      let t = nextTime;
      if (song.swing && (step & 1)) t += stepDur * song.swing;
      for (const tr of song.tracks) {
        const i = step % tr.p.len;
        if (tr.p.drum) {
          const hits = tr.p.n[i];
          if (hits) for (const h of hits) drum(h, t, tr.p.v[i] * tr.g, songGain);
        } else {
          const ns = tr.p.n[i];
          if (ns) {
            const dur = tr.p.d[i] * stepDur * (tr.gate || 0.85);
            const out = tr.echo ? echoIn : songGain;
            for (const f of ns) voice(tr.i, f * Math.pow(2, tr.oct || 0), t, dur, tr.p.v[i] * tr.g, out);
          }
        }
      }
      if (song.gen) song.gen(step, t, stepDur);
      step++; nextTime += stepDur;
    }
  }

    if (!ctx || !ready) return;
    if (id === songId && song) return;
    stopSong();

    songGain = ctx.createGain(); songGain.gain.value = 1; songGain.connect(musicBus);
    echoDelay.delayTime.setValueAtTime(song.echo || 0.3, ctx.currentTime);
    nextTime = ctx.currentTime + 0.1;
    timer = setInterval(schedule, 30);
    schedule();

  function stopSong() {
    if (timer) { clearInterval(timer); timer = null; }
    if (songGain && ctx) {

      g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + 0.25);
      setTimeout(() => { try { g.disconnect(); } catch (e) { } }, 600);
    }
    song = null; songId = -1; songGain = null;
  }
  function currentSong() { return songId; }

  function sweep(type, f0, f1, dur, vol, t, lp) {
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);

    node.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + dur + 0.05);

// ------------------------------------------------------------------ level construction
function makeBrick(ch, c, r, world) {
  const b = { c, r, x: BX + c * BW, y: BY + r * BH, type: 'n', hp: 1, maxhp: 1, col: K.LGRAY, alive: true, era: null, note: null, phased: false, flash: 0 };
  if (ch === '#') { b.type = 's'; b.col = K.DGRAY; b.hp = Infinity; b.maxhp = Infinity; }
  else if (ch === 'A') { b.type = 'a'; b.hp = b.maxhp = 2; b.col = K.LGRAY; }
  else if (ch === 'B') { b.type = 'a'; b.hp = b.maxhp = 3; b.col = K.GOLD; }
  else if (ch === 'X') { b.type = 'x'; b.col = K.LGREEN; }
  else if (ch === 'I') { b.type = 'i'; b.col = K.YELLOW; }
  else if (ch === 'V') { b.type = 'v'; b.col = K.OLIVE; }
  else if (ch >= '1' && ch <= '8') {
    if (world === 1) { b.type = 'e'; b.era = ch.charCodeAt(0) - 49; b.col = ERA_COLORS[b.era]; }
    else { b.type = 'm'; b.note = ch.charCodeAt(0) - 49; b.col = NOTE_COLORS[b.note]; }
  }
  else if (BRICK_COLORS[ch] != null) { b.col = BRICK_COLORS[ch]; }
  else return null;
  return b;
}

function loadLevel(i) {
  const L = LEVELS[i];
  G.level = i; G.world = worldOf(i);
  G.bricks = []; G.wells = []; G.pups = []; G.lasers = []; G.parts = []; G.texts = []; G.boulders = []; G.shots = []; G.balls = [];
  G.era = 0; G.eraT = 0; G.insult = null; G.seq = []; G.spellMsg = null; G.boss = null; G.fireT = 0; G.slowT = 0;
  G.scroll = L.scroll || null; G.draft = L.draft || null; G.spell = L.spell || null; G.combo = 0; G.bossDeathT = 0;
  G.t = 0; G.intro = 2.2; G.respawnT = 0; G.shake = 0;
  for (let r = 0; r < ROWS; r++) {
    const row = (L.m[r] || '').padEnd(COLS, '.');
    for (let c = 0; c < COLS; c++) {
      const ch = row[c];
      if (ch === '.') continue;
      if (ch === 'G') { G.wells.push({ x: BX + c * BW + BW / 2, y: BY + r * BH + BH / 2, str: 26000, ang: 0 }); continue; }
      const b = makeBrick(ch, c, r, G.world);
      if (b) G.bricks.push(b);
    }
  }
  if (G.scroll) for (const [r, dir] of G.scroll) for (const b of G.bricks) if (b.r === r) b.scrollDir = dir;
  if (L.boss) {
    G.boss = { x: PX + PW / 2, y: 30, w: 34, h: 22, hp: 28, maxhp: 28, t: 0, fireT: 2.5, flash: 0, dead: false, phase: 0 };
  }
  G.remaining = countRemaining();
  const p = G.paddle;
  p.w = 28; p.laser = false; p.catchMode = false; p.stun = 0; p.expandT = 0; p.laserT = 0; p.catchT = 0;
  p.x = clamp(p.x, PX, PR - p.w);
  G.speed = baseSpeed(i);
  resetBall();
  AU.playSong(WORLDS[G.world].song);
}
function countRemaining() { let n = 0; for (const b of G.bricks) if (b.alive && b.type !== 's') n++; return n; }

function newBall() { return { x: 0, y: 0, vx: 0, vy: 0, r: 2, stuck: true, off: 0, dead: false, trail: [] }; }
function resetBall() {
  const b = newBall();
  b.off = G.paddle.w / 2; b.stuck = true;
  G.balls = [b];
}
function launchBall(b) {
  const ang = rnd(-0.5, 0.5);
  const s = currentSpeed();
  b.vx = Math.sin(ang) * s; b.vy = -Math.cos(ang) * s; b.stuck = false;
}
function currentSpeed() {
  const ramp = Math.min(40, G.t * 0.45);
  return (G.speed + ramp) * (G.slowT > 0 ? 0.62 : 1);
}
function setBallSpeed(b, s) {
  const m = Math.hypot(b.vx, b.vy); if (m < 0.001) return;
  b.vx = b.vx / m * s; b.vy = b.vy / m * s;
}

// ------------------------------------------------------------------ bricks
function brickActive(b) {
  if (!b.alive) return false;
  if (b.era != null && b.era !== G.era) return false;
  if (b.phased) return false;
  return true;
}
function hitBrick(b, src) {
  if (!b.alive) return;
  b.flash = 0.12;
  if (b.type === 's') { AU.sfx('steel'); burst(b.x + BW / 2, b.y + BH / 2, K.WHITE, 2, 40); return; }
  b.hp--;
  if (b.hp > 0) { AU.sfx('armor'); addScore(20); burst(b.x + BW / 2, b.y + BH / 2, lighter(b.col), 3, 50); return; }
  destroyBrick(b, src);
}
function destroyBrick(b, src) {
  if (!b.alive) return;
  b.alive = false;
  G.remaining--;
  const cx = b.x + BW / 2, cy = b.y + BH / 2;
  let pts = 50;
  burst(cx, cy, b.col, 6, 70);
  switch (b.type) {
    case 'a': pts = 100; AU.sfx('brick', G.combo); break;
    case 'x': pts = 150; AU.sfx('explode'); G.shake = Math.max(G.shake, 0.25); explodeAround(b); break;
    case 'i': pts = 200; AU.sfx('insult'); G.insult = { pair: pick(INSULTS), t: 7, phase: 0 }; break;
    case 'e': pts = 80; AU.sfx('brick', G.combo); break;
    case 'v': pts = 70; AU.sfx('trap'); G.boulders.push({ x: cx, y: cy, vy: 20, r: 4 }); addText(cx, cy - 6, 'TRAP!', K.LRED, 0.8); break;
    case 'm': pts = 60; AU.sfx('note', NOTE_FREQ[b.note]); onDistaffNote(b.note, cx, cy); break;
    default: pts = 50 + Math.max(0, 10 - b.r) * 5; AU.sfx('brick', G.combo); break;
  }
  G.combo++;
  addScore(pts);
  if (pts >= 100 && b.type !== 'x') addText(cx, cy, String(pts), K.YELLOW, 0.7);
  if (src !== 'spell' && src !== 'explosion' && Math.random() < 0.11) spawnPowerup(cx, cy);
  if (G.remaining <= 0 && !G.boss && G.state === 'PLAYING') levelCleared();
}
function explodeAround(b) {
  const list = [];
  for (const o of G.bricks) if (o.alive && Math.abs(o.c - b.c) <= 1 && Math.abs(o.r - b.r) <= 1 && o !== b && o.type !== 's') list.push(o);
  G.flash = 0.12; G.flashCol = K.YELLOW;
  for (let i = 0; i < 14; i++) G.parts.push({ x: b.x + BW / 2, y: b.y + BH / 2, vx: rnd(-90, 90), vy: rnd(-90, 60), life: rnd(0.4, 0.9), col: pick([K.YELLOW, K.ORANGE, K.LRED, K.WHITE]) });
  // chain reaction is staggered so neighbouring grog bricks detonate in sequence
  setTimeout(() => { if (G.state !== 'PLAYING') return; for (const o of list) { if (o.alive) { o.hp = 1; destroyBrick(o, 'explosion'); } } }, 70);
}

// ------------------------------------------------------------------ Loom spell weaving
function onDistaffNote(note, x, y) {
  G.seq.push(note);
  if (G.seq.length > 4) G.seq.shift();
  addText(x, y - 6, NOTE_NAMES[note], NOTE_COLORS[note], 0.8);
  if (G.draft && G.seq.length === 4 && G.seq.every((n, i) => n === G.draft[i])) {
    G.seq = [];
    castSpell();
  }
}
function castSpell() {
  AU.sfx('spell');
  G.flash = 0.3; G.flashCol = K.WHITE;
  G.spellMsg = { s: G.spell + '!', t: 2.5 };
  const live = G.bricks.filter(b => b.alive && b.type !== 's');
  switch (G.spell) {
    case 'OPENING': { // unravel the fullest row
      const cnt = {}; for (const b of live) cnt[b.r] = (cnt[b.r] || 0) + 1;
      let best = -1, bn = 0; for (const r in cnt) if (cnt[r] > bn) { bn = cnt[r]; best = +r; }
      live.filter(b => b.r === best).forEach((b, i) => setTimeout(() => { if (b.alive && G.state === 'PLAYING') { b.hp = 1; destroyBrick(b, 'spell'); } }, i * 40));
      break;
    }
    case 'TWISTING': { // twist the fullest column out of existence
      const cnt = {}; for (const b of live) cnt[b.c] = (cnt[b.c] || 0) + 1;
      let best = -1, bn = 0; for (const c in cnt) if (cnt[c] > bn) { bn = cnt[c]; best = +c; }
      live.filter(b => b.c === best).forEach((b, i) => setTimeout(() => { if (b.alive && G.state === 'PLAYING') { b.hp = 1; destroyBrick(b, 'spell'); } }, i * 40));
      break;
    }
    case 'HEALING': G.lives++; AU.sfx('extra'); addText(G.paddle.x + G.paddle.w / 2, PADDLE_Y - 10, '+1 LIFE', K.LGREEN, 1.5); break;
    case 'SHARPENING': {
      G.paddle.laser = true; G.paddle.catchMode = false; G.paddle.laserT = 20;
      for (let i = 0; i < 8; i++) G.lasers.push({ x: PX + 15 + i * 30, y: PADDLE_Y - 4, vy: -260 });
      break;
    }
    case 'EMPTYING': for (const b of live) if (b.type === 'a') { b.hp = 1; b.flash = 0.3; } break;
    case 'TRANSCENDENCE': G.fireT = 7; break;
  }
}

// ------------------------------------------------------------------ power-ups
const PUP_TYPES = ['L', 'E', 'C', 'S', 'P'];
const PUP_COLORS = { L: K.LRED, E: K.YELLOW, C: K.LCYAN, S: K.LMAGENTA, P: K.GOLD };
function spawnPowerup(x, y) {
  const weights = { L: 3, E: 4, C: 3, S: 3, P: 1 };
  let total = 0; for (const k in weights) total += weights[k];
  let r = Math.random() * total, type = 'E';
  for (const k in weights) { r -= weights[k]; if (r <= 0) { type = k; break; } }
  G.pups.push({ x: x - 7, y: y - 4, type, vy: 36, t: 0 });
  AU.sfx('drop');
}
function applyPowerup(type) {
  const p = G.paddle;
  AU.sfx('collect');

  switch (type) {
    case 'L': p.laser = true; p.catchMode = false; p.laserT = 20; label = 'BLASTERS!'; break;

    case 'C': p.catchMode = true; p.laser = false; p.catchT = 20; label = 'COMPASS!'; break;

// ------------------------------------------------------------------ collision: circle vs AABB with corner handling
function circleRect(b, px, py, rx, ry, rw, rh) {
  const cx = clamp(b.x, rx, rx + rw), cy = clamp(b.y, ry, ry + rh);
  const dx = b.x - cx, dy = b.y - cy, d2 = dx * dx + dy * dy;
  if (d2 > b.r * b.r) return null;
  let nx = 0, ny = 0;
  if (px >= rx && px <= rx + rw) { ny = py < ry + rh / 2 ? -1 : 1; }
  else if (py >= ry && py <= ry + rh) { nx = px < rx + rw / 2 ? -1 : 1; }
  else {
    const d = Math.sqrt(d2);
    if (d > 0.0001) { nx = dx / d; ny = dy / d; }
    else { ny = py < ry + rh / 2 ? -1 : 1; }
  }
  const dot = b.vx * nx + b.vy * ny;
  if (dot < 0) { b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny; }
  const pen = b.r - Math.sqrt(d2) + 0.05;
  b.x += nx * pen; b.y += ny * pen;
  return { nx, ny };
}
function enforceAngle(b) {
  // keep the ball from bouncing forever at near-horizontal angles
  const s = Math.hypot(b.vx, b.vy); if (s < 0.001) return;
  const minVy = s * 0.22;
  if (Math.abs(b.vy) < minVy) { b.vy = (b.vy < 0 ? -1 : 1) * minVy; const vx = Math.sqrt(Math.max(0, s * s - b.vy * b.vy)); b.vx = (b.vx < 0 ? -1 : 1) * vx; }
}

function paddleHit(b) {
  const p = G.paddle;
  const s = Math.hypot(b.vx, b.vy) || currentSpeed();
  const rel = clamp((b.x - (p.x + p.w / 2)) / (p.w / 2), -1, 1);
  const ang = rel * 1.05;  // up to ~60 degrees from vertical
  b.vx = Math.sin(ang) * s; b.vy = -Math.cos(ang) * s;
  b.y = PADDLE_Y - b.r - 0.1;
  AU.sfx('paddle');
  burst(b.x, PADDLE_Y, K.WHITE, 2, 30);
  if (p.catchMode) { b.stuck = true; b.off = clamp(b.x - p.x, 2, p.w - 2); b.vx = 0; b.vy = 0; }
  if (G.insult && G.insult.phase === 0) {
    G.insult.phase = 1; G.insult.t = 3.5;
    addScore(500); AU.sfx('riposte');
    addText(b.x, PADDLE_Y - 12, 'RIPOSTE! +500', K.YELLOW, 1.4);
  }
}

function moveBall(b, dt) {
  const p = G.paddle;
  if (b.stuck) { b.x = p.x + b.off; b.y = PADDLE_Y - b.r - 0.1; return; }
  // gravity wells bend the trajectory while preserving speed
  if (G.wells.length) {
    const s = Math.hypot(b.vx, b.vy);
    for (const w of G.wells) {
      const dx = w.x - b.x, dy = w.y - b.y, d2 = Math.max(144, dx * dx + dy * dy), d = Math.sqrt(d2);
      if (d > 110) continue;
      const f = w.str / d2 * dt;
      b.vx += dx / d * f; b.vy += dy / d * f;
      if (d < 20 && !w.cool) { w.cool = 0.6; AU.sfx('well'); }
    }
    setBallSpeed(b, s);
  }
  setBallSpeed(b, currentSpeed());
  const spd = Math.hypot(b.vx, b.vy);
  const steps = Math.max(1, Math.ceil(spd * dt / 1.4));
  const sdt = dt / steps;
  for (let i = 0; i < steps; i++) {
    const px = b.x, py = b.y;
    b.x += b.vx * sdt; b.y += b.vy * sdt;
    // walls
    if (b.x - b.r < PX) { b.x = PX + b.r; if (b.vx < 0) { b.vx = -b.vx; AU.sfx('wall'); } }
    else if (b.x + b.r > PR) { b.x = PR - b.r; if (b.vx > 0) { b.vx = -b.vx; AU.sfx('wall'); } }
    if (b.y - b.r < PY) { b.y = PY + b.r; if (b.vy < 0) { b.vy = -b.vy; AU.sfx('wall'); } }
    if (b.y - b.r > H + 4) { b.dead = true; return; }
    // paddle
    if (b.vy > 0 && b.y + b.r >= PADDLE_Y && py + b.r <= PADDLE_Y + p.h && b.x >= p.x - b.r && b.x <= p.x + p.w + b.r && b.y - b.r <= PADDLE_Y + p.h) {
      paddleHit(b); if (b.stuck) return;
    }
    // bricks
    for (const br of G.bricks) {
      if (!brickActive(br)) continue;
      if (Math.abs(br.x + BW / 2 - b.x) > BW / 2 + b.r + 1 || Math.abs(br.y + BH / 2 - b.y) > BH / 2 + b.r + 1) continue;
      if (G.fireT > 0 && br.type !== 's') {
        // transcendence: blaze straight through
        if (b.x > br.x - b.r && b.x < br.x + BW + b.r && b.y > br.y - b.r && b.y < br.y + BH + b.r) { br.hp = 1; destroyBrick(br, 'ball'); }
        continue;
      }
      const res = circleRect(b, px, py, br.x, br.y, BW, BH);
      if (res) { hitBrick(br, 'ball'); enforceAngle(b); break; }
    }
    // boss body
    const bs = G.boss;
    if (bs && !bs.dead) {
      const res = circleRect(b, px, py, bs.x - bs.w / 2, bs.y - bs.h / 2, bs.w, bs.h);
      if (res) { damageBoss(1, b.x, b.y); enforceAngle(b); }
    }
  }
  // unphase era bricks once the ball has left them
  for (const br of G.bricks) if (br.phased && !(Math.abs(br.x + BW / 2 - b.x) < BW / 2 + b.r + 1 && Math.abs(br.y + BH / 2 - b.y) < BH / 2 + b.r + 1)) br.phased = false;
}

// ------------------------------------------------------------------ boss : LeChuck
function damageBoss(n, x, y) {
  const bs = G.boss; if (!bs || bs.dead) return;
  bs.hp -= n; bs.flash = 0.15;
  AU.sfx('bossHit'); burst(x, y, pick([K.LGREEN, K.LCYAN, K.WHITE]), 6, 80);
  addScore(150);
  if (bs.hp <= 0) {

// ------------------------------------------------------------------ main update
function update(dt) {
  G.stateT += dt;
  if (G.state === 'MENU') return;
  if (G.state === 'CLEAR') { updateFx(dt); if (G.stateT > 3.2) nextLevel(); return; }
  if (G.state === 'GAMEOVER') { updateFx(dt); if (G.stateT > 6) { setState('MENU'); AU.playSong(0); } return; }
  if (G.state === 'VICTORY') { updateFx(dt); return; }
  if (G.paused) return;

  const p = G.paddle;
  G.t += dt;
  if (G.intro > 0) G.intro -= dt;
  if (G.respawnT > 0) G.respawnT -= dt;

  // paddle timers
  if (p.stun > 0) p.stun -= dt;
  if (p.expandT > 0 && (p.expandT -= dt) <= 0) { p.w = 28; p.x = clamp(p.x + 8, PX, PR - p.w); }
  if (p.laserT > 0 && (p.laserT -= dt) <= 0) p.laser = false;
  if (p.catchT > 0 && (p.catchT -= dt) <= 0) { p.catchMode = false; for (const b of G.balls) if (b.stuck && G.intro <= 0 && G.respawnT <= 0) launchBall(b); }
  if (G.slowT > 0) G.slowT -= dt;
  if (G.fireT > 0) G.fireT -= dt;
  if (p.fireCd > 0) p.fireCd -= dt;
  p.x = clamp(p.x, PX, PR - p.w);

  // DOTT time travel
  if (G.world === 1) {
    G.eraT += dt;
    if (G.eraT >= 7) {
      G.eraT = 0; G.era = (G.era + 1) % 3; AU.sfx('warp'); G.flash = 0.2; G.flashCol = ERA_COLORS[G.era];
      addText(PX + PW / 2, 60, ERA_NAMES[G.era], ERA_COLORS[G.era], 1.2);
      for (const br of G.bricks) if (br.alive && br.era === G.era) for (const b of G.balls)
        if (Math.abs(br.x + BW / 2 - b.x) < BW / 2 + b.r + 1 && Math.abs(br.y + BH / 2 - b.y) < BH / 2 + b.r + 1) br.phased = true;
    }
  }
  // Sam & Max scrolling road rows
  if (G.scroll) {
    for (const b of G.bricks) if (b.scrollDir) {
      b.x += b.scrollDir * 22 * dt;
      if (b.x >= BX + PW) b.x -= PW; else if (b.x < BX - BW) b.x += PW;
    }
  }
  // gravity wells cooldown and spin
  for (const w of G.wells) { w.ang += dt * 3; if (w.cool) { w.cool -= dt; if (w.cool <= 0) w.cool = 0; } }
  // insult timer
  if (G.insult && (G.insult.t -= dt) <= 0) G.insult = null;
  if (G.spellMsg && (G.spellMsg.t -= dt) <= 0) G.spellMsg = null;

  // balls
  let alive = 0;
  for (const b of G.balls) {
    if (b.dead) continue;
    moveBall(b, dt);
    if (!b.dead) {
      alive++;
      b.trail.push([b.x, b.y]); if (b.trail.length > 6) b.trail.shift();
    }
  }
  if (alive === 0 && G.state === 'PLAYING') { loseBall(); return; }

  // lasers
  for (const l of G.lasers) {
    l.y += l.vy * dt;
    if (l.y < PY) { l.dead = true; continue; }
    for (const br of G.bricks) {
      if (!brickActive(br)) continue;
      if (l.x >= br.x && l.x <= br.x + BW && l.y <= br.y + BH && l.y >= br.y - 2) { hitBrick(br, 'laser'); l.dead = true; break; }
    }
    const bs = G.boss;
    if (!l.dead && bs && !bs.dead && Math.abs(l.x - bs.x) < bs.w / 2 && Math.abs(l.y - bs.y) < bs.h / 2) { damageBoss(1, l.x, l.y); l.dead = true; }
  }
  G.lasers = G.lasers.filter(l => !l.dead);

  // power-ups
  for (const u of G.pups) {
    u.y += u.vy * dt; u.t += dt;
    if (u.y > H) { u.dead = true; continue; }
    if (u.y + 7 >= PADDLE_Y && u.y <= PADDLE_Y + p.h && u.x + 14 >= p.x && u.x <= p.x + p.w) { u.dead = true; applyPowerup(u.type); }
  }
  G.pups = G.pups.filter(u => !u.dead);

  // Atlantis trap boulders
  for (const o of G.boulders) {
    o.vy += 140 * dt; o.y += o.vy * dt;
    if (o.y > H + 6) { o.dead = true; continue; }
    if (o.y + o.r >= PADDLE_Y && o.y - o.r <= PADDLE_Y + p.h && o.x + o.r >= p.x && o.x - o.r <= p.x + p.w) {
      o.dead = true; p.stun = 1.3; AU.sfx('stun'); G.shake = 0.3; addText(o.x, PADDLE_Y - 10, 'STUNNED!', K.LRED, 1);
      burst(o.x, PADDLE_Y, K.LGRAY, 8, 70);
    }
  }
  G.boulders = G.boulders.filter(o => !o.dead);

  // boss projectiles
  for (const s of G.shots) {
    s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.y > H + 4 || s.x < PX || s.x > PR) { s.dead = true; continue; }
    if (s.y + 3 >= PADDLE_Y && s.y - 3 <= PADDLE_Y + p.h && s.x + 3 >= p.x && s.x - 3 <= p.x + p.w) {
      s.dead = true; p.stun = 1.1; AU.sfx('stun'); G.shake = 0.35; G.flash = 0.15; G.flashCol = K.LMAGENTA;
      addText(s.x, PADDLE_Y - 10, 'VOODOO!', K.LMAGENTA, 1); burst(s.x, PADDLE_Y, K.LMAGENTA, 8, 70);
    }
  }
  G.shots = G.shots.filter(s => !s.dead);

  updateBoss(dt);
  updateFx(dt);
}
function updateFx(dt) {
  for (const q of G.parts) { q.life -= dt; q.vy += 150 * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
  G.parts = G.parts.filter(q => q.life > 0);
  for (const t of G.texts) { t.life -= dt; t.y -= 12 * dt; }
  G.texts = G.texts.filter(t => t.life > 0);
  for (const b of G.bricks) if (b.flash > 0) b.flash -= dt;
  if (G.shake > 0) G.shake -= dt;
  if (G.flash > 0) G.flash -= dt;
}

// ------------------------------------------------------------------ player actions
function fireAction() {
  if (G.state === 'MENU') { startGame(); return; }
  if (G.state === 'VICTORY' && G.stateT > 2) { setState('MENU'); AU.playSong(0); return; }
  if (G.state === 'GAMEOVER' && G.stateT > 1.5) { setState('MENU'); AU.playSong(0); return; }
  if (G.state !== 'PLAYING' || G.paused) return;
  const p = G.paddle;
  let launched = false;
  for (const b of G.balls) if (b.stuck && G.respawnT <= 0) { launchBall(b); launched = true; }
  if (launched) { if (G.intro > 0.6) G.intro = 0.6; return; }

    AU.sfx('laser');

}

// ------------------------------------------------------------------ playfield elements
function drawFrame() {
  // metallic cabinet walls
  for (let y = 0; y < 200; y += 4) { const c = (y / 4 | 0) % 2 ? K.LGRAY : K.DGRAY; rect(0, y, PX, 4, c); rect(PR, y, 8, 4, c); }
  rect(0, 0, 256, PY, K.LGRAY); rect(0, PY - 1, 256, 1, K.DGRAY); rect(PX - 1, 0, 1, 200, K.WHITE); rect(PR, 0, 1, 200, K.WHITE);
  rect(0, 0, 256, 1, K.WHITE);
  for (const x of [2, 250]) for (let y = 12; y < 200; y += 24) rect(x, y, 4, 2, K.BLACK);
}

function drawBrick(b) {
  if (!b.alive) return;
  const x = Math.round(b.x), y = Math.round(b.y);
  const active = b.era == null || b.era === G.era;
  if (b.type === 'e' && !active) { // ghost brick from another era
    ctx.globalAlpha = 0.35; rect(x, y, BW, BH, b.col); ctx.globalAlpha = 1;
    for (let i = 0; i < BW; i += 2) px(x + i, y + (i / 2 % 2 ? 0 : BH - 1), b.col);
    return;
  }
  const col = b.flash > 0 ? K.WHITE : b.col;
  if (b.type === 's') {
    rect(x, y, BW, BH, K.DGRAY); rect(x, y, BW, 1, K.LGRAY); rect(x, y, 1, BH, K.LGRAY); rect(x, y + BH - 1, BW, 1, K.BLACK); rect(x + BW - 1, y, 1, BH, K.BLACK);
    px(x + 2, y + 2, K.WHITE); px(x + BW - 3, y + 2, K.WHITE); px(x + 2, y + BH - 3, K.WHITE); px(x + BW - 3, y + BH - 3, K.WHITE);
    return;
  }
  rect(x, y, BW, BH, col);
  rect(x, y, BW, 1, lighter(col)); rect(x, y, 1, BH, lighter(col));
  rect(x, y + BH - 1, BW, 1, darker(col)); rect(x + BW - 1, y, 1, BH, darker(col));
  switch (b.type) {
    case 'a': {
      rect(x + 2, y + 2, BW - 4, BH - 4, b.hp === b.maxhp ? lighter(col) : col);
      if (b.hp < b.maxhp) { // cracks
        px(x + 3, y + 2, K.BLACK); px(x + 4, y + 3, K.BLACK); px(x + 5, y + 4, K.BLACK); px(x + 6, y + 4, K.BLACK); px(x + 7, y + 5, K.BLACK);
        if (b.hp === 1) { px(x + 8, y + 2, K.BLACK); px(x + 9, y + 3, K.BLACK); px(x + 2, y + 5, K.BLACK); px(x + 3, y + 6, K.BLACK); px(x + 6, y + 1, K.BLACK); }
      }
      break;
    }
    case 'x': // grog bottle with an X
      rect(x + 4, y + 1, 4, 6, K.GREEN); rect(x + 5, y, 2, 2, K.BROWN);
      drawText('X', x + 1, y + 2, K.LRED, 1, 0); drawText('X', x + 9, y + 2, K.LRED, 1, 0);
      break;
    case 'i': drawText('!', x + 5, y + 2, K.BLACK, 1, 0); drawText('!', x + 1, y + 2, K.RED, 1, 0); drawText('!', x + 8, y + 2, K.RED, 1, 0); break;
    case 'v': rect(x + 4, y + 2, 4, 3, K.WHITE); px(x + 4, y + 3, K.BLACK); px(x + 7, y + 3, K.BLACK); rect(x + 5, y + 5, 2, 1, K.WHITE); break;
    case 'm': drawText(NOTE_NAMES[b.note], x + 5, y + 2, K.BLACK, 1, 1); break;
    case 'e': if (b.flash <= 0) { for (let i = 2; i < BW - 2; i += 3) px(x + i, y + 3 + (i % 2), K.WHITE); } break;
  }
}

function drawWells() {
  for (const w of G.wells) {
    circle(w.x, w.y, 6, K.BLACK);
    for (let i = 0; i < 3; i++) {
      for (let k = 0; k < 8; k++) { const a = w.ang + i * TAU / 3 + k * 0.35, r = 3 + k * 1.1; px(w.x + Math.cos(a) * r, w.y + Math.sin(a) * r * 0.7, k < 3 ? K.WHITE : k < 6 ? K.LMAGENTA : K.VIOLET); }
    }
    px(w.x, w.y, K.WHITE);
  }
}

function drawPaddle() {
  const p = G.paddle, x = Math.round(p.x), y = PADDLE_Y, w = Math.round(p.w);
  if (p.stun > 0 && Math.floor(p.stun * 20) % 2) { rect(x, y, w, p.h, K.MAGENTA); return; }
  if (p.w > 30) { // rubber chicken mode
    rect(x, y, w, p.h, K.YELLOW); rect(x, y, w, 1, K.WHITE); rect(x, y + p.h - 1, w, 1, K.ORANGE);
    rect(x, y - 2, 4, 2, K.LRED); rect(x - 1, y + 1, 2, 2, K.ORANGE); rect(x + w - 6, y + 1, 6, 2, K.ORANGE); px(x + 2, y + 1, K.BLACK);
  } else {
    rect(x, y, w, p.h, K.LGRAY); rect(x, y, w, 1, K.WHITE); rect(x, y + p.h - 1, w, 1, K.DGRAY);
    rect(x, y, 4, p.h, K.LRED); rect(x + w - 4, y, 4, p.h, K.LRED); rect(x + 4, y + 1, 2, p.h - 2, K.LCYAN); rect(x + w - 6, y + 1, 2, p.h - 2, K.LCYAN);
  }
  if (p.laser) { rect(x + 1, y - 3, 3, 3, K.DGRAY); rect(x + w - 4, y - 3, 3, 3, K.DGRAY); px(x + 2, y - 4, K.LRED); px(x + w - 3, y - 4, K.LRED); }
  if (p.catchMode) { const g = Math.sin(G.t * 10) > 0 ? K.LCYAN : K.WHITE; for (let i = 2; i < w - 2; i += 4) px(x + i, y - 1, g); }
}

function drawBall(b) {
  if (b.dead) return;
  const fire = G.fireT > 0;
  for (let i = 0; i < b.trail.length; i++) { const [tx, ty] = b.trail[i]; px(tx, ty, fire ? (i % 2 ? K.ORANGE : K.YELLOW) : K.DGRAY); }
  const x = Math.round(b.x - 2), y = Math.round(b.y - 2);
  if (fire) { rect(x - 1, y - 1, 6, 6, Math.random() > 0.5 ? K.ORANGE : K.LRED); rect(x, y, 4, 4, K.YELLOW); rect(x + 1, y + 1, 2, 2, K.WHITE); return; }
  rect(x, y, 4, 4, K.LGRAY); rect(x + 1, y, 2, 4, K.WHITE); rect(x, y + 1, 4, 2, K.WHITE); px(x + 1, y + 1, K.LCYAN);
}

function drawPowerups() {
  for (const u of G.pups) {
    const x = Math.round(u.x), y = Math.round(u.y), col = PUP_COLORS[u.type];
    const wob = Math.sin(u.t * 6) > 0;
    rect(x, y, 14, 8, wob ? col : lighter(col)); rect(x, y, 14, 1, K.WHITE); rect(x, y + 7, 14, 1, darker(col)); rect(x + 13, y, 1, 8, darker(col));
    sprite(ICONS[u.type], x + 1, y + 1, { w: K.WHITE, l: K.LGRAY, r: K.LRED, y: K.YELLOW, o: K.ORANGE, u: K.BLUE, i: K.GOLD }, 1);
    drawText(u.type, x + 15, y + 2, K.BLACK, 1, 0); drawText(u.type, x + 14, y + 1, K.WHITE, 1, 0);

}

function drawBoss() {
  const bs = G.boss; if (!bs) return;
  if (bs.dead && Math.floor(G.bossDeathT * 12) % 2) return;
  const x = bs.x - 17, y = bs.y - 11;
  const flash = bs.flash > 0;
  const map = flash ? { k: K.WHITE, w: K.WHITE, i: K.WHITE, g: K.WHITE, z: K.WHITE, r: K.WHITE, u: K.WHITE, b: K.WHITE } : { k: K.BLACK, w: K.WHITE, i: K.GOLD, g: K.LGREEN, z: K.BLACK, r: (Math.sin(bs.t * 8) > 0 ? K.LRED : K.YELLOW), u: K.BLUE, b: K.LBLUE };
  // ghostly aura
  ctx.globalAlpha = 0.25 + Math.sin(bs.t * 5) * 0.1; circle(bs.x, bs.y, 20, K.LGREEN); ctx.globalAlpha = 1;
  sprite(LECHUCK, x, y, map, 2);
  // health bar above boss
  const bw = 40, hp = Math.max(0, bs.hp / bs.maxhp);
  rect(bs.x - bw / 2 - 1, y - 7, bw + 2, 5, K.BLACK); rect(bs.x - bw / 2, y - 6, bw * hp, 3, hp > 0.5 ? K.LGREEN : hp > 0.25 ? K.YELLOW : K.LRED);
}

function drawEffects() {
  for (const l of G.lasers) { rect(l.x - 1, l.y, 1, 6, K.LRED); px(l.x - 1, l.y, K.WHITE); }
  for (const o of G.boulders) { circle(o.x, o.y, o.r, K.DGRAY); circle(o.x - 1, o.y - 1, 2, K.LGRAY); px(o.x + 1, o.y + 1, K.BLACK); }
  for (const s of G.shots) {
    const c = Math.floor(s.t * 15) % 2 ? K.LMAGENTA : K.MAGENTA;
    circle(s.x, s.y, 3, c); px(s.x - 1, s.y - 1, K.WHITE); px(s.x + 1, s.y - 1, K.WHITE); rect(s.x - 1, s.y + 1, 3, 1, K.BLACK);
    px(s.x - s.vx * 0.03, s.y - s.vy * 0.03, K.VIOLET);
  }
  for (const q of G.parts) px(q.x, q.y, q.life < 0.2 ? darker(q.col) || K.DGRAY : q.col);
  for (const t of G.texts) { const a = t.life / t.max; if (a < 0.3 && Math.floor(t.life * 20) % 2) continue; drawTextShadow(t.s, clamp(t.x, PX + textW(t.s, 1) / 2 + 1, PR - textW(t.s, 1) / 2 - 1), t.y, t.col, 1, 1); }
}

function drawLighting() {
  // crypt torchlight: bricks far from the ball fade into darkness
  if (G.world !== 2 || G.state !== 'PLAYING') return;
  const balls = G.balls.filter(b => !b.dead);
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  for (const b of G.bricks) {
    if (!b.alive) continue;
    let d = 999;
    for (const bl of balls) d = Math.min(d, Math.hypot(bl.x - (b.x + 6), bl.y - (b.y + 4)));
    const a = clamp((d - 45) / 70, 0, 1);
    if (a > 0.05) { ctx.globalAlpha = a * 0.7; ctx.fillRect(Math.round(b.x), Math.round(b.y), BW, BH); }
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {

  for (const [ty, tm] of items) {

    rect(HUDX + 21, py + 2, 36, 4, K.DGRAY); rect(HUDX + 21, py + 2, Math.round(36 * clamp(tm / 20, 0, 1)), 4, K.WHITE);

    rect(HUDX + 8, wy + 16, 48, 3, K.DGRAY); rect(HUDX + 8, wy + 16, Math.round(48 * (1 - G.eraT / 7)), 3, ERA_COLORS[G.era]);
  } else if (G.world === 4 && G.draft) {
    drawText('DRAFT OF', HUDX + 32, wy - 8, K.LGRAY, 1, 1);
    drawText(G.spell, HUDX + 32, wy, K.LAVENDER, 1, 1);
    for (let i = 0; i < 4; i++) {
      const n = G.draft[i], ok = i < G.seq.length && G.seq.slice(0, i + 1).every((s, k) => s === G.draft[k]);
      rect(HUDX + 6 + i * 14, wy + 9, 12, 10, ok ? NOTE_COLORS[n] : K.DGRAY);
      drawText(NOTE_NAMES[n], HUDX + 12 + i * 14, wy + 12, ok ? K.BLACK : NOTE_COLORS[n], 1, 1);
    }
    const prog = G.seq.length && G.seq.every((s, k) => s === G.draft[k]) ? G.seq.length : 0;
    for (let i = 0; i < 4; i++) rect(HUDX + 6 + i * 14, wy + 21, 12, 1, i < prog ? K.WHITE : K.DGRAY);
  } else if (G.world === 2) {

  } else if (G.world === 5) {

  } else if (G.world === 6 && G.boss) {

    rect(HUDX + 8, wy + 9, 48, 5, K.DGRAY); rect(HUDX + 8, wy + 9, Math.round(48 * Math.max(0, G.boss.hp / G.boss.maxhp)), 5, K.LRED);

}

function drawBanner(y, h, col) { rect(PX, y, PW, h, K.BLACK); rect(PX, y, PW, 1, col); rect(PX, y + h - 1, PW, 1, col); }

function drawPlaying() {
  if (G.intro > 0) {
    drawBanner(84, 30, K.YELLOW);
    drawTextShadow('LEVEL ' + (G.level + 1), PX + PW / 2, 89, K.WHITE, 1, 1);
    drawTextShadow(LEVELS[G.level].n, PX + PW / 2, 99, K.YELLOW, 1, 1);
    const hint = ['INSULT BRICKS: RIPOSTE WITH THE PADDLE', 'ERA BRICKS SHIFT THROUGH TIME', 'TRAP BRICKS DROP BOULDERS - WATCH OUT', 'GRAVITY WELLS BEND THE BALL', 'WEAVE THE DRAFT TO CAST A SPELL', 'THE ROAD NEVER STOPS MOVING', 'DODGE THE VOODOO AND STRIKE LECHUCK'][G.world];
    drawText(hint, PX + PW / 2, 108, K.LGRAY, 1, 1);

  if (G.paused) { drawBanner(88, 22, K.LCYAN); drawTextShadow('PAUSED', PX + PW / 2, 93, K.WHITE, 2, 1); }
}

function drawClear() {

  drawText('SCORE ' + G.score, cx, 118, K.LGRAY, 1, 1);
}
function drawGameOver() {
  const cx = PX + PW / 2;
  drawBanner(66, 70, K.LRED);
  drawTextShadow('GAME OVER', cx, 74, K.LRED, 3, 1);
  drawText('THE BRICKS WIN THIS ROUND', cx, 98, K.LGRAY, 1, 1);
  drawText('FINAL SCORE ' + G.score, cx, 110, K.WHITE, 1, 1);
  if (G.score >= G.hi && G.score > 0) drawText('NEW HIGH SCORE!', cx, 120, Math.floor(G.stateT * 4) % 2 ? K.YELLOW : K.GOLD, 1, 1);
  if (G.stateT > 1.5) drawText('PRESS SPACE', cx, 128, K.DGRAY, 1, 1);
}
function drawVictory(t) {
  const cx = PX + PW / 2;
  rect(PX, PY, PW, PH, K.BLACK);
  srand(3); for (let i = 0; i < 60; i++) px(PX + srnd() * PW, PY + srnd() * PH, Math.sin(t * 2 + i) > 0 ? K.WHITE : K.DGRAY);
  const cols = [K.YELLOW, K.GOLD, K.ORANGE, K.LRED, K.LMAGENTA, K.LCYAN];
  drawTextShadow('VICTORY!', cx, 20 + Math.sin(t * 2) * 2, cols[Math.floor(t * 5) % cols.length], 3, 1);
  drawText('LECHUCK HAS BEEN BANISHED', cx, 44, K.LGREEN, 1, 1);
  drawText('THE SECRET OF BRICK ISLAND IS YOURS', cx, 54, K.WHITE, 1, 1);
  const lines = ['', 'YOU BROKE THE BRICKS OF', 'MELEE ISLAND', 'THE TENTACLE MANSION', 'THE ATLANTEAN CRYPT', 'THE SPACE LANES', 'THE GREAT LOOM', 'THE OPEN ROAD', 'AND THE GHOST SHIP', '', 'FINAL SCORE ' + G.score, 'HIGH SCORE ' + G.hi, '', 'THANKS FOR PLAYING', '', 'PRESS SPACE TO RETURN'];
  const scroll = Math.max(0, t * 10 - 20);
  lines.forEach((l, i) => { const y = 74 + i * 9 - Math.min(scroll, (lines.length - 6) * 9); if (y > 64 && y < 196) drawText(l, cx, y, i >= lines.length - 1 ? K.YELLOW : K.LGRAY, 1, 1); });
  // dancing sprites
  sprite(LECHUCK, cx - 17 + Math.sin(t) * 60, 140 + Math.abs(Math.sin(t * 4)) * -6, { k: K.BLACK, w: K.WHITE, i: K.GOLD, g: K.LGREEN, z: K.BLACK, r: K.LRED, u: K.BLUE, b: K.LBLUE }, 2);
}

// ------------------------------------------------------------------ frame
function render(t) {
  ctx.save();
  if (G.shake > 0) ctx.translate(rndi(-2, 2), rndi(-2, 2));
  // background
  if (G.world === 2 && G.state === 'PLAYING') { BACKGROUNDS[2](t); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, 256, 200); }
  else BACKGROUNDS[G.state === 'MENU' ? 0 : G.world](t);
  drawFrame();
  ctx.beginPath(); ctx.rect(PX, PY, PW, PH); ctx.clip();
  if (G.state === 'MENU') { drawMenu(t); }
  else if (G.state === 'VICTORY') { drawVictory(G.stateT); }
  else {
    for (const b of G.bricks) drawBrick(b);
    drawLighting();
    drawWells();
    drawBoss();
    drawPowerups();
    drawPaddle();
    for (const b of G.balls) drawBall(b);
    drawEffects();
    if (G.state === 'PLAYING') drawPlaying();
    else if (G.state === 'CLEAR') { drawPlaying(); drawClear(); }
    else if (G.state === 'GAMEOVER') drawGameOver();
  }
  ctx.restore();
  ctx.save();
  if (G.shake > 0) ctx.translate(rndi(-1, 1), 0);
  drawHUD();
  ctx.restore();
  if (G.flash > 0) { ctx.globalAlpha = Math.min(0.6, G.flash * 2); rect(0, 0, W, H, G.flashCol); ctx.globalAlpha = 1; }
  // subtle scanlines for the cabinet feel
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);
}

// =====================================================================================
//  INPUT, SCALING & MAIN LOOP
// =====================================================================================
const keys = {};
function unlockAudio() {
  if (AU.init()) {
    AU.resume();
    if (G.state === 'MENU' && AU.currentSong() < 0) AU.playSong(0);
  }
}
window.addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', ' ', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
  unlockAudio();
  if (e.repeat) return;
  keys[e.key] = true;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'enter') fireAction();
  else if (k === 'p' || k === 'escape') { if (G.state === 'PLAYING') { G.paused = !G.paused; AU.sfx('pause'); } }
  else if (k === 'm') { AU.toggleMute(); }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  movePaddleTo((e.clientX - r.left) / r.width * W);
});
canvas.addEventListener('mousedown', e => { e.preventDefault(); unlockAudio(); fireAction(); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); unlockAudio(); const r = canvas.getBoundingClientRect(); movePaddleTo((e.touches[0].clientX - r.left) / r.width * W); fireAction(); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); const r = canvas.getBoundingClientRect(); movePaddleTo((e.touches[0].clientX - r.left) / r.width * W); }, { passive: false });
window.addEventListener('contextmenu', e => e.preventDefault());

function resize() {
  const availW = window.innerWidth - 70, availH = window.innerHeight - 120;
  let s = Math.floor(Math.min(availW / W, availH / H));
  if (s < 1) s = Math.max(0.5, Math.min(availW / W, availH / H));
  canvas.style.width = Math.round(W * s) + 'px';
  canvas.style.height = Math.round(H * s) + 'px';
}
window.addEventListener('resize', resize);
resize();

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  if (G.state === 'PLAYING' && !G.paused) {
    const p = G.paddle, sp = 230 * dt;
    if (p.stun <= 0) {
      if (keys.ArrowLeft || keys.a || keys.A) p.x -= sp;
      if (keys.ArrowRight || keys.d || keys.D) p.x += sp;
      p.x = clamp(p.x, PX, PR - p.w);
    }
    if (keys[' '] && p.laser && p.fireCd <= 0 && !G.balls.some(b => b.stuck)) fireAction();
  }
  update(dt);
  render(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
