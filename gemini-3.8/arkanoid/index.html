<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Arkanoid: The Secret of Brick Island</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #08080c;
      background-image: 
        radial-gradient(circle at 50% 30%, #1c152b 0%, #07070a 100%),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 2px, transparent 2px, transparent 4px);
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Vintage Arcade Cabinet Shell */
    #arcade-container {
      position: relative;
      padding: 16px 20px 20px 20px;
      background: linear-gradient(145deg, #2b1f14 0%, #150f0a 40%, #0d0906 100%);
      border: 6px solid #4a3421;
      border-radius: 18px;
      box-shadow: 
        0 0 50px rgba(0, 0, 0, 0.9),
        inset 0 0 15px rgba(255, 170, 0, 0.15),
        0 12px 30px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 95vw;
    }

    /* Cabinet Marquee */
    #marquee {
      width: 100%;
      background: linear-gradient(180deg, #aa0000 0%, #550000 50%, #220000 100%);
      border: 3px solid #ffaa00;
      border-radius: 8px;
      padding: 8px 16px;
      margin-bottom: 12px;
      text-align: center;
      box-shadow: 
        0 0 15px rgba(255, 85, 0, 0.5),
        inset 0 0 10px rgba(255, 255, 85, 0.3);
      position: relative;
      overflow: hidden;
    }
    #marquee::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 100%);
      pointer-events: none;
    }
    #marquee-title {
      color: #ffff55;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 
        2px 2px 0 #aa0000,
        -2px -2px 0 #550000,
        0 0 10px #ffaa00;
      text-transform: uppercase;
    }
    #marquee-subtitle {
      color: #55ffff;
      font-size: 10px;
      letter-spacing: 2px;
      margin-top: 2px;
      text-shadow: 1px 1px 0 #0000aa;
    }

    /* CRT Screen Housing */
    #screen-housing {
      position: relative;
      background: #020204;
      border: 8px solid #1a171e;
      border-radius: 12px;
      box-shadow: 
        inset 0 0 25px rgba(0, 0, 0, 0.95),
        0 4px 10px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    /* 320x200 Canvas */
    #gameCanvas {
      display: block;
      width: 640px;
      height: 400px;
      max-width: 90vw;
      max-height: calc(90vw * 200 / 320);
      aspect-ratio: 320 / 200;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background-color: #000;
      cursor: crosshair;
    }

    @media (min-width: 1024px) {
      #gameCanvas {
        width: 800px;
        height: 500px;
      }
    }

    /* Subtle CRT Scanlines Overlay */
    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.03)
      );
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      border-radius: 6px;
    }

    /* CRT Glass Vignette & Reflection */
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.75);
      pointer-events: none;
      border-radius: 6px;
    }

    /* Bottom Arcade Controls & Badge */
    #cabinet-footer {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding: 0 4px;
      font-size: 11px;
      color: #aa8866;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      background: #110e0b;
      border: 1px solid #553311;
      border-radius: 4px;
      color: #ffaa55;
    }
    .keys-hint {
      color: #887766;
      font-size: 10px;
    }
    .keys-hint span {
      color: #ffff55;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="arcade-container">
    <div id="marquee">
      <div id="marquee-title">Arkanoid</div>
      <div id="marquee-subtitle">The Secret of Brick Island</div>
    </div>

    <div id="screen-housing">
      <canvas id="gameCanvas" width="320" height="200"></canvas>
      <div class="scanlines"></div>
      <div class="vignette"></div>
    </div>

    <div id="cabinet-footer">
      <div class="badge">EGA 320x200 • OPL2 FM AUDIO</div>
      <div class="keys-hint"><span>MOUSE / A,D / ARROWS</span> Move | <span>SPACE</span> Fire/Launch | <span>P</span> Pause | <span>M</span> Mute | <span>1-7</span> Warp</div>
    </div>
  </div>

  <script>
  (function() {
    'use strict';

    // =========================================================================
    // 1. EGA PALETTE & COLOR REGISTERS
    // =========================================================================
    const EGA = {
      BLACK:          '#000000',
      BLUE:           '#0000aa',
      GREEN:          '#00aa00',
      CYAN:           '#00aaaa',
      RED:            '#aa0000',
      MAGENTA:        '#aa00aa',
      BROWN:          '#aa5500',
      LIGHT_GRAY:     '#aaaaaa',
      DARK_GRAY:      '#555555',
      BRIGHT_BLUE:    '#5555ff',
      BRIGHT_GREEN:   '#55ff55',
      BRIGHT_CYAN:    '#55ffff',
      BRIGHT_RED:     '#ff5555',
      BRIGHT_MAGENTA: '#ff55ff',
      YELLOW:         '#ffff55',
      WHITE:          '#ffffff',
      // Extended shades for extra luster
      GOLD:           '#ffaa00',
      ORANGE:         '#ff5500',
      DARK_GREEN:     '#005500',
      PURPLE:         '#5500aa',
      TEAL:           '#00aa55',
      NAVY:           '#000055'
    };

    // Brick Color Theme Mapping
    const BRICK_THEMES = {
      'C': { color: EGA.CYAN,           hi: EGA.BRIGHT_CYAN,    sh: EGA.BLUE,       pts: 100, hp: 1 },
      'G': { color: EGA.GREEN,          hi: EGA.BRIGHT_GREEN,   sh: EGA.DARK_GREEN, pts: 110, hp: 1 },
      'Y': { color: EGA.YELLOW,         hi: EGA.WHITE,          sh: EGA.GOLD,       pts: 120, hp: 1 },
      'O': { color: EGA.ORANGE,         hi: EGA.YELLOW,         sh: EGA.RED,        pts: 130, hp: 1 },
      'R': { color: EGA.RED,            hi: EGA.BRIGHT_RED,     sh: EGA.BROWN,      pts: 140, hp: 1 },
      'P': { color: EGA.MAGENTA,        hi: EGA.BRIGHT_MAGENTA, sh: EGA.PURPLE,     pts: 150, hp: 1 },
      'B': { color: EGA.BLUE,           hi: EGA.BRIGHT_BLUE,    sh: EGA.NAVY,       pts: 160, hp: 1 },
      'W': { color: EGA.LIGHT_GRAY,     hi: EGA.WHITE,          sh: EGA.DARK_GRAY,  pts: 100, hp: 1 },
      'A': { color: EGA.LIGHT_GRAY,     hi: EGA.WHITE,          sh: EGA.DARK_GRAY,  pts: 200, hp: 2, armored: true },
      'K': { color: EGA.GOLD,           hi: EGA.YELLOW,         sh: EGA.BROWN,      pts: 300, hp: 3, armored: true },
      'S': { color: EGA.DARK_GRAY,      hi: EGA.LIGHT_GRAY,     sh: EGA.BLACK,      pts: 0,   hp: 99999, steel: true },
      'X': { color: EGA.BRIGHT_GREEN,   hi: EGA.YELLOW,         sh: EGA.DARK_GREEN, pts: 500, hp: 1, grog: true },
      'M': { color: EGA.BRIGHT_MAGENTA, hi: EGA.BRIGHT_CYAN,    sh: EGA.PURPLE,     pts: 250, hp: 1, loom: true },
      'V': { color: EGA.BRIGHT_BLUE,    hi: EGA.BRIGHT_MAGENTA, sh: EGA.NAVY,       pts: 200, hp: 1, vortex: true }
    };

    // =========================================================================
    // 2. 4x5 RETRO BITMAP FONT ENGINE
    // =========================================================================
    const FONT_DATA = {
      'A': 0x69f99,
      'B': 0xe9e9e,
      'C': 0x78887,
      'D': 0xe999e,
      'E': 0xf8e8f,
      'F': 0xf8e88,
      'G': 0x78b97,
      'H': 0x99f99,
      'I': 0xe444e,
      'J': 0x222a4,
      'K': 0x9bcb9,
      'L': 0x8888f,
      'M': 0x9f999,
      'N': 0x9db99,
      'O': 0x69996,
      'P': 0xe9e88,
      'Q': 0x69961,
      'R': 0xe9eb9,
      'S': 0x7861e,
      'T': 0xf4444,
      'U': 0x99996,
      'V': 0x99964,
      'W': 0x999f9,
      'X': 0x96699,
      'Y': 0x99644,
      'Z': 0xf248f,
      '0': 0x69996,
      '1': 0x4c44e,
      '2': 0xe168f,
      '3': 0xe161e,
      '4': 0x99f11,
      '5': 0xf8e1e,
      '6': 0x78f96,
      '7': 0xf1244,
      '8': 0x69696,
      '9': 0x69f16,
      ' ': 0x0,
      '!': 0x44404,
      '?': 0xe1604,
      '.': 0x4,
      ':': 0x4040,
      '-': 0xe00,
      '+': 0x4e40,
      '/': 0x12480,
      '\'': 0x44000,
      '"': 0xaa000,
      '(': 0x24442,
      ')': 0x42224,
      '=': 0xe0e0,
      '<': 0x12421,
      '>': 0x42124
    };

    function drawChar(ctx, ch, x, y, color, scale) {
      const code = FONT_DATA[ch.toUpperCase()] || 0;
      if (!code) return;
      ctx.fillStyle = color;
      for (let r = 0; r < 5; r++) {
        const shift = (4 - r) * 4;
        const nibble = (code >> shift) & 0xf;
        for (let c = 0; c < 4; c++) {
          if (nibble & (8 >> c)) {
            ctx.fillRect(x + c * scale, y + r * scale, scale, scale);
          }
        }
      }
    }

    function drawText(ctx, str, x, y, color, scale = 1, shadow = true) {
      const charW = 4 * scale;
      const spacing = 1 * scale;
      str = String(str);
      if (shadow) {
        let curX = x + scale;
        let curY = y + scale;
        for (let i = 0; i < str.length; i++) {
          drawChar(ctx, str[i], curX, curY, EGA.BLACK, scale);
          curX += charW + spacing;
        }
      }
      let curX = x;
      for (let i = 0; i < str.length; i++) {
        drawChar(ctx, str[i], curX, y, color, scale);
        curX += charW + spacing;
      }
    }

    function getTextWidth(str, scale = 1) {
      return str.length * (5 * scale);
    }

    function drawTextCentered(ctx, str, y, color, scale = 1, shadow = true) {
      const w = getTextWidth(str, scale);
      const x = Math.floor((320 - w) / 2);
      drawText(ctx, str, x, y, color, scale, shadow);
    }

    function drawTextCenteredInField(ctx, str, y, color, scale = 1, shadow = true) {
      const w = getTextWidth(str, scale);
      const fieldCenter = Math.floor((FIELD_X_MIN + FIELD_X_MAX) / 2);
      const x = Math.floor(fieldCenter - w / 2);
      drawText(ctx, str, x, y, color, scale, shadow);
    }

    // =========================================================================
    // 3. ADLIB / OPL2 FM SYNTHESIZER & MULTI-CHANNEL SEQUENCER
    // =========================================================================
    class OPL2Synthesizer {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.compressor = null;
        this.noiseBuffer = null;
        this.isMuted = false;
        this.isPlaying = false;
        this.timerId = null;

        // Sequencer State
        this.currentWorld = 1;
        this.currentStep = 0;
        this.nextStepTime = 0;
        this.stepDuration = 0.125; // default 120 bpm
      }

      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();

        // Dynamics Compressor to act as brickwall limiter preventing clipping
        this.compressor = this.ctx.createDynamicsCompressor();
        this.compressor.threshold.setValueAtTime(-4, this.ctx.currentTime);
        this.compressor.knee.setValueAtTime(8, this.ctx.currentTime);
        this.compressor.ratio.setValueAtTime(12, this.ctx.currentTime);
        this.compressor.attack.setValueAtTime(0.003, this.ctx.currentTime);
        this.compressor.release.setValueAtTime(0.1, this.ctx.currentTime);
        this.compressor.connect(this.ctx.destination);

        // Master Gain
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.7, this.ctx.currentTime);
        this.masterGain.connect(this.compressor);

        // Build 2.0 second white noise buffer for AdLib percussion
        const bufferSize = this.ctx.sampleRate * 2;
        this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = this.noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        // Start sequencer clock loop
        this.startSequencer();
      }

      resume() {
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setValueAtTime(this.isMuted ? 0 : 0.7, this.ctx.currentTime);
        }
        return this.isMuted;
      }

      // Convert MIDI note number to Frequency in Hz
      midiToFreq(m) {
        if (!m) return 0;
        return 440 * Math.pow(2, (m - 69) / 12);
      }

      // 2-Operator FM Synthesizer Voice (OPL2 Modulator -> Carrier)
      playFMVoice(freq, duration, patch, time, destGain) {
        if (!this.ctx || this.isMuted || !freq) return;

        const modOsc = this.ctx.createOscillator();
        const modGain = this.ctx.createGain();
        const carOsc = this.ctx.createOscillator();
        const carGain = this.ctx.createGain();

        modOsc.type = patch.modType || 'sine';
        carOsc.type = patch.carType || 'sine';

        const carFreq = freq * (patch.carRatio || 1.0);
        const modFreq = freq * (patch.modRatio || 1.0);

        carOsc.frequency.setValueAtTime(carFreq, time);
        modOsc.frequency.setValueAtTime(modFreq, time);

        // Optional pitch glide for Sax or Lead
        if (patch.glide) {
          carOsc.frequency.linearRampToValueAtTime(carFreq * Math.pow(2, patch.glide / 12), time + duration * 0.4);
        }

        // Modulator Modulation Index & Envelope
        const modIndex = (patch.modIndex || 2.0) * freq;
        modGain.gain.setValueAtTime(modIndex, time);
        modGain.gain.exponentialRampToValueAtTime(Math.max(1, modIndex * (patch.modSustain || 0.2)), time + duration);

        // Connect Modulator to Carrier Frequency
        modOsc.connect(modGain);
        modGain.connect(carOsc.frequency);

        // Carrier ADSR Volume Envelope
        const att = patch.attack || 0.01;
        const dec = patch.decay || 0.2;
        const sus = patch.sustain !== undefined ? patch.sustain : 0.3;
        const rel = patch.release || 0.1;
        const maxVol = (patch.vol || 0.3);

        carGain.gain.setValueAtTime(0.0001, time);
        carGain.gain.linearRampToValueAtTime(maxVol, time + att);
        carGain.gain.exponentialRampToValueAtTime(Math.max(0.0001, maxVol * sus), time + att + dec);
        carGain.gain.setValueAtTime(Math.max(0.0001, maxVol * sus), time + duration);
        carGain.gain.exponentialRampToValueAtTime(0.0001, time + duration + rel);

        // Connect Carrier to Destination
        carOsc.connect(carGain);
        carGain.connect(destGain);

        modOsc.start(time);
        carOsc.start(time);
        modOsc.stop(time + duration + rel + 0.05);
        carOsc.stop(time + duration + rel + 0.05);
      }

      // Punchy AdLib Low-Pass Filtered Bass
      playBassVoice(freq, duration, time, destGain) {
        if (!this.ctx || this.isMuted || !freq) return;

        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, time);

        // Low-pass filter envelope for fat punch
        filter.type = 'lowpass';
        filter.Q.setValueAtTime(3, time);
        filter.frequency.setValueAtTime(750, time);
        filter.frequency.exponentialRampToValueAtTime(100, time + duration * 0.8);

        // Gain envelope
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.linearRampToValueAtTime(0.4, time + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.15, time + 0.15);
        gain.gain.setValueAtTime(0.15, time + duration);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + duration + 0.08);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(destGain);

        osc.start(time);
        osc.stop(time + duration + 0.1);
      }

      // Snappy OPL2 Noise Percussion
      playDrumVoice(type, time, destGain) {
        if (!this.ctx || this.isMuted || !type) return;

        // Kick Drum
        if (type === 1 || type === 5) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150, time);
          osc.frequency.exponentialRampToValueAtTime(38, time + 0.08);
          gain.gain.setValueAtTime(0.6, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.09);
          osc.connect(gain);
          gain.connect(destGain);
          osc.start(time);
          osc.stop(time + 0.1);
        }

        // Snare Drum (Band-pass noise + quick sine punch)
        if (type === 2 || type === 6) {
          if (this.noiseBuffer) {
            const noise = this.ctx.createBufferSource();
            noise.buffer = this.noiseBuffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1200, time);
            filter.Q.setValueAtTime(1.5, time);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.35, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(destGain);
            noise.start(time);
            noise.stop(time + 0.13);
          }

          // Snare tonal body
          const pop = this.ctx.createOscillator();
          const popGain = this.ctx.createGain();
          pop.frequency.setValueAtTime(180, time);
          pop.frequency.exponentialRampToValueAtTime(60, time + 0.07);
          popGain.gain.setValueAtTime(0.2, time);
          popGain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
          pop.connect(popGain);
          popGain.connect(destGain);
          pop.start(time);
          pop.stop(time + 0.09);
        }

        // Closed Hi-Hat
        if (type === 3 || type === 5 || type === 6) {
          if (this.noiseBuffer) {
            const noise = this.ctx.createBufferSource();
            noise.buffer = this.noiseBuffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.setValueAtTime(7000, time);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.18, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.035);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(destGain);
            noise.start(time);
            noise.stop(time + 0.04);
          }
        }

        // Open Hi-Hat
        if (type === 4) {
          if (this.noiseBuffer) {
            const noise = this.ctx.createBufferSource();
            noise.buffer = this.noiseBuffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.setValueAtTime(6500, time);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.2, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(destGain);
            noise.start(time);
            noise.stop(time + 0.16);
          }
        }

        // Crash Cymbal Accent
        if (type === 7) {
          if (this.noiseBuffer) {
            const noise = this.ctx.createBufferSource();
            noise.buffer = this.noiseBuffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.setValueAtTime(4500, time);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.3, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.5);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(destGain);
            noise.start(time);
            noise.stop(time + 0.55);
          }
        }
      }

      // =======================================================================
      // THE 7 DISTINCT SOUNDTRACKS FOR THE 7 WORLDS
      // =======================================================================
      getSoundtracks() {
        return {
          // World 1: Monkey Island (Levels 1-6) - Caribbean Reggae & Steel Pan
          1: {
            name: "The Monkey Island Theme",
            bpm: 130,
            patch: {
              modRatio: 3.5, carRatio: 1.0, modIndex: 2.2, modType: 'sine', carType: 'sine',
              attack: 0.005, decay: 0.22, sustain: 0.15, release: 0.1, vol: 0.32
            },
            harmPatch: {
              modRatio: 2.0, carRatio: 1.0, modIndex: 1.5, modType: 'sine', carType: 'sine',
              attack: 0.01, decay: 0.18, sustain: 0.1, release: 0.1, vol: 0.18
            },
            steps: 32,
            lead: [
              62, 0, 65, 67, 0, 69, 65, 62,  60, 0, 62, 0, 0, 0, 0, 0,
              65, 0, 67, 69, 0, 72, 70, 69,  67, 0, 69, 0, 0, 0, 0, 0
            ],
            harm: [
              0, 0, 57, 0, 0, 0, 60, 0,  0, 0, 57, 0, 0, 0, 55, 0,
              0, 0, 60, 0, 0, 0, 65, 0,  0, 0, 62, 0, 0, 0, 64, 0

      setWorldTrack(w) {
        this.currentWorld = w;
        const tracks = this.getSoundtracks();
        const trk = tracks[w] || tracks[1];
        // 16th note duration = (60 / bpm) / 4
        this.stepDuration = (60 / trk.bpm) / 4;
        this.currentStep = 0;
      }

      startSequencer() {
        if (this.timerId) return;
        this.nextStepTime = this.ctx.currentTime + 0.1;

        const scheduleAhead = () => {
          if (!this.ctx) return;
          const tracks = this.getSoundtracks();
          const trk = tracks[this.currentWorld] || tracks[1];
          const lookahead = 0.15;

          while (this.nextStepTime < this.ctx.currentTime + lookahead) {
            const step = this.currentStep;
            const time = this.nextStepTime;
            const dur = this.stepDuration * 0.9;

            // Channel 0: Melody Lead
            const leadMidi = trk.lead[step % trk.steps];
            if (leadMidi) {
              const freq = this.midiToFreq(leadMidi);
              this.playFMVoice(freq, dur, trk.patch, time, this.masterGain);
            }

            // Channel 1: Harmony / Counterpoint
            const harmMidi = trk.harm[step % trk.steps];
            if (harmMidi) {
              const freq = this.midiToFreq(harmMidi);
              this.playFMVoice(freq, dur, trk.harmPatch, time, this.masterGain);
            }

            // Channel 2: Bassline
            const bassMidi = trk.bass[step % trk.steps];
            if (bassMidi) {
              const freq = this.midiToFreq(bassMidi);
              this.playBassVoice(freq, dur, time, this.masterGain);
            }

            // Channel 3: Drums
            const drumCode = trk.drums[step % trk.steps];
            if (drumCode) {
              this.playDrumVoice(drumCode, time, this.masterGain);
            }

            this.currentStep = (this.currentStep + 1) % trk.steps;
            this.nextStepTime += this.stepDuration;
          }
        };

        this.timerId = setInterval(scheduleAhead, 25);
      }

      // =======================================================================
      // HIGH-FIDELITY RETRO SOUND EFFECTS (SFX)
      // =======================================================================
      playSfx(type) {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const dest = this.masterGain;

        switch (type) {
          case 'paddle': {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.linearRampToValueAtTime(540, now + 0.05);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
            osc.connect(gain);
            gain.connect(dest);
            osc.start(now);
            osc.stop(now + 0.07);
            break;
          }

          case 'brick': {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(480, now);
            osc.frequency.exponentialRampToValueAtTime(140, now + 0.07);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.connect(gain);
            gain.connect(dest);
            osc.start(now);
            osc.stop(now + 0.09);
            break;
          }

          case 'clink': {
            // Metallic ring for armored bricks
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1800, now);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.12);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
            osc.connect(gain);
            gain.connect(dest);
            osc.start(now);
            osc.stop(now + 0.14);
            break;
          }

          case 'steel': {
            // Dull metallic thud
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            osc.connect(gain);
            gain.connect(dest);
            osc.start(now);
            osc.stop(now + 0.1);
            break;
          }

          case 'explode': {
            // Grog barrel explosive rumble
            if (this.noiseBuffer) {
              const noise = this.ctx.createBufferSource();
              noise.buffer = this.noiseBuffer;
              const filter = this.ctx.createBiquadFilter();
              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(800, now);
              filter.frequency.exponentialRampToValueAtTime(60, now + 0.45);

              const gain = this.ctx.createGain();
              gain.gain.setValueAtTime(0.7, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);

              noise.connect(filter);
              filter.connect(gain);
              gain.connect(dest);
              noise.start(now);
              noise.stop(now + 0.5);
            }
            break;
          }

          case 'laser': {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(1200, now);
            osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);

            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

              gain.gain.setValueAtTime(0.2, now);

    // =========================================================================
    // 5. GAME ENGINE, ENTITIES & WORLD MECHANICS
    // =========================================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    ctx.imageSmoothingEnabled = false;

    // Game States
    const STATE_TITLE       = 0;
    const STATE_STARTING    = 1;
    const STATE_PLAYING     = 2;
    const STATE_PAUSED      = 3;
    const STATE_LEVEL_CLEAR = 4;
    const STATE_GAME_OVER   = 5;
    const STATE_VICTORY     = 6;

    let gameState = STATE_TITLE;
    let score = 0;
    let highScore = 50000;
    let lives = 3;
    let currentLevelIndex = 0;
    let stateTimer = 0;
    let comboCount = 0;
    let screenShake = 0;

    // Field Geometry
    const FIELD_X_MIN = 12;
    const FIELD_X_MAX = 236; // 14 cols * 16px = 224px
    const FIELD_Y_MIN = 14;
    const FIELD_Y_MAX = 205; // Death pit

    // Paddle Entity
    const paddle = {
      x: 106,
      y: 184,
      w: 36,
      h: 6,
      baseW: 36,
      expandW: 52,
      targetX: 106,
      expandTimer: 0,
      laserTimer: 0,
      catchActive: false,
      laserCooldown: 0
    };

    // Balls Array (Multi-ball / Chrono Duplication Support)
    let balls = [];

    function createBall(x, y, vx, vy, stuck = false, offset = 0) {
      return {
        x: x,
        y: y,
        vx: vx,
        vy: vy,
        radius: 3,
        speed: 2.3,
        stuck: stuck,
        stuckOffset: offset,
        trail: []
      };
    }

    function resetBallsOnPaddle() {
      balls = [createBall(paddle.x + paddle.w / 2, paddle.y - 3, 1.4, -1.8, true, 0)];
    }

    // Active Entities
    let bricks = [];
    let powerUps = [];
    let lasers = [];
    let particles = [];
    let floatingTexts = [];
    let enemyProjectiles = [];

    // Thematic World Mechanics State
    const worldMechanics = {
      // World 1: Insult Sword Fighting Dialogue
      insultActive: false,
      insultText: "",
      insultResponse: "",
      insultTimer: 0,
      insultList: [
        { q: "YOU FIGHT LIKE A DAIRY FARMER!", a: "HOW APPROPRIATE. YOU FIGHT LIKE A COW!" },
        { q: "SOON YOU'LL BE WEARING MY SWORD LIKE A SHISH KEBAB!", a: "FIRST YOU'D BETTER STOP WAVING IT LIKE A FEATHER-DUSTER." },
        { q: "I'VE SPOKEN WITH APES MORE POLITE THAN YOU!", a: "I'M GLAD TO HEAR YOU ATTENDED YOUR FAMILY REUNION!" },
        { q: "HAVE YOU STOPPED WEARING DIAPERS YET?", a: "WHY, DID YOU WANT TO BORROW ONE?" },
        { q: "MY NAME IS GUYBRUSH THREEPWOOD!", a: "AND I'M A MIGHTY PIRATE!" }
      ],

      // World 2: Chrono Anomaly Vortex
      vortexAngle: 0,

      // World 3: Atlantean Gravity Wells
      gravityWell: { x: 124, y: 75, active: false, strength: 18 },

      // World 4: Space Debris Drifting
      spaceDebris: [],

      // World 5: Loom Musical Draft Runes
      loomDraft: [],
      loomRunes: ['C', 'D', 'E', 'F'],

      // World 6: Sam & Max Bumper
      bumper: { x: 124, y: 120, radius: 14, active: false },

      // World 7: LeChuck Animated Boss Entity
      leChuck: {
        active: false,
        x: 124,
        y: 28,
        w: 32,
        h: 26,
        hp: 35,
        maxHp: 35,
        hitTimer: 0,
        attackTimer: 0,
        shootCooldown: 90,
        defeated: false
      }
    };

    // Trigger World 1 Insult Banner
    function triggerInsult() {
      const pair = worldMechanics.insultList[Math.floor(Math.random() * worldMechanics.insultList.length)];
      worldMechanics.insultActive = true;
      worldMechanics.insultText = pair.q;
      worldMechanics.insultResponse = pair.a;
      worldMechanics.insultTimer = 180;
      audio.playSfx('insult');
      score += 500;
      addFloatingText("+500 INSULT COMBO!", 124, 60, EGA.YELLOW);
    }

    // Particle Generator
    function spawnParticles(x, y, color, count = 8, speed = 2.0) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = (Math.random() * 0.8 + 0.4) * speed;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 0.5,
          color: color,
          life: Math.floor(Math.random() * 20 + 20),
          maxLife: 40,
          size: Math.random() > 0.5 ? 2 : 1
        });
      }
    }

    // Floating Score Texts
    function addFloatingText(text, x, y, color = EGA.YELLOW) {
      floatingTexts.push({
        text: text,
        x: x,
        y: y,
        color: color,
        life: 50
      });
    }

    // Load Level Function
    function loadLevel(index) {
      currentLevelIndex = index % ALL_LEVELS.length;
      const levelData = ALL_LEVELS[currentLevelIndex];
      const worldNum = levelData.world;

      // Update Audio Music Track
      audio.setWorldTrack(worldNum);

      // Reset Active Power-ups & Paddle
      paddle.expandTimer = 0;
      paddle.laserTimer = 0;
      paddle.catchActive = false;
      paddle.w = paddle.baseW;
      paddle.x = 106;
      paddle.targetX = 106;

      resetBallsOnPaddle();
      powerUps = [];
      lasers = [];
      enemyProjectiles = [];
      comboCount = 0;

      // Setup World Mechanics
      worldMechanics.insultActive = false;
      worldMechanics.gravityWell.active = (worldNum === 3);
      worldMechanics.bumper.active = (worldNum === 6);
      worldMechanics.loomDraft = [];
      worldMechanics.spaceDebris = [];
      if (worldNum === 4) {
        for (let i = 0; i < 3; i++) {
          worldMechanics.spaceDebris.push({
            x: Math.random() * 180 + 30,
            y: Math.random() * 40 + 30,
            vx: (Math.random() - 0.5) * 0.8,
            size: 6,
            hp: 2
          });
        }
      }

      // Boss Setup on Level 33
      if (currentLevelIndex === 32) {
        worldMechanics.leChuck.active = true;
        worldMechanics.leChuck.hp = 35;
        worldMechanics.leChuck.maxHp = 35;
        worldMechanics.leChuck.hitTimer = 0;
        worldMechanics.leChuck.defeated = false;
        audio.playSfx('bossRoar');
      } else {
        worldMechanics.leChuck.active = false;
      }

      // Build Bricks Grid
      bricks = [];
      const mapRows = levelData.map;
      const startY = 22;
      const brickW = 16;
      const brickH = 8;

      for (let r = 0; r < mapRows.length; r++) {
        const rowStr = mapRows[r];
        for (let c = 0; c < rowStr.length; c++) {
          const char = rowStr[c];
          if (char === '.' || char === ' ') continue;

          const theme = BRICK_THEMES[char] || BRICK_THEMES['C'];
          bricks.push({
            r: r,
            c: c,
            x: FIELD_X_MIN + c * brickW,
            y: startY + r * brickH,
            w: brickW,
            h: brickH,
            char: char,
            color: theme.color,
            hi: theme.hi,
            sh: theme.sh,
            pts: theme.pts,
            hp: theme.hp,
            maxHp: theme.hp,
            armored: !!theme.armored,
            steel: !!theme.steel,
            grog: !!theme.grog,
            loom: !!theme.loom,
            vortex: !!theme.vortex
          });
        }
      }

      gameState = STATE_STARTING;
      stateTimer = 90; // 1.5s intro banner
    }

    // Detonate Explosive Grog Brick (3x3 Chain Reaction)
    function explodeGrogBrick(originBrick) {
      originBrick.hp = 0;
      score += originBrick.pts;
      addFloatingText("+" + originBrick.pts + " GROG BLAST!", originBrick.x, originBrick.y, EGA.BRIGHT_GREEN);
      audio.playSfx('explode');
      screenShake = 12;
      spawnParticles(originBrick.x + 8, originBrick.y + 4, EGA.BRIGHT_GREEN, 24, 3.5);
      spawnParticles(originBrick.x + 8, originBrick.y + 4, EGA.YELLOW, 16, 2.5);

      // Check all 8 adjacent bricks
      for (const b of bricks) {
        if (b.hp <= 0) continue;
        const dc = Math.abs(b.c - originBrick.c);
        const dr = Math.abs(b.r - originBrick.r);
        if (dc <= 1 && dr <= 1 && !(dc === 0 && dr === 0)) {
          if (b.steel) {
            // Shatter steel into gold breakable bricks!
            b.steel = false;
            b.hp = 1;
            b.color = EGA.GOLD;
            b.hi = EGA.YELLOW;
            b.sh = EGA.BROWN;
            b.pts = 300;
            spawnParticles(b.x + 8, b.y + 4, EGA.GOLD, 8);
          } else if (b.grog) {
            // Chain detonate
            setTimeout(() => { if (b.hp > 0) explodeGrogBrick(b); }, 60);
          } else {
            b.hp = 0;
            score += b.pts;
            spawnParticles(b.x + 8, b.y + 4, b.color, 10);
            maybeSpawnPowerUp(b.x + 4, b.y);
          }
        }
      }
    }

    // Power-Up Drops
    function maybeSpawnPowerUp(x, y) {
      if (Math.random() < 0.22) {
        const types = ['L', 'E', 'C', 'S', 'P'];
        const weights = [0.25, 0.25, 0.22, 0.18, 0.10]; // P is rarest (+1 Life)
        let r = Math.random();
        let chosen = 'E';
        for (let i = 0; i < types.length; i++) {
          if (r < weights[i]) {
            chosen = types[i];
            break;
          }
          r -= weights[i];
        }
        powerUps.push({
          x: x,
          y: y,
          type: chosen,
          vy: 0.9,
          w: 14,
          h: 7,
          rot: 0
        });
        audio.playSfx('spawn');
      }
    }

    // Apply Collected Power-Up
    function applyPowerUp(type) {
      audio.playSfx('powerup');
      score += 250;
      switch (type) {
        case 'L': // Laser
          paddle.laserTimer = 750; // ~12.5 seconds
          addFloatingText("LASERS ARMED!", paddle.x, paddle.y - 12, EGA.BRIGHT_RED);
          break;
        case 'E': // Expand
          paddle.expandTimer = 900; // ~15 seconds
          paddle.w = paddle.expandW;
          addFloatingText("RUBBER CHICKEN EXPAND!", paddle.x, paddle.y - 12, EGA.BRIGHT_BLUE);
          break;
        case 'C': // Catch
          paddle.catchActive = true;
          addFloatingText("MAGNETIC CATCH!", paddle.x, paddle.y - 12, EGA.BRIGHT_GREEN);
          break;
        case 'S': // Slow
          for (const b of balls) {
            b.speed = 2.2;
            const currentSpeed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
            if (currentSpeed > 0) {
              b.vx = (b.vx / currentSpeed) * 2.2;
              b.vy = (b.vy / currentSpeed) * 2.2;
            }
          }
          addFloatingText("TIME SLOW!", paddle.x, paddle.y - 12, EGA.GOLD);
          break;
        case 'P': // Player (+1 Life)
          lives++;
          addFloatingText("EXTRA LIFE!", paddle.x, paddle.y - 12, EGA.YELLOW);
          break;
      }
    }

    // Fire Twin Lasers
    function fireLasers() {
      if (paddle.laserTimer <= 0 || paddle.laserCooldown > 0) return;
      paddle.laserCooldown = 16;
      audio.playSfx('laser');
      lasers.push({ x: paddle.x + 2, y: paddle.y - 4, vy: -5 });
      lasers.push({ x: paddle.x + paddle.w - 4, y: paddle.y - 4, vy: -5 });
    }

    // Launch Stuck Balls
    function launchBalls() {
      let launched = false;
      for (const b of balls) {
        if (b.stuck) {
          b.stuck = false;
          const hitFactor = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          const angle = hitFactor * (60 * Math.PI / 180);
          b.vx = b.speed * Math.sin(angle);
          b.vy = -b.speed * Math.cos(angle);
          launched = true;
        }
      }
      if (launched) audio.playSfx('launch');
    }

    // =========================================================================
    // 6. INPUT HANDLING (MOUSE & KEYBOARD)
    // =========================================================================
    const keys = {};

    window.addEventListener('keydown', (e) => {
      audio.init();
      audio.resume();

      keys[e.key] = true;
      keys[e.code] = true;

      // Spacebar launch or shoot
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        if (gameState === STATE_TITLE) {
          loadLevel(0);
        } else if (gameState === STATE_GAME_OVER) {
          score = 0;
          lives = 3;
          loadLevel(0);
        } else if (gameState === STATE_VICTORY) {
          gameState = STATE_TITLE;
        } else if (gameState === STATE_PLAYING) {
          launchBalls();
          fireLasers();
        }
      }

      // Pause toggle
      if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
        if (gameState === STATE_PLAYING) {
          gameState = STATE_PAUSED;
        } else if (gameState === STATE_PAUSED) {
          gameState = STATE_PLAYING;
        }
      }

      // Mute toggle
      if (e.key === 'm' || e.key === 'M') {
        const muted = audio.toggleMute();
        addFloatingText(muted ? "SOUND MUTED" : "SOUND UNMUTED", 124, 100, EGA.YELLOW);
      }

      // Warp directly to Worlds 1 - 7
      if (e.key >= '1' && e.key <= '7') {
        const worldWarps = [0, 6, 12, 18, 24, 30, 32];
        const wIdx = parseInt(e.key) - 1;
        score += 1000;
        loadLevel(worldWarps[wIdx]);
        addFloatingText("WARPED TO WORLD " + (wIdx + 1), 124, 90, EGA.BRIGHT_CYAN);
      }

      // Level skip cheat (N)
      if (e.key === 'n' || e.key === 'N') {
        loadLevel(currentLevelIndex + 1);
        addFloatingText("LEVEL SKIP", 124, 90, EGA.BRIGHT_MAGENTA);
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
      keys[e.code] = false;
    });

    // Mouse Tracking
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const mouseCanvasX = (e.clientX - rect.left) * scaleX;
      paddle.targetX = mouseCanvasX - paddle.w / 2;
    });

    canvas.addEventListener('mousedown', (e) => {
      audio.init();
      audio.resume();

      if (gameState === STATE_TITLE) {
        loadLevel(0);
      } else if (gameState === STATE_GAME_OVER) {
        score = 0;
        lives = 3;
        loadLevel(0);
      } else if (gameState === STATE_VICTORY) {
        gameState = STATE_TITLE;
      } else if (gameState === STATE_PLAYING) {
        launchBalls();
        fireLasers();
      }
    });

    // =========================================================================
    // 7. ROBUST PHYSICS & SUB-STEPPED COLLISION ENGINE
    // =========================================================================
    function updatePhysics() {
      // Screen shake decay
      if (screenShake > 0) screenShake *= 0.85;
      if (screenShake < 0.2) screenShake = 0;

      // Paddle Keyboard movement
      const moveSpeed = 4.2;
      if (keys['ArrowLeft'] || keys['KeyA'] || keys['a']) {
        paddle.targetX -= moveSpeed;
      }
      if (keys['ArrowRight'] || keys['KeyD'] || keys['d']) {
        paddle.targetX += moveSpeed;
      }

      // Smooth Paddle Tracking & Boundary Clamping
      paddle.x += (paddle.targetX - paddle.x) * 0.45;
      if (paddle.x < FIELD_X_MIN) paddle.x = FIELD_X_MIN;
      if (paddle.x + paddle.w > FIELD_X_MAX) paddle.x = FIELD_X_MAX - paddle.w;

      // Paddle Power-up Timers
      if (paddle.laserTimer > 0) paddle.laserTimer--;
      if (paddle.laserCooldown > 0) paddle.laserCooldown--;
      if (paddle.expandTimer > 0) {
        paddle.expandTimer--;
        if (paddle.expandTimer <= 0) paddle.w = paddle.baseW;
      }

      // World 1: Insult timer decay
      if (worldMechanics.insultTimer > 0) {
        worldMechanics.insultTimer--;
        if (worldMechanics.insultTimer <= 0) worldMechanics.insultActive = false;
      }

      // Update Lasers
      for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.y += l.vy;
        if (l.y < FIELD_Y_MIN) {
          lasers.splice(i, 1);
          continue;
        }

        // Laser vs Boss LeChuck
        if (worldMechanics.leChuck.active && !worldMechanics.leChuck.defeated) {
          const boss = worldMechanics.leChuck;
          if (l.x >= boss.x && l.x <= boss.x + boss.w && l.y >= boss.y && l.y <= boss.y + boss.h) {
            boss.hp -= 1;
            boss.hitTimer = 10;
            audio.playSfx('bossHit');
            spawnParticles(l.x, l.y, EGA.BRIGHT_RED, 8);
            lasers.splice(i, 1);
            score += 200;
            if (boss.hp <= 0) defeatBoss();
            continue;
          }
        }

        // Laser vs Bricks
        let laserHit = false;
        for (const b of bricks) {
          if (b.hp <= 0) continue;
          if (l.x >= b.x && l.x <= b.x + b.w && l.y >= b.y && l.y <= b.y + b.h) {
            laserHit = true;
            lasers.splice(i, 1);
            audio.playSfx('laserHit');
            spawnParticles(l.x, l.y, b.color, 4);

            if (b.steel) {
              // Absorbed by steel
            } else if (b.grog) {
              explodeGrogBrick(b);
            } else {
              b.hp -= 1;
              if (b.hp <= 0) {
                score += b.pts;
                spawnParticles(b.x + 8, b.y + 4, b.color, 10);
                maybeSpawnPowerUp(b.x + 4, b.y);
              }
            }
            break;
          }
        }
      }

      // Update Power-ups
      for (let i = powerUps.length - 1; i >= 0; i--) {
        const p = powerUps[i];
        p.y += p.vy;
        p.rot += 0.05;

        // Catch power-up with paddle
        if (p.y + p.h >= paddle.y && p.y <= paddle.y + paddle.h &&
            p.x + p.w >= paddle.x && p.x <= paddle.x + paddle.w) {
          applyPowerUp(p.type);
          powerUps.splice(i, 1);
          continue;
        }

        // Fallen into abyss
        if (p.y > FIELD_Y_MAX) {
          powerUps.splice(i, 1);
        }
      }

      // World 4: Space Debris Movement
      if (worldMechanics.spaceDebris.length > 0) {
        for (const d of worldMechanics.spaceDebris) {
          d.x += d.vx;
          if (d.x < FIELD_X_MIN) { d.x = FIELD_X_MIN; d.vx = Math.abs(d.vx); }
          if (d.x > FIELD_X_MAX - d.size) { d.x = FIELD_X_MAX - d.size; d.vx = -Math.abs(d.vx); }
        }
      }

      // World 7: LeChuck Boss AI & Attacks
      if (worldMechanics.leChuck.active && !worldMechanics.leChuck.defeated) {
        const boss = worldMechanics.leChuck;
        if (boss.hitTimer > 0) boss.hitTimer--;

        // Horizontal hover sweep
        boss.x = 124 + Math.sin(Date.now() * 0.0018) * 75 - boss.w / 2;
        boss.y = 26 + Math.cos(Date.now() * 0.003) * 6;

        boss.attackTimer++;
        if (boss.attackTimer >= boss.shootCooldown) {
          boss.attackTimer = 0;
          audio.playSfx('bossRoar');
          // Fire spectral voodoo projectile towards paddle
          const startX = boss.x + boss.w / 2;
          const startY = boss.y + boss.h;
          const targetX = paddle.x + paddle.w / 2;
          const dx = targetX - startX;
          const dy = paddle.y - startY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          enemyProjectiles.push({
            x: startX,
            y: startY,
            vx: (dx / dist) * 1.6,
            vy: (dy / dist) * 1.6,
            size: 4
          });
        }
      }

      // Update Enemy Projectiles
      for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
        const ep = enemyProjectiles[i];
        ep.x += ep.vx;
        ep.y += ep.vy;

        // Hit paddle?
        if (ep.y >= paddle.y && ep.y <= paddle.y + paddle.h &&
            ep.x >= paddle.x && ep.x <= paddle.x + paddle.w) {
          enemyProjectiles.splice(i, 1);
          screenShake = 10;
          audio.playSfx('die');
          lives--;
          addFloatingText("VOODOO HIT! -1 LIFE", paddle.x, paddle.y - 12, EGA.BRIGHT_RED);
          if (lives <= 0) {
            gameState = STATE_GAME_OVER;
            audio.playSfx('gameover');
          }
          continue;
        }

        if (ep.y > FIELD_Y_MAX) {
          enemyProjectiles.splice(i, 1);
        }
      }

      // =======================================================================
      // SUB-STEPPED BALL MOVEMENT & COLLISION (Prevents Tunneling)
      // =======================================================================
      const SUB_STEPS = 2;
      const subDt = 1.0 / SUB_STEPS;

      for (let step = 0; step < SUB_STEPS; step++) {
        for (let bIdx = balls.length - 1; bIdx >= 0; bIdx--) {
          const ball = balls[bIdx];

          if (ball.stuck) {
            ball.x = paddle.x + paddle.w / 2 + ball.stuckOffset;
            ball.y = paddle.y - ball.radius;
            continue;
          }

          // Advance ball position
          ball.x += ball.vx * subDt;
          ball.y += ball.vy * subDt;

          // Trail update
          if (step === 0) {
            ball.trail.unshift({ x: ball.x, y: ball.y });
            if (ball.trail.length > 4) ball.trail.pop();
          }

          // Left Wall
          if (ball.x - ball.radius < FIELD_X_MIN) {
            ball.x = FIELD_X_MIN + ball.radius;
            ball.vx = Math.abs(ball.vx);
            audio.playSfx('paddle');
            spawnParticles(ball.x, ball.y, EGA.CYAN, 3);
          }
          // Right Wall
          if (ball.x + ball.radius > FIELD_X_MAX) {
            ball.x = FIELD_X_MAX - ball.radius;
            ball.vx = -Math.abs(ball.vx);
            audio.playSfx('paddle');
            spawnParticles(ball.x, ball.y, EGA.CYAN, 3);
          }
          // Top Wall
          if (ball.y - ball.radius < FIELD_Y_MIN) {
            ball.y = FIELD_Y_MIN + ball.radius;
            ball.vy = Math.abs(ball.vy);
            audio.playSfx('paddle');
            spawnParticles(ball.x, ball.y, EGA.CYAN, 3);
          }

          // World 3: Atlantean Gravity Well Slingshot Physics
          if (worldMechanics.gravityWell.active) {
            const gw = worldMechanics.gravityWell;
            const gdx = gw.x - ball.x;
            const gdy = gw.y - ball.y;
            const gdistSq = gdx * gdx + gdy * gdy;
            if (gdistSq < 3600 && gdistSq > 36) { // within 60px
              const gdist = Math.sqrt(gdistSq);
              const force = (worldMechanics.gravityWell.strength / gdistSq) * subDt;
              ball.vx += (gdx / gdist) * force;
              ball.vy += (gdy / gdist) * force;
            }
          }

          // World 6: Sam & Max Carnival Bumper
          if (worldMechanics.bumper.active) {
            const bmp = worldMechanics.bumper;
            const bdx = ball.x - bmp.x;
            const bdy = ball.y - bmp.y;
            const bdist = Math.sqrt(bdx * bdx + bdy * bdy);
            if (bdist < bmp.radius + ball.radius) {
              const nx = bdx / bdist;
              const ny = bdy / bdist;
              ball.vx = nx * 3.5;
              ball.vy = ny * 3.5;
              ball.x = bmp.x + nx * (bmp.radius + ball.radius + 1);
              ball.y = bmp.y + ny * (bmp.radius + ball.radius + 1);
              audio.playSfx('clink');
              score += 150;
              spawnParticles(ball.x, ball.y, EGA.YELLOW, 12, 3);
              addFloatingText("+150 BUMPER!", bmp.x, bmp.y - 10, EGA.YELLOW);
            }
          }

          // World 7: Ball vs LeChuck Boss
          if (worldMechanics.leChuck.active && !worldMechanics.leChuck.defeated) {
            const boss = worldMechanics.leChuck;
            const closestX = Math.max(boss.x, Math.min(ball.x, boss.x + boss.w));
            const closestY = Math.max(boss.y, Math.min(ball.y, boss.y + boss.h));
            const distX = ball.x - closestX;
            const distY = ball.y - closestY;
            if (distX * distX + distY * distY < ball.radius * ball.radius) {
              boss.hp -= 2;
              boss.hitTimer = 12;
              screenShake = 8;
              audio.playSfx('bossHit');
              spawnParticles(closestX, closestY, EGA.BRIGHT_RED, 14, 3);
              score += 500;
              addFloatingText("-2 BOSS HP!", closestX, closestY - 8, EGA.BRIGHT_RED);
              if (Math.abs(distX) > Math.abs(distY)) {
                ball.vx = -ball.vx;
              } else {
                ball.vy = -ball.vy;
              }
              if (boss.hp <= 0) defeatBoss();
            }
          }

          // Paddle Collision Check
          if (ball.vy > 0 &&
              ball.y + ball.radius >= paddle.y &&
              ball.y - ball.radius <= paddle.y + paddle.h &&
              ball.x >= paddle.x - ball.radius &&
              ball.x <= paddle.x + paddle.w + ball.radius) {

            comboCount = 0; // reset brick combo

            if (paddle.catchActive) {
              ball.stuck = true;
              ball.stuckOffset = ball.x - (paddle.x + paddle.w / 2);
              ball.y = paddle.y - ball.radius;
              audio.playSfx('catch');
            } else {
              // Arkanoid Deflection Angle calculation (-65 deg to +65 deg)
              const hitFactor = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
              const clampedHit = Math.max(-0.95, Math.min(0.95, hitFactor));
              const angle = clampedHit * (65 * Math.PI / 180);

              ball.speed = Math.min(4.0, ball.speed + 0.04);
              ball.vx = ball.speed * Math.sin(angle);
              ball.vy = -ball.speed * Math.cos(angle);
              ball.y = paddle.y - ball.radius;

              audio.playSfx('paddle');
              spawnParticles(ball.x, paddle.y, EGA.WHITE, 6);
            }
          }

          // AABB vs Circle Brick Collisions
          for (const b of bricks) {
            if (b.hp <= 0) continue;

            const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
            const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
            const dx = ball.x - cx;
            const dy = ball.y - cy;
            const distSq = dx * dx + dy * dy;

            if (distSq < ball.radius * ball.radius) {
              // Collision Normal Resolution
              if (Math.abs(dx) > Math.abs(dy)) {
                ball.vx = -ball.vx;
                ball.x = cx + Math.sign(dx || 1) * (ball.radius + 0.5);
              } else {
                ball.vy = -ball.vy;
                ball.y = cy + Math.sign(dy || 1) * (ball.radius + 0.5);
              }

              // Process Brick Damage
              if (b.steel) {
                audio.playSfx('steel');
                spawnParticles(cx, cy, EGA.LIGHT_GRAY, 4);
              } else if (b.grog) {
                explodeGrogBrick(b);
              } else {
                b.hp -= 1;
                comboCount++;

                // World 1: Insult combo popup every 5 hits!
                if (currentLevelIndex < 6 && comboCount >= 5 && comboCount % 5 === 0) {
                  triggerInsult();
                }

                // World 2: Chrono Anomaly Vortex Ball Cloning
                if (b.vortex && balls.length < 3) {
                  audio.playSfx('spawn');
                  balls.push(createBall(ball.x, ball.y, -ball.vx, ball.vy));
                  addFloatingText("CHRONO DUPLICATION!", ball.x, ball.y - 10, EGA.BRIGHT_CYAN);
                }

                // World 5: Loom Musical Draft Weaving
                if (b.loom) {
                  audio.playSfx('powerup');
                  worldMechanics.loomDraft.push('C');
                  if (worldMechanics.loomDraft.length >= 3) {
                    worldMechanics.loomDraft = [];
                    // Draft of Opening: Unlocks all steel bricks into gold!
                    addFloatingText("DRAFT OF OPENING!", 124, 70, EGA.BRIGHT_MAGENTA);
                    for (const sb of bricks) {
                      if (sb.steel && sb.hp > 0) {
                        sb.steel = false;
                        sb.hp = 1;
                        sb.color = EGA.GOLD;
                        sb.hi = EGA.YELLOW;
                        sb.sh = EGA.BROWN;
                        sb.pts = 300;
                        spawnParticles(sb.x + 8, sb.y + 4, EGA.GOLD, 8);
                      }
                    }
                  }
                }

                if (b.hp > 0) {
                  audio.playSfx('clink');
                  score += 50;
                  spawnParticles(cx, cy, b.color, 4);
                } else {
                  audio.playSfx('brick');
                  score += b.pts;
                  spawnParticles(b.x + 8, b.y + 4, b.color, 10);
                  maybeSpawnPowerUp(b.x + 4, b.y);
                }
              }

              // Only hit one brick per sub-step to avoid anomalous multi-bounce
              break;
            }
          }

          // Death Pit Check
          if (ball.y - ball.radius > FIELD_Y_MAX) {
            balls.splice(bIdx, 1);
            if (balls.length === 0) {
              lives--;
              audio.playSfx('die');
              screenShake = 8;
              if (lives <= 0) {
                gameState = STATE_GAME_OVER;
                audio.playSfx('gameover');
              } else {
                paddle.expandTimer = 0;
                paddle.laserTimer = 0;
                paddle.catchActive = false;
                paddle.w = paddle.baseW;
                resetBallsOnPaddle();
              }
            }
          }
        }
      }

      // Check Level Clear condition
      if (gameState === STATE_PLAYING && bricks.length > 0) {
        let breakableCount = 0;
        for (const b of bricks) {
          if (!b.steel && b.hp > 0) breakableCount++;
        }
        if (worldMechanics.leChuck.active && !worldMechanics.leChuck.defeated) {
          breakableCount += worldMechanics.leChuck.hp;
        }

        if (breakableCount === 0) {
          gameState = STATE_LEVEL_CLEAR;
          stateTimer = 120; // 2 seconds clear screen
          audio.playSfx('clear');
          score += 1000 + (lives * 500);
        }
      }

      // Update High Score
      if (score > highScore) highScore = score;

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08; // gravity
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Update Floating Texts
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 0.35;
        ft.life--;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }
    }

    function defeatBoss() {
      const boss = worldMechanics.leChuck;
      boss.defeated = true;
      boss.hp = 0;
      screenShake = 25;
      audio.playSfx('explode');
      spawnParticles(boss.x + boss.w / 2, boss.y + boss.h / 2, EGA.BRIGHT_GREEN, 50, 4);
      spawnParticles(boss.x + boss.w / 2, boss.y + boss.h / 2, EGA.YELLOW, 30, 3);
      score += 10000;
      addFloatingText("LECHUCK DESTROYED! +10,000", 124, 50, EGA.YELLOW);
      setTimeout(() => {
        gameState = STATE_VICTORY;
      }, 1500);
    }

    // =========================================================================
    // 8. PROCEDURAL EGA BACKGROUNDS & CANVAS RENDERING
    // =========================================================================
    function drawEgaBackground(worldNum) {
      // Clear playfield
      ctx.fillStyle = EGA.BLACK;
      ctx.fillRect(FIELD_X_MIN, FIELD_Y_MIN, FIELD_X_MAX - FIELD_X_MIN, FIELD_Y_MAX - FIELD_Y_MIN);

      switch (worldNum) {
        case 1: { // Mêlée Island Night Sky
          ctx.fillStyle = EGA.NAVY;
          ctx.fillRect(FIELD_X_MIN, FIELD_Y_MIN, FIELD_X_MAX - FIELD_X_MIN, 70);
          // Stars
          ctx.fillStyle = EGA.WHITE;
          for (let i = 0; i < 18; i++) {
            const sx = FIELD_X_MIN + ((i * 37) % (FIELD_X_MAX - FIELD_X_MIN - 10));
            const sy = FIELD_Y_MIN + ((i * 19) % 60);
            ctx.fillRect(sx, sy, 1, 1);
          }
          // Crescent Moon
          ctx.fillStyle = EGA.YELLOW;
          ctx.beginPath();
          ctx.arc(205, 30, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = EGA.NAVY;
          ctx.beginPath();
          ctx.arc(202, 28, 7, 0, Math.PI * 2);
          ctx.fill();
          // Scumm Bar & Mansion Silhouettes
          ctx.fillStyle = '#0a0a14';
          ctx.fillRect(FIELD_X_MIN, 130, 80, 50);
          ctx.fillRect(FIELD_X_MIN + 60, 115, 30, 65);
          ctx.fillStyle = EGA.YELLOW;
          ctx.fillRect(FIELD_X_MIN + 70, 125, 4, 6);
          break;
        }

        case 2: { // Day of the Tentacle - Dr. Fred's Lab
          ctx.fillStyle = '#140c1e';
          ctx.fillRect(FIELD_X_MIN, FIELD_Y_MIN, FIELD_X_MAX - FIELD_X_MIN, 180);
          // Toxic Sludge Pipes
          ctx.fillStyle = EGA.DARK_GREEN;
          ctx.fillRect(FIELD_X_MIN, 18, FIELD_X_MAX - FIELD_X_MIN, 5);
          ctx.fillStyle = EGA.BRIGHT_GREEN;
          ctx.fillRect(FIELD_X_MIN, 20, FIELD_X_MAX - FIELD_X_MIN, 1);
          // Checkered Floor Tiles
          for (let c = 0; c < 14; c++) {
            ctx.fillStyle = (c % 2 === 0) ? '#221533' : '#140c1e';
            ctx.fillRect(FIELD_X_MIN + c * 16, 170, 16, 20);
          }
          break;
        }

        case 3: { // Fate of Atlantis - Submerged Temple
          ctx.fillStyle = '#081820';
          ctx.fillRect(FIELD_X_MIN, FIELD_Y_MIN, FIELD_X_MAX - FIELD_X_MIN, 180);
          // Atlantean Pillars
          ctx.fillStyle = '#183040';
          ctx.fillRect(24, FIELD_Y_MIN, 12, 170);
          ctx.fillRect(212, FIELD_Y_MIN, 12, 170);
          // Molten Orichalcum channel
          ctx.fillStyle = EGA.RED;
          ctx.fillRect(FIELD_X_MIN, 175, FIELD_X_MAX - FIELD_X_MIN, 6);
          ctx.fillStyle = EGA.GOLD;
          ctx.fillRect(FIELD_X_MIN, 177, FIELD_X_MAX - FIELD_X_MIN, 2);
          break;
        }

        case 4: { // Space Combat / The Dig - Starfield & Nebula
          ctx.fillStyle = EGA.BLACK;
          ctx.fillRect(FIELD_X_MIN, FIELD_Y_MIN, FIELD_X_MAX - FIELD_X_MIN, 180);
          // Nebula haze
          ctx.fillStyle = 'rgba(85, 0, 170, 0.25)';
          ctx.fillRect(50, 30, 120, 80);
          ctx.fillStyle = 'rgba(0, 170, 170, 0.15)';
          ctx.fillRect(80, 50, 100, 60);
          // Twinkling space stars
          ctx.fillStyle = EGA.WHITE;
          for (let i = 0; i < 28; i++) {
            const sx = FIELD_X_MIN + ((i * 43) % (FIELD_X_MAX - FIELD_X_MIN - 6));
            const sy = FIELD_Y_MIN + ((i * 29) % 150);
            ctx.fillRect(sx, sy, 1, 1);
          }
          break;
        }

        case 5: { // The Loom of Fate - Cosmic Weavers Tapestry
          ctx.fillStyle = '#100820';
          ctx.fillRect(FIELD_X_MIN, FIELD_Y_MIN, FIELD_X_MAX - FIELD_X_MIN, 180);
          // Shimmering aurora threads
          ctx.strokeStyle = 'rgba(85, 255, 255, 0.15)';
          ctx.lineWidth = 1;
          for (let i = 0; i < 8; i++) {
            ctx.beginPath();
            ctx.moveTo(FIELD_X_MIN + i * 28, FIELD_Y_MIN);
            ctx.lineTo(FIELD_X_MIN + i * 28 + 20, 180);
            ctx.stroke();
          }
          break;
        }

        case 6: { // Sam & Max - Route 66 Highway Sunset
          ctx.fillStyle = '#2b0c2b';
          ctx.fillRect(FIELD_X_MIN, FIELD_Y_MIN, FIELD_X_MAX - FIELD_X_MIN, 60);
          ctx.fillStyle = EGA.BROWN;
          ctx.fillRect(FIELD_X_MIN, 60, FIELD_X_MAX - FIELD_X_MIN, 40);
          ctx.fillStyle = '#1a1a1a';
          ctx.fillRect(FIELD_X_MIN, 100, FIELD_X_MAX - FIELD_X_MIN, 80);
          // Highway yellow divider
          ctx.fillStyle = EGA.YELLOW;
          for (let i = 0; i < 6; i++) {
            ctx.fillRect(FIELD_X_MIN + 25 + i * 36, 140, 18, 2);
          }
          break;
        }

        case 7: { // LeChuck's Demonic Hellfire
          ctx.fillStyle = '#1a0000';
          ctx.fillRect(FIELD_X_MIN, FIELD_Y_MIN, FIELD_X_MAX - FIELD_X_MIN, 180);
          // Volcanic stalactites
          ctx.fillStyle = '#330000';
          for (let i = 0; i < 9; i++) {
            ctx.fillRect(FIELD_X_MIN + i * 25, FIELD_Y_MIN, 16, 14 + (i % 3) * 6);
          }
          // Boiling Lava at bottom
          ctx.fillStyle = EGA.RED;
          ctx.fillRect(FIELD_X_MIN, 172, FIELD_X_MAX - FIELD_X_MIN, 18);
          ctx.fillStyle = EGA.GOLD;
          ctx.fillRect(FIELD_X_MIN, 175, FIELD_X_MAX - FIELD_X_MIN, 6);
          ctx.fillStyle = EGA.YELLOW;
          ctx.fillRect(FIELD_X_MIN, 178, FIELD_X_MAX - FIELD_X_MIN, 2);
          break;
        }
      }
    }

    // Draw Paddle Sprite
    function drawPaddle() {
      // Main Paddle Body
      ctx.fillStyle = EGA.LIGHT_GRAY;
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

      // Top Highlight & Bottom Shadow (Beveled 3D retro look)
      ctx.fillStyle = EGA.WHITE;
      ctx.fillRect(paddle.x, paddle.y, paddle.w, 1);
      ctx.fillStyle = EGA.DARK_GRAY;
      ctx.fillRect(paddle.x, paddle.y + paddle.h - 1, paddle.w, 1);

      // Red End Caps
      ctx.fillStyle = EGA.RED;
      ctx.fillRect(paddle.x, paddle.y, 4, paddle.h);
      ctx.fillRect(paddle.x + paddle.w - 4, paddle.y, 4, paddle.h);

      // Center Core
      if (paddle.catchActive) {
        // Glowing Green Magnetic field
        ctx.fillStyle = EGA.BRIGHT_GREEN;
        ctx.fillRect(paddle.x + paddle.w / 2 - 4, paddle.y + 1, 8, paddle.h - 2);
      } else {
        // Glowing Blue Power Core
        ctx.fillStyle = EGA.BRIGHT_CYAN;
        ctx.fillRect(paddle.x + paddle.w / 2 - 3, paddle.y + 1, 6, paddle.h - 2);
      }

      // Blasters mounted if Laser Active
      if (paddle.laserTimer > 0) {
        ctx.fillStyle = EGA.BRIGHT_RED;
        ctx.fillRect(paddle.x - 2, paddle.y - 3, 3, 5);
        ctx.fillRect(paddle.x + paddle.w - 1, paddle.y - 3, 3, 5);
        ctx.fillStyle = EGA.YELLOW;
        ctx.fillRect(paddle.x - 1, paddle.y - 4, 1, 2);
        ctx.fillRect(paddle.x + paddle.w, paddle.y - 4, 1, 2);
      }
    }

    // Draw Balls
    function drawBalls() {
      for (const b of balls) {
        // Ghost motion blur trail
        for (let t = 0; t < b.trail.length; t++) {
          const pt = b.trail[t];
          ctx.fillStyle = (t === 0) ? EGA.CYAN : EGA.BLUE;
          ctx.fillRect(pt.x - 1.5, pt.y - 1.5, 3, 3);
        }

        // Main Ball
        ctx.fillStyle = EGA.WHITE;
        ctx.fillRect(b.x - b.radius, b.y - b.radius, b.radius * 2, b.radius * 2);
        // Cyan Core highlight
        ctx.fillStyle = EGA.BRIGHT_CYAN;
        ctx.fillRect(b.x - 1, b.y - 1, 2, 2);
      }
    }

    // Draw Bricks
    function drawBricks() {
      for (const b of bricks) {
        if (b.hp <= 0) continue;

        // Brick Body
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);

        // Top & Left 3D Highlights
        ctx.fillStyle = b.hi;
        ctx.fillRect(b.x, b.y, b.w, 1);
        ctx.fillRect(b.x, b.y, 1, b.h);

        // Bottom & Right 3D Shadows
        ctx.fillStyle = b.sh;
        ctx.fillRect(b.x, b.y + b.h - 1, b.w, 1);
        ctx.fillRect(b.x + b.w - 1, b.y, 1, b.h);

        // Armored Brick Cracking Overlays
        if (b.armored && b.hp < b.maxHp) {
          ctx.fillStyle = EGA.BLACK;
          ctx.fillRect(b.x + 3, b.y + 2, 3, 1);
          ctx.fillRect(b.x + 5, b.y + 3, 3, 1);
          ctx.fillRect(b.x + 7, b.y + 4, 3, 1);
          if (b.hp === 1 && b.maxHp === 3) {
            ctx.fillRect(b.x + 10, b.y + 2, 2, 4);
          }
        }

        // Steel Brick Rivets
        if (b.steel) {
          ctx.fillStyle = EGA.LIGHT_GRAY;
          ctx.fillRect(b.x + 2, b.y + 2, 2, 2);
          ctx.fillRect(b.x + b.w - 4, b.y + 2, 2, 2);
          ctx.fillRect(b.x + 2, b.y + b.h - 4, 2, 2);
          ctx.fillRect(b.x + b.w - 4, b.y + b.h - 4, 2, 2);
        }

        // Grog Explosive Icon (Crossbones / Hazard)
        if (b.grog) {
          ctx.fillStyle = EGA.YELLOW;
          ctx.fillRect(b.x + 4, b.y + 2, 8, 4);
          ctx.fillStyle = EGA.RED;
          ctx.fillRect(b.x + 7, b.y + 2, 2, 4);
          ctx.fillRect(b.x + 5, b.y + 3, 6, 2);
        }

        // Loom Musical Rune Brick
        if (b.loom) {
          ctx.fillStyle = EGA.WHITE;
          ctx.fillRect(b.x + 6, b.y + 2, 4, 4);
          ctx.fillStyle = EGA.BRIGHT_CYAN;
          ctx.fillRect(b.x + 7, b.y + 3, 2, 2);
        }

        // Temporal Vortex Brick
        if (b.vortex) {
          ctx.fillStyle = EGA.BRIGHT_MAGENTA;
          ctx.fillRect(b.x + 5, b.y + 2, 6, 4);
          ctx.fillStyle = EGA.WHITE;
          ctx.fillRect(b.x + 7, b.y + 3, 2, 2);
        }
      }
    }

    // Draw Power-Ups
    function drawPowerUps() {
      for (const p of powerUps) {
        // Pill capsule shape
        let bgCol = EGA.BLUE;
        if (p.type === 'L') bgCol = EGA.RED;
        if (p.type === 'C') bgCol = EGA.GREEN;
        if (p.type === 'S') bgCol = EGA.ORANGE;
        if (p.type === 'P') bgCol = EGA.GOLD;

        ctx.fillStyle = bgCol;
        ctx.fillRect(p.x, p.y, p.w, p.h);

        // Highlight
        ctx.fillStyle = EGA.WHITE;
        ctx.fillRect(p.x, p.y, p.w, 1);

        // Letter Glyph in center
        drawText(ctx, p.type, p.x + 5, p.y + 1, EGA.WHITE, 1, false);
      }
    }

    // Draw Lasers
    function drawLasers() {
      ctx.fillStyle = EGA.BRIGHT_RED;
      for (const l of lasers) {
        ctx.fillRect(l.x, l.y, 2, 6);
        ctx.fillStyle = EGA.YELLOW;
        ctx.fillRect(l.x, l.y + 1, 2, 2);
      }

    // Draw LeChuck Animated Boss Sprite (Level 33)
    function drawLeChuckBoss() {
      const boss = worldMechanics.leChuck;
      if (!boss.active || boss.defeated) return;

      const bx = Math.floor(boss.x);
      const by = Math.floor(boss.y);

      // Hit damage white flash
      if (boss.hitTimer > 0 && Math.floor(Date.now() / 50) % 2 === 0) {
        ctx.fillStyle = EGA.WHITE;
        ctx.fillRect(bx, by, boss.w, boss.h);
        return;
      }

      // Ghost Pirate Hat
      ctx.fillStyle = '#1c1524';
      ctx.fillRect(bx + 4, by, 24, 7);
      ctx.fillRect(bx, by + 4, 32, 4);
      // Golden Skull & Crossbones on Hat
      ctx.fillStyle = EGA.GOLD;
      ctx.fillRect(bx + 14, by + 2, 4, 3);

      // Ghostly Green Decaying Face
      ctx.fillStyle = EGA.GREEN;
      ctx.fillRect(bx + 7, by + 8, 18, 9);
      // Piercing Red Evil Eyes
      ctx.fillStyle = EGA.BRIGHT_RED;
      ctx.fillRect(bx + 10, by + 10, 3, 2);
      ctx.fillRect(bx + 19, by + 10, 3, 2);

      // Flaming Spectral Beard (Flickers in real-time)
      const flameShift = (Math.floor(Date.now() / 100) % 2);
      ctx.fillStyle = EGA.BRIGHT_GREEN;
      ctx.fillRect(bx + 5, by + 16, 22, 6);
      ctx.fillStyle = EGA.BRIGHT_CYAN;
      ctx.fillRect(bx + 7 + flameShift, by + 20, 18, 5);
      ctx.fillStyle = EGA.YELLOW;
      ctx.fillRect(bx + 12, by + 23, 8, 3);

      // Epaulets & Coat
      ctx.fillStyle = EGA.RED;
      ctx.fillRect(bx + 4, by + 17, 4, 7);
      ctx.fillRect(bx + 24, by + 17, 4, 7);
      ctx.fillStyle = EGA.GOLD;
      ctx.fillRect(bx + 3, by + 16, 5, 2);
      ctx.fillRect(bx + 24, by + 16, 5, 2);
    }

      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.fillRect(FIELD_X_MIN, 75, FIELD_X_MAX - FIELD_X_MIN, 45);

      drawTextCenteredInField(ctx, "WORLD " + levelData.world + ": " + levelData.worldName.toUpperCase(), 82, EGA.BRIGHT_CYAN, 1);
      drawTextCenteredInField(ctx, levelData.name.toUpperCase(), 94, EGA.YELLOW, 1);
      drawTextCenteredInField(ctx, levelData.sub.toUpperCase(), 106, EGA.LIGHT_GRAY, 1);
    }

    function drawLevelClearScreen() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.fillRect(FIELD_X_MIN, 70, FIELD_X_MAX - FIELD_X_MIN, 50);

      drawTextCenteredInField(ctx, "LEVEL COMPLETED!", 80, EGA.BRIGHT_GREEN, 2);
      drawTextCenteredInField(ctx, "BONUS: +1000 PTS + LIFE BONUS", 102, EGA.YELLOW, 1);
    }

    function drawGameOverScreen() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
      ctx.fillRect(FIELD_X_MIN, 50, FIELD_X_MAX - FIELD_X_MIN, 95);

      drawTextCenteredInField(ctx, "GAME OVER", 62, EGA.BRIGHT_RED, 2);
      drawTextCenteredInField(ctx, "YOU DIED LIKE A DOG ON BRICK ISLAND", 84, EGA.LIGHT_GRAY, 1);

      let rank = "SWAB";
      if (score > 10000) rank = "CABIN BOY";
      if (score > 25000) rank = "DECKHAND";
      if (score > 50000) rank = "FIRST MATE";
      if (score > 100000) rank = "MIGHTY PIRATE!";
      drawTextCenteredInField(ctx, "FINAL RANK: " + rank, 100, EGA.GOLD, 1);

      const blink = Math.floor(Date.now() / 400) % 2 === 0;
      if (blink) {
        drawTextCenteredInField(ctx, "PRESS SPACEBAR TO RESTART", 124, EGA.YELLOW, 1);
      }
    }

    function drawVictoryScreen() {
      ctx.fillStyle = '#06050e';
      ctx.fillRect(0, 0, 320, 200);

      drawTextCentered(ctx, "VICTORY!", 20, EGA.GOLD, 3);
      drawTextCentered(ctx, "THE SECRET OF BRICK ISLAND HAS BEEN WON!", 48, EGA.BRIGHT_GREEN, 1);

      // Pixel Art Guybrush with Root Beer bottle celebrating!
      const gx = 150;
      const gy = 68;
      // Head
      ctx.fillStyle = EGA.GOLD;
      ctx.fillRect(gx + 4, gy, 8, 8);
      // Pirate Coat
      ctx.fillStyle = EGA.BLUE;
      ctx.fillRect(gx + 2, gy + 8, 12, 14);
      // White shirt
      ctx.fillStyle = EGA.WHITE;
      ctx.fillRect(gx + 6, gy + 9, 4, 8);
      // Root beer bottle in hand
      ctx.fillStyle = EGA.BROWN;
      ctx.fillRect(gx + 15, gy + 5, 4, 10);
      ctx.fillStyle = EGA.WHITE;
      ctx.fillRect(gx + 16, gy + 3, 2, 3); // froth

      drawTextCentered(ctx, "GUYBRUSH THREEPWOOD ANNIHILATED LECHUCK", 102, EGA.YELLOW, 1);
      drawTextCentered(ctx, "WITH 100% PURE ROOT BEER!", 114, EGA.BRIGHT_CYAN, 1);

      drawTextCentered(ctx, "FINAL SCORE: " + score, 134, EGA.WHITE, 1);

      drawTextCentered(ctx, "THANK YOU FOR PLAYING OUR RETRO LUCASARTS TRIBUTE!", 155, EGA.LIGHT_GRAY, 1);

      const blink = Math.floor(Date.now() / 450) % 2 === 0;
      if (blink) {
        drawTextCentered(ctx, "PRESS SPACEBAR TO RETURN TO MAIN MENU", 176, EGA.GOLD, 1);
      }
    }

    function drawPausedScreen() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(FIELD_X_MIN, 80, FIELD_X_MAX - FIELD_X_MIN, 35);
      drawTextCenteredInField(ctx, "GAME PAUSED", 88, EGA.YELLOW, 2);
      drawTextCenteredInField(ctx, "PRESS P OR ESCAPE TO RESUME", 104, EGA.WHITE, 1);
    }

    // =========================================================================
    // 10. MAIN ANIMATION LOOP
    // =========================================================================
    function gameLoop() {
      // Screen Shake Transform
      ctx.save();
      if (screenShake > 0) {
        const sx = (Math.random() - 0.5) * screenShake;
        const sy = (Math.random() - 0.5) * screenShake;
        ctx.translate(sx, sy);
      }

      const levelData = ALL_LEVELS[currentLevelIndex] || ALL_LEVELS[0];

      if (gameState === STATE_TITLE) {
        drawTitleScreen();
      } else if (gameState === STATE_VICTORY) {
        drawVictoryScreen();
      } else {
        // Draw World Background
        drawEgaBackground(levelData.world);

        // Draw Playfield Boundaries
        drawPlayfieldWalls();

        // Draw Game Entities
        drawBricks();
        drawPowerUps();
        drawLasers();
        if (worldMechanics.leChuck.active) drawLeChuckBoss();
        drawEnemyProjectiles();
        drawPaddle();
        drawBalls();
        drawParticles();
        drawFloatingTexts();
        drawInsultDialogue();

        // Update Physics if actively playing
        if (gameState === STATE_PLAYING) {
          updatePhysics();
        }

        // Draw Right HUD Panel
        drawHUD();

        // State Banners
        if (gameState === STATE_STARTING) {
          drawStartingBanner();
          stateTimer--;
          if (stateTimer <= 0) gameState = STATE_PLAYING;
        } else if (gameState === STATE_LEVEL_CLEAR) {
          drawLevelClearScreen();
          stateTimer--;
          if (stateTimer <= 0) loadLevel(currentLevelIndex + 1);
        } else if (gameState === STATE_GAME_OVER) {
          drawGameOverScreen();
        } else if (gameState === STATE_PAUSED) {
          drawPausedScreen();
        }
      }

      ctx.restore();
      requestAnimationFrame(gameLoop);
    }

    // Launch Game Loop on Load
    requestAnimationFrame(gameLoop);

  })();
  </script>
</body>
</html>
