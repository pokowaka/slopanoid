}

function loadStage(idx, forGameplay = false) {
  game.stageIdx = ((idx % STAGES.length) + STAGES.length) % STAGES.length;
  const stg = STAGES[game.stageIdx];
  const worldId = stg.world;
  audio.setTrack(worldId);

  game.bricks = [];
  game.destructibleCount = 0;
  game.capsules = [];
  game.lasers = [];
  game.particles = [];
  game.shockwaves = [];
  game.floatTexts = [];
  game.combo = 0;

  for (let r = 0; r < BRICK_ROWS; r++) {
    const line = (stg.rows[r] || "").padEnd(BRICK_COLS, ".").slice(0, BRICK_COLS);
    for (let c = 0; c < BRICK_COLS; c++) {
      const ch = line[c];
      if (ch === "." || ch === " ") continue;
      const indestructible = ch === "#";
      const maxHp = ch === "3" ? 3 : ch === "2" ? 2 : indestructible ? 999 : 1;
      const isGrog = ch === "X";
      // World 2 Chron-o-John temporal phase tag on alternating outer/inner bands
      let phaseEra = -1; // -1 = always solid; 0 = ghost in PAST; 2 = ghost in FUTURE
      if (worldId === 1 && !indestructible && !isGrog && ((r + c) % 5 === 0)) {
        phaseEra = ((r + c) & 1) ? 0 : 2;
      }
      // World 5 Loom musical note resonance
      const loomNote = worldId === 4 && !indestructible ? ((c + r * 2) % 7) : -1;

      game.bricks.push({
        col: c, row: r,
        x: ARENA_X0 + c * BRICK_W,
        y: BRICK_TOP + r * BRICK_H,
        w: BRICK_W, h: BRICK_H,
        code: ch,
        hp: maxHp, maxHp,
        indestructible,
        isGrog,
        phaseEra,
        loomNote,
        flashTimer: 0
      });
      if (!indestructible) game.destructibleCount++;
    }
  }

  // Initialize World-Specific Mechanics
  const m = game.mech;
  m.duelActive = false; m.duelHits = 0; m.duelCooldown = 4.0;
  m.era = 1; m.eraTimer = 6.5;
  m.idols = []; m.darts = [];
  m.wells = [];
  m.notes = []; m.lastSpell = "WEAVE 4";
  m.cruisers = [];
  m.boss = null; m.hazards = [];

  if (worldId === 2) {
    // Lost Atlantis: 3 Ceiling Stone Idols
    m.idols = [
      { x: 46, y: 8, timer: 2.4, charging: false },
      { x: 121, y: 8, timer: 4.1, charging: false },
      { x: 196, y: 8, timer: 3.2, charging: false }
    ];
  } else if (worldId === 3) {
    // Space Combat: Twin Orbital Gravity Vortices in open lanes
    m.wells = [
      { x: 66, y: 136, pull: 2100, spin: 1 },
      { x: 190, y: 136, pull: 2100, spin: -1 }
    ];
  } else if (worldId === 5) {
    // Sam & Max Highway: Patrolling DeSoto Cruisers
    m.cruisers = [
      { x: 42, y: 132, vx: 38, w: 20, h: 10 },
      { x: 178, y: 146, vx: -44, w: 20, h: 10 }
    ];
  } else if (worldId === 6) {
    // Level 33: Ghost Pirate LeChuck Boss!
    m.boss = {
      x: 106, y: 15, w: 44, h: 30,
      vx: 42,
      hp: 40, maxHp: 40,
      fireTimer: 2.2,
      skullTimer: 4.8,
      laughTimer: 0,
      flashTimer: 0
    };
  }

  resetPaddleAndBall(false);
  if (forGameplay) {
    const q = CHAR_QUIPS[WORLD_DEFS[worldId].portraitId];
    sayQuip(q.start, "cheer", 3.2);
  } else {
    game.speechText = "";
    game.speechTimer = 0;
  }
}

function isBrickSolid(b) {
  if (b.hp <= 0) return false;
  if (b.phaseEra >= 0 && game.destructibleCount > 6 && game.mech.era === b.phaseEra) {
    return false; // Phased into Chron-o-John hologram!
  }
  return true;
}

function maybeSpawnCapsule(x, y, force = false) {
  if (!force && (game.capsules.length >= 3 || Math.random() > 0.21)) return;
  const types = ["L", "E", "C", "S", "P"];
  const type = types[(Math.random() * types.length) | 0];
  game.capsules.push({ x: clamp(x - 9, ARENA_X0 + 2, ARENA_X1 - 20), y, w: 18, h: 9, vy: 46, type });
}

function applyCapsule(type) {
  const p = game.paddle;
  const wDef = WORLD_DEFS[STAGES[game.stageIdx].world];
  audio.sfx("powerup");
  addScore(500, p.x, p.y - 8, 63);
  sayQuip(CHAR_QUIPS[wDef.portraitId].power, "cheer", 2.4);

  if (type === "E") {
    p.mode = "expand"; p.w = 48; p.h = 8;
  } else if (type === "L") {
    p.mode = "laser"; p.w = 34; p.h = 8;
  } else if (type === "C") {
    p.mode = "catch"; p.w = 34; p.h = 8;
  } else if (type === "S") {
    p.slowTimer = 12.0;
    for (const b of game.balls) b.speed = Math.max(88, b.speed * 0.76);
  } else if (type === "P") {
    // Gold Guy Multi-Ball: split active balls up to 6!
    const base = game.balls[0];
    if (base) {
      base.stuck = false;
      const extras = [-0.42, 0.42];
      for (const angOff of extras) {
        if (game.balls.length >= 6) break;
        const baseAng = Math.atan2(base.vy, base.vx) + angOff;
        const spd = clamp(base.speed, 118, 165);
        game.balls.push({
          x: base.x, y: base.y,
          vx: Math.cos(baseAng) * spd,
          vy: -Math.abs(Math.sin(baseAng) * spd) - 25,
          speed: spd,
          stuck: false, stuckOffset: 0,
          fire: base.fire,
          trail: []
        });
      }
    }
  }
}

// 3x3 Recursive Grog Barrel Chain Explosion!
function detonateGrogBrick(centerBrick) {
  const queue = [centerBrick];
  const visited = new Set([centerBrick]);
  while (queue.length > 0) {
    const src = queue.shift();
    const cx = src.x + 4, cy = src.y + 3;
    audio.sfx("grog");
    triggerShake(2, 0.24);
    game.shockwaves.push({ x: cx, y: cy, r: 2, maxR: 26, col: 109, life: 0.28, maxLife: 0.28 });
    spawnSparks(cx, cy, 18, [111, 109, 143, 140, 63], 1.35);

    for (const other of game.bricks) {
      if (other.hp <= 0 || other.indestructible) continue;
      if (Math.abs(other.col - src.col) <= 1 && Math.abs(other.row - src.row) <= 1) {
        other.hp = 0;
        game.destructibleCount = Math.max(0, game.destructibleCount - 1);
        addScore(150, other.x + 4, other.y, 111);
        if (other.isGrog && !visited.has(other)) {
          visited.add(other);
          queue.push(other);
        }
      }
    }
  }
}

function triggerLoomSpell() {
  const n = game.mech.notes;
  const ascending = n[3] > n[0];
  const same = n[0] === n[2] || n[1] === n[3];
  audio.sfx("spell");
  triggerShake(2, 0.2);

  if (ascending) {
    // OPENING DRAFT: Cracks armored bricks & awards bonus!
    game.mech.lastSpell = "OPENING!";
    let hits = 0;
    for (const b of game.bricks) {
      if (b.hp > 1 && !b.indestructible) {
        b.hp--;
        b.flashTimer = 0.18;
        hits++;
      }
    }
    addScore(800 + hits * 60, 128, 90, 174);
    sayQuip("DRAFT OF OPENING SHATTERS ARMOR!", "cheer", 2.8);
  } else if (same) {
    // FLAME DRAFT: Ignites fiery orbs!
    game.mech.lastSpell = "FLAME!";
    for (const ball of game.balls) ball.fire = true;
    addScore(900, 128, 90, 143);
    sayQuip("DRAFT OF FLAME IGNITES THE ORB!", "cheer", 2.8);
  } else {
    // TRANSCENDENCE DRAFT: Spawns bonus Weaver orbs!
    game.mech.lastSpell = "SWAN ORB!";
    applyCapsule("P");
    sayQuip("THE WHITE SWAN MULTIPLIES FATE!", "cheer", 2.8);
  }
  game.mech.notes = [];
}

function damageBrick(b, byFireball = false) {
  if (b.hp <= 0) return;
  if (b.indestructible) {
    b.flashTimer = 0.08;
    audio.sfx("steel");
    spawnSparks(b.x + 4, b.y + 3, 4, [255, 157], 0.55);
    return;
  }

  b.hp = byFireball ? 0 : b.hp - 1;
  b.flashTimer = 0.10;

  // World 1 Insult Sword-Fighting Duel progress
  if (STAGES[game.stageIdx].world === 0 && game.mech.duelActive) {
    game.mech.duelHits++;
    if (game.mech.duelHits >= 4) {
      const duel = INSULT_DUELS[game.mech.duelIdx];
      game.mech.duelActive = false;
      game.mech.duelCooldown = 8.0;
      addScore(1000, 128, 32, 63);
      audio.sfx("powerup");
      sayQuip(duel.reply, "cheer", 3.2);
      maybeSpawnCapsule(128, 44, true);
    }
  }

  // World 5 Loom Musical Note Weaving
  if (b.loomNote >= 0) {
    audio.sfx("loomNote", b.loomNote);
    game.mech.notes.push(b.loomNote);
    if (game.mech.notes.length >= 4) triggerLoomSpell();
  }

  if (b.hp > 0) {
    audio.sfx("armor");
    addScore(50);
    spawnSparks(b.x + 4, b.y + 3, 5, [255, 62, 155], 0.65);
    return;
  }

  // Brick destroyed!
  game.destructibleCount = Math.max(0, game.destructibleCount - 1);
  game.combo++;
  const pts = 100 + Math.min(game.combo, 12) * 25;
  addScore(pts, game.combo >= 5 ? b.x + 4 : -1, b.y, 63);

  const ramp = BRICK_COLOR_RAMPS[b.code];
  const sparkCols = ramp ? [ramp[0], ramp[1], ramp[2]] : [255, 62, 156];
  spawnSparks(b.x + 4, b.y + 3, 8, sparkCols, 0.85);

  if (b.isGrog) {
    detonateGrogBrick(b);
  } else {
    audio.sfx("brick", game.combo);
    maybeSpawnCapsule(b.x + 4, b.y + 3, false);
  }

  if (game.combo === 7) {
    const wDef = WORLD_DEFS[STAGES[game.stageIdx].world];
    sayQuip(CHAR_QUIPS[wDef.portraitId].combo, "cheer", 2.6);
  }

  // On Level 33, clearing bricks also weakens LeChuck's voodoo shield!
  if (game.mech.boss && game.destructibleCount === 0 && game.mech.boss.hp > 6) {
    game.mech.boss.hp = Math.max(1, game.mech.boss.hp - 4);
  }
}

function damageLeChuckBoss(dmg, hitX, hitY) {
  const boss = game.mech.boss;
  if (!boss || boss.hp <= 0) return;
  boss.hp = Math.max(0, boss.hp - dmg);
  boss.flashTimer = 0.11;
  triggerShake(2, 0.14);
  audio.sfx("armor");
  addScore(250 * dmg, hitX, hitY, 111);
  spawnSparks(hitX, hitY, 10, [111, 109, 143, 255], 1.0);

  if (boss.hp === 20) {
    sayQuip("BAH! TASTE MY FLAMING VOODOO SKULLS!", "cheer", 3.0);
  }
  if (boss.hp <= 0) {
    // Grand Boss Explosion!
    audio.sfx("grog");
    triggerShake(3, 0.6);
    for (let i = 0; i < 4; i++) {
      game.shockwaves.push({
        x: boss.x + 10 + i * 8, y: boss.y + 15,
        r: 2, maxR: 38, col: i & 1 ? 143 : 111, life: 0.45, maxLife: 0.45
      });
    }
    spawnSparks(boss.x + 22, boss.y + 15, 45, [111, 109, 143, 140, 255], 1.6);
    // Clear remaining fortress bricks in victory blast
    for (const b of game.bricks) {
      if (!b.indestructible && b.hp > 0) b.hp = 0;
    }
    game.destructibleCount = 0;
    addScore(10000, boss.x + 22, boss.y + 10, 63);
    sayQuip(CHAR_QUIPS[6].clear, "wince", 4.0);
    game.state = "VICTORY";
    audio.sfx("clear");
  }
}

function fireLasers() {
  const p = game.paddle;
  if (p.mode !== "laser" || p.laserCooldown > 0 || game.lasers.length >= 6) return;
  p.laserCooldown = 0.24;
  audio.sfx("laser");
  game.lasers.push({ x: p.x - p.w * 0.5 + 3, y: p.y - 5 });
  game.lasers.push({ x: p.x + p.w * 0.5 - 6, y: p.y - 5 });
}

function launchBallsAndFire() {
  let launchedAny = false;
  for (const b of game.balls) {
    if (b.stuck) {
      b.stuck = false;
      const norm = clamp(b.stuckOffset / Math.max(1, game.paddle.w * 0.5), -0.85, 0.85);
      const ang = norm * 0.95;
      b.vx = Math.sin(ang) * b.speed;
      b.vy = -Math.cos(ang) * b.speed;
      launchedAny = true;
    }
  }
  if (launchedAny) audio.sfx("paddle", 1);
  else fireLasers();
}

function enforceBallVelocity(b) {
  const spd = clamp(b.speed, 88, 188);
  let len = Math.hypot(b.vx, b.vy);
  if (len < 0.001) { b.vx = 48; b.vy = -115; len = Math.hypot(b.vx, b.vy); }
  let nx = b.vx / len, ny = b.vy / len;
  // Prevent infinite shallow horizontal loops!
  if (Math.abs(ny) < 0.24) {
    ny = (ny < 0 ? -1 : 1) * 0.24;
    const signX = nx < 0 ? -1 : 1;
    nx = signX * Math.sqrt(1 - ny * ny);
  }
  b.vx = nx * spd;
  b.vy = ny * spd;
}

function hasSolidBrickAt(col, row) {
  if (col < 0 || col >= BRICK_COLS || row < 0 || row >= BRICK_ROWS) return false;
  for (const b of game.bricks) {
    if (b.col === col && b.row === row && isBrickSolid(b)) return true;
  }
  return false;
}

// Sub-stepped Corner-Safe Circle-vs-AABB Ball Physics!
function stepBallPhysics(b, dt) {
  const p = game.paddle;
  if (b.stuck) {
    b.x = clamp(p.x + b.stuckOffset, ARENA_X0 + 4, ARENA_X1 - 4);
    b.y = p.y - 3;
    return true;
  }

  // Record quantized pixel trail
  b.trail.unshift({ x: b.x, y: b.y });
  if (b.trail.length > 6) b.trail.pop();

  // World 4 Orbital Gravity Wells gentle curve
  if (STAGES[game.stageIdx].world === 3) {
    for (const w of game.mech.wells) {
      const dx = w.x - b.x, dy = w.y - b.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 6 && dist < 44) {
        const pull = (w.pull / (dist * dist + 120)) * dt;
        // Radial + orbital tangential swirl
        b.vx += (dx / dist - (dy / dist) * 0.45 * w.spin) * pull * 35;
        b.vy += (dy / dist + (dx / dist) * 0.45 * w.spin) * pull * 35;
        enforceBallVelocity(b);
      }
    }
  }

  const r = 2.4;
  const totalMove = b.speed * dt;
  const steps = Math.max(2, Math.ceil(totalMove / 1.4));
  const subDt = dt / steps;

  for (let s = 0; s < steps; s++) {
    b.x += b.vx * subDt;
    b.y += b.vy * subDt;

    // Arena Walls (x = 8..248, top y = 8)
    if (b.x - r < ARENA_X0) {
      b.x = ARENA_X0 + r;
      b.vx = Math.abs(b.vx);
      enforceBallVelocity(b);
      audio.sfx("paddle", 0);
    } else if (b.x + r > ARENA_X1) {
      b.x = ARENA_X1 - r;
      b.vx = -Math.abs(b.vx);
      enforceBallVelocity(b);
      audio.sfx("paddle", 0);
    }
    if (b.y - r < ARENA_Y0) {
      b.y = ARENA_Y0 + r;
      b.vy = Math.abs(b.vy);
      enforceBallVelocity(b);
      audio.sfx("paddle", 0);
    }

    // Bottom Pit Check
    if (b.y - r > PLAY_H + 4) return false;

    // Paddle Collision
    const px0 = p.x - p.w * 0.5, px1 = p.x + p.w * 0.5;
    if (b.vy > 0 && b.y + r >= p.y && b.y - r <= p.y + p.h - 1 && b.x + r >= px0 && b.x - r <= px1) {
      game.combo = 0;
      const rel = clamp((b.x - p.x) / (p.w * 0.5), -0.95, 0.95);
      const maxAng = 1.08; // ~62 degrees
      const ang = rel * maxAng;
      b.speed = Math.min(176, b.speed + 1.4);
      b.vx = Math.sin(ang) * b.speed + p.vx * 0.08;
      b.vy = -Math.cos(ang) * b.speed;
      enforceBallVelocity(b);
      b.y = p.y - r - 0.1;
      audio.sfx("paddle", Math.abs(rel) * 2);

      if (p.mode === "catch") {
        b.stuck = true;
        b.stuckOffset = clamp(b.x - p.x, -p.w * 0.42, p.w * 0.42);
        return true;
      }
    }

    // Closest Circle-vs-AABB Brick Collision with Adjacent-Seam Protection
    let bestBrick = null, bestDistSq = r * r, bestDx = 0, bestDy = 0;
    for (const br of game.bricks) {
      if (!isBrickSolid(br)) continue;
      const cx = clamp(b.x, br.x, br.x + br.w);
      const cy = clamp(b.y, br.y, br.y + br.h);
      const dx = b.x - cx, dy = b.y - cy;
      const d2 = dx * dx + dy * dy;
      if (d2 < bestDistSq) {
        bestDistSq = d2;
        bestBrick = br;
        bestDx = dx;
        bestDy = dy;
      }
    }

    if (bestBrick) {
      const br = bestBrick;
      const passThrough = b.fire && !br.indestructible && br.hp === 1;
      if (!passThrough) {
        const overlapLeft = (b.x + r) - br.x;
        const overlapRight = (br.x + br.w) - (b.x - r);
        const overlapTop = (b.y + r) - br.y;
        const overlapBot = (br.y + br.h) - (b.y - r);
        const minX = Math.min(overlapLeft, overlapRight);
        const minY = Math.min(overlapTop, overlapBot);

        let flipX = Math.abs(bestDx) > Math.abs(bestDy);
        if (Math.abs(bestDx) === 0 && Math.abs(bestDy) === 0) flipX = minX < minY;

        // Seam guard: don't reflect horizontally into an occupied horizontal neighbor!
        if (flipX) {
          const nCol = bestDx < 0 ? br.col - 1 : br.col + 1;
          if (hasSolidBrickAt(nCol, br.row)) flipX = false;
        } else {
          const nRow = bestDy < 0 ? br.row - 1 : br.row + 1;
          if (hasSolidBrickAt(br.col, nRow)) flipX = true;
        }

        if (flipX) {
          if (b.x < br.x + br.w * 0.5) { b.x = br.x - r - 0.05; b.vx = -Math.abs(b.vx); }
          else { b.x = br.x + br.w + r + 0.05; b.vx = Math.abs(b.vx); }
        } else {
          if (b.y < br.y + br.h * 0.5) { b.y = br.y - r - 0.05; b.vy = -Math.abs(b.vy); }
          else { b.y = br.y + br.h + r + 0.05; b.vy = Math.abs(b.vy); }
        }
        enforceBallVelocity(b);
      }
      damageBrick(br, passThrough);
    }

    // World 6 Highway Patrol Cruiser Collision
    for (const cr of game.mech.cruisers) {
      if (b.x + r > cr.x && b.x - r < cr.x + cr.w && b.y + r > cr.y && b.y - r < cr.y + cr.h) {
        b.vy = -b.vy;
        enforceBallVelocity(b);
        addScore(500, cr.x + 10, cr.y, 207);
        audio.sfx("armor");
        spawnSparks(cr.x + 10, cr.y + 5, 10, [255, 241, 174, 63], 0.9);
        maybeSpawnCapsule(cr.x + 10, cr.y + 5, false);
        cr.x = cr.vx > 0 ? ARENA_X0 + 2 : ARENA_X1 - cr.w - 2;
      }
    }

    // World 7 Ghost Pirate LeChuck Boss Collision (44x30)
    const boss = game.mech.boss;
    if (boss && boss.hp > 0) {
      if (b.x + r > boss.x + 4 && b.x - r < boss.x + boss.w - 4 &&
          b.y + r > boss.y + 2 && b.y - r < boss.y + boss.h - 2) {
        const fromSide = Math.min(Math.abs(b.x - (boss.x + 4)), Math.abs(b.x - (boss.x + boss.w - 4))) <
                         Math.min(Math.abs(b.y - (boss.y + 2)), Math.abs(b.y - (boss.y + boss.h - 2)));
        if (fromSide) b.vx = -b.vx;
        else b.vy = b.y < boss.y + 15 ? -Math.abs(b.vy) : Math.abs(b.vy);
        b.y += Math.sign(b.vy) * 2;
        enforceBallVelocity(b);
        damageLeChuckBoss(2, b.x, b.y);
      }
    }
  }
  return true;
}

function updateWorldMechanics(dt) {
  const worldId = STAGES[game.stageIdx].world;
  const m = game.mech;
  const p = game.paddle;

  if (worldId === 0) {
    // World 1: Insult Sword-Fighting Duels
    if (!m.duelActive) {
      m.duelCooldown -= dt;
      if (m.duelCooldown <= 0) {
        m.duelActive = true;
        m.duelIdx = (Math.random() * INSULT_DUELS.length) | 0;
        m.duelHits = 0;
        m.duelTimer = 9.0;
        sayQuip(INSULT_DUELS[m.duelIdx].insult, "idle", 3.0);
      }
    } else {
      m.duelTimer -= dt;
      if (m.duelTimer <= 0) {
        m.duelActive = false;
        m.duelCooldown = 7.5;
        sayQuip("UGH... SHOULD'VE SAID 'RUBBER & GLUE'!", "wince", 2.2);
      }
    }
  } else if (worldId === 1) {
    // World 2: Chron-o-John Era Phasing
    m.eraTimer -= dt;
    if (m.eraTimer <= 0) {
      m.era = (m.era + 1) % 3;
      m.eraTimer = 6.5;
      audio.sfx("warp");
    }
  } else if (worldId === 2) {
    // World 3: Dart-Spitting Atlantean Stone Idols
    for (const id of m.idols) {
      id.timer -= dt;
      id.charging = id.timer < 0.75;
      if (id.timer <= 0) {
        id.timer = 3.2 + Math.random() * 1.8;
        m.darts.push({ x: id.x + 5, y: id.y + 11, vy: 76 });
      }
    }
    for (let i = m.darts.length - 1; i >= 0; i--) {
      const d = m.darts[i];
      d.y += d.vy * dt;
      if (d.y > PLAY_H) { m.darts.splice(i, 1); continue; }
      if (d.y + 8 >= p.y && d.y <= p.y + p.h && d.x + 4 >= p.x - p.w * 0.5 && d.x <= p.x + p.w * 0.5) {
        m.darts.splice(i, 1);
        p.curseTimer = 3.5;
        if (p.mode === "expand") { p.mode = "normal"; p.w = 32; p.h = 7; }
        triggerShake(2, 0.18);
        audio.sfx("hurt");
        sayQuip(CHAR_QUIPS[2].hurt, "wince", 2.5);
      }
    }
  } else if (worldId === 5) {
    // World 6: Sam & Max Patrolling Road Cruisers
    for (const cr of m.cruisers) {
      cr.x += cr.vx * dt;
      if (cr.x < ARENA_X0 + 2) { cr.x = ARENA_X0 + 2; cr.vx = Math.abs(cr.vx); }
      if (cr.x + cr.w > ARENA_X1 - 2) { cr.x = ARENA_X1 - 2 - cr.w; cr.vx = -Math.abs(cr.vx); }
    }
  } else if (worldId === 6 && m.boss && m.boss.hp > 0) {
    // World 7: Ghost Pirate LeChuck Boss AI
    const boss = m.boss;
    const rage = boss.hp <= 18 ? 1.45 : 1.0;
    boss.x += boss.vx * rage * dt;
    if (boss.x < ARENA_X0 + 6) { boss.x = ARENA_X0 + 6; boss.vx = Math.abs(boss.vx); }
    if (boss.x + boss.w > ARENA_X1 - 6) { boss.x = ARENA_X1 - 6 - boss.w; boss.vx = -Math.abs(boss.vx); }

    if (boss.flashTimer > 0) boss.flashTimer -= dt;
    if (boss.laughTimer > 0) boss.laughTimer -= dt;

    boss.fireTimer -= dt * rage;
    if (boss.fireTimer <= 0) {
      boss.fireTimer = 2.3;
      boss.laughTimer = 0.65;
      const bx = boss.x + 22, by = boss.y + 24;
      const ang = Math.atan2(p.y - by, p.x - bx);
      m.hazards.push({ type: "fire", x: bx - 4, y: by, vx: Math.cos(ang) * 74, vy: Math.sin(ang) * 74 });
      if (boss.hp <= 22) {
        m.hazards.push({ type: "fire", x: bx - 4, y: by, vx: Math.cos(ang - 0.3) * 70, vy: Math.sin(ang - 0.3) * 70 });
        m.hazards.push({ type: "fire", x: bx - 4, y: by, vx: Math.cos(ang + 0.3) * 70, vy: Math.sin(ang + 0.3) * 70 });
      }
    }

    boss.skullTimer -= dt;
    if (boss.skullTimer <= 0 && m.hazards.length < 6) {
      boss.skullTimer = 4.6;
      m.hazards.push({ type: "skull", x: boss.x + 16, y: boss.y + 22, vx: (Math.random() - 0.5) * 38, vy: 46 });
    }

    for (let i = m.hazards.length - 1; i >= 0; i--) {
      const hz = m.hazards[i];
      hz.x += hz.vx * dt;
      hz.y += hz.vy * dt;
      if (hz.type === "skull") hz.vx += Math.sin(game.time * 5 + i) * 35 * dt;
      if (hz.x < ARENA_X0 || hz.x > ARENA_X1 - 9) hz.vx = -hz.vx;
      if (hz.y > PLAY_H) { m.hazards.splice(i, 1); continue; }

      const hw = hz.type === "skull" ? 11 : 9;
      if (hz.y + hw >= p.y && hz.y <= p.y + p.h && hz.x + hw >= p.x - p.w * 0.5 && hz.x <= p.x + p.w * 0.5) {
        m.hazards.splice(i, 1);
        p.curseTimer = 3.0;
        if (p.mode !== "normal") { p.mode = "normal"; p.w = 32; p.h = 7; }
        triggerShake(2, 0.22);
        audio.sfx("hurt");
        sayQuip(CHAR_QUIPS[6].hurt, "cheer", 2.5);
      }
    }
  }
}

// ============================================================================
// 11. INPUT CONTROLS (SMOOTH MOUSE + KEYBOARD + STAGE SELECT + TOGGLES)
// ============================================================================
const keys = Object.create(null);
let mouseTargetX = null;

window.addEventListener("keydown", (e) => {
  audio.unlock();
  const k = e.key;
  keys[k] = true;

  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " ", "Tab"].includes(k)) {
    e.preventDefault();
  }

  if (k === "m" || k === "M") {
    audio.setMuted(!audio.muted);
    return;
  }
  if (k === "c" || k === "C" || k === "Tab") {
    game.crtOn = !game.crtOn;
    cabinet.classList.toggle("crt-on", game.crtOn);
    return;
  }
  if (k === "p" || k === "P") {
    if (game.state === "PLAYING") game.state = "PAUSED";
    else if (game.state === "PAUSED") game.state = "PLAYING";
    return;
  }

  // Stage Select (1-33): Left/Right on Main Menu & Pause, or [ / ] anytime!
  if (k === "[" || ((game.state === "MENU" || game.state === "PAUSED") && (k === "ArrowLeft" || k === "a" || k === "A"))) {
    loadStage(game.stageIdx - 1, game.state === "PLAYING");
    return;
  }
  if (k === "]" || ((game.state === "MENU" || game.state === "PAUSED") && (k === "ArrowRight" || k === "d" || k === "D"))) {
    loadStage(game.stageIdx + 1, game.state === "PLAYING");
    return;
  }

  if (k === " " || k === "Enter") {
    if (game.state === "MENU") {
      game.score = 0;
      game.lives = 3;
      loadStage(game.stageIdx, true);
      game.state = "PLAYING";
    } else if (game.state === "PLAYING") {
      launchBallsAndFire();
    } else if (game.state === "GAME_OVER" || game.state === "VICTORY") {
      game.state = "MENU";
      loadStage(game.stageIdx, false);
    }
  }
  if (k === "Escape" && game.state !== "MENU") {
    game.state = "MENU";
    loadStage(game.stageIdx, false);
  }
});

window.addEventListener("keyup", (e) => { keys[e.key] = false; });

canvas.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / screenScale;
  if (mx <= PLAY_W + 8) mouseTargetX = mx;
});

canvas.addEventListener("mousedown", (e) => {
  audio.unlock();
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / screenScale;
  const my = (e.clientY - rect.top) / screenScale;

  // Clickable HUD controls on right sidebar (x >= 256)
  if (mx >= HUD_X) {
    // Stage < > click zone at y = 85..97
    if (my >= 85 && my <= 97) {
      loadStage(game.stageIdx + (mx < HUD_X + 32 ? -1 : 1), game.state === "PLAYING");
      return;
    }
    // Mute / CRT LED click zone at y = 186..199
    if (my >= 186) {
      if (mx < HUD_X + 32) audio.setMuted(!audio.muted);
      else {
        game.crtOn = !game.crtOn;
        cabinet.classList.toggle("crt-on", game.crtOn);
      }
      return;
    }
  }

  if (game.state === "MENU") {
    // Check < STAGE > arrows inside Menu Plaque (y = 148..162)
    if (my >= 146 && my <= 162 && mx >= 18 && mx <= 238) {
      if (mx < 56) { loadStage(game.stageIdx - 1, false); return; }
      if (mx > 200) { loadStage(game.stageIdx + 1, false); return; }
    }
    game.score = 0;
    game.lives = 3;
    loadStage(game.stageIdx, true);
    game.state = "PLAYING";
  } else if (game.state === "PLAYING") {
    launchBallsAndFire();
  } else if (game.state === "PAUSED") {
    game.state = "PLAYING";
  } else if (game.state === "GAME_OVER" || game.state === "VICTORY") {
    game.state = "MENU";
    loadStage(game.stageIdx, false);
  }
});

// ============================================================================
// 12. UPDATE LOOP
// ============================================================================
function update(dt) {
  game.time += dt;
  game.marqueeScroll += dt * 24;

  // Blinking & Portrait Expressions
  game.blinkTimer -= dt;
  if (game.blinkTimer <= 0) {
    if (!game.blinking) { game.blinking = true; game.blinkTimer = 0.13; }
    else { game.blinking = false; game.blinkTimer = 2.2 + Math.random() * 2.4; }
  }
  if (game.portraitExprTimer > 0) {
    game.portraitExprTimer -= dt;
    if (game.portraitExprTimer <= 0) game.portraitExpr = "idle";
  }
  if (game.speechTimer > 0) game.speechTimer -= dt;
  if (game.shakeTime > 0) game.shakeTime -= dt;

  if (game.state === "STAGE_CLEAR") {
    game.clearTimer -= dt;
    if (game.clearTimer <= 0) {
      if (game.stageIdx + 1 >= STAGES.length) {
        game.state = "VICTORY";
      } else {
        loadStage(game.stageIdx + 1, true);
        game.state = "PLAYING";
      }
    }
    return;
  }

  if (game.state !== "PLAYING") return;

  // Paddle Movement (Keyboard + Smooth Mouse)
  const p = game.paddle;
  const prevX = p.x;
  const cursed = p.curseTimer > 0;
  if (cursed) p.curseTimer -= dt;
  if (p.laserCooldown > 0) p.laserCooldown -= dt;
  if (p.slowTimer > 0) p.slowTimer -= dt;

  const moveLeft = keys["ArrowLeft"] || keys["a"] || keys["A"];
  const moveRight = keys["ArrowRight"] || keys["d"] || keys["D"];
  const padSpeed = cursed ? 105 : 185;

  if (moveLeft || moveRight) {
    mouseTargetX = null;
    if (moveLeft) p.x -= padSpeed * dt;
    if (moveRight) p.x += padSpeed * dt;
  } else if (mouseTargetX !== null) {
    const diff = mouseTargetX - p.x;
    p.x += clamp(diff, -padSpeed * 1.6 * dt, padSpeed * 1.6 * dt);
  }
  const halfW = p.w * 0.5;
  p.x = clamp(p.x, ARENA_X0 + halfW, ARENA_X1 - halfW);
  p.vx = (p.x - prevX) / Math.max(0.001, dt);

  if (keys[" "]) fireLasers();

  // Brick hit-flash decay
  for (const br of game.bricks) {
    if (br.flashTimer > 0) br.flashTimer -= dt;
  }

  // Update Lasers
  for (let i = game.lasers.length - 1; i >= 0; i--) {
    const l = game.lasers[i];
    l.y -= 235 * dt;
    if (l.y < ARENA_Y0) { game.lasers.splice(i, 1); continue; }

    let hit = false;
    // Check Boss hit
    const boss = game.mech.boss;
    if (boss && boss.hp > 0 && l.x + 2 >= boss.x + 4 && l.x <= boss.x + boss.w - 4 && l.y <= boss.y + boss.h) {
      damageLeChuckBoss(1, l.x, l.y);
      hit = true;
    }
    // Check Darts / Voodoo Hazards
    if (!hit) {
      for (let hi = game.mech.hazards.length - 1; hi >= 0; hi--) {
        const hz = game.mech.hazards[hi];
        if (Math.abs(l.x - (hz.x + 5)) < 7 && Math.abs(l.y - (hz.y + 5)) < 7) {
          game.mech.hazards.splice(hi, 1);
          addScore(200, hz.x, hz.y, 111);
          spawnSparks(hz.x + 4, hz.y + 4, 8, [111, 143, 255], 0.8);
          hit = true;
          break;
        }
      }
    }
    // Check Bricks
    if (!hit) {
      for (const br of game.bricks) {
        if (!isBrickSolid(br)) continue;
        if (l.x + 2 >= br.x && l.x <= br.x + br.w && l.y <= br.y + br.h && l.y + 5 >= br.y) {
          damageBrick(br, false);
          hit = true;
          break;
        }
      }
    }
    if (hit) game.lasers.splice(i, 1);
  }

  // Update Falling Capsules
  for (let i = game.capsules.length - 1; i >= 0; i--) {
    const cap = game.capsules[i];
    cap.y += cap.vy * dt;
    if (cap.y > PLAY_H) { game.capsules.splice(i, 1); continue; }
    if (cap.x + cap.w >= p.x - halfW && cap.x <= p.x + halfW &&
        cap.y + cap.h >= p.y && cap.y <= p.y + p.h) {
      applyCapsule(cap.type);
      game.capsules.splice(i, 1);
    }
  }

  // Update World Mechanics
  updateWorldMechanics(dt);

  // Update Balls
  for (let i = game.balls.length - 1; i >= 0; i--) {
    if (!stepBallPhysics(game.balls[i], dt)) {
      game.balls.splice(i, 1);
    }
  }

  // Ball Lost Check
  if (game.balls.length === 0) {
    game.lives--;
    audio.sfx("hurt");
    triggerShake(2, 0.25);
    const wDef = WORLD_DEFS[STAGES[game.stageIdx].world];
    sayQuip(CHAR_QUIPS[wDef.portraitId].hurt, "wince", 2.8);
    if (game.lives <= 0) {
      game.state = "GAME_OVER";
    } else {
      resetPaddleAndBall(false);
    }
  }

  // Stage Clear Check (Stages 1..32 clear when destructibleCount === 0; Stage 33 clears when Boss HP === 0)
  if (STAGES[game.stageIdx].world < 6 && game.destructibleCount <= 0 && game.state === "PLAYING") {
    game.state = "STAGE_CLEAR";
    game.clearTimer = 2.4;
    audio.sfx("clear");
    addScore(1000 + game.lives * 250, 128, 100, 63);
    const wDef = WORLD_DEFS[STAGES[game.stageIdx].world];
    sayQuip(CHAR_QUIPS[wDef.portraitId].clear, "cheer", 2.4);
  }

  // Particles, Shockwaves & Floating Score Text
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const pt = game.particles[i];
    pt.vy += pt.grav * dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
    if (pt.life <= 0) game.particles.splice(i, 1);
  }
  for (let i = game.shockwaves.length - 1; i >= 0; i--) {
    const sw = game.shockwaves[i];
    sw.life -= dt;
    sw.r = lerp(sw.maxR, 2, Math.max(0, sw.life / sw.maxLife));
    if (sw.life <= 0) game.shockwaves.splice(i, 1);
  }
  for (let i = game.floatTexts.length - 1; i >= 0; i--) {
    const ft = game.floatTexts[i];
    ft.y -= 18 * dt;
    ft.life -= dt;
    if (ft.life <= 0) game.floatTexts.splice(i, 1);
  }
}

// ============================================================================
// 13. RENDERER (PLAYFIELD + SPRITES + JUICE + 64x200 SCUMM HUD + OVERLAYS)
// ============================================================================
function renderBricks() {
  const pulse = ((game.time * 5) | 0) & 1;
  for (const br of game.bricks) {
    if (br.hp <= 0) continue;

    // Chron-o-John Hologram Outline when phased out!
    if (!isBrickSolid(br)) {
      ctx.fillStyle = PAL_HEX[br.phaseEra === 0 ? 93 : 173];
      ctx.fillRect(br.x, br.y, br.w - 1, 1);
      ctx.fillRect(br.x, br.y + br.h - 2, br.w - 1, 1);
      ctx.fillRect(br.x, br.y, 1, br.h - 1);
      ctx.fillRect(br.x + br.w - 2, br.y, 1, br.h - 1);
      continue;
    }

    let spr;
    if (br.flashTimer > 0) spr = brickSprites.FLASH;
    else if (br.indestructible) spr = brickSprites["#"];
    else if (br.isGrog) spr = brickSprites[pulse ? "X_1" : "X_0"];
    else if (br.code === "2") spr = brickSprites[br.hp >= 2 ? "2_2" : "2_1"];
    else if (br.code === "3") spr = brickSprites[br.hp >= 3 ? "3_3" : br.hp === 2 ? "3_2" : "3_1"];
    else spr = brickSprites[br.code] || brickSprites.W;

    ctx.drawImage(spr, br.x, br.y);

    // Subtle shimmering Loom note gem glint on World 5 bricks
    if (br.loomNote >= 0 && (((br.col + br.row + ((game.time * 4) | 0)) % 9) === 0)) {
      ctx.fillStyle = PAL_HEX[LOOM_NOTE_COLORS[br.loomNote]];
      ctx.fillRect(br.x + 3, br.y + 2, 2, 1);
    }
  }
}

function renderWorldEntities() {
  const worldId = STAGES[game.stageIdx].world;
  const m = game.mech;

  // World 3: Atlantean Ceiling Idols & Poison Darts
  if (worldId === 2) {
    for (const id of m.idols) {
      ctx.drawImage(id.charging ? idolSprites.charge : idolSprites.idle, id.x | 0, id.y | 0);
    }
    for (const d of m.darts) {
      ctx.drawImage(idolSprites.dart, d.x | 0, d.y | 0);
    }
  }

  // World 4: Rotating Spiral Gravity Vortices
  if (worldId === 3) {
    const vf = ((game.time * 10) | 0) & 3;
    for (const w of m.wells) {
      ctx.drawImage(vortexFrames[vf], (w.x - 9) | 0, (w.y - 9) | 0);
    }
  }

  // World 6: Patrolling Highway Cruisers
  if (worldId === 5) {
    const cf = ((game.time * 8) | 0) & 1;
    for (const cr of m.cruisers) {
      ctx.drawImage(cruiserSprites[cf], cr.x | 0, cr.y | 0);
    }
  }

  // World 7: Centerpiece 44x30 Ghost Pirate LeChuck Boss & Hazards
  if (worldId === 6 && m.boss && m.boss.hp > 0) {
    const boss = m.boss;
    const frameIdx = boss.flashTimer > 0 ? 2 : (boss.laughTimer > 0 || (((game.time * 3) | 0) & 1) ? 1 : 0);
    const hoverY = Math.round(Math.sin(game.time * 4.2) * 2);
    ctx.drawImage(leChuckBossFrames[frameIdx], boss.x | 0, (boss.y + hoverY) | 0);

    // Top Arena Boss Health Bar
    const barW = 140, bx = 128 - (barW >> 1), by = 9;
    ctx.fillStyle = PAL_HEX[240];
    ctx.fillRect(bx - 1, by - 1, barW + 2, 5);
    const fillW = Math.ceil((boss.hp / boss.maxHp) * barW);
    ctx.fillStyle = PAL_HEX[109];
    ctx.fillRect(bx, by, fillW, 3);
    ctx.fillStyle = PAL_HEX[111];
    ctx.fillRect(bx, by, fillW, 1);

    const hf = ((game.time * 12) | 0) & 1;
    for (const hz of m.hazards) {
      if (hz.type === "skull") ctx.drawImage(voodooSkullSprite, hz.x | 0, hz.y | 0);
      else ctx.drawImage(hellfireSprites[hf], hz.x | 0, hz.y | 0);
    }
  }
}

function renderPlayfieldEntities() {
  // Capsules (18x9)
  for (const cap of game.capsules) {
    ctx.drawImage(capsuleSprites[cap.type], cap.x | 0, cap.y | 0);
  }

  // Lasers
  for (const l of game.lasers) {
    ctx.drawImage(laserBoltSprite, l.x | 0, l.y | 0);
  }

  // Paddle
  const p = game.paddle;
  const pSpr = paddleSprites[p.mode] || paddleSprites.normal;
  const px = Math.round(p.x - p.w * 0.5);
  ctx.drawImage(pSpr, px, p.y | 0);
  if (p.curseTimer > 0 && (((game.time * 14) | 0) & 1)) {
    ctx.fillStyle = PAL_HEX[109];
    ctx.fillRect(px + 2, p.y + 1, p.w - 4, 2);
  }

  // Balls & Glowing Pixel Trails
  for (const b of game.balls) {
    for (let i = b.trail.length - 1; i >= 0; i--) {
      const tr = b.trail[i];
      ctx.fillStyle = PAL_HEX[b.fire ? (i < 3 ? 142 : 137) : (i < 3 ? 173 : 167)];
      const sz = i < 2 ? 2 : 1;
      ctx.fillRect(Math.round(tr.x), Math.round(tr.y), sz, sz);
    }
    ctx.drawImage(b.fire ? ballSprites.fire : ballSprites.normal, Math.round(b.x - 2), Math.round(b.y - 2));
  }

  // Radial Pixel Shockwave Rings (3x3 Grog Chain Reactions!)
  for (const sw of game.shockwaves) {
    ctx.fillStyle = PAL_HEX[sw.col];
    const pts = 20;
    for (let i = 0; i < pts; i++) {
      const a = (i / pts) * Math.PI * 2;
      ctx.fillRect(Math.round(sw.x + Math.cos(a) * sw.r), Math.round(sw.y + Math.sin(a) * sw.r), 2, 2);
    }
  }

  // Pixel Sparks
  for (const pt of game.particles) {
    ctx.fillStyle = PAL_HEX[pt.col];
    ctx.fillRect(pt.x | 0, pt.y | 0, pt.size, pt.size);
  }

  // Floating Pixel-Outlined Score Popups
  for (const ft of game.floatTexts) {
    drawTextCentered5x7(ctx, ft.text, ft.x, ft.y, ft.col, 60, 240);
  }

  // Classic LucasArts Overhead Pixel-Outlined Talkie Line!
  if (game.speechTimer > 0 && game.speechText) {
    const wDef = WORLD_DEFS[STAGES[game.stageIdx].world];
    const [topC, botC] = wDef.talkColor;
    const textY = STAGES[game.stageIdx].world === 6 ? 48 : 126;
    // Split long lines cleanly at <= 36 chars so every word stays inside playfield!
    const words = game.speechText.split(" ");
    let line1 = "", line2 = "";
    for (const w of words) {
      if ((line1 + " " + w).trim().length <= 34) line1 = (line1 + " " + w).trim();
      else line2 = (line2 + " " + w).trim();
    }
    drawTextCentered5x7(ctx, line1, 128, textY, topC, botC, 240);
    if (line2) drawTextCentered5x7(ctx, line2, 128, textY + 9, topC, botC, 240);
  }
}

function renderHudSidebar() {
  ctx.drawImage(hudBgCanvas, HUD_X, 0);
  const stg = STAGES[game.stageIdx];
  const wDef = WORLD_DEFS[stg.world];

  // 1. Live Animated 48x36 Character Portrait at (264, 5)
  const talkFrame = game.speechTimer > 0 ? ((((game.time * 11) | 0) % 3)) : 0;
  const ballRef = game.balls[0];
  const lookNorm = ballRef ? (ballRef.x - 128) / 90 : 0;
  renderPortrait(ctx, HUD_X + 8, 5, wDef.portraitId, game.portraitExpr, talkFrame, game.blinking, lookNorm);

  // 2. 7-Digit HI-SCORE & 1UP SCORE in Crisp 5x7 Outlined Font
  drawTextCentered5x7(ctx, "HI-SCORE", HUD_X + 32, 46, 63, 59, 240);
  drawTextCentered5x7(ctx, String(game.hiScore).padStart(7, "0"), HUD_X + 32, 55, 15, 13, 240);

  drawTextCentered5x7(ctx, "1UP", HUD_X + 32, 66, 174, 170, 240);
  drawTextCentered5x7(ctx, String(game.score).padStart(7, "0"), HUD_X + 32, 75, 15, 13, 240);

  // 3. Stage XX/33
  const stgStr = "STG " + String(game.stageIdx + 1).padStart(2, "0") + "/33";
  drawTextCentered5x7(ctx, stgStr, HUD_X + 32, 87, 63, 59, 240);

  // 4. Mini-Paddle Lives (y = 99..107)
  const shownLives = clamp(game.lives, 0, 5);
  const startLX = HUD_X + 32 - Math.floor((shownLives * 11) * 0.5);
  for (let i = 0; i < shownLives; i++) {
    ctx.drawImage(paddleSprites.miniLife, startLX + i * 11, 100);
  }

  // 5. Active World Mechanic Gauge Box (x = 260..315, y = 112..140)
  const m = game.mech;
  if (stg.world === 0) {
    drawTextCentered5x7(ctx, "DUEL", HUD_X + 32, 115, 63, 59, 240);
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = PAL_HEX[m.duelActive && i < m.duelHits ? 109 : 3];
      ctx.fillRect(HUD_X + 10 + i * 11, 127, 9, 8);
    }
  } else if (stg.world === 1) {
    const eras = ["PAST", "NOW", "FUTR"];
    const eCols = [93, 109, 174];
    drawTextCentered5x7(ctx, "ERA:" + eras[m.era], HUD_X + 32, 115, eCols[m.era], eCols[m.era], 240);
    const w = Math.floor((m.eraTimer / 6.5) * 48);
    ctx.fillStyle = PAL_HEX[eCols[m.era]];
    ctx.fillRect(HUD_X + 8, 129, clamp(w, 0, 48), 6);
  } else if (stg.world === 2) {
    drawTextCentered5x7(ctx, "IDOLS", HUD_X + 32, 115, 142, 138, 240);
    for (let i = 0; i < 3; i++) {
      const chg = m.idols[i] && m.idols[i].charging;
      ctx.fillStyle = PAL_HEX[chg ? 143 : 120];
      ctx.fillRect(HUD_X + 12 + i * 15, 127, 10, 8);
    }
  } else if (stg.world === 3) {
    drawTextCentered5x7(ctx, "GRAVITY", HUD_X + 32, 115, 174, 170, 240);
    drawTextCentered5x7(ctx, "2 WELLS", HUD_X + 32, 127, 93, 90, 240);
  } else if (stg.world === 4) {
    drawTextCentered5x7(ctx, m.notes.length ? "DRAFT" : m.lastSpell.slice(0, 8), HUD_X + 32, 115, 174, 189, 240);
    for (let i = 0; i < 4; i++) {
      const ni = m.notes[i];
      const lbl = ni !== undefined ? LOOM_NOTE_NAMES[ni] : "-";
      const col = ni !== undefined ? LOOM_NOTE_COLORS[ni] : 6;
      drawText5x7(ctx, lbl, HUD_X + 10 + i * 12, 127, col, col, 240);
    }
  } else if (stg.world === 5) {
    drawTextCentered5x7(ctx, "HIGHWAY", HUD_X + 32, 115, 206, 202, 240);
    drawTextCentered5x7(ctx, "PATROL", HUD_X + 32, 127, 63, 59, 240);
  } else {
    drawTextCentered5x7(ctx, "LECHUCK", HUD_X + 32, 115, 111, 108, 240);
    const ratio = m.boss ? m.boss.hp / m.boss.maxHp : 0;
    ctx.fillStyle = PAL_HEX[109];
    ctx.fillRect(HUD_X + 8, 129, Math.ceil(ratio * 48), 6);
  }

  // 6. Active Power-Up Badges (L E C S P at y = 143..165)
  const p = game.paddle;
  const badges = [
    { ch: "L", on: p.mode === "laser", col: 241 },
    { ch: "E", on: p.mode === "expand", col: 62 },
    { ch: "C", on: p.mode === "catch", col: 109 },
    { ch: "S", on: p.slowTimer > 0, col: 174 },
    { ch: "P", on: game.balls.length > 1, col: 93 }
  ];
  for (let i = 0; i < badges.length; i++) {
    const bx = HUD_X + 7 + i * 10, by = 146;
    ctx.fillStyle = PAL_HEX[badges[i].on ? badges[i].col : 2];
    ctx.fillRect(bx, by, 9, 13);
    drawText5x7(ctx, badges[i].ch, bx + 2, by + 3, badges[i].on ? 255 : 7, badges[i].on ? 15 : 5, 240);
  }

  // 7. Scrolling AdLib OPL2 Track Marquee (Clipped strictly inside x = 261..314, y = 169..183)
  const mqText = "* OPL2 FM: " + wDef.trackName + " (" + wDef.bpm + " BPM) *   ";
  const mqW = measureText5x7(mqText);
  const scrollX = HUD_X + 6 - (Math.floor(game.marqueeScroll) % mqW);
  ctx.save();
  ctx.beginPath();
  ctx.rect(HUD_X + 5, 169, 54, 14);
  ctx.clip();
  drawText5x7(ctx, mqText, scrollX, 173, 111, 108, 240);
  drawText5x7(ctx, mqText, scrollX + mqW, 173, 111, 108, 240);
  ctx.restore();

  // 8. Mute & CRT Status Indicators (y = 188..197)
  drawText5x7(ctx, audio.muted ? "M:OFF" : "M:ON", HUD_X + 4, 189, audio.muted ? 241 : 109, -1, 240);
  drawText5x7(ctx, game.crtOn ? "CRT" : "RAW", HUD_X + 41, 189, game.crtOn ? 174 : 11, -1, 240);
}

  const wDef = WORLD_DEFS[stg.world];

  if (game.state === "MENU") {
    // Lower Playfield SCUMM Plaque (y = 123..193) leaves ALL 33 brick mosaics 100% unobstructed above!
    ctx.drawImage(menuPlaqueCanvas, 14, 123);
    drawTextCentered5x7(ctx, "SCUMM-ANOID DELUXE", 128, 129, 63, 59, 240);
    drawTextCentered5x7(ctx, wDef.name + " - " + stg.title.slice(0, 18), 128, 140, 174, 170, 240);
    drawTextCentered5x7(ctx, "< STAGE " + String(game.stageIdx + 1).padStart(2, "0") + " OF 33 >", 128, 152, 111, 108, 240);
    const blink = (((game.time * 2.6) | 0) & 1) === 0;
    if (blink) {
      drawTextCentered5x7(ctx, "SPACE OR CLICK TO LAUNCH!", 128, 165, 255, 62, 240);

    drawTextCentered5x7(ctx, "LEFT/RIGHT:STAGE  M:MUTE  C:CRT", 128, 178, 13, 10, 240);

    ctx.drawImage(modalPlaqueCanvas, 20, 62);
    drawTextCentered5x7(ctx, "- GAME PAUSED -", 128, 74, 63, 59, 240);
    drawTextCentered5x7(ctx, stg.title, 128, 90, 174, 170, 240);
    drawTextCentered5x7(ctx, "LEFT/RIGHT: JUMP STAGE", 128, 106, 15, 12, 240);
    drawTextCentered5x7(ctx, "PRESS P OR CLICK TO RESUME", 128, 122, 111, 108, 240);
  } else if (game.state === "STAGE_CLEAR") {
    ctx.drawImage(modalPlaqueCanvas, 20, 62);
    drawTextCentered5x7(ctx, "STAGE " + String(game.stageIdx + 1).padStart(2, "0") + " CLEARED!", 128, 76, 111, 108, 240);
    drawTextCentered5x7(ctx, stg.title, 128, 94, 63, 59, 240);
    drawTextCentered5x7(ctx, "WARPING TO NEXT SECTOR...", 128, 116, 174, 170, 240);
  } else if (game.state === "GAME_OVER") {
    ctx.drawImage(modalPlaqueCanvas, 20, 62);
    drawTextCentered5x7(ctx, "GAME OVER", 128, 74, 242, 241, 240);
    drawTextCentered5x7(ctx, "FINAL SCORE: " + String(game.score).padStart(7, "0"), 128, 94, 63, 59, 240);
    drawTextCentered5x7(ctx, "EVEN LECHUCK RESPECTS THAT!", 128, 108, 15, 12, 240);
    drawTextCentered5x7(ctx, "SPACE OR CLICK FOR MENU", 128, 126, 174, 170, 240);
  } else if (game.state === "VICTORY") {
    ctx.drawImage(modalPlaqueCanvas, 20, 56);
    drawTextCentered5x7(ctx, "LECHUCK BANISHED!", 128, 66, 111, 108, 240);
    drawTextCentered5x7(ctx, "ALL 33 VGA WORLDS CONQUERED!", 128, 80, 63, 59, 240);
    drawTextCentered5x7(ctx, "SCORE: " + String(game.score).padStart(7, "0"), 128, 96, 255, 62, 240);
    drawTextCentered5x7(ctx, "HAVE AN ICE-COLD ROOT BEER!", 128, 110, 174, 170, 240);
    drawTextCentered5x7(ctx, "SPACE OR CLICK FOR MENU", 128, 126, 15, 12, 240);
  }
}

function render() {
  ctx.fillStyle = PAL_HEX[0];
  ctx.fillRect(0, 0, W, H);

  const stg = STAGES[game.stageIdx];
  const camNorm = game.state === "MENU"
    ? (Math.sin(game.time * 0.55) + 1) * 0.5
    : clamp((game.paddle.x - ARENA_X0) / ARENA_W, 0, 1);

  ctx.save();
  if (game.shakeTime > 0) {
    const sx = Math.round((Math.random() * 2 - 1) * game.shakeMag);
    const sy = Math.round((Math.random() * 2 - 1) * game.shakeMag);
    ctx.translate(sx, sy);
  }

  renderWorldBackdrop(ctx, stg.world, game.time, camNorm);
  renderBricks();
  renderWorldEntities();
  if (game.state !== "MENU") {
    renderPlayfieldEntities();
  }
  ctx.restore();

  renderOverlays();
  renderHudSidebar();
}

// ============================================================================
// 14. BOOTSTRAP & MAIN LOOP
// ============================================================================
loadStage(0, false);

let lastTs = performance.now();
function frame(ts) {
  const rawDt = (ts - lastTs) / 1000;
  lastTs = ts;
  const dt = clamp(rawDt, 0.001, 0.033);
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
