// Deterministic PRNG for procedural pixel textures
function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2i(x, y, seed = 1337) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(seed, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;

const PAL_RGB = new Array(256);
const PAL_HEX = new Array(256);
const PAL_U32 = new Uint32Array(256);

function setPalEntry(idx, r, g, b) {
  r = clamp(Math.round(r), 0, 255);
  g = clamp(Math.round(g), 0, 255);
  b = clamp(Math.round(b), 0, 255);
  PAL_RGB[idx] = [r, g, b];
  PAL_HEX[idx] = "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  PAL_U32[idx] = ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
}

for (let ramp = 0; ramp < 15; ramp++) {
  const anchors = RAMP_ANCHORS[ramp];
  const segs = anchors.length - 1;
  for (let s = 0; s < 16; s++) {

    const i0 = Math.min(segs - 1, Math.floor(pos));
    const f = pos - i0;
    const c0 = anchors[i0], c1 = anchors[i0 + 1];
    setPalEntry(ramp * 16 + s, lerp(c0[0], c1[0], f), lerp(c0[1], c1[1], f), lerp(c0[2], c1[2], f));
  }
}

// 4x4 Ordered Bayer Matrix (0..15)
const BAYER_4X4 = [
  [ 0,  8,  2, 10],
  [12,  4, 14,  6],
  [ 3, 11,  1,  9],
  [15,  7, 13,  5]
];

function ditherRamp(rampIdx, t, x, y, minShade = 0, maxShade = 15) {
  const span = maxShade - minShade;
  const clamped = clamp(t, 0, 1);
  const pos = minShade + clamped * span;
  const i0 = Math.floor(pos);
  const frac = pos - i0;
  const threshold = (BAYER_4X4[y & 3][x & 3] + 0.5) / 16;
  const shade = (frac > threshold && i0 < maxShade) ? i0 + 1 : i0;
  return rampIdx * 16 + clamp(shade, minShade, maxShade);
}

// Offscreen Mode-13h Indexed Pixel Surface
class PixelSurface {
  constructor(w, h) {
    this.w = w;
    this.h = h;
    this.canvas = document.createElement("canvas");
    this.canvas.width = w;
    this.canvas.height = h;
    this.ctx = this.canvas.getContext("2d");
    this.ctx.imageSmoothingEnabled = false;
    this.img = this.ctx.createImageData(w, h);
    this.u32 = new Uint32Array(this.img.data.buffer);
    this.idxBuf = new Int16Array(w * h).fill(-1);
  }
  clear() {
    this.u32.fill(0);
    this.idxBuf.fill(-1);
  }
  pset(x, y, palIdx) {
    x |= 0; y |= 0;
    if (x < 0 || x >= this.w || y < 0 || y >= this.h) return;
    const o = y * this.w + x;
    if (palIdx < 0) {
      this.u32[o] = 0;
      this.idxBuf[o] = -1;
    } else {
      this.u32[o] = PAL_U32[palIdx & 255];
      this.idxBuf[o] = palIdx & 255;
    }
  }
  pget(x, y) {
    x |= 0; y |= 0;
    if (x < 0 || x >= this.w || y < 0 || y >= this.h) return -1;
    return this.idxBuf[y * this.w + x];
  }
  fillRect(x0, y0, w, h, palIdx) {
    const x1 = clamp(x0 + w, 0, this.w), y1 = clamp(y0 + h, 0, this.h);
    x0 = clamp(x0, 0, this.w); y0 = clamp(y0, 0, this.h);
    for (let y = y0; y < y1; y++) {
      for (let x = x0; x < x1; x++) this.pset(x, y, palIdx);
    }
  }
  paintRampGradient(x0, y0, w, h, rampIdx, tTop, tBot, minS = 0, maxS = 15) {
    const x1 = clamp(x0 + w, 0, this.w), y1 = clamp(y0 + h, 0, this.h);
    const sx0 = clamp(x0, 0, this.w), sy0 = clamp(y0, 0, this.h);
    const denom = Math.max(1, h - 1);
    for (let y = sy0; y < y1; y++) {
      const t = lerp(tTop, tBot, (y - y0) / denom);
      for (let x = sx0; x < x1; x++) {
        this.pset(x, y, ditherRamp(rampIdx, t, x, y, minS, maxS));
      }
    }
  }
  paintRadialDither(cx, cy, rInner, rOuter, rampIdx, tIn, tOut, minS = 0, maxS = 15, transparentOuter = false) {
    const x0 = Math.max(0, Math.floor(cx - rOuter - 1));
    const x1 = Math.min(this.w - 1, Math.ceil(cx + rOuter + 1));
    const y0 = Math.max(0, Math.floor(cy - rOuter - 1));
    const y1 = Math.min(this.h - 1, Math.ceil(cy + rOuter + 1));
    const span = Math.max(1, rOuter - rInner);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const d = Math.hypot(x - cx, y - cy);
        if (d > rOuter) continue;
        if (d <= rInner) {
          this.pset(x, y, ditherRamp(rampIdx, tIn, x, y, minS, maxS));
        } else {
          const u = (d - rInner) / span;
          if (transparentOuter) {
            const keepProb = 1 - u;
            const thr = (BAYER_4X4[y & 3][x & 3] + 0.5) / 16;
            if (keepProb <= thr) continue;
          }
          const t = lerp(tIn, tOut, u);
          this.pset(x, y, ditherRamp(rampIdx, t, x, y, minS, maxS));
        }
      }
    }
  }
  line(x0, y0, x1, y1, palIdx) {
    x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
    const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
    const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    while (true) {
      this.pset(x0, y0, palIdx);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }
  outlineNonEmpty(outlineIdx = 240) {
    const copy = new Int16Array(this.idxBuf);
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w; x++) {
        if (copy[y * this.w + x] !== -1) continue;
        if (
          (x > 0 && copy[y * this.w + x - 1] !== -1) ||
          (x + 1 < this.w && copy[y * this.w + x + 1] !== -1) ||
          (y > 0 && copy[(y - 1) * this.w + x] !== -1) ||
          (y + 1 < this.h && copy[(y + 1) * this.w + x] !== -1)
        ) {
          this.pset(x, y, outlineIdx);
        }
      }
    }
  }
  commit() {
    this.ctx.putImageData(this.img, 0, 0);
    return this.canvas;
  }
}

// Pre-cached colored glyph sprites for ultra-fast crisp pixel-outlined drawing
const glyphCache = new Map();
function getGlyphCanvas(ch, topIdx, botIdx, outIdx) {
  const key = ch + "|" + topIdx + "|" + botIdx + "|" + outIdx;
  let c = glyphCache.get(key);
  if (c) return c;
  const rows = FONT_5X7[ch] || FONT_5X7["?"];
  const surf = new PixelSurface(7, 9);
  for (let r = 0; r < 7; r++) {
    const row = rows[r];
    const colIdx = r < 3 ? topIdx : botIdx;
    for (let col = 0; col < 5; col++) {
      if (row.charCodeAt(col) === 49) surf.pset(col + 1, r + 1, colIdx);
    }
  }
  if (outIdx >= 0) surf.outlineNonEmpty(outIdx);
  c = surf.commit();
  glyphCache.set(key, c);
  return c;
}

function measureText5x7(str, spacing = 6) {
  return str.length > 0 ? (str.length - 1) * spacing + 5 : 0;
}

function drawText5x7(targetCtx, str, x, y, topIdx = 15, botIdx = -1, outIdx = 240, spacing = 6) {
  x |= 0; y |= 0;
  const upper = String(str).toUpperCase();
  const bIdx = botIdx < 0 ? topIdx : botIdx;
  for (let i = 0; i < upper.length; i++) {
    const ch = upper[i];
    if (ch !== " ") {
      const g = getGlyphCanvas(ch, topIdx, bIdx, outIdx);
      targetCtx.drawImage(g, x + i * spacing - 1, y - 1);
    }
  }
}

function drawTextCentered5x7(targetCtx, str, centerX, y, topIdx = 15, botIdx = -1, outIdx = 240, spacing = 6) {
  const w = measureText5x7(str, spacing);
  drawText5x7(targetCtx, str, Math.floor(centerX - w * 0.5), y, topIdx, botIdx, outIdx, spacing);
}

function paintPuffyCloud(surf, cx, cy, rx, ry, rampIdx, topShade, midShade, botShade, seed) {
  const puffs = 5;
  for (let p = 0; p < puffs; p++) {
    const u = (p / (puffs - 1)) * 2 - 1;
    const px = cx + u * rx * 0.72;
    const py = cy + Math.abs(u) * ry * 0.25 + (hash2i(p, seed, 91) - 0.5) * 3;
    const prx = rx * (0.48 - Math.abs(u) * 0.16);
    const pry = ry * (0.78 - Math.abs(u) * 0.22);
    for (let y = Math.floor(py - pry); y <= Math.ceil(py + pry); y++) {
      for (let x = Math.floor(px - prx); x <= Math.ceil(px + prx); x++) {
        const nx = (x - px) / prx, ny = (y - py) / pry;
        if (nx * nx + ny * ny <= 1.0) {
          const v = (ny + 1) * 0.5;
          const idx = v < 0.26 ? rampIdx * 16 + topShade :
            ditherRamp(rampIdx, 1 - v, x, y, botShade, midShade);
          surf.pset(x, y, idx);
        }
      }
    }
  }
}

function buildWorldBorder(worldId) {
  const surf = new PixelSurface(PLAY_W, PLAY_H);
  // Helper: test if (x,y) is inside the 8px frame (top y<8, left x<8, right x>=248)
  for (let y = 0; y < PLAY_H; y++) {
    for (let x = 0; x < PLAY_W; x++) {
      const inTop = y < BORDER;
      const inLeft = x < BORDER;
      const inRight = x >= PLAY_W - BORDER;
      if (!inTop && !inLeft && !inRight) continue;
      const distOuter = inTop && !inLeft && !inRight ? y :
        (inLeft && !inTop ? x : (inRight && !inTop ? (PLAY_W - 1 - x) : Math.min(y, inLeft ? x : PLAY_W - 1 - x)));
      let col = 240;

      if (worldId === 0) {
        // Carved Pirate Ship Oak & Brass Rivets
        if (distOuter === 0 || distOuter === 7) col = 240;
        else {
          const grain = ((x * 3 + y) % 11 === 0) ? -1 : 0;
          const base = distOuter === 1 ? 73 : distOuter === 6 ? 65 : (68 + (distOuter === 2 ? 2 : 0) + grain);
          col = base;
          // Rope wrapping every 24px
          const pos = inTop ? x : y;
          if ((pos % 24) >= 10 && (pos % 24) <= 13) {
            col = 52 + ((x + y) & 1) * 3;
          }
        }
      } else if (worldId === 1) {
        // Edison Mansion Copper Lab Pipes & Violet Coils
        if (distOuter === 0 || distOuter === 7) col = 240;
        else {
          const pos = inTop ? x : y;
          const coil = (pos % 20) < 4;
          if (coil) col = 83 + (6 - Math.abs(distOuter - 3));
          else col = 50 + clamp(6 - Math.abs(distOuter - 2) * 2, 0, 8);
        }
      } else if (worldId === 2) {
        // Atlantean Carved Terracotta & Glowing Orichalcum Beads
        if (distOuter === 0 || distOuter === 7) col = 240;
        else {
          const pos = inTop ? x : y;
          const seam = (pos % 16) === 0;
          if (seam) col = 113;
          else if ((pos % 16) === 8 && distOuter >= 3 && distOuter <= 4) col = 141; // Glowing orichalcum bead!
          else col = 116 + (distOuter === 1 ? 5 : distOuter === 6 ? -2 : 2) - ((x ^ y) & 1);
        }
      } else if (worldId === 3) {
        // Starship Durasteel Hull & Cyan Ion Conduit
        if (distOuter === 0 || distOuter === 7) col = 144;
        else if (distOuter === 3 || distOuter === 4) {
          const pos = inTop ? x : y;
          col = (pos % 14) < 10 ? 171 : 147;
        } else {
          col = distOuter <= 2 ? 155 : 149;
        }
      } else if (worldId === 4) {
        // Loom Faceted Stained Crystal & Silver Filigree
        if (distOuter === 0 || distOuter === 7) col = 176;
        else {
          const pos = inTop ? x : y;
          const facet = ((pos + distOuter) % 12) < 6;
          col = distOuter === 1 ? 190 : (facet ? 168 + (distOuter & 3) : 181 + (distOuter & 3));
        }
      } else if (worldId === 5) {
        // Sam & Max Chrome Diner Trim & Checkered Highway Steel
        if (distOuter === 0 || distOuter === 7) col = 240;
        else if (distOuter >= 3 && distOuter <= 4) {
          const chk = (((inTop ? x : y) >> 2) + (distOuter - 3)) & 1;
          col = chk ? 14 : 2;
        } else {
          col = distOuter <= 2 ? 203 : 153;
        }
      } else {
        // LeChuck Charred Bone, Black Iron & Necrotic Runes
        if (distOuter === 0 || distOuter === 7) col = 240;
        else {
          const pos = inTop ? x : y;
          if ((pos % 18) >= 7 && (pos % 18) <= 9 && distOuter >= 3 && distOuter <= 4) col = 109;
          else col = distOuter === 1 ? 133 : (2 + ((x + y) & 1) * 2);
        }
      }
      surf.pset(x, y, col);
    }
  }
  // Ornate Corner Medallions (top-left 0..9, top-right 246..255)
  const corners = [[0, 0], [PLAY_W - 8, 0]];
  for (const [cx, cy] of corners) {
    surf.fillRect(cx, cy, 8, 8, 240);
    surf.fillRect(cx + 1, cy + 1, 6, 6, worldId === 3 ? 154 : 56);
    surf.fillRect(cx + 2, cy + 2, 4, 4, worldId === 6 ? 109 : 61);
    surf.pset(cx + 2, cy + 2, 255);
  }
  return surf.commit();
}

      L2.fillRect(cx + 3, 126, 4, 2, 192); L2.fillRect(cx + 5, 121, 2, 6, 192);
    }
    // Neon Sign ("CONE")
    L2.fillRect(62, 110, 24, 12, 240);
    L2.fillRect(63, 111, 22, 10, 205);
    L2.fillRect(65, 113, 18, 6, 173);
    L2.fillRect(73, 122, 2, 20, 193);

    // L3: Desert Shoulder & Perspective Blacktop Road Base
    L3.paintRampGradient(0, 142, LW, LH - 142, 7, 0.52, 0.20, 2, 9);
    for (let y = 142; y < LH; y++) {
      const t = (y - 142) / (LH - 142);
      const halfRoad = Math.floor(10 + t * 94);
      for (let x = 144 - halfRoad; x <= 144 + halfRoad; x++) {
        L3.pset(x, y, Math.abs(x - 144) >= halfRoad - 2 ? 61 : ditherRamp(0, 0.14 - t * 0.06, x, y, 0, 3));
      }
    }

  } else {
    // --- WORLD 7: LECHUCK'S FORTRESS ---
    L0.paintRampGradient(0, 0, LW, 110, 6, 0.04, 0.42, 0, 7);
    L0.paintRampGradient(0, 110, LW, LH - 110, 8, 0.25, 0.88, 1, 12);
    // Jagged volcanic maw ceiling
    for (let x = 0; x < LW; x++) {
      const teeth = Math.floor(10 + Math.abs(Math.sin(x * 0.13) * 18) + hash2i(x, 9, 33) * 6);
      for (let y = 0; y < teeth; y++) L0.pset(x, y, y === teeth - 1 ? 105 : 96);
    }

    // L1: Underground Volcano Caldera & Skull Spires
    for (let x = 60; x < 228; x++) {
      const h = Math.floor(92 + Math.abs(x - 144) * 0.65);
      for (let y = h; y < 156; y++) L1.pset(x, y, ditherRamp(8, (156 - y) / 90, x, y, 0, 4));
    }
    L1.paintRadialDither(144, 92, 4, 28, 8, 1.0, 0.3, 6, 15, true);

    // L2: Colossal Ghost-Ship Ribs & Tattered Spectral Rigging
    for (let r = -4; r <= 4; r++) {
      if (r === 0) continue;
      const baseX = 144 + r * 26;
      for (let t = 0; t < 54; t++) {
        const rx = Math.round(baseX - Math.sign(r) * (t * t) * 0.012);
        const ry = 156 - t;
        L2.fillRect(rx, ry, 4, 2, t > 40 ? 107 : 101);
      }
    }
    // Iron cages hanging from cavern
    for (const cx of [44, 242]) {
      L2.line(cx, 12, cx, 58, 147);
      L2.fillRect(cx - 5, 58, 11, 14, 240);
      L2.fillRect(cx - 3, 60, 2, 10, 106);
      L2.fillRect(cx + 2, 60, 2, 10, 106);
    }

    // L3: Jagged Basalt Shore Framing Molten Lava
    for (let x = 0; x < LW; x++) {
      const sy = 152 + Math.floor(Math.sin(x * 0.2) * 3);
      for (let y = sy; y < 160; y++) L3.pset(x, y, y === sy ? 136 : 128);
    }
  }

  return [L0.commit(), L1.commit(), L2.commit(), L3.commit()];
}

const bgStars = Array.from({ length: 42 }, (_, i) => ({

}));

function renderWorldBackdrop(targetCtx, worldId, timeSec, camNorm) {
  // camNorm in [0..1] from paddle X across arena -> integer parallax shift over 48px slack
  const layers = worldParallaxCache[worldId];
  const p0 = Math.round(-camNorm * 8);
  const p1 = Math.round(-camNorm * 18);
  const p2 = Math.round(-camNorm * 30);
  const p3 = Math.round(-camNorm * 44);

  targetCtx.save();
  targetCtx.beginPath();
  targetCtx.rect(ARENA_X0, ARENA_Y0, ARENA_W, PLAY_H - BORDER);
  targetCtx.clip();

  targetCtx.drawImage(layers[0], ARENA_X0 + p0, ARENA_Y0);

  // World-specific mid-sky live animations BEFORE far horizon
  if (worldId === 3) {
    // 3-Speed Scrolling Starfield
    for (const s of bgStars) {
      const sy = Math.floor((s.y + timeSec * s.spd * 12) % 146);
      const sx = ARENA_X0 + ((s.x + p1 + 240) % 240);
      targetCtx.fillStyle = PAL_HEX[s.spd === 3 ? 255 : s.spd === 2 ? 173 : 151];
      targetCtx.fillRect(sx, ARENA_Y0 + sy, 1, s.spd === 3 ? 2 : 1);
    }
  } else if (worldId === 4) {
    // Shimmering Loom Aurora Curtains
    for (let x = 0; x < 240; x += 2) {
      const wave = Math.sin(x * 0.05 + timeSec * 1.8) * 8 + Math.cos(x * 0.09 - timeSec * 1.2) * 4;
      const ay = Math.floor(24 + wave);
      targetCtx.fillStyle = PAL_HEX[((x >> 2) & 1) ? 171 : 219];
      targetCtx.fillRect(ARENA_X0 + x, ARENA_Y0 + ay, 2, 10);
      targetCtx.fillStyle = PAL_HEX[186];
      targetCtx.fillRect(ARENA_X0 + x, ARENA_Y0 + ay + 10, 2, 6);
    }
  }

  targetCtx.drawImage(layers[1], ARENA_X0 + p1, ARENA_Y0);
  targetCtx.drawImage(layers[2], ARENA_X0 + p2, ARENA_Y0);
  targetCtx.drawImage(layers[3], ARENA_X0 + p3, ARENA_Y0);

  // Foreground Animated Water / Sludge / Braziers & Lava / Trench / Sea Spray / Highway / Embers
  if (worldId === 0) {
    // Flickering Scumm Bar Pier Lantern Halos + Harbor Wave Reflections
    const flick = Math.sin(timeSec * 11) > 0 ? 1 : 0;
    for (const lx of [32, 98, 144]) {
      const sx = ARENA_X0 + lx + p3 + 4;
      targetCtx.fillStyle = PAL_HEX[61 + flick];
      targetCtx.fillRect(sx - 1, ARENA_Y0 + 122, 3, 4);
      targetCtx.fillStyle = PAL_HEX[58];
      targetCtx.fillRect(sx - 3, ARENA_Y0 + 121, 1, 1);
      targetCtx.fillRect(sx + 3, ARENA_Y0 + 121, 1, 1);
    }
    // Multi-shade harbor wave reflections (moon path + gold lantern glints)
    for (let y = 144; y < 192; y += 2) {
      const phase = Math.floor(Math.sin(y * 0.45 - timeSec * 3.6) * 5);
      const moonW = Math.max(3, 24 - Math.floor((y - 144) * 0.35));
      targetCtx.fillStyle = PAL_HEX[y < 162 ? 45 : 42];
      targetCtx.fillRect(ARENA_X0 + 196 + p0 + phase - (moonW >> 1), ARENA_Y0 + y, moonW, 1);
      if ((y & 2) === 0) {
        targetCtx.fillStyle = PAL_HEX[59];
        targetCtx.fillRect(ARENA_X0 + 98 + p3 + phase, ARENA_Y0 + y, 6, 1);
      }
    }
  } else if (worldId === 1) {
    // Bubbling Green Sludge River
    for (let y = 158; y < 192; y++) {
      const shade = 100 + Math.floor(((192 - y) / 34) * 7) + (((y + Math.floor(timeSec * 8)) & 3) === 0 ? 2 : 0);
      targetCtx.fillStyle = PAL_HEX[clamp(shade, 98, 110)];
      targetCtx.fillRect(ARENA_X0, ARENA_Y0 + y, ARENA_W, 1);
    }
    for (let b = 0; b < 11; b++) {
      const bx = ARENA_X0 + ((b * 27 + Math.floor(timeSec * 14)) % 232) + 4;
      const by = ARENA_Y0 + 186 - ((b * 13 + Math.floor(timeSec * 22)) % 26);
      targetCtx.fillStyle = PAL_HEX[111];
      targetCtx.fillRect(bx, by, 2, 2);
    }
  } else if (worldId === 2) {
    // Flickering Atlantean Braziers & Flowing Lava Channels
    for (const bx of [48, 144, 236]) {
      const sx = ARENA_X0 + bx + p3;
      const fh = 5 + ((Math.floor(timeSec * 13 + bx) & 3));
      targetCtx.fillStyle = PAL_HEX[140];
      targetCtx.fillRect(sx - 3, ARENA_Y0 + 146 - fh, 7, fh);
      targetCtx.fillStyle = PAL_HEX[143];
      targetCtx.fillRect(sx - 1, ARENA_Y0 + 147 - fh, 3, fh - 1);
    }
    for (let y = 166; y < 192; y += 2) {
      const shift = Math.floor(timeSec * 16 + y * 2) % 16;
      targetCtx.fillStyle = PAL_HEX[136];
      targetCtx.fillRect(ARENA_X0, ARENA_Y0 + y, ARENA_W, 2);
      for (let x = -shift; x < ARENA_W; x += 16) {
        targetCtx.fillStyle = PAL_HEX[141];
        targetCtx.fillRect(ARENA_X0 + x, ARENA_Y0 + y, 7, 1);
      }
    }
  } else if (worldId === 3) {
    // Scrolling Perspective Trench Panel Lines
    const scroll = (timeSec * 28) % 12;
    targetCtx.fillStyle = PAL_HEX[146];
    for (let i = 0; i < 5; i++) {
      const u = ((i * 12 + scroll) / 60);
      const y = ARENA_Y0 + Math.floor(147 + u * u * 44);
      targetCtx.fillRect(ARENA_X0, y, ARENA_W, 1);
    }
  } else if (worldId === 4) {
    // Emerald Sea Waves & Rising Mist Spray
    for (let y = 160; y < 192; y += 2) {
      targetCtx.fillStyle = PAL_HEX[y < 172 ? 43 : 38];
      targetCtx.fillRect(ARENA_X0, ARENA_Y0 + y, ARENA_W, 2);
      const sx = Math.floor((timeSec * 18 + y * 13) % 24);
      targetCtx.fillStyle = PAL_HEX[47];
      for (let x = sx; x < ARENA_W; x += 24) targetCtx.fillRect(ARENA_X0 + x, ARENA_Y0 + y, 5, 1);
    }
  } else if (worldId === 5) {
    // Animated Perspective Yellow Highway Dashes
    const phase = (timeSec * 2.6) % 1;
    for (let i = 0; i < 6; i++) {
      const u = (i + phase) / 6;
      const y0 = Math.floor(143 + u * u * 48);
      const len = Math.max(1, Math.floor(u * 8));
      const dw = Math.max(1, Math.floor(1 + u * 3));
      const cx = ARENA_X0 + 144 + p3;
      targetCtx.fillStyle = PAL_HEX[62];
      targetCtx.fillRect(cx - (dw >> 1), ARENA_Y0 + y0, dw, len);
    }
  } else {
    // Churning Molten Lava & Rising Ember Particles
    for (let y = 158; y < 192; y += 2) {
      targetCtx.fillStyle = PAL_HEX[y < 168 ? 140 : 135];
      targetCtx.fillRect(ARENA_X0, ARENA_Y0 + y, ARENA_W, 2);
      const off = Math.floor(Math.sin(timeSec * 4 + y * 0.4) * 6 + 12) % 18;
      targetCtx.fillStyle = PAL_HEX[143];
      for (let x = off; x < ARENA_W; x += 18) targetCtx.fillRect(ARENA_X0 + x, ARENA_Y0 + y, 6, 1);
    }
    for (const e of bgEmbers) {
      const ey = 160 - ((e.y + timeSec * e.spd) % 156);
      const ex = (e.x + Math.round(Math.sin(timeSec * 2.5 + e.sway) * 4) + 240) % 240;
      targetCtx.fillStyle = PAL_HEX[(e.sway & 1) ? 142 : 109];
      targetCtx.fillRect(ARENA_X0 + ex, ARENA_Y0 + Math.floor(ey), 1, 2);
    }
  }

  targetCtx.restore();
  targetCtx.drawImage(worldBorderCache[worldId], 0, 0);
}

// 5. LIVE ANIMATED 48x36 SCUMM CHARACTER PORTRAIT STUDIO & QUIP BANKS

const PORTRAIT_W = 48, PORTRAIT_H = 36;
const portraitBaseCache = new Array(7);

function drawOvalShaded(surf, cx, cy, rx, ry, rampIdx, minS, maxS, outline = true) {
  for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++) {
    for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++) {
      const nx = (x - cx) / rx, ny = (y - cy) / ry;
      const d2 = nx * nx + ny * ny;
      if (d2 <= 1.0) {
        const light = clamp(0.62 - nx * 0.35 - ny * 0.38, 0.05, 0.98);
        surf.pset(x, y, ditherRamp(rampIdx, light, x, y, minS, maxS));
      } else if (outline && d2 <= 1.24) {
        if (surf.pget(x, y) === -1 || surf.pget(x, y) < 240) surf.pset(x, y, 240);
      }
    }
  }
}

function buildPortraitBase(charId) {
  const s = new PixelSurface(PORTRAIT_W, PORTRAIT_H);

  if (charId === 0) {
    // GUYBRUSH THREEPWOOD (Melee twilight + blonde ponytail + white pirate shirt + blue coat)
    s.paintRampGradient(0, 0, PORTRAIT_W, PORTRAIT_H, 1, 0.16, 0.58, 1, 9);
    s.paintRadialDither(40, 7, 1, 9, 3, 0.95, 0.2, 7, 14, true);
    // Shoulders: Sapphire pirate coat & open white shirt collar
    for (let y = 26; y < 36; y++) {
      const spread = 13 + (y - 26);
      for (let x = 24 - spread; x <= 24 + spread; x++) {
        const isShirt = Math.abs(x - 24) < 6 - Math.floor((y - 26) * 0.3);
        s.pset(x, y, Math.abs(x - 24) === spread ? 240 : (isShirt ? 14 : (x < 24 ? 244 : 243)));
      }
    }
    // Ponytail on left
    drawOvalShaded(s, 13, 20, 4, 6, 3, 9, 14, true);
    // Neck & Head
    s.fillRect(21, 22, 6, 6, 234);
    drawOvalShaded(s, 24, 16, 8.5, 9.5, 14, 7, 14, true);
    // Blonde tousled bangs & swept hair
    for (let x = 15; x <= 33; x++) {
      const h = 8 + Math.floor(Math.sin((x - 14) * 0.45) * 3) + (x < 21 ? 2 : 0);
      for (let y = 5; y <= h; y++) {
        s.pset(x, y, y === 5 ? 240 : ditherRamp(3, (11 - y) / 6, x, y, 10, 15));
      }
    }
  } else if (charId === 1) {
    // PURPLE TENTACLE (Haunted lab wallpaper + tapered purple cone body + suction spots + mutant brow)
    s.paintRampGradient(0, 0, PORTRAIT_W, PORTRAIT_H, 5, 0.12, 0.45, 0, 7);
    s.line(8, 0, 8, 35, 82); s.line(24, 0, 24, 35, 82); s.line(40, 0, 40, 35, 82);
    // Tapered tentacle body
    for (let y = 5; y < 36; y++) {
      const u = (y - 5) / 30;
      const half = Math.round(5.5 + u * 9.5);
      const bend = Math.round(Math.sin(u * 2.2) * 1.5);
      const cx = 24 + bend;
      for (let x = cx - half; x <= cx + half; x++) {
        if (x === cx - half || x === cx + half || y === 5) s.pset(x, y, 240);
        else {
          const light = clamp(0.65 - (x - cx) / (half * 1.8), 0.1, 0.95);
          s.pset(x, y, ditherRamp(5, light, x, y, 4, 13));
        }
      }
    }
    // Chartreuse/green suction spots
    drawOvalShaded(s, 17, 29, 2.6, 2.2, 6, 9, 14, true);
    drawOvalShaded(s, 31, 31, 2.5, 2.0, 6, 9, 14, true);
    drawOvalShaded(s, 20, 9, 2.0, 1.6, 6, 10, 14, true);
  } else if (charId === 2) {
    // INDIANA JONES (Atlantean warm stone + leather jacket + khaki shirt + rugged stubble + Fedora!)
    s.paintRampGradient(0, 0, PORTRAIT_W, PORTRAIT_H, 7, 0.15, 0.55, 1, 8);
    // Leather jacket & khaki collar
    for (let y = 26; y < 36; y++) {
      const sp = 14 + (y - 26);
      for (let x = 24 - sp; x <= 24 + sp; x++) {
        const shirt = Math.abs(x - 24) < 5;
        s.pset(x, y, Math.abs(x - 24) === sp ? 240 : (shirt ? 77 : (x < 24 ? 69 : 66)));
      }
    }
    s.fillRect(21, 22, 6, 5, 232);
    drawOvalShaded(s, 24, 17, 8.2, 9.0, 14, 5, 13, true);
    // 5-o'clock rugged jaw stubble dither
    for (let y = 19; y <= 24; y++) {
      for (let x = 18; x <= 30; x++) {
        if (s.pget(x, y) >= 224 && ((x + y) & 1) === 0) s.pset(x, y, 228);
      }
    }
    // Iconic Brown Fedora Crown, Dark Ribbon & Wide Swept Brim
    for (let y = 3; y <= 9; y++) {
      const hw = 7 + Math.floor((y - 3) * 0.5);
      for (let x = 24 - hw; x <= 24 + hw; x++) {
        s.pset(x, y, y === 3 || Math.abs(x - 24) === hw ? 240 : (y >= 8 ? 64 : (x < 24 ? 71 : 68)));
      }
    }
    // Wide fedora brim
    for (let x = 10; x <= 38; x++) {
      const by = 10 + (x > 28 ? 1 : 0);
      s.pset(x, by, 240);
      s.pset(x, by + 1, 69);
    }
  } else if (charId === 3) {
    // REBEL STARFIGHTER PILOT (Cockpit grid + Tangerine flight suit + White/Red Flight Helmet + Amber Visor)
    s.fillRect(0, 0, PORTRAIT_W, PORTRAIT_H, 145);
    for (let x = 0; x < PORTRAIT_W; x += 8) s.line(x, 0, x, 35, 162);
    for (let y = 0; y < PORTRAIT_H; y += 8) s.line(0, y, 47, y, 162);
    // Flight suit & flak vest
    for (let y = 26; y < 36; y++) {
      const sp = 14 + (y - 26);
      for (let x = 24 - sp; x <= 24 + sp; x++) {
        const vest = Math.abs(x - 24) < 6;
        s.pset(x, y, Math.abs(x - 24) === sp ? 240 : (vest ? 14 : 247));
      }
    }
    // Helmet Dome (White with Red Squadron stripes)
    drawOvalShaded(s, 24, 15, 11, 11, 0, 9, 15, true);
    s.fillRect(23, 4, 2, 7, 148); // Center ridge
    s.fillRect(18, 6, 2, 5, 241); // Left red rebel crest stripe
    s.fillRect(28, 6, 2, 5, 241); // Right red rebel crest stripe
    // Lower face exposed inside helmet + chin strap
    drawOvalShaded(s, 24, 19, 7.2, 6.8, 14, 6, 13, true);
    s.fillRect(19, 24, 10, 2, 67); // Chin cup
  } else if (charId === 4) {
    // BOBBIN THREADBARE (Starry Loom night + Mystical Hooded Weaver Cloak + Shadowed Face)
    s.paintRampGradient(0, 0, PORTRAIT_W, PORTRAIT_H, 11, 0.06, 0.45, 0, 7);
    s.pset(8, 7, 255); s.pset(41, 10, 190); s.pset(11, 22, 174); s.pset(39, 20, 255);
    // Flowing Sapphire Weaver Cloak & Pointed Hood
    for (let y = 3; y < 36; y++) {
      const hw = y < 18 ? Math.round(3 + (y - 3) * 0.78) : Math.round(14.5 + (y - 18) * 0.45);
      for (let x = 24 - hw; x <= 24 + hw; x++) {
        const edge = Math.abs(x - 24) === hw || y === 3;
        s.pset(x, y, edge ? 240 : ditherRamp(11, x < 24 ? 0.72 : 0.38, x, y, 3, 12));
      }
    }
    // Silver Weaver Clasp at throat
    s.fillRect(22, 27, 4, 4, 158);
    s.pset(23, 28, 174);
    // Deep pitch-black void inside hood
    drawOvalShaded(s, 24, 17, 7.2, 7.8, 0, 0, 1, true);
  } else if (charId === 5) {
    // MAX (Neon Sunset backdrop + Tall White Lagomorph Ears + Hyperactive Toothy Head)
    s.paintRampGradient(0, 0, PORTRAIT_W, PORTRAIT_H, 12, 0.22, 0.78, 2, 12);
    // Tall rabbit ears extending from top!
    for (const ex of [17, 31]) {
      drawOvalShaded(s, ex, 8, 3.6, 7.5, 0, 11, 15, true);
      for (let y = 4; y <= 12; y++) s.pset(ex, y, 251); // Pink inner ear
    }
    // Neck & furry shoulders
    drawOvalShaded(s, 24, 33, 11, 5, 0, 10, 15, true);
    // Max's wide pear-shaped white rabbit head/cheeks
    drawOvalShaded(s, 24, 18, 8.0, 6.5, 0, 11, 15, true);
    drawOvalShaded(s, 24, 22, 10.5, 6.2, 0, 11, 15, true);
    // Little pink nose
    s.fillRect(23, 18, 2, 2, 241);
  } else {
    // GHOST PIRATE LECHUCK (Hellfire cavern + Huge Tricorn Hat + Glowing Green Skull + Fiery Ghost Beard!)
    s.paintRampGradient(0, 0, PORTRAIT_W, PORTRAIT_H, 8, 0.25, 0.75, 1, 10);
    // Massive ghostly dark-green coat shoulders + gold epaulets
    for (let y = 26; y < 36; y++) {
      const sp = 16 + (y - 26);
      for (let x = 24 - sp; x <= 24 + sp; x++) {
        s.pset(x, y, Math.abs(x - 24) >= sp - 1 ? 61 : 98);
      }
    }
    // Huge Tricorn Pirate Hat (x = 6..42, y = 2..13)
    for (let y = 2; y <= 13; y++) {
      const hw = Math.min(19, 8 + (y - 2) * 2);
      for (let x = 24 - hw; x <= 24 + hw; x++) {
        const rim = y === 2 || Math.abs(x - 24) === hw || y === 13;
        s.pset(x, y, rim ? 109 : 97);
      }
    }
    // Skull emblem on hat
    s.fillRect(22, 5, 4, 4, 111); s.pset(22, 6, 240); s.pset(25, 6, 240);
    // Necrotic green skull face
    drawOvalShaded(s, 24, 19, 8.0, 7.2, 6, 5, 13, true);
    // Giant braided ectoplasm-green beard flowing down y = 22..35
    for (let y = 22; y < 36; y++) {
      const tendrils = 11 - Math.floor((y - 22) * 0.35);
      for (let x = 24 - tendrils; x <= 24 + tendrils; x++) {
        const braid = ((x + y) % 4 === 0);
        s.pset(x, y, braid ? 99 : ditherRamp(6, 0.78 - (y - 22) * 0.03, x, y, 5, 14));
      }
    }
  }

  return s.commit();
}

for (let c = 0; c < 7; c++) portraitBaseCache[c] = buildPortraitBase(c);

function renderPortrait(targetCtx, dx, dy, charId, expr, talkFrame, blinking, lookOffset) {
  // Draw pre-rendered 48x36 base portrait
  targetCtx.drawImage(portraitBaseCache[charId], dx, dy);
  const look = clamp(Math.round(lookOffset), -1, 1);

  // Dynamic Eyes & Brows
  if (charId === 3) {
    // Rebel Pilot: Translucent Amber Blast Visor over eyes + mouth animation below!
    targetCtx.fillStyle = PAL_HEX[240];
    targetCtx.fillRect(dx + 16, dy + 12, 16, 6);
    targetCtx.fillStyle = PAL_HEX[expr === "wince" ? 241 : 245];
    targetCtx.fillRect(dx + 17, dy + 13, 14, 4);
    targetCtx.fillStyle = PAL_HEX[255];
    targetCtx.fillRect(dx + 18 + look, dy + 13, 4, 1);
  } else if (charId === 4) {
    // Bobbin Threadbare: Luminous Glowing Eyes inside dark hood!
    const eyeY = dy + 16;
    if (!blinking) {
      const col = expr === "cheer" ? 255 : expr === "wince" ? 242 : 174;
      targetCtx.fillStyle = PAL_HEX[col];
      targetCtx.fillRect(dx + 19 + look, eyeY, 3, expr === "wince" ? 1 : 2);
      targetCtx.fillRect(dx + 26 + look, eyeY, 3, expr === "wince" ? 1 : 2);

// 6. HIGH-DETAIL SPRITE SHEET (makeSprite + 4-SHADE VGA RAMPS + 1px OUTLINES)
// ============================================================================
function makeSprite(rows, colorMap, autoOutline = false) {
  const h = rows.length;
  const w = rows[0].length;
  const surf = new PixelSurface(w, h);
  for (let y = 0; y < h; y++) {
    const r = rows[y];
    for (let x = 0; x < w; x++) {
      const ch = r[x];
      if (ch === "." || ch === " ") continue;
      const idx = colorMap[ch];
      if (idx !== undefined) surf.pset(x, y, idx);
    }
  }
  if (autoOutline) surf.outlineNonEmpty(240);
  return surf.commit();
}

const brickSprites = {};
function buildBeveledBrick(shades, cracks = 0, rivets = false) {
  const [hi, bev, mid, alt, shd] = shades;
  const s = new PixelSurface(BRICK_W, BRICK_H);
  for (let y = 0; y < BRICK_H; y++) {
    for (let x = 0; x < BRICK_W; x++) {
      if (x === BRICK_W - 1 || y === BRICK_H - 1) s.pset(x, y, 240);
      else if (y === 0 && x === 0) s.pset(x, y, hi);
      else if (y === 0 || x === 0) s.pset(x, y, bev);
      else if (y === BRICK_H - 2 || x === BRICK_W - 2) s.pset(x, y, shd);
      else s.pset(x, y, ((x + y) & 1) ? mid : alt);
    }
  }
  if (rivets) {
    s.pset(1, 1, hi); s.pset(5, 1, hi);
    s.pset(1, 3, shd); s.pset(5, 3, shd);
  }
  if (cracks >= 1) {
    s.pset(3, 0, 240); s.pset(3, 1, 240); s.pset(4, 2, 240); s.pset(3, 3, 240);
  }
  if (cracks >= 2) {
    s.pset(1, 2, 240); s.pset(2, 2, 240); s.pset(5, 3, 240); s.pset(6, 4, 240);
  }
  return s.commit();
}

// --- 18x9 Glossy Beveled Capsules with 7x7 Pixel Icons (L, E, C, S, P) ---
function buildCapsuleSprite(pillShades, iconRows, iconMap) {
  const [hi, top, mid, dark] = pillShades;
  const s = new PixelSurface(18, 9);
  for (let y = 0; y < 9; y++) {
    const inset = (y === 0 || y === 8) ? 3 : (y === 1 || y === 7) ? 1 : 0;
    for (let x = inset; x < 18 - inset; x++) {
      const border = (y === 0 || y === 8 || x === inset || x === 17 - inset);
      if (border) s.pset(x, y, 240);
      else if (y === 1) s.pset(x, y, hi);
      else if (y <= 3) s.pset(x, y, top);
      else if (y <= 5) s.pset(x, y, mid);
      else s.pset(x, y, dark);
    }
  }
  // Glossy end-cap trim bands at x=4 and x=13
  for (let y = 1; y <= 7; y++) {
    s.pset(4, y, y <= 2 ? 255 : 155);
    s.pset(13, y, y <= 2 ? 255 : 155);
  }
  // Center 7x7 pixel icon at x = 5..11, y = 1..7
  for (let iy = 0; iy < 7; iy++) {
    const r = iconRows[iy];
    for (let ix = 0; ix < 7; ix++) {
      const ch = r[ix];
      if (ch !== ".") s.pset(5 + ix, 1 + iy, iconMap[ch]);
    }
  }
  return s.commit();
}

// World 4: 18x18 Spiral Gravity Vortex (4 animated rotation frames)
const vortexFrames = Array.from({ length: 4 }, (_, f) => {
  const s = new PixelSurface(18, 18);
  const cx = 8.5, cy = 8.5;
  for (let y = 0; y < 18; y++) {
    for (let x = 0; x < 18; x++) {
      const dx = x - cx, dy = y - cy;
      const r = Math.hypot(dx, dy);
      if (r > 8.5) continue;
      if (r < 2.2) { s.pset(x, y, r < 1.2 ? 255 : 174); continue; }
      const ang = Math.atan2(dy, dx) + r * 0.58 - (f * Math.PI * 0.5);
      const arm = Math.sin(ang * 2);
      if (arm > 0.25) {
        s.pset(x, y, arm > 0.75 ? 174 : 92);
      } else if (r < 5.0 && ((x + y + f) & 1) === 0) {
        s.pset(x, y, 165);
      }
    }
  }
  return s.commit();
});

function buildLeChuckBossFrame(frameType) {
  // 44x30 Centerpiece Ghost Pirate LeChuck Boss!
  // frameType: 0 = idle billowing, 1 = jaw-laugh spellcast, 2 = hit-flash white/ectoplasm
  const s = new PixelSurface(44, 30);
  const flash = frameType === 2;
  const cOut = flash ? 109 : 240;
  const cHat = flash ? 111 : 97;
  const cHatTrim = flash ? 255 : 109;
  const cSkin = flash ? 255 : 107;
  const cBeard = flash ? 255 : 103;
  const cBeardHi = flash ? 255 : 110;
  const cCoat = flash ? 111 : 98;
  const cGold = flash ? 255 : 62;

  // 1. Tattered Ghost Coat Shoulders & Gold Epaulets (y = 17..28, x = 4..39)
  for (let y = 17; y < 29; y++) {
    const hw = 12 + Math.floor((y - 17) * 0.65);
    for (let x = 22 - hw; x <= 22 + hw; x++) {
      if (y === 28 && ((x + frameType) % 3 === 0)) continue; // Tattered spectral hem!
      const edge = Math.abs(x - 22) === hw;
      s.pset(x, y, edge ? cOut : cCoat);
    }
  }
  // Gold Epaulets on shoulders
  s.fillRect(8, 17, 6, 3, cGold);
  s.fillRect(30, 17, 6, 3, cGold);

  // 2. Giant Tricorn Pirate Hat with Spectral Plume (y = 1..11, x = 3..40)
  for (let y = 2; y <= 11; y++) {
    const wing = Math.min(18, 6 + (y - 2) * 2);
    for (let x = 22 - wing; x <= 22 + wing; x++) {
      const rim = y === 2 || y === 11 || Math.abs(x - 22) >= wing - 1;
      s.pset(x, y, rim ? cHatTrim : cHat);
    }
  }
  // Spectral feather plume waving on right side of hat
  const plumeShift = frameType === 1 ? 1 : 0;
  for (let i = 0; i < 8; i++) {
    s.fillRect(29 + i, Math.max(0, 3 - Math.floor(i * 0.4) + plumeShift), 2, 2, flash ? 255 : 111);
  }
  // Jolly Roger skull badge on hat center
  s.fillRect(20, 5, 4, 4, flash ? 255 : 239);
  s.pset(20, 6, cOut); s.pset(23, 6, cOut);

  // 3. Necrotic Skull Head & Blazing Eyes (x = 15..29, y = 11..20)
  for (let y = 11; y <= 19; y++) {
    for (let x = 15; x <= 29; x++) {
      const edge = x === 15 || x === 29;
      s.pset(x, y, edge ? cOut : cSkin);
    }
  }
  // Eyes
  s.fillRect(17, 13, 4, 3, cOut);
  s.fillRect(23, 13, 4, 3, cOut);
  const eyeCol = flash ? 255 : (frameType === 1 ? 143 : 241);
  s.fillRect(18, 14, 2, 2, eyeCol);
  s.fillRect(24, 14, 2, 2, eyeCol);

  // 4. Grinning / Laughing Skull Jaw
  const jawOpen = frameType === 1 ? 3 : 1;
  s.fillRect(18, 17, 8, jawOpen + 2, cOut);
  for (let tx = 18; tx <= 25; tx += 2) s.pset(tx, 17, 255);
  if (jawOpen > 1) s.fillRect(19, 18, 6, 2, flash ? 255 : 141);

  // 5. Massive Braided Ectoplasm-Green Pirate Beard (y = 19..29)
  const sway = frameType === 1 ? -1 : 1;
  for (let y = 19 + (frameType === 1 ? 1 : 0); y < 30; y++) {
    const hw = Math.max(4, 11 - Math.floor((y - 19) * 0.6));
    for (let x = 22 - hw; x <= 22 + hw; x++) {
      if (y >= 27 && ((x + sway) % 3 === 0)) continue; // Forked beard tips!
      const braid = ((x + y) % 4 === 0);
      s.pset(x, y, braid ? cOut : (((x ^ y) & 1) ? cBeardHi : cBeard));
    }
  }

  return s.commit();
}

  buildLeChuckBossFrame(1),
  buildLeChuckBossFrame(2)
];

// 8. MULTI-CHANNEL ADLIB / OPL2 FM SYNTHESIZER (7 SOUNDTRACKS + LO-FI SFX)
// ============================================================================
const NOTE_SEMI = { C:0, "C#":1, Db:1, D:2, "D#":3, Eb:3, E:4, F:5, "F#":6, Gb:6, G:7, "G#":8, Ab:8, A:9, "A#":10, Bb:10, B:11 };
function noteToFreq(noteStr) {
  if (!noteStr || noteStr === "." || noteStr === "-") return 0;
  const m = /^([A-G][#b]?)(\d)$/.exec(noteStr);
  if (!m) return 0;
  const midi = (parseInt(m[2], 10) + 1) * 12 + NOTE_SEMI[m[1]];
  return 440 * Math.pow(2, (midi - 69) / 12);
}

class Opl2AudioEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.unlocked = false;
    this.masterGain = null;
    this.musicGain = null;
    this.sfxGain = null;
    this.noiseBuf = null;
    this.driveCurve = null;
    this.trackIdx = 0;
    this.step = 0;
    this.nextNoteTime = 0;
    this.timerId = null;
  }

  unlock() {
    if (this.ctx) {
      if (this.ctx.state === "suspended") this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = this.muted ? 0 : 0.72;
    this.masterGain.connect(this.ctx.destination);

    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.65;
    this.musicGain.connect(this.masterGain);

    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 0.85;
    this.sfxGain.connect(this.masterGain);

    // Pre-generate 1s white-noise buffer for OPL2 drums & explosions
    const sr = this.ctx.sampleRate;
    this.noiseBuf = this.ctx.createBuffer(1, sr, sr);
    const ch = this.noiseBuf.getChannelData(0);
    const rng = mulberry32(4242);
    for (let i = 0; i < sr; i++) ch[i] = rng() * 2 - 1;

    // Soft overdrive curve for LeChuck metal guitar
    this.driveCurve = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      const x = (i / 127.5) - 1;
      this.driveCurve[i] = Math.tanh(x * 3.8);
    }

    this.unlocked = true;
    this.nextNoteTime = this.ctx.currentTime + 0.04;
    this.timerId = setInterval(() => this.scheduleTick(), 25);
  }

  setMuted(m) {
    this.muted = m;
    if (this.masterGain && this.ctx) {
      this.masterGain.gain.setValueAtTime(this.muted ? 0 : 0.72, this.ctx.currentTime);
    }
  }

  setTrack(idx) {
    idx = clamp(idx | 0, 0, WORLD_TRACKS.length - 1);
    if (this.trackIdx !== idx) {
      this.trackIdx = idx;
      this.step = 0;
    }
  }

  playFMVoice(freq, patchName, when, dur, destNode) {
    if (!this.ctx || freq <= 0) return;
    const p = OPL2_PATCHES[patchName] || OPL2_PATCHES.steelpan;
    const c = this.ctx.createOscillator();
    const m = this.ctx.createOscillator();
    const mGain = this.ctx.createGain();
    const env = this.ctx.createGain();

    c.type = p.cType;
    m.type = p.mType;
    if (p.scoop) {
      c.frequency.setValueAtTime(freq * 0.94, when);
      c.frequency.exponentialRampToValueAtTime(freq, when + 0.045);
    } else {
      c.frequency.setValueAtTime(freq, when);
    }
    m.frequency.setValueAtTime(freq * p.ratio, when);

    // Modulator FM index envelope
    const peakIdx = freq * p.index;
    mGain.gain.setValueAtTime(peakIdx, when);
    mGain.gain.exponentialRampToValueAtTime(Math.max(8, peakIdx * 0.25), when + p.dec);

    // Carrier amplitude envelope
    env.gain.setValueAtTime(0.0001, when);
    env.gain.linearRampToValueAtTime(p.gain, when + p.atk);
    env.gain.exponentialRampToValueAtTime(Math.max(0.001, p.gain * p.sus), when + p.atk + p.dec);
    env.gain.exponentialRampToValueAtTime(0.0001, when + dur + 0.04);

    m.connect(mGain);
    mGain.connect(c.frequency);

    if (p.drive) {
      const shaper = this.ctx.createWaveShaper();
      shaper.curve = this.driveCurve;
      c.connect(shaper);
      shaper.connect(env);
    } else {
      c.connect(env);
    }
    env.connect(destNode || this.musicGain);

    c.start(when);
    m.start(when);
    c.stop(when + dur + 0.06);
    m.stop(when + dur + 0.06);

    if (p.echo) {
      // Crypt echo tap
      this.playFMVoiceSimpleEcho(freq, when + 0.24, dur * 0.7, p.gain * 0.34);
    }
  }

  playFMVoiceSimpleEcho(freq, when, dur, gainVal) {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(freq, when);
    g.gain.setValueAtTime(gainVal, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g);
    g.connect(this.musicGain);
    o.start(when);
    o.stop(when + dur + 0.02);
  }

  playBass(freq, when, dur) {
    if (!this.ctx || freq <= 0) return;
    const o = this.ctx.createOscillator();
    const flt = this.ctx.createBiquadFilter();
    const g = this.ctx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(freq, when);
    flt.type = "lowpass";
    flt.frequency.setValueAtTime(freq * 5.5, when);
    flt.frequency.exponentialRampToValueAtTime(freq * 1.8, when + dur);
    g.gain.setValueAtTime(0.001, when);
    g.gain.linearRampToValueAtTime(0.22, when + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0008, when + dur + 0.03);
    o.connect(flt);
    flt.connect(g);
    g.connect(this.musicGain);
    o.start(when);
    o.stop(when + dur + 0.04);
  }

  playDrum(code, when) {
    if (!this.ctx || !code || code === ".") return;
    if (code === "K") {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(145, when);
      o.frequency.exponentialRampToValueAtTime(38, when + 0.09);
      g.gain.setValueAtTime(0.26, when);
      g.gain.exponentialRampToValueAtTime(0.001, when + 0.11);
      o.connect(g); g.connect(this.musicGain);
      o.start(when); o.stop(when + 0.12);
    } else if (code === "S" || code === "H" || code === "O") {
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuf;
      const flt = this.ctx.createBiquadFilter();
      const g = this.ctx.createGain();
      flt.type = code === "S" ? "bandpass" : "highpass";
      flt.frequency.setValueAtTime(code === "S" ? 1900 : 6800, when);
      const dur = code === "S" ? 0.11 : code === "O" ? 0.13 : 0.04;
      const amp = code === "S" ? 0.15 : code === "O" ? 0.08 : 0.055;
      g.gain.setValueAtTime(amp, when);
      g.gain.exponentialRampToValueAtTime(0.001, when + dur);
      src.connect(flt); flt.connect(g); g.connect(this.musicGain);
      src.start(when); src.stop(when + dur + 0.01);
    } else if (code === "R") {
      // Reggae / Jazz rimshot woodblock
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(840, when);
      o.frequency.exponentialRampToValueAtTime(420, when + 0.035);
      g.gain.setValueAtTime(0.11, when);
      g.gain.exponentialRampToValueAtTime(0.001, when + 0.04);
      o.connect(g); g.connect(this.musicGain);
      o.start(when); o.stop(when + 0.045);
    }
  }

  scheduleTick() {
    if (!this.ctx || this.ctx.state !== "running") return;
    const lookahead = 0.12;
    const trk = WORLD_TRACKS[this.trackIdx];
    const baseStepDur = (60 / trk.bpm) / 4; // 16th note

    while (this.nextNoteTime < this.ctx.currentTime + lookahead) {
      const idx32 = this.step & 31;
      const barB = (this.step & 32) !== 0;
      const when = this.nextNoteTime;
      const stepDur = baseStepDur * (1 + ((this.step & 1) ? -trk.swing : trk.swing));

      const leadArr = barB ? trk.leadB : trk.leadA;
      const lNote = noteToFreq(leadArr[idx32]);
      const hNote = noteToFreq(trk.harm[idx32]);
      const bNote = noteToFreq(trk.bass[idx32]);

      if (lNote > 0) this.playFMVoice(lNote, trk.patch, when, baseStepDur * 1.9, this.musicGain);
      if (hNote > 0) this.playFMVoice(hNote, "harmony", when, baseStepDur * 1.8, this.musicGain);
      if (bNote > 0) this.playBass(bNote, when, baseStepDur * 1.7);
      this.playDrum(trk.drums[idx32], when);

      this.nextNoteTime += stepDur;
      this.step = (this.step + 1) & 63;
    }
  }

  // Dedicated Lo-Fi AdLib SFX Channel
  sfx(type, param = 0) {
    if (!this.ctx || this.muted || this.ctx.state !== "running") return;
    const t = this.ctx.currentTime;
    if (type === "paddle") {
      this.playFMVoice(330 + param * 40, "steelpan", t, 0.07, this.sfxGain);
    } else if (type === "brick") {
      const f = 440 * Math.pow(1.06, clamp(param, 0, 14));
      this.playFMVoice(f, "steelpan", t, 0.08, this.sfxGain);
    } else if (type === "armor") {
      this.playFMVoice(220, "brass", t, 0.07, this.sfxGain);
    } else if (type === "steel") {
      this.playFMVoice(1080, "chimepad", t, 0.05, this.sfxGain);
    } else if (type === "grog") {
      // Deep rumbling barrel explosion + noise blast
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuf;
      const flt = this.ctx.createBiquadFilter();
      const g = this.ctx.createGain();
      flt.type = "lowpass";
      flt.frequency.setValueAtTime(950, t);
      flt.frequency.exponentialRampToValueAtTime(95, t + 0.36);
      g.gain.setValueAtTime(0.38, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
      src.connect(flt); flt.connect(g); g.connect(this.sfxGain);
      src.start(t); src.stop(t + 0.4);
    } else if (type === "laser") {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(1180, t);
      o.frequency.exponentialRampToValueAtTime(220, t + 0.085);
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
      o.connect(g); g.connect(this.sfxGain);
      o.start(t); o.stop(t + 0.095);
    } else if (type === "powerup") {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        this.playFMVoice(f, "classical", t + i * 0.045, 0.11, this.sfxGain);
      });
    } else if (type === "loomNote") {
      const scale = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88];
      this.playFMVoice(scale[param % 7] * 2, "chimepad", t, 0.20, this.sfxGain);
    } else if (type === "spell") {
      [523.25, 659.25, 783.99, 987.77, 1318.5].forEach((f, i) => {
        this.playFMVoice(f, "chimepad", t + i * 0.055, 0.25, this.sfxGain);
      });
    } else if (type === "warp") {
      this.playFMVoice(280, "bmovie", t, 0.16, this.sfxGain);
      this.playFMVoice(560, "bmovie", t + 0.07, 0.16, this.sfxGain);
    } else if (type === "hurt") {
      [392, 349, 311, 233].forEach((f, i) => {
        this.playFMVoice(f, "metal", t + i * 0.065, 0.12, this.sfxGain);
      });
    } else if (type === "clear") {
      [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((f, i) => {
        this.playFMVoice(f, "brass", t + i * 0.08, 0.18, this.sfxGain);
      });
    }
  }
}

function buildHudSidebarSurface() {
  const s = new PixelSurface(HUD_W, H);
  // Textured weathered mahogany & brass SCUMM UI panel
  s.paintRampGradient(0, 0, HUD_W, H, 4, 0.34, 0.14, 0, 6);
  for (let y = 0; y < H; y++) {
    s.pset(0, y, 240);
    s.pset(1, y, 59); // Left brass trim bar separating playfield & HUD
    s.pset(HUD_W - 1, y, 240);
    if (y % 19 === 0) {
      for (let x = 2; x < HUD_W - 1; x++) s.pset(x, y, 65);
    }
  }
  // Ornate Beveled Portrait Frame (outer x=6..57, y=3..42 -> inner 48x36 at x=8, y=5)
  s.fillRect(6, 3, 52, 40, 240);
  s.fillRect(7, 4, 50, 38, 60);
  s.fillRect(7, 4, 50, 1, 63);
  s.fillRect(7, 41, 50, 1, 52);

  // Sunken dark slate boxes for Mechanic Gauge (y=112..140), Power Badges (y=143..165), Marquee (y=168..184)
  const boxes = [[4, 112, 56, 28], [4, 143, 56, 22], [4, 168, 56, 16]];
  for (const [bx, by, bw, bh] of boxes) {
    s.fillRect(bx, by, bw, bh, 240);
    s.paintRampGradient(bx + 1, by + 1, bw - 2, bh - 2, 0, 0.08, 0.22, 0, 3);
    s.fillRect(bx + 1, by + bh - 1, bw - 2, 1, 71);
  }
  return s.commit();
}
const hudBgCanvas = buildHudSidebarSurface();

function buildPlaqueSurface(w, h, rampIdx = 1) {
  const s = new PixelSurface(w, h);
  s.fillRect(0, 0, w, h, 240);
  s.fillRect(1, 1, w - 2, h - 2, 60);
  s.fillRect(2, 2, w - 4, h - 4, 240);
  s.paintRampGradient(3, 3, w - 6, h - 6, rampIdx, 0.32, 0.08, 0, 5);
  // Corner brass rivets
  for (const [rx, ry] of [[4, 4], [w - 6, 4], [4, h - 6], [w - 6, h - 6]]) {
    s.fillRect(rx, ry, 2, 2, 63);
  }
  return s.commit();
}

function loadHiScore() {
  try {
    const v = parseInt(localStorage.getItem(HI_SCORE_KEY) || "50000", 10);
    return Number.isFinite(v) && v > 0 ? v : 50000;
  } catch (_) {
    return 50000;

}

}

function sayQuip(text, expr = "idle", duration = 3.0) {
  game.speechText = text;
  game.speechTimer = duration;
  game.speechTotal = duration;
  if (expr !== "idle") {
    game.portraitExpr = expr;
    game.portraitExprTimer = duration;
  }
}

function setExpr(expr, duration = 1.4) {
  game.portraitExpr = expr;
  game.portraitExprTimer = duration;
}

function addScore(pts, fxX = -1, fxY = -1, colorIdx = 63) {
  game.score = Math.min(9999999, game.score + (pts | 0));
  if (game.score > game.hiScore) {
    game.hiScore = game.score;
    saveHiScore(game.hiScore);
  }
  if (fxX >= 0 && fxY >= 0) {
    game.floatTexts.push({
      x: fxX, y: fxY, text: "+" + pts, col: colorIdx, life: 0.85, maxLife: 0.85
    });
  }
}

function triggerShake(mag = 2, dur = 0.16) {
  game.shakeMag = Math.max(game.shakeMag, mag);
  game.shakeTime = Math.max(game.shakeTime, dur);
}

function spawnSparks(x, y, count, palIndices, speedScale = 1.0) {
  for (let i = 0; i < count; i++) {
    const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
    const spd = (24 + Math.random() * 68) * speedScale;
    game.particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 12,
      grav: 95,
      col: palIndices[(Math.random() * palIndices.length) | 0],
      size: Math.random() > 0.65 ? 2 : 1,
      life: 0.32 + Math.random() * 0.35
    });
  }
}

function resetPaddleAndBall(keepPower = false) {
  const p = game.paddle;
  p.x = 128;
  p.vx = 0;
  p.curseTimer = 0;
  if (!keepPower) {
    p.mode = "normal";
    p.w = 32;
    p.h = 7;
    p.slowTimer = 0;
  }
  game.balls = [{
    x: p.x,
    y: p.y - 3,
    vx: 62,
    vy: -116,
    speed: 132,
    stuck: true,
    stuckOffset: 0,
    fire: false,
    trail: []
  }];
