<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARKANOID: SCUMM OF THE CARIBBEAN — 1992 VGA &amp; OPL2 iMUSE Edition</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    background: #05060a;
    color: #d8dce8;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: monospace;
  }
  #cabinet {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0b10;
    border: 3px solid #232634;
    box-shadow: 0 0 0 2px #0f111a, 0 18px 50px rgba(0, 0, 0, 0.92);
  }
  canvas#vga {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: none;
  }
  #crt-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.15s linear;
    background:
      linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.02) 0%,
        rgba(255, 255, 255, 0.02) 50%,
        rgba(0, 0, 0, 0.30) 50%,
        rgba(0, 0, 0, 0.30) 100%
      ),
      radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0) 64%, rgba(0, 0, 0, 0.38) 100%);
    background-size: 100% 4px, 100% 100%;
  }
  #crt-overlay.off {
    opacity: 0;
  }

<body>
<div id="cabinet">
  <canvas id="vga" width="320" height="200"></canvas>
  <div id="crt-overlay"></div>
</div>
<script>
(() => {
  'use strict';

  // =========================================================================
  // 1. MODE 13h (320x200) CONSTANTS, 256-COLOR VGA PALETTE & BAYER DITHERING
  // =========================================================================
  const W = 320;
  const H = 200;
  const PF_W = 256;
  const HUD_X = 256;
  const HUD_W = 64;
  const BORDER = 8;
  const PLAY_L = 8;
  const PLAY_R = 248;
  const PLAY_T = 8;
  const PLAY_B = 200;
  const BRICK_COLS = 30;
  const BRICK_W = 8;
  const BRICK_H = 6;

  const canvas = document.getElementById('vga');
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;
  const crtOverlay = document.getElementById('crt-overlay');

  let viewScale = 3;
  function updateViewportScale() {
    const sx = Math.floor((window.innerWidth - 16) / W);
    const sy = Math.floor((window.innerHeight - 16) / H);
    viewScale = Math.max(1, Math.min(sx, sy));
    canvas.style.width = (W * viewScale) + 'px';
    canvas.style.height = (H * viewScale) + 'px';
    crtOverlay.style.backgroundSize = `100% ${Math.max(2, viewScale)}px, 100% 100%`;
  }
  window.addEventListener('resize', updateViewportScale);
  updateViewportScale();

  // Curated 256-color VGA palette organized into smooth 15/16-shade artist ramps
  // Index 0 = Transparent key for sprites/planes; Index 1 = Pitch Obsidian Black (#040508)
  const PAL = new Array(256);
  const PAL32 = new Uint32Array(256);
  const RAMP = {};

  function hexToRgb(hex) {
    const v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }

  function lerpStops(stops, count) {
    const out = [];
    const rgbStops = stops.map(hexToRgb);
    for (let i = 0; i < count; i++) {
      const t = count === 1 ? 0 : i / (count - 1);
      const pos = t * (rgbStops.length - 1);
      const idx = Math.min(rgbStops.length - 2, Math.floor(pos));
      const f = pos - idx;
      const a = rgbStops[idx];
      const b = rgbStops[idx + 1];
      // Quantize to 6-bit VGA DAC steps (0..63 -> 0..255) for authentic 1992 Mode 13h warmth
      const r = Math.round(Math.round(((a[0] + (b[0] - a[0]) * f) / 255) * 63) * (255 / 63));
      const g = Math.round(Math.round(((a[1] + (b[1] - a[1]) * f) / 255) * 63) * (255 / 63));
      const bl = Math.round(Math.round(((a[2] + (b[2] - a[2]) * f) / 255) * 63) * (255 / 63));
      out.push([r, g, bl]);
    }
    return out;
  }

  function installRamp(name, startIdx, count, hexStops) {
    const colors = lerpStops(hexStops, count);
    const indices = [];
    for (let i = 0; i < count; i++) {
      const idx = startIdx + i;
      PAL[idx] = colors[i];
      PAL32[idx] = (255 << 24) | (colors[i][2] << 16) | (colors[i][1] << 8) | colors[i][0];
      indices.push(idx);
    }
    RAMP[name] = indices;
  }

  PAL[0] = [0, 0, 0];
  PAL32[0] = (255 << 24);
  // 1..15: Obsidian, Slate & Starfighter Chrome (15 shades)
  installRamp('SLATE', 1, 15, ['#040508', '#0e111a', '#1b2030', '#2c344a', '#414c68', '#5c6a8a', '#7c8ba8', '#a0afc7', '#c5d1e3', '#e4ecf7', '#ffffff']);
  // 16..31: Caribbean Twilight Blues (16 shades)
  installRamp('TWILIGHT', 16, 16, ['#050817', '#0a1230', '#112252', '#1b397a', '#2854a3', '#3b74c9', '#5998e3', '#84bcf5', '#b5dcff', '#e3f4ff']);
  // 32..47: Melee Harbor Teals & Emerald Sea (16 shades)
  installRamp('TEAL', 32, 16, ['#041217', '#08242b', '#0d3b42', '#14575e', '#1d787d', '#299c9c', '#42c2ba', '#6fe0d4', '#a6f5ea', '#dcfff9']);
  // 48..63: Scumm Bar Lantern Golds, Pirate Brass & Grog Foam (16 shades)
  installRamp('GOLD', 48, 16, ['#1a0903', '#361406', '#59240a', '#803910', '#ab5416', '#cf761d', '#eb9d28', '#ffc43d', '#ffe375', '#fff8c9']);
  // 64..79: Pirate Timber, Rope Leather & Skull Bone (16 shades)
  installRamp('WOOD', 64, 16, ['#120a07', '#24140e', '#3b2117', '#573322', '#754830', '#966242', '#b5825c', '#cfb687', '#e8dcc0', '#faf4e6']);
  // 80..95: Edison Mansion Stormy Purples & Bruised Violets (16 shades)
  installRamp('PURPLE', 80, 16, ['#0b0514', '#1a0d2e', '#2d174d', '#462470', '#633596', '#844dba', '#a76fd9', '#c898f0', '#e4c5fc', '#f7ebff']);
  // 96..111: Tentacle Toxic Greens & Radioactive Lab Slime (16 shades)
  installRamp('SLIME', 96, 16, ['#041407', '#0a290f', '#134518', '#1f6621', '#318c2b', '#4ab536', '#6ede43', '#9bfa57', '#c7ff85', '#ebffc2']);
  // 112..127: Atlantean Terracotta, Sandstone & Crimson Clay (16 shades)
  installRamp('TERRA', 112, 16, ['#170606', '#2e0e0c', '#4d1914', '#70281d', '#963d28', '#ba5938', '#db7b4f', '#f2a372', '#ffd0a6', '#ffebd4']);
  // 128..143: Molten Orichalcum & Hellfire Orange-Lava (16 shades)
  installRamp('LAVA', 128, 16, ['#1c0400', '#3d0800', '#661100', '#941e02', '#c23408', '#e85612', '#fc8221', '#ffb338', '#ffe169', '#ffffb8']);
  // 144..159: Starfighter Plasma Cyan & Rebel Ion Glow (16 shades)
  installRamp('CYAN', 144, 16, ['#03101c', '#072238', '#0c3b5e', '#135c8c', '#1c83bd', '#29aee6', '#4fd0ff', '#87e5ff', '#bff4ff', '#ebfcff']);
  // 160..175: Loom Celestial Indigos & Stained Crystal Sapphire (16 shades)
  installRamp('INDIGO', 160, 16, ['#060721', '#101242', '#1d226b', '#2e3896', '#4656c2', '#667be3', '#8fa5f7', '#bccbff', '#dfe7ff', '#f5f8ff']);
  // 176..191: LeChuck Necrotic Ghost-Greens & Ectoplasm (16 shades)
  installRamp('ECTO', 176, 16, ['#03120c', '#082619', '#10402b', '#1b6142', '#2b875e', '#43b380', '#68dba3', '#98f5c4', '#c9ffe0', '#ebfff3']);
  // 192..207: Crimson Ruby, Tentacle Magenta & Neon Sign Rose (16 shades)
  installRamp('RUBY', 192, 16, ['#1a040e', '#38081c', '#5e0e2e', '#8c1742', '#ba2356', '#e03a6e', '#fa6490', '#ff99b6', '#ffc9d8', '#ffebf1']);
  // 208..223: SCUMM Portrait Warm Skin Tones & Ivory Fur (16 shades)
  installRamp('SKIN', 208, 16, ['#210f09', '#3d1d12', '#5e2e1e', '#82432e', '#a65d42', '#c77c5c', '#e39e7d', '#f7c2a3', '#ffe0cc', '#fff5ed']);
  // 224..239: Sam & Max Desert Sunset Plum-to-Tangerine (16 shades)
  installRamp('SUNSET', 224, 16, ['#1c0918', '#38122b', '#5c1d3b', '#872b46', '#b5404c', '#db6051', '#f58a58', '#ffba6e', '#ffe394', '#fff7cc']);
  // 240..255: UI Jewel Trim, LED Badges & Pure Specular White (16 shades)
  installRamp('GEM', 240, 16, ['#0d0f17', '#1f2436', '#38405c', '#57638a', '#7e8db8', '#b82538', '#f24455', '#229954', '#48e57a', '#2471a3', '#5dade2', '#b9770e', '#f5b041', '#884ea0', '#c39bd3', '#ffffff']);

  const COL_BLACK = 1;
  const COL_WHITE = 15;

  // 4x4 Bayer ordered dither matrix (0..15)
  const BAYER4 = [
    [ 0,  8,  2, 10],
    [12,  4, 14,  6],
    [ 3, 11,  1,  9],
    [15,  7, 13,  5]
  ];

  function ditherRamp(ramp, t, x, y) {
    const clamped = t <= 0 ? 0 : t >= 1 ? 1 : t;
    const maxIdx = ramp.length - 1;
    const pos = clamped * maxIdx;
    const base = pos | 0;
    if (base >= maxIdx) return ramp[maxIdx];
    const frac = pos - base;
    const thresh = (BAYER4[y & 3][x & 3] + 0.5) * 0.0625;
    return frac > thresh ? ramp[base + 1] : ramp[base];
  }

  function createSurface(w, h) {
    return { w, h, data: new Uint8Array(w * h) };
  }

  function pset(surf, x, y, col) {
    const ix = x | 0, iy = y | 0;
    if (ix < 0 || iy < 0 || ix >= surf.w || iy >= surf.h || col === 0) return;
    surf.data[iy * surf.w + ix] = col;
  }

  function psetRaw(surf, x, y, col) {
    const ix = x | 0, iy = y | 0;
    if (ix < 0 || iy < 0 || ix >= surf.w || iy >= surf.h) return;
    surf.data[iy * surf.w + ix] = col;
  }

  function fillRect(surf, x, y, rw, rh, col) {
    const x0 = Math.max(0, x | 0);
    const y0 = Math.max(0, y | 0);
    const x1 = Math.min(surf.w, (x + rw) | 0);
    const y1 = Math.min(surf.h, (y + rh) | 0);
    if (x1 <= x0 || y1 <= y0) return;
    for (let py = y0; py < y1; py++) {
      surf.data.fill(col, py * surf.w + x0, py * surf.w + x1);
    }
  }

  function hline(surf, x, y, len, col) {
    fillRect(surf, x, y, len, 1, col);
  }

  function vline(surf, x, y, len, col) {
    fillRect(surf, x, y, 1, len, col);
  }

  function drawBevelBox(surf, x, y, bw, bh, fillCol, hiCol, midCol, loCol, outlineCol = COL_BLACK) {
    fillRect(surf, x, y, bw, bh, outlineCol);
    if (bw <= 2 || bh <= 2) return;
    fillRect(surf, x + 1, y + 1, bw - 2, bh - 2, fillCol);
    hline(surf, x + 1, y + 1, bw - 2, hiCol);
    vline(surf, x + 1, y + 1, bh - 2, hiCol);
    hline(surf, x + 1, y + bh - 2, bw - 2, loCol);
    vline(surf, x + bw - 2, y + 1, bh - 2, loCol);
    pset(surf, x + bw - 2, y + 1, midCol);
    pset(surf, x + 1, y + bh - 2, midCol);
  }

  function paintRampGradient(surf, x0, y0, gw, gh, ramp, modeOrFn = 'v') {
    const sx = Math.max(0, x0 | 0);
    const sy = Math.max(0, y0 | 0);
    const ex = Math.min(surf.w, (x0 + gw) | 0);
    const ey = Math.min(surf.h, (y0 + gh) | 0);
    const invW = gw > 1 ? 1 / (gw - 1) : 0;
    const invH = gh > 1 ? 1 / (gh - 1) : 0;
    for (let py = sy; py < ey; py++) {
      const ny = (py - y0) * invH;
      const rowOff = py * surf.w;
      for (let px = sx; px < ex; px++) {
        const nx = (px - x0) * invW;
        let t;
        if (modeOrFn === 'v') t = ny;
        else if (modeOrFn === 'h') t = nx;
        else if (modeOrFn === 'radial') {
          const dx = (nx - 0.5) * 2;
          const dy = (ny - 0.5) * 2;
          t = 1 - Math.min(1, Math.hypot(dx, dy));
        } else {
          t = modeOrFn(nx, ny, px, py);
        }
        surf.data[rowOff + px] = ditherRamp(ramp, t, px, py);
      }
    }
  }

  function paintDitherSphere(surf, cx, cy, r, ramp, lx = -0.45, ly = -0.45) {
    const r2 = r * r;
    for (let dy = -r; dy <= r; dy++) {
      const py = (cy + dy) | 0;
      if (py < 0 || py >= surf.h) continue;
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r2) continue;
        const px = (cx + dx) | 0;
        if (px < 0 || px >= surf.w) continue;
        const nx = dx / r;
        const ny = dy / r;
        const nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
        const dot = Math.max(0, nx * lx + ny * ly + nz * 0.76);
        surf.data[py * surf.w + px] = ditherRamp(ramp, Math.min(1, dot * 1.08), px, py);
      }
    }
  }

  function paintDitherHalo(surf, cx, cy, r, ramp, strength = 0.85, clipMaxX = PF_W) {
    const r2 = r * r;
    for (let dy = -r; dy <= r; dy++) {
      const py = (cy + dy) | 0;
      if (py < 0 || py >= surf.h) continue;
      for (let dx = -r; dx <= r; dx++) {
        const d2 = dx * dx + dy * dy;
        if (d2 > r2) continue;
        const px = (cx + dx) | 0;
        if (px < 0 || px >= clipMaxX || px >= surf.w) continue;
        const falloff = (1 - Math.sqrt(d2) / r) * strength;
        const thresh = (BAYER4[py & 3][px & 3] + 0.5) * 0.0625;
        if (falloff > thresh * 0.85) {
          surf.data[py * surf.w + px] = ditherRamp(ramp, Math.min(1, 0.35 + falloff * 0.65), px, py);
        }
      }
    }
  }

  function blitSurface(dst, src, dx, dy, clipX0 = 0, clipY0 = 0, clipX1 = dst.w, clipY1 = dst.h, overrideCol = 0) {
    const ix = dx | 0, iy = dy | 0;
    const sx0 = Math.max(0, clipX0 - ix);
    const sy0 = Math.max(0, clipY0 - iy);
    const sx1 = Math.min(src.w, clipX1 - ix);
    const sy1 = Math.min(src.h, clipY1 - iy);
    if (sx1 <= sx0 || sy1 <= sy0) return;
    const sData = src.data;
    const dData = dst.data;
    const sw = src.w;
    const dw = dst.w;
    for (let sy = sy0; sy < sy1; sy++) {
      const sRow = sy * sw;
      const dRow = (iy + sy) * dw + ix;
      for (let sx = sx0; sx < sx1; sx++) {
        const c = sData[sRow + sx];
        if (c !== 0) dData[dRow + sx] = overrideCol || c;
      }
    }
  }

  // Blit wide parallax plane with wrap/clamp into playfield [0..PF_W)
  function blitParallaxPlane(dst, plane, scrollX) {
    const pw = plane.w;
    const sData = plane.data;
    const dData = dst.data;
    const off = ((scrollX | 0) % pw + pw) % pw;
    for (let y = 0; y < H; y++) {
      const sRow = y * pw;
      const dRow = y * W;
      for (let x = 0; x < PF_W; x++) {
        let sx = x + off;
        if (sx >= pw) sx -= pw;
        const c = sData[sRow + sx];
        if (c !== 0) dData[dRow + x] = c;
      }
    }
  }

  const mainFb = createSurface(W, H);
  const frameImg = ctx.createImageData(W, H);
  const frameU32 = new Uint32Array(frameImg.data.buffer);

  function presentFramebuffer(shakeX = 0, shakeY = 0) {
    const src = mainFb.data;
    if (shakeX === 0 && shakeY === 0) {
      for (let i = 0; i < W * H; i++) {
        frameU32[i] = PAL32[src[i]];
      }
    } else {
      for (let y = 0; y < H; y++) {
        const sy = Math.max(0, Math.min(H - 1, y - shakeY));
        const dOff = y * W;
        const sOff = sy * W;
        for (let x = 0; x < W; x++) {
          if (x >= HUD_X) {
            frameU32[dOff + x] = PAL32[src[y * W + x]];
          } else {
            const sx = Math.max(0, Math.min(PF_W - 1, x - shakeX));
            frameU32[dOff + x] = PAL32[src[sOff + sx]];
          }
        }
      }
    }
    ctx.putImageData(frameImg, 0, 0);
  }

  // =========================================================================
  // 2. CRISP 5x7 PIXEL-OUTLINED BITMAP FONT (ZERO BROWSER OR 3x5 FONTS)
  // =========================================================================
  const FONT5X7 = {
    ' ': [0,0,0,0,0,0,0],
    'A': [0x0E,0x11,0x11,0x1F,0x11,0x11,0x11],
    'B': [0x1E,0x11,0x11,0x1E,0x11,0x11,0x1E],
    'C': [0x0E,0x11,0x10,0x10,0x10,0x11,0x0E],
    'D': [0x1E,0x11,0x11,0x11,0x11,0x11,0x1E],
    'E': [0x1F,0x10,0x10,0x1E,0x10,0x10,0x1F],
    'F': [0x1F,0x10,0x10,0x1E,0x10,0x10,0x10],
    'G': [0x0E,0x11,0x10,0x17,0x11,0x11,0x0F],
    'H': [0x11,0x11,0x11,0x1F,0x11,0x11,0x11],
    'I': [0x0E,0x04,0x04,0x04,0x04,0x04,0x0E],
    'J': [0x07,0x02,0x02,0x02,0x12,0x12,0x0C],
    'K': [0x11,0x12,0x14,0x18,0x14,0x12,0x11],
    'L': [0x10,0x10,0x10,0x10,0x10,0x10,0x1F],
    'M': [0x11,0x1B,0x15,0x15,0x11,0x11,0x11],
    'N': [0x11,0x19,0x15,0x13,0x11,0x11,0x11],
    'O': [0x0E,0x11,0x11,0x11,0x11,0x11,0x0E],
    'P': [0x1E,0x11,0x11,0x1E,0x10,0x10,0x10],
    'Q': [0x0E,0x11,0x11,0x11,0x15,0x12,0x0D],
    'R': [0x1E,0x11,0x11,0x1E,0x14,0x12,0x11],
    'S': [0x0F,0x10,0x10,0x0E,0x01,0x01,0x1E],
    'T': [0x1F,0x04,0x04,0x04,0x04,0x04,0x04],
    'U': [0x11,0x11,0x11,0x11,0x11,0x11,0x0E],
    'V': [0x11,0x11,0x11,0x11,0x11,0x0A,0x04],
    'W': [0x11,0x11,0x11,0x15,0x15,0x1B,0x11],
    'X': [0x11,0x11,0x0A,0x04,0x0A,0x11,0x11],
    'Y': [0x11,0x11,0x0A,0x04,0x04,0x04,0x04],
    'Z': [0x1F,0x01,0x02,0x04,0x08,0x10,0x1F],
    '0': [0x0E,0x11,0x13,0x15,0x19,0x11,0x0E],
    '1': [0x04,0x0C,0x04,0x04,0x04,0x04,0x0E],
    '2': [0x0E,0x11,0x01,0x06,0x08,0x10,0x1F],
    '3': [0x1E,0x01,0x01,0x0E,0x01,0x01,0x1E],
    '4': [0x02,0x06,0x0A,0x12,0x1F,0x02,0x02],
    '5': [0x1F,0x10,0x1E,0x01,0x01,0x11,0x0E],
    '6': [0x0E,0x10,0x10,0x1E,0x11,0x11,0x0E],
    '7': [0x1F,0x01,0x02,0x04,0x08,0x08,0x08],
    '8': [0x0E,0x11,0x11,0x0E,0x11,0x11,0x0E],
    '9': [0x0E,0x11,0x11,0x0F,0x01,0x01,0x0E],
    ':': [0x00,0x04,0x04,0x00,0x04,0x04,0x00],
    '.': [0x00,0x00,0x00,0x00,0x00,0x06,0x06],
    ',': [0x00,0x00,0x00,0x00,0x06,0x04,0x08],
    '!': [0x04,0x04,0x04,0x04,0x04,0x00,0x04],
    '?': [0x0E,0x11,0x01,0x06,0x04,0x00,0x04],
    '-': [0x00,0x00,0x00,0x1F,0x00,0x00,0x00],
    '+': [0x00,0x04,0x04,0x1F,0x04,0x04,0x00],
    '/': [0x01,0x02,0x02,0x04,0x08,0x08,0x10],
    '\'':[0x04,0x04,0x08,0x00,0x00,0x00,0x00],
    '"': [0x0A,0x0A,0x00,0x00,0x00,0x00,0x00],
    '(': [0x02,0x04,0x08,0x08,0x08,0x04,0x02],
    ')': [0x08,0x04,0x02,0x02,0x02,0x04,0x08],
    '[': [0x0E,0x08,0x08,0x08,0x08,0x08,0x0E],
    ']': [0x0E,0x02,0x02,0x02,0x02,0x02,0x0E],
    '*': [0x00,0x15,0x0E,0x1F,0x0E,0x15,0x00],
    '&': [0x0C,0x12,0x14,0x08,0x15,0x12,0x0D],
    '%': [0x19,0x19,0x02,0x04,0x08,0x13,0x13],
    '~': [0x00,0x00,0x09,0x15,0x12,0x00,0x00],
    '<': [0x02,0x04,0x08,0x10,0x08,0x04,0x02],
    '>': [0x08,0x04,0x02,0x01,0x02,0x04,0x08]
  };

  function measureText5x7(str, scale = 1) {
    if (!str || !str.length) return 0;
    return (str.length * 6 - 1) * scale;
  }

  function drawText5x7(surf, text, x, y, topCol, botCol = topCol, outlineCol = COL_BLACK, scale = 1, clip = null) {
    const s = String(text).toUpperCase();
    const cx0 = clip ? clip.x0 : 0;
    const cy0 = clip ? clip.y0 : 0;
    const cx1 = clip ? clip.x1 : surf.w;
    const cy1 = clip ? clip.y1 : surf.h;

    const putPx = (px, py, col) => {
      for (let sy = 0; sy < scale; sy++) {
        const yy = py + sy;
        if (yy < cy0 || yy >= cy1 || yy < 0 || yy >= surf.h) continue;
        for (let sx = 0; sx < scale; sx++) {
          const xx = px + sx;
          if (xx < cx0 || xx >= cx1 || xx < 0 || xx >= surf.w) continue;
          surf.data[yy * surf.w + xx] = col;
        }
      }
    };

    // Pass 1: 1px dark silhouette outline
    if (outlineCol !== 0) {
      let curX = x | 0;
      const curY = y | 0;
      for (let i = 0; i < s.length; i++) {
        const g = FONT5X7[s[i]] || FONT5X7[' '];
        if (curX + 6 * scale >= cx0 && curX - scale < cx1) {
          for (let r = 0; r < 7; r++) {
            const rowBits = g[r];
            if (!rowBits) continue;
            for (let c = 0; c < 5; c++) {
              if (rowBits & (16 >> c)) {
                const gx = curX + c * scale;
                const gy = curY + r * scale;
                putPx(gx - scale, gy, outlineCol);
                putPx(gx + scale, gy, outlineCol);
                putPx(gx, gy - scale, outlineCol);
                putPx(gx, gy + scale, outlineCol);
                putPx(gx - scale, gy - scale, outlineCol);
                putPx(gx + scale, gy - scale, outlineCol);
                putPx(gx - scale, gy + scale, outlineCol);
                putPx(gx + scale, gy + scale, outlineCol);
              }
            }
          }
        }
        curX += 6 * scale;
      }
    }

    // Pass 2: Crisp 2-shade VGA ramp glyph interior
    let curX = x | 0;
    const curY = y | 0;
    for (let i = 0; i < s.length; i++) {
      const g = FONT5X7[s[i]] || FONT5X7[' '];
      if (curX + 5 * scale >= cx0 && curX < cx1) {
        for (let r = 0; r < 7; r++) {
          const rowBits = g[r];
          if (!rowBits) continue;
          const col = r < 3 ? topCol : (r === 3 && topCol !== botCol ? topCol : botCol);
          for (let c = 0; c < 5; c++) {
            if (rowBits & (16 >> c)) {
              putPx(curX + c * scale, curY + r * scale, col);
            }
          }
        }
      }
      curX += 6 * scale;
    }
  }

  function drawCentered5x7(surf, text, centerX, y, topCol, botCol = topCol, outlineCol = COL_BLACK, scale = 1) {
    const w = measureText5x7(text, scale);
    drawText5x7(surf, text, Math.round(centerX - w / 2), y, topCol, botCol, outlineCol, scale);
  }

  // =========================================================================
  // 3. SPRITE COMPILER (makeSprite), BRICKS, CAPSULES, PADDLES & LECHUCK BOSS
  // =========================================================================
  function makeSprite(rows, colorMap, autoBorderCol = 0) {
    const h = rows.length;
    const w = rows[0].length;
    const surf = createSurface(w, h);
    for (let y = 0; y < h; y++) {
      const r = rows[y];
      for (let x = 0; x < w; x++) {
        const ch = r[x];
        if (ch === '.' || ch === ' ') continue;
        const c = colorMap[ch];
        if (c) surf.data[y * w + x] = c;
      }
    }
    if (autoBorderCol) {
      const copy = new Uint8Array(surf.data);
      const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (copy[y * w + x] !== 0) continue;
          for (let d = 0; d < 4; d++) {
            const nx = x + dirs[d][0], ny = y + dirs[d][1];
            if (nx >= 0 && nx < w && ny >= 0 && ny < h && copy[ny * w + nx] !== 0) {
              surf.data[y * w + x] = autoBorderCol;
              break;
            }
          }
        }
      }
    }
    return surf;
  }

    for (const type of ['L', 'E', 'C', 'S', 'P']) {

        // Rounded 18x9 pill silhouette
        for (let y = 0; y < 9; y++) {
          const inset = (y === 0 || y === 8) ? 3 : (y === 1 || y === 7) ? 1 : 0;
          for (let x = inset; x < 18 - inset; x++) {
            const isEdge = y === 0 || y === 8 || x === inset || x === 17 - inset;
            if (isEdge) {
              s.data[y * 18 + x] = COL_BLACK;
            } else {
              // Cylindrical vertical shading + brass endcaps
              const isCap = x <= 3 || x >= 14;
              const cyl = 1 - Math.abs((y - 2.3) / 5.5);
              if (isCap) {
                s.data[y * 18 + x] = ditherRamp(RAMP.SLATE, Math.max(0.2, cyl * 0.9), x, y);

                s.data[y * 18 + x] = ditherRamp(ramp, Math.max(0.22, cyl * (shimmer ? 0.98 : 0.88)), x, y);

        // Specular highlight strip along top curve
        hline(s, 4, 2, 10, COL_WHITE);
        // Center 7x7 dark badge & crisp icon
        const icon = makeSprite(CAPSULE_ICONS[type], iconMap);
        fillRect(s, 5, 1, 8, 7, COL_BLACK);
        blitSurface(s, icon, 6, 1);
        return s;

  // Deterministic pseudo-random helper for pre-rendered painterly textures
  function hash2D(x, y, seed = 1) {
    let n = (x * 374761393 + y * 668265263 + seed * 1442695041) | 0;
    n = (n ^ (n >> 13)) * 1274126177;
    return ((n ^ (n >> 16)) >>> 0) / 4294967295;
  }

  function paintCloudBank(surf, cx, cy, rx, ry, ramp, loIdx = 2, hiIdx = 12) {
    const sub = ramp.slice(loIdx, hiIdx + 1);
    for (let b = -2; b <= 2; b++) {
      const bx = cx + b * Math.round(rx * 0.48);
      const by = cy + Math.abs(b) * 3;
      const brx = Math.round(rx * (1 - Math.abs(b) * 0.18));
      const bry = Math.round(ry * (1 - Math.abs(b) * 0.15));
      for (let dy = -bry; dy <= bry; dy++) {
        const py = by + dy;
        if (py < 0 || py >= surf.h) continue;
        for (let dx = -brx; dx <= brx; dx++) {
          if ((dx * dx) / (brx * brx) + (dy * dy) / (bry * bry) > 1) continue;
          const px = ((bx + dx) % surf.w + surf.w) % surf.w;
          const light = Math.max(0, Math.min(1, 0.55 - (dy / bry) * 0.45 - (dx / brx) * 0.12));
          surf.data[py * surf.w + px] = ditherRamp(sub, light, px, py);
        }
      }
    }
  }

      } else if (w === 2) {

        paintDitherHalo(p1, 148, 96, 32, RAMP.LAVA.slice(4, 14), 0.75, p1.w);
        paintDitherSphere(p1, 148, 96, 16, RAMP.GOLD.slice(5, 15));

        paintRampGradient(p3, 0, 178, p3.w, 22, RAMP.LAVA.slice(4, 15), (nx, ny) => 0.95 - ny * 0.5);
        for (const bx of [50, 246]) {

      } else if (w === 3) {

        paintRampGradient(p3, 0, 158, p3.w, 42, RAMP.SLATE.slice(1, 7), 'v');

        for (const [sx, topY, sw] of spires) {

      } else if (w === 5) {

        // Plane 1: Desert Mesa Silhouettes & Saguaro Cacti

          }

        fillRect(p1, 0, 136, p1.w, 64, RAMP.TERRA[4]);

        vline(p2, 46, 104, 42, RAMP.SLATE[5]);

        drawText5x7(p2, 'MAX!', 34, 96, RAMP.GOLD[15], RAMP.RUBY[12], COL_BLACK);
        // Saguaro cactus
        fillRect(p2, 252, 112, 4, 32, RAMP.SLIME[4]);
        fillRect(p2, 246, 120, 6, 3, RAMP.SLIME[4]); vline(p2, 246, 114, 8, RAMP.SLIME[4]);
        fillRect(p2, 256, 118, 6, 3, RAMP.SLIME[4]); vline(p2, 261, 112, 8, RAMP.SLIME[4]);

        // Plane 3: Perspective Asphalt Highway Base
        for (let y = 138; y < H; y++) {

          fillRect(p3, cx - halfRoad, y, halfRoad * 2, 1, ditherRamp(RAMP.SLATE.slice(1, 5), 1 - t * 0.5, cx, y));

        for (let x = 0; x < p0.w; x++) {

          fillRect(p0, x, 0, 1, fang, RAMP.LAVA[1]);
        }

        // Plane 1: Colossal Ghost-Ship Ribs & Tattered Spectral Sails
        for (let i = 0; i < 7; i++) {

          for (let y = 58; y < 168; y++) {
            const curve = Math.round(Math.sin(((y - 58) / 110) * Math.PI) * (i < 3 ? -14 : 14));
            fillRect(p1, rx + curve, y, 5, 1, RAMP.ECTO[4]);
            pset(p1, rx + curve, y, RAMP.ECTO[10]);

        // Plane 2: Voodoo Skull Totems & Basalt Battlements
        for (const tx of [24, 266]) {

        paintRampGradient(p3, 0, 172, p3.w, 28, RAMP.LAVA.slice(5, 16), (nx, ny) => 1 - ny * 0.45);
      }

      // --- ORNATE 8px SCULPTED WORLD BORDER FRAME (x=0..7, x=248..255, y=0..7) ---
      const bRamps = [RAMP.WOOD, RAMP.PURPLE, RAMP.TERRA, RAMP.SLATE, RAMP.INDIGO, RAMP.SUNSET, RAMP.ECTO][w];
      const trimRamps = [RAMP.GOLD, RAMP.SLIME, RAMP.LAVA, RAMP.CYAN, RAMP.CYAN, RAMP.GOLD, RAMP.LAVA][w];
      // Top 8px bar
      for (let y = 0; y < BORDER; y++) {
        for (let x = 0; x < PF_W; x++) {
          const edge = y === 0 || y === 7;
          const col = edge ? COL_BLACK : (y === 1 ? bRamps[12] : y === 6 ? bRamps[3] : bRamps[7]);
          borderFrame.data[y * PF_W + x] = col;
        }
      }
      // Left & Right 8px pillars
      for (let y = BORDER; y < H; y++) {
        for (const bx of [0, PF_W - BORDER]) {
          for (let dx = 0; dx < BORDER; dx++) {
            const edge = dx === 0 || dx === 7;
            const col = edge ? COL_BLACK : (dx === 1 ? bRamps[12] : dx === 6 ? bRamps[3] : bRamps[7]);
            borderFrame.data[y * PF_W + bx + dx] = col;
          }
          if (y % 16 === 0) {

            fillRect(borderFrame, bx + 2, y + 2, 4, 3, trimRamps[12]);

      }
      for (let x = 16; x < PF_W - 16; x += 24) {
        vline(borderFrame, x, 1, 6, COL_BLACK);
        fillRect(borderFrame, x + 3, 2, 4, 4, trimRamps[13]);
        pset(borderFrame, x + 3, 2, COL_WHITE);

      // Ornate corner medallions
      drawBevelBox(borderFrame, 0, 0, 9, 9, trimRamps[9], COL_WHITE, trimRamps[12], trimRamps[4]);
      drawBevelBox(borderFrame, PF_W - 9, 0, 9, 9, trimRamps[9], COL_WHITE, trimRamps[12], trimRamps[4]);

      WORLD_SURFACES.push({ planes: [p0, p1, p2, p3], borderFrame });
    }
  }
  buildAllWorldSurfaces();

  // Live Animated Foreground/Background Scenery Overlays (Waves, Lanterns, Slime, Lava, Stars, Aurora, Highway, Embers)
  function renderWorldBackdrop(dst, worldIdx, time, camNorm) {
    const ws = WORLD_SURFACES[worldIdx] || WORLD_SURFACES[0];
    const shifts = [2, 6, 11, 17];
    for (let i = 0; i < 4; i++) {
      blitParallaxPlane(dst, ws.planes[i], Math.round((camNorm + 1) * shifts[i]));
    }

    const tFrame = Math.floor(time * 12);
    if (worldIdx === 0) {
      // Flickering Scumm Bar pier lanterns + animated harbor wave reflections
      const flick = 0.72 + Math.sin(time * 9.5) * 0.12 + Math.cos(time * 17) * 0.06;
      const sx = Math.round((camNorm + 1) * 17);
      const lx1 = 62 - sx, lx2 = 279 - sx;
      paintDitherHalo(dst, lx1, 149, 18, RAMP.GOLD.slice(6, 16), flick, PF_W);
      paintDitherHalo(dst, lx2, 151, 18, RAMP.GOLD.slice(6, 16), flick, PF_W);
      for (let y = 150; y < 198; y += 3) {
        const waveShift = Math.round(Math.sin(time * 3.2 + y * 0.35) * 4);
        hline(dst, Math.max(8, lx1 - 6 + waveShift), y, 10, RAMP.GOLD[11]);
        hline(dst, Math.max(8, 186 + waveShift), y + 1, 16, RAMP.TEAL[12]);
      }
    } else if (worldIdx === 1) {
      // Bubbling toxic green sludge river bubbles
      for (let b = 0; b < 14; b++) {
        const bx = 12 + ((b * 19 + tFrame) % 230);
        const phase = (time * 2.4 + b * 0.61) % 1;
        const by = Math.round(196 - phase * 24);
        const r = phase > 0.85 ? 2 : 1;
        fillRect(dst, bx, by, r, r, phase > 0.85 ? COL_WHITE : RAMP.SLIME[14]);
      }
    } else if (worldIdx === 2) {
      // Flickering Atlantean braziers + flowing lava channels
      const sx = Math.round((camNorm + 1) * 17);
      const f = 0.75 + Math.sin(time * 11) * 0.14;
      for (const bx of [50 - sx, 246 - sx]) {
        paintDitherHalo(dst, bx, 146, 20, RAMP.LAVA.slice(5, 15), f, PF_W);
        for (let fy = 0; fy < 8; fy++) {
          const fw = Math.max(1, 5 - (fy >> 1));
          const sway = Math.round(Math.sin(time * 14 + fy) * 1.3);
          hline(dst, bx - (fw >> 1) + sway, 151 - fy, fw, RAMP.LAVA[15 - fy]);
        }
      }
      for (let x = 8; x < 248; x += 6) {
        const lx = 8 + ((x + tFrame * 2) % 236);
        hline(dst, lx, 183 + (x % 3) * 4, 4, RAMP.LAVA[14]);
      }
    } else if (worldIdx === 3) {
      // 3-Speed Starfield + Scrolling Trench Perspective Lines
      for (let i = 0; i < 48; i++) {
        const spd = 1 + (i % 3) * 2;
        const sx = 8 + ((Math.floor(hash2D(i, 9, 44) * 238) + Math.floor(time * 14 * spd)) % 238);
        const sy = 10 + Math.floor(hash2D(i, 12, 44) * 144);
        pset(dst, sx, sy, spd === 5 ? COL_WHITE : (spd === 3 ? RAMP.CYAN[12] : RAMP.SLATE[7]));
      }
      const rush = (time * 38) % 24;
      for (let k = -4; k <= 4; k++) {
        for (let y = 159; y < H; y++) {
          const t = (y - 158) / 42;
          const px = Math.round(128 + (k * 26 + rush - 12) * (0.35 + t * 1.15));
          if (px >= 8 && px < 248) pset(dst, px, y, RAMP.CYAN[8]);
        }
      }
    } else if (worldIdx === 4) {
      // Shimmering Aurora Curtains + Emerald Sea Spray
      for (let x = 10; x < 246; x += 2) {
        const ay = 22 + Math.round(Math.sin(x * 0.045 + time * 1.8) * 9 + Math.cos(x * 0.09 - time) * 4);
        const h = 10 + Math.round(Math.sin(x * 0.07 + time * 2.3) * 5);
        for (let dy = 0; dy < h; dy += 2) {
          pset(dst, x, ay + dy, dy < 4 ? RAMP.TEAL[13] : RAMP.INDIGO[11]);
        }
      }
      for (let s = 0; s < 18; s++) {
        const phase = (time * 1.9 + s * 0.37) % 1;
        const sx = 12 + ((s * 29) % 228);
        const sy = Math.round(166 - Math.sin(phase * Math.PI) * 12);
        pset(dst, sx, sy, phase < 0.5 ? COL_WHITE : RAMP.TEAL[14]);
      }
    } else if (worldIdx === 5) {
      // Animated Perspective Highway Dashes
      for (let d = 0; d < 6; d++) {
        const z = ((d / 6) + time * 0.85) % 1;
        const y0 = Math.round(139 + z * z * 58);
        const len = Math.max(2, Math.round(2 + z * 9));
        const wDash = Math.max(1, Math.round(1 + z * 3));
        fillRect(dst, 128 - (wDash >> 1), y0, wDash, Math.min(len, H - y0), RAMP.GOLD[14]);
      }
    } else {
      // Rising Hellfire Embers & Churning Lava Waves
      for (let e = 0; e < 24; e++) {
        const phase = (time * 0.55 + e * 0.19) % 1;
        const ex = 12 + Math.round((hash2D(e, 5, 77) * 228 + Math.sin(time * 3 + e) * 6)) % 228;
        const ey = Math.round(176 - phase * 150);
        pset(dst, ex, ey, e % 3 === 0 ? RAMP.ECTO[13] : RAMP.LAVA[14 - Math.floor(phase * 7)]);
      }
    }
  }

    function makeTanhCurve(amount = 1.0, samples = 2048) {
      const c = new Float32Array(samples);
      for (let i = 0; i < samples; i++) {
        const x = (i * 2) / (samples - 1) - 1;
        c[i] = Math.tanh(x * amount) / Math.tanh(amount);
      }
      return c;
    }

    function makeStaircaseCurve(steps = 14, samples = 2048) {
      const c = new Float32Array(samples);
      for (let i = 0; i < samples; i++) {
        const x = (i * 2) / (samples - 1) - 1;
        c[i] = Math.round(x * steps) / steps;
      }
      return c;
    }

    // 48-Harmonic DFT PeriodicWave Synthesizer for True OPL2 Rectified & Self-Feedback Operators
    function buildOplWavetables(ctx) {
      const N = 512;
      const HARM = 48;
      const defs = {
        'sine': (ph) => Math.sin(ph),
        'half-sine': (ph) => (ph < Math.PI ? Math.sin(ph) : 0),
        'abs-sine': (ph) => Math.abs(Math.sin(ph)),
        'quarter-pulse': (ph) => ((ph % Math.PI) < (Math.PI * 0.5) ? Math.abs(Math.sin(ph)) : 0)
      };

      function dftFromSamples(samples) {
        const real = new Float32Array(HARM + 1);
        const imag = new Float32Array(HARM + 1);
        let mean = 0;
        for (let n = 0; n < N; n++) mean += samples[n];
        mean /= N;
        for (let k = 1; k <= HARM; k++) {
          let re = 0, im = 0;
          const step = (2 * Math.PI * k) / N;
          for (let n = 0; n < N; n++) {
            const v = samples[n] - mean;
            const ang = step * n;
            re += v * Math.cos(ang);
            im += v * Math.sin(ang);
          }
          // Note: Web Audio PeriodicWave uses x(t) = sum(real[k]*cos + imag[k]*sin)
          real[k] = (2 * re) / N;
          imag[k] = (2 * im) / N;
        }
        return ctx.createPeriodicWave(real, imag, { disableNormalization: false });
      }

      const out = {};
      for (const [name, fn] of Object.entries(defs)) {
        const samp = new Float32Array(N);
        for (let n = 0; n < N; n++) samp[n] = fn((2 * Math.PI * n) / N);
        out[name] = dftFromSamples(samp);
      }

      // Iterative phase self-modulation feedback operators (fb1, fb2, fb3)
      const fbLevels = { 'fb1': 0.62, 'fb2': 1.18, 'fb3': 1.82 };
      for (const [name, fb] of Object.entries(fbLevels)) {

        // Run 4 full cycles so steady-state self-modulation settles cleanly, record final cycle
        for (let cyc = 0; cyc < 4; cyc++) {

            const phase = (2 * Math.PI * n) / N;
            const fbMod = fb * 0.5 * (prev1 + prev2);
            const y = Math.sin(phase + fbMod);
            prev2 = prev1;
            prev1 = y;
            if (cyc === 3) samp[n] = y;
          }
        }
        out[name] = dftFromSamples(samp);
      }
      return out;

      softClipper.curve = makeTanhCurve(1.35);
      softClipper.oversample = '2x';

      compressor = actx.createDynamicsCompressor();
      compressor.threshold.value = -14;
      compressor.knee.value = 12;
      compressor.ratio.value = 4.0;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.14;

      compressor.connect(softClipper);
      softClipper.connect(masterGain);
      masterGain.connect(actx.destination);

      musicBus = actx.createGain();
      musicBus.gain.value = 0.88;
      musicBus.connect(compressor);

      worldCrossGain = actx.createGain();
      worldCrossGain.gain.value = 1.0;
      worldCrossGain.connect(musicBus);

      overdriveStemGain = actx.createGain();
      overdriveStemGain.gain.value = 0.0;
      overdriveStemGain.connect(worldCrossGain);

      sfxBus = actx.createGain();
      sfxBus.gain.value = 0.92;
      sfxBus.connect(compressor);

      // Tempo-synced 3/16th Stereo Echo with 2.4 kHz low-pass feedback damping
      echoDelayL = actx.createDelay(1.5);
      echoDelayR = actx.createDelay(1.5);
      echoDelayL.delayTime.value = 0.34;
      echoDelayR.delayTime.value = 0.346;
      echoDamp = actx.createBiquadFilter();
      echoDamp.type = 'lowpass';
      echoDamp.frequency.value = 2400;
      echoFb = actx.createGain();
      echoFb.gain.value = 0.30;

      const echoPanL = actx.createStereoPanner(); echoPanL.pan.value = -0.65;
      const echoPanR = actx.createStereoPanner(); echoPanR.pan.value = 0.65;
      const echoWet = actx.createGain(); echoWet.gain.value = 0.32;

      echoDelayL.connect(echoPanL);
      echoDelayL.connect(echoDamp);
      echoDamp.connect(echoDelayR);
      echoDelayR.connect(echoPanR);
      echoDelayR.connect(echoFb);
      echoFb.connect(echoDelayL);
      echoPanL.connect(echoWet);
      echoPanR.connect(echoWet);
      echoWet.connect(worldCrossGain);

      // Channel mixer strips
      strips.leadA   = createStrip(-0.18, false, worldCrossGain);
      strips.leadB   = createStrip(0.24,  false, worldCrossGain);
      strips.harmony = createStrip(-0.26, false, worldCrossGain);
      strips.bass    = createStrip(0.0,   false, worldCrossGain);
      strips.guitarL = createStrip(-0.28, true,  worldCrossGain);
      strips.guitarR = createStrip(0.28,  true,  worldCrossGain);
      strips.overdrv = createStrip(0.32,  false, overdriveStemGain);
      strips.overGtr = createStrip(0.34,  true,  overdriveStemGain);
      strips.drums   = createStrip(0.0,   false, worldCrossGain);
      strips.drums.echoSend.gain.value = 0.06;
      strips.bass.echoSend.gain.value = 0.02;

      // 4-Channel Priority Voice-Stealing Staircase Bit-Crusher FX Bank
      bitCrusherCurve = makeStaircaseCurve(12);
      for (let i = 0; i < 4; i++) {
        const crush = actx.createWaveShaper();
        crush.curve = bitCrusherCurve;
        const vGain = actx.createGain();
        vGain.gain.value = 0;
        const pan = actx.createStereoPanner();
        pan.pan.value = (i - 1.5) * 0.22;
        crush.connect(vGain);
        vGain.connect(pan);
        pan.connect(sfxBus);
        fxVoices.push({ id: i, crush, vGain, osc: null, priority: 0, endTime: 0, startTime: 0 });
      }
    }

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    // Sidechain ducking: musicBus dips 35% for 150ms on Grog explosions, Loom spells & 1-UP fanfares
    function duckMusic() {
      if (!actx || !musicBus) return;
      const now = actx.currentTime;
      musicBus.gain.cancelScheduledValues(now);
      musicBus.gain.setValueAtTime(musicBus.gain.value, now);
      musicBus.gain.linearRampToValueAtTime(0.88 * 0.65, now + 0.016);
      musicBus.gain.linearRampToValueAtTime(0.88, now + 0.166);
    }

    // Expressive 2-Operator OPL2 FM Voice Trigger (Supports Polyphonic Chord Arrays via caller)
    function triggerFMVoice(patchName, strip, midi, t0, dur, vel = 0.85, bendOverride = null) {
      if (!actx || muted) return;
      const patch = OPL_PATCHES[patchName] || OPL_PATCHES.steelpan;
      strip.echoSend.gain.setValueAtTime(patch.echoSend ?? 0.2, t0);

      const freq = midiToFreq(midi);
      const startMidi = (bendOverride !== null)
        ? midi + bendOverride
        : (patch.glide && strip.lastMidi !== null ? strip.lastMidi : (patch.scoopSemi ? midi + patch.scoopSemi : midi));
      const startFreq = midiToFreq(startMidi);
      const glideTime = (startMidi !== midi) ? Math.min(dur * 0.65, patch.glide || 0.045) : 0;
      strip.lastMidi = midi;

      // Key-Scale Level (ksl) attenuates FM index on high pitches so leads stay sweet
      const kslFactor = Math.pow(2, -(patch.ksl || 0.45) * Math.max(0, (midi - 58) / 12));
      const peakModHz = Math.max(1, freq * patch.modRatio * patch.modIndex * kslFactor);

      const modOsc = actx.createOscillator();
      modOsc.setPeriodicWave(waves[patch.modWave] || waves.sine);
      const modGain = actx.createGain();

      // 4-Stage Modulator Index ADSR
      const mA = patch.modADSR.a, mD = patch.modADSR.d, mS = Math.max(0.01, patch.modADSR.s), mR = patch.modADSR.r;
      modGain.gain.setValueAtTime(0.01, t0);
      modGain.gain.linearRampToValueAtTime(peakModHz, t0 + mA);
      modGain.gain.exponentialRampToValueAtTime(Math.max(0.5, peakModHz * mS), t0 + mA + mD);
      const relStart = Math.max(t0 + mA + 0.005, t0 + dur);
      modGain.gain.setValueAtTime(Math.max(0.5, peakModHz * mS), relStart);
      modGain.gain.exponentialRampToValueAtTime(0.01, relStart + mR);

      modOsc.frequency.setValueAtTime(startFreq * patch.modRatio, t0);
      if (glideTime > 0) {
        modOsc.frequency.exponentialRampToValueAtTime(freq * patch.modRatio, t0 + glideTime);
      }
      modOsc.connect(modGain);

      // 4-Stage Carrier Amplitude ADSR
      const carEnv = actx.createGain();
      const cA = patch.carADSR.a, cD = patch.carADSR.d, cS = Math.max(0.002, patch.carADSR.s), cR = patch.carADSR.r;
      const peakAmp = (patch.gain || 0.2) * vel * (patch.unisonCents ? 0.62 : 1.0);
      carEnv.gain.setValueAtTime(0.0001, t0);
      carEnv.gain.linearRampToValueAtTime(peakAmp, t0 + cA);
      carEnv.gain.exponentialRampToValueAtTime(Math.max(0.0002, peakAmp * cS), t0 + cA + cD);
      const cRelStart = Math.max(t0 + cA + 0.005, t0 + dur);
      carEnv.gain.setValueAtTime(Math.max(0.0002, peakAmp * cS), cRelStart);
      carEnv.gain.exponentialRampToValueAtTime(0.0001, cRelStart + cR);
      carEnv.connect(strip.input);

      const stopAt = cRelStart + cR + 0.03;
      const detunes = patch.unisonCents ? [-patch.unisonCents, patch.unisonCents] : [0];
      const carriers = [];

      for (const det of detunes) {
        const car = actx.createOscillator();
        car.setPeriodicWave(waves[patch.carWave] || waves.sine);
        car.detune.setValueAtTime(det, t0);
        car.frequency.setValueAtTime(startFreq * patch.carRatio, t0);
        if (glideTime > 0) {
          car.frequency.exponentialRampToValueAtTime(freq * patch.carRatio, t0 + glideTime);
        }
        modGain.connect(car.frequency);
        car.connect(carEnv);
        car.start(t0);
        car.stop(stopAt);
        carriers.push(car);
      }

      // Delayed Vibrato LFO (ramps in after 0.16..0.25s so short staccato notes stay tight!)
      let vibOsc = null, vibGain = null;
      if (patch.vibDepthCents > 0 && dur > (patch.vibDelay || 0.18)) {
        vibOsc = actx.createOscillator();
        vibOsc.type = 'sine';
        vibOsc.frequency.setValueAtTime(patch.vibRate || 5.5, t0);
        vibGain = actx.createGain();
        const vibHz = freq * (Math.pow(2, patch.vibDepthCents / 1200) - 1);
        const vd = patch.vibDelay || 0.18;
        vibGain.gain.setValueAtTime(0, t0);
        vibGain.gain.setValueAtTime(0, t0 + vd);
        vibGain.gain.linearRampToValueAtTime(vibHz, Math.min(stopAt - 0.01, t0 + vd + 0.11));
        vibOsc.connect(vibGain);
        for (const car of carriers) vibGain.connect(car.frequency);
        vibOsc.start(t0);
        vibOsc.stop(stopAt);
      }

      modOsc.start(t0);
      modOsc.stop(stopAt);
      carriers[0].onended = () => {
        modOsc.disconnect();
        modGain.disconnect();
        carEnv.disconnect();
        if (vibOsc) { vibOsc.disconnect(); vibGain.disconnect(); }
      };
    }

    // Trigger single note OR 3-to-4-note Polyphonic Chord Array!
    function triggerPatchEvent(patchName, strip, midiOrChord, t0, dur, vel = 0.82, bend = null) {
      if (Array.isArray(midiOrChord)) {
        const chordScale = 1 / Math.sqrt(midiOrChord.length);
        for (let i = 0; i < midiOrChord.length; i++) {
          triggerFMVoice(patchName, strip, midiOrChord[i], t0, dur, vel * chordScale, bend);
        }
      } else {
        triggerFMVoice(patchName, strip, midiOrChord, t0, dur, vel, bend);
      }
    }

    // Resonant Fast-Decaying Low-Pass Filter Bass Synth (Triangle + Optional Sub/Edge Harmonic)
    function triggerBass(midi, t0, dur, vel = 0.9, style = 'synth') {
      if (!actx || muted) return;
      const freq = midiToFreq(midi);
      const osc = actx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t0);

      const edgeOsc = actx.createOscillator();
      edgeOsc.setPeriodicWave(style === 'upright' ? waves.sine : waves.fb1);
      edgeOsc.frequency.setValueAtTime(style === 'reggae' ? freq * 0.5 : freq, t0);
      const edgeGain = actx.createGain();
      edgeGain.gain.value = style === 'metal' ? 0.48 : (style === 'reggae' ? 0.55 : 0.28);

      const filt = actx.createBiquadFilter();
      filt.type = 'lowpass';
      filt.Q.value = style === 'synth' ? 5.8 : (style === 'upright' ? 2.2 : 3.6);
      const peakCut = Math.min(2800, freq * (style === 'upright' ? 4.5 : 8.5));
      filt.frequency.setValueAtTime(peakCut, t0);
      filt.frequency.exponentialRampToValueAtTime(Math.max(65, freq * 1.65), t0 + (style === 'upright' ? 0.14 : 0.10));

      const env = actx.createGain();
      const peak = 0.30 * vel;
      env.gain.setValueAtTime(0.0001, t0);
      env.gain.linearRampToValueAtTime(peak, t0 + 0.005);
      env.gain.exponentialRampToValueAtTime(Math.max(0.001, peak * 0.42), t0 + Math.min(dur, 0.16));
      env.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.06);

      osc.connect(filt);
      edgeOsc.connect(edgeGain);
      edgeGain.connect(filt);
      filt.connect(env);
      env.connect(strips.bass.input);

      const stopAt = t0 + dur + 0.08;
      osc.start(t0); edgeOsc.start(t0);
      osc.stop(stopAt); edgeOsc.stop(stopAt);
      osc.onended = () => { osc.disconnect(); edgeOsc.disconnect(); edgeGain.disconnect(); filt.disconnect(); env.disconnect(); };
    }

    // 10-Piece Synthesized Percussion Kit (K, S, R, P, H, O, k, Y, W, T/M/L, C)
    function triggerDrum(code, t0, vel = 0.85) {
      if (!actx || muted || !noiseBuffer) return;
      const out = strips.drums.input;

      const noiseBurst = (start, dur, filterType, freq, q, gainVal) => {
        const src = actx.createBufferSource();
        src.buffer = noiseBuffer;
        src.loop = true;
        const f = actx.createBiquadFilter();
        f.type = filterType;
        f.frequency.setValueAtTime(freq, start);
        f.Q.value = q;
        const g = actx.createGain();
        g.gain.setValueAtTime(0.0001, start);
        g.gain.linearRampToValueAtTime(gainVal * vel, start + 0.002);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        src.connect(f); f.connect(g); g.connect(out);
        src.start(start, Math.random() * 1.2);
        src.stop(start + dur + 0.01);
      };

      if (code === 'K') {
        // 1. Pitch-swept Kick + Click Transient
        const osc = actx.createOscillator();
        const g = actx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(158, t0);
        osc.frequency.exponentialRampToValueAtTime(42, t0 + 0.075);
        g.gain.setValueAtTime(0.42 * vel, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
        osc.connect(g); g.connect(out);
        osc.start(t0); osc.stop(t0 + 0.15);
        noiseBurst(t0, 0.012, 'bandpass', 1350, 2.0, 0.16);
      } else if (code === 'S') {
        // 2. Body + Bandpass-Noise Snare
        const osc = actx.createOscillator();
        const g = actx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(195, t0);
        osc.frequency.exponentialRampToValueAtTime(112, t0 + 0.06);
        g.gain.setValueAtTime(0.24 * vel, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.085);
        osc.connect(g); g.connect(out);
        osc.start(t0); osc.stop(t0 + 0.095);
        noiseBurst(t0, 0.135, 'bandpass', 1850, 1.1, 0.26);
      } else if (code === 'R') {
        // 3. Woody Reggae Rimshot
        const osc = actx.createOscillator();
        const g = actx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, t0);
        osc.frequency.exponentialRampToValueAtTime(290, t0 + 0.025);
        g.gain.setValueAtTime(0.22 * vel, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.035);
        osc.connect(g); g.connect(out);
        osc.start(t0); osc.stop(t0 + 0.04);
        noiseBurst(t0, 0.032, 'bandpass', 1700, 5.5, 0.24);
      } else if (code === 'P') {
        // 4. 3-Burst Clap
        noiseBurst(t0, 0.018, 'bandpass', 1250, 2.2, 0.18);
        noiseBurst(t0 + 0.011, 0.018, 'bandpass', 1250, 2.2, 0.18);
        noiseBurst(t0 + 0.022, 0.115, 'bandpass', 1250, 1.8, 0.22);
      } else if (code === 'H') {
        // 5. Closed Hi-Hat
        noiseBurst(t0, 0.042, 'highpass', 7600, 0.8, 0.15);
      } else if (code === 'O') {
        // 6. Open Hi-Hat
        noiseBurst(t0, 0.20, 'highpass', 6800, 0.9, 0.17);
      } else if (code === 'k') {
        // 7. Island Shaker
        noiseBurst(t0, 0.055, 'bandpass', 5800, 2.6, 0.13);
      } else if (code === 'Y') {
        // 8. Inharmonic FM Ride Cymbal
        const m = actx.createOscillator(), c = actx.createOscillator(), mg = actx.createGain(), cg = actx.createGain();
        m.setPeriodicWave(waves['abs-sine']); c.setPeriodicWave(waves['abs-sine']);
        m.frequency.value = 847; c.frequency.value = 587;
        mg.gain.setValueAtTime(900, t0); mg.gain.exponentialRampToValueAtTime(40, t0 + 0.26);
        cg.gain.setValueAtTime(0.11 * vel, t0); cg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.30);
        m.connect(mg); mg.connect(c.frequency); c.connect(cg); cg.connect(out);
        m.start(t0); c.start(t0); m.stop(t0 + 0.32); c.stop(t0 + 0.32);
        noiseBurst(t0, 0.18, 'highpass', 8200, 0.7, 0.09);
      } else if (code === 'W') {
        // 9. FM Cowbell
        for (const f of [540, 800]) {
          const o = actx.createOscillator(), g = actx.createGain();
          o.setPeriodicWave(waves['quarter-pulse']);
          o.frequency.value = f;
          g.gain.setValueAtTime(0.10 * vel, t0);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.11);
          o.connect(g); g.connect(out);
          o.start(t0); o.stop(t0 + 0.12);
        }
      } else if (code === 'T' || code === 'M' || code === 'L') {
        // 10. Pitched High / Mid / Low Turnaround Toms
        const hi = code === 'T' ? 225 : code === 'M' ? 168 : 122;
        const lo = code === 'T' ? 112 : code === 'M' ? 82  : 58;
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(hi, t0);
        o.frequency.exponentialRampToValueAtTime(lo, t0 + 0.13);
        g.gain.setValueAtTime(0.30 * vel, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
        o.connect(g); g.connect(out);
        o.start(t0); o.stop(t0 + 0.17);
      } else if (code === 'C') {
        // Crash Cymbal Accent
        noiseBurst(t0, 0.48, 'highpass', 5200, 0.7, 0.24);
      }
    }

    // 4-Channel Priority Voice-Stealing Staircase Bit-Crusher FX Allocator
    function allocFxVoice(priority, now) {
      let best = null;
      for (const v of fxVoices) {
        if (now >= v.endTime) { best = v; break; }
      }
      if (!best) {
        // Steal lowest-priority (or oldest equal/lower-priority) active voice
        let cand = fxVoices[0];
        for (const v of fxVoices) {
          if (v.priority < cand.priority || (v.priority === cand.priority && v.startTime < cand.startTime)) {
            cand = v;
          }
        }
        if (cand.priority > priority) return null;
        best = cand;
        if (best.osc) {
          try { best.osc.stop(now + 0.004); } catch (_) {}
          best.osc = null;
        }
      }
      best.priority = priority;
      best.startTime = now;
      return best;
    }

    function playCrushedTone(freqStart, freqEnd, dur, priority = 2, waveName = 'quarter-pulse', gainPeak = 0.20, delaySec = 0) {
      if (!actx || muted) return;
      const now = actx.currentTime + delaySec;
      const voice = allocFxVoice(priority, now);
      if (!voice) return;

      const osc = actx.createOscillator();
      osc.setPeriodicWave(waves[waveName] || waves['abs-sine']);
      osc.frequency.setValueAtTime(Math.max(40, freqStart), now);
      if (freqEnd && freqEnd !== freqStart) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(40, freqEnd), now + dur);
      }

      voice.vGain.gain.cancelScheduledValues(now);
      voice.vGain.gain.setValueAtTime(0.0001, now);
      voice.vGain.gain.linearRampToValueAtTime(gainPeak, now + 0.003);
      voice.vGain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

      osc.connect(voice.crush);
      osc.start(now);
      osc.stop(now + dur + 0.01);
      voice.osc = osc;
      voice.endTime = now + dur;
      osc.onended = () => { osc.disconnect(); if (voice.osc === osc) voice.osc = null; };
    }

    // =======================================================================
    // 8. 7 MULTI-SECTION (24-BAR / 384-STEP) iMUSE WORLD COMPOSITIONS
    // =======================================================================
    // Compact helper builders for rich 64-step (4-bar) musical sections
    function skankBar(barIdx, chordA, chordB) {
      const b = barIdx * 16;
      return [
        [b + 2, chordA, 1.5, 0.78], [b + 6, chordA, 1.5, 0.72],
        [b + 10, chordB, 1.5, 0.78], [b + 14, chordB, 1.5, 0.74]
      ];
    }

    function walkBass4(chordsRoots, passingOffset = 7) {
      const ev = [];
      for (let bar = 0; bar < 4; bar++) {
        const r = chordsRoots[bar];
        const b = bar * 16;
        ev.push([b, r, 3.5, 0.92], [b + 4, r + 4, 3.5, 0.82], [b + 8, r + passingOffset, 3.5, 0.86], [b + 12, r + 5, 3.5, 0.80]);
      }
      return ev;
    }

    function drumGroove4(barPattern, turnaroundFill) {
      const ev = [];
      for (let bar = 0; bar < 4; bar++) {
        const src = (bar === 3 && turnaroundFill) ? turnaroundFill : barPattern;
        const b = bar * 16;
        for (const [st, codes, vel] of src) {
          for (let i = 0; i < codes.length; i++) ev.push([b + st, codes[i], vel || 0.82]);
        }
      }
      return ev;
    }

    function arp16FromChords(chords4, oct = 12) {
      const ev = [];
      for (let bar = 0; bar < 4; bar++) {
        const ch = chords4[bar];
        const b = bar * 16;
        for (let s = 0; s < 16; s++) {
          const note = ch[s % ch.length] + (s % 4 === 3 ? oct : 0);
          ev.push([b + s, note, 0.9, s % 4 === 0 ? 0.80 : 0.62]);
        }
      }
      return ev;
    }

    const SONGS = [
      // ---------------------------------------------------------------------
      // 0: THE MONKEY ISLAND THEME (Levels 1-6) — Syncopated Reggae (24 Bars)
      // ---------------------------------------------------------------------
      (() => {
        const regDrum = [
          [0,'K',0.9],[0,'H',0.6],[2,'k',0.65],[4,'R',0.85],[4,'H',0.65],[6,'O',0.7],
          [8,'K',0.88],[8,'H',0.6],[10,'k',0.65],[12,'R',0.9],[12,'K',0.8],[14,'k',0.72]
        ];
        const regFill = [
          [0,'K',0.9],[2,'k',0.65],[4,'R',0.85],[6,'O',0.75],[8,'S',0.88],[10,'T',0.88],

        ];
        const harmA = [...skankBar(0,[62,65,69],[62,65,69]), ...skankBar(1,[60,64,69],[60,64,69]), ...skankBar(2,[58,62,65],[60,64,67]), ...skankBar(3,[62,65,69],[57,61,64])];
        const harmB = [...skankBar(0,[65,69,72],[65,69,72]), ...skankBar(1,[60,64,67],[60,64,67]), ...skankBar(2,[58,62,65],[58,62,67]), ...skankBar(3,[57,61,64],[57,61,67])];
        const bassA = [
          [0,38,3,0.92],[3,38,1.5,0.78],[6,41,2,0.85],[8,45,3.5,0.9],[12,43,3,0.82],
          [16,36,3,0.92],[19,36,1.5,0.78],[22,40,2,0.85],[24,45,3.5,0.9],[28,43,3,0.82],
          [32,34,3,0.92],[36,38,3,0.85],[40,36,3,0.9],[44,40,3,0.84],

        }

          if (ev[0] === localStep) {

      if (!actx || muted) return;
      const song = getActiveSong();
      const preset = getActivePreset();
      const scale = song.scale;
      const deg = comboIdx % (scale.length * 2);
      const oct = Math.floor(deg / scale.length);
      const semi = scale[deg % scale.length] + oct * 12 + (preset.transpose || 0);
      const baseMidi = song.root + semi;
      const f = midiToFreq(baseMidi);

      if (isArmor) {
        playCrushedTone(f * 0.5, f * 0.75, 0.075, 3, 'fb2', 0.22);
      } else {
        playCrushedTone(f, f * 1.01, 0.095, 2, 'abs-sine', 0.20);
        if (comboIdx >= 4) {
          // Harmonizing scale 5th shimmer on hot combos!
          const fifthDeg = (deg + 4) % (scale.length * 2);
          const f2 = midiToFreq(song.root + scale[fifthDeg % scale.length] + Math.floor(fifthDeg / scale.length) * 12 + (preset.transpose || 0));
          playCrushedTone(f2, f2, 0.085, 2, 'half-sine', 0.13, 0.025);
        }
      }
    }

    function sfxSteel() {
      playCrushedTone(1180, 620, 0.055, 1, 'fb3', 0.16);
    }

    function sfxPaddle(isCatch = false) {
      const song = getActiveSong();
      const rootF = midiToFreq(song.root - 12 + (getActivePreset().transpose || 0));
      playCrushedTone(rootF, isCatch ? rootF * 1.5 : rootF * 1.25, 0.065, 1, 'half-sine', 0.19);
    }

    function sfxWall() {
      playCrushedTone(210, 165, 0.04, 1, 'sine', 0.13);
    }

    function sfxLaser() {
      playCrushedTone(1320, 280, 0.085, 3, 'fb2', 0.18);
    }

    function sfxGrogExplosion() {
      if (!actx || muted) return;
      duckMusic();
      playCrushedTone(190, 44, 0.26, 4, 'fb3', 0.30);
      triggerDrum('L', actx.currentTime, 0.98);
      triggerDrum('C', actx.currentTime, 0.72);
    }

    function sfxPowerup(type) {
      if (!actx || muted) return;
      const song = getActiveSong();
      const tr = getActivePreset().transpose || 0;
      if (type === 'P') duckMusic();
      const degrees = type === 'P' ? [0, 2, 4, 7, 9] : [0, 2, 4, 6];
      degrees.forEach((d, idx) => {
        const oct = Math.floor(d / song.scale.length) * 12;
        const m = song.root + song.scale[d % song.scale.length] + oct + tr;
        playCrushedTone(midiToFreq(m), midiToFreq(m), 0.11, 4, 'abs-sine', 0.20, idx * 0.055);
      });
    }

    function sfxLoomSpell(notesMidi) {
      if (!actx || muted) return;
      duckMusic();
      notesMidi.forEach((m, i) => {
        playCrushedTone(midiToFreq(m), midiToFreq(m) * 1.005, 0.18, 4, 'half-sine', 0.22, i * 0.07);
      });
    }

    function sfxBallLost() {
      playCrushedTone(360, 110, 0.24, 4, 'fb2', 0.22, 0);
      playCrushedTone(240, 72,  0.30, 4, 'fb2', 0.22, 0.14);
    }

    function decayVu(dt) {
      for (let i = 0; i < vuLevels.length; i++) {
        vuLevels[i] = Math.max(0, vuLevels[i] - dt * 2.8);
      }
    }

    function getStatusText() {
      const song = getActiveSong();
      const preset = getActivePreset();
      const od = activeOverdrive ? '+OVERDRIVE!' : '+BASE';
      return `iMUSE: ${song.title} [${preset.name}] STEMS: LEAD+CHORD+BASS+DRUM${od}   `;
    }

    return {
      init, startMusic, toggleMute, isMuted: () => muted,
      setWorldAndPreset, setOverdrive,
      sfxBrickCombo, sfxSteel, sfxPaddle, sfxWall, sfxLaser,
      sfxGrogExplosion, sfxPowerup, sfxLoomSpell, sfxBallLost,
      vuLevels, decayVu, getStatusText,
      getCurrentWorld: () => currentWorld,
      getSongRoot: () => getActiveSong().root + (getActivePreset().transpose || 0),
      getSongScale: () => getActiveSong().scale
    };
  })();


  // =========================================================================
  // 10. GAME STATE, WORLD MECHANICS, SUB-STEPPED PHYSICS & ARCADE JUICE
  // =========================================================================
  const STORAGE_KEY = 'arkanoid_v5_vga_imuse_hiscore';
  function loadHiScore() {
    try {
      const v = parseInt(localStorage.getItem(STORAGE_KEY) || '25000', 10);
      return Number.isFinite(v) && v > 0 ? v : 25000;
    } catch (_) {
      return 25000;
    }
  }
  function saveHiScore(val) {
    try { localStorage.setItem(STORAGE_KEY, String(val | 0)); } catch (_) {}
  }

  const LOOM_NOTE_NAMES = ['C', 'D', 'E', 'F', 'G', 'A'];
  const LOOM_NOTE_OFFSETS = [0, 2, 3, 5, 7, 9];

  const game = {
    mode: 'MENU',        // 'MENU' | 'PLAYING' | 'STAGE_CLEAR' | 'GAME_OVER' | 'VICTORY'
    paused: false,
    crtEnabled: true,
    stageIdx: 0,         // 0..32 (Levels 1..33)
    score: 0,
    hiScore: loadHiScore(),
    lives: 3,
    nextExtraLifeScore: 20000,
    time: 0,
    stageClearTimer: 0,
    menuCamPhase: 0,

    // Paddle state
    paddle: {
      x: 128,

      w: 34,
      h: 7,

      expandTimer: 0,
      catchTimer: 0,
      slowTimer: 0,
      goldFlashTimer: 0,
      fireCooldown: 0,
      curseTimer: 0,
      recoil: 0
    },

    // Active entities
    bricks: [],

    vortices: [],    // World 4 orbital gravity wells
    rings: [],       // Radial pixel explosion shockwave rings
    particles: [],   // VGA ramp pixel sparks

    formationRange: 0,

    // World mechanic state
    mech: {

      eraTimer: 7.5,

    // Level 33 Ghost Pirate LeChuck Boss
    boss: {
