  };

  function addScore(pts, fxX = null, fxY = null, label = null) {
    game.score += pts;
    if (game.score > game.hiScore) {
      game.hiScore = game.score;
      saveHiScore(game.hiScore);
    }
    if (game.score >= game.nextExtraLifeScore) {
      game.nextExtraLifeScore += 30000;
      game.lives = Math.min(7, game.lives + 1);
      AudioEngine.sfxPowerup('P');
      sayQuip('1-UP! EXTRA PIRATE LIFE!', RAMP.GOLD[15], RAMP.LAVA[13], 'cheer', 2.4);
    }
    if (fxX !== null && fxY !== null) {
      game.floats.push({
        x: fxX, y: fxY,
        text: label || `+${pts}`,
        topCol: pts >= 500 ? RAMP.GOLD[15] : COL_WHITE,
        botCol: pts >= 500 ? RAMP.LAVA[12] : RAMP.CYAN[12],
        life: 0.75
      });
    }
  }

  function sayQuip(text, topCol = COL_WHITE, botCol = RAMP.GOLD[13], mood = 'normal', dur = 2.6) {
    game.portrait.quipText = text;
    game.portrait.quipColorTop = topCol;
    game.portrait.quipColorBot = botCol;
    game.portrait.quipTimer = dur;
    if (mood !== 'normal') {
      game.portrait.mood = mood;
      game.portrait.moodTimer = dur;
    }
  }

  function sayRandomWorldQuip(kind) {
    const w = LEVELS[game.stageIdx].world;
    const bank = QUIPS[w]?.[kind] || QUIPS[0].start;
    const line = bank[Math.floor(Math.random() * bank.length)];
    const cols = kind === 'hurt'
      ? [RAMP.RUBY[14], RAMP.LAVA[11], 'wince']
      : (kind === 'combo' ? [RAMP.GOLD[15], RAMP.SLIME[13], 'cheer'] : [COL_WHITE, RAMP.CYAN[13], 'normal']);
    sayQuip(line, cols[0], cols[1], cols[2], 2.5);
  }

  function triggerShake(mag = 2, dur = 0.16) {
    game.shakeMag = Math.max(game.shakeMag, mag);
    game.shakeTimer = Math.max(game.shakeTimer, dur);
  }

  function spawnParticles(x, y, ramp, count = 10, speed = 75) {
    for (let i = 0; i < count; i++) {
      const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
      const spd = speed * (0.35 + Math.random() * 0.85);
      game.particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 12,
        ramp,
        life: 0.32 + Math.random() * 0.28,
        maxLife: 0.60
      });
    }
  }

  function spawnShockwaveRing(x, y, ramp, maxR = 24) {
    game.rings.push({ x, y, r: 2, maxR, ramp, life: 0.28, maxLife: 0.28 });
  }

  function syncPaddleDimensions() {
    const p = game.paddle;
    p.w = p.expandTimer > 0 ? 50 : (p.laserTimer > 0 || p.catchTimer > 0 ? 36 : 34);
    p.x = Math.max(PLAY_L + p.w * 0.5, Math.min(PLAY_R - p.w * 0.5, p.x));
  }

  function createServedBall(offsetX = 0) {
    return {
      x: game.paddle.x + offsetX,
      y: game.paddle.y - 3,
      vx: 62,
      vy: -112,
      speed: 128,
      stuck: true,
      stuckOffset: offsetX,
      combo: 0,
      wallBounces: 0,
      trail: []
    };
  }

  function loadStage(idx, announce = true) {
    game.stageIdx = ((idx % LEVELS.length) + LEVELS.length) % LEVELS.length;
    const lvl = LEVELS[game.stageIdx];
    const world = lvl.world;

    game.bricks = [];
    game.capsules = [];
    game.lasers = [];
    game.hazards = [];
    game.swanBolts = [];
    game.vortices = [];
    game.rings = [];
    game.particles = [];
    game.floats = [];
    game.grogQueue = [];
    game.formationX = 0;

    const baseGridY = world === 6 ? 56 : 20;
    let breakable = 0;
    let minCol = 30, maxCol = -1;
    let noteCounter = 0;

    for (let r = 0; r < lvl.grid.length; r++) {
      const rowStr = lvl.grid[r].padEnd(BRICK_COLS, '.').slice(0, BRICK_COLS);
      for (let c = 0; c < BRICK_COLS; c++) {
        const ch = rowStr[c];
        if (ch === '.' || ch === ' ') continue;
        const isSteel = ch === '#';
        const isGrog = ch === 'X';
        const hp = ch === '3' ? 3 : (ch === '2' ? 2 : (isSteel ? 999 : 1));
        if (!isSteel) breakable++;
        minCol = Math.min(minCol, c);
        maxCol = Math.max(maxCol, c);

        // World 2 (world === 1): Chron-o-John Era-Phasing assignment
        let era = 0;
        if (world === 1 && !isSteel && !isGrog && ch !== '2' && ch !== '3') {
          if (c < 11) era = 1;
          else if (c > 18) era = 2;
        }

        // World 5 (world === 4): Loom Musical Weaver Crystal assignment
        let loomNoteIdx = -1;
        if (world === 4 && !isSteel && !isGrog) {
          noteCounter++;
          if (noteCounter % 5 === 0) loomNoteIdx = (noteCounter / 5 | 0) % LOOM_NOTE_NAMES.length;
        }

        game.bricks.push({
          col: c,
          row: r,
          baseX: PLAY_L + c * BRICK_W,
          x: PLAY_L + c * BRICK_W,
          y: baseGridY + r * BRICK_H,
          w: BRICK_W,
          h: BRICK_H,
          code: BRICK_THEMES[ch] ? ch : 'w',
          hp,
          maxHp: hp,
          steel: isSteel,
          grog: isGrog,
          era,
          loomNoteIdx,
          flash: 0,
          steelAnim: 0,
          alive: true
        });
      }
    }

    game.initialBreakable = Math.max(1, breakable);
    game.remainingBreakable = breakable;

    // World 6 (world === 5): Sam & Max Highway Patrolling Formation Range
    if (world === 5 && maxCol >= minCol) {
      const leftMargin = minCol * BRICK_W;
      const rightMargin = (BRICK_COLS - 1 - maxCol) * BRICK_W;
      game.formationRange = Math.max(4, Math.min(leftMargin, rightMargin) - 2);
    } else {
      game.formationRange = 0;
    }

    // World 4 (world === 3): Orbital Gravity Wells
    if (world === 3) {
      if (game.stageIdx >= 21) {
        game.vortices.push({ x: 76, y: 140, strength: 1350 }, { x: 180, y: 140, strength: 1350 });
      } else {
        game.vortices.push({ x: 128, y: 142, strength: 1550 });
      }
    }

    // World 7 (world === 6): Ghost Pirate LeChuck Boss
    if (world === 6) {
      game.boss.active = true;
      game.boss.x = 128;
      game.boss.y = 18;
      game.boss.vx = 46;
      game.boss.hp = 24;
      game.boss.maxHp = 24;
      game.boss.flashTimer = 0;
      game.boss.castTimer = 2.4;
      game.boss.teleportTimer = 6.2;
      game.boss.summonTimer = 8.5;
    } else {
      game.boss.active = false;
    }

    // Reset stage mechanics & ball onto paddle
    game.mech.duelTimer = 7.5;
    game.mech.duelOverdriveTimer = 0;
    game.mech.eraPhase = 1;
    game.mech.eraTimer = 7.5;
    game.mech.idolTimer = 3.6;
    game.mech.idolOpenTimer = 0;
    game.mech.pierceTimer = 0;
    game.mech.coneTimer = 5.0;

    game.paddle.curseTimer = 0;
    game.paddle.x = 128;
    syncPaddleDimensions();
    game.balls = [createServedBall(0)];

    AudioEngine.setWorldAndPreset(world, lvl.preset);
    AudioEngine.setOverdrive(false);

    if (announce) {
      sayRandomWorldQuip('start');
    }
  }

  function startNewGame(startStageIdx = 0) {
    AudioEngine.startMusic();
    game.score = 0;
    game.lives = 3;
    game.nextExtraLifeScore = 20000;
    game.paddle.laserTimer = 0;
    game.paddle.expandTimer = 0;
    game.paddle.catchTimer = 0;
    game.paddle.slowTimer = 0;
    game.paddle.goldFlashTimer = 0;
    game.mech.duelCharge = 0;
    game.mech.loomNotes = [];
    game.mode = 'PLAYING';
    game.paused = false;
    loadStage(startStageIdx, true);
  }

  function maybeDropCapsule(x, y) {
    if (game.capsules.length >= 3) return;
    if (Math.random() > 0.17) return;
    const bag = ['L', 'E', 'C', 'S', 'L', 'E', 'C', 'S', 'P'];
    const type = bag[Math.floor(Math.random() * bag.length)];
    game.capsules.push({ x, y, vy: 46, type });
  }

  function applyCapsule(type) {
    const p = game.paddle;
    AudioEngine.sfxPowerup(type);
    addScore(500, p.x, p.y - 10, `${type} +500`);

    if (type === 'L') {
      p.laserTimer = 18.0;
      sayQuip('TWIN PLASMA BLASTERS ARMED!', RAMP.RUBY[14], RAMP.GOLD[13], 'cheer', 2.0);
    } else if (type === 'E') {
      p.expandTimer = 20.0;
      sayQuip('RUBBER CHICKEN W/ PULLEY!', RAMP.GOLD[15], RAMP.GOLD[11], 'cheer', 2.2);
    } else if (type === 'C') {
      p.catchTimer = 20.0;
      sayQuip('VOODOO COMPASS MAGNETIZED!', RAMP.ECTO[14], RAMP.TEAL[11], 'cheer', 2.0);
    } else if (type === 'S') {
      p.slowTimer = 15.0;
      for (const b of game.balls) {
        b.speed = Math.max(92, b.speed * 0.74);
        const m = Math.hypot(b.vx, b.vy) || 1;
        b.vx = (b.vx / m) * b.speed;
        b.vy = (b.vy / m) * b.speed;
      }
      sayQuip('CHRONO HOURGLASS: SLOW-MO!', RAMP.CYAN[14], RAMP.INDIGO[12], 'cheer', 2.0);
    } else if (type === 'P') {
      // Gold Guy Idol: +1 Extra Life + Multiball Split!
      p.goldFlashTimer = 6.0;
      game.lives = Math.min(7, game.lives + 1);
      const src = game.balls[0] || createServedBall(0);
      src.stuck = false;
      for (const angOff of [-0.36, 0.36]) {
        if (game.balls.length >= 4) break;
        const baseAng = Math.atan2(src.vy, src.vx) + angOff;
        const spd = Math.max(122, src.speed);
        game.balls.push({
          x: src.x, y: src.y,
          vx: Math.cos(baseAng) * spd,
          vy: -Math.abs(Math.sin(baseAng) * spd) - 20,
          speed: spd,
          stuck: false, stuckOffset: 0, combo: src.combo, wallBounces: 0, trail: []
        });
      }
      sayQuip('GOLD GUY! +1UP & MULTIBALL!', RAMP.GOLD[15], RAMP.LAVA[13], 'cheer', 2.5);
    }
    syncPaddleDimensions();
  }

  // Recursive 3x3 Grog Chain Explosion!
  function triggerGrogExplosion(centerBrick) {
    const cx = centerBrick.x + 4;
    const cy = centerBrick.y + 3;
    AudioEngine.sfxGrogExplosion();
    triggerShake(2, 0.22);
    spawnShockwaveRing(cx, cy, RAMP.SLIME, 26);
    spawnShockwaveRing(cx, cy, RAMP.LAVA, 18);
    spawnParticles(cx, cy, RAMP.SLIME, 14, 95);
    spawnParticles(cx, cy, RAMP.LAVA, 10, 80);

    for (const b of game.bricks) {
      if (!b.alive) continue;
      if (Math.abs(b.col - centerBrick.col) <= 1 && Math.abs(b.row - centerBrick.row) <= 1) {
        if (b.steel) {
          b.steelAnim = 0.25;
          continue;
        }
        if (b.grog && b !== centerBrick) {
          b.alive = false;
          game.remainingBreakable = Math.max(0, game.remainingBreakable - 1);
          addScore(250, b.x + 4, b.y, 'CHAIN!');
          game.grogQueue.push({ brick: b, delay: 0.065 });
        } else {
          damageBrick(b, 2, null, true);
        }
      }
    }

    // Also blast LeChuck if explosion is near his spectral hull!
    if (game.boss.active && Math.hypot(cx - game.boss.x, cy - (game.boss.y + 15)) < 48) {
      damageBoss(3, cx, cy);
    }
  }

  function weaveLoomNote(noteIdx) {
    const m = game.mech;
    m.loomNotes.push(LOOM_NOTE_NAMES[noteIdx]);
    if (m.loomNotes.length >= 4) {
      const root = AudioEngine.getSongRoot();
      const spellMidi = [root, root + 3, root + 7, root + 12];
      AudioEngine.sfxLoomSpell(spellMidi);
      m.loomNotes = [];
      m.pierceTimer = 5.5;
      sayQuip('LOOM DRAFT WOVEN: SWAN FLIGHT!', RAMP.CYAN[15], RAMP.GOLD[14], 'cheer', 2.4);
      for (let i = 0; i < 3; i++) {
        game.swanBolts.push({
          x: game.paddle.x + (i - 1) * 10,
          y: game.paddle.y - 6,
          vx: (i - 1) * 35,
          vy: -125
        });
      }
    }
  }

  function damageBrick(brick, dmg = 1, ball = null, fromExplosion = false) {
    if (!brick.alive) return;
    if (brick.steel) {
      brick.steelAnim = 0.24;
      if (!fromExplosion) AudioEngine.sfxSteel();
      return;
    }

    brick.hp -= dmg;
    brick.flash = 0.10;
    const cx = brick.x + 4, cy = brick.y + 3;

    if (brick.hp > 0) {
      if (!fromExplosion) AudioEngine.sfxBrickCombo(ball ? ball.combo : 0, true);
      spawnParticles(cx, cy, RAMP.SLATE, 5, 48);
      addScore(50);
      return;
    }

    brick.alive = false;
    game.remainingBreakable = Math.max(0, game.remainingBreakable - 1);
    const combo = ball ? ball.combo++ : 2;
    if (!fromExplosion) AudioEngine.sfxBrickCombo(combo, false);

    const themeCols = BRICK_THEMES[brick.code] || BRICK_THEMES.w;
    spawnParticles(cx, cy, themeCols, 8, 68);
    const pts = (brick.grog ? 200 : (brick.maxHp * 90)) + Math.min(400, combo * 25);
    addScore(pts, combo >= 4 ? cx : null, combo >= 4 ? cy : null);

    if (combo === 6) sayRandomWorldQuip('combo');
    if (brick.loomNoteIdx >= 0) weaveLoomNote(brick.loomNoteIdx);

    if (brick.grog) {
      triggerGrogExplosion(brick);
    } else {
      maybeDropCapsule(cx, cy);
    }
  }

  function damageBoss(dmg, hitX, hitY) {
    const boss = game.boss;
    if (!boss.active || boss.hp <= 0) return;
    boss.hp = Math.max(0, boss.hp - dmg);
    boss.flashTimer = 0.12;
    triggerShake(2, 0.14);
    spawnParticles(hitX, hitY, RAMP.ECTO, 10, 85);
    AudioEngine.sfxBrickCombo(8, true);
    addScore(350, hitX, hitY);

    if (boss.hp === 12) {
      sayQuip('LECHUCK ENRAGED! VOODOO FURY!', RAMP.LAVA[15], RAMP.ECTO[13], 'wince', 3.0);
      triggerShake(3, 0.30);
    } else if (boss.hp % 5 === 0 && boss.hp > 0) {
      sayRandomWorldQuip('combo');
    }

    if (boss.hp <= 0) {
      // Grand Voodoo Banish Detonation!
      boss.active = false;
      AudioEngine.sfxGrogExplosion();
      triggerShake(3, 0.45);
      spawnShockwaveRing(boss.x, boss.y + 15, RAMP.ECTO, 46);
      spawnShockwaveRing(boss.x, boss.y + 15, RAMP.LAVA, 34);
      spawnParticles(boss.x, boss.y + 15, RAMP.ECTO, 28, 120);
      spawnParticles(boss.x, boss.y + 15, RAMP.GOLD, 22, 105);
      addScore(10000, boss.x, boss.y + 12, 'BANISHED +10000!');
      // Shatter all remaining fortress escort bricks in triumph
      for (const b of game.bricks) {
        if (b.alive && !b.steel) {
          b.alive = false;
          spawnParticles(b.x + 4, b.y + 3, RAMP.ECTO, 3, 60);
        }
      }
      game.remainingBreakable = 0;
    }
  }

  function launchAndFireAction() {
    AudioEngine.startMusic();
    if (game.mode === 'MENU') {
      startNewGame(game.stageIdx);
      return;
    }
    if (game.mode === 'GAME_OVER' || game.mode === 'VICTORY') {
      game.mode = 'MENU';
      loadStage(0, false);
      return;
    }
    if (game.mode !== 'PLAYING' || game.paused) return;

    let launched = false;
    for (const b of game.balls) {
      if (b.stuck) {
        b.stuck = false;
        const rel = Math.max(-0.85, Math.min(0.85, b.stuckOffset / (game.paddle.w * 0.5)));
        const ang = rel * 0.95;
        b.vx = Math.sin(ang) * b.speed;
        b.vy = -Math.cos(ang) * b.speed;
        launched = true;
      }
    }
    if (launched) AudioEngine.sfxPaddle(false);

    // Fire twin plasma blasters if 'L' active
    if (game.paddle.laserTimer > 0 && game.paddle.fireCooldown <= 0) {
      game.paddle.fireCooldown = 0.24;
      game.paddle.recoil = 2;
      const px = game.paddle.x, py = game.paddle.y;
      game.lasers.push(
        { x: px - game.paddle.w * 0.36, y: py - 4, vy: -225 },
        { x: px + game.paddle.w * 0.36, y: py - 4, vy: -225 }
      );
      AudioEngine.sfxLaser();
    }
  }

  function isBrickSolidInCurrentEra(b) {
    if (!b.alive) return false;
    if (b.era === 0) return true;
    return b.era === game.mech.eraPhase;
  }

  function hasNeighborBrickAt(col, row) {
    for (let i = 0; i < game.bricks.length; i++) {
      const b = game.bricks[i];
      if (b.col === col && b.row === row && isBrickSolidInCurrentEra(b)) return true;
    }
    return false;
  }

  // Sub-Stepped Corner-Safe Circle-vs-AABB Ball Physics
  function stepBallPhysics(ball, dt) {
    const R = 2.4;
    if (ball.stuck) {
      ball.x = Math.max(PLAY_L + R, Math.min(PLAY_R - R, game.paddle.x + ball.stuckOffset));
      ball.y = game.paddle.y - 3;
      return true;
    }

    // World 4 Orbital Gravity Wells gentle trajectory curvature
    for (const v of game.vortices) {
      const dx = v.x - ball.x;
      const dy = v.y - ball.y;
      const dist = Math.max(18, Math.hypot(dx, dy));
      if (dist < 78) {
        const pull = (v.strength / (dist * dist)) * dt * 60;
        ball.vx += (dx / dist) * pull - (dy / dist) * pull * 0.35;
        ball.vy += (dy / dist) * pull + (dx / dist) * pull * 0.35;
        const m = Math.hypot(ball.vx, ball.vy) || 1;
        ball.vx = (ball.vx / m) * ball.speed;
        ball.vy = (ball.vy / m) * ball.speed;
      }
    }

    const totalMove = ball.speed * dt;
    const subSteps = Math.max(2, Math.ceil(totalMove / 1.2));
    const subDt = dt / subSteps;

    for (let s = 0; s < subSteps; s++) {
      ball.x += ball.vx * subDt;
      ball.y += ball.vy * subDt;

      // Playfield walls
      if (ball.x - R < PLAY_L) {
        ball.x = PLAY_L + R;
        ball.vx = Math.abs(ball.vx);
        ball.wallBounces++;
        AudioEngine.sfxWall();
      } else if (ball.x + R > PLAY_R) {
        ball.x = PLAY_R - R;
        ball.vx = -Math.abs(ball.vx);
        ball.wallBounces++;
        AudioEngine.sfxWall();
      }
      if (ball.y - R < PLAY_T) {
        ball.y = PLAY_T + R;
        ball.vy = Math.abs(ball.vy);
        ball.wallBounces++;
        AudioEngine.sfxWall();
      }

      // Paddle bounce
      const p = game.paddle;
      const pLeft = p.x - p.w * 0.5;
      const pRight = p.x + p.w * 0.5;
      if (ball.vy > 0 && ball.y + R >= p.y && ball.y - R <= p.y + p.h && ball.x + R >= pLeft && ball.x - R <= pRight) {
        ball.y = p.y - R;
        ball.combo = 0;
        ball.wallBounces = 0;
        const rel = Math.max(-1, Math.min(1, (ball.x - p.x) / (p.w * 0.5)));
        if (p.catchTimer > 0) {
          ball.stuck = true;
          ball.stuckOffset = ball.x - p.x;
          AudioEngine.sfxPaddle(true);
          return true;
        }
        const maxAngle = 1.16; // ~66.5 deg
        const ang = rel * maxAngle;
        const maxSpd = p.slowTimer > 0 ? 118 : 172;
        ball.speed = Math.min(maxSpd, ball.speed + 1.8);
        ball.vx = Math.sin(ang) * ball.speed + p.vx * 0.08;
        ball.vy = -Math.cos(ang) * ball.speed;
        const m = Math.hypot(ball.vx, ball.vy) || 1;
        ball.vx = (ball.vx / m) * ball.speed;
        ball.vy = -Math.abs((ball.vy / m) * ball.speed);
        AudioEngine.sfxPaddle(false);
      }

      // Level 33 Ghost Pirate LeChuck Boss Circle-vs-AABB Hit
      if (game.boss.active && game.boss.hp > 0) {
        const bx0 = game.boss.x - 19, bx1 = game.boss.x + 19;
        const by0 = game.boss.y + 2,  by1 = game.boss.y + 28;
        const cx = Math.max(bx0, Math.min(bx1, ball.x));
        const cy = Math.max(by0, Math.min(by1, ball.y));
        const dx = ball.x - cx, dy = ball.y - cy;
        if (dx * dx + dy * dy < R * R) {
          if (Math.abs(dx) > Math.abs(dy)) {
            ball.vx = (dx >= 0 ? 1 : -1) * Math.abs(ball.vx);
            ball.x = cx + (dx >= 0 ? R + 0.5 : -R - 0.5);
          } else {
            ball.vy = (dy >= 0 ? 1 : -1) * Math.abs(ball.vy);
            ball.y = cy + (dy >= 0 ? R + 0.5 : -R - 0.5);
          }
          damageBoss(1, ball.x, ball.y);
        }
      }

      // Corner-Safe Circle-vs-AABB Brick Collision (pick deepest penetration)
      let bestBrick = null;
      let bestDist2 = R * R;
      let bestDx = 0, bestDy = 0;

      for (let i = 0; i < game.bricks.length; i++) {
        const b = game.bricks[i];
        if (!isBrickSolidInCurrentEra(b)) continue;
        const cx = ball.x < b.x ? b.x : (ball.x > b.x + b.w ? b.x + b.w : ball.x);
        const cy = ball.y < b.y ? b.y : (ball.y > b.y + b.h ? b.y + b.h : ball.y);
        const dx = ball.x - cx;
        const dy = ball.y - cy;
        const d2 = dx * dx + dy * dy;
        if (d2 < bestDist2) {
          bestDist2 = d2;
          bestBrick = b;
          bestDx = dx;
          bestDy = dy;
        }
      }

      if (bestBrick) {
        const b = bestBrick;
        const piercing = game.mech.pierceTimer > 0 && !b.steel && b.hp === 1;
        if (!piercing) {
          // Seam-safe face check: avoid reflecting horizontally into an occupied flush neighbor!
          let hitHoriz = Math.abs(bestDx) > Math.abs(bestDy);
          if (bestDx === 0 && bestDy === 0) {
            const penX = Math.min(Math.abs(ball.x - b.x), Math.abs(b.x + b.w - ball.x));
            const penY = Math.min(Math.abs(ball.y - b.y), Math.abs(b.y + b.h - ball.y));
            hitHoriz = penX < penY;
          }
          if (hitHoriz) {
            const sideDir = (ball.x < b.x + b.w * 0.5) ? -1 : 1;
            if (hasNeighborBrickAt(b.col + sideDir, b.row)) hitHoriz = false;
          } else {
            const vertDir = (ball.y < b.y + b.h * 0.5) ? -1 : 1;
            if (hasNeighborBrickAt(b.col, b.row + vertDir)) hitHoriz = true;
          }

          if (hitHoriz) {
            const dir = (ball.x < b.x + b.w * 0.5) ? -1 : 1;
            ball.vx = dir * Math.abs(ball.vx);
            ball.x = dir < 0 ? b.x - R - 0.1 : b.x + b.w + R + 0.1;
          } else {
            const dir = (ball.y < b.y + b.h * 0.5) ? -1 : 1;
            ball.vy = dir * Math.abs(ball.vy);
            ball.y = dir < 0 ? b.y - R - 0.1 : b.y + b.h + R + 0.1;
          }
        }
        if (b.steel) ball.wallBounces++; else ball.wallBounces = 0;
        damageBrick(b, 1, ball, false);
      }

      // Enforce minimum vertical velocity + anti-infinite-loop nudge
      const minVy = ball.speed * 0.23;
      if (Math.abs(ball.vy) < minVy) {
        const signY = ball.vy >= 0 ? 1 : -1;
        ball.vy = signY * minVy;
        const signX = ball.vx >= 0 ? 1 : -1;
        ball.vx = signX * Math.sqrt(Math.max(1, ball.speed * ball.speed - ball.vy * ball.vy));
      }
      if (ball.wallBounces > 14) {
        ball.wallBounces = 0;
        ball.vy += 18;
        const m = Math.hypot(ball.vx, ball.vy) || 1;
        ball.vx = (ball.vx / m) * ball.speed;
        ball.vy = (ball.vy / m) * ball.speed;
      }
    }

    // Record glowing pixel trail
    ball.trail.unshift({ x: ball.x, y: ball.y });
    if (ball.trail.length > 6) ball.trail.pop();

    return ball.y - R <= PLAY_B + 4;
  }

  // =========================================================================
  // 11. INPUT HANDLING (MOUSE + KEYBOARD + JUKEBOX + STAGE PREVIEW)
  // =========================================================================
  const keys = {};
  let pointerTargetX = null;

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const lx = ((e.clientX - rect.left) / rect.width) * W;
    if (lx <= PF_W + 8) {
      pointerTargetX = lx;
    }
  });

  canvas.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    AudioEngine.startMusic();
    const rect = canvas.getBoundingClientRect();
    const lx = ((e.clientX - rect.left) / rect.width) * W;
    const ly = ((e.clientY - rect.top) / rect.height) * H;
    // Check HUD bottom micro-buttons (CRT / SND / PAUSE)
    if (lx >= HUD_X && ly >= 184) {
      if (lx < 278) {
        game.crtEnabled = !game.crtEnabled;
        crtOverlay.classList.toggle('off', !game.crtEnabled);
      } else if (lx < 299) {
        AudioEngine.toggleMute();
      } else if (game.mode === 'PLAYING') {
        game.paused = !game.paused;
      }
      return;
    }
    launchAndFireAction();
  });

  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    AudioEngine.startMusic();

    if (e.code === 'KeyM') {
      AudioEngine.toggleMute();
      return;
    }
    if (e.code === 'KeyP') {
      if (game.mode === 'PLAYING') game.paused = !game.paused;
      return;
    }
    if (e.code === 'KeyC' || e.code === 'F2') {
      game.crtEnabled = !game.crtEnabled;
      crtOverlay.classList.toggle('off', !game.crtEnabled);
      return;
    }

    if (game.mode === 'MENU') {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        e.preventDefault();
        loadStage(game.stageIdx - 1, true);
        return;
      }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        e.preventDefault();
        loadStage(game.stageIdx + 1, true);
        return;
      }
      // 1-7 Menu Soundtrack Jukebox Preview!
      if (e.code >= 'Digit1' && e.code <= 'Digit7') {
        const wIdx = parseInt(e.code.slice(5), 10) - 1;
        const firstStageOfWorld = [0, 6, 12, 18, 24, 30, 32][wIdx];
        loadStage(firstStageOfWorld, true);
        sayQuip(`JUKEBOX: ${WORLD_INFO[wIdx].songTitle}`, RAMP.GOLD[15], RAMP.CYAN[13], 'cheer', 2.8);
        return;
      }
    }

    if (e.code === 'Space') {
      e.preventDefault();
      launchAndFireAction();
    }
  });

  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });

  // =========================================================================
  // 12. MAIN SIMULATION UPDATE (WORLD MECHANICS, BOSS, iMUSE REACTIVITY)
  // =========================================================================
  function updateSimulation(dt) {
    game.time += dt;
    AudioEngine.decayVu(dt);
    game.marqueePx = (game.marqueePx + dt * 26) % (AudioEngine.getStatusText().length * 6);

    // Portrait blink & mood animation timers
    const pr = game.portrait;
    pr.blinkTimer -= dt;
    if (pr.blinkTimer <= 0) {
      pr.blinkDur = 0.13;
      pr.blinkTimer = 2.4 + Math.random() * 2.6;
    }
    if (pr.blinkDur > 0) pr.blinkDur = Math.max(0, pr.blinkDur - dt);
    if (pr.quipTimer > 0) pr.quipTimer = Math.max(0, pr.quipTimer - dt);
    if (pr.moodTimer > 0) {
      pr.moodTimer = Math.max(0, pr.moodTimer - dt);
      if (pr.moodTimer === 0) pr.mood = 'normal';
    }
    if (game.shakeTimer > 0) game.shakeTimer = Math.max(0, game.shakeTimer - dt);

    if (game.mode === 'MENU') {
      game.menuCamPhase += dt * 0.65;
      // Animate World 6 patrolling preview even on menu!
      if (game.formationRange > 0) {
        game.formationX = Math.round(Math.sin(game.time * 1.4) * game.formationRange);
        for (const b of game.bricks) b.x = b.baseX + game.formationX;
      }
      return;
    }

    if (game.paused) return;

    if (game.mode === 'STAGE_CLEAR') {
      game.stageClearTimer -= dt;
      updateJuiceLists(dt);
      if (game.stageClearTimer <= 0) {
        if (game.stageIdx >= LEVELS.length - 1) {
          game.mode = 'VICTORY';
          AudioEngine.setWorldAndPreset(0, 5);
          AudioEngine.setOverdrive(true);
          sayQuip('PIRATE LEGEND! LECHUCK IS BANISHED!', RAMP.GOLD[15], RAMP.ECTO[14], 'cheer', 6.0);
        } else {
          game.mode = 'PLAYING';
          loadStage(game.stageIdx + 1, true);
        }
      }
      return;
    }

    if (game.mode !== 'PLAYING') {
      updateJuiceLists(dt);
      return;
    }

    // --- Paddle Movement & Timers ---
    const p = game.paddle;
    p.laserTimer     = Math.max(0, p.laserTimer - dt);
    p.expandTimer    = Math.max(0, p.expandTimer - dt);
    p.catchTimer     = Math.max(0, p.catchTimer - dt);
    p.slowTimer      = Math.max(0, p.slowTimer - dt);
    p.goldFlashTimer = Math.max(0, p.goldFlashTimer - dt);
    p.fireCooldown   = Math.max(0, p.fireCooldown - dt);
    p.curseTimer     = Math.max(0, p.curseTimer - dt);
    p.recoil         = Math.max(0, p.recoil - dt * 14);
    syncPaddleDimensions();

    const prevPx = p.x;
    const moveLeft  = keys['ArrowLeft']  || keys['KeyA'];
    const moveRight = keys['ArrowRight'] || keys['KeyD'];
    const maxPadSpd = p.curseTimer > 0 ? 125 : 215;

    if (moveLeft || moveRight) {
      pointerTargetX = null;
      p.x += ((moveRight ? 1 : 0) - (moveLeft ? 1 : 0)) * maxPadSpd * dt;
    } else if (pointerTargetX !== null) {
      const diff = pointerTargetX - p.x;
      const step = maxPadSpd * 2.1 * dt;
      p.x += Math.abs(diff) <= step ? diff : Math.sign(diff) * step;
    }
    p.x = Math.max(PLAY_L + p.w * 0.5, Math.min(PLAY_R - p.w * 0.5, p.x));
    p.vx = (p.x - prevPx) / Math.max(0.001, dt);

    // --- Staggered Grog 3x3 Chain Reactions ---
    for (let i = game.grogQueue.length - 1; i >= 0; i--) {
      game.grogQueue[i].delay -= dt;
      if (game.grogQueue[i].delay <= 0) {
        const item = game.grogQueue.splice(i, 1)[0];
        triggerGrogExplosion(item.brick);
      }
    }

    // --- World-Specific Mechanics ---
    const world = LEVELS[game.stageIdx].world;
    const m = game.mech;
    m.pierceTimer = Math.max(0, m.pierceTimer - dt);
    m.duelOverdriveTimer = Math.max(0, m.duelOverdriveTimer - dt);

    if (world === 0) {
      // World 1: Insult Sword-Fighting Duels
      m.duelTimer -= dt;
      if (m.duelTimer <= 0) {
        m.duelTimer = 10.5;
        const pair = SWORD_DUELS[m.duelIdx % SWORD_DUELS.length];
        sayQuip(pair.insult, RAMP.LAVA[14], RAMP.RUBY[11], 'normal', 2.6);
        game.hazards.push({
          kind: 'cutlass',
          x: 34 + Math.random() * 188,
          y: 16,
          vx: (Math.random() - 0.5) * 28,
          vy: 56,
          comeback: pair.comeback
        });
        m.duelIdx++;
      }
    } else if (world === 1) {
      // World 2: Chron-o-John Era-Phasing Bricks
      m.eraTimer -= dt;
      // Auto-flush immediately if all remaining breakable bricks belong to the opposite era!
      let activeSolidCount = 0;
      for (const b of game.bricks) {
        if (b.alive && !b.steel && isBrickSolidInCurrentEra(b)) activeSolidCount++;
      }
      if (m.eraTimer <= 0 || (game.remainingBreakable > 0 && activeSolidCount === 0)) {
        m.eraTimer = 7.5;
        m.eraPhase = m.eraPhase === 1 ? 2 : 1;
        AudioEngine.sfxPaddle(true);
      }
    } else if (world === 2) {
      // World 3: Dart-Spitting Atlantean Idols
      m.idolOpenTimer = Math.max(0, m.idolOpenTimer - dt);
      m.idolTimer -= dt;
      if (m.idolTimer <= 0) {
        m.idolTimer = 4.6;
        m.idolOpenTimer = 0.65;
        m.idolSide = 1 - m.idolSide;
        const ix = m.idolSide === 0 ? 64 : 192;
        game.hazards.push({ kind: 'dart', x: ix, y: 20, vx: 0, vy: 86 });
        AudioEngine.sfxSteel();
      }
    } else if (world === 5) {
      // World 6: Sam & Max Patrolling Road Formations + Traffic Cones
      if (game.formationRange > 0) {
        game.formationX = Math.round(Math.sin(game.time * 1.55) * game.formationRange);
        for (const b of game.bricks) b.x = b.baseX + game.formationX;
      }
      m.coneTimer -= dt;
      if (m.coneTimer <= 0) {
        m.coneTimer = 6.5;
        game.hazards.push({ kind: 'cone', x: 32 + Math.random() * 190, y: 14, vx: 26, vy: 64 });
      }
    } else if (world === 6 && game.boss.active) {
      // World 7: Ghost Pirate LeChuck Boss AI
      const boss = game.boss;
      const enraged = boss.hp <= 12;
      boss.flashTimer = Math.max(0, boss.flashTimer - dt);
      const spdMul = enraged ? 1.55 : 1.0;
      boss.x += boss.vx * spdMul * dt;
      if (boss.x < 36) { boss.x = 36; boss.vx = Math.abs(boss.vx); }
      if (boss.x > 220) { boss.x = 220; boss.vx = -Math.abs(boss.vx); }
      boss.y = 18 + Math.sin(game.time * 3.2) * 3;

      boss.teleportTimer -= dt;
      if (boss.teleportTimer <= 0) {
        boss.teleportTimer = enraged ? 4.5 : 6.5;
        spawnParticles(boss.x, boss.y + 15, RAMP.ECTO, 12, 85);
        boss.x = 42 + Math.random() * 172;
        spawnShockwaveRing(boss.x, boss.y + 15, RAMP.ECTO, 20);
      }

      boss.castTimer -= dt;
      if (boss.castTimer <= 0) {
        boss.castTimer = enraged ? 2.1 : 3.2;
        const aimAngle = Math.atan2(p.y - (boss.y + 24), p.x - boss.x);
        const shots = enraged ? [-0.20, 0.20] : [0];
        for (const off of shots) {
          game.hazards.push({
            kind: 'skull',
            x: boss.x,
            y: boss.y + 24,
            vx: Math.cos(aimAngle + off) * 76,
            vy: Math.max(52, Math.sin(aimAngle + off) * 76)
          });
        }
      }

      // Enraged LeChuck periodically conjures volatile Grog barrels that players can detonate back on him!
      if (enraged) {
        boss.summonTimer -= dt;
        if (boss.summonTimer <= 0) {
          boss.summonTimer = 7.5;
          for (const b of game.bricks) {
            if (!b.alive && b.row <= 2 && Math.random() < 0.25) {
              b.alive = true;
              b.grog = true;
              b.code = 'X';
              b.hp = 1;
              b.maxHp = 1;
              game.remainingBreakable++;
              spawnParticles(b.x + 4, b.y + 3, RAMP.SLIME, 6, 55);
            }
          }
        }
      }
    }

    // --- Update Brick Flashes ---
    for (const b of game.bricks) {
      if (b.flash > 0) b.flash = Math.max(0, b.flash - dt);
      if (b.steelAnim > 0) b.steelAnim = Math.max(0, b.steelAnim - dt);
    }

    // --- Update Twin Blaster Lasers ---
    for (let i = game.lasers.length - 1; i >= 0; i--) {
      const l = game.lasers[i];
      l.y += l.vy * dt;
      if (l.y < PLAY_T) { game.lasers.splice(i, 1); continue; }

      if (game.boss.active && l.x >= game.boss.x - 18 && l.x <= game.boss.x + 18 && l.y <= game.boss.y + 28 && l.y >= game.boss.y + 2) {
        damageBoss(1, l.x, l.y);
        game.lasers.splice(i, 1);
        continue;
      }

      let hit = false;
      for (const b of game.bricks) {
        if (!isBrickSolidInCurrentEra(b)) continue;
        if (l.x >= b.x && l.x <= b.x + b.w && l.y >= b.y && l.y <= b.y + b.h) {
          damageBrick(b, 1, null, false);
          hit = true;
          break;
        }
      }
      if (hit) game.lasers.splice(i, 1);
    }

    // --- Update World 5 Homing Swan Spirit Bolts ---
    for (let i = game.swanBolts.length - 1; i >= 0; i--) {
      const sb = game.swanBolts[i];
      let target = null, bestD = 9999;
      for (const b of game.bricks) {
        if (b.alive && !b.steel) {
          const d = Math.hypot((b.x + 4) - sb.x, (b.y + 3) - sb.y);
          if (d < bestD) { bestD = d; target = b; }
        }
      }
      if (target) {
        const ang = Math.atan2((target.y + 3) - sb.y, (target.x + 4) - sb.x);
        sb.vx = Math.cos(ang) * 145;
        sb.vy = Math.sin(ang) * 145;
      }
      sb.x += sb.vx * dt;
      sb.y += sb.vy * dt;
      if (target && Math.hypot((target.x + 4) - sb.x, (target.y + 3) - sb.y) < 6) {
        damageBrick(target, 3, null, false);
        spawnShockwaveRing(sb.x, sb.y, RAMP.CYAN, 14);
        game.swanBolts.splice(i, 1);
      } else if (sb.y < 0 || sb.y > H || sb.x < 0 || sb.x > PF_W) {
        game.swanBolts.splice(i, 1);
      }
    }

    // --- Update Falling Capsules ---
    for (let i = game.capsules.length - 1; i >= 0; i--) {
      const c = game.capsules[i];
      c.y += c.vy * dt;
      if (c.y + 4 >= p.y && c.y - 4 <= p.y + p.h && c.x + 9 >= p.x - p.w * 0.5 && c.x - 9 <= p.x + p.w * 0.5) {
        applyCapsule(c.type);
        game.capsules.splice(i, 1);
      } else if (c.y > H + 10) {
        game.capsules.splice(i, 1);
      }
    }

    // --- Update World Hazards (Cutlass Tokens, Poison Darts, Voodoo Skulls, Highway Cones) ---
    for (let i = game.hazards.length - 1; i >= 0; i--) {
      const hz = game.hazards[i];
      hz.x += hz.vx * dt;
      hz.y += hz.vy * dt;
      if (hz.x < PLAY_L + 5 || hz.x > PLAY_R - 5) hz.vx = -hz.vx;

      // Deflect/shatter hazards with active balls!
      let shatteredByBall = false;
      if (hz.kind !== 'cutlass') {
        for (const b of game.balls) {
          if (!b.stuck && Math.hypot(b.x - hz.x, b.y - hz.y) < 7) {
            addScore(250, hz.x, hz.y, '+250');
            spawnParticles(hz.x, hz.y, RAMP.GOLD, 8, 70);
            AudioEngine.sfxBrickCombo(4, false);
            shatteredByBall = true;
            break;
          }
        }
      }
      if (shatteredByBall) { game.hazards.splice(i, 1); continue; }

      // Paddle contact
      if (hz.y + 4 >= p.y && hz.y - 4 <= p.y + p.h && Math.abs(hz.x - p.x) <= p.w * 0.5 + 4) {
        if (hz.kind === 'cutlass') {
          // Parried Pirate Insult Duel!
          m.duelCharge = Math.min(100, m.duelCharge + 50);
          m.duelOverdriveTimer = 8.0;
          AudioEngine.sfxPowerup('C');
          sayQuip(hz.comeback, RAMP.CYAN[15], RAMP.GOLD[14], 'cheer', 3.0);
          addScore(600, hz.x, hz.y - 8, 'PARRY +600!');
          if (m.duelCharge >= 100) {
            m.duelCharge = 0;
            if (game.balls.length < 4) {
              const nb = createServedBall(0);
              nb.stuck = false; nb.vy = -138; nb.vx = (Math.random() - 0.5) * 90; nb.speed = 142;
              game.balls.push(nb);
            }
          }
        } else if (hz.kind === 'cone') {
          addScore(300, hz.x, hz.y - 8, 'SMASH +300!');
          spawnParticles(hz.x, hz.y, RAMP.LAVA, 8, 70);
          AudioEngine.sfxBrickCombo(3, false);
        } else {
          // Dart or LeChuck Skull curses/rattles paddle briefly
          p.curseTimer = 3.2;
          triggerShake(2, 0.18);
          spawnParticles(hz.x, hz.y, RAMP.ECTO, 10, 75);
          AudioEngine.sfxSteel();
          sayRandomWorldQuip('hurt');
        }
        game.hazards.splice(i, 1);
        continue;
      }

      if (hz.y > H + 10) game.hazards.splice(i, 1);
    }

    // --- Update Balls ---
    for (let i = game.balls.length - 1; i >= 0; i--) {
      if (!stepBallPhysics(game.balls[i], dt)) {
        game.balls.splice(i, 1);
      }
    }

    if (game.balls.length === 0) {
      game.lives--;
      AudioEngine.sfxBallLost();
      triggerShake(2, 0.25);
      sayRandomWorldQuip('hurt');
      p.laserTimer = 0; p.expandTimer = 0; p.catchTimer = 0; p.slowTimer = 0;
      syncPaddleDimensions();
      if (game.lives <= 0) {
        game.mode = 'GAME_OVER';
        AudioEngine.setOverdrive(false);
        sayQuip('GAME OVER! PRESS SPACE TO SAIL AGAIN!', RAMP.RUBY[14], RAMP.GOLD[12], 'wince', 5.0);
      } else {
        game.balls = [createServedBall(0)];
      }
    }

    // --- Live Gameplay-Reactive iMUSE Overdrive Stem Layering ---
    const lowBricks = (game.remainingBreakable / game.initialBreakable) < 0.30;
    const multiballOrLaser = game.balls.length > 1 || p.laserTimer > 0;
    const swordDuelActive = m.duelOverdriveTimer > 0;
    const bossEnraged = game.boss.active && game.boss.hp <= 12;
    AudioEngine.setOverdrive(lowBricks || multiballOrLaser || swordDuelActive || bossEnraged);

    // --- Check Stage Completion ---
    if (game.remainingBreakable <= 0 && (!game.boss.active || game.boss.hp <= 0) && game.grogQueue.length === 0) {
      game.mode = 'STAGE_CLEAR';
      game.stageClearTimer = 2.1;
      AudioEngine.sfxPowerup('P');
      addScore(1000 + game.stageIdx * 100, 128, 100, 'STAGE CLEAR!');
      sayRandomWorldQuip('combo');
    }

    updateJuiceLists(dt);
  }

  function updateJuiceLists(dt) {
    for (let i = game.rings.length - 1; i >= 0; i--) {
      const r = game.rings[i];
      r.life -= dt;
      r.r = r.maxR * (1 - r.life / r.maxLife);
      if (r.life <= 0) game.rings.splice(i, 1);
    }
    for (let i = game.particles.length - 1; i >= 0; i--) {
      const pt = game.particles[i];
      pt.life -= dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy += 120 * dt;
      if (pt.life <= 0) game.particles.splice(i, 1);
    }
    for (let i = game.floats.length - 1; i >= 0; i--) {
      const fl = game.floats[i];
      fl.life -= dt;
      fl.y -= 18 * dt;
      if (fl.life <= 0) game.floats.splice(i, 1);
    }
  }

  // =========================================================================
  // 13. MODE 13h RENDERER: PLAYFIELD, SPRITES, JUICE & 64x200 SCUMM SIDEBAR
  // =========================================================================
  function renderPlayfield() {
    const lvl = LEVELS[game.stageIdx];
    const world = lvl.world;
    const camNorm = game.mode === 'MENU'
      ? Math.sin(game.menuCamPhase) * 0.75
      : ((game.paddle.x - 128) / 112);

    // 1. Multi-Plane Painterly Parallax Backdrop + Animated Water/Lava/Stars
    renderWorldBackdrop(mainFb, world, game.time, camNorm);

    // 2. World 4 Orbital Gravity Vortices (behind bricks/balls)
    const vFrame = Math.floor(game.time * 12) & 3;
    for (const v of game.vortices) {
      blitSurface(mainFb, SPRITES.vortexFrames[vFrame], v.x - 7, v.y - 7, PLAY_L, PLAY_T, PLAY_R, PLAY_B);
    }

    // 3. 30x16..18 Beveled Pixel-Art Brick Mosaic
    const grogAnim = Math.floor(game.time * 6) & 1;
    for (let i = 0; i < game.bricks.length; i++) {
      const b = game.bricks[i];
      if (!b.alive) continue;

      if (b.era !== 0 && b.era !== game.mech.eraPhase) {
        // Phased-out Chron-o-John Ghost Wireframe Brick!
        const ghostCol = b.era === 1 ? RAMP.PURPLE[9] : RAMP.CYAN[10];
        for (let x = 0; x < 8; x += 2) {
          pset(mainFb, b.x + x, b.y, ghostCol);
          pset(mainFb, b.x + x + 1, b.y + 5, ghostCol);
        }
        pset(mainFb, b.x, b.y + 2, ghostCol);
        pset(mainFb, b.x + 7, b.y + 3, ghostCol);
        continue;
      }

      if (b.flash > 0) {
        fillRect(mainFb, b.x, b.y, 8, 6, COL_WHITE);
        continue;
      }

      if (b.steel) {
        const sf = b.steelAnim > 0 ? Math.min(3, Math.ceil(b.steelAnim * 14)) : 0;
        blitSurface(mainFb, BRICK_SPRITES.steelFrames[sf], b.x, b.y);
      } else if (b.grog) {
        blitSurface(mainFb, BRICK_SPRITES.grogFrames[grogAnim], b.x, b.y);
      } else {
        blitSurface(mainFb, BRICK_SPRITES[b.code] || BRICK_SPRITES.w, b.x, b.y);
        if (b.maxHp > 1 && b.hp < b.maxHp) {
          const crack = (b.maxHp === 3 && b.hp === 2) ? BRICK_SPRITES.crack1 : BRICK_SPRITES.crack2;
          blitSurface(mainFb, crack, b.x, b.y);
        }
        if (b.era !== 0) {
          pset(mainFb, b.x + 6, b.y + 1, b.era === 1 ? RAMP.PURPLE[13] : RAMP.CYAN[14]);
        }
        if (b.loomNoteIdx >= 0 && ((Math.floor(game.time * 8) + b.col) % 3 === 0)) {
          pset(mainFb, b.x + 3, b.y + 2, COL_WHITE);
          pset(mainFb, b.x + 4, b.y + 2, RAMP.GOLD[14]);
        }
      }
    }

    // 4. World 3 Atlantean Dart-Spitting Idols on Top Temple Header
    if (world === 2) {
      const spr0 = (game.mech.idolOpenTimer > 0 && game.mech.idolSide === 0) ? SPRITES.idolOpen : SPRITES.idolClosed;
      const spr1 = (game.mech.idolOpenTimer > 0 && game.mech.idolSide === 1) ? SPRITES.idolOpen : SPRITES.idolClosed;
      blitSurface(mainFb, spr0, 57, 8);
      blitSurface(mainFb, spr1, 185, 8);
    }

    // 5. Centerpiece 44x30 Ghost Pirate LeChuck Boss (Level 33)
    if (game.boss.active && game.boss.hp > 0) {
      const boss = game.boss;
      let bf = Math.floor(game.time * 6) & 1;
      if (boss.hp <= 12) bf = 3;
      else if (boss.castTimer < 0.45) bf = 2;
      const spr = SPRITES.lechuckFrames[bf];
      blitSurface(mainFb, spr, Math.round(boss.x - 22), Math.round(boss.y), PLAY_L, PLAY_T, PLAY_R, PLAY_B, boss.flashTimer > 0 ? COL_WHITE : 0);
      // Overhead Ghost Health Bar
      drawBevelBox(mainFb, Math.round(boss.x - 18), Math.round(boss.y - 5), 36, 4, COL_BLACK, RAMP.SLATE[8], RAMP.SLATE[5], COL_BLACK);
      const hpW = Math.round((boss.hp / boss.maxHp) * 34);
      fillRect(mainFb, Math.round(boss.x - 17), Math.round(boss.y - 4), hpW, 2, boss.hp <= 12 ? RAMP.LAVA[13] : RAMP.ECTO[12]);
    }

    // 6. Ornate 8px Sculpted World Border Frame
    renderWorldBorder(mainFb, world);

    if (game.mode !== 'MENU') {
      // 7. Capsules (18x9 glossy pills)
      const capShimmer = Math.floor(game.time * 8) & 1;
      for (const c of game.capsules) {
        const spr = CAPSULE_SPRITES[c.type]?.[capShimmer];
        if (spr) blitSurface(mainFb, spr, Math.round(c.x - 9), Math.round(c.y - 4), PLAY_L, PLAY_T, PLAY_R, PLAY_B);
      }

      // 8. Twin Lasers, Swan Bolts & Hazards
      for (const l of game.lasers) {
        blitSurface(mainFb, SPRITES.laser, Math.round(l.x - 1), Math.round(l.y - 3), PLAY_L, PLAY_T, PLAY_R, PLAY_B);
      }
      for (const sb of game.swanBolts) {
        blitSurface(mainFb, SPRITES.swanBolt, Math.round(sb.x - 4), Math.round(sb.y - 4), PLAY_L, PLAY_T, PLAY_R, PLAY_B);
      }
      for (const hz of game.hazards) {
        if (hz.kind === 'cutlass') {
          blitSurface(mainFb, SPRITES.cutlass, Math.round(hz.x - 5), Math.round(hz.y - 5), PLAY_L, PLAY_T, PLAY_R, PLAY_B);
        } else if (hz.kind === 'dart') {
          blitSurface(mainFb, SPRITES.dart, Math.round(hz.x - 1), Math.round(hz.y - 3), PLAY_L, PLAY_T, PLAY_R, PLAY_B);
        } else if (hz.kind === 'skull') {
          blitSurface(mainFb, SPRITES.skullFire[Math.floor(game.time * 10) & 1], Math.round(hz.x - 4), Math.round(hz.y - 4), PLAY_L, PLAY_T, PLAY_R, PLAY_B);
        } else if (hz.kind === 'cone') {
          drawBevelBox(mainFb, Math.round(hz.x - 3), Math.round(hz.y - 3), 7, 7, RAMP.LAVA[12], COL_WHITE, RAMP.LAVA[10], RAMP.LAVA[5]);
        }
      }

      // 9. Detailed Paddle Sprite (Chicken / Blaster / Compass / Vaus)
      const p = game.paddle;
      let padSpr = SPRITES.paddleVaus;
      if (p.expandTimer > 0) padSpr = SPRITES.paddleChicken;
      else if (p.laserTimer > 0) padSpr = SPRITES.paddleBlaster;
      else if (p.catchTimer > 0) padSpr = SPRITES.paddleCompass;
      const curseOverride = (p.curseTimer > 0 && (Math.floor(game.time * 14) & 1)) ? RAMP.SLIME[11] : 0;
      blitSurface(mainFb, padSpr, Math.round(p.x - padSpr.w * 0.5), Math.round(p.y + p.recoil), PLAY_L, PLAY_T, PLAY_R, PLAY_B, curseOverride);

      // 10. Specular-Lit 5x5 Balls + Glowing Pixel Trails
      for (const b of game.balls) {
        const hot = b.combo >= 4 || game.mech.duelOverdriveTimer > 0;
        const tRamp = game.mech.pierceTimer > 0 ? RAMP.GOLD : (hot ? RAMP.LAVA : RAMP.CYAN);
        for (let t = b.trail.length - 1; t >= 0; t--) {
          const tp = b.trail[t];
          const col = tRamp[Math.max(4, 13 - t * 2)];
          fillRect(mainFb, Math.round(tp.x - 1), Math.round(tp.y - 1), t < 2 ? 2 : 1, t < 2 ? 2 : 1, col);
        }
        if (b.stuck && game.mode === 'PLAYING') {
          // Dotted aiming guide on stuck ball
          const rel = Math.max(-0.85, Math.min(0.85, b.stuckOffset / (p.w * 0.5)));
          const ang = rel * 0.95;
          for (let d = 6; d <= 22; d += 5) {
            pset(mainFb, Math.round(b.x + Math.sin(ang) * d), Math.round(b.y - Math.cos(ang) * d), RAMP.GOLD[14]);
          }
        }
        const bSpr = game.mech.pierceTimer > 0 ? SPRITES.ballLoom : (hot ? SPRITES.ballFire : SPRITES.ballNormal);
        blitSurface(mainFb, bSpr, Math.round(b.x - 2), Math.round(b.y - 2), PLAY_L, PLAY_T, PLAY_R, PLAY_B);
      }
    }

    // 11. Radial Shockwave Rings, Sparks & Pixel-Outlined Floating Scores
    for (const r of game.rings) {
      const col = r.ramp[Math.min(15, Math.max(5, Math.round((r.life / r.maxLife) * 15)))];
      for (let a = 0; a < 28; a++) {
        const ang = (a / 28) * Math.PI * 2;
        const px = Math.round(r.x + Math.cos(ang) * r.r);
        const py = Math.round(r.y + Math.sin(ang) * r.r);
        if (px >= PLAY_L && px < PLAY_R && py >= PLAY_T && py < PLAY_B) pset(mainFb, px, py, col);
      }
    }
    for (const pt of game.particles) {
      if (pt.x >= PLAY_L && pt.x < PLAY_R && pt.y >= PLAY_T && pt.y < PLAY_B) {
        const idx = Math.min(pt.ramp.length - 1, Math.max(0, Math.floor((pt.life / pt.maxLife) * pt.ramp.length)));
        fillRect(mainFb, Math.round(pt.x), Math.round(pt.y), 2, 2, pt.ramp[idx]);
      }
    }
    for (const fl of game.floats) {
      drawCentered5x7(mainFb, fl.text, fl.x, Math.round(fl.y), fl.topCol, fl.botCol, COL_BLACK, 1);
    }

    // 12. SCUMM Overhead Character Speech Subtitle (5x7 Pixel-Outlined Font w/ 2-Line Wrap!)
    if (game.portrait.quipTimer > 0 && game.portrait.quipText) {
      const words = game.portrait.quipText.split(' ');
      const lines = [];
      let cur = '';
      for (const w of words) {
        const next = cur ? `${cur} ${w}` : w;
        if (next.length <= 36) cur = next;
        else { if (cur) lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const baseY = game.mode === 'MENU' ? (lines.length > 1 ? 123 : 131) : 10;
      for (let li = 0; li < lines.length; li++) {
        drawCentered5x7(mainFb, lines[li], 128, baseY + li * 9, game.portrait.quipColorTop, game.portrait.quipColorBot, COL_BLACK, 1);
      }
    }

    // 13. Mode Overlays (Main Menu over live mosaic, Pause, Stage Clear, Game Over, Victory)
    if (game.mode === 'MENU') {
      renderMenuOverlay(lvl);
    } else if (game.paused) {
      drawBevelBox(mainFb, 58, 82, 140, 36, RAMP.TWILIGHT[1], RAMP.GOLD[14], RAMP.GOLD[9], RAMP.WOOD[3]);
      drawCentered5x7(mainFb, 'GAME PAUSED', 128, 90, RAMP.GOLD[15], RAMP.GOLD[11]);
      drawCentered5x7(mainFb, 'PRESS P TO RESUME', 128, 103, COL_WHITE, RAMP.CYAN[12]);
    } else if (game.mode === 'STAGE_CLEAR') {
      drawBevelBox(mainFb, 42, 82, 172, 36, RAMP.TWILIGHT[1], RAMP.GOLD[15], RAMP.GOLD[10], RAMP.WOOD[4]);
      drawCentered5x7(mainFb, `STAGE ${String(game.stageIdx + 1).padStart(2, '0')} CLEARED!`, 128, 90, RAMP.GOLD[15], RAMP.LAVA[12]);
      drawCentered5x7(mainFb, 'SAILING TO NEXT STAGE', 128, 103, COL_WHITE, RAMP.TEAL[12]);
    } else if (game.mode === 'GAME_OVER') {
      drawBevelBox(mainFb, 34, 76, 188, 48, RAMP.RUBY[1], RAMP.RUBY[13], RAMP.GOLD[10], RAMP.RUBY[4]);
      drawCentered5x7(mainFb, 'VOYAGE ENDED!', 128, 84, RAMP.RUBY[14], RAMP.LAVA[11]);
      drawCentered5x7(mainFb, `FINAL SCORE: ${String(game.score).padStart(7, '0')}`, 128, 96, COL_WHITE, RAMP.GOLD[13]);
      drawCentered5x7(mainFb, 'SPACE/CLICK FOR MENU', 128, 109, RAMP.GOLD[15], RAMP.GOLD[11]);
    } else if (game.mode === 'VICTORY') {
      drawBevelBox(mainFb, 22, 64, 212, 68, RAMP.TWILIGHT[1], RAMP.GOLD[15], RAMP.ECTO[12], RAMP.WOOD[4]);
      drawCentered5x7(mainFb, 'CONGRATULATIONS!', 128, 72, RAMP.GOLD[15], RAMP.LAVA[13]);
      drawCentered5x7(mainFb, 'LECHUCK IS BANISHED!', 128, 84, RAMP.ECTO[14], RAMP.TEAL[11]);
      drawCentered5x7(mainFb, `TREASURE: ${String(game.score).padStart(7, '0')}`, 128, 98, COL_WHITE, RAMP.GOLD[13]);
      drawCentered5x7(mainFb, 'SPACE/CLICK TO PLAY AGAIN', 128, 114, RAMP.CYAN[14], RAMP.CYAN[10]);
    }
  }

  function renderMenuOverlay(lvl) {
    // Top Sculpted Marquee Plaque (keeps center brick mosaic & live scenery uncovered!)
    drawBevelBox(mainFb, 12, 9, 232, 27, RAMP.WOOD[1], RAMP.GOLD[14], RAMP.GOLD[9], RAMP.WOOD[4]);
    drawCentered5x7(mainFb, 'ARKANOID: SCUMM & iMUSE', 128, 13, RAMP.GOLD[15], RAMP.LAVA[12]);
    drawCentered5x7(mainFb, '1992 VGA + YAMAHA OPL2 EDITION', 128, 24, RAMP.CYAN[14], RAMP.TEAL[10]);

    // Bottom Stage-Select & Jukebox Command Bar (y = 142..196)
    drawBevelBox(mainFb, 12, 143, 232, 52, RAMP.TWILIGHT[1], RAMP.GOLD[13], RAMP.WOOD[8], RAMP.TWILIGHT[3]);
    const stgStr = `< ${String(game.stageIdx + 1).padStart(2, '0')}/33: ${lvl.name} >`;
    drawCentered5x7(mainFb, stgStr, 128, 148, RAMP.GOLD[15], RAMP.GOLD[11]);

    drawCentered5x7(mainFb, 'LEFT/RIGHT: STAGES  1-7: iMUSE', 128, 171, COL_WHITE, RAMP.SLATE[10]);
    if ((Math.floor(game.time * 3) & 1) === 0) {
      drawCentered5x7(mainFb, 'SPACE OR CLICK TO LAUNCH!', 128, 183, RAMP.LAVA[15], RAMP.GOLD[12]);
    }
  }

  // Right-Hand 64x200 SCUMM Sidebar HUD (x = 256..319)
  function renderScummSidebar() {
    const lvl = LEVELS[game.stageIdx];
    const world = lvl.world;

    // Textured wood & brass sculpted sidebar background
    drawBevelBox(mainFb, HUD_X, 0, HUD_W, H, RAMP.WOOD[1], RAMP.GOLD[12], RAMP.WOOD[7], RAMP.WOOD[2]);
    paintRampGradient(mainFb, HUD_X + 2, 2, HUD_W - 4, H - 4, RAMP.WOOD.slice(0, 4), (nx, ny) => 0.25 + ((ny * 17) % 0.22));

    // 1. Live Animated 48x36 Character Portrait Box (x = 262..313, y = 3..42)
    drawBevelBox(mainFb, HUD_X + 6, 3, 52, 40, COL_BLACK, RAMP.GOLD[14], RAMP.GOLD[9], RAMP.WOOD[4]);
    const talkFrame = game.portrait.quipTimer > 0 ? ((Math.floor(game.time * 13) % 3)) : 0;
    renderPortraitToHud(mainFb, HUD_X + 8, 5, world, {
      blink: game.portrait.blinkDur > 0,
      talkFrame,
      mood: game.portrait.mood
    });

    // 2. 7-Digit Hi-Score & 1UP Score (5x7 Outlined Bitmap Font)
    drawCentered5x7(mainFb, 'HI-SCORE', HUD_X + 32, 45, RAMP.GOLD[14], RAMP.GOLD[9]);
    drawCentered5x7(mainFb, String(Math.min(9999999, game.hiScore)).padStart(7, '0'), HUD_X + 32, 54, COL_WHITE, RAMP.SLATE[11]);

    drawCentered5x7(mainFb, '1UP SCORE', HUD_X + 32, 64, RAMP.CYAN[14], RAMP.CYAN[9]);
    drawCentered5x7(mainFb, String(Math.min(9999999, game.score)).padStart(7, '0'), HUD_X + 32, 73, RAMP.GOLD[15], RAMP.GOLD[11]);

    // 3. Stage XX/33
    drawCentered5x7(mainFb, `STG ${String(game.stageIdx + 1).padStart(2, '0')}/33`, HUD_X + 32, 84, RAMP.ECTO[14], RAMP.TEAL[10]);

    // 4. Mini-Paddle Lives (y = 94..102)
    const shownLives = Math.min(5, Math.max(0, game.lives));
    for (let i = 0; i < shownLives; i++) {
      const lx = HUD_X + 5 + i * 11;
      drawBevelBox(mainFb, lx, 95, 10, 5, RAMP.SLATE[11], COL_WHITE, RAMP.RUBY[12], RAMP.SLATE[4]);
    }

    // 5. Active World Mechanic Gauge (y = 103..127)
    drawBevelBox(mainFb, HUD_X + 3, 103, 58, 24, RAMP.SLATE[1], RAMP.GOLD[11], RAMP.WOOD[6], COL_BLACK);
    const mInfo = WORLD_INFO[world];
    drawCentered5x7(mainFb, mInfo.mechTitle, HUD_X + 32, 106, RAMP.GOLD[14], RAMP.LAVA[11]);

    if (world === 0) {
      // Sword Duel Parry Meter
      fillRect(mainFb, HUD_X + 7, 117, 50, 6, RAMP.SLATE[2]);
      const wFill = Math.round((game.mech.duelCharge / 100) * 48);
      fillRect(mainFb, HUD_X + 8, 118, wFill, 4, game.mech.duelOverdriveTimer > 0 ? RAMP.LAVA[14] : RAMP.CYAN[12]);
    } else if (world === 1) {
      // Chron-o-John Era Indicator + Countdown Bar
      const eraTxt = game.mech.eraPhase === 1 ? '1780' : '2180';
      drawText5x7(mainFb, eraTxt, HUD_X + 7, 116, game.mech.eraPhase === 1 ? RAMP.PURPLE[14] : RAMP.CYAN[14], COL_WHITE);
      const wBar = Math.max(1, Math.round((game.mech.eraTimer / 7.5) * 22));
      fillRect(mainFb, HUD_X + 34, 118, wBar, 4, RAMP.SLIME[13]);
    } else if (world === 2) {
      // Atlantean Idol Dart Cooldown Bar
      fillRect(mainFb, HUD_X + 7, 117, 50, 6, RAMP.TERRA[2]);
      const wFill = Math.round((1 - Math.max(0, game.mech.idolTimer) / 4.6) * 48);
      fillRect(mainFb, HUD_X + 8, 118, wFill, 4, RAMP.LAVA[13]);
    } else if (world === 3) {
      // Gravity Vortex Flux Meter
      fillRect(mainFb, HUD_X + 7, 117, 50, 6, RAMP.INDIGO[2]);
      const pulse = Math.round((0.55 + Math.sin(game.time * 5) * 0.4) * 48);
      fillRect(mainFb, HUD_X + 8, 118, pulse, 4, RAMP.CYAN[13]);
    } else if (world === 4) {
      // Loom 4-Note Draft Slots
      for (let s = 0; s < 4; s++) {
        const ch = game.mech.loomNotes[s] || '-';
        drawText5x7(mainFb, ch, HUD_X + 9 + s * 12, 116, ch === '-' ? RAMP.SLATE[6] : RAMP.GOLD[15], RAMP.CYAN[13]);
      }
    } else if (world === 5) {
      // Highway Patrol Radar Dot
      fillRect(mainFb, HUD_X + 7, 118, 50, 4, RAMP.SLATE[3]);
      const dotX = HUD_X + 30 + Math.round((game.formationRange ? game.formationX / game.formationRange : 0) * 20);
      fillRect(mainFb, dotX, 117, 4, 6, RAMP.GOLD[15]);
    } else {
      // LeChuck Boss HP Gauge
      fillRect(mainFb, HUD_X + 7, 117, 50, 6, RAMP.LAVA[2]);
      const wHp = Math.round((game.boss.hp / game.boss.maxHp) * 48);
      fillRect(mainFb, HUD_X + 8, 118, wHp, 4, game.boss.hp <= 12 ? RAMP.LAVA[14] : RAMP.ECTO[13]);
    }

    // 6. Active Power-up Badges (L, E, C, S, P — y = 130..148)
    const p = game.paddle;
    const badgeDefs = [
      ['L', p.laserTimer / 18,    RAMP.RUBY[13]],
      ['E', p.expandTimer / 20,   RAMP.GOLD[14]],
      ['C', p.catchTimer / 20,    RAMP.ECTO[13]],
      ['S', p.slowTimer / 15,     RAMP.CYAN[13]],
      ['P', p.goldFlashTimer / 6, RAMP.LAVA[14]]
    ];
    for (let i = 0; i < 5; i++) {
      const [letter, ratio, activeCol] = badgeDefs[i];
      const bx = HUD_X + 4 + i * 11;
      const on = ratio > 0;
      drawBevelBox(mainFb, bx, 130, 11, 13, on ? RAMP.SLATE[3] : RAMP.SLATE[1], on ? activeCol : RAMP.SLATE[5], RAMP.SLATE[4], COL_BLACK);
      drawText5x7(mainFb, letter, bx + 3, 132, on ? COL_WHITE : RAMP.SLATE[5], on ? activeCol : RAMP.SLATE[4]);
      if (on) {
        hline(mainFb, bx + 1, 141, Math.max(1, Math.round(Math.min(1, ratio) * 9)), activeCol);
      }
    }

    // 7. Live Scrolling iMUSE Soundtrack + Active-Stem Marquee & 6-Channel VU (y = 146..183)
    drawBevelBox(mainFb, HUD_X + 3, 146, 58, 38, COL_BLACK, RAMP.TEAL[10], RAMP.TEAL[6], RAMP.SLATE[2]);
    const mText = AudioEngine.getStatusText();
    const fullText = mText + mText;
    const clipBox = { x0: HUD_X + 5, y0: 148, x1: HUD_X + 59, y1: 158 };
    drawText5x7(mainFb, fullText, HUD_X + 5 - Math.floor(game.marqueePx), 149, RAMP.TEAL[14], RAMP.CYAN[11], COL_BLACK, 1, clipBox);

    // 6 Live OPL2/iMUSE Stem Spectrum Bars (LD1, LD2, HARM, BASS, DRUM, OVERDRIVE)
    const vuCols = [RAMP.CYAN[13], RAMP.TEAL[13], RAMP.GOLD[13], RAMP.PURPLE[12], RAMP.RUBY[12], RAMP.LAVA[14]];
    for (let c = 0; c < 6; c++) {
      const vx = HUD_X + 7 + c * 9;
      fillRect(mainFb, vx, 160, 6, 20, RAMP.SLATE[1]);
      const hBar = AudioEngine.isMuted() ? 0 : Math.min(20, Math.round(AudioEngine.vuLevels[c] * 20));
      for (let py = 0; py < hBar; py += 2) {
        hline(mainFb, vx + 1, 179 - py, 4, py > 14 ? RAMP.GOLD[15] : vuCols[c]);
      }
    }

    // 8. Clickable Micro-Status Controls (CRT / SND / PSE — y = 186..196)
    drawText5x7(mainFb, 'CRT', HUD_X + 4,  188, game.crtEnabled ? RAMP.ECTO[14] : RAMP.SLATE[6], game.crtEnabled ? RAMP.TEAL[10] : RAMP.SLATE[4]);
    drawText5x7(mainFb, AudioEngine.isMuted() ? 'MUT' : 'SND', HUD_X + 24, 188, AudioEngine.isMuted() ? RAMP.RUBY[13] : RAMP.GOLD[14], RAMP.GOLD[9]);
    drawText5x7(mainFb, 'PSE', HUD_X + 44, 188, game.paused ? RAMP.LAVA[14] : RAMP.SLATE[10], RAMP.SLATE[7]);
  }

  // =========================================================================
  // 14. MAIN ANIMATION LOOP & BOOTSTRAP
  // =========================================================================
  loadStage(0, false);

  let lastTs = performance.now();
  function frameLoop(now) {
    const rawDt = Math.min(0.05, Math.max(0.001, (now - lastTs) / 1000));
    lastTs = now;

    updateSimulation(rawDt);
    renderPlayfield();
    renderScummSidebar();

    let sx = 0, sy = 0;
    if (game.shakeTimer > 0) {
      sx = Math.round((Math.random() * 2 - 1) * game.shakeMag);
      sy = Math.round((Math.random() * 2 - 1) * game.shakeMag);
    }
    presentFramebuffer(sx, sy);
    requestAnimationFrame(frameLoop);
  }
  requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
