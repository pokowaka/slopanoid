<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCUMM-OID 320x200 — EGA Demoscene Framebuffer Arkanoid</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #14121d 0%, #050508 75%, #000000 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: monospace;
  }
  #bezel {
    position: relative;
    padding: 10px;
    background: #0b0b10;
    border: 2px solid #2a2a38;
    box-shadow: 0 0 40px rgba(0, 170, 255, 0.14), 0 18px 50px rgba(0, 0, 0, 0.9), inset 0 0 12px #000;
    border-radius: 6px;
  }
  canvas {
    display: block;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
    background: #000;
    cursor: none;
  }
</style>
</head>
<body>
<div id="bezel">
  <canvas id="screen" width="320" height="200"></canvas>
</div>
<script>
(() => {
  'use strict';

  // ============================================================================
  // 1. 320x200 SOFTWARE FRAMEBUFFER & EXACT 64-COLOR IBM EGA HARDWARE QUANTIZER
  // ============================================================================
  const W = 320;
  const H = 200;
  const PLAY_W = 256;
  const WALL = 8;
  const INNER_X0 = WALL;              // 8
  const INNER_X1 = PLAY_W - WALL;     // 248 (width = 240 = 30 * 8)
  const INNER_Y0 = WALL;              // 8   (height = 192)
  const HUD_X = 256;                  // 256..319 (width = 64)
  const BG_W = 288;                   // Wide parallax overscan buffer
  const BG_H = 192;

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
  ctx.imageSmoothingEnabled = false;
  const imageData = ctx.createImageData(W, H);
  const fb = new Uint32Array(imageData.data.buffer);

  function updateCanvasScale() {
    const maxW = Math.max(320, window.innerWidth - 28);
    const maxH = Math.max(200, window.innerHeight - 28);
    const scale = Math.max(1, Math.floor(Math.min(maxW / W, maxH / H)));
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
  }
  window.addEventListener('resize', updateCanvasScale);
  updateCanvasScale();

  // Detect endianness once for packed 32-bit Uint32 pixel writes
  const IS_LITTLE_ENDIAN = (() => {
    const b = new ArrayBuffer(4);
    const u8 = new Uint8Array(b);
    const u32 = new Uint32Array(b);
    u32[0] = 0x0a0b0c0d;
    return u8[0] === 0x0d;
  })();

  function packRGBA(r, g, b) {
    return IS_LITTLE_ENDIAN
      ? ((0xFF000000 | (b << 16) | (g << 8) | r) >>> 0)
      : (((r << 24) | (g << 16) | (b << 8) | 0xFF) >>> 0);
  }

  // All 64 exact IBM EGA hardware palette registers (2 bits/channel: 0, 85, 170, 255)
  // Indexed by (r2 << 4) | (g2 << 2) | b2 where r2,g2,b2 in 0..3
  const EGA_PALETTE = new Uint32Array(64);
  const EGA_RGB = new Uint8Array(64 * 3);
  const EGA_STEPS = [0, 85, 170, 255];
  for (let i = 0; i < 64; i++) {
    const r = EGA_STEPS[(i >> 4) & 3];
    const g = EGA_STEPS[(i >> 2) & 3];
    const b = EGA_STEPS[i & 3];
    EGA_PALETTE[i] = packRGBA(r, g, b);
    EGA_RGB[i * 3] = r;
    EGA_RGB[i * 3 + 1] = g;
    EGA_RGB[i * 3 + 2] = b;
  }

  function egaIdx(r2, g2, b2) {
    return ((r2 & 3) << 4) | ((g2 & 3) << 2) | (b2 & 3);
  }
  function egaCol(r2, g2, b2) {
    return EGA_PALETTE[egaIdx(r2, g2, b2)];
  }

  // Canonical 4x4 Bayer ordered dithering matrix (0..15)
  const BAYER_4X4 = new Uint8Array([
     0,  8,  2, 10,
    12,  4, 14,  6,
     3, 11,  1,  9,
    15,  7, 13,  5
  ]);

  // Fast L1-cached channel dither LUT: (bayer16 << 8) | chan255 -> 0..3 EGA 2-bit level
  // Exact EGA levels (0, 85, 170, 255) have remainder 0 and stay 100% solid!
  const DITHER_CHAN_LUT = new Uint8Array(16 * 256);
  for (let b = 0; b < 16; b++) {
    const thresh = (2 * b + 1) * 85; // vs rem * 32
    for (let c = 0; c < 256; c++) {
      let q = (c / 85) | 0;
      const rem = c - q * 85;
      if (q < 3 && (rem * 32) > thresh) q++;
      DITHER_CHAN_LUT[(b << 8) | c] = q;
    }
  }

  function quantizeEgaIndex(r, g, b, x, y) {
    const rc = r < 0 ? 0 : (r > 255 ? 255 : (r | 0));
    const gc = g < 0 ? 0 : (g > 255 ? 255 : (g | 0));
    const bc = b < 0 ? 0 : (b > 255 ? 255 : (b | 0));
    const bayer = BAYER_4X4[((y & 3) << 2) | (x & 3)] << 8;
    return (DITHER_CHAN_LUT[bayer | rc] << 4) |
           (DITHER_CHAN_LUT[bayer | gc] << 2) |
           DITHER_CHAN_LUT[bayer | bc];
  }

  function quantizeEgaColor(r, g, b, x, y) {
    return EGA_PALETTE[quantizeEgaIndex(r, g, b, x, y)];
  }

  // Named EGA colors
  const C_BLACK   = egaCol(0, 0, 0);
  const C_DKGRAY  = egaCol(1, 1, 1);
  const C_LTGRAY  = egaCol(2, 2, 2);
  const C_WHITE   = egaCol(3, 3, 3);
  const C_DKBLUE  = egaCol(0, 0, 1);
  const C_BLUE    = egaCol(0, 1, 3);
  const C_CYAN    = egaCol(0, 3, 3);
  const C_LTCYAN  = egaCol(2, 3, 3);
  const C_RED     = egaCol(3, 0, 0);
  const C_LTRED   = egaCol(3, 1, 1);
  const C_ORANGE  = egaCol(3, 2, 0);
  const C_GOLD    = egaCol(3, 3, 0);
  const C_LTGOLD  = egaCol(3, 3, 2);
  const C_GREEN   = egaCol(0, 3, 0);
  const C_LIME    = egaCol(2, 3, 0);
  const C_EMERALD = egaCol(0, 2, 1);
  const C_PURPLE  = egaCol(2, 0, 3);
  const C_MAGENTA = egaCol(3, 1, 3);
  const C_INDIGO  = egaCol(1, 0, 2);

  // Artistic multi-stop RGB ramps for 3D lit EGA quantization (shadow -> mid -> highlight)
  const RAMPS = {
    R: [[55,0,25],   [145,0,20],  [225,25,25], [255,115,85], [255,235,215]], // Ruby Red
    O: [[65,15,0],   [155,55,0],  [235,115,0], [255,185,55], [255,245,190]], // Sunset Orange
    Y: [[70,40,0],   [165,110,0], [240,195,10],[255,245,95], [255,255,235]], // Pirate Gold
    G: [[0,45,15],   [0,115,25],  [20,185,35], [105,245,85], [215,255,205]], // Jungle Green
    E: [[0,55,30],   [15,140,60], [65,225,85], [165,255,115],[235,255,220]], // Scumm Lime
    C: [[0,45,75],   [0,115,155], [10,195,225],[110,245,255],[230,255,255]], // Caribbean Cyan
    B: [[0,15,75],   [10,50,155], [35,105,235],[110,175,255],[220,245,255]], // Melee Blue
    I: [[15,0,55],   [40,20,115], [75,55,185], [135,120,240],[220,215,255]], // Loom Indigo
    V: [[45,0,65],   [105,15,145],[170,45,225],[220,125,255],[250,225,255]], // Tentacle Violet
    M: [[65,0,50],   [150,10,115],[230,45,185],[255,135,225],[255,235,250]], // Neon Magenta
    W: [[65,70,90],  [135,140,160],[200,205,220],[240,242,250],[255,255,255]],// Ivory / Bone
    S: [[35,45,60],  [85,95,115], [145,160,180],[205,218,235],[255,255,255]], // Brushed Silver
    D: [[15,18,28],  [42,48,65],  [78,86,108], [125,135,160],[195,205,225]], // Dark Iron
    N: [[40,15,5],   [95,42,12],  [150,78,28], [205,125,65], [245,195,140]], // Mahogany Wood
    T: [[65,45,20],  [130,98,52], [190,155,95],[235,205,145],[255,245,210]], // Parchment Tan
    F: [[75,25,25],  [150,70,55], [215,125,95],[250,185,150],[255,235,220]], // Coral / Flesh
    K: [[5,5,12],    [22,24,38],  [48,52,72],  [88,95,120],  [165,175,205]], // Obsidian
    A: [[60,30,0],   [135,75,10], [205,135,25],[250,198,75], [255,248,195]], // Orichalcum Brass
    STEEL: [[20,28,45],[68,80,105],[130,145,172],[200,215,238],[255,255,255]],
    ARMOR3:[[45,35,20],[105,85,55],[168,142,98],[225,200,150],[255,250,225]],
    ARMOR2:[[40,28,35],[95,72,78], [152,122,125],[215,180,175],[255,235,230]],
    ARMOR1:[[55,15,15],[120,40,35],[185,85,65], [245,155,105],[255,235,190]],
    GROG:  [[0,40,10], [10,115,15],[55,205,20], [155,255,55], [240,255,195]],
    GHOST: [[0,45,40], [15,115,95],[55,195,155],[140,250,205],[235,255,245]],
    FIRE:  [[85,0,0],  [180,25,0], [245,105,0], [255,205,35], [255,255,200]]
  };

  function sampleRampRGB(ramp, t) {
    const tc = t <= 0 ? 0 : (t >= 1 ? 1 : t);
    const scaled = tc * (ramp.length - 1);
    const idx = Math.min(ramp.length - 2, scaled | 0);
    const f = scaled - idx;
    const a = ramp[idx];
    const b = ramp[idx + 1];
    return [
      a[0] + (b[0] - a[0]) * f,
      a[1] + (b[1] - a[1]) * f,
      a[2] + (b[2] - a[2]) * f
    ];
  }

  // ============================================================================
  // 2. FRAMEBUFFER BLITTERS & PROPORTIONAL 5x7 OUTLINED BITMAP FONT
  // ============================================================================
  function putPixel(x, y, col) {
    if (x >= 0 && x < W && y >= 0 && y < H) {
      fb[y * W + x] = col;
    }
  }

  function fillDitherRect(x0, y0, w, h, r, g, b) {
    const xStart = Math.max(0, x0 | 0);
    const yStart = Math.max(0, y0 | 0);
    const xEnd = Math.min(W, (x0 + w) | 0);
    const yEnd = Math.min(H, (y0 + h) | 0);
    for (let y = yStart; y < yEnd; y++) {
      let row = y * W;
      for (let x = xStart; x < xEnd; x++) {
        fb[row + x] = quantizeEgaColor(r, g, b, x, y);
      }
    }
  }

  function fillSolidRect(x0, y0, w, h, col) {
    const xStart = Math.max(0, x0 | 0);
    const yStart = Math.max(0, y0 | 0);
    const xEnd = Math.min(W, (x0 + w) | 0);
    const yEnd = Math.min(H, (y0 + h) | 0);
    for (let y = yStart; y < yEnd; y++) {
      fb.fill(col, y * W + xStart, y * W + xEnd);
    }
  }

  function drawBevelBox(x0, y0, w, h, rBg, gBg, bBg, colTopLeft, colBotRight) {
    fillDitherRect(x0 + 1, y0 + 1, w - 2, h - 2, rBg, gBg, bBg);
    fillSolidRect(x0, y0, w, 1, colTopLeft);
    fillSolidRect(x0, y0, 1, h, colTopLeft);
    fillSolidRect(x0, y0 + h - 1, w, 1, colBotRight);
    fillSolidRect(x0 + w - 1, y0, 1, h, colBotRight);
  }

  // Blit compiled Uint32Array sprite with optional playfield clipping
  function blitSprite(spr, dx, dy, clipPlayfield = false, flashWhite = false) {
    const sw = spr.w;
    const sh = spr.h;
    const data = spr.data;
    const x0 = dx | 0;
    const y0 = dy | 0;
    const minX = clipPlayfield ? INNER_X0 : 0;
    const maxX = clipPlayfield ? INNER_X1 : W;
    const minY = clipPlayfield ? INNER_Y0 : 0;
    const maxY = clipPlayfield ? H : H;

    const sxStart = x0 < minX ? minX - x0 : 0;
    const syStart = y0 < minY ? minY - y0 : 0;
    const sxEnd = (x0 + sw) > maxX ? maxX - x0 : sw;
    const syEnd = (y0 + sh) > maxY ? maxY - y0 : sh;
    if (sxStart >= sxEnd || syStart >= syEnd) return;

    for (let sy = syStart; sy < syEnd; sy++) {
      const dstRow = (y0 + sy) * W + x0;
      const srcRow = sy * sw;
      for (let sx = sxStart; sx < sxEnd; sx++) {
        const px = data[srcRow + sx];
        if (px !== 0) {
          fb[dstRow + sx] = flashWhite ? (px === C_BLACK ? C_DKGRAY : C_WHITE) : px;
        }
      }
    }
  }

  // Bayer-stippled fade blitter for afterimage trails & ghosts (density 0..15)
  function blitSpriteStipple(spr, dx, dy, density, tintCol = 0, clipPlayfield = true) {
    const sw = spr.w;
    const sh = spr.h;
    const data = spr.data;
    const x0 = dx | 0;
    const y0 = dy | 0;
    const minX = clipPlayfield ? INNER_X0 : 0;
    const maxX = clipPlayfield ? INNER_X1 : W;
    const minY = clipPlayfield ? INNER_Y0 : 0;
    for (let sy = 0; sy < sh; sy++) {
      const py = y0 + sy;
      if (py < minY || py >= H) continue;
      const dstRow = py * W;
      const srcRow = sy * sw;
      for (let sx = 0; sx < sw; sx++) {
        const px = x0 + sx;
        if (px < minX || px >= maxX) continue;
        const col = data[srcRow + sx];
        if (col !== 0 && col !== C_BLACK) {
          if (BAYER_4X4[((py & 3) << 2) | (px & 3)] < density) {
            fb[dstRow + px] = tintCol || col;
          }
        }
      }
    }
  }

  // Full Proportional 5x7 ASCII Bitmap Font (7 rows of 5-bit patterns, MSB on left)
  const FONT_RAW = {
    ' ': [0,0,0,0,0,0,0],
    '!': [4,4,4,4,4,0,4],
    '"': [10,10,4,0,0,0,0],
    '#': [10,31,10,10,31,10,0],
    '$': [4,15,20,14,5,30,4],
    '%': [25,25,2,4,8,19,19],
    '&': [12,18,20,8,21,18,13],
    '\'':[4,4,2,0,0,0,0],
    '(': [2,4,8,8,8,4,2],
    ')': [8,4,2,2,2,4,8],
    '*': [0,21,14,31,14,21,0],
    '+': [0,4,4,31,4,4,0],
    ',': [0,0,0,0,4,4,8],
    '-': [0,0,0,14,0,0,0],
    '.': [0,0,0,0,0,4,4],
    '/': [1,2,2,4,8,8,16],
    '0': [14,17,19,21,25,17,14],
    '1': [4,12,4,4,4,4,14],
    '2': [14,17,1,6,8,16,31],
    '3': [30,1,2,14,1,17,14],
    '4': [2,6,10,18,31,2,2],
    '5': [31,16,30,1,1,17,14],
    '6': [6,8,16,30,17,17,14],
    '7': [31,1,2,4,8,8,8],
    '8': [14,17,17,14,17,17,14],
    '9': [14,17,17,15,1,2,12],
    ':': [0,4,4,0,4,4,0],
    ';': [0,4,0,0,4,4,8],
    '<': [2,4,8,16,8,4,2],
    '=': [0,0,31,0,31,0,0],
    '>': [8,4,2,1,2,4,8],
    '?': [14,17,1,6,4,0,4],
    '@': [14,17,23,21,23,16,14],
    'A': [14,17,17,31,17,17,17],
    'B': [30,17,17,30,17,17,30],
    'C': [14,17,16,16,16,17,14],
    'D': [30,17,17,17,17,17,30],
    'E': [31,16,16,30,16,16,31],
    'F': [31,16,16,30,16,16,16],
    'G': [14,17,16,23,17,17,15],
    'H': [17,17,17,31,17,17,17],
    'I': [14,4,4,4,4,4,14],
    'J': [7,2,2,2,18,18,12],
    'K': [17,18,20,24,20,18,17],
    'L': [16,16,16,16,16,16,31],
    'M': [17,27,21,21,17,17,17],
    'N': [17,25,21,19,17,17,17],
    'O': [14,17,17,17,17,17,14],
    'P': [30,17,17,30,16,16,16],
    'Q': [14,17,17,17,21,18,13],
    'R': [30,17,17,30,20,18,17],
    'S': [15,16,16,14,1,1,30],
    'T': [31,4,4,4,4,4,4],
    'U': [17,17,17,17,17,17,14],
    'V': [17,17,17,17,17,10,4],
    'W': [17,17,17,21,21,27,17],
    'X': [17,17,10,4,10,17,17],
    'Y': [17,17,10,4,4,4,4],
    'Z': [31,1,2,4,8,16,31],
    '[': [14,8,8,8,8,8,14],
    '\\':[16,8,8,4,2,2,1],
    ']': [14,2,2,2,2,2,14],
    '^': [4,10,17,0,0,0,0],
    '_': [0,0,0,0,0,0,31],
    '`': [8,4,2,0,0,0,0],
    '~': [3,7,5,5,13,27,24] // Musical eighth-note glyph!
  };

  // Precompute trimmed proportional glyph bounds for every ASCII char
  const FONT_GLYPHS = {};
  for (const ch in FONT_RAW) {
    const rows = FONT_RAW[ch];
    if (ch === ' ') {
      FONT_GLYPHS[ch] = { rows, left: 0, width: 3 };
      continue;
    }
    let minBit = 5, maxBit = -1;
    for (let r = 0; r < 7; r++) {
      const bits = rows[r];
      for (let b = 0; b < 5; b++) {
        if ((bits >> (4 - b)) & 1) {
          if (b < minBit) minBit = b;
          if (b > maxBit) maxBit = b;
        }
      }
    }
    if (maxBit < minBit) {
      FONT_GLYPHS[ch] = { rows, left: 0, width: 3 };
    } else {
      FONT_GLYPHS[ch] = { rows, left: minBit, width: maxBit - minBit + 1 };
    }
  }

  function getGlyph(ch) {
    if (FONT_GLYPHS[ch]) return FONT_GLYPHS[ch];
    const up = ch.toUpperCase();
    return FONT_GLYPHS[up] || FONT_GLYPHS['?'];
  }

  function measureText(str, scale = 1, monoDigits = false) {
    let total = 0;
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      const isDigit = monoDigits && ch >= '0' && ch <= '9';
      const gw = isDigit ? 5 : getGlyph(ch).width;
      total += (gw + 1) * scale;
    }
    return total > 0 ? total - scale : 0;
  }

  // Blit proportional 5x7 text directly into fb with 1px 8-neighbor black outline & 1x/2x/3x scale
  function drawText(str, x, y, colTop, scale = 1, opts = {}) {
    const colBot = opts.colBot || colTop;
    const outlineCol = opts.outlineCol !== undefined ? opts.outlineCol : C_BLACK;
    const monoDigits = !!opts.monoDigits;
    const clipX0 = opts.clipX0 !== undefined ? opts.clipX0 : 0;
    const clipX1 = opts.clipX1 !== undefined ? opts.clipX1 : W;
    let cx = x | 0;
    const cy = y | 0;

    // Pass 1: 1px 8-neighbor black outline
    let ox = cx;
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      const g = getGlyph(ch);
      const isDigit = monoDigits && ch >= '0' && ch <= '9';
      const left = isDigit ? 0 : g.left;
      const gw = isDigit ? 5 : g.width;
      if (ch !== ' ' && ox + gw * scale + 1 >= clipX0 && ox - 1 < clipX1) {
        for (let r = 0; r < 7; r++) {
          const rowBits = g.rows[r];
          if (!rowBits) continue;
          for (let c = 0; c < gw; c++) {
            if ((rowBits >> (4 - (left + c))) & 1) {
              const px0 = ox + c * scale;
              const py0 = cy + r * scale;
              for (let sy = -1; sy <= scale; sy++) {
                const py = py0 + sy;
                if (py < 0 || py >= H) continue;
                const rowIdx = py * W;
                for (let sx = -1; sx <= scale; sx++) {
                  const px = px0 + sx;
                  if (px >= clipX0 && px < clipX1) {
                    fb[rowIdx + px] = outlineCol;
                  }
                }
              }
            }
          }
        }
      }
      ox += (gw + 1) * scale;
    }

    // Pass 2: Crisp foreground glyph pixels
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      const g = getGlyph(ch);
      const isDigit = monoDigits && ch >= '0' && ch <= '9';
      const left = isDigit ? 0 : g.left;
      const gw = isDigit ? 5 : g.width;
      if (ch !== ' ' && cx + gw * scale >= clipX0 && cx < clipX1) {
        for (let r = 0; r < 7; r++) {
          const rowBits = g.rows[r];
          if (!rowBits) continue;
          const rowCol = r < 3 ? colTop : (r === 3 && opts.colMid ? opts.colMid : colBot);
          for (let c = 0; c < gw; c++) {
            if ((rowBits >> (4 - (left + c))) & 1) {
              const px0 = cx + c * scale;
              const py0 = cy + r * scale;
              for (let sy = 0; sy < scale; sy++) {
                const py = py0 + sy;
                if (py < 0 || py >= H) continue;
                const rowIdx = py * W;
                for (let sx = 0; sx < scale; sx++) {
                  const px = px0 + sx;
                  if (px >= clipX0 && px < clipX1) {
                    fb[rowIdx + px] = rowCol;
                  }
                }
              }
            }
          }
        }
      }
      cx += (gw + 1) * scale;
    }
  }

  function drawTextCentered(str, centerX, y, colTop, scale = 1, opts = {}) {
    const w = measureText(str, scale, opts.monoDigits);

  // ============================================================================
  // 3. PROCEDURAL HEIGHTMAP + SURFACE-NORMAL SPRITE COMPILER (compileLitSprite)
  // ============================================================================
  // Key light (-0.55, -0.60, 0.58) normalized + half-vector for specular
  const KEY_L = (() => {
    const lx = -0.55, ly = -0.60, lz = 0.58;
    const len = Math.hypot(lx, ly, lz);
    const nx = lx / len, ny = ly / len, nz = lz / len;
    const hx = nx, hy = ny, hz = nz + 1.0;
    const hlen = Math.hypot(hx, hy, hz);
    return { lx: nx, ly: ny, lz: nz, hx: hx / hlen, hy: hy / hlen, hz: hz / hlen };
  })();

  /**
   * Evaluates procedural heightmap + material ramp per pixel, computes finite-difference
   * surface normals lit by key light (-0.55, -0.60, 0.58), quantizes onto EGA palette
   * with Bayer 4x4 dithering, and stamps a 1px dark EGA outline around silhouette pixels.
   */
  function compileLitSprite(w, h, sampleFn, opts = {}) {
    const data = new Uint32Array(w * h);
    const heights = new Float32Array(w * h);
    const mask = new Uint8Array(w * h);
    const samples = new Array(w * h);
    const normalScale = opts.normalScale !== undefined ? opts.normalScale : 1.75;
    const outline8 = !!opts.outline8;
    const outlineColor = opts.outlineColor !== undefined ? opts.outlineColor : C_BLACK;

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const s = sampleFn(x, y, w, h);
        const idx = y * w + x;
        if (s) {
          mask[idx] = 1;
          heights[idx] = s.h !== undefined ? s.h : 0.5;
          samples[idx] = s;
        }
      }
    }

    const HAt = (x, y, fallback) => {
      if (x < 0 || x >= w || y < 0 || y >= h) return 0;
      const idx = y * w + x;
      return mask[idx] ? heights[idx] : 0;
      void fallback;
    };

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const idx = y * w + x;
        if (!mask[idx]) continue;
        const s = samples[idx];
        if (s.directCol !== undefined) {
          data[idx] = s.directCol;
          continue;
        }
        const hc = heights[idx];
        const hl = HAt(x - 1, y, hc);
        const hr = HAt(x + 1, y, hc);
        const hu = HAt(x, y - 1, hc);
        const hd = HAt(x, y + 1, hc);

        const dhdx = (hr - hl) * 0.5 * normalScale;
        const dhdy = (hd - hu) * 0.5 * normalScale;
        const invLen = 1.0 / Math.hypot(dhdx, dhdy, 1.0);
        const nx = -dhdx * invLen;
        const ny = -dhdy * invLen;
        const nz = invLen;

        const diff = Math.max(0, nx * KEY_L.lx + ny * KEY_L.ly + nz * KEY_L.lz);
        const ndoth = Math.max(0, nx * KEY_L.hx + ny * KEY_L.hy + nz * KEY_L.hz);
        const shininess = s.shininess !== undefined ? s.shininess : 18.0;
        const specStr = s.spec !== undefined ? s.spec : 0.48;
        const spec = Math.pow(ndoth, shininess) * specStr;
        const emissive = s.emissive || 0;

        const shade = Math.min(1, Math.max(0, 0.14 + diff * 0.78 + emissive));
        const rgb = sampleRampRGB(s.ramp || RAMPS.W, shade);
        const r = rgb[0] + spec * 230;
        const g = rgb[1] + spec * 230;
        const b = rgb[2] + spec * 240;
        data[idx] = quantizeEgaColor(r, g, b, x, y);
      }
    }

    // Automatic 1px dark EGA outline pass around every non-transparent silhouette pixel
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const idx = y * w + x;
        if (mask[idx]) continue;
        let touches = false;
        if ((x > 0 && mask[idx - 1]) ||
            (x + 1 < w && mask[idx + 1]) ||
            (y > 0 && mask[idx - w]) ||
            (y + 1 < h && mask[idx + w])) {
          touches = true;
        } else if (outline8) {
          if ((x > 0 && y > 0 && mask[idx - w - 1]) ||
              (x + 1 < w && y > 0 && mask[idx - w + 1]) ||
              (x > 0 && y + 1 < h && mask[idx + w - 1]) ||
              (x + 1 < w && y + 1 < h && mask[idx + w + 1])) {
            touches = true;
          }
        }
        if (touches) {
          data[idx] = outlineColor;
        }
      }
    }

    return { w, h, data };
  }

  // ============================================================================
  // 3B. PRE-COMPILE ALL BRICKS, CAPSULES, BALLS, VAUS MORPHS & LECHUCK BOSS
  // ============================================================================
  // Bricks sit on an 8x6 grid; compiled as 9x7 sprites (blitted at bx-1, by-1)
  // so the 7x5 3D beveled body has a complete 4-sided 1px dark EGA outline!
  function beveledBrickHeight(lx, ly) {
    // lx in 0..6, ly in 0..4
    const dx = Math.min(lx, 6 - lx);
    const dy = Math.min(ly, 4 - ly);
    const edge = Math.min(dx * 0.42, dy * 0.48, 0.55);
    return 0.25 + edge + (ly === 1 && lx >= 1 && lx <= 4 ? 0.08 : 0);

  const BRICK_SPRITES = {};

    let h = beveledBrickHeight(lx, ly);
    const b1x = (2 + frame) % 5 + 1;
    const b1y = (4 - frame + 4) % 3 + 1;
    const b2x = (5 - frame + 5) % 5 + 1;
    const b2y = (2 + frame) % 3 + 1;

  }, { outline8: true }));

        if (mouth) return { h: 0.05, ramp: RAMPS.K, shininess: 8, spec: 0.1 };

    E: ['1111','1...','111.','1...','1111'],
    C: ['.111','1...','1...','1...','.111'],

    L: RAMPS.R,
    E: RAMPS.Y,
    C: RAMPS.E,
    S: RAMPS.V,

  };

    '3': RAMPS.Y,
    '4': RAMPS.STEEL,
    '5': RAMPS.R,

  const CAPSULE_SPRITES = {};
  for (const type of ['L', 'E', 'C', 'S', 'P']) {

    const letBmp = CAPSULE_LETTERS[type];
    const bodyRamp = CAPSULE_BASE_RAMPS[type];
    CAPSULE_SPRITES[type] = [0, 1].map((shimmer) => compileLitSprite(18, 9, (x, y) => {

      if (x < 1 || x > 16 || y < 1 || y > 7) return null;
      if ((x === 1 || x === 16) && (y === 1 || y === 7)) return null;

  const POISON_DART_SPRITE = compileLitSprite(5, 9, (x, y) => {

  // ============================================================================
  // 4. PRE-BAKED 288x192 MULTI-LAYER BACKDROPS & PER-SCANLINE RASTER EFFECTS
  // ============================================================================
  const TRANSPARENT_IDX = 255;
  const WORLD_BACKDROPS = [];

  // Deterministic pseudo-random helper for crisp procedural world art
  function hash2D(x, y, seed = 1) {
    let n = (x * 374761393 + y * 668265263 + seed * 1442695041) | 0;
    n = (n ^ (n >>> 13)) * 1274126177;
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }

  function bakeAllWorlds() {
    for (let wId = 0; wId < 7; wId++) {
      const far = new Uint8Array(BG_W * BG_H);
      const mid = new Uint8Array(BG_W * BG_H).fill(TRANSPARENT_IDX);
      const near = new Uint8Array(BG_W * BG_H).fill(TRANSPARENT_IDX);

      if (wId === 0) {
        // WORLD 1: MELEE ISLAND — Twilight sky, cratered moon, hilltop town & Scumm Bar
        for (let y = 0; y < BG_H; y++) {
          const t = Math.min(1, y / 142);
          const r = 8 + t * 55;
          const g = 6 + t * 28;
          const b = 52 + t * 95;
          for (let x = 0; x < BG_W; x++) {
            let idx = quantizeEgaIndex(r, g, b, x, y);
            if (y < 110 && hash2D(x, y, 11) > 0.992) {
              idx = hash2D(x, y, 12) > 0.5 ? egaIdx(3, 3, 3) : egaIdx(2, 2, 3);
            }
            // Cratered lit circular moon at (208, 36), radius 20
            const mdx = x - 208, mdy = y - 36;
            const mr2 = mdx * mdx + mdy * mdy;
            if (mr2 <= 400) {
              const mz = Math.sqrt(400 - mr2) / 20;
              const crater = (Math.hypot(mdx - 5, mdy + 4) < 5 || Math.hypot(mdx + 6, mdy - 5) < 4 || Math.hypot(mdx - 2, mdy - 8) < 3) ? -0.18 : 0;
              const shade = Math.min(1, Math.max(0.15, 0.35 + (-mdx * 0.025 - mdy * 0.025 + mz * 0.65) + crater));
              const mrgb = sampleRampRGB(RAMPS.W, shade);
              idx = quantizeEgaIndex(mrgb[0], mrgb[1], mrgb[2] + 15, x, y);
            }
            far[y * BG_W + x] = idx;
          }
        }
        // Mid layer: jagged misty Mêlée Island mountain ridges
        for (let x = 0; x < BG_W; x++) {
          const ridge = 108 - Math.round(Math.sin(x * 0.035) * 18 + Math.sin(x * 0.09 + 1.2) * 9 + Math.cos(x * 0.19) * 4);
          for (let y = ridge; y < 142; y++) {
            const shade = (y - ridge) / 40;
            mid[y * BG_W + x] = quantizeEgaIndex(12 + shade * 15, 14 + shade * 25, 48 + shade * 40, x, y);
          }
        }
        // Near layer: Hilltop pirate town silhouette, clocktower & warm glowing Scumm Bar windows!
        for (let x = 0; x < BG_W; x++) {
          const hill = 128 - Math.round(Math.max(0, Math.sin((x - 30) * 0.024)) * 22);
          const bldgId = (x / 14) | 0;
          const bx = x % 14;
          const hasHouse = bx >= 1 && bx <= 12 && (hash2D(bldgId, 1, 77) > 0.22);
          const roofH = hasHouse ? (8 + ((hash2D(bldgId, 2, 77) * 14) | 0)) : 0;
          const gable = hasHouse ? Math.max(0, 5 - Math.abs(bx - 6)) : 0;
          const topY = hill - roofH - gable;
          for (let y = Math.max(60, topY); y < 142; y++) {
            let idx = egaIdx(0, 0, 1);
            if (x > 165 && x < 235 && y > 122) idx = egaIdx(1, 0, 0); // Wooden Scumm Bar pier
            // Warm glowing Scumm Bar & town windows
            if (hasHouse && y > topY + 5 && y < 137 && ((bx === 4 || bx === 9) && ((y % 7) <= 3))) {
              if (hash2D(bldgId, (y / 7) | 0, 99) > 0.25) {
                idx = (y & 1) ? egaIdx(3, 3, 0) : egaIdx(3, 2, 0);
              }
            }
            near[y * BG_W + x] = idx;
          }
        }
      } else if (wId === 1) {
        // WORLD 2: EDISON MANSION — Stormy sky, crooked mansard roof towers, radioactive lab
        for (let y = 0; y < BG_H; y++) {
          const t = y / BG_H;
          for (let x = 0; x < BG_W; x++) {
            const swirl = Math.sin(x * 0.04 + Math.cos(y * 0.07) * 2.0) * 18;
            far[y * BG_W + x] = quantizeEgaIndex(28 + t * 35 + swirl, 8 + t * 55, 55 + (1 - t) * 65 + swirl, x, y);
          }
        }
        // Crooked mansard roof towers & tilted chimneys
        const towers = [{ cx: 52, w: 30, top: 44, tilt: -0.16 }, { cx: 142, w: 38, top: 34, tilt: 0.14 }, { cx: 228, w: 32, top: 48, tilt: -0.12 }];
        for (let y = 26; y < 158; y++) {
          for (let x = 0; x < BG_W; x++) {
            // Rolling haunted hills
            const hillY = 136 + Math.round(Math.sin(x * 0.03) * 10);
            if (y >= hillY) mid[y * BG_W + x] = quantizeEgaIndex(10, 28, 18, x, y);
            for (let ti = 0; ti < towers.length; ti++) {
              const tw = towers[ti];
              if (y < tw.top) continue;
              const dy = y - tw.top;
              const shiftX = cxShift(dy, tw.tilt);
              const dx = x - (tw.cx + shiftX);
              const flare = dy < 20 ? (tw.w * 0.35 + dy * 0.55) : (tw.w * 0.52 - Math.sin(dy * 0.05) * 2);
              if (Math.abs(dx) <= flare) {
                const isRoof = dy < 20;
                let col = isRoof
                  ? quantizeEgaIndex(45, 22, 68, x, y)
                  : quantizeEgaIndex(22, 32, 38, x, y);
                // Glowing crooked attic/lab windows
                if (!isRoof && (dy % 22 >= 7 && dy % 22 <= 15) && Math.abs(dx) >= 4 && Math.abs(dx) <= 10) {

                near[y * BG_W + x] = col;
              }

          }
        }
      } else if (wId === 2) {

        for (let y = 0; y < BG_H; y++) {
          for (let x = 0; x < BG_W; x++) {
            const bx = x % 24, by = y % 16;

            for (const px of [42, 246]) {
              if (Math.abs(x - px) <= 12) {
                const groove = Math.abs(x - px) <= 2;
                near[y * BG_W + x] = groove
                  ? egaIdx(3, 1, 0)
                  : quantizeEgaIndex(88 - Math.abs(x - px) * 4, 58 - Math.abs(x - px) * 3, 28, x, y);
              }
            }
          }
        }
      } else if (wId === 3) {
        // WORLD 4: SPACE COMBAT — Nebula dither + ringed gas-giant planet (Yavin)
        for (let y = 0; y < BG_H; y++) {
          for (let x = 0; x < BG_W; x++) {
            const neb = Math.max(0, Math.sin(x * 0.022 + y * 0.018) * Math.cos(x * 0.013 - y * 0.025));
            far[y * BG_W + x] = quantizeEgaIndex(neb * 42, neb * 14, 12 + neb * 68, x, y);
          }
        }
        // Dithered ringed gas-giant planet at (196, 56), radius 28 + tilted perspective ring!
        const pcx = 196, pcy = 56, pr = 27;
        for (let y = 12; y < 108; y++) {
          for (let x = 120; x < 272; x++) {
            const dx = x - pcx, dy = y - pcy;
            // Tilted ring coords
            const rx = dx * 0.94 + dy * 0.34;
            const ry = (-dx * 0.34 + dy * 0.94) * 3.2;
            const rr = Math.hypot(rx, ry);
            const inRing = rr >= 34 && rr <= 52;
            const inPlanet = (dx * dx + dy * dy) <= pr * pr;

            if (inRing && ry < 0) {
              // Back half of ring behind planet
              const band = 140 + Math.sin(rr * 0.9) * 45;
              mid[y * BG_W + x] = quantizeEgaIndex(band, band * 0.75, band * 0.5, x, y);
            }
            if (inPlanet) {
              const pz = Math.sqrt(pr * pr - dx * dx - dy * dy) / pr;
              const lit = Math.max(0.08, (-dx * 0.024 - dy * 0.02 + pz * 0.72));
              const band = Math.sin((dy + Math.sin(dx * 0.12) * 2) * 0.42) * 28;
              mid[y * BG_W + x] = quantizeEgaIndex((195 + band) * lit, (95 + band * 0.6) * lit, (55 + band * 0.3) * lit, x, y);
            }
            if (inRing && ry >= 0) {
              // Front half of ring crossing over planet
              const shadow = (dx > 6 && dy > 2) ? 0.35 : 1.0;
              const band = (155 + Math.sin(rr * 0.9) * 50) * shadow;
              mid[y * BG_W + x] = quantizeEgaIndex(band, band * 0.8, band * 0.55, x, y);
            }
          }
        }
      } else if (wId === 4) {
        // WORLD 5: LOOM — Starlit indigo aurora sky & crystalline guild spires
        for (let y = 0; y < BG_H; y++) {
          const t = y / 145;
          for (let x = 0; x < BG_W; x++) {
            const aurora = Math.max(0, Math.sin(x * 0.045 + Math.sin(y * 0.06) * 2.2) * (1 - t));
            let idx = quantizeEgaIndex(14 + t * 25, 10 + aurora * 95 + t * 35, 65 + aurora * 95 + t * 65, x, y);
            if (y < 110 && hash2D(x, y, 501) > 0.990) idx = egaIdx(3, 3, 3);
            far[y * BG_W + x] = idx;
          }
        }
        // Crystalline Guild Spires on floating island cliffs
        const spires = [48, 86, 144, 198, 240];
        for (let x = 0; x < BG_W; x++) {
          let top = 144;
          let spireOwner = -1;
          for (let si = 0; si < spires.length; si++) {
            const sx = spires[si];
            const hPeak = si === 2 ? 42 : (64 + (si & 1) * 14);
            const wHalf = si === 2 ? 22 : 14;
            const d = Math.abs(x - sx);
            if (d <= wHalf) {
              const sy = hPeak + Math.round(Math.pow(d / wHalf, 1.35) * (144 - hPeak));
              if (sy < top) { top = sy; spireOwner = si; }
            }
          }
          for (let y = top; y < 145; y++) {
            const facet = ((x - spires[spireOwner]) < 0) ? 1.25 : 0.72;
            near[y * BG_W + x] = quantizeEgaIndex(25 * facet, 125 * facet, 185 * facet, x, y);
          }
        }
      } else if (wId === 5) {
        // WORLD 6: SAM & MAX — Sunset desert mesas & roadside saguaro cacti
        for (let y = 0; y < BG_H; y++) {
          const t = Math.min(1, y / 136);
          const r = 95 + t * 160;
          const g = 18 + Math.pow(t, 1.4) * 165;
          const b = 85 * (1 - t) + 20;
          for (let x = 0; x < BG_W; x++) {
            far[y * BG_W + x] = quantizeEgaIndex(r, g, b, x, y);
          }
        }
        // Monument Valley flat-top desert mesas
        const mesas = [{ x0: 18, x1: 78, top: 88 }, { x0: 112, x1: 176, top: 76 }, { x0: 210, x1: 268, top: 92 }];
        for (let y = 74; y < 138; y++) {
          for (let x = 0; x < BG_W; x++) {
            for (const m of mesas) {
              const slope = Math.max(0, y - m.top) * 0.45;
              if (y >= m.top && x >= m.x0 - slope && x <= m.x1 + slope) {
                const band = ((y % 9) < 3) ? 1.15 : 0.9;
                mid[y * BG_W + x] = quantizeEgaIndex(145 * band, 58 * band, 32 * band, x, y);
              }
            }
          }
        }
      } else {
        // WORLD 7: LECHUCK'S LAIR — Volcanic cavern walls & jagged stalactites
        for (let y = 0; y < BG_H; y++) {
          const glow = Math.pow(y / BG_H, 2.1);
          for (let x = 0; x < BG_W; x++) {
            const rock = Math.sin(x * 0.08 + y * 0.05) * 16;
            far[y * BG_W + x] = quantizeEgaIndex(38 + glow * 165 + rock, 8 + glow * 48, 18 + (1 - glow) * 28, x, y);
          }
        }
        // Hanging volcanic stalactites & subterranean cavern ribs
        for (let x = 0; x < BG_W; x++) {
          const stalLen = 14 + Math.round(Math.pow(Math.abs(Math.sin(x * 0.14) * Math.cos(x * 0.05)), 0.7) * 44);
          for (let y = 0; y < stalLen; y++) {
            near[y * BG_W + x] = quantizeEgaIndex(55 + y * 1.5, 18, 22, x, y);
          }
        }
      }

      WORLD_BACKDROPS.push({ far, mid, near });
    }
  }

  function cxShift(dy, tilt) {
    return Math.round(dy * tilt);
  }
  bakeAllWorlds();

  // 3-Plane Parallax Starfield state (World 4) & Rising Volcanic Embers (World 7)
  const SPACE_STARS = Array.from({ length: 78 }, (_, i) => ({
    x: (hash2D(i, 1, 404) * 240) | 0,
    y: (hash2D(i, 2, 404) * 136) | 0,
    plane: (i % 3) + 1
  }));
  const LAIR_EMBERS = Array.from({ length: 42 }, (_, i) => ({
    x: hash2D(i, 3, 707) * 240,
    y: hash2D(i, 4, 707) * 180,
    spd: 0.35 + hash2D(i, 5, 707) * 0.75,
    phase: hash2D(i, 6, 707) * 6.28
  }));

  /**
   * Composites the active world's pre-baked 288x192 EGA layers with real-time
   * per-scanline demoscene raster effects directly into fb!
   */
  function renderWorldBackdrop(worldId, tick, paddleNormX, chronoEra) {
    const bd = WORLD_BACKDROPS[worldId];
    const t = tick / 60;
    // Parallax horizontal offsets within 288-wide overscan buffer (0..48 margin)
    const farScroll = Math.max(0, Math.min(48, Math.round(24 + (paddleNormX - 0.5) * 10)));
    const midScroll = Math.max(0, Math.min(48, Math.round(24 + (paddleNormX - 0.5) * 24)));
    const nearScroll = Math.max(0, Math.min(48, Math.round(24 + (paddleNormX - 0.5) * 40)));

    const lightningFlash = (worldId === 1 && ((tick % 260 >= 248 && tick % 260 <= 251) || tick % 260 === 255));

    for (let sy = 0; sy < BG_H; sy++) {
      const screenY = INNER_Y0 + sy;
      const dstRow = screenY * W + INNER_X0;

      // World 7 per-scanline volcanic heat-haze horizontal shimmer!
      const heatShift = worldId === 6
        ? Math.round(Math.sin(sy * 0.32 - t * 5.6) * (1.2 + sy * 0.008))
        : 0;

      // ---- Per-World Bottom Scanline Raster Zones ----
      if (worldId === 0 && sy >= 142) {
        // WORLD 1: Per-scanline sine-wave harbor water reflections of sky, moon & Scumm Bar!
        const depth = sy - 142; // 0..49
        const wave = Math.round(Math.sin(sy * 0.52 + t * 4.4) * (1.4 + depth * 0.09));
        const mirrorY = Math.max(8, Math.min(141, 141 - ((depth * 1.9) | 0)));
        const glint = Math.sin(sy * 0.9 - t * 6.2) > 0.82;
        for (let sx = 0; sx < 240; sx++) {
          const rxNear = Math.max(0, Math.min(BG_W - 1, nearScroll + sx + wave));
          const rxFar = Math.max(0, Math.min(BG_W - 1, farScroll + sx + wave));
          let srcIdx = bd.near[mirrorY * BG_W + rxNear];
          if (srcIdx === TRANSPARENT_IDX) srcIdx = bd.mid[mirrorY * BG_W + rxNear];
          if (srcIdx === TRANSPARENT_IDX) srcIdx = bd.far[mirrorY * BG_W + rxFar];
          const sr = EGA_RGB[srcIdx * 3] * 0.45;
          const sg = EGA_RGB[srcIdx * 3 + 1] * 0.55 + 12;
          const sb = EGA_RGB[srcIdx * 3 + 2] * 0.72 + 42 + (glint && ((sx + wave) % 13 === 0) ? 75 : 0);
          fb[dstRow + sx] = quantizeEgaColor(sr, sg, sb, INNER_X0 + sx, screenY);
        }
        continue;
      }

      if (worldId === 1 && sy >= 154) {
        // WORLD 2: Bubbling radioactive green sludge waves at bottom of Edison Mansion!
        const depth = sy - 154;
        const wave = Math.sin(sy * 0.4 + t * 5.0) * 3.0;
        for (let sx = 0; sx < 240; sx++) {
          const crest = Math.sin((sx + wave) * 0.12 + t * 3.8) * 3.5 + Math.cos(sx * 0.27 - t * 5.2) * 2.0;
          if (depth < 4 + crest * 0.5) {
            const fx = farScroll + sx;
            fb[dstRow + sx] = EGA_PALETTE[bd.far[sy * BG_W + fx]];
          } else {
            const foam = depth < 6.5 + crest * 0.5;
            const bubble = (((sx + ((t * 18) | 0)) % 23 === 0) && ((depth + ((t * 14) | 0)) % 9 < 3));
            const gVal = foam || bubble ? 245 : (115 + depth * 2.2);
            const rVal = foam || bubble ? 145 : 18;
            fb[dstRow + sx] = quantizeEgaColor(rVal, gVal, 20, INNER_X0 + sx, screenY);
          }
        }
        continue;
      }

      if (worldId === 3 && sy >= 132) {
        // WORLD 4: Scrolling perspective Death-Star trench scanlines!
        const dy = sy - 130; // 2..61
        const z = 420.0 / dy;
        const zScroll = (z + t * 58.0);
        const panelRib = ((zScroll | 0) & 15) < 2;
        for (let sx = 0; sx < 240; sx++) {
          const cx = sx - 120;
          const worldX = (cx * z) / 90.0 + (paddleNormX - 0.5) * 40;
          const inFloor = Math.abs(worldX) < 110;
          if (inFloor) {
            const laneLine = Math.abs(Math.abs(worldX) - 55) < 4 || Math.abs(worldX) < 2.5;
            const lum = (panelRib ? 88 : 46) + dy * 0.7 + (laneLine ? 45 : 0);
            fb[dstRow + sx] = quantizeEgaColor(lum * 0.85, lum * 0.92, lum * 1.15, INNER_X0 + sx, screenY);
          } else {
            // Perspective angled trench walls with turbo-laser ribs
            const wallRib = (((zScroll * 0.7) | 0) & 15) < 3;
            const lum = (wallRib ? 105 : 62) - Math.min(35, Math.abs(cx) * 0.15);
            fb[dstRow + sx] = quantizeEgaColor(lum * 0.9, lum * 0.95, lum * 1.1, INNER_X0 + sx, screenY);
          }
        }
        continue;
      }

      if (worldId === 4 && sy >= 145) {
        // WORLD 5: Shimmering emerald & turquoise Loom ocean waves!
        const depth = sy - 145;
        const wave = Math.sin(sy * 0.55 - t * 4.0) * (2.0 + depth * 0.08);
        for (let sx = 0; sx < 240; sx++) {
          const shimmer = Math.sin((sx + wave) * 0.14 + sy * 0.3 - t * 4.5);
          const r = shimmer > 0.86 ? 160 : 8;
          const g = 85 + depth * 1.8 + shimmer * 52;
          const b = 110 + depth * 1.5 + shimmer * 65;
          fb[dstRow + sx] = quantizeEgaColor(r, g, b, INNER_X0 + sx, screenY);
        }
        continue;
      }

      if (worldId === 5 && sy >= 136) {
        // WORLD 6: OutRun-style perspective-warped scrolling highway scanlines with yellow center dashes!
        const dy = sy - 134; // 2..63
        const z = 360.0 / dy;
        const stripe = (((z + t * 95.0) / 14) | 0) & 1;
        const normY = (64 - dy) / 64;
        const curve = Math.sin(t * 1.15) * 42 * normY * normY;
        const roadCenter = 120 + curve - (paddleNormX - 0.5) * 28 * (1 - normY);
        const roadHalfW = 14 + dy * 1.65;

        for (let sx = 0; sx < 240; sx++) {
          const dx = Math.abs(sx - roadCenter);
          if (dx > roadHalfW + 5) {
            // Perspective desert sand bands
            const sand = stripe ? [195, 118, 52] : [172, 98, 42];
            fb[dstRow + sx] = quantizeEgaColor(sand[0], sand[1], sand[2], INNER_X0 + sx, screenY);
          } else if (dx > roadHalfW) {
            // Red/white rumble curbs
            fb[dstRow + sx] = stripe ? C_RED : C_WHITE;
          } else if (dx < Math.max(1.2, dy * 0.055) && stripe === 0) {
            // Scrolling yellow highway center dashes!
            fb[dstRow + sx] = C_GOLD;
          } else {
            // Perspective asphalt
            const asph = stripe ? 58 : 46;
            fb[dstRow + sx] = quantizeEgaColor(asph, asph, asph + 12, INNER_X0 + sx, screenY);
          }
        }
        continue;
      }

      if (worldId === 6 && sy >= 164) {
        // WORLD 7: Churning molten cavern lava river!
        const depth = sy - 164;
        for (let sx = 0; sx < 240; sx++) {
          const plasma = Math.sin(sx * 0.09 + t * 4.5 + Math.sin(sy * 0.35 - t * 3.2) * 2.0);
          const hot = 0.55 + plasma * 0.42 + (depth < 3 ? 0.25 : 0);
          const rgb = sampleRampRGB(RAMPS.FIRE, hot);
          fb[dstRow + sx] = quantizeEgaColor(rgb[0], rgb[1], rgb[2], INNER_X0 + sx, screenY);
        }
        continue;
      }

      // ---- Standard Multi-Layer Parallax Scanline Composite ----
      const farRow = sy * BG_W + farScroll;
      const midRow = sy * BG_W + midScroll;
      const nearRow = sy * BG_W + nearScroll;

      for (let sx = 0; sx < 240; sx++) {
        const hx = Math.max(0, Math.min(239, sx + heatShift));
        let ega = bd.near[nearRow + hx];
        if (ega === TRANSPARENT_IDX) {
          ega = bd.mid[midRow + hx];
          if (ega === TRANSPARENT_IDX) {
            ega = bd.far[farRow + hx];
            if (lightningFlash) {
              ega = (sy < 95 && ((sx + sy) & 1) === 0) ? egaIdx(3, 3, 3) : egaIdx(2, 3, 3);
            } else if (worldId === 1 && chronoEra !== 1) {
              // Chron-o-John Past (sepia-gold) vs 2200 Future (neon violet-cyan) sky tint!
              const r0 = EGA_RGB[ega * 3], g0 = EGA_RGB[ega * 3 + 1], b0 = EGA_RGB[ega * 3 + 2];
              ega = chronoEra === 0
                ? quantizeEgaIndex(r0 + 45, g0 + 28, b0 * 0.5, INNER_X0 + sx, screenY)
                : quantizeEgaIndex(r0 * 0.6, g0 + 38, b0 + 55, INNER_X0 + sx, screenY);
            }
          }
        }
        fb[dstRow + sx] = EGA_PALETTE[ega];
      }

      // World 3: Flickering Torchlight Radial Dither Halos & Molten Orichalcum Conduits!
      if (worldId === 2) {
        if (sy >= 168) {
          // Bottom molten orichalcum conduit river
          for (let sx = 0; sx < 240; sx++) {
            const flow = 0.55 + Math.sin(sx * 0.13 - t * 6.0 + sy * 0.4) * 0.38;
            const rgb = sampleRampRGB(RAMPS.FIRE, flow);
            fb[dstRow + sx] = quantizeEgaColor(rgb[0], rgb[1], rgb[2], INNER_X0 + sx, screenY);
          }
        } else {
          // Flickering radial wall-sconce torch halos at x=40 and x=200, y=92
          const flick = 26 + Math.sin(t * 13.0) * 3.5 + Math.cos(t * 21.0) * 2.0;
          for (const tx of [38, 202]) {
            const dy = sy - 92;
            if (Math.abs(dy) > flick) continue;
            const xSpan = Math.sqrt(flick * flick - dy * dy) | 0;
            const xMin = Math.max(0, tx - xSpan);
            const xMax = Math.min(239, tx + xSpan);
            for (let sx = xMin; sx <= xMax; sx++) {
              const d = Math.hypot(sx - tx, dy) / flick;
              const boost = (1 - d) * (1 - d) * 145;
              const cur = fb[dstRow + sx];
              // Extract approx luminance & warm with Bayer dither
              const r = ((cur & 0xFF) + boost * 1.25);
              const g = (((cur >> 8) & 0xFF) + boost * 0.72);
              const b = (((cur >> 16) & 0xFF) + boost * 0.15);
              fb[dstRow + sx] = quantizeEgaColor(r, g, b, INNER_X0 + sx, screenY);
            }
          }
        }
      }
    }

    // World 3 Sconce flames
    if (worldId === 2) {
      for (const tx of [38, 202]) {
        const fh = 4 + ((tick >> 2) & 1);
        for (let fy = 0; fy < fh; fy++) {
          putPixel(INNER_X0 + tx, INNER_Y0 + 92 - fy, fy < 2 ? C_WHITE : C_GOLD);
          if (fy < 3) {
            putPixel(INNER_X0 + tx - 1, INNER_Y0 + 92 - fy, C_ORANGE);
            putPixel(INNER_X0 + tx + 1, INNER_Y0 + 92 - fy, C_RED);
          }
        }
      }
    }

    // World 4: Live 3-Plane Parallax Starfield
    if (worldId === 3) {
      for (let i = 0; i < SPACE_STARS.length; i++) {
        const s = SPACE_STARS[i];
        const sx = ((s.x - tick * s.plane * 0.35 - paddleNormX * s.plane * 12) % 240 + 240) % 240 | 0;
        const sy = s.y;
        if (sy < 132) {
          const col = s.plane === 3 ? C_WHITE : (s.plane === 2 ? C_LTCYAN : C_DKGRAY);
          putPixel(INNER_X0 + sx, INNER_Y0 + sy, col);
        }
      }
    }

    // World 7: Rising Volcanic Ember Particles
    if (worldId === 6) {
      for (let i = 0; i < LAIR_EMBERS.length; i++) {
        const e = LAIR_EMBERS[i];
        const ey = (176 - ((e.y + tick * e.spd) % 168)) | 0;
        const ex = ((e.x + Math.sin(t * 2.5 + e.phase) * 9) % 240 + 240) % 240 | 0;
        putPixel(INNER_X0 + ex, INNER_Y0 + ey, (i & 1) ? C_GOLD : C_ORANGE);
      }
    }
  }

  const AudioEngine = (() => {
    let actx = null;
    let masterGain = null;
    let musicBus = null;
    let sfxBus = null;
    let delaySend = null;
    let noiseBuffer = null;
    let distCurve = null;
    let muted = false;
    let currentTrack = 0;
    let stepIdx = 0;
    let nextNoteTime = 0;
    let schedulerTimer = null;
    let lastSfxTime = 0;

    function makeDistortionCurve(amount) {
      const n = 256;
      const curve = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const x = (i * 2) / n - 1;
        curve[i] = ((3 + amount) * x * 20 * (Math.PI / 180)) / (Math.PI + amount * Math.abs(x));
      }
      return curve;
    }

    function init() {
      if (actx) {
        if (actx.state === 'suspended') actx.resume();
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();

      const comp = actx.createDynamicsCompressor();
      comp.threshold.value = -8;
      comp.knee.value = 10;
      comp.ratio.value = 8;
      comp.attack.value = 0.003;
      comp.release.value = 0.12;

      masterGain = actx.createGain();
      masterGain.gain.value = muted ? 0 : 0.48;
      comp.connect(masterGain);
      masterGain.connect(actx.destination);

      musicBus = actx.createGain();
      musicBus.gain.value = 0.55;
      musicBus.connect(comp);

      sfxBus = actx.createGain();
      sfxBus.gain.value = 0.72;
      sfxBus.connect(comp);

      // Stereo/echo feedback delay for Atlantis Crypt & Loom
      const delay = actx.createDelay(0.5);
      delay.delayTime.value = 0.24;
      const fbGain = actx.createGain();
      fbGain.gain.value = 0.32;
      delaySend = actx.createGain();
      delaySend.gain.value = 0.28;
      delaySend.connect(delay);
      delay.connect(fbGain);
      fbGain.connect(delay);
      delay.connect(musicBus);

      // Reusable 1-second white noise buffer
      noiseBuffer = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const ch = noiseBuffer.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;

      distCurve = makeDistortionCurve(70);

      nextNoteTime = actx.currentTime + 0.05;
      if (!schedulerTimer) {
        schedulerTimer = setInterval(schedulerTick, 38);
      }
    }

    // 2-Operator OPL2 FM Voice (modulator Osc -> Gain -> carrier.frequency)
    function playFMVoice(freq, time, dur, patchName, vol = 0.16) {
      if (!actx || muted) return;
      const mod = actx.createOscillator();
      const modGain = actx.createGain();
      const car = actx.createOscillator();
      const amp = actx.createGain();

      let ratio = 1.0, modIdxStart = 2.0, modIdxEnd = 0.5, carType = 'sine', modType = 'sine';
      let attack = 0.006, release = dur, useEcho = false, useDist = false, scoop = false;

      switch (patchName) {
        case 'steelPan':
          ratio = 2.0; modIdxStart = 3.8; modIdxEnd = 0.3; release = Math.max(0.14, dur * 1.1); break;
        case 'reggaeOrgan':
          ratio = 1.0; modIdxStart = 1.2; modIdxEnd = 0.9; carType = 'triangle'; release = 0.09; break;
        case 'tentacleBrass':
          ratio = 1.5; modIdxStart = 2.8; modIdxEnd = 1.1; carType = 'sawtooth'; release = dur * 1.1; break;
        case 'pentatonicChime':
          ratio = 3.5; modIdxStart = 4.2; modIdxEnd = 0.15; release = 0.42; useEcho = true; break;
        case 'atlantisPad':
          ratio = 1.004; modIdxStart = 1.6; modIdxEnd = 0.8; attack = 0.09; release = 0.55; useEcho = true; break;
        case 'spaceBrass':
          ratio = 1.0; modIdxStart = 3.2; modIdxEnd = 1.4; modType = 'sawtooth'; release = dur * 1.15; break;
        case 'loomFlute':
          ratio = 1.0; modIdxStart = 0.85; modIdxEnd = 0.45; attack = 0.025; release = dur * 1.3; useEcho = true; break;
        case 'loomHarpsichord':
          ratio = 2.0; modIdxStart = 3.4; modIdxEnd = 0.25; modType = 'triangle'; release = 0.18; useEcho = true; break;
        case 'jazzSax':
          ratio = 1.0; modIdxStart = 2.9; modIdxEnd = 1.5; modType = 'triangle'; scoop = true; release = dur * 1.2; break;
        case 'metalGuitar':
          ratio = 1.0; modIdxStart = 4.5; modIdxEnd = 2.4; modType = 'sawtooth'; useDist = true; release = dur * 1.05; break;
      }

      car.type = carType;
      mod.type = modType;
      if (scoop) {
        car.frequency.setValueAtTime(freq * 0.91, time);
        car.frequency.exponentialRampToValueAtTime(freq, time + 0.045);
      } else {
        car.frequency.setValueAtTime(freq, time);
      }
      mod.frequency.setValueAtTime(freq * ratio, time);

      modGain.gain.setValueAtTime(freq * modIdxStart, time);
      modGain.gain.exponentialRampToValueAtTime(Math.max(1, freq * modIdxEnd), time + release);

      amp.gain.setValueAtTime(0.0001, time);
      amp.gain.linearRampToValueAtTime(vol, time + attack);
      amp.gain.exponentialRampToValueAtTime(0.0001, time + attack + release);

      mod.connect(modGain);
      modGain.connect(car.frequency);

      if (useDist) {
        const shaper = actx.createWaveShaper();
        shaper.curve = distCurve;
        const lp = actx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 2600;
        car.connect(shaper);
        shaper.connect(lp);
        lp.connect(amp);
      } else {
        car.connect(amp);
      }

      amp.connect(musicBus);
      if (useEcho && delaySend) amp.connect(delaySend);

      mod.start(time);
      car.start(time);
      const stopAt = time + attack + release + 0.02;
      mod.stop(stopAt);
      car.stop(stopAt);
    }

    // Resonant Low-Pass Triangle Bass
    function playBass(freq, time, dur) {
      if (!actx || muted) return;
      const osc = actx.createOscillator();
      const sub = actx.createOscillator();
      const filt = actx.createBiquadFilter();
      const amp = actx.createGain();

      osc.type = 'triangle';
      sub.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, time);
      sub.frequency.setValueAtTime(freq, time);

      const subGain = actx.createGain();
      subGain.gain.value = 0.35;

      filt.type = 'lowpass';
      filt.Q.value = 4.2;
      filt.frequency.setValueAtTime(920, time);
      filt.frequency.exponentialRampToValueAtTime(190, time + dur);

      amp.gain.setValueAtTime(0.0001, time);
      amp.gain.linearRampToValueAtTime(0.24, time + 0.006);
      amp.gain.exponentialRampToValueAtTime(0.0001, time + dur + 0.03);

      osc.connect(filt);
      sub.connect(subGain);
      subGain.connect(filt);
      filt.connect(amp);
      amp.connect(musicBus);

      osc.start(time);
      sub.start(time);
      osc.stop(time + dur + 0.04);
      sub.stop(time + dur + 0.04);
    }

    // Filtered White-Noise & Pitch-Swept Percussion
    function playDrum(ch, time) {
      if (!actx || muted || ch === '.') return;
      if (ch === 'K') {
        const osc = actx.createOscillator();
        const amp = actx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(155, time);
        osc.frequency.exponentialRampToValueAtTime(38, time + 0.085);
        amp.gain.setValueAtTime(0.32, time);
        amp.gain.exponentialRampToValueAtTime(0.0001, time + 0.11);
        osc.connect(amp);
        amp.connect(musicBus);
        osc.start(time);
        osc.stop(time + 0.12);
        return;
      }
      const src = actx.createBufferSource();
      src.buffer = noiseBuffer;
      const filt = actx.createBiquadFilter();
      const amp = actx.createGain();
      if (ch === 'S') {
        filt.type = 'bandpass';
        filt.frequency.value = 1450;
        filt.Q.value = 0.9;
        const dur = 0.11;
        amp.gain.setValueAtTime(0.20, time);
        amp.gain.exponentialRampToValueAtTime(0.0001, time + dur);
        src.connect(filt); filt.connect(amp); amp.connect(musicBus);
        src.start(time); src.stop(time + dur + 0.01);
        // Snare body
        const body = actx.createOscillator();
        const bAmp = actx.createGain();
        body.type = 'triangle';
        body.frequency.setValueAtTime(195, time);
        body.frequency.exponentialRampToValueAtTime(95, time + 0.06);
        bAmp.gain.setValueAtTime(0.14, time);
        bAmp.gain.exponentialRampToValueAtTime(0.0001, time + 0.07);
        body.connect(bAmp); bAmp.connect(musicBus);
        body.start(time); body.stop(time + 0.08);
      } else {
        // 'h' closed hi-hat or 'H' open hi-hat
        filt.type = 'highpass';
        filt.frequency.value = 6500;
        const dur = ch === 'H' ? 0.14 : 0.04;
        amp.gain.setValueAtTime(ch === 'H' ? 0.10 : 0.075, time);
        amp.gain.exponentialRampToValueAtTime(0.0001, time + dur);
        src.connect(filt); filt.connect(amp); amp.connect(musicBus);
        src.start(time); src.stop(time + dur + 0.01);
      }
    }

    function schedulerTick() {
      if (!actx || actx.state !== 'running') return;
      const comp = COMPOSITIONS[currentTrack];
      const stepDur = (60 / comp.bpm) / 4; // 16th note

      while (nextNoteTime < actx.currentTime + 0.14) {
        const s64 = stepIdx & 63;
        const useB = ((stepIdx >> 6) & 1) === 1;
        const swingOffset = (s64 & 1) ? comp.swing : 0;
        const t = nextNoteTime + swingOffset;

        const leadNote = (useB ? comp.leadB : comp.leadA)[s64];
        if (leadNote > 0) {
          playFMVoice(midiFreq(leadNote), t, stepDur * 1.85, comp.leadPatch, 0.16);
        }
        const harmNote = comp.harm[s64];
        if (harmNote > 0) {
          playFMVoice(midiFreq(harmNote), t, stepDur * 2.2, comp.harmPatch, 0.095);
        }
        const bassNote = comp.bass[s64];
        if (bassNote > 0) {
          playBass(midiFreq(bassNote), t, stepDur * 1.75);
        }
        const drumCh = comp.drums[s64 & 31];
        playDrum(drumCh, t);

        nextNoteTime += stepDur;
        stepIdx++;
      }
    }

    // Dedicated Non-Clipping Lo-Fi OPL2 SFX Channels
    function playSfx(kind, param = 0) {
      if (!actx || muted || actx.state !== 'running') return;
      const now = actx.currentTime;
      if (now - lastSfxTime < 0.018 && kind === 'brick') return; // Throttle dense multi-hit
      lastSfxTime = now;

      const osc = actx.createOscillator();
      const amp = actx.createGain();
      osc.connect(amp);
      amp.connect(sfxBus);

      if (kind === 'paddle') {
        osc.type = 'square';
        const f = 310 + Math.abs(param) * 90;
        osc.frequency.setValueAtTime(f, now);
        osc.frequency.exponentialRampToValueAtTime(f * 1.45, now + 0.055);
        amp.gain.setValueAtTime(0.16, now);
        amp.gain.exponentialRampToValueAtTime(0.0001, now + 0.065);
        osc.start(now); osc.stop(now + 0.07);
      } else if (kind === 'wall') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(210, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.04);
        amp.gain.setValueAtTime(0.12, now);
        amp.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);
        osc.start(now); osc.stop(now + 0.05);
      } else if (kind === 'brick') {
        osc.type = 'square';
        const f = 440 * Math.pow(1.06, Math.min(14, param));
        osc.frequency.setValueAtTime(f, now);
        osc.frequency.exponentialRampToValueAtTime(f * 1.35, now + 0.07);
        amp.gain.setValueAtTime(0.15, now);
        amp.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
        osc.start(now); osc.stop(now + 0.09);
      } else if (kind === 'armor') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.linearRampToValueAtTime(420, now + 0.03);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.09);
        amp.gain.setValueAtTime(0.16, now);
        amp.gain.exponentialRampToValueAtTime(0.0001, now + 0.10);
        osc.start(now); osc.stop(now + 0.11);
      } else if (kind === 'steel') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(980, now);
        osc.frequency.exponentialRampToValueAtTime(620, now + 0.05);
        amp.gain.setValueAtTime(0.13, now);
        amp.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
        osc.start(now); osc.stop(now + 0.07);
      } else if (kind === 'grog') {
        // Acid boom + filtered noise roar
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(170, now);
        osc.frequency.exponentialRampToValueAtTime(36, now + 0.24);
        amp.gain.setValueAtTime(0.24, now);
        amp.gain.exponentialRampToValueAtTime(0.0001, now + 0.26);
        osc.start(now); osc.stop(now + 0.27);
        if (noiseBuffer) {
          const ns = actx.createBufferSource();
          ns.buffer = noiseBuffer;
          const lp = actx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.setValueAtTime(1100, now);
          lp.frequency.exponentialRampToValueAtTime(160, now + 0.25);
          const na = actx.createGain();
          na.gain.setValueAtTime(0.22, now);
          na.gain.exponentialRampToValueAtTime(0.0001, now + 0.26);
          ns.connect(lp); lp.connect(na); na.connect(sfxBus);
          ns.start(now); ns.stop(now + 0.27);
        }
      } else if (kind === 'laser') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1150, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.085);
        amp.gain.setValueAtTime(0.13, now);
        amp.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
        osc.start(now); osc.stop(now + 0.10);
      } else if (kind === 'powerup') {
        osc.disconnect();
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((nf, idx) => {
          const o = actx.createOscillator();
          const a = actx.createGain();
          o.type = 'square';
          o.frequency.setValueAtTime(nf, now + idx * 0.045);
          a.gain.setValueAtTime(0.13, now + idx * 0.045);
          a.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.045 + 0.09);
          o.connect(a); a.connect(sfxBus);
          o.start(now + idx * 0.045);
          o.stop(now + idx * 0.045 + 0.10);
        });
      } else if (kind === 'note') {
        const scaleMidi = [72, 74, 76, 77, 79, 81];
        const f = midiFreq(scaleMidi[param % scaleMidi.length]);
        playFMVoice(f, now, 0.28, 'pentatonicChime', 0.22);
      } else if (kind === 'lost') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(65, now + 0.42);
        amp.gain.setValueAtTime(0.20, now);
        amp.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
        osc.start(now); osc.stop(now + 0.46);
      } else if (kind === 'bossHit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(90, now + 0.12);
        amp.gain.setValueAtTime(0.22, now);
        amp.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
        osc.start(now); osc.stop(now + 0.15);
      } else if (kind === 'clear') {
        osc.disconnect();
        [523, 659, 784, 1046, 784, 1046].forEach((nf, idx) => {
          const o = actx.createOscillator();
          const a = actx.createGain();
          o.type = 'triangle';
          const t0 = now + idx * 0.075;
          o.frequency.setValueAtTime(nf, t0);
          a.gain.setValueAtTime(0.18, t0);
          a.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
          o.connect(a); a.connect(sfxBus);
          o.start(t0); o.stop(t0 + 0.15);
        });
      }
    }

    function setWorldTrack(worldId) {
      if (currentTrack !== worldId) {
        currentTrack = worldId;
        stepIdx = 0;
      }
    }

    function toggleMute() {
      muted = !muted;
      if (masterGain && actx) {
        masterGain.gain.setValueAtTime(muted ? 0 : 0.48, actx.currentTime);
      }
      return muted;
    }

    return {
      init,
      playSfx,
      setWorldTrack,
      toggleMute,
      isMuted: () => muted,
      getTrackTitle: () => TRACK_TITLES[currentTrack]
    };
  })();
