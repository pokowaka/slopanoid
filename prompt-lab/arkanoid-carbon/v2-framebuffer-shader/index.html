      '.KKKKWWWWWWWWWWWWWWWWWWKKKK.',
      '.YYKKWWWWWWYYHHYYWWWWWWKKRR.',
      '.YYKKWWWWWWYYYYYYWWWWWWKKRR.',
      '.KKKKKKKKKKKKKKKKKKKKKKKKKK.',
      '.SSSSSSSSSSSSSSSSSSSSSSSSSS.',
      '...KKKKK...!!..!!...KKKKK...',
      '..KKSSSKK..........KKSSSKK..',
      '..KKSSSKK..........KKSSSKK..',
      '...KKKKK............KKKKK...',
      '............................'
    ]},

    // ---- WORLD 7: LECHUCK'S LAIR BOSS FINALE (Level 33) ----
    { name: 'GHOST PIRATE LECHUCK!', world: 6, grid: [
      '..LL....EEEEEEEEEEEE....LL..',
      '..22..EEWWWWWWWWWWWWEE..22..',
      '.....EEWWKKWWWWWWKKWWEE.....',
      '....EEWWWWWWWWWWWWWWWWEE....',
      '....EEWWWWKWWLLWWKWWWWEE....',
      '.....EEEEEWWWWWWWWEEEEE.....',
      '..##....NNNNNNNNNNNN....##..',
      '..##..NNNNN!!LL!!NNNNN..##..',
      '.....NNNNNNNNNNNNNNNNNN.....',
      '....NNN33NNNNNNNNNN33NNN....',
      '...NNNN33NN!NNNN!NN33NNNN...',
      '....NNNNNNNNNNNNNNNNNNNN....',
      '.....NNNNNNNNLLNNNNNNNN.....',
      '...OOOOOOOONNNNNNOOOOOOOO...',
      '..RRRRRRRRROOOOOORRRRRRRRR..',
      '..33333333........33333333..'
    ]}
  ];

  // ============================================================================
  // 7. WORLD MECHANICS, GAMEPLAY PHYSICS, HUD SIDEBAR & MAIN LOOP
  // ============================================================================
  const PIRATE_DUELS = [
    ['FIGHT LIKE A DAIRY FARMER!', 'YOU FIGHT LIKE A COW!'],
    ['SOON YOU WEAR MY SWORD!', 'WAVING IT LIKE A FEATHER!'],
    ['MY HANKY WIPED YOUR BLOOD!', 'SO YOU GOT THAT JOB!'],
    ['DOGS ARE SMARTER THAN YOU!', 'HE TAUGHT YOU EVERYTHING!']
  ];
  const LOOM_DRAFTS = [
    { name: 'OPENING!', effect: 'open' },
    { name: 'SHARPENING!', effect: 'laser' },
    { name: 'TRANSCEND!', effect: 'multi' }
  ];

  let hiScore = 50000;
  try {
    const saved = localStorage.getItem('scummoid_hiscore');
    if (saved) hiScore = Math.max(hiScore, parseInt(saved, 10) || 50000);
  } catch (_) { /* ignore sandboxed storage */ }

  const state = {
    mode: 'MENU', // MENU, PLAY, PAUSE, STAGE_CLEAR, GAME_OVER, VICTORY
    selectedLevel: 0,
    levelIdx: 0,
    score: 0,
    lives: 3,
    tick: 0,
    combo: 0,
    shakeTicks: 0,
    shakeX: 0,
    shakeY: 0,
    grogFlashTicks: 0,
    clearTimer: 0,
    bricks: [],
    destructibleCount: 0,
    balls: [],
    capsules: [],
    lasers: [],
    projectiles: [], // Poison darts & LeChuck voodoo skulls
    sparks: [],
    shockwaves: [],
    popups: [],
    grogQueue: [],
    vortices: [],
    boss: null,
    // World mechanic state
    duelMeter: 0,
    duelBanner: '',
    duelBannerTicks: 0,
    chronoEra: 1, // 0=PAST, 1=NOW, 2=2200
    chronoTimer: 600,
    loomNotes: [],
    highwayPhase: 0,
    // Vaus Paddle state
    paddle: {
      x: 128,
      y: 184,
      w: 36,
      h: 8,
      expandTicks: 0,
      laserTicks: 0,
      catchTicks: 0,
      slowTicks: 0,
      laserCooldown: 0,
      stunTicks: 0
    }
  };

  // Input state
  const keys = {};
  let mouseTargetX = null;

  function clampPaddleX(x, pw) {
    const half = pw * 0.5;
    return Math.max(INNER_X0 + half, Math.min(INNER_X1 - half, x));
  }

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width <= 0) return;
    const cx = ((e.clientX - rect.left) / rect.width) * W;
    mouseTargetX = Math.max(INNER_X0, Math.min(INNER_X1, cx));
  });

  canvas.addEventListener('mousedown', () => {
    AudioEngine.init();
    handlePrimaryAction();
  });

  window.addEventListener('keydown', (e) => {
    AudioEngine.init();
    const k = e.key;
    keys[k] = true;

    if (k === 'm' || k === 'M') {
      AudioEngine.toggleMute();
      return;
    }
    if (k === 'p' || k === 'P') {
      if (state.mode === 'PLAY') state.mode = 'PAUSE';
      else if (state.mode === 'PAUSE') state.mode = 'PLAY';
      return;
    }
    if (k === 'Escape' && (state.mode === 'PLAY' || state.mode === 'PAUSE')) {
      state.mode = 'MENU';
      loadLevel(state.selectedLevel, true);
      return;
    }

    if (state.mode === 'MENU') {
      if (k === 'ArrowLeft' || k === 'a' || k === 'A') {
        state.selectedLevel = (state.selectedLevel + LEVELS.length - 1) % LEVELS.length;
        loadLevel(state.selectedLevel, true);
        AudioEngine.playSfx('paddle', 0);
        e.preventDefault();
      } else if (k === 'ArrowRight' || k === 'd' || k === 'D') {
        state.selectedLevel = (state.selectedLevel + 1) % LEVELS.length;
        loadLevel(state.selectedLevel, true);
        AudioEngine.playSfx('paddle', 0.5);
        e.preventDefault();
      } else if (k === ' ' || k === 'Enter') {
        startNewGame(state.selectedLevel);
        e.preventDefault();
      }
      return;
    }

    if (k === ' ' || k === 'Enter') {
      handlePrimaryAction();
      e.preventDefault();
    }
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown') {
      e.preventDefault();
    }
  });

  window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
  });

  function handlePrimaryAction() {
    if (state.mode === 'MENU') {
      startNewGame(state.selectedLevel);
      return;
    }
    if (state.mode === 'GAME_OVER' || state.mode === 'VICTORY') {
      state.mode = 'MENU';
      loadLevel(state.selectedLevel, true);
      return;
    }
    if (state.mode !== 'PLAY') return;

    // Release any caught balls
    let released = false;
    for (const b of state.balls) {
      if (b.caught) {
        b.caught = false;
        const off = (b.catchOffset || 0) / (state.paddle.w * 0.5);
        const ang = Math.max(-1.1, Math.min(1.1, off * 0.95 || -0.32));
        b.vx = Math.sin(ang) * b.speed;
        b.vy = -Math.cos(ang) * b.speed;
        released = true;
      }
    }
    if (released) {
      AudioEngine.playSfx('paddle', 0.3);
    }

    // Fire Space-Ranger Lasers if L active
    if (state.paddle.laserTicks > 0 && state.paddle.laserCooldown <= 0) {
      const px = state.paddle.x;
      const py = state.paddle.y - 4;
      const spread = state.paddle.expandTicks > 0 ? 18 : 12;
      state.lasers.push({ x: px - spread, y: py }, { x: px + spread, y: py });
      state.paddle.laserCooldown = 12;
      AudioEngine.playSfx('laser');
    }
  }

  function addScore(pts, x, y, label) {
    state.score += pts;
    if (state.score > hiScore) {
      hiScore = state.score;
      try { localStorage.setItem('scummoid_hiscore', String(hiScore)); } catch (_) {}
    }
    if (x !== undefined && y !== undefined) {
      state.popups.push({
        text: label || ('+' + pts),
        x: Math.max(24, Math.min(224, x)),
        y,
        ticks: 40,
        col: label ? C_CYAN : C_GOLD
      });
    }
  }

  function spawnSparks(x, y, col1, col2, count = 8) {
    for (let i = 0; i < count; i++) {
      if (state.sparks.length > 180) break;
      const ang = (i / count) * Math.PI * 2 + Math.random() * 0.6;
      const spd = 0.7 + Math.random() * 2.1;
      state.sparks.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 0.6,
        col: (i & 1) ? col1 : col2,
        life: 16 + ((Math.random() * 14) | 0)
      });
    }
  }

  function resetPaddleAndBall() {
    const p = state.paddle;
    p.x = 128;
    p.y = 184;
    p.w = 36;
    p.expandTicks = 0;
    p.laserTicks = 0;
    p.catchTicks = 0;
    p.slowTicks = 0;
    p.laserCooldown = 0;
    p.stunTicks = 0;

    const baseSpeed = Math.min(3.65, 2.55 + state.levelIdx * 0.032);
    state.balls = [{
      x: p.x,
      y: p.y - 6,
      vx: baseSpeed * 0.45,
      vy: -baseSpeed * 0.89,
      speed: baseSpeed,
      baseSpeed,
      caught: true,
      catchOffset: 3,
      pierceTicks: 0,
      stuckTicks: 0,
      trail: []
    }];
    state.lasers = [];
    state.projectiles = [];
    state.capsules = [];
  }

  function loadLevel(idx, menuPreview = false) {
    state.levelIdx = idx;
    const lvl = LEVELS[idx];
    AudioEngine.setWorldTrack(lvl.world);

    state.bricks = [];
    state.destructibleCount = 0;
    state.grogQueue = [];
    state.shockwaves = [];
    state.popups = [];
    state.sparks = [];
    state.duelMeter = 0;
    state.duelBanner = '';
    state.duelBannerTicks = 0;
    state.chronoEra = 1;
    state.chronoTimer = 540;
    state.loomNotes = [];
    state.highwayPhase = 0;

    const rows = lvl.grid.length;
    const cols = lvl.grid[0].length;
    const startX = INNER_X0 + (((240 - cols * 8) >> 1));
    // Level 33 starts at y=38 so 40x28 Ghost Pirate LeChuck patrols cleanly at y=9..37!
    const startY = idx === 32 ? 38 : 20;

    for (let r = 0; r < rows; r++) {
      const line = lvl.grid[r];
      for (let c = 0; c < cols; c++) {
        const ch = line[c];
        if (!ch || ch === '.') continue;
        const bx = startX + c * 8;
        const by = startY + r * 6;
        let kind = 'NORMAL';
        let hp = 1;
        let colorKey = ch;
        let mechKey = null;

        if (ch === '#') {
          kind = 'STEEL';
          hp = 9999;
        } else if (ch === '2' || ch === '3') {
          kind = 'ARMOR';
          hp = ch === '3' ? 3 : 2;
        } else if (ch === '!') {
          kind = 'GROG';
          hp = 1;
        } else if (BRICK_SPRITES.MECH[ch]) {
          kind = 'MECH';
          mechKey = ch;
          hp = 1;
        }

        const phaseGroup = (lvl.world === 1 && kind === 'ARMOR') ? ((r + c) & 1) : -1;
        const laneDir = (lvl.world === 5) ? ((r & 1) ? 1 : -1) : 0;

        state.bricks.push({
          row: r,
          col: c,
          baseX: bx,
          x: bx,
          y: by,
          kind,
          colorKey,
          mechKey,
          hp,
          alive: true,
          glintTicks: 0,
          phaseGroup,
          laneDir,
          idolCooldown: 120 + ((r * 37 + c * 53) % 180)
        });
        if (kind !== 'STEEL') state.destructibleCount++;
      }
    }

    // World 4 Orbital Gravity Vortices
    state.vortices = [];
    if (lvl.world === 3) {
      state.vortices.push({ x: 68, y: 138, dir: 1 }, { x: 188, y: 138, dir: -1 });
    }

    // Level 33 Boss: Ghost Pirate LeChuck!
    if (idx === 32) {
      state.boss = {
        x: 108,
        y: 9,
        w: 40,
        h: 28,
        vx: 0.95,
        hp: 40,
        maxHp: 40,
        flashTicks: 0,
        fireCooldown: 95,
        summonCooldown: 420
      };
    } else {
      state.boss = null;
    }

    resetPaddleAndBall();
    if (menuPreview) {
      state.balls[0].caught = true;
    }
  }

  function startNewGame(startIdx) {
    state.score = 0;
    state.lives = 3;
    state.combo = 0;
    loadLevel(startIdx, false);
    state.mode = 'PLAY';
  }

  function maybeDropCapsule(x, y, forceType = null) {
    if (state.capsules.length >= 3) return;
    if (!forceType && Math.random() > 0.21) return;
    const pool = ['L', 'E', 'C', 'S', 'L', 'E', 'C', 'S', 'P'];
    const type = forceType || pool[(Math.random() * pool.length) | 0];
    const cx = Math.max(INNER_X0 + 1, Math.min(INNER_X1 - 19, Math.round(x - 9)));
    state.capsules.push({ x: cx, y, type });
  }

  function triggerWorldMechanic(brick) {
    const cx = brick.x + 4, cy = brick.y + 3;
    const mk = brick.mechKey;
    if (mk === 'X') {
      // World 1: Insult Sword-Fighting Duel!
      state.duelMeter = Math.min(4, state.duelMeter + 1);
      const pair = PIRATE_DUELS[(state.tick + brick.col) % PIRATE_DUELS.length];
      if (state.duelMeter >= 4) {
        state.duelMeter = 0;
        state.duelBanner = pair[1];
        state.duelBannerTicks = 150;
        addScore(500, cx, cy, 'PARRY!+500');
        AudioEngine.playSfx('powerup');
        // Spawn Swordmaster twin ball!
        if (state.balls.length < 4 && state.balls[0]) {
          const b0 = state.balls[0];
          state.balls.push({
            x: b0.x, y: b0.y,
            vx: -b0.vx || 1.6, vy: -Math.abs(b0.vy),
            speed: b0.speed, baseSpeed: b0.baseSpeed,
            caught: false, catchOffset: 0, pierceTicks: 0, stuckTicks: 0, trail: []
          });
        }
      } else {
        state.duelBanner = pair[0];
        state.duelBannerTicks = 110;
        addScore(200, cx, cy, 'EN GARDE!');
      }
    } else if (mk === 'J') {
      // World 2: Chron-o-John Era Shift!
      state.chronoEra = (state.chronoEra + 1) % 3;
      state.chronoTimer = 540;
      const names = ['1780 PAST!', 'PRESENT!', '2200 A.D.!'];
      addScore(300, cx, cy, names[state.chronoEra]);
      AudioEngine.playSfx('powerup');
      maybeDropCapsule(cx, cy, 'S');
    } else if (mk === 'Q') {
      // World 3: Shattered Golden Idol Orichalcum Shower!
      addScore(400, cx, cy, 'IDOL+400');
      spawnSparks(cx, cy, C_GOLD, C_CYAN, 14);
      maybeDropCapsule(cx, cy);
    } else if (mk === 'U') {
      // World 4: Gravity Overdrive!
      addScore(350, cx, cy, 'HYPER+350');
      maybeDropCapsule(cx, cy, 'L');
    } else if (mk === 'Z') {
      // World 5: Loom 4-Note Musical Spell Weaving!
      const notes = ['C', 'D', 'E', 'F', 'G', 'A'];
      const note = notes[(brick.col + brick.row) % notes.length];
      AudioEngine.playSfx('note', brick.col + brick.row);
      state.loomNotes.push(note);
      if (state.loomNotes.length >= 4) {
        const draft = LOOM_DRAFTS[(state.tick + brick.col) % LOOM_DRAFTS.length];
        state.loomNotes = [];
        addScore(600, cx, cy, draft.name);
        AudioEngine.playSfx('powerup');
        if (draft.effect === 'open') {
          // Opening Draft cracks all Armored bricks -1 HP!
          for (const b of state.bricks) {
            if (b.alive && b.kind === 'ARMOR' && b.hp > 1) b.hp--;
          }
        } else if (draft.effect === 'laser') {
          state.paddle.laserTicks = 720;
          for (const bl of state.balls) bl.pierceTicks = 240;
        } else if (state.balls.length < 4 && state.balls[0]) {
          const b0 = state.balls[0];
          state.balls.push({
            x: b0.x, y: b0.y, vx: -b0.vx || 1.8, vy: -Math.abs(b0.vy),
            speed: b0.speed, baseSpeed: b0.baseSpeed,
            caught: false, catchOffset: 0, pierceTicks: 180, stuckTicks: 0, trail: []
          });
        }
      } else {
        addScore(150, cx, cy, 'NOTE ' + note);
      }
    } else if (mk === 'H') {
      // World 6: Sam & Max Siren Nitro!
      addScore(350, cx, cy, 'MAX NITRO!');
      maybeDropCapsule(cx, cy, 'E');
    } else if (mk === 'L') {
      // World 7: Voodoo Totem!
      addScore(350, cx, cy, 'VOODOO!');
      if (state.boss && state.boss.hp > 1) {
        state.boss.hp = Math.max(1, state.boss.hp - 2);
        state.boss.flashTicks = 8;
      }
      maybeDropCapsule(cx, cy);
    }
  }

  function damageBrick(brick, byGrog = false) {
    if (!brick.alive) return;
    if (brick.kind === 'STEEL') {
      if (byGrog) {
        // Grog acid melts even steel if directly adjacent? Prompt says Steel (indestructible), so keep Steel indestructible!
        brick.glintTicks = 10;
        return;
      }
      brick.glintTicks = 10;
      AudioEngine.playSfx('steel');
      return;
    }

    // World 2 Future Era shield gives phased Armor bricks temporary resistance on first tap
    if (!byGrog && state.chronoEra === 2 && brick.phaseGroup === 1 && brick.hp === 2 && Math.random() < 0.35) {
      brick.glintTicks = 8;
      AudioEngine.playSfx('armor');
      spawnSparks(brick.x + 4, brick.y + 3, C_CYAN, C_PURPLE, 5);
      return;
    }

    if (byGrog && brick.kind === 'ARMOR') {
      brick.hp = 1;
    }

    brick.hp--;
    const cx = brick.x + 4;
    const cy = brick.y + 3;

    if (brick.hp > 0) {
      brick.glintTicks = 6;
      AudioEngine.playSfx('armor');
      spawnSparks(cx, cy, C_LTGOLD, C_LTGRAY, 6);
      addScore(50, cx, cy);
      return;
    }

    brick.alive = false;
    state.destructibleCount = Math.max(0, state.destructibleCount - 1);
    state.combo++;

    if (brick.kind === 'GROG') {
      AudioEngine.playSfx('grog');
      state.shakeTicks = Math.max(state.shakeTicks, 14);
      state.grogFlashTicks = 6;
      state.shockwaves.push({ x: cx, y: cy, r: 3, maxR: 26 });
      spawnSparks(cx, cy, C_LIME, C_GREEN, 14);
      addScore(250, cx, cy, 'GROG!');
      // Splash damage to LeChuck if detonated near boss!
      if (state.boss && state.boss.hp > 0) {
        const bs = state.boss;
        if (Math.hypot((bs.x + 20) - cx, (bs.y + 16) - cy) <= 38) {
          bs.hp = Math.max(0, bs.hp - 4);
          bs.flashTicks = 9;
          addScore(400, bs.x + 20, bs.y + 14, 'ACID!-4');
        }
      }
      // Queue 3x3 recursive chain explosion!
      for (const nb of state.bricks) {
        if (!nb.alive || nb === brick || nb.grogQueued) continue;
        if (Math.abs(nb.x - brick.x) <= 10 && Math.abs(nb.y - brick.y) <= 8) {
          nb.grogQueued = true;
          state.grogQueue.push({ brick: nb, delay: 4 });
        }
      }
    } else if (brick.kind === 'MECH') {
      AudioEngine.playSfx('brick', state.combo);
      spawnSparks(cx, cy, C_WHITE, C_GOLD, 10);
      triggerWorldMechanic(brick);
    } else {
      AudioEngine.playSfx('brick', state.combo);
      const col = BRICK_SPRITES[brick.colorKey] ? C_GOLD : C_LTGRAY;
      spawnSparks(cx, cy, col, C_WHITE, 7);
      addScore(brick.kind === 'ARMOR' ? 150 : 100, cx, cy);
      maybeDropCapsule(cx, cy);
    }
  }

  function applyCapsule(type) {
    const p = state.paddle;
    AudioEngine.playSfx('powerup');
    if (type === 'E') {
      p.expandTicks = 960;
      p.w = 52;
      p.x = clampPaddleX(p.x, p.w);
      addScore(250, p.x, p.y - 8, 'CHICKEN!');
    } else if (type === 'L') {
      p.laserTicks = 960;
      if (p.expandTicks <= 0) p.w = 38;
      addScore(250, p.x, p.y - 8, 'LASER!');
    } else if (type === 'C') {
      p.catchTicks = 960;
      if (p.expandTicks <= 0) p.w = 38;
      addScore(250, p.x, p.y - 8, 'COMPASS!');
    } else if (type === 'S') {
      p.slowTicks = 720;
      for (const b of state.balls) {
        b.speed = Math.max(1.85, b.baseSpeed * 0.7);
        const cur = Math.hypot(b.vx, b.vy) || 1;
        b.vx = (b.vx / cur) * b.speed;
        b.vy = (b.vy / cur) * b.speed;
      }
      addScore(250, p.x, p.y - 8, 'SLOW!');
    } else if (type === 'P') {
      state.lives = Math.min(9, state.lives + 1);
      addScore(1000, p.x, p.y - 8, '1UP!');
    }
  }

  // Sub-stepped Circle-vs-AABB Physics Update
  function updateGameplay() {
    const p = state.paddle;
    const lvl = LEVELS[state.levelIdx];

    // 1. Update Paddle Timers & Morph Width
    if (p.expandTicks > 0) p.expandTicks--;
    if (p.laserTicks > 0) p.laserTicks--;
    if (p.catchTicks > 0) p.catchTicks--;
    if (p.slowTicks > 0) {
      p.slowTicks--;
      if (p.slowTicks === 0) {
        for (const b of state.balls) {
          b.speed = b.baseSpeed;
          const cur = Math.hypot(b.vx, b.vy) || 1;
          b.vx = (b.vx / cur) * b.speed;
          b.vy = (b.vy / cur) * b.speed;
        }
      }
    }
    if (p.laserCooldown > 0) p.laserCooldown--;
    if (p.stunTicks > 0) p.stunTicks--;

    p.w = p.expandTicks > 0 ? 52 : ((p.laserTicks > 0 || p.catchTicks > 0) ? 38 : 36);

    // Smooth Keyboard + Mouse Paddle Movement
    const moveSpd = p.stunTicks > 0 ? 1.8 : 3.9;
    const leftHeld = keys['ArrowLeft'] || keys['a'] || keys['A'];
    const rightHeld = keys['ArrowRight'] || keys['d'] || keys['D'];
    const prevPx = p.x;
    if (leftHeld) {
      mouseTargetX = null;
      p.x -= moveSpd;
    } else if (rightHeld) {
      mouseTargetX = null;
      p.x += moveSpd;
    } else if (mouseTargetX !== null) {
      p.x += (mouseTargetX - p.x) * (p.stunTicks > 0 ? 0.18 : 0.42);
    }
    p.x = clampPaddleX(p.x, p.w);
    const paddleVx = p.x - prevPx;

    // 2. World-Specific Active Mechanics
    if (state.duelBannerTicks > 0) state.duelBannerTicks--;
    if (lvl.world === 1) {
      state.chronoTimer--;
      if (state.chronoTimer <= 0) {
        state.chronoEra = (state.chronoEra + 1) % 3;
        state.chronoTimer = 540;
      }
    }
    if (lvl.world === 2) {
      // Golden Idols periodically spit Atlantean Poison Darts!
      for (const b of state.bricks) {
        if (!b.alive || b.mechKey !== 'Q') continue;
        b.idolCooldown--;
        if (b.idolCooldown <= 0) {
          b.idolCooldown = 210 + ((Math.random() * 90) | 0);
          if (state.projectiles.length < 5) {
            state.projectiles.push({
              x: b.x + 2,
              y: b.y + 6,
              vx: 0,
              vy: p.slowTicks > 0 ? 1.0 : 1.55,
              kind: 'DART'
            });
          }
        }
      }
    }
    if (lvl.world === 5) {
      // Sam & Max Moving Highway Convoy Formations!
      state.highwayPhase += 0.026;
      const shift = Math.sin(state.highwayPhase) * 8;
      for (const b of state.bricks) {
        if (!b.alive) continue;
        b.x = Math.round(Math.max(INNER_X0 + 1, Math.min(INNER_X1 - 9, b.baseX + shift * b.laneDir)));
      }
    }

    // 3. Process Recursive Grog 3x3 Chain Explosion Queue
    for (let i = state.grogQueue.length - 1; i >= 0; i--) {
      const item = state.grogQueue[i];
      item.delay--;
      if (item.delay <= 0) {
        state.grogQueue.splice(i, 1);
        damageBrick(item.brick, true);
      }
    }

    // 4. Update Space-Ranger Lasers
    for (let i = state.lasers.length - 1; i >= 0; i--) {
      const ls = state.lasers[i];
      ls.y -= 4.8;
      if (ls.y < INNER_Y0) {
        state.lasers.splice(i, 1);
        continue;
      }
      // Check Boss hit
      if (state.boss && state.boss.hp > 0) {
        const bs = state.boss;
        if (ls.x >= bs.x && ls.x <= bs.x + bs.w && ls.y >= bs.y && ls.y <= bs.y + bs.h) {
          bs.hp = Math.max(0, bs.hp - 1);
          bs.flashTicks = 5;
          AudioEngine.playSfx('bossHit');
          spawnSparks(ls.x, ls.y, C_RED, C_GOLD, 6);
          addScore(100, ls.x, ls.y);
          state.lasers.splice(i, 1);
          continue;
        }
      }
      // Shoot down enemy darts/skulls!
      let hitProj = false;
      for (let j = state.projectiles.length - 1; j >= 0; j--) {
        const pr = state.projectiles[j];
        if (Math.abs(ls.x - (pr.x + 3)) < 5 && Math.abs(ls.y - (pr.y + 4)) < 6) {
          spawnSparks(pr.x + 2, pr.y + 4, C_LIME, C_GOLD, 6);
          addScore(75, pr.x, pr.y);
          state.projectiles.splice(j, 1);
          hitProj = true;
          break;
        }
      }
      if (hitProj) {
        state.lasers.splice(i, 1);
        continue;
      }
      // Check Brick hit
      for (const b of state.bricks) {
        if (!b.alive) continue;
        if (ls.x >= b.x && ls.x <= b.x + 8 && ls.y >= b.y && ls.y <= b.y + 6) {
          damageBrick(b, false);
          state.lasers.splice(i, 1);
          break;
        }
      }
    }

    // 5. Update Level 33 Boss: Ghost Pirate LeChuck!
    if (state.boss && state.boss.hp > 0) {
      const bs = state.boss;
      if (bs.flashTicks > 0) bs.flashTicks--;
      const rage = bs.hp <= bs.maxHp * 0.5 ? 1.45 : 1.0;
      bs.x += bs.vx * rage;
      if (bs.x <= INNER_X0 + 4) { bs.x = INNER_X0 + 4; bs.vx = Math.abs(bs.vx); }
      if (bs.x + bs.w >= INNER_X1 - 4) { bs.x = INNER_X1 - bs.w - 4; bs.vx = -Math.abs(bs.vx); }
      bs.y = 9 + Math.sin(state.tick * 0.05) * 2.5;

      bs.fireCooldown--;
      if (bs.fireCooldown <= 0) {
        bs.fireCooldown = bs.hp <= 20 ? 68 : 105;
        const aimAngle = Math.atan2(p.y - (bs.y + 22), p.x - (bs.x + 20));
        const spd = 1.65;
        state.projectiles.push({
          x: bs.x + 16,
          y: bs.y + 22,
          vx: Math.cos(aimAngle) * spd * 0.65,
          vy: Math.max(1.1, Math.sin(aimAngle) * spd),
          kind: 'SKULL'
        });
      }
    }

    // 6. Update Enemy Projectiles (Atlantean Darts & Voodoo Skulls)
    for (let i = state.projectiles.length - 1; i >= 0; i--) {
      const pr = state.projectiles[i];
      pr.x += pr.vx;
      pr.y += pr.vy;
      if (pr.y > H || pr.x < INNER_X0 || pr.x > INNER_X1 - 5) {
        state.projectiles.splice(i, 1);
        continue;
      }
      const pwHalf = p.w * 0.5;
      if (pr.x + 4 >= p.x - pwHalf && pr.x <= p.x + pwHalf && pr.y + 7 >= p.y - 3 && pr.y <= p.y + 5) {
        state.projectiles.splice(i, 1);
        p.stunTicks = 75;
        p.expandTicks = 0;
        state.shakeTicks = 8;
        AudioEngine.playSfx('bossHit');
        spawnSparks(p.x, p.y, C_LIME, C_RED, 10);
        state.popups.push({ text: pr.kind === 'DART' ? 'POISON!' : 'CURSED!', x: p.x, y: p.y - 10, ticks: 36, col: C_LTRED });
      }
    }

    // 7. Update Falling Sculpted Capsules
    for (let i = state.capsules.length - 1; i >= 0; i--) {
      const cap = state.capsules[i];
      cap.y += 1.12;
      if (cap.y > H) {
        state.capsules.splice(i, 1);
        continue;
      }
      const pwHalf = p.w * 0.5;
      if (cap.x + 18 >= p.x - pwHalf && cap.x <= p.x + pwHalf && cap.y + 9 >= p.y - 4 && cap.y <= p.y + 6) {
        const t = cap.type;
        state.capsules.splice(i, 1);
        applyCapsule(t);
      }
    }

    // 8. Sub-Stepped Circle-vs-AABB Ball Physics
    const RADIUS = 2.5;
    for (let bi = state.balls.length - 1; bi >= 0; bi--) {
      const b = state.balls[bi];
      if (b.pierceTicks > 0) b.pierceTicks--;

      if (b.caught) {
        b.x = clampPaddleX(p.x + b.catchOffset, 6);
        b.y = p.y - 5.5;
        b.trail.length = 0;
        continue;
      }

      // Record dithered afterimage trail
      if ((state.tick & 1) === 0) {
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 5) b.trail.shift();
      }

      // World 4 Orbital Gravity Vortices gentle acceleration!
      if (state.vortices.length > 0) {
        for (const v of state.vortices) {
          const dx = v.x - b.x;
          const dy = v.y - b.y;
          const dist = Math.hypot(dx, dy);
          if (dist > 8 && dist < 56) {
            const pull = 0.032 * (1 - dist / 56);
            b.vx += (dx / dist) * pull - (dy / dist) * pull * 0.55 * v.dir;
            b.vy += (dy / dist) * pull + (dx / dist) * pull * 0.55 * v.dir;
          }
        }
        // Normalize back to target ball speed
        const mag = Math.hypot(b.vx, b.vy) || 1;
        b.vx = (b.vx / mag) * b.speed;
        b.vy = (b.vy / mag) * b.speed;
      }

      b.stuckTicks++;
      if (b.stuckTicks > 720) {
        b.stuckTicks = 0;
        b.vy += (b.vy >= 0 ? 0.35 : -0.35);
      }

      const steps = Math.max(2, Math.ceil(b.speed / 1.35));
      const stepVx = b.vx / steps;
      const stepVy = b.vy / steps;
      let lost = false;

      for (let s = 0; s < steps; s++) {
        b.x += stepVx;
        b.y += stepVy;

        // Playfield pipe walls
        if (b.x - RADIUS < INNER_X0) {
          b.x = INNER_X0 + RADIUS;
          b.vx = Math.abs(b.vx);
          AudioEngine.playSfx('wall');
        } else if (b.x + RADIUS > INNER_X1) {
          b.x = INNER_X1 - RADIUS;
          b.vx = -Math.abs(b.vx);
          AudioEngine.playSfx('wall');
        }
        if (b.y - RADIUS < INNER_Y0) {
          b.y = INNER_Y0 + RADIUS;
          b.vy = Math.abs(b.vy);
          AudioEngine.playSfx('wall');
        }
        if (b.y - RADIUS > H + 4) {
          lost = true;
          break;
        }

        // Vaus Paddle bounce
        const pwHalf = p.w * 0.5;
        if (b.vy > 0 &&
            b.y + RADIUS >= p.y - 3.5 &&
            b.y - RADIUS <= p.y + 4.5 &&
            b.x + RADIUS >= p.x - pwHalf &&
            b.x - RADIUS <= p.x + pwHalf) {
          state.combo = 0;
          b.stuckTicks = 0;
          const hitNorm = Math.max(-1, Math.min(1, (b.x - p.x) / pwHalf));
          if (p.catchTicks > 0) {
            b.caught = true;
            b.catchOffset = b.x - p.x;
            b.y = p.y - 5.5;
            AudioEngine.playSfx('paddle', hitNorm);
            break;
          }
          const maxAng = 1.18; // ~68 deg
          const ang = hitNorm * maxAng;
          b.speed = Math.min(4.35, b.speed + 0.015);
          b.vx = Math.sin(ang) * b.speed + paddleVx * 0.12;
          b.vy = -Math.cos(ang) * b.speed;
          // Re-normalize
          const m = Math.hypot(b.vx, b.vy) || 1;
          b.vx = (b.vx / m) * b.speed;
          b.vy = -Math.max(0.28 * b.speed, Math.abs((b.vy / m) * b.speed));
          b.y = p.y - 3.5 - RADIUS;
          AudioEngine.playSfx('paddle', hitNorm);
          spawnSparks(b.x, p.y - 3, C_LTCYAN, C_WHITE, 4);
          break;
        }

        // Level 33 LeChuck Boss Circle-vs-AABB Bounce!
        if (state.boss && state.boss.hp > 0) {
          const bs = state.boss;
          const cx = Math.max(bs.x + 3, Math.min(bs.x + bs.w - 3, b.x));
          const cy = Math.max(bs.y + 2, Math.min(bs.y + bs.h - 2, b.y));
          const dx = b.x - cx, dy = b.y - cy;
          const d2 = dx * dx + dy * dy;
          if (d2 < RADIUS * RADIUS) {
            bs.hp = Math.max(0, bs.hp - 2);
            bs.flashTicks = 7;
            state.shakeTicks = 6;
            AudioEngine.playSfx('bossHit');
            addScore(250, b.x, b.y, bs.hp === 0 ? 'VANQUISHED!' : 'HIT!-2');
            spawnSparks(b.x, b.y, C_LIME, C_GOLD, 12);
            if (Math.abs(dx) > Math.abs(dy)) {
              b.vx = dx >= 0 ? Math.abs(b.vx) : -Math.abs(b.vx);
              b.x += (dx >= 0 ? 2 : -2);
            } else {
              b.vy = dy >= 0 ? Math.abs(b.vy) : -Math.abs(b.vy);
              b.y += (dy >= 0 ? 2 : -2);
            }
            if (bs.hp === 0) {
              state.shakeTicks = 28;
              state.shockwaves.push({ x: bs.x + 20, y: bs.y + 14, r: 4, maxR: 48 });
              spawnSparks(bs.x + 20, bs.y + 14, C_GOLD, C_LIME, 32);
              addScore(5000, bs.x + 20, bs.y + 14, 'LECHUCK+5000');
              AudioEngine.playSfx('grog');
            }
            break;
          }
        }

        // Corner-Safe Circle-vs-AABB Brick Collision (select deepest overlap first)
        let bestBrick = null;
        let bestDist2 = RADIUS * RADIUS;
        let bestDx = 0, bestDy = 0;

        for (let k = 0; k < state.bricks.length; k++) {
          const br = state.bricks[k];
          if (!br.alive) continue;
          if (b.x + RADIUS < br.x || b.x - RADIUS > br.x + 8 ||
              b.y + RADIUS < br.y || b.y - RADIUS > br.y + 6) continue;
          const cx = b.x < br.x ? br.x : (b.x > br.x + 8 ? br.x + 8 : b.x);
          const cy = b.y < br.y ? br.y : (b.y > br.y + 6 ? br.y + 6 : b.y);
          const dx = b.x - cx;
          const dy = b.y - cy;
          const d2 = dx * dx + dy * dy;
          if (d2 < bestDist2) {
            bestDist2 = d2;
            bestBrick = br;
            bestDx = dx;
            bestDy = dy;
          }
        }

        if (bestBrick) {
          if (bestBrick.kind !== 'STEEL') b.stuckTicks = 0;
          const shouldPierce = b.pierceTicks > 0 && bestBrick.kind !== 'STEEL' && bestBrick.hp <= 1;
          if (!shouldPierce) {
            if (bestDist2 > 0.0001) {
              const dist = Math.sqrt(bestDist2);
              const nx = bestDx / dist;
              const ny = bestDy / dist;
              b.x += nx * (RADIUS - dist + 0.05);
              b.y += ny * (RADIUS - dist + 0.05);
              const dot = b.vx * nx + b.vy * ny;
              if (dot < 0) {
                b.vx -= 2 * dot * nx;
                b.vy -= 2 * dot * ny;
              }
            } else {
              // Ball center inside AABB: resolve along shallowest penetration axis
              const penL = Math.abs(b.x - bestBrick.x);
              const penR = Math.abs((bestBrick.x + 8) - b.x);
              const penT = Math.abs(b.y - bestBrick.y);
              const penB = Math.abs((bestBrick.y + 6) - b.y);
              const minPen = Math.min(penL, penR, penT, penB);
              if (minPen === penL || minPen === penR) b.vx = -b.vx;
              else b.vy = -b.vy;
            }

            // Enforce minimum vertical velocity component so ball never loops horizontally
            const minVy = 0.24 * b.speed;
            if (Math.abs(b.vy) < minVy) {
              b.vy = (b.vy >= 0 ? 1 : -1) * minVy;
              const remVx = Math.sqrt(Math.max(0.1, b.speed * b.speed - b.vy * b.vy));
              b.vx = (b.vx >= 0 ? 1 : -1) * remVx;
            }
          }
          damageBrick(bestBrick, false);
          break;
        }
      }

      if (lost) {
        state.balls.splice(bi, 1);
      }
    }

    // 9. Handle Ball Loss / Extra Lives
    if (state.balls.length === 0) {
      state.lives--;
      AudioEngine.playSfx('lost');
      state.shakeTicks = 12;
      if (state.lives <= 0) {
        state.mode = 'GAME_OVER';
      } else {
        resetPaddleAndBall();
      }
      return;
    }

    // 10. Check Stage Clear (all destructible bricks cleared + LeChuck defeated on Level 33)
    const bossAlive = state.boss && state.boss.hp > 0;
    if (state.destructibleCount <= 0 && state.grogQueue.length === 0 && !bossAlive) {
      AudioEngine.playSfx('clear');
      addScore(1000, 128, 100, 'STAGE CLEAR!');
      if (state.levelIdx >= LEVELS.length - 1) {
        state.mode = 'VICTORY';
      } else {
        state.mode = 'STAGE_CLEAR';
        state.clearTimer = 110;
      }
    }
  }

  function updateParticlesAndOverlays() {
    for (const br of state.bricks) {
      if (br.glintTicks > 0) br.glintTicks--;
    }
    for (let i = state.sparks.length - 1; i >= 0; i--) {
      const sp = state.sparks[i];
      sp.x += sp.vx;
      sp.y += sp.vy;
      sp.vy += 0.08;
      sp.life--;
      if (sp.life <= 0) state.sparks.splice(i, 1);
    }
    for (let i = state.shockwaves.length - 1; i >= 0; i--) {
      const sw = state.shockwaves[i];
      sw.r += 1.65;
      if (sw.r >= sw.maxR) state.shockwaves.splice(i, 1);
    }
    for (let i = state.popups.length - 1; i >= 0; i--) {
      const pp = state.popups[i];
      pp.y -= 0.38;
      pp.ticks--;
      if (pp.ticks <= 0) state.popups.splice(i, 1);
    }
    if (state.grogFlashTicks > 0) state.grogFlashTicks--;
    if (state.shakeTicks > 0) {
      state.shakeTicks--;
      state.shakeX = ((Math.random() * 5) | 0) - 2;
      state.shakeY = ((Math.random() * 5) | 0) - 2;
    } else {
      state.shakeX = 0;
      state.shakeY = 0;
    }
  }

  // ============================================================================
  // 8. FULL SOFTWARE FRAMEBUFFER RENDERING (PLAYFIELD + 64x200 HUD + OVERLAYS)
  // ============================================================================
  function renderGravityVortices(tick) {
    for (const v of state.vortices) {
      const vx = v.x | 0, vy = v.y | 0;
      for (let dy = -13; dy <= 13; dy++) {
        for (let dx = -13; dx <= 13; dx++) {
          const r = Math.hypot(dx, dy);
          if (r > 13 || r < 1) continue;
          const theta = Math.atan2(dy, dx) * v.dir;
          const arm = Math.sin(theta * 3 - r * 0.55 + tick * 0.14);
          if (arm > 0.45 && BAYER_4X4[((vy + dy) & 3) * 4 + ((vx + dx) & 3)] < (15 - r)) {
            putPixel(vx + dx, vy + dy, r < 5 ? C_WHITE : (r < 9 ? C_CYAN : C_BLUE));
          }
        }
      }
    }
  }

  function renderShockwaves() {
    if (state.grogFlashTicks > 0) {
      const dens = state.grogFlashTicks;
      const flashCol = state.grogFlashTicks >= 5 ? C_WHITE : C_LIME;
      for (let y = INNER_Y0; y < H; y++) {
        const row = y * W;
        for (let x = INNER_X0; x < INNER_X1; x++) {
          if (BAYER_4X4[((y & 3) << 2) | (x & 3)] < dens) {
            fb[row + x] = flashCol;
          }
        }
      }
    }
    for (const sw of state.shockwaves) {
      const density = Math.max(2, Math.round(16 * (1 - sw.r / sw.maxR)));
      const rInt = sw.r | 0;
      for (let dy = -rInt; dy <= rInt; dy++) {
        const py = (sw.y + dy) | 0;
        if (py < INNER_Y0 || py >= H) continue;
        for (let dx = -rInt; dx <= rInt; dx++) {
          const px = (sw.x + dx) | 0;
          if (px < INNER_X0 || px >= INNER_X1) continue;
          const d = Math.hypot(dx, dy);
          if (Math.abs(d - sw.r) <= 2.2) {
            if (BAYER_4X4[((py & 3) << 2) | (px & 3)] < density) {
              fb[py * W + px] = d > sw.r ? C_WHITE : C_LIME;
            }
          }
        }
      }
    }
  }

    drawText('STG', 262, 77, C_LTGRAY, 1);
    drawText(String(shownStage).padStart(2, '0') + '/33', 283, 77, C_GOLD, 1, { monoDigits: true });

    drawBevelBox(259, 93, 58, 17, 10, 14, 24, C_DKGRAY, C_LTGRAY);

    for (let i = 0; i < maxIcons; i++) {

    }

      drawText('+' + (state.lives - 3), 305, 98, C_GOLD, 1);

    drawBevelBox(259, 113, 58, 32, 10, 12, 22, C_DKGRAY, C_LTGRAY);
    const lvl = LEVELS[state.mode === 'MENU' ? state.selectedLevel : state.levelIdx];

    if (wId === 0) {
      drawTextCentered('SWORD WIT', 288, 116, C_GOLD, 1);
      for (let i = 0; i < 4; i++) {
        const filled = i < state.duelMeter;

        fillSolidRect(263 + i * 13, 127, 10, 2, filled ? C_WHITE : C_DKGRAY);
      }
    } else if (wId === 1) {
      drawTextCentered('CHRONO ERA', 288, 116, C_LTCYAN, 1);
      const eras = ['1780 PAST', 'PRESENT', '2200 A.D.'];
      const cols = [C_GOLD, C_LIME, C_MAGENTA];
      drawTextCentered(eras[state.chronoEra], 288, 126, cols[state.chronoEra], 1);
      const barW = Math.round((state.chronoTimer / 540) * 50);
      fillSolidRect(263, 137, 50, 4, C_DKGRAY);
      fillSolidRect(263, 137, barW, 4, cols[state.chronoEra]);
    } else if (wId === 2) {
      drawTextCentered('IDOL TRAP', 288, 116, C_GOLD, 1);

      drawTextCentered('IDOLS: ' + idolsLeft, 288, 127, idolsLeft > 0 ? C_LTRED : C_LIME, 1);
      fillSolidRect(263, 137, 50, 4, (tick & 16) && idolsLeft > 0 ? C_ORANGE : C_DKGRAY);
    } else if (wId === 3) {
      drawTextCentered('GRAV WELL', 288, 116, C_LTCYAN, 1);
      drawTextCentered('2 VORTICES', 288, 127, C_BLUE, 1);
      const pulse = Math.round(25 + Math.sin(tick * 0.12) * 22);
      fillSolidRect(263, 137, 50, 4, C_DKBLUE);
      fillSolidRect(263 + (25 - (pulse >> 1)), 137, pulse, 4, C_CYAN);
    } else if (wId === 4) {
      drawTextCentered('LOOM DRAFT', 288, 116, C_LTCYAN, 1);
      for (let i = 0; i < 4; i++) {
        const n = state.loomNotes[i] || '-';
        drawText(n, 265 + i * 13, 129, n === '-' ? C_DKGRAY : C_GOLD, 1);
      }
    } else if (wId === 5) {
      drawTextCentered('CONVOY MPH', 288, 116, C_ORANGE, 1);
      const mph = 85 + Math.round(Math.abs(Math.cos(state.highwayPhase)) * 35);
      drawTextCentered(mph + ' MPH', 288, 127, C_GOLD, 1);
      fillSolidRect(263, 137, Math.min(50, (mph - 60)), 4, C_RED);
    } else {
      drawTextCentered('LECHUCK HP', 288, 116, C_LTRED, 1);
      const ratio = state.boss ? (state.boss.hp / state.boss.maxHp) : 0;
      fillSolidRect(263, 128, 50, 11, C_DKGRAY);
      fillSolidRect(264, 129, Math.round(48 * ratio), 9, ratio > 0.5 ? C_LIME : C_RED);
    }

    // 6. Active Capsule Icons Slot (y=148..172)
    drawBevelBox(259, 148, 58, 24, 10, 12, 22, C_DKGRAY, C_LTGRAY);
    const p = state.paddle;
    const slots = [
      { k: 'L', rem: p.laserTicks, max: 960, col: C_LTRED },
      { k: 'E', rem: p.expandTicks, max: 960, col: C_GOLD },
      { k: 'C', rem: p.catchTicks, max: 960, col: C_LIME },
      { k: 'S', rem: p.slowTicks, max: 720, col: C_MAGENTA }
    ];
    for (let i = 0; i < 4; i++) {
      const sl = slots[i];
      const bx = 262 + i * 13;
      const on = sl.rem > 0;
      fillSolidRect(bx, 151, 11, 14, on ? C_BLUE : C_BLACK);
      drawText(sl.k, bx + 3, 154, on ? sl.col : C_DKGRAY, 1);
      fillSolidRect(bx, 166, 11, 3, C_BLACK);
      if (on) {
        fillSolidRect(bx + 1, 167, Math.max(1, Math.round(9 * (sl.rem / sl.max))), 1, sl.col);
      }
    }

    // 7. Scrolling OPL2 Song Title Marquee + Mute/Pause Status (y=175..196)
    drawBevelBox(259, 175, 58, 21, 6, 8, 14, C_DKGRAY, C_LTGRAY);
    const marquee = '~ OPL2 FM: ' + AudioEngine.getTrackTitle() + '   ';
    const mw = measureText(marquee, 1);
    const scrollX = 315 - ((tick >> 1) % (mw + 56));
    drawText(marquee, scrollX, 178, C_LIME, 1, { clipX0: 261, clipX1: 315 });
    drawText(AudioEngine.isMuted() ? 'M:MUTE' : 'M:ON', 262, 187, AudioEngine.isMuted() ? C_LTRED : C_LTGRAY, 1);
    drawText('P:PAU', 292, 187, state.mode === 'PAUSE' ? C_GOLD : C_LTGRAY, 1);
  }

  function renderPaddleAndEntities(tick) {
    const p = state.paddle;
    const ox = state.shakeX, oy = state.shakeY;

    // 1. Bricks (9x7 sprites blitted at x-1, y-1 so 1px silhouette outline wraps cleanly!)
    const anim4 = (tick >> 3) & 3;
    for (let i = 0; i < state.bricks.length; i++) {
      const br = state.bricks[i];
      if (!br.alive) continue;
      let spr = null;
      if (br.kind === 'NORMAL') {
        spr = BRICK_SPRITES[br.colorKey] || BRICK_SPRITES.W;
      } else if (br.kind === 'ARMOR') {
        spr = BRICK_SPRITES.ARMOR[Math.max(0, Math.min(2, br.hp - 1))];
      } else if (br.kind === 'STEEL') {
        spr = BRICK_SPRITES.STEEL[br.glintTicks > 0 ? 1 : 0];
      } else if (br.kind === 'GROG') {
        spr = BRICK_SPRITES.GROG[(anim4 + br.col) & 3];
      } else if (br.kind === 'MECH') {
        spr = BRICK_SPRITES.MECH[br.mechKey][(anim4 + br.row) & 3];
      }
      if (spr) {
        blitSprite(spr, br.x - 1 + ox, br.y - 1 + oy, true, br.glintTicks > 3 && br.kind !== 'STEEL');
      }
    }

    // 2. World 4 Swirling Gravity Vortices
    if (state.vortices.length > 0) renderGravityVortices(tick);

    // 3. Level 33 Ghost Pirate LeChuck Boss!
    if (state.boss && state.boss.hp > 0) {
      const bs = state.boss;
      const bSpr = LECHUCK_SPRITES[(tick >> 2) & 3];
      blitSprite(bSpr, bs.x + ox, bs.y + oy, true, bs.flashTicks > 0);
    }

    // 4. Sculpted 18x9 Falling Capsules
    const capShimmer = (tick >> 4) & 1;
    for (const cap of state.capsules) {
      blitSprite(CAPSULE_SPRITES[cap.type][capShimmer], cap.x + ox, cap.y + oy, true);
    }

    // 5. Space-Ranger Twin Lasers
    for (const ls of state.lasers) {
      const lx = (ls.x + ox) | 0, ly = (ls.y + oy) | 0;
      fillSolidRect(lx - 1, ly - 3, 3, 7, C_BLACK);
      fillSolidRect(lx, ly - 2, 1, 5, C_WHITE);
      putPixel(lx, ly - 3, C_CYAN);
      putPixel(lx, ly + 3, C_RED);
    }

    // 6. Atlantean Poison Darts & Voodoo Skulls
    for (const pr of state.projectiles) {
      if (pr.kind === 'DART') {
        blitSprite(POISON_DART_SPRITE, pr.x + ox, pr.y + oy, true);
      } else {
        blitSprite(VOODOO_SKULL_SPRITE[(tick >> 2) & 1], pr.x + ox, pr.y + oy, true);
      }
    }

    // 7. Sculpted Vaus Paddle (physically morphs for E, L, C!)
    let padSpr = PADDLE_SPRITES.NORMAL;
    let padOffY = -4;
    if (p.expandTicks > 0) {
      padSpr = p.laserTicks > 0 ? PADDLE_SPRITES.EXPAND_LASER : PADDLE_SPRITES.EXPAND;
      padOffY = -6;
    } else if (p.laserTicks > 0) {
      padSpr = PADDLE_SPRITES.LASER;
      padOffY = -6;
    } else if (p.catchTicks > 0) {
      padSpr = PADDLE_SPRITES.CATCH;
      padOffY = -5;
    }
    blitSprite(padSpr, Math.round(p.x - padSpr.w * 0.5) + ox, p.y + padOffY + oy, true, p.stunTicks > 0 && (tick & 2) === 0);

    // 8. Specular-Lit 5x5 Balls + Bayer-Stippled Afterimage Trails
    for (const b of state.balls) {
      const ballSpr = b.pierceTicks > 0 ? BALL_FIRE : (p.slowTicks > 0 ? BALL_PLASMA : BALL_CHROME);
      for (let ti = 0; ti < b.trail.length; ti++) {
        const tr = b.trail[ti];
        const dens = (ti + 1) * 2;
        blitSpriteStipple(ballSpr, Math.round(tr.x - 2) + ox, Math.round(tr.y - 2) + oy, dens, C_CYAN, true);
      }
      blitSprite(ballSpr, Math.round(b.x - 2) + ox, Math.round(b.y - 2) + oy, true);
    }

    // 9. EGA Stipple Shockwaves, Physics Sparks & Floating Outlined Popups
    renderShockwaves();
    for (const sp of state.sparks) {
      const sx = (sp.x + ox) | 0, sy = (sp.y + oy) | 0;
      if (sx >= INNER_X0 && sx < INNER_X1 && sy >= INNER_Y0 && sy < H) {
        fb[sy * W + sx] = sp.col;
      }
    }

    // Pirate Insult Sword-Fighting Banner
    if (state.duelBannerTicks > 0) {
      drawBevelBox(22, 10, 212, 13, 12, 6, 28, C_GOLD, C_RED);
      drawTextCentered(state.duelBanner, 128, 13, C_WHITE, 1, { colBot: C_GOLD });
    }

    for (const pp of state.popups) {
      if (pp.ticks > 10 || (pp.ticks & 1)) {
        drawTextCentered(pp.text, pp.x, pp.y | 0, C_WHITE, 1, { colBot: pp.col });
      }
    }
  }

  function renderOverlayScreens(tick) {
    if (state.mode === 'MENU') {
      // Rendered directly over the live animated backdrop + brick mosaic of selected level (1-33)!
      const lvl = LEVELS[state.selectedLevel];
      // Translucent Bayer-stippled shadow plaque at top & bottom so mosaic shines in center!
      for (let y = 10; y < 56; y++) {
        for (let x = 16; x < 240; x++) {
          if (BAYER_4X4[((y & 3) << 2) | (x & 3)] < 11) fb[y * W + x] = C_BLACK;
        }
      }
      drawTextCentered('SCUMM-OID', 128, 14, C_WHITE, 3, { colMid: C_GOLD, colBot: C_ORANGE });
      drawTextCentered('64-COLOR EGA SHADER EDITION', 128, 39, C_LTCYAN, 1, { colBot: C_BLUE });

      // Stage Selector Plaque near bottom
      drawBevelBox(16, 130, 224, 48, 12, 14, 30, C_GOLD, C_BLUE);
      const stgStr = '< STAGE ' + String(state.selectedLevel + 1).padStart(2, '0') + '/33 >';
      drawTextCentered(stgStr, 128, 134, C_WHITE, 1, { colBot: C_GOLD });
      drawTextCentered(lvl.name, 128, 144, C_LIME, 1);
      drawTextCentered('LEFT/RIGHT: STAGE   M: MUTE   P: PAUSE', 128, 155, C_LTGRAY, 1);
      if ((tick % 48) < 34) {
        drawTextCentered('CLICK OR SPACE TO LAUNCH!', 128, 166, C_WHITE, 1, { colBot: C_CYAN });
      }
    } else if (state.mode === 'PAUSE') {
      drawBevelBox(66, 80, 124, 38, 14, 16, 36, C_CYAN, C_BLUE);
      drawTextCentered('PAUSED', 128, 86, C_WHITE, 2, { colBot: C_GOLD });
      drawTextCentered('PRESS P TO RESUME', 128, 105, C_LTCYAN, 1);
    } else if (state.mode === 'STAGE_CLEAR') {
      drawBevelBox(44, 76, 168, 42, 12, 24, 28, C_LIME, C_EMERALD);
      drawTextCentered('STAGE CLEAR!', 128, 83, C_WHITE, 2, { colBot: C_LIME });
      drawTextCentered('WARPING TO NEXT MOSAIC...', 128, 104, C_GOLD, 1);
    } else if (state.mode === 'GAME_OVER') {
      drawBevelBox(44, 72, 168, 52, 32, 8, 16, C_LTRED, C_RED);
      drawTextCentered('GAME OVER', 128, 79, C_WHITE, 2, { colBot: C_LTRED });
      drawTextCentered('FINAL SCORE: ' + state.score, 128, 99, C_GOLD, 1);
      if ((tick % 44) < 30) {
        drawTextCentered('SPACE OR CLICK FOR MENU', 128, 111, C_WHITE, 1);
      }
    } else if (state.mode === 'VICTORY') {
      if ((tick % 18) === 0) {
        spawnSparks(40 + Math.random() * 176, 35 + Math.random() * 90, C_GOLD, C_CYAN, 16);
      }
      drawBevelBox(24, 58, 208, 76, 18, 14, 42, C_GOLD, C_PURPLE);
      drawTextCentered('VICTORY!', 128, 65, C_WHITE, 3, { colMid: C_GOLD, colBot: C_ORANGE });
      drawTextCentered('LECHUCK IS BANISHED!', 128, 92, C_LIME, 1);
      drawTextCentered('GRAND SCORE: ' + state.score, 128, 104, C_WHITE, 1, { colBot: C_GOLD });
      drawTextCentered('CLICK OR SPACE FOR STAGE SELECT', 128, 118, C_LTCYAN, 1);
    }
  }

  function renderFrame() {
    const activeIdx = state.mode === 'MENU' ? state.selectedLevel : state.levelIdx;
    const worldId = LEVELS[activeIdx].world;
    const paddleNormX = (state.paddle.x - INNER_X0) / 240;

    renderWorldBackdrop(worldId, state.tick, paddleNormX, state.chronoEra);
    renderPlayfieldPipes();
    renderPaddleAndEntities(state.tick);
    renderHudSidebar(state.tick);
    renderOverlayScreens(state.tick);

    ctx.putImageData(imageData, 0, 0);
  }

  // ============================================================================
  // 9. LOCKED-60-FPS MAIN GAME LOOP & BOOTSTRAP
  // ============================================================================
  loadLevel(0, true);

  const FIXED_STEP = 1000 / 60;
  let lastTime = performance.now();
  let accumulator = 0;

  function stepSimulation() {
    state.tick++;
    if (state.mode === 'PLAY') {
      updateGameplay();
      updateParticlesAndOverlays();
    } else if (state.mode === 'STAGE_CLEAR') {
      updateParticlesAndOverlays();
      state.clearTimer--;
      if (state.clearTimer <= 0) {
        loadLevel(state.levelIdx + 1, false);
        state.mode = 'PLAY';
      }
    } else if (state.mode === 'MENU') {
      // Gently animate Vaus preview paddle following mouse or smooth demo sway
      if (mouseTargetX !== null) {
        state.paddle.x = clampPaddleX(mouseTargetX, state.paddle.w);
      } else {
        state.paddle.x = clampPaddleX(128 + Math.sin(state.tick * 0.03) * 58, state.paddle.w);
      }
      if (state.balls[0]) {
        state.balls[0].x = state.paddle.x + 3;
        state.balls[0].y = state.paddle.y - 5.5;
      }
      if (state.boss) {
        state.boss.x = 108 + Math.sin(state.tick * 0.035) * 65;
      }
    } else if (state.mode === 'VICTORY') {
      updateParticlesAndOverlays();
    }
  }

  function mainLoop(now) {
    const dt = Math.min(100, now - lastTime);
    lastTime = now;
    accumulator += dt;

    while (accumulator >= FIXED_STEP) {
      stepSimulation();
      accumulator -= FIXED_STEP;
    }
    renderFrame();
    requestAnimationFrame(mainLoop);
  }

  renderFrame();
  requestAnimationFrame(mainLoop);
})();
</script>
</body>
</html>
