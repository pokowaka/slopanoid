function addScore(pts, popupX, popupY, labelOverride, reg = 62) {
  game.score = Math.min(9999999, game.score + (pts | 0));
  if (game.score > game.hiScore) {
    game.hiScore = game.score;
    saveHiScore(game.hiScore);
  }
  if (popupX !== undefined && popupY !== undefined) {
    spawnPopup(popupX, popupY, labelOverride || `+${pts}`, reg);
  }
}

function spawnPopup(x, y, text, reg = 63) {
  if (game.popups.length > 14) game.popups.shift();
  game.popups.push({
    x: Math.max(PF_X + 18, Math.min(PF_RIGHT - 18, x)),
    y: Math.max(PF_Y + 10, y),
    text,
    reg,
    life: 0.95,
    maxLife: 0.95
  });
}

function spawnParticles(x, y, baseReg, count = 8, speedScale = 1) {
  const hi = egaShade(baseReg, +1);
  for (let i = 0; i < count; i++) {
    if (game.particles.length > 180) game.particles.shift();
    const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.6;
    const spd = (28 + Math.random() * 62) * speedScale;
    game.particles.push({
      x,
      y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 18,
      reg: (i & 1) ? baseReg : hi,
      size: (i % 3 === 0) ? 2 : 1,
      life: 0.35 + Math.random() * 0.35
    });
  }
}

function triggerScreenShake(mag = 2, dur = 0.18) {
  game.shakeMag = Math.max(game.shakeMag, mag);
  game.shakeTimer = Math.max(game.shakeTimer, dur);
}

function triggerStippleFlash(reg = 63, dur = 0.10) {
  game.stippleFlashReg = reg;
  game.stippleFlashTimer = dur;
}

function createBall(x, y, vx, vy, stuck = false, stuckOffset = 0) {
  const baseSpd = getTargetBallSpeed();
  const mag = Math.hypot(vx, vy) || 1;
  return {
    x,
    y,
    r: 2.25,
    vx: (vx / mag) * baseSpd,
    vy: (vy / mag) * baseSpd,
    speed: baseSpd,
    stuck,
    stuckOffset,
    catchHoldTimer: 0,
    steelBounces: 0,
    trail: []
  };
}

function getTargetBallSpeed() {
  const levelBoost = Math.min(46, (game.level - 1) * 1.35);
  const raw = 108 + levelBoost;
  return game.slowTimer > 0 ? raw * 0.74 : raw;
}

function syncPaddleWidth() {
  if (game.paddle.hexTimer > 0) {
    game.paddle.w = 22;
  } else if (game.paddle.expand) {
    game.paddle.w = 48;
  } else {
    game.paddle.w = 32;
  }
  const half = game.paddle.w * 0.5;
  game.paddle.x = Math.max(PF_X + half, Math.min(PF_RIGHT - half, game.paddle.x));
}

function resetPaddleAndBall(keepPowerups = false) {
  if (!keepPowerups) {
    game.paddle.expand = false;
    game.paddle.laser = false;
    game.paddle.catchMode = false;
    game.paddle.hexTimer = 0;
    game.slowTimer = 0;
    game.riposteTimer = 0;
  }
  syncPaddleWidth();
  game.paddle.x = PF_X + PF_W * 0.5;
  game.lasers.length = 0;
  game.capsules.length = 0;
  game.hazards.length = 0;
  game.combo = 0;

  const b = createBall(game.paddle.x, game.paddle.y - 4, 0.42, -0.91, true, 3);
  game.balls = [b];
}

function parseBrickCell(ch, row, col, worldIdx) {
  if (!ch || ch === '.' || ch === ' ') return null;
  const bx = GRID_X + col * BRICK_W;
  const by = GRID_Y + row * BRICK_H;

  if (ch === '#') {
    return {
      row, col, x: bx, y: by, w: BRICK_W, h: BRICK_H,
      type: 'steel', reg: 7, hp: 999999, maxHp: 999999,
      destructible: false, flashTimer: 0, alive: true
    };
  }
  if (ch === '*') {
    return {
      row, col, x: bx, y: by, w: BRICK_W, h: BRICK_H,
      type: 'grog', reg: 58, hp: 1, maxHp: 1,
      destructible: true, flashTimer: 0, alive: true
    };
  }
  if (ch === '!' || ch === '?') {
    return {
      row, col, x: bx, y: by, w: BRICK_W, h: BRICK_H,
      type: ch === '!' ? 'specialA' : 'specialB',
      reg: ch === '!' ? 54 : 59,
      hp: (worldIdx === 2 && ch === '!') ? 2 : 1,
      maxHp: (worldIdx === 2 && ch === '!') ? 2 : 1,
      destructible: true, flashTimer: 0, alive: true,
      notePitch: (row + col) & 7
    };
  }

  const lower = ch.toLowerCase();
  const reg = BRICK_COLOR_MAP[lower];
  if (reg === undefined) return null;
  const isUpper = ch !== lower;
  const maxHp = !isUpper ? 1 : ((ch === 'W' || ch === 'X' || ch === 'S' || ch === 'L') ? 3 : 2);
  return {
    row, col, x: bx, y: by, w: BRICK_W, h: BRICK_H,
    type: isUpper ? 'armor' : 'normal',
    reg,
    hp: maxHp,
    maxHp,
    destructible: true,
    flashTimer: 0,
    alive: true
  };
}

function loadStage(levelNum1Based, forMenuPreview = false) {
  const clamped = Math.max(1, Math.min(LEVELS.length, levelNum1Based | 0));
  game.level = clamped;
  game.world = getWorldForLevel(clamped);
  OPL2Engine.setWorldTrack(game.world);

  const def = LEVELS[clamped - 1];
  game.bricks = [];
  game.grid = Array.from({ length: GRID_ROWS }, () => new Array(GRID_COLS).fill(null));
  game.particles.length = 0;
  game.popups.length = 0;
  game.hazards.length = 0;
  game.capsules.length = 0;
  game.lasers.length = 0;
  game.delayedGrogs.length = 0;

  for (let r = 0; r < GRID_ROWS; r++) {
    const line = def.rows[r] || '';
    game.roadOffsets[r] = 0;
    game.roadDirs[r] = (r & 1) ? -1 : 1;
    for (let c = 0; c < GRID_COLS; c++) {
      const cell = parseBrickCell(line[c], r, c, game.world);
      if (cell) {
        game.bricks.push(cell);
        game.grid[r][c] = cell;
      }
    }
  }

  // World mechanic per-stage setup
  game.chronoEra = 1; // Start in PRESENT so all bricks are visible immediately
  game.chronoTimer = 6.5;
  game.dartCooldown = 2.0;
  game.loomNotes = [];

  // World 4 Orbital Gravity Wells
  game.gravityWells = [];
  if (game.world === 3) {
    if (clamped % 2 === 1) {
      game.gravityWells.push({ x: PF_X + PF_W * 0.5, y: 138, pull: 3100 });
    } else {
      game.gravityWells.push({ x: PF_X + 66,  y: 138, pull: 2500 });
      game.gravityWells.push({ x: PF_X + 174, y: 138, pull: 2500 });
    }
  }

  // World 7 Level 33 Boss: Ghost Pirate LeChuck (38x28 pixels)
  if (clamped === 33) {
    game.boss = {
      x: PF_X + PF_W * 0.5 - 19,
      y: 16,
      w: 38,
      h: 28,
      hp: 28,
      maxHp: 28,
      vx: 38,
      phase: 0,
      fireTimer: 2.1,
      summonTimer: 7.0,
      flashTimer: 0,
      alive: true
    };
  } else {
    game.boss = null;
  }

  resetPaddleAndBall(false);
  if (!forMenuPreview) {
    spawnPopup(PF_X + PF_W / 2, 146, `STAGE ${String(clamped).padStart(2, '0')}`, 62);
  }
}

function isBrickPhasedOut(brick) {
  if (game.world !== 1) return false;
  if (brick.type === 'specialA' && game.chronoEra === 2) return true;
  if (brick.type === 'specialB' && game.chronoEra === 0) return true;
  return false;
}

function countRemainingDestructibleBricks() {
  let rem = 0;
  for (let i = 0; i < game.bricks.length; i++) {
    const b = game.bricks[i];
    if (b.alive && b.destructible) rem++;
  }
  return rem;
}

function maybeSpawnCapsule(x, y) {
  if (game.capsules.length >= 3) return;
  if (Math.random() > 0.19) return;
  const roll = Math.random();
  let kind = 'E';
  if (roll < 0.26) kind = 'L';
  else if (roll < 0.52) kind = 'E';
  else if (roll < 0.74) kind = 'C';
  else if (roll < 0.93) kind = 'S';
  else kind = 'P';
  game.capsules.push({ x: Math.max(PF_X + 2, Math.min(PF_RIGHT - 20, x - 9)), y, w: 18, h: 9, kind, vy: 44 });
}

function applyCapsulePowerup(kind) {
  OPL2Engine.playSFX('powerup');
  const px = game.paddle.x;
  const py = game.paddle.y - 8;
  if (kind === 'L') {
    game.paddle.laser = true;
    addScore(250, px, py, 'LASER!', 60);
  } else if (kind === 'E') {
    game.paddle.expand = true;
    game.paddle.hexTimer = 0;
    syncPaddleWidth();
    addScore(250, px, py, 'CHICKEN!', 62);
  } else if (kind === 'C') {
    game.paddle.catchMode = true;
    addScore(250, px, py, 'COMPASS!', 58);
  } else if (kind === 'S') {
    game.slowTimer = 14.0;
    const spd = getTargetBallSpeed();
    for (const b of game.balls) {
      const m = Math.hypot(b.vx, b.vy) || 1;
      b.speed = spd;
      b.vx = (b.vx / m) * spd;
      b.vy = (b.vy / m) * spd;
    }
    addScore(250, px, py, 'SLOW!', 59);
  } else if (kind === 'P') {
    game.lives = Math.min(9, game.lives + 1);
    addScore(1000, px, py, '1UP GOLD GUY!', 54);
  }
}

function triggerLoomSpell() {
  const spell = LOOM_SPELLS[game.loomSpellIdx % LOOM_SPELLS.length];
  game.loomSpellIdx++;
  triggerStippleFlash(spell.reg, 0.12);
  OPL2Engine.playSFX('fanfare');
  addScore(500, PF_X + PF_W * 0.5, 128, spell.name, spell.reg);

  if (spell.kind === 'crack') {
    for (const b of game.bricks) {
      if (b.alive && b.type === 'armor' && b.hp > 1) {
        b.hp--;
        b.flashTimer = 0.12;
      }
    }
  } else if (spell.kind === 'multiball') {
    const ref = game.balls[0];
    if (ref && game.balls.length < 4) {
      const nb = createBall(ref.x, ref.y, -ref.vx + 22, -Math.abs(ref.vy), false, 0);
      game.balls.push(nb);
    }
  } else if (spell.kind === 'vaporize') {
    const targets = game.bricks.filter(b => b.alive && b.destructible);
    for (let k = 0; k < Math.min(4, targets.length); k++) {
      const pick = targets[(Math.random() * targets.length) | 0];
      if (pick && pick.alive) destroyBrick(pick, true);
    }
  }
}

function triggerGrogExplosion(centerRow, centerCol) {
  OPL2Engine.playSFX('grog');
  triggerScreenShake(2, 0.22);
  triggerStippleFlash(58, 0.09);

  const cx = GRID_X + centerCol * BRICK_W + 4;
  const cy = GRID_Y + centerRow * BRICK_H + 3;
  spawnParticles(cx, cy, 58, 16, 1.45);
  spawnPopup(cx, cy, 'GROG BOOM!', 58);

  // Splash damage to Ghost Pirate LeChuck if nearby!
  if (game.boss && game.boss.alive) {
    const bCx = game.boss.x + game.boss.w * 0.5;
    const bCy = game.boss.y + game.boss.h * 0.5;
    if (Math.hypot(bCx - cx, bCy - cy) < 54) {
      damageLeChuck(4, bCx, bCy, 'ROOT BEER! -4');
    }
  }

  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      const nr = centerRow + dr;
      const nc = centerCol + dc;
      if (nr < 0 || nr >= GRID_ROWS || nc < 0 || nc >= GRID_COLS) continue;
      const nb = game.grid[nr][nc];
      if (!nb || !nb.alive) continue;
      if (nb.type === 'grog' && (dr !== 0 || dc !== 0)) {
        // Recursive staggered chain reaction!
        nb.alive = false;
        addScore(150);
        game.delayedGrogs.push({ timer: 0.065, row: nr, col: nc });
      } else {
        // Grog acid melts normal, armored, special AND steel bricks in 3x3 blast!
        nb.alive = false;
        spawnParticles(nb.x + 4, nb.y + 3, nb.reg, 5, 1.0);
        addScore(nb.type === 'steel' ? 200 : 75);
      }
    }
  }
}

function handleWorldMechanicBrickDestroyed(brick) {
  const cx = brick.x + 4;
  const cy = brick.y + 3;
  if (game.world === 0) {
    // Monkey Island Insult Sword Fighting!
    const pair = INSULT_PAIRS[game.insultIdx % INSULT_PAIRS.length];
    game.insultIdx++;
    game.riposteTimer = 8.5;
    OPL2Engine.playSFX('sword');
    spawnPopup(PF_X + PF_W * 0.5, cy, pair[1], 62);
    void pair[0];
  } else if (game.world === 1) {
    // Chron-o-John Flush Surge
    OPL2Engine.playSFX('flush');
    game.chronoEra = (game.chronoEra + 1) % 3;
    game.chronoTimer = 6.5;
    const names = ['1787 PAST!', 'PRESENT!', '2187 FUTURE!'];
    addScore(150, cx, cy, names[game.chronoEra], 59);
  } else if (game.world === 2) {
    addScore(200, cx, cy, 'IDOL SMASH!', 54);
  } else if (game.world === 3) {
    addScore(200, cx, cy, 'DIRECT HIT!', 60);
  } else if (game.world === 4) {
    const noteNames = ['C', 'D', 'E', 'F', 'G', 'A', 'B', 'C'];
    const pitch = brick.notePitch & 7;
    OPL2Engine.playSFX('loomNote', pitch);
    game.loomNotes.push(noteNames[pitch]);
    spawnPopup(cx, cy, `♪ ${noteNames[pitch]}`, 59);
    if (game.loomNotes.length >= 4) {
      game.loomNotes.length = 0;
      triggerLoomSpell();
    }
  } else if (game.world === 5) {
    addScore(200, cx, cy, 'MAX BOOST!', 61);
  } else if (game.world === 6 && game.boss && game.boss.alive) {
    // Voodoo Root-Beer Totem zaps LeChuck directly!
    damageLeChuck(2, game.boss.x + 19, game.boss.y + 14, 'VOODOO ZAP!');
  }
}

function destroyBrick(brick, fromSpell = false) {
  if (!brick.alive) return;
  brick.alive = false;
  game.combo++;

  const cx = brick.x + 4;
  const cy = brick.y + 3;
  spawnParticles(cx, cy, brick.reg, 7, 1.0);
  maybeSpawnCapsule(cx, cy);

  if (brick.type === 'grog') {
    addScore(150);
    triggerGrogExplosion(brick.row, brick.col);
    return;
  }

  const basePts = brick.type === 'armor' ? 120 : (brick.type.startsWith('special') ? 150 : 60);
  const riposteBonus = (game.world === 0 && game.riposteTimer > 0) ? 90 : 0;
  const totalPts = basePts + riposteBonus + Math.min(100, game.combo * 10);
  addScore(totalPts, game.combo % 4 === 0 ? cx : undefined, cy);

  if (!fromSpell) {
    OPL2Engine.playSFX('brick', game.combo);
  }

  if (brick.type === 'specialA' || brick.type === 'specialB') {
    handleWorldMechanicBrickDestroyed(brick);
  } else if (game.world === 4 && (game.combo % 5 === 0)) {
    // Weave ambient note on every 5th hit in Loom as well so Drafts stay lively
    const noteNames = ['E', 'G', 'B', 'C'];
    const idx = game.loomNotes.length & 3;
    OPL2Engine.playSFX('loomNote', idx * 2);
    game.loomNotes.push(noteNames[idx]);
    if (game.loomNotes.length >= 4) {
      game.loomNotes.length = 0;
      triggerLoomSpell();
    }
  }
}

function hitBrick(brick, dmg = 1) {
  if (!brick.alive) return;
  if (brick.type === 'steel') {
    brick.flashTimer = 0.06;
    OPL2Engine.playSFX('steel');
    spawnParticles(brick.x + 4, brick.y + 3, 63, 3, 0.6);
    return;
  }
  const actualDmg = (game.world === 0 && game.riposteTimer > 0) ? Math.max(2, dmg) : dmg;
  brick.hp -= actualDmg;
  if (brick.hp <= 0) {
    destroyBrick(brick, false);
  } else {
    brick.flashTimer = 0.065;
    OPL2Engine.playSFX('armor');
    spawnParticles(brick.x + 4, brick.y + 3, brick.reg, 4, 0.7);
  }
}

function damageLeChuck(dmg, popX, popY, msg) {
  if (!game.boss || !game.boss.alive) return;
  game.boss.hp = Math.max(0, game.boss.hp - dmg);
  game.boss.flashTimer = 0.09;
  OPL2Engine.playSFX('bossHit');
  triggerScreenShake(2, 0.18);
  addScore(300 * dmg, popX, popY, msg || `-${dmg} HP!`, 58);
  spawnParticles(popX, popY, 58, 12, 1.3);

  if (game.boss.hp <= 0) {
    game.boss.alive = false;
    triggerScreenShake(3, 0.55);
    triggerStippleFlash(58, 0.22);
    OPL2Engine.playSFX('fanfare');
    spawnParticles(game.boss.x + 19, game.boss.y + 14, 58, 45, 2.0);
    spawnParticles(game.boss.x + 19, game.boss.y + 14, 62, 35, 1.7);
    addScore(10000, PF_X + PF_W * 0.5, 64, 'LECHUCK VAPORIZED!', 62);
    // Shatter any remaining ghost bricks in victory wave
    for (const b of game.bricks) {
      if (b.alive) {
        b.alive = false;
        spawnParticles(b.x + 4, b.y + 3, b.reg, 2, 0.9);
      }
    }
    game.state = 'VICTORY';
    game.clearTimer = 0;
  }
}

function launchOrFireAction() {
  OPL2Engine.unlock();
  if (game.state === 'MENU') {
    game.score = 0;
    game.lives = 3;
    loadStage(game.menuLevel, false);
    game.state = 'PLAYING';
    return;
  }
  if (game.state === 'LEVEL_CLEAR') {
    advanceNextStage();
    return;
  }
  if (game.state === 'GAME_OVER' || game.state === 'VICTORY') {
    game.menuLevel = game.state === 'VICTORY' ? 1 : game.level;
    loadStage(game.menuLevel, true);
    game.state = 'MENU';
    return;
  }
  if (game.state !== 'PLAYING') return;

  // Release any caught/docked balls
  let released = false;
  for (const b of game.balls) {
    if (b.stuck) {
      b.stuck = false;
      b.catchHoldTimer = 0;
      const spd = getTargetBallSpeed();
      const norm = Math.max(-0.75, Math.min(0.75, b.stuckOffset / (game.paddle.w * 0.5)));
      const ang = norm * 0.85 || 0.32;
      b.vx = Math.sin(ang) * spd;
      b.vy = -Math.cos(ang) * spd;
      b.speed = spd;
      released = true;
    }
  }
  if (released) {
    OPL2Engine.playSFX('paddle', 0.3);
  }

  // Fire Twin Space-Ranger Blasters if Laser upgrade active
  if (game.paddle.laser && game.paddle.laserCooldown <= 0 && game.lasers.length < 6) {
    const hw = game.paddle.w * 0.5 - 3;
    game.lasers.push({ x: game.paddle.x - hw, y: game.paddle.y - 5, vy: -225 });
    game.lasers.push({ x: game.paddle.x + hw, y: game.paddle.y - 5, vy: -225 });
    game.paddle.laserCooldown = 0.24;
    OPL2Engine.playSFX('laser');
  }
}

function advanceNextStage() {
  if (game.level >= LEVELS.length) {
    game.state = 'VICTORY';
    return;
  }
  loadStage(game.level + 1, false);
  game.state = 'PLAYING';
}

// ============================================================================
// SWEPT / SUB-STEPPED CIRCLE-VS-AABB COLLISION SOLVER (ZERO CLIPPING / SEAMS)
// ============================================================================
function hasSolidNeighbor(row, col) {
  if (row < 0 || row >= GRID_ROWS || col < 0 || col >= GRID_COLS) return false;
  const nb = game.grid[row][col];
  return !!(nb && nb.alive && !isBrickPhasedOut(nb));
}

function enforceMinVerticalAngle(ball) {
  const spd = ball.speed;
  const minVy = spd * 0.22;
  if (Math.abs(ball.vy) < minVy) {
    const signY = ball.vy < 0 ? -1 : 1;
    const signX = ball.vx < 0 ? -1 : 1;
    ball.vy = signY * minVy;
    ball.vx = signX * Math.sqrt(Math.max(1, spd * spd - ball.vy * ball.vy));
  } else {
    const m = Math.hypot(ball.vx, ball.vy) || 1;
    ball.vx = (ball.vx / m) * spd;
    ball.vy = (ball.vy / m) * spd;
  }
}

function stepSingleBallSubstep(ball, subDt) {
  // World 4 Orbital Gravity Wells smooth curvature
  for (const gw of game.gravityWells) {
    const dx = gw.x - ball.x;
    const dy = gw.y - ball.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 6 && dist < 52) {
      const force = (gw.pull / (dist * dist + 140)) * subDt;
      // Blend radial pull + subtle orbital swirl
      ball.vx += (dx / dist + (-dy / dist) * 0.35) * force;
      ball.vy += (dy / dist + (dx / dist) * 0.35) * force;
      const m = Math.hypot(ball.vx, ball.vy) || 1;
      ball.vx = (ball.vx / m) * ball.speed;
      ball.vy = (ball.vy / m) * ball.speed;
    }
  }

  ball.x += ball.vx * subDt;
  ball.y += ball.vy * subDt;

  // Playfield border pipe bounces (Left x=8, Right x=248, Top y=8)
  if (ball.x - ball.r < PF_X) {
    ball.x = PF_X + ball.r;
    ball.vx = Math.abs(ball.vx);
    OPL2Engine.playSFX('paddle', 0);
  } else if (ball.x + ball.r > PF_RIGHT) {
    ball.x = PF_RIGHT - ball.r;
    ball.vx = -Math.abs(ball.vx);
    OPL2Engine.playSFX('paddle', 0);
  }
  if (ball.y - ball.r < PF_Y) {
    ball.y = PF_Y + ball.r;
    ball.vy = Math.abs(ball.vy);
    OPL2Engine.playSFX('paddle', 0);
  }

  // Paddle collision (top + rounded shoulder edges when descending)
  const pad = game.paddle;
  const pLeft = pad.x - pad.w * 0.5;
  const pRight = pad.x + pad.w * 0.5;
  const pTop = pad.y;
  const pBot = pad.y + pad.h;

  if (ball.vy > 0 && ball.y + ball.r >= pTop && ball.y - ball.r <= pBot - 1 &&
      ball.x + ball.r >= pLeft && ball.x - ball.r <= pRight) {
    ball.y = pTop - ball.r - 0.05;
    game.combo = 0;
    ball.steelBounces = 0;

    const hitNorm = Math.max(-1, Math.min(1, (ball.x - pad.x) / (pad.w * 0.5)));
    if (pad.catchMode) {
      ball.stuck = true;
      ball.stuckOffset = ball.x - pad.x;
      ball.catchHoldTimer = 7.5;
      OPL2Engine.playSFX('paddle', hitNorm);
      return;
    }
    const maxAngle = (64 * Math.PI) / 180;
    const bounceAngle = hitNorm * maxAngle;
    const spd = getTargetBallSpeed();
    ball.speed = spd;
    ball.vx = Math.sin(bounceAngle) * spd;
    ball.vy = -Math.cos(bounceAngle) * spd;
    // Prevent dead-vertical stall on exact center hit
    if (Math.abs(ball.vx) < 12) ball.vx = (hitNorm >= 0 ? 1 : -1) * 14;
    enforceMinVerticalAngle(ball);
    OPL2Engine.playSFX('paddle', hitNorm);
    return;
  }

  // Level 33 Boss AABB Collision (Ghost Pirate LeChuck)
  if (game.boss && game.boss.alive) {
    const bx0 = game.boss.x + 3;
    const by0 = game.boss.y + 2;
    const bx1 = game.boss.x + game.boss.w - 3;
    const by1 = game.boss.y + game.boss.h - 2;
    const qx = Math.max(bx0, Math.min(bx1, ball.x));
    const qy = Math.max(by0, Math.min(by1, ball.y));
    const dx = ball.x - qx;
    const dy = ball.y - qy;
    const d2 = dx * dx + dy * dy;
    if (d2 < ball.r * ball.r) {
      const dist = Math.sqrt(d2) || 0.001;
      const nx = dist > 0.002 ? dx / dist : 0;
      const ny = dist > 0.002 ? dy / dist : -1;
      ball.x += nx * (ball.r - dist + 0.4);
      ball.y += ny * (ball.r - dist + 0.4);
      if (Math.abs(dx) > Math.abs(dy)) ball.vx = -ball.vx;
      else ball.vy = -ball.vy;
      enforceMinVerticalAngle(ball);
      damageLeChuck(2, ball.x, ball.y, 'ARGH! -2');
      return;
    }
  }

  // Candidate Brick Collisions (check rows near ball, supporting moving World 6 rows!)
  const rMin = Math.max(0, Math.floor((ball.y - ball.r - GRID_Y) / BRICK_H) - 1);
  const rMax = Math.min(GRID_ROWS - 1, Math.ceil((ball.y + ball.r - GRID_Y) / BRICK_H) + 1);
  if (rMin >= GRID_ROWS || rMax < 0) return;

  let bestHit = null;
  for (let r = rMin; r <= rMax; r++) {
    const rowArr = game.grid[r];
    for (let c = 0; c < GRID_COLS; c++) {
      const br = rowArr[c];
      if (!br || !br.alive || isBrickPhasedOut(br)) continue;
      const qx = Math.max(br.x, Math.min(br.x + br.w, ball.x));
      const qy = Math.max(br.y, Math.min(br.y + br.h, ball.y));
      const dx = ball.x - qx;
      const dy = ball.y - qy;
      const distSq = dx * dx + dy * dy;
      if (distSq < ball.r * ball.r) {
        if (!bestHit || distSq < bestHit.distSq) {
          bestHit = { brick: br, dx, dy, distSq, qx, qy };
        }
      }
    }
  }

  if (bestHit) {
    const { brick, dx, dy, distSq } = bestHit;
    const dist = Math.sqrt(distSq);
    const pen = ball.r - dist + 0.03;

    // Determine primary collision axis with Seam Protection against adjacent flush bricks
    let flipX = false;
    let flipY = false;

    if (dist < 0.0001) {
      // Ball center slightly inside AABB: compare overlap depths to 4 faces
      const overlapL = (ball.x + ball.r) - brick.x;
      const overlapR = (brick.x + brick.w) - (ball.x - ball.r);
      const overlapT = (ball.y + ball.r) - brick.y;
      const overlapB = (brick.y + brick.h) - (ball.y - ball.r);
      const minX = Math.min(overlapL, overlapR);
      const minY = Math.min(overlapT, overlapB);
      if (minX < minY) {
        flipX = true;
        ball.x += overlapL < overlapR ? -minX : minX;
      } else {
        flipY = true;
        ball.y += overlapT < overlapB ? -minY : minY;
      }
    } else {
      const nx = dx / dist;
      const ny = dy / dist;
      ball.x += nx * pen;
      ball.y += ny * pen;

      const absX = Math.abs(dx);
      const absY = Math.abs(dy);
      const sideSignX = dx >= 0 ? 1 : -1;
      const sideSignY = dy >= 0 ? 1 : -1;

      if (absX > absY * 1.05) {
        // Horizontal face or corner: verify no flush neighbor brick blocking this seam!
        if (game.world !== 5 && hasSolidNeighbor(brick.row, brick.col + sideSignX)) {
          flipY = true;
        } else {
          flipX = true;
        }
      } else if (absY > absX * 1.05) {
        if (game.world !== 5 && hasSolidNeighbor(brick.row + sideSignY, brick.col)) {
          flipX = true;
        } else {
          flipY = true;
        }
      } else {
        // True exposed corner impact
        const blockX = game.world !== 5 && hasSolidNeighbor(brick.row, brick.col + sideSignX);
        const blockY = game.world !== 5 && hasSolidNeighbor(brick.row + sideSignY, brick.col);
        if (blockX && !blockY) flipY = true;
        else if (blockY && !blockX) flipX = true;
        else {
          // Reflect along corner normal if approaching corner
          const dot = ball.vx * nx + ball.vy * ny;
          if (dot < 0) {
            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;
          } else {
            flipY = true;
          }
        }
      }
    }

    if (flipX) {
      const sign = (ball.x < brick.x + brick.w * 0.5) ? -1 : 1;
      ball.vx = sign * Math.abs(ball.vx);
    }
    if (flipY) {
      const sign = (ball.y < brick.y + brick.h * 0.5) ? -1 : 1;
      ball.vy = sign * Math.abs(ball.vy);
    }

    if (brick.type === 'steel') {
      ball.steelBounces++;
      if (ball.steelBounces > 14) {
        // Nudge angle slightly so ball never traps indefinitely between parallel steel walls
        const ang = Math.atan2(ball.vy, ball.vx) + 0.09;
        ball.vx = Math.cos(ang) * ball.speed;
        ball.vy = Math.sin(ang) * ball.speed;
        ball.steelBounces = 0;
      }
    } else {
      ball.steelBounces = 0;
    }

    enforceMinVerticalAngle(ball);
    hitBrick(brick, 1);
  }
}

function updateWorldMechanics(dt) {
  // Delayed Grog recursive chain reactions
  for (let i = game.delayedGrogs.length - 1; i >= 0; i--) {
    const dg = game.delayedGrogs[i];
    dg.timer -= dt;
    if (dg.timer <= 0) {
      game.delayedGrogs.splice(i, 1);
      triggerGrogExplosion(dg.row, dg.col);
    }
  }

  if (game.riposteTimer > 0) game.riposteTimer = Math.max(0, game.riposteTimer - dt);
  if (game.paddle.hexTimer > 0) {
    game.paddle.hexTimer = Math.max(0, game.paddle.hexTimer - dt);
    if (game.paddle.hexTimer === 0) syncPaddleWidth();
  }
  if (game.paddle.invulnTimer > 0) game.paddle.invulnTimer = Math.max(0, game.paddle.invulnTimer - dt);
  if (game.paddle.laserCooldown > 0) game.paddle.laserCooldown = Math.max(0, game.paddle.laserCooldown - dt);
  if (game.slowTimer > 0) {
    game.slowTimer = Math.max(0, game.slowTimer - dt);
    if (game.slowTimer === 0) {
      const spd = getTargetBallSpeed();
      for (const b of game.balls) {
        const m = Math.hypot(b.vx, b.vy) || 1;
        b.speed = spd;
        b.vx = (b.vx / m) * spd;
        b.vy = (b.vy / m) * spd;
      }
    }
  }

  // World 2: Chron-o-John Era Phasing
  if (game.world === 1) {
    game.chronoTimer -= dt;
    if (game.chronoTimer <= 0) {
      game.chronoTimer = 6.5;
      // Smart check: if only specialA or specialB bricks remain, lock to PRESENT (era 1) so player never waits
      let hasA = false, hasB = false, hasOther = false;
      for (const b of game.bricks) {
        if (!b.alive || !b.destructible) continue;
        if (b.type === 'specialA') hasA = true;
        else if (b.type === 'specialB') hasB = true;
        else hasOther = true;
      }
      if (!hasOther && (hasA !== hasB)) {
        game.chronoEra = 1;
      } else {
        game.chronoEra = (game.chronoEra + 1) % 3;
      }
      OPL2Engine.playSFX('flush');
    }
  }

  // World 3: Fate of Atlantis Dart-Spitting Idol Traps
  if (game.world === 2 && game.state === 'PLAYING') {
    game.dartCooldown -= dt;
    if (game.dartCooldown <= 0) {
      game.dartCooldown = 2.4;
      const idols = game.bricks.filter(b => b.alive && b.type === 'specialA');
      if (idols.length > 0 && game.hazards.length < 4) {
        const src = idols[(Math.random() * idols.length) | 0];
        game.hazards.push({
          kind: 'dart',
          x: src.x + 4,
          y: src.y + 7,
          vx: 0,
          vy: 74,
          r: 3
        });
        src.flashTimer = 0.12;
        OPL2Engine.playSFX('dart');
      }
    }
  }

  // World 6: Sam & Max Moving Highway Road Formations
  if (game.world === 5) {
    for (let r = 0; r < GRID_ROWS; r++) {
      const rowArr = game.grid[r];
      let minCol = 999, maxCol = -1;
      for (let c = 0; c < GRID_COLS; c++) {
        if (rowArr[c] && rowArr[c].alive) {
          if (c < minCol) minCol = c;
          if (c > maxCol) maxCol = c;
        }
      }
      if (maxCol < 0) continue;
      const speed = 15 + (r % 3) * 5;
      let nextOff = game.roadOffsets[r] + game.roadDirs[r] * speed * dt;
      const minAllowed = -minCol * BRICK_W;
      const maxAllowed = (GRID_COLS - 1 - maxCol) * BRICK_W;
      if (nextOff <= minAllowed) {
        nextOff = minAllowed;
        game.roadDirs[r] = 1;
      } else if (nextOff >= maxAllowed) {
        nextOff = maxAllowed;
        game.roadDirs[r] = -1;
      }
      game.roadOffsets[r] = nextOff;
      const intOff = Math.round(nextOff);
      for (let c = 0; c < GRID_COLS; c++) {
        if (rowArr[c]) {
          rowArr[c].x = GRID_X + c * BRICK_W + intOff;
        }
      }
    }
  }

  // World 7 (Level 33): Ghost Pirate LeChuck Moving Boss AI & Voodoo Skulls
  if (game.boss && game.boss.alive && game.state === 'PLAYING') {
    const b = game.boss;
    const enraged = b.hp <= b.maxHp * 0.5;
    b.phase += dt * (enraged ? 2.6 : 1.7);
    if (b.flashTimer > 0) b.flashTimer = Math.max(0, b.flashTimer - dt);

    const speedMult = enraged ? 1.45 : 1.0;
    b.x += b.vx * speedMult * dt;
    if (b.x < PF_X + 6) {
      b.x = PF_X + 6;
      b.vx = Math.abs(b.vx);
    } else if (b.x + b.w > PF_RIGHT - 6) {
      b.x = PF_RIGHT - 6 - b.w;
      b.vx = -Math.abs(b.vx);
    }
    b.y = 13 + Math.sin(b.phase) * 7;

    // Hurl Flaming Voodoo Skulls toward Vaus
    b.fireTimer -= dt;
    if (b.fireTimer <= 0 && game.hazards.length < 5) {
      b.fireTimer = enraged ? 1.55 : 2.35;
      const sx = b.x + b.w * 0.5;
      const sy = b.y + b.h - 2;
      const dx = game.paddle.x - sx;
      const dy = game.paddle.y - sy;
      const d = Math.hypot(dx, dy) || 1;
      const spd = enraged ? 86 : 70;
      game.hazards.push({ kind: 'skull', x: sx, y: sy, vx: (dx / d) * spd, vy: (dy / d) * spd, r: 4.5 });
      if (enraged) {
        game.hazards.push({ kind: 'skull', x: sx, y: sy, vx: (dx / d) * spd - 22, vy: (dy / d) * spd, r: 4.5 });
      }
      OPL2Engine.playSFX('dart');
    }

    // Summon fresh Voodoo Root-Beer barrels if playfield bricks are cleared while boss still lives
    b.summonTimer -= dt;
    if (b.summonTimer <= 0 && countRemainingDestructibleBricks() < 6) {
      b.summonTimer = 6.5;
      for (const [sr, sc, ch] of [[9, 6, '*'], [9, 23, '*'], [10, 14, '!'], [10, 15, '!']]) {
        if (!game.grid[sr][sc] || !game.grid[sr][sc].alive) {
          const nb = parseBrickCell(ch, sr, sc, 6);
          game.grid[sr][sc] = nb;
          game.bricks.push(nb);
          spawnParticles(nb.x + 4, nb.y + 3, 58, 6, 0.9);
        }
      }
      spawnPopup(b.x + 19, b.y + 28, 'HAR HAR HAR!', 58);
    }
  }
}

function loseLife() {
  game.lives--;
  OPL2Engine.playSFX('lost');
  triggerScreenShake(2, 0.28);
  triggerStippleFlash(4, 0.12);
  if (game.lives <= 0) {
    game.lives = 0;
    game.state = 'GAME_OVER';
  } else {
    resetPaddleAndBall(false);
    game.paddle.invulnTimer = 1.6;
  }
}

/* ============================================================================
 * 10. CONTROLS, MAIN SIMULATION UPDATE & HIGH-CRAFT EGA RENDER PIPELINE
 * ============================================================================ */
const keys = { left: false, right: false };

function updatePlaying(dt) {
  // Keyboard smooth paddle movement
  const moveDir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (moveDir !== 0) {
    game.paddle.x += moveDir * 175 * dt;
    syncPaddleWidth();
  }

  for (const br of game.bricks) {
    if (br.flashTimer > 0) br.flashTimer = Math.max(0, br.flashTimer - dt);
  }

  updateWorldMechanics(dt);
  if (game.state !== 'PLAYING') return;

  // Update Space-Ranger Lasers
  for (let i = game.lasers.length - 1; i >= 0; i--) {
    const ls = game.lasers[i];
    ls.y += ls.vy * dt;
    if (ls.y < PF_Y) {
      game.lasers.splice(i, 1);
      continue;
    }
    // Check laser vs Boss LeChuck
    if (game.boss && game.boss.alive &&
        ls.x >= game.boss.x + 2 && ls.x <= game.boss.x + game.boss.w - 2 &&
        ls.y >= game.boss.y && ls.y <= game.boss.y + game.boss.h) {
      damageLeChuck(1, ls.x, ls.y, '-1');
      game.lasers.splice(i, 1);
      continue;
    }
    // Check laser vs Hazards (shoot down darts & flaming voodoo skulls!)
    let hitHaz = false;
    for (let h = game.hazards.length - 1; h >= 0; h--) {
      const hz = game.hazards[h];
      if (Math.hypot(ls.x - hz.x, ls.y - hz.y) < hz.r + 4) {
        spawnParticles(hz.x, hz.y, 62, 8, 1.1);
        addScore(250, hz.x, hz.y, '+250', 62);
        game.hazards.splice(h, 1);
        hitHaz = true;
        break;
      }
    }
    if (hitHaz) {
      game.lasers.splice(i, 1);
      continue;
    }
    // Check laser vs Bricks
    const r = Math.floor((ls.y - GRID_Y) / BRICK_H);
    if (r >= 0 && r < GRID_ROWS) {
      let struck = false;
      for (let c = 0; c < GRID_COLS; c++) {
        const br = game.grid[r][c];
        if (br && br.alive && !isBrickPhasedOut(br) && ls.x >= br.x && ls.x <= br.x + br.w) {
          hitBrick(br, 1);
          struck = true;
          break;
        }
      }
      if (struck) {
        game.lasers.splice(i, 1);
      }
    }
  }

  // Update Falling Power-Up Capsules (18x9)
  const pLeft = game.paddle.x - game.paddle.w * 0.5;
  const pRight = game.paddle.x + game.paddle.w * 0.5;
  for (let i = game.capsules.length - 1; i >= 0; i--) {
    const cap = game.capsules[i];
    cap.y += cap.vy * dt;
    if (cap.y + cap.h >= game.paddle.y && cap.y <= game.paddle.y + game.paddle.h &&
        cap.x + cap.w >= pLeft && cap.x <= pRight) {
      applyCapsulePowerup(cap.kind);
      game.capsules.splice(i, 1);
    } else if (cap.y > SCREEN_H + 4) {
      game.capsules.splice(i, 1);
    }
  }

  // Update World Hazards (Poison Darts & Voodoo Skulls)
  for (let i = game.hazards.length - 1; i >= 0; i--) {
    const hz = game.hazards[i];
    hz.x += hz.vx * dt;
    hz.y += hz.vy * dt;

    // Ball can deflect poison darts in mid-air!
    let deflected = false;
    for (const b of game.balls) {
      if (!b.stuck && Math.hypot(b.x - hz.x, b.y - hz.y) < b.r + hz.r + 1) {
        spawnParticles(hz.x, hz.y, 58, 8, 1.0);
        addScore(200, hz.x, hz.y, 'PARRY!', 62);
        OPL2Engine.playSFX('sword');
        deflected = true;
        break;
      }
    }
    if (deflected) {
      game.hazards.splice(i, 1);
      continue;
    }

    // Hazard vs Vaus Paddle
    if (hz.y + hz.r >= game.paddle.y && hz.y - hz.r <= game.paddle.y + game.paddle.h &&
        hz.x + hz.r >= pLeft && hz.x - hz.r <= pRight) {
      game.hazards.splice(i, 1);
      if (hz.kind === 'dart') {
        game.paddle.expand = false;
        game.paddle.hexTimer = 4.5;
        syncPaddleWidth();
        triggerScreenShake(1, 0.14);
        OPL2Engine.playSFX('lost');
        spawnParticles(hz.x, game.paddle.y, 58, 10, 0.9);
        spawnPopup(game.paddle.x, game.paddle.y - 10, 'CURSED!', 58);
      } else if (hz.kind === 'skull' && game.paddle.invulnTimer <= 0) {
        spawnParticles(hz.x, game.paddle.y, 60, 16, 1.3);
        loseLife();
        return;
      }
      continue;
    }

    if (hz.y > SCREEN_H + 8 || hz.x < PF_X - 8 || hz.x > PF_RIGHT + 8) {
      game.hazards.splice(i, 1);
    }
  }

  // Update Balls with Swept Sub-Stepping
  for (let i = game.balls.length - 1; i >= 0; i--) {
    const b = game.balls[i];
    if (b.stuck) {
      const limit = game.paddle.w * 0.5 - 3;
      b.stuckOffset = Math.max(-limit, Math.min(limit, b.stuckOffset));
      b.x = game.paddle.x + b.stuckOffset;
      b.y = game.paddle.y - b.r - 0.5;
      if (b.catchHoldTimer > 0) {
        b.catchHoldTimer -= dt;
        if (b.catchHoldTimer <= 0) {
          b.stuck = false;
          b.vy = -b.speed;
          b.vx = 28;
        }
      }
      continue;
    }

    // Record motion trail for powered-up or fast balls
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 5) b.trail.shift();

    const stepDist = Math.hypot(b.vx * dt, b.vy * dt);
    const subSteps = Math.max(1, Math.min(18, Math.ceil(stepDist / 1.15)));
    const subDt = dt / subSteps;
    for (let s = 0; s < subSteps; s++) {
      stepSingleBallSubstep(b, subDt);
      if (b.stuck || game.state !== 'PLAYING') break;
    }

    if (b.y - b.r > SCREEN_H + 2) {
      game.balls.splice(i, 1);
    }
  }

  if (game.balls.length === 0 && game.state === 'PLAYING') {
    loseLife();
    return;
  }

  // Stage Clear check (Stages 1..32 clear when all destructible bricks are shattered; Stage 33 clears when LeChuck falls!)
  if (game.level < 33 && countRemainingDestructibleBricks() === 0 && game.delayedGrogs.length === 0) {
    game.state = 'LEVEL_CLEAR';
    game.clearTimer = 2.4;
    OPL2Engine.playSFX('fanfare');
    addScore(1000 + game.lives * 250, PF_X + PF_W * 0.5, 108, 'STAGE CLEAR!', 62);
  }
}

function updateParticlesAndPopups(dt) {
  if (game.shakeTimer > 0) {
    game.shakeTimer = Math.max(0, game.shakeTimer - dt);
    if (game.shakeTimer === 0) game.shakeMag = 0;
  }
  if (game.stippleFlashTimer > 0) {
    game.stippleFlashTimer = Math.max(0, game.stippleFlashTimer - dt);
  }
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 135 * dt;
    p.life -= dt;
    if (p.life <= 0) game.particles.splice(i, 1);
  }
  for (let i = game.popups.length - 1; i >= 0; i--) {
    const pop = game.popups[i];
    pop.y -= 16 * dt;
    pop.life -= dt;
    if (pop.life <= 0) game.popups.splice(i, 1);
  }
}

  for (let i = 0; i < 4; i++) {
    const [ch, active, bgReg, litReg] = badges[i];
    const bx = HUD_X + 5 + i * 14;
    const by = 150;
    ctx.fillStyle = EGA_PALETTE[active ? bgReg : 0];
    ctx.fillRect(bx, by, 12, 11);
    ctx.fillStyle = EGA_PALETTE[active ? litReg : 56];
    ctx.fillRect(bx, by, 12, 1);
    ctx.fillRect(bx, by, 1, 11);
    drawBitmapText(ctx, ch, bx + 4, by + 2, active ? 63 : 56, 1, false, 'left');
  }

  if (OPL2Engine.isMuted()) {
    drawBitmapText(ctx, 'MUTED [M]', cx, 166, 60, 1, true, 'center');
  } else {
    drawBitmapText(ctx, 'OPL2 FM', cx, 166, 58, 1, true, 'center');
  }

  // 6. Clipped Scrolling Soundtrack Marquee (y = 179..195)
  ctx.fillStyle = EGA_PALETTE[0];
  ctx.fillRect(HUD_X + 3, 179, HUD_W - 6, 15);
  ctx.fillStyle = EGA_PALETTE[54];
  ctx.fillRect(HUD_X + 3, 179, HUD_W - 6, 1);
  ctx.fillRect(HUD_X + 3, 193, HUD_W - 6, 1);

  ctx.save();
  ctx.beginPath();
  ctx.rect(HUD_X + 4, 180, HUD_W - 8, 13);
  ctx.clip();
  const marqueeStr = `♪ ${wDef.trackName}   `;
  const marqueeW = measureBitmapText(marqueeStr, 1, false);
  const scrollX = HUD_X + 4 - (Math.floor(game.marqueeScroll) % Math.max(1, marqueeW));
  drawBitmapText(ctx, marqueeStr, scrollX, 183, 62, 1, false, 'left');
  drawBitmapText(ctx, marqueeStr, scrollX + marqueeW, 183, 62, 1, false, 'left');
  ctx.restore();
}

// ============================================================================
// MAIN PLAYFIELD & LIVE ATTRACT-MODE OVERLAY RENDERER
// ============================================================================
function renderPlayfield(ctx) {
  ctx.save();
  // Integer pixel screen-shake on Grog chain explosions & boss hits
  let sx = 0, sy = 0;
  if (game.shakeTimer > 0) {
    sx = Math.round((Math.random() * 2 - 1) * game.shakeMag);
    sy = Math.round((Math.random() * 2 - 1) * game.shakeMag);
    ctx.translate(sx, sy);
  }

  // Parallax camera pan tracks Vaus paddle smoothly (or gently pans in Live Menu Attract Mode)
  const normPan = game.state === 'MENU'
    ? (Math.sin(game.timeSec * 0.55) + 1) * 0.5
    : (game.paddle.x - PF_X) / PF_W;

  renderWorldParallax(ctx, game.world, normPan, game.timeSec);

  // World 4 Orbital Gravity Wells + swirling pixel dust
  const anim4 = Math.floor(game.timeSec * 10) & 3;
  for (const gw of game.gravityWells) {
    ctx.drawImage(SPRITES.gravityWell[anim4], Math.round(gw.x) - 7, Math.round(gw.y) - 7);
    for (let p = 0; p < 6; p++) {
      const a = game.timeSec * 3.2 + (p * Math.PI) / 3;
      const rad = 11 + (p % 3) * 6;
      ctx.fillStyle = EGA_PALETTE[(p & 1) ? 59 : 45];
      ctx.fillRect(Math.round(gw.x + Math.cos(a) * rad), Math.round(gw.y + Math.sin(a) * rad), 1, 1);
    }
  }

  // Cached 8x6 Beveled Brick Mosaic
  const grogFrame = Math.floor(game.timeSec * 8) & 3;
  const steelFrame = (Math.floor(game.timeSec * 5) % 16) < 4 ? (Math.floor(game.timeSec * 5) & 3) : 0;

  for (let i = 0; i < game.bricks.length; i++) {
    const br = game.bricks[i];
    if (!br.alive) continue;
    const bx = br.x | 0;
    const by = br.y | 0;

    if (isBrickPhasedOut(br)) {
      ctx.drawImage(BRICK_TILE_CACHE.ghostPhase, bx, by);
      continue;
    }
    if (br.flashTimer > 0) {
      ctx.drawImage(BRICK_TILE_CACHE.hitFlash, bx, by);
      continue;
    }

    let tile = null;
    if (br.type === 'normal') {
      tile = BRICK_TILE_CACHE.normal[br.reg];
    } else if (br.type === 'armor') {
      const dmgTaken = br.maxHp - br.hp;
      if (dmgTaken <= 0) tile = BRICK_TILE_CACHE.armorFull[br.reg];
      else if (dmgTaken === 1 && br.maxHp >= 3) tile = BRICK_TILE_CACHE.armorCrack1[br.reg];
      else tile = BRICK_TILE_CACHE.armorCrack2[br.reg];
    } else if (br.type === 'steel') {
      tile = BRICK_TILE_CACHE.steel[steelFrame];
    } else if (br.type === 'grog') {
      tile = BRICK_TILE_CACHE.grog[(grogFrame + br.col) & 3];
    } else if (br.type === 'specialA') {
      tile = BRICK_TILE_CACHE.specialA[(grogFrame + br.row) & 3];
    } else if (br.type === 'specialB') {
      tile = BRICK_TILE_CACHE.specialB[(grogFrame + br.col) & 3];
    }
    if (tile) ctx.drawImage(tile, bx, by);
  }

  // Level 33 Boss: Multi-Frame Ghost Pirate LeChuck + Health Bar
  if (game.boss && game.boss.alive) {
    const b = game.boss;
    const bx = Math.round(b.x);
    const by = Math.round(b.y);
    const frame = Math.floor(game.timeSec * 9) & 3;
    ctx.drawImage(b.flashTimer > 0 ? SPRITES.lechuckFlash : SPRITES.lechuck[frame], bx - 1, by - 1);

    // Beveled Boss Health Bar above playfield top
    const barW = 104;
    const barX = PF_X + ((PF_W - barW) >> 1);
    const barY = 10;
    ctx.fillStyle = EGA_PALETTE[0];
    ctx.fillRect(barX - 1, barY - 1, barW + 2, 5);
    ctx.fillStyle = EGA_PALETTE[32];
    ctx.fillRect(barX, barY, barW, 3);
    ctx.fillStyle = EGA_PALETTE[58];
    ctx.fillRect(barX, barY, Math.round(barW * (b.hp / b.maxHp)), 3);
  }

  // Falling 18x9 Pixel-Art Capsules
  const capGlint = (Math.floor(game.timeSec * 6) & 3) === 0 ? 1 : 0;
  for (const cap of game.capsules) {
    const frames = SPRITES.capsules[cap.kind];
    if (frames) ctx.drawImage(frames[capGlint], Math.round(cap.x), Math.round(cap.y));
  }

  // Space-Ranger Twin Laser Bolts
  for (const ls of game.lasers) {
    const lx = Math.round(ls.x);
    const ly = Math.round(ls.y);
    ctx.fillStyle = EGA_PALETTE[60];
    ctx.fillRect(lx - 1, ly, 3, 6);
    ctx.fillStyle = EGA_PALETTE[63];
    ctx.fillRect(lx, ly, 1, 5);
  }

  // World Hazards (Poison Darts & Flaming Voodoo Skulls)
  for (const hz of game.hazards) {
    if (hz.kind === 'dart') {
      const f = Math.floor(game.timeSec * 12) & 1;
      ctx.drawImage(SPRITES.poisonDart[f], Math.round(hz.x) - 3, Math.round(hz.y) - 5);
    } else {
      const f = Math.floor(game.timeSec * 12) % 3;
      ctx.drawImage(SPRITES.voodooSkull[f], Math.round(hz.x) - 6, Math.round(hz.y) - 6);
    }
  }

  // Detailed Vaus Paddle (with Rubber Chicken Expand, Twin Blasters & Magnetic Compass)
  if (game.state !== 'MENU') {
    const pad = game.paddle;
    const blinkHide = pad.invulnTimer > 0 && (Math.floor(game.timeSec * 18) & 1);
    if (!blinkHide) {
      const px = Math.round(pad.x - pad.w * 0.5);
      const py = Math.round(pad.y);
      if (pad.expand) {
        const pulleyFrame = Math.floor(game.timeSec * 10) & 1;
        ctx.drawImage(SPRITES.paddleChicken[pulleyFrame], px, py);
      } else if (pad.hexTimer > 0) {
        // Cursed shrunken emerald-tinted Vaus
        ctx.drawImage(SPRITES.paddleNormal, 0, 0, 32, 8, px, py, pad.w, 8);
        ditherRect(ctx, px + 2, py + 1, pad.w - 4, 4, 2, 58, 8);
      } else {
        ctx.drawImage(SPRITES.paddleNormal, px, py);
      }

      if (pad.laser) {
        ctx.drawImage(SPRITES.turretLeft,  px - 1, py - 4);
        ctx.drawImage(SPRITES.turretRight, px + pad.w - 6, py - 4);
      }
      if (pad.catchMode) {
        const cx = Math.round(pad.x) - 4;
        ctx.drawImage(SPRITES.compassDome, cx, py - 2);
        // Live compass needle tracking nearest ball
        const refBall = game.balls[0];
        if (refBall) {
          const ang = Math.atan2(refBall.y - pad.y, refBall.x - pad.x);
          ctx.fillStyle = EGA_PALETTE[60];
          ctx.fillRect(Math.round(pad.x + Math.cos(ang) * 2), py + 1 + Math.round(Math.sin(ang)), 1, 1);
        }
      }
    }

    // Shaded 5x5 Sphere Balls + Glowing EGA Motion Trail
    const ballSprite = (game.world === 0 && game.riposteTimer > 0)
      ? SPRITES.ballGold
      : (game.world === 4 ? SPRITES.ballPrism : (game.world === 6 ? SPRITES.ballEcto : SPRITES.ballNormal));

    for (const b of game.balls) {
      const powered = (game.world === 0 && game.riposteTimer > 0) || game.balls.length > 1 || b.speed > 130;
      if (powered && !b.stuck) {
        for (let t = 0; t < b.trail.length; t++) {
          const tp = b.trail[t];
          ctx.fillStyle = EGA_PALETTE[t >= 3 ? 59 : 1];
          ctx.fillRect(Math.round(tp.x) - 1, Math.round(tp.y) - 1, 2, 2);
        }
      }
      ctx.drawImage(ballSprite, Math.round(b.x) - 2, Math.round(b.y) - 2);
    }
  }

  // Pixel Debris Particles
  for (const p of game.particles) {
    ctx.fillStyle = EGA_PALETTE[p.reg];
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
  }

  // Floating Outlined Bitmap Popups (+150, EN GARDE!, GROG BOOM!)
  for (const pop of game.popups) {
    drawBitmapText(ctx, pop.text, Math.round(pop.x), Math.round(pop.y), pop.reg, 1, true, 'center');
  }

  // EGA Scanline Stipple Flash on big explosions & Loom Drafts
  if (game.stippleFlashTimer > 0) {
    ctx.fillStyle = EGA_PALETTE[game.stippleFlashReg];
    const odd = Math.floor(game.timeSec * 60) & 1;
    for (let y = PF_Y + odd * 2; y < PF_Y + PF_H; y += 4) {
      ctx.fillRect(PF_X, y, PF_W, 1);
    }
  }

  // Riveted 3-Tone Beveled Metallic Border Pipes
  renderMetallicBorderPipes(ctx, game.world);
  ctx.restore();

  // ==========================================================================
  // LIVE ATTRACT-MODE TITLE SCREEN & STATE BANNERS (NO OPAQUE BLACK BOXES!)
  // ==========================================================================
  const centerPF = PF_X + (PF_W >> 1); // 128

  if (game.state === 'MENU') {
    // Render crisp 2x/3x outlined pixel typography directly OVER the live backdrop & mosaic!
    drawBitmapText(ctx, 'SCUMM-NOID', centerPF + 1, 23, 20, 3, true, 'center');
    drawBitmapText(ctx, 'SCUMM-NOID', centerPF,     21, 62, 3, true, 'center');
    drawBitmapText(ctx, '1990 LUCASARTS EGA TRIBUTE', centerPF, 48, 59, 1, true, 'center');

    // Slim dithered translucent-style ribbon at bottom of playfield so full brick mosaic stays visible
    ditherRect(ctx, PF_X + 8, 134, PF_W - 16, 54, 0, 8, 11);
    ctx.fillStyle = EGA_PALETTE[54];
    ctx.fillRect(PF_X + 8, 134, PF_W - 16, 1);
    ctx.fillRect(PF_X + 8, 187, PF_W - 16, 1);

    const stg = LEVELS[game.menuLevel - 1];
    const wDef = WORLD_DEFS[game.world];
    drawBitmapText(ctx, `< STAGE ${String(game.menuLevel).padStart(2, '0')}/33 >`, centerPF, 139, 62, 1, true, 'center');
    drawBitmapText(ctx, stg.title, centerPF, 150, 63, 1, true, 'center');
    drawBitmapText(ctx, wDef.gameTitle, centerPF, 161, 59, 1, true, 'center');

    if ((Math.floor(game.timeSec * 3) & 1) === 0) {
      drawBitmapText(ctx, 'CLICK OR SPACE TO LAUNCH', centerPF, 175, 58, 1, true, 'center');
    }
  } else if (game.state === 'PAUSED') {
    ditherRect(ctx, PF_X + 38, 82, PF_W - 76, 36, 0, 8, 10);
    ctx.fillStyle = EGA_PALETTE[62];
    ctx.fillRect(PF_X + 38, 82, PF_W - 76, 1);
    ctx.fillRect(PF_X + 38, 117, PF_W - 76, 1);
    drawBitmapText(ctx, 'PAUSED', centerPF, 88, 62, 2, true, 'center');
    drawBitmapText(ctx, 'PRESS P TO RESUME', centerPF, 106, 63, 1, true, 'center');
  } else if (game.state === 'LEVEL_CLEAR') {
    drawBitmapText(ctx, 'STAGE CLEAR!', centerPF, 78, 62, 2, true, 'center');
    drawBitmapText(ctx, LEVELS[game.level - 1].title, centerPF, 98, 59, 1, true, 'center');
    drawBitmapText(ctx, 'GET READY FOR NEXT WORLD', centerPF, 110, 63, 1, true, 'center');
  } else if (game.state === 'GAME_OVER') {
    ditherRect(ctx, PF_X + 24, 72, PF_W - 48, 56, 0, 32, 10);
    ctx.fillStyle = EGA_PALETTE[60];
    ctx.fillRect(PF_X + 24, 72, PF_W - 48, 1);
    ctx.fillRect(PF_X + 24, 127, PF_W - 48, 1);
    drawBitmapText(ctx, 'GAME OVER', centerPF, 79, 60, 2, true, 'center');
    drawBitmapText(ctx, `FINAL SCORE: ${game.score}`, centerPF, 100, 62, 1, true, 'center');
    drawBitmapText(ctx, 'SPACE OR CLICK FOR MENU', centerPF, 113, 63, 1, true, 'center');
  } else if (game.state === 'VICTORY') {
    ditherRect(ctx, PF_X + 14, 62, PF_W - 28, 76, 0, 16, 10);
    ctx.fillStyle = EGA_PALETTE[62];
    ctx.fillRect(PF_X + 14, 62, PF_W - 28, 1);
    ctx.fillRect(PF_X + 14, 137, PF_W - 28, 1);
    drawBitmapText(ctx, 'VICTORY!', centerPF, 68, 62, 2, true, 'center');
    drawBitmapText(ctx, 'LECHUCK DEFEATED BY ROOT BEER!', centerPF, 88, 58, 1, true, 'center');
    drawBitmapText(ctx, 'ALL 33 LUCASARTS RELICS SAVED', centerPF, 100, 59, 1, true, 'center');
    drawBitmapText(ctx, `SCORE: ${game.score}`, centerPF, 112, 63, 1, true, 'center');
    drawBitmapText(ctx, 'CLICK OR SPACE TO PLAY AGAIN', centerPF, 125, 62, 1, true, 'center');
  }
}

/* ============================================================================
 * 11. INTEGER DEVICE-PIXEL SCALING, INPUT WIRING & 60FPS MAIN LOOP
 * ============================================================================ */
const canvas = document.getElementById('screen');
const mainCtx = canvas.getContext('2d', { alpha: false });
mainCtx.imageSmoothingEnabled = false;

const btnCrt = document.getElementById('btn-crt');
const btnMute = document.getElementById('btn-mute');
const scanlinesEl = document.getElementById('scanlines');
const audioLed = document.getElementById('audio-led');

// Resize 320x200 canvas to largest whole-number device-pixel multiple that fits cabinet bezel
function resizeIntegerViewport() {
  const dpr = window.devicePixelRatio || 1;
  const maxCssW = Math.max(320, window.innerWidth - 76);
  const maxCssH = Math.max(200, window.innerHeight - 98);
  const availDevW = Math.floor(maxCssW * dpr);
  const availDevH = Math.floor(maxCssH * dpr);
  const intMult = Math.max(1, Math.floor(Math.min(availDevW / SCREEN_W, availDevH / SCREEN_H)));

  canvas.style.width  = `${(SCREEN_W * intMult) / dpr}px`;
  canvas.style.height = `${(SCREEN_H * intMult) / dpr}px`;
  mainCtx.imageSmoothingEnabled = false;
}

window.addEventListener('resize', resizeIntegerViewport);

function updateMuteUI() {
  const m = OPL2Engine.isMuted();
  btnMute.textContent = m ? 'SOUND: OFF' : 'SOUND: ON';
  btnMute.classList.toggle('active', !m);
  audioLed.classList.toggle('muted', m);
}

btnCrt.addEventListener('click', () => {
  OPL2Engine.unlock();
  const off = scanlinesEl.classList.toggle('off');
  btnCrt.textContent = off ? 'CRT: OFF' : 'CRT: ON';
  btnCrt.classList.toggle('active', !off);
});

btnMute.addEventListener('click', () => {
  OPL2Engine.unlock();
  OPL2Engine.toggleMute();
  updateMuteUI();
});

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  if (rect.width <= 0) return;
  const canvasX = ((e.clientX - rect.left) / rect.width) * SCREEN_W;
  if (game.state === 'PLAYING') {
    game.paddle.x = canvasX;
    syncPaddleWidth();
  }
});

canvas.addEventListener('mousedown', (e) => {
  if (e.button === 0) {
    launchOrFireAction();
  }
});

window.addEventListener('keydown', (e) => {
  OPL2Engine.unlock();
  const code = e.code;
  if (code === 'ArrowLeft' || code === 'KeyA') {
    keys.left = true;
    if (game.state === 'MENU') {
      game.menuLevel = game.menuLevel <= 1 ? LEVELS.length : game.menuLevel - 1;
      loadStage(game.menuLevel, true);
      OPL2Engine.playSFX('paddle', -0.4);
    }
    e.preventDefault();
  } else if (code === 'ArrowRight' || code === 'KeyD') {
    keys.right = true;
    if (game.state === 'MENU') {
      game.menuLevel = game.menuLevel >= LEVELS.length ? 1 : game.menuLevel + 1;
      loadStage(game.menuLevel, true);
      OPL2Engine.playSFX('paddle', 0.4);
    }
    e.preventDefault();
  } else if (code === 'Space') {
    launchOrFireAction();
    e.preventDefault();
  } else if (code === 'KeyP') {
    if (game.state === 'PLAYING') {
      game.state = 'PAUSED';
      OPL2Engine.setPaused(true);
    } else if (game.state === 'PAUSED') {
      game.state = 'PLAYING';
      OPL2Engine.setPaused(false);
    }
  } else if (code === 'KeyM') {
    OPL2Engine.toggleMute();
    updateMuteUI();
  } else if (code === 'KeyK') {
    btnCrt.click();
  }
});

window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});

// Boot EGA Engine Assets & Live Attract Stage 01
initAllSprites();
initBrickTiles();
initAllWorldBackdrops();
resizeIntegerViewport();
updateMuteUI();
loadStage(1, true);

let lastTime = performance.now();
function frameLoop(now) {
  const rawDt = (now - lastTime) / 1000;
  lastTime = now;
  const dt = Math.max(0, Math.min(0.033, rawDt));

  if (game.state !== 'PAUSED') {
    game.timeSec += dt;
    game.marqueeScroll += dt * 24;
  }

  if (game.state === 'PLAYING') {
    updatePlaying(dt);
  } else if (game.state === 'LEVEL_CLEAR') {
    game.clearTimer -= dt;
    if (game.clearTimer <= 0) advanceNextStage();
  } else if (game.state === 'VICTORY') {
    if (Math.random() < 0.14) {
      const fx = PF_X + 24 + Math.random() * (PF_W - 48);
      const fy = 22 + Math.random() * 44;
      const regs = [58, 62, 59, 61, 60];
      spawnParticles(fx, fy, regs[(Math.random() * regs.length) | 0], 10, 1.2);
    }
  }

  if (game.state !== 'PAUSED') {
    updateParticlesAndPopups(dt);
  }

  mainCtx.fillStyle = '#000000';
  mainCtx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  renderPlayfield(mainCtx);
  renderHUDSidebar(mainCtx);

  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);

})();
</script>
</body>
