<script>
"use strict";

// ============================================================================
// 1. EXACT 64-COLOR IBM EGA HARDWARE PALETTE & 4x4 BAYER DITHERING ENGINE
// ============================================================================
const EGA = new Array(64);
const EGA_RGB = new Array(64);
for (let i = 0; i < 64; i++) {
  const r = (((i >> 2) & 1) * 0xAA) + (((i >> 5) & 1) * 0x55);
  const g = (((i >> 1) & 1) * 0xAA) + (((i >> 4) & 1) * 0x55);
  const b = (((i >> 0) & 1) * 0xAA) + (((i >> 3) & 1) * 0x55);
  EGA[i] = "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1).toUpperCase();
  EGA_RGB[i] = [r, g, b];
}

function egaRGB(r2, g2, b2) {
  const r = r2 < 0 ? 0 : (r2 > 3 ? 3 : r2 | 0);
  const g = g2 < 0 ? 0 : (g2 > 3 ? 3 : g2 | 0);
  const b = b2 < 0 ? 0 : (b2 > 3 ? 3 : b2 | 0);
  return (((r & 1) << 5) | ((g & 1) << 4) | ((b & 1) << 3) |
          (((r >> 1) & 1) << 2) | (((g >> 1) & 1) << 1) | ((b >> 1) & 1));
}

function egaDecode(reg) {
  return [
    (((reg >> 2) & 1) << 1) | ((reg >> 5) & 1),
    (((reg >> 1) & 1) << 1) | ((reg >> 4) & 1),
    (((reg >> 0) & 1) << 1) | ((reg >> 3) & 1)
  ];
}

function egaShade(reg, delta) {
  const [r, g, b] = egaDecode(reg);
  return egaRGB(r + delta, g + delta, b + delta);
}

// Named canonical EGA registers for quick pixel-art palette reference
const C_BLACK   = 0;                 // #000000
const C_BLUE    = 1;                 // #0000AA
const C_GREEN   = 2;                 // #00AA00
const C_CYAN    = 3;                 // #00AAAA
const C_RED     = 4;                 // #AA0000
const C_MAGENTA = 5;                 // #AA00AA
const C_BROWN   = 20;                // #AA5500 (authentic CGA/EGA brown)
const C_LGRAY   = 7;                 // #AAAAAA
const C_DGRAY   = 56;                // #555555
const C_BBLUE   = 57;                // #5555FF
const C_BGREEN  = 58;                // #55FF55
const C_BCYAN   = 59;                // #55FFFF
const C_BRED    = 60;                // #FF5555
const C_BMAG    = 61;                // #FF55FF
const C_BYELLOW = 62;                // #FFFF55
const C_WHITE   = 63;                // #FFFFFF
const C_NAVY    = egaRGB(0, 0, 1);   // #000055
const C_DARKRED = egaRGB(1, 0, 0);   // #550000
const C_DGREEN  = egaRGB(0, 1, 0);   // #005500
const C_DTEAL   = egaRGB(0, 1, 1);   // #005555
const C_DPURPLE = egaRGB(1, 0, 1);   // #550055
const C_GOLD    = egaRGB(3, 2, 0);   // #FFAA00
const C_ORANGE  = egaRGB(3, 1, 0);   // #FF5500
const C_TAN     = egaRGB(3, 2, 1);   // #FFAA55
const C_CREAM   = egaRGB(3, 3, 2);   // #FFFFAA
const C_AZURE   = egaRGB(1, 2, 3);   // #55AAFF
const C_SKY     = egaRGB(0, 1, 2);   // #0055AA
const C_VIOLET  = egaRGB(2, 1, 3);   // #AA55FF
const C_INDIGO  = egaRGB(1, 0, 2);   // #5500AA
const C_COPPER  = egaRGB(2, 1, 1);   // #AA5555
const C_CORAL   = egaRGB(3, 1, 1);   // #FF5555
const C_LIME    = egaRGB(2, 3, 1);   // #AAFF55
const C_MINT    = egaRGB(2, 3, 3);   // #AAFFFF

const BAYER4 = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];

function makeCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = w | 0;
  c.height = h | 0;
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  return [c, g];
}

function dither(g, x, y, w, h, regA, regB, level) {
  x |= 0; y |= 0; w |= 0; h |= 0;
  if (w <= 0 || h <= 0) return;
  g.fillStyle = EGA[regA];
  g.fillRect(x, y, w, h);
  if (level <= 0) return;
  g.fillStyle = EGA[regB];
  if (level >= 16) { g.fillRect(x, y, w, h); return; }
  for (let j = 0; j < h; j++) {
    const rowOff = ((y + j) & 3) * 4;
    for (let i = 0; i < w; i++) {
      if (BAYER4[rowOff + ((x + i) & 3)] < level) g.fillRect(x + i, y + j, 1, 1);
    }
  }
}

function ditherPixel(g, x, y, regA, regB, level) {
  x |= 0; y |= 0;
  const useB = level >= 16 || (level > 0 && BAYER4[(y & 3) * 4 + (x & 3)] < level);
  g.fillStyle = EGA[useB ? regB : regA];
  g.fillRect(x, y, 1, 1);
}

// Smooth multi-stop vertical Bayer-dithered sky/water gradient
function ditherGradV(g, x, y, w, h, regs) {
  const segs = regs.length - 1;
  for (let j = 0; j < h; j++) {
    const t = (j / Math.max(1, h - 1)) * segs;
    const idx = Math.min(segs - 1, t | 0);
    const frac = t - idx;
    const lvl = Math.round(frac * 16);
    dither(g, x, y + j, w, 1, regs[idx], regs[idx + 1], lvl);
  }
}

// Scanline circular planet/moon with directional Bayer shading & 1px silhouette option
function ditherPlanet(g, cx, cy, r, regHi, regMid, regDark, lightX, lightY, outline) {
  cx |= 0; cy |= 0; r |= 0;
  const len = Math.hypot(lightX, lightY) || 1;
  const lx = lightX / len, ly = lightY / len;
  for (let dy = -r - 1; dy <= r + 1; dy++) {
    const py = cy + dy;
    const spanSq = r * r - dy * dy;
    if (spanSq < 0) continue;
    const halfW = Math.floor(Math.sqrt(spanSq));
    if (outline) {
      g.fillStyle = EGA[C_BLACK];
      g.fillRect(cx - halfW - 1, py, 1, 1);
      g.fillRect(cx + halfW + 1, py, 1, 1);
    }
    for (let dx = -halfW; dx <= halfW; dx++) {
      const px = cx + dx;
      const nz = Math.sqrt(Math.max(0, 1 - (dx * dx + dy * dy) / (r * r + 0.5)));
      const dot = (dx / r) * lx + (dy / r) * ly + nz * 0.55;
      if (dot > 0.52) {
        const lvl = Math.min(16, Math.max(0, Math.round((dot - 0.52) * 28)));
        ditherPixel(g, px, py, regMid, regHi, lvl);
      } else {
        const lvl = Math.min(16, Math.max(0, Math.round((dot + 0.35) * 18)));
        ditherPixel(g, px, py, regDark, regMid, lvl);
      }
    }
  }
}

// ============================================================================
// 2. PRE-RENDERED 5x7 PROPORTIONAL OUTLINED BITMAP FONT (ZERO VECTOR FONTS)
// ============================================================================

  "(": [".X","X.","X.","X.","X.",".X",".."],
  ")": ["X.",".X",".X",".X",".X","X.",".."],
  "*": [".X.X.","..X..","XXXXX","..X..",".X.X.",".....","....."],

  ",": ["..","..","..","..","..",".X","X."],

  ".": [".",".",".",".",".",".","X"],
  "/": ["...X","..X.","..X.",".X..",".X..","X...","...."],

  "4": ["...X.","..XX.",".X.X.","X..X.","XXXXX","...X.","...X."],
  "5": ["XXXXX","X....","XXXX.","....X","....X","X...X",".XXX."],
  "6": [".XXX.","X....","XXXX.","X...X","X...X","X...X",".XXX."],
  "7": ["XXXXX","....X","...X.","..X..",".X...",".X...",".X..."],
  "8": [".XXX.","X...X","X...X",".XXX.","X...X","X...X",".XXX."],
  "9": [".XXX.","X...X","X...X",".XXXX","....X","...X.",".XX.."],
  ":": [".",".","X",".",".","X","."],
  ";": ["..","..",".X","..","..",".X","X."],

  "?": [".XXX.","X...X","...X.","..X..","..X..",".....","..X.."],

  "B": ["XXXX.","X...X","X...X","XXXX.","X...X","X...X","XXXX."],
  "C": [".XXX.","X...X","X....","X....","X....","X...X",".XXX."],

  "I": ["XXX",".X.",".X.",".X.",".X.",".X.","XXX"],

  "N": ["X...X","XX..X","X.X.X","X..XX","X...X","X...X","X...X"],
  "O": [".XXX.","X...X","X...X","X...X","X...X","X...X",".XXX."],

  "T": ["XXXXX","..X..","..X..","..X..","..X..","..X..","..X.."],

  "V": ["X...X","X...X","X...X","X...X","X...X",".X.X.","..X.."],
  "W": ["X...X","X...X","X...X","X.X.X","X.X.X","XX.XX","X...X"],
  "X": ["X...X","X...X",".X.X.","..X..",".X.X.","X...X","X...X"],
  "Y": ["X...X","X...X",".X.X.","..X..","..X..","..X..","..X.."],
  "Z": ["XXXXX","....X","...X.","..X..",".X...","X....","XXXXX"],
  "[": ["XX","X.","X.","X.","X.","X.","XX"],
  "]": ["XX",".X",".X",".X",".X",".X","XX"],
  "~": [".XX.X","X..X.",".....",".....",".....",".....","....."],
  "♪": ["..XXX","..X.X","..X.X","..X..","XXX..","XXX..",".X..."],
  "♥": [".X.X.","XXXXX","XXXXX","XXXXX",".XXX.","..X..","....."],
  "★": ["..X..",".XXX.","XXXXX",".XXX.",".X.X.","X...X","....."],
  "◄": ["...X.","..XX.",".XXX.","XXXX.",".XXX.","..XX.","...X."],
  "►": [".X...",".XX..",".XXX.",".XXXX",".XXX.",".XX..",".X..."]
};

const glyphCache = new Map();

function getGlyphSprite(ch, regMain, scale, bevel) {
  const up = RAW_FONT_5X7[ch] ? ch : ch.toUpperCase();
  const bmp = RAW_FONT_5X7[up] || RAW_FONT_5X7["?"];
  const key = up + "|" + regMain + "|" + scale + "|" + (bevel ? 1 : 0);
  let cached = glyphCache.get(key);
  if (cached) return cached;

  const gw = bmp[0].length;
  const gh = bmp.length;
  const cw = gw * scale + 2;
  const chPx = gh * scale + 2;
  const [c, g] = makeCanvas(cw, chPx);

  // 1px 8-neighbor black outline around scaled pixel blocks
  g.fillStyle = EGA[C_BLACK];
  for (let ry = 0; ry < gh; ry++) {
    const row = bmp[ry];
    for (let rx = 0; rx < gw; rx++) {
      if (row[rx] !== "X") continue;
      const px = 1 + rx * scale;
      const py = 1 + ry * scale;
      g.fillRect(px - 1, py - 1, scale + 2, scale + 2);
    }
  }

  const regHi = bevel ? egaShade(regMain, 1) : regMain;
  const regLo = bevel ? egaShade(regMain, -1) : regMain;
  for (let ry = 0; ry < gh; ry++) {
    const row = bmp[ry];
    const rowReg = bevel ? (ry < 2 ? regHi : (ry > 4 ? regLo : regMain)) : regMain;
    g.fillStyle = EGA[rowReg];
    for (let rx = 0; rx < gw; rx++) {
      if (row[rx] !== "X") continue;
      g.fillRect(1 + rx * scale, 1 + ry * scale, scale, scale);
    }
  }

  cached = { canvas: c, adv: (gw + 1) * scale };
  glyphCache.set(key, cached);
  return cached;
}

function measureTextPx(str, scale) {
  let w = 0;
  for (let i = 0; i < str.length; i++) {
    const up = RAW_FONT_5X7[str[i]] ? str[i] : str[i].toUpperCase();
    const bmp = RAW_FONT_5X7[up] || RAW_FONT_5X7["?"];
    w += (bmp[0].length + 1) * scale;
  }
  return w > 0 ? w - scale : 0;
}

function drawTextPx(g, str, x, y, regMain, scale = 1, bevel = false) {
  let cx = x | 0;
  const cy = y | 0;
  for (let i = 0; i < str.length; i++) {
    const gl = getGlyphSprite(str[i], regMain, scale, bevel);
    g.drawImage(gl.canvas, cx - 1, cy - 1);
    cx += gl.adv;
  }
  return cx;
}

function drawTextCentered(g, str, centerX, y, regMain, scale = 1, bevel = false) {
  const w = measureTextPx(str, scale);
  drawTextPx(g, str, (centerX - (w >> 1)) | 0, y | 0, regMain, scale, bevel);
}

function drawWrappedCentered(g, str, centerX, y, maxW, lineStep, regMain) {
  if (measureTextPx(str, 1) <= maxW) {
    drawTextCentered(g, str, centerX, y, regMain, 1, false);
    return 1;
  }
  const words = str.split(" ");
  let line1 = "";
  let idx = 0;
  while (idx < words.length) {
    const cand = line1 ? (line1 + " " + words[idx]) : words[idx];
    if (measureTextPx(cand, 1) <= maxW || !line1) {
      line1 = cand;
      idx++;
    } else {
      break;
    }
  }
  const line2 = words.slice(idx).join(" ");
  drawTextCentered(g, line1, centerX, y, regMain, 1, false);
  if (line2) drawTextCentered(g, line2, centerX, y + lineStep, regMain, 1, false);
  return line2 ? 2 : 1;
}

// ============================================================================
// 3. MULTI-TONE OUTLINED ASCII SPRITE COMPILER (`makeSprite`) & SPRITE BANK
// ============================================================================
const DEFAULT_INK = {
  "k": C_BLACK,
  "D": C_DGRAY,
  "s": C_LGRAY,
  "w": egaRGB(2, 2, 2),

  "r": C_DARKRED,
  "R": C_RED,

  "p": C_DPURPLE,
  "P": C_MAGENTA,
  "m": C_BMAG,
  "v": C_VIOLET
};

function makeSprite(rows, customMap) {
  const h = rows.length;
  const w = rows[0].length;
  const [c, g] = makeCanvas(w, h);
  for (let y = 0; y < h; y++) {
    const r = rows[y];
    for (let x = 0; x < w; x++) {
      const ch = r[x];
      if (ch === "." || ch === " ") continue;
      const reg = (customMap && customMap[ch] !== undefined) ? customMap[ch] : DEFAULT_INK[ch];
      if (reg !== undefined) {
        g.fillStyle = EGA[reg];
        g.fillRect(x, y, 1, 1);
      }
    }
  }
  return c;
}

function renderBeveledBrick(hi, mid, lo, rim, armored, cracked) {
  const [c, g] = makeCanvas(8, 6);
  // Outer dark rim on bottom/right for crisp mosaic separation
  g.fillStyle = EGA[rim];
  g.fillRect(0, 0, 8, 6);
  // Top & left specular highlight bevel
  g.fillStyle = EGA[hi];
  g.fillRect(0, 0, 7, 1);
  g.fillRect(0, 1, 1, 4);
  // Bottom-inner & right-inner shadow bevel
  g.fillStyle = EGA[lo];
  g.fillRect(1, 4, 6, 1);
  g.fillRect(6, 1, 1, 4);
  // Bayer-textured inner enamel face (5x3)
  dither(g, 1, 1, 5, 3, mid, hi, 3);
  // Specular glint pixel at top-left
  g.fillStyle = EGA[C_WHITE];
  g.fillRect(1, 1, 1, 1);

  if (armored) {
    // Metallic corner rivets + reinforced inner trim
    g.fillStyle = EGA[C_BLACK];
    g.fillRect(1, 1, 1, 1);
    g.fillRect(5, 1, 1, 1);
    g.fillStyle = EGA[C_WHITE];
    g.fillRect(1, 2, 1, 1);
    g.fillRect(5, 2, 1, 1);
  }
  if (cracked) {
    // Jagged dark pixel crack across the face
    g.fillStyle = EGA[C_BLACK];
    g.fillRect(2, 0, 1, 2);
    g.fillRect(3, 2, 2, 1);
    g.fillRect(4, 3, 1, 2);
    g.fillRect(2, 4, 1, 1);
    g.fillStyle = EGA[lo];
    g.fillRect(3, 1, 1, 1);
  }
  return c;
}

// Each layer is 280x192 (wider than 240px inner playfield for smooth integer horizontal wrap!)
const BG_W = 280;
const BG_H = 192;

// Deterministic PRNG for reproducible hand-placed starfields, windows, foliage & craters
function makeRng(seed) {
  let s = seed >>> 0;
  return function() {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function drawStarfield(g, seed, count, maxY, cols) {
  const rnd = makeRng(seed);
  const stars = [];
  for (let i = 0; i < count; i++) {
    const sx = (rnd() * BG_W) | 0;
    const sy = (rnd() * maxY) | 0;
    const col = cols[(rnd() * cols.length) | 0];
    g.fillStyle = EGA[col];
    g.fillRect(sx, sy, 1, 1);
    if (i % 5 === 0) stars.push({ x: sx, y: sy, phase: (rnd() * 16) | 0 });
  }
  return stars;
}

// Helper: pixel-stepped jagged ridge/mountain silhouette with 2-tone Bayer slope shading
function drawRidge(g, heights, baseY, regLit, regMid, regDark) {
  for (let x = 0; x < BG_W; x++) {
    const topY = heights[x] | 0;
    const nextY = heights[(x + 1) % BG_W] | 0;
    const litSlope = nextY >= topY; // Left-facing or flat slope catches moonlight
    g.fillStyle = EGA[C_BLACK];
    if (topY < baseY) g.fillRect(x, topY - 1, 1, 1);
    for (let y = topY; y < baseY; y++) {
      const depth = y - topY;
      if (litSlope && depth < 10) {
        ditherPixel(g, x, y, regMid, regLit, Math.max(2, 14 - depth));
      } else {
        ditherPixel(g, x, y, regDark, regMid, depth < 18 ? 8 : 3);
      }
    }
  }
}

      for (let y = top; y < 136; y++) {
        const hw = Math.min(9, 1 + ((y - top) >> 3));
        dither(midG, sx - hw, y, hw, 1, C_BCYAN, C_WHITE, 8);
        dither(midG, sx, y, hw, 1, C_DTEAL, C_CYAN, 10);
      }
    }
    // Mirror-still Swan Lake water
    ditherGradV(midG, 0, 134, BG_W, 58, [C_CYAN, C_DTEAL, C_BLUE, C_NAVY]);

    const [nearC, nearG] = makeCanvas(BG_W, BG_H);
    // Graceful white silhouettes of Swans & reeds on lake foreground
    for (const sx of [70, 224]) {
      nearG.fillStyle = EGA[C_WHITE];
      nearG.fillRect(sx, 166, 9, 4);
      nearG.fillRect(sx + 7, 160, 2, 7);
      nearG.fillRect(sx + 8, 159, 3, 2);
      nearG.fillStyle = EGA[C_GOLD];
      nearG.fillRect(sx + 11, 160, 2, 1);
      // Shimmer reflection below swan
      dither(nearG, sx, 171, 10, 3, C_BLUE, C_BCYAN, 9);
    }
    worlds.push({ name: "LOOM IS.", far: farC, mid: midC, near: nearC, stars });
  }

  // --------------------------------------------------------------------------
  // WORLD 6: SAM & MAX HIT THE ROAD — Twilight Highway & Crooked Skyline
  // --------------------------------------------------------------------------
  {
    const [farC, farG] = makeCanvas(BG_W, BG_H);
    ditherGradV(farG, 0, 0, BG_W, 132, [C_NAVY, C_DPURPLE, C_RED, C_ORANGE, C_GOLD]);
    const stars = drawStarfield(farG, 19936, 40, 56, [C_WHITE, C_BYELLOW]);
    // Blazing desert sunset sun on horizon
    ditherPlanet(farG, 140, 118, 22, C_WHITE, C_BYELLOW, C_ORANGE, 0, -1, false);

    const [midC, midG] = makeCanvas(BG_W, BG_H);
    // Desert buttes / mesas & crooked comic-noir city skyline
    const mesa = new Array(BG_W);
    for (let x = 0; x < BG_W; x++) {
      if (x > 30 && x < 95) mesa[x] = 90 + ((x % 19 === 0) ? 14 : 0);
      else if (x > 185 && x < 245) mesa[x] = 96;
      else mesa[x] = 126;
    }
    drawRidge(midG, mesa, 140, C_ORANGE, C_DARKRED, C_BLACK);

    const [nearC, nearG] = makeCanvas(BG_W, BG_H);
    // Open American asphalt highway with golden center dashes & desert saguaro cacti
    ditherGradV(nearG, 0, 140, BG_W, 52, [C_BROWN, C_DGRAY, C_BLACK]);
    for (let x = 0; x < BG_W; x += 24) {
      nearG.fillStyle = EGA[C_BYELLOW];
      nearG.fillRect(x, 168, 12, 2);
    }
    for (const cx of [18, 126, 252]) {
      nearG.fillStyle = EGA[C_DGREEN];
      nearG.fillRect(cx, 134, 4, 24);
      nearG.fillRect(cx - 4, 140, 4, 3);
      nearG.fillRect(cx - 4, 136, 2, 6);
      nearG.fillRect(cx + 4, 143, 4, 3);
      nearG.fillRect(cx + 6, 138, 2, 7);
    }
    worlds.push({ name: "HIGHWAY", far: farC, mid: midC, near: nearC, stars });
  }

  // --------------------------------------------------------------------------
  // WORLD 7 (LEVEL 33): LECHUCK'S HELLFIRE CAVERN — Ghost-Fire & Brimstone
  // --------------------------------------------------------------------------
  {
    const [farC, farG] = makeCanvas(BG_W, BG_H);
    ditherGradV(farG, 0, 0, BG_W, 150, [C_BLACK, C_DARKRED, C_DPURPLE, C_DGREEN, C_GREEN]);
    const stars = drawStarfield(farG, 19917, 55, 120, [C_BGREEN, C_BYELLOW, C_BRED]);
    // Giant Voodoo Ghost Vortex swirling in cavern vault
    ditherPlanet(farG, 140, 58, 28, C_BGREEN, C_GREEN, C_DTEAL, 0, 0, false);
    ditherPlanet(farG, 140, 58, 14, C_BYELLOW, C_BGREEN, C_DGREEN, 0, 0, false);

    const [midC, midG] = makeCanvas(BG_W, BG_H);
    const crags = new Array(BG_W);
    for (let x = 0; x < BG_W; x++) {
      crags[x] = Math.round(118 + Math.sin(x * 0.14) * 16 + Math.cos(x * 0.31) * 6);
    }
    drawRidge(midG, crags, 168, C_BGREEN, C_DGREEN, C_BLACK);

    const [nearC, nearG] = makeCanvas(BG_W, BG_H);
    // Boiling spectral green/yellow Voodoo Root-Beer & Lava abyss
    ditherGradV(nearG, 0, 164, BG_W, 28, [C_DGREEN, C_GREEN, C_BGREEN, C_BYELLOW]);
    for (let x = 8; x < BG_W; x += 46) {
      for (let j = 0; j < 28; j++) {
        const w = Math.max(1, 9 - (j >> 1));
        dither(nearG, x - (w >> 1), 191 - j, w, 1, C_BLACK, C_DARKRED, 8);
      }
    }
    worlds.push({ name: "HELLFIRE", far: farC, mid: midC, near: nearC, stars });
  }

  return worlds;
}

// ============================================================================
// 8. ADLIB OPL2 FM SYNTHESIZER, 7 MULTI-BAR COMPOSITIONS & LO-FI SFX ENGINE
// ============================================================================
function midiToFreq(m) {
  return 440 * Math.pow(2, (m - 69) / 12);
}

// Soft-clipping overdrive curve for Level 33 Heavy Metal FM Guitar
function makeDriveCurve(amount) {
  const n = 256;
  const curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i * 2) / n - 1;
    curve[i] = ((Math.PI + amount) * x) / (Math.PI + amount * Math.abs(x));
  }
  return curve;
}

const OPL2 = {
  ctx: null,
  master: null,
  musicBus: null,
  sfxBus: null,
  echoIn: null,
  driveNode: null,
  noiseBuf: null,
  muted: false,
  playing: false,
  trackIdx: 0,
  step: 0,
  nextTime: 0,
  timerId: null,
  vu: [0, 0, 0, 0], // Real-time 4-channel VU levels for HUD AdLib visualizer

  init() {
    if (this.ctx) {
      if (this.ctx.state === "suspended") this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    this.ctx = ctx;

    // Master limiter/compressor prevents clipping across 4 FM voices + SFX
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -10;
    comp.knee.value = 12;
    comp.ratio.value = 8;
    comp.attack.value = 0.003;
    comp.release.value = 0.15;
    comp.connect(ctx.destination);

    this.master = ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.82;
    this.master.connect(comp);

    this.musicBus = ctx.createGain();
    this.musicBus.gain.value = 0.52;
    this.musicBus.connect(this.master);

    this.sfxBus = ctx.createGain();
    this.sfxBus.gain.value = 0.72;
    this.sfxBus.connect(this.master);

    // Crypt / Loom Echo Delay Bus
    const delay = ctx.createDelay(0.6);
    delay.delayTime.value = 0.24;
    const fb = ctx.createGain();
    fb.gain.value = 0.34;
    const damp = ctx.createBiquadFilter();
    damp.type = "lowpass";
    damp.frequency.value = 2200;
    delay.connect(damp);
    damp.connect(fb);
    fb.connect(delay);
    damp.connect(this.musicBus);
    this.echoIn = delay;

    // Heavy-metal WaveShaper overdrive send
    const shaper = ctx.createWaveShaper();
    shaper.curve = makeDriveCurve(16);
    const postCab = ctx.createBiquadFilter();
    postCab.type = "lowpass";
    postCab.frequency.value = 3400;
    shaper.connect(postCab);
    postCab.connect(this.musicBus);
    this.driveNode = shaper;

    // 1.5-second white-noise buffer for AdLib percussion & Grog explosions
    const len = Math.floor(ctx.sampleRate * 1.5);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    let lfsr = 0xACE1;
    for (let i = 0; i < len; i++) {
      // Authentic crisp digital/OPL noise texture
      const bit = ((lfsr >> 0) ^ (lfsr >> 2) ^ (lfsr >> 3) ^ (lfsr >> 5)) & 1;
      lfsr = (lfsr >> 1) | (bit << 15);
      data[i] = (Math.random() * 1.4 - 0.7) + (bit ? 0.3 : -0.3);
    }
    this.noiseBuf = buf;

    const led = document.getElementById("led-opl");
    if (led) led.classList.add("on");
    this.startSequencer();
  },

  setMuted(m) {
    this.muted = !!m;
    if (this.master && this.ctx) {
      this.master.gain.setTargetAtTime(this.muted ? 0 : 0.82, this.ctx.currentTime, 0.015);
    }
    const btn = document.getElementById("btn-sfx");
    if (btn) {
      btn.textContent = this.muted ? "SOUND: OFF" : "SOUND: ON";
      btn.classList.toggle("active", !this.muted);
    }
  },

  setTrack(idx) {
    const clamped = Math.max(0, Math.min(6, idx | 0));
    if (this.trackIdx !== clamped) {
      this.trackIdx = clamped;
      this.step = 0;
    }
  },

  // 2-Operator OPL2 FM Voice (Modulator -> ModGain -> Carrier.frequency)
  playFM(time, midi, dur, opts) {
    if (!this.ctx || midi <= 0) return;
    const ctx = this.ctx;
    const f0 = midiToFreq(midi);
    const ratio = opts.ratio || 2.0;
    const index = opts.index !== undefined ? opts.index : 2.2;
    const vol = opts.vol || 0.18;
    const atk = opts.atk || 0.006;
    const dec = opts.dec || dur;

    const car = ctx.createOscillator();
    const mod = ctx.createOscillator();
    const modGain = ctx.createGain();
    const amp = ctx.createGain();

    car.type = opts.carWave || "sine";
    mod.type = opts.modWave || "sine";

    // Optional blues saxophone / guitar pitch-bend scoop!
    if (opts.bendSemis) {
      const fStart = midiToFreq(midi + opts.bendSemis);
      car.frequency.setValueAtTime(fStart, time);
      car.frequency.exponentialRampToValueAtTime(f0, time + Math.min(0.09, dur * 0.6));
      mod.frequency.setValueAtTime(fStart * ratio, time);
      mod.frequency.exponentialRampToValueAtTime(f0 * ratio, time + Math.min(0.09, dur * 0.6));
    } else {
      car.frequency.setValueAtTime(f0, time);
      mod.frequency.setValueAtTime(f0 * ratio, time);
    }

    // Optional eerie vibrato (Purple Tentacle / Metal sustain)
    if (opts.vib) {
      const lfo = ctx.createOscillator();
      const lfoG = ctx.createGain();
      lfo.frequency.value = 6.5;
      lfoG.gain.value = f0 * 0.016;
      lfo.connect(lfoG);
      lfoG.connect(car.frequency);
      lfo.start(time);
      lfo.stop(time + dur + 0.05);
    }

    // FM Modulation Index ADSR (crisp metallic attack decaying into warm body)
    const peakMod = f0 * index;
    const susMod = f0 * (opts.modSus !== undefined ? opts.modSus : index * 0.35);
    modGain.gain.setValueAtTime(0.01, time);
    modGain.gain.linearRampToValueAtTime(peakMod, time + atk);
    modGain.gain.exponentialRampToValueAtTime(Math.max(1, susMod), time + Math.max(atk + 0.02, dec * 0.75));

    // Carrier Amplitude Envelope
    amp.gain.setValueAtTime(0.0001, time);
    amp.gain.linearRampToValueAtTime(vol, time + atk);
    amp.gain.exponentialRampToValueAtTime(0.0008, time + dur);

    mod.connect(modGain);
    modGain.connect(car.frequency);
    car.connect(amp);

    if (opts.drive && this.driveNode) {
      amp.connect(this.driveNode);
    } else {
      amp.connect(this.musicBus);
    }
    if (opts.echo && this.echoIn) {
      const send = ctx.createGain();
      send.gain.value = opts.echo;
      amp.connect(send);
      send.connect(this.echoIn);
    }

    mod.start(time);
    car.start(time);
    mod.stop(time + dur + 0.03);
    car.stop(time + dur + 0.03);
    this.vu[opts.vuCh || 0] = Math.min(1, vol * 4.2);
  },

  // Fast-Decay Low-Pass Filtered Triangle Bass
  playBass(time, midi, dur, vol = 0.28, grit = false) {
    if (!this.ctx || midi <= 0) return;
    const ctx = this.ctx;
    const freq = midiToFreq(midi);
    const osc = ctx.createOscillator();
    osc.type = grit ? "sawtooth" : "triangle";
    osc.frequency.setValueAtTime(freq, time);

    const flt = ctx.createBiquadFilter();
    flt.type = "lowpass";
    flt.Q.value = 2.2;
    flt.frequency.setValueAtTime(grit ? 1350 : 920, time);
    flt.frequency.exponentialRampToValueAtTime(210, time + Math.min(0.16, dur * 0.85));

    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, time);
    amp.gain.linearRampToValueAtTime(vol, time + 0.005);
    amp.gain.exponentialRampToValueAtTime(0.001, time + dur);

    osc.connect(flt);
    flt.connect(amp);
    amp.connect(this.musicBus);
    osc.start(time);
    osc.stop(time + dur + 0.02);
    this.vu[2] = Math.min(1, vol * 3.2);
  },

  // Filtered White-Noise & Pitched Body Percussion ('K'=Kick, 'S'=Snare, 'h'=ClosedHat, 'H'=OpenHat, 'r'=Rim)
  playDrum(time, code) {
    if (!this.ctx || !code || code === ".") return;
    const ctx = this.ctx;
    if (code === "K") {
      const osc = ctx.createOscillator();
      const amp = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(155, time);
      osc.frequency.exponentialRampToValueAtTime(38, time + 0.085);
      amp.gain.setValueAtTime(0.34, time);
      amp.gain.exponentialRampToValueAtTime(0.001, time + 0.11);
      osc.connect(amp);
      amp.connect(this.musicBus);
      osc.start(time);
      osc.stop(time + 0.12);
      this.vu[3] = 0.95;
    } else if (code === "S" || code === "r") {
      const isRim = code === "r";
      const src = ctx.createBufferSource();
      src.buffer = this.noiseBuf;
      const flt = ctx.createBiquadFilter();
      flt.type = "bandpass";
      flt.frequency.value = isRim ? 2400 : 1550;
      flt.Q.value = isRim ? 3.5 : 1.1;
      const amp = ctx.createGain();
      const dur = isRim ? 0.055 : 0.125;
      amp.gain.setValueAtTime(isRim ? 0.17 : 0.24, time);
      amp.gain.exponentialRampToValueAtTime(0.001, time + dur);
      src.connect(flt);
      flt.connect(amp);
      amp.connect(this.musicBus);
      src.start(time);
      src.stop(time + dur + 0.01);
      if (!isRim) {
        const snap = ctx.createOscillator();
        const sg = ctx.createGain();
        snap.type = "triangle";
        snap.frequency.setValueAtTime(210, time);
        snap.frequency.exponentialRampToValueAtTime(95, time + 0.05);
        sg.gain.setValueAtTime(0.16, time);
        sg.gain.exponentialRampToValueAtTime(0.001, time + 0.06);
        snap.connect(sg);
        sg.connect(this.musicBus);
        snap.start(time);
        snap.stop(time + 0.07);
      }
      this.vu[3] = isRim ? 0.65 : 0.9;
    } else if (code === "h" || code === "H") {
      const open = code === "H";
      const src = ctx.createBufferSource();
      src.buffer = this.noiseBuf;
      const flt = ctx.createBiquadFilter();
      flt.type = "highpass";
      flt.frequency.value = 6400;
      const amp = ctx.createGain();
      const dur = open ? 0.13 : 0.032;
      amp.gain.setValueAtTime(open ? 0.11 : 0.075, time);
      amp.gain.exponentialRampToValueAtTime(0.001, time + dur);
      src.connect(flt);
      flt.connect(amp);
      amp.connect(this.musicBus);
      src.start(time);
      src.stop(time + dur + 0.01);
      this.vu[3] = Math.max(this.vu[3], open ? 0.6 : 0.35);
    }
  },

  startSequencer() {
    if (this.timerId) return;
    this.playing = true;
    this.nextTime = this.ctx.currentTime + 0.05;
    this.timerId = setInterval(() => {
      if (!this.ctx || !this.playing || this.ctx.state !== "running") return;
      const horizon = this.ctx.currentTime + 0.13;
      while (this.nextTime < horizon) {
        const tr = TRACKS[this.trackIdx];
        const stepDur = 60 / tr.bpm / 4;
        // Swing timing on Track 5 (Sam & Max Blues Shuffle!)
        const swingOff = (tr.swing && (this.step & 1) === 1) ? stepDur * 0.28 : 0;
        tr.trigger(this, this.step, this.nextTime + swingOff, stepDur);
        this.nextTime += stepDur;
        this.step = (this.step + 1) % tr.len;
      }
    }, 25);
  },

  // Dedicated Non-Clipping Lo-Fi AdLib SFX Channels
  sfx(kind, param = 0) {
    if (!this.ctx || this.muted || this.ctx.state !== "running") return;
    const ctx = this.ctx;
    const t = ctx.currentTime;

    const quickFM = (fStart, fEnd, dur, ratio, idx, vol, wave = "sine") => {
      const c = ctx.createOscillator();
      const m = ctx.createOscillator();
      const mg = ctx.createGain();
      const g = ctx.createGain();
      c.type = wave;
      c.frequency.setValueAtTime(fStart, t);
      if (fEnd !== fStart) c.frequency.exponentialRampToValueAtTime(Math.max(20, fEnd), t + dur);
      m.frequency.setValueAtTime(fStart * ratio, t);
      if (fEnd !== fStart) m.frequency.exponentialRampToValueAtTime(Math.max(20, fEnd * ratio), t + dur);
      mg.gain.setValueAtTime(fStart * idx, t);
      mg.gain.exponentialRampToValueAtTime(1, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      m.connect(mg); mg.connect(c.frequency); c.connect(g); g.connect(this.sfxBus);
      m.start(t); c.start(t); m.stop(t + dur + 0.01); c.stop(t + dur + 0.01);
    };

    switch (kind) {
      case "paddle":
        quickFM(330, 495, 0.065, 2.0, 1.6, 0.22);
        break;
      case "wall":
        quickFM(220, 185, 0.045, 1.5, 1.2, 0.15);
        break;
      case "brick": {
        const scale = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5];
        const f = scale[Math.min(scale.length - 1, param | 0)];
        quickFM(f, f * 1.12, 0.085, 2.0, 2.4, 0.22);
        break;
      }
      case "armor":
        quickFM(620, 410, 0.09, 3.4, 3.8, 0.24, "triangle");
        break;
      case "steel":
        quickFM(940, 880, 0.055, 2.73, 4.5, 0.18);
        break;
      case "grog": {
        // Crunchy 3x3 SCUMM Bar Grog explosion + acid fizz!
        const src = ctx.createBufferSource();
        src.buffer = this.noiseBuf;
        const flt = ctx.createBiquadFilter();
        flt.type = "lowpass";
        flt.frequency.setValueAtTime(980, t);
        flt.frequency.exponentialRampToValueAtTime(95, t + 0.34);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.38, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.36);
        src.connect(flt); flt.connect(g); g.connect(this.sfxBus);
        src.start(t); src.stop(t + 0.37);
        quickFM(190, 42, 0.28, 1.5, 4.0, 0.28, "sawtooth");
        break;
      }
      case "laser":
        quickFM(1350, 260, 0.09, 1.5, 2.2, 0.18, "sawtooth");
        break;
      case "powerup": {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((fn, i) => {
          const st = t + i * 0.048;
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = "triangle";
          o.frequency.setValueAtTime(fn, st);
          g.gain.setValueAtTime(0.22, st);
          g.gain.exponentialRampToValueAtTime(0.001, st + 0.11);
          o.connect(g); g.connect(this.sfxBus);
          o.start(st); o.stop(st + 0.12);
        });
        break;
      }
      case "sword":
        // Metallic cutlass clash shing!
        quickFM(1480, 2240, 0.16, 2.41, 4.5, 0.24);
        break;
      case "warp":
        // Chron-o-John temporal phase whoosh
        quickFM(260, 780, 0.22, 3.0, 3.2, 0.18);
        break;
      case "dart":
        quickFM(820, 310, 0.06, 2.0, 2.0, 0.15);
        break;
      case "loom": {
        // Pure Loom crystal note chime (C D E F G A B C)
        const loomNotes = [523.25, 587.33, 659.25, 698.46, 783.99, 880.0, 987.77, 1046.5];
        const fn = loomNotes[param % loomNotes.length];
        quickFM(fn, fn, 0.26, 3.0, 1.8, 0.24);
        break;
      }
      case "bossHit":
        quickFM(240, 95, 0.16, 0.5, 5.0, 0.28, "sawtooth");
        break;
      case "die": {
        [392, 349.23, 311.13, 261.63].forEach((fn, i) => {
          const st = t + i * 0.11;
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = "sawtooth";
          o.frequency.setValueAtTime(fn, st);
          o.frequency.linearRampToValueAtTime(fn * 0.88, st + 0.1);
          g.gain.setValueAtTime(0.2, st);
          g.gain.exponentialRampToValueAtTime(0.001, st + 0.14);
          o.connect(g); g.connect(this.sfxBus);
          o.start(st); o.stop(st + 0.15);
        });
        break;
      }
      case "clear": {
        [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((fn, i) => {
          const st = t + i * 0.075;
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = "triangle";
          o.frequency.setValueAtTime(fn, st);
          g.gain.setValueAtTime(0.24, st);
          g.gain.exponentialRampToValueAtTime(0.001, st + 0.16);
          o.connect(g); g.connect(this.sfxBus);
          o.start(st); o.stop(st + 0.17);
        });
        break;
      }
    }
  }
};
