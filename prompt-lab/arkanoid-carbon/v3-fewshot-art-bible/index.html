  worldIdx: 0,          // 0..6
  score: 0,
  hiScore: 50000,
  lives: 3,
  combo: 0,
  stateTimer: 0,
  animTick: 0,
  marqueePx: 0,

  // Screen juice (integer pixel shake + pure EGA Bayer/scanline stipple flash)
  shakeTime: 0,
  shakeMag: 0,
  flashLevel: 0,        // 0..14 Bayer stipple flash intensity
  flashReg: C_BGREEN,

  // Vaus Paddle state
  paddle: {
    x: 128,             // Center X inside [PF_LEFT..PF_RIGHT]
    w: 34,
    h: 7,
    mode: "STD",        // 'STD', 'LASER', 'EXPAND', 'CATCH'
    laserCd: 0,
    invuln: 0
  },

  // Active timed modifiers
  slowTimer: 0,
  cutlassTimer: 0,      // World 1 Golden Cutlass Pierce Mode!
  doubleScoreTimer: 0,  // World 5 Sharpening Draft reward

  // World-specific state
  duelPips: 0,          // 0..3 parries in World 1
  insultBanner: "",
  insultBannerTimer: 0,
  insultColor: C_BYELLOW,

  chronoEra: 1,         // 0=1789 PAST, 1=1993 PRESENT, 2=2193 FUTURE
  chronoTimer: 6.0,

  idolShotTimer: 3.0,   // World 3 dart trap timer
  idolWarn: false,

  gravityWells: [],     // World 4 singularities
  loomNotes: [],        // World 5 0..4 woven notes
  loomDraftIdx: 0,
  roadWalls: [],        // World 6 moving highway barricades

  // Level 33 Ghost Pirate LeChuck Boss
  boss: {
    active: false,
    x: 128,
    y: 25,
    vx: 44,
    hp: 30,
    maxHp: 30,
    flash: 0,
    fireTimer: 2.5,
    bricksBroken: 0
  },

  bricks: [],
  destructibleCount: 0,
  balls: [],
  capsules: [],
  lasers: [],
  hazards: [],          // Atlantean darts & LeChuck voodoo skulls
  particles: [],
  popups: [],
  fireworks: []
};

// Load persisted High Score safely
try {
  const saved = parseInt(localStorage.getItem(HI_SCORE_KEY) || "50000", 10);
  if (!Number.isNaN(saved) && saved > game.hiScore) game.hiScore = saved;
} catch (_) {}

function addScore(pts, popX, popY, popColor = C_BYELLOW, customLabel = null) {
  const mult = game.doubleScoreTimer > 0 ? 2 : 1;
  const gain = (pts * mult) | 0;
  if (game.state !== STATE_TITLE) {
    game.score = Math.min(9999999, game.score + gain);
    if (game.score > game.hiScore) {
      game.hiScore = game.score;
      try { localStorage.setItem(HI_SCORE_KEY, String(game.hiScore)); } catch (_) {}
    }
  }
  if (popX !== undefined && popY !== undefined) {
    spawnPopup(popX, popY, customLabel || ("+" + gain), popColor);
  }
}

function spawnPopup(x, y, text, reg = C_BYELLOW) {
  if (game.popups.length > 18) game.popups.shift();
  game.popups.push({ x: x | 0, y: y | 0, vy: -22, text, reg, life: 0.85 });
}

function spawnDebris(x, y, regMain, count = 6, speedScale = 1) {
  const regHi = egaShade(regMain, 1);
  const regLo = egaShade(regMain, -1);
  for (let i = 0; i < count; i++) {
    if (game.particles.length > 160) game.particles.shift();
    const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.6;
    const spd = (28 + Math.random() * 62) * speedScale;
    game.particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 24,
      reg: (i % 3 === 0) ? regHi : ((i % 3 === 1) ? regMain : regLo),
      size: (i & 1) === 0 ? 2 : 1,
      life: 0.35 + Math.random() * 0.35
    });
  }
}

function triggerShake(mag, dur, flashLvl = 0, flashColor = C_BGREEN) {
  game.shakeMag = Math.max(game.shakeMag, mag);
  game.shakeTime = Math.max(game.shakeTime, dur);
  if (flashLvl > game.flashLevel) {
    game.flashLevel = flashLvl;
    game.flashReg = flashColor;
  }
}

// Build brick list & world mechanics for a stage (0..32)
function loadLevel(idx, isPreview = false) {
  const clamped = ((idx % LEVEL_DEFS.length) + LEVEL_DEFS.length) % LEVEL_DEFS.length;
  const def = LEVEL_DEFS[clamped];
  game.levelIdx = clamped;
  game.worldIdx = def.world;
  OPL2.setTrack(def.world);

  game.bricks = [];
  game.capsules = [];
  game.lasers = [];
  game.hazards = [];
  game.particles = [];
  game.popups = [];
  game.destructibleCount = 0;
  game.combo = 0;

  // Reset world-specific state
  game.duelPips = 0;
  game.cutlassTimer = 0;
  game.doubleScoreTimer = 0;
  game.insultBanner = "";
  game.insultBannerTimer = 0;
  game.chronoEra = 1;
  game.chronoTimer = 6.0;
  game.idolShotTimer = 2.8;
  game.idolWarn = false;
  game.loomNotes = [];
  game.gravityWells = [];
  game.roadWalls = [];

  const startY = def.yOffset || 15;
  for (let r = 0; r < def.rows.length; r++) {
    const rowStr = def.rows[r];
    for (let c = 0; c < 30; c++) {
      const ch = rowStr[c];
      if (!ch || ch === "." || ch === " ") continue;
      const bx = PF_LEFT + c * BRICK_W;
      const by = startY + r * BRICK_H;
      let type = "normal";
      let hp = 1;
      let colorReg = C_LGRAY;

      if (ch === "#") {
        type = "steel";
        hp = 9999;
        colorReg = C_LGRAY;
      } else if (ch === "*") {
        type = "grog";
        hp = 1;
        colorReg = C_BGREEN;
      } else if (ch === "!") {
        type = "idol";
        hp = 2;
        colorReg = C_GOLD;
      } else if (ch === "~") {
        type = "loom";
        hp = 1;
        colorReg = C_BCYAN;
      } else if (ch === "1" || ch === "2") {
        type = "tempo";
        hp = 1;
        colorReg = ch === "1" ? C_BCYAN : C_BMAG;
      } else {
        const lower = ch.toLowerCase();
        const pal = BRICK_PALETTE_DEFS[lower] || BRICK_PALETTE_DEFS["w"];
        colorReg = pal[1];
        if (ch !== lower) {
          type = "armor";
          hp = 2;
        }
      }

      if (type !== "steel") game.destructibleCount++;
      game.bricks.push({
        col: c, row: r,
        x: bx, y: by, w: BRICK_W, h: BRICK_H,
        ch, type, hp, maxHp: hp, colorReg, alive: true
      });
    }
  }

  // World 4 (worldIdx === 3): Orbital Gravity Wells
  if (game.worldIdx === 3) {
    const twoWells = clamped >= 21;
    if (twoWells) {
      game.gravityWells.push({ cx: 78, cy: 138, r: 14, phase: 0 });
      game.gravityWells.push({ cx: 178, cy: 138, r: 14, phase: Math.PI });
    } else {
      game.gravityWells.push({ cx: 128, cy: 140, r: 16, phase: 0 });
    }
  }

  // World 6 (worldIdx === 5): Sam & Max Moving Highway Barricades
  if (game.worldIdx === 5) {
    game.roadWalls.push({ x: 40, y: 136, w: 20, h: 5, vx: 46 });
    game.roadWalls.push({ x: 186, y: 148, w: 20, h: 5, vx: -52 });
  }

  // World 7 (Level 33, worldIdx === 6): Ghost Pirate LeChuck Boss!
  if (game.worldIdx === 6) {
    game.boss.active = true;
    game.boss.x = 128;
    game.boss.y = 24;
    game.boss.vx = 48;
    game.boss.hp = 30;
    game.boss.maxHp = 30;
    game.boss.flash = 0;
    game.boss.fireTimer = 2.6;
    game.boss.bricksBroken = 0;
  } else {
    game.boss.active = false;
  }

  if (!isPreview) {
    resetPaddleAndBall(true);
  }
}

function getBaseBallSpeed() {
  let spd = 108 + Math.min(44, game.levelIdx * 1.25);
  if (game.slowTimer > 0) spd *= 0.72;
  if (game.worldIdx === 1) {
    // Chron-o-John subtle era speed shift
    if (game.chronoEra === 0) spd *= 0.92;
    else if (game.chronoEra === 2) spd *= 1.08;
  }
  return spd;
}

function resetPaddleAndBall(keepMode = false) {
  if (!keepMode) {
    game.paddle.mode = "STD";
    game.paddle.w = 34;
    game.slowTimer = 0;
    game.cutlassTimer = 0;
  } else {
    game.paddle.w = game.paddle.mode === "EXPAND" ? 48 : 34;
  }
  game.paddle.x = 128;
  game.paddle.laserCd = 0;
  game.balls = [{
    x: 128,
    y: PADDLE_Y - 3,
    vx: 46,
    vy: -98,
    r: 2.4,
    stuck: true,
    stuckOff: 0,
    holdTime: 0,
    swan: false
  }];
}

function isBrickTangible(b) {
  if (!b.alive) return false;
  if (b.type !== "tempo" || game.worldIdx !== 1) return true;
  // Never strand player when <= 6 destructible bricks remain!
  if (game.destructibleCount <= 6 || game.chronoEra === 1) return true;
  if (game.chronoEra === 0) return b.ch === "1";
  return b.ch === "2";
}

function maybeSpawnCapsule(x, y) {
  if (game.capsules.length >= 3) return;
  if (Math.random() > 0.22) return;
  // Weighted LucasArts capsule pool: L, E, C, S, and rarer P (1UP Gold Guy)
  const roll = Math.random();
  let kind = "L";
  if (roll < 0.25) kind = "L";
  else if (roll < 0.50) kind = "E";
  else if (roll < 0.72) kind = "C";
  else if (roll < 0.91) kind = "S";
  else kind = "P";
  game.capsules.push({ x: x - 9, y, w: 18, h: 9, vy: 42, kind });
}

function applyCapsule(kind) {
  OPL2.sfx("powerup");
  addScore(250, game.paddle.x, PADDLE_Y - 8, C_WHITE, kind + " +250");
  if (kind === "L") {
    game.paddle.mode = "LASER";
    game.paddle.w = 34;
  } else if (kind === "E") {
    game.paddle.mode = "EXPAND";
    game.paddle.w = 48;
  } else if (kind === "C") {
    game.paddle.mode = "CATCH";
    game.paddle.w = 34;
  } else if (kind === "S") {
    game.slowTimer = 12.0;
  } else if (kind === "P") {
    game.lives = Math.min(9, game.lives + 1);
    spawnPopup(game.paddle.x, PADDLE_Y - 16, "1UP GOLD GUY!", C_BYELLOW);
  }
  clampPaddle();
}

function weaveLoomNote(bx, by) {
  const noteIdx = game.loomNotes.length;
  const noteColors = [C_BRED, C_BYELLOW, C_BGREEN, C_BCYAN, C_BBLUE, C_BMAG, C_WHITE];
  const col = noteColors[(game.loomDraftIdx * 2 + noteIdx) % noteColors.length];
  OPL2.sfx("loom", game.loomDraftIdx + noteIdx);
  game.loomNotes.push(col);

  if (game.loomNotes.length >= 4) {
    const draft = LOOM_DRAFTS[game.loomDraftIdx % LOOM_DRAFTS.length];
    game.loomDraftIdx++;
    game.loomNotes = [];
    triggerShake(2, 0.16, 7, draft.color);
    spawnPopup(128, 128, draft.name, draft.color);

    const dType = (game.loomDraftIdx - 1) % 3;
    if (dType === 0 && game.balls.length < 4) {
      // TRANSCENDENCE: Spawn twin spectral Swan-Ball!
      const src = game.balls[0];
      if (src) {
        const spd = getBaseBallSpeed();
        game.balls.push({
          x: src.x, y: src.y,
          vx: -src.vx || 52,
          vy: -Math.abs(src.vy || spd * 0.8),
          r: 2.4, stuck: false, stuckOff: 0, holdTime: 0, swan: true
        });
      }
    } else if (dType === 1) {
      // OPENING: Shatter up to 4 random destructible bricks!
      const pool = game.bricks.filter((b) => b.alive && b.type !== "steel");
      for (let k = 0; k < 4 && pool.length > 0; k++) {
        const pick = (Math.random() * pool.length) | 0;
        const tb = pool.splice(pick, 1)[0];
        damageBrick(tb, 2, true);
      }
    } else {
      // SHARPENING: 8s Double Score + Precision Slow!
      game.doubleScoreTimer = 8.0;
      game.slowTimer = Math.max(game.slowTimer, 6.0);
    }
  } else {
    spawnPopup(bx, by, "♪", col);
  }
}

// Recursive 3x3 SCUMM Bar Grog Detonation & Brick Damage Handler
function damageBrick(b, dmg = 1, fromExplosion = false) {
  if (!b.alive || b.type === "steel") return;
  b.hp -= dmg;
  if (b.hp > 0) {
    OPL2.sfx("armor");
    spawnDebris(b.x + 4, b.y + 3, b.colorReg, 4, 0.7);
    addScore(25);
    return;
  }

  b.alive = false;
  game.destructibleCount = Math.max(0, game.destructibleCount - 1);
  game.combo++;
  const cx = b.x + 4;
  const cy = b.y + 3;

  if (b.type === "grog") {
    // 3x3 Recursive Bubbling Grog Explosion!
    OPL2.sfx("grog");
    triggerShake(4, 0.24, 10, C_BGREEN);
    spawnDebris(cx, cy, C_BGREEN, 14, 1.45);
    spawnDebris(cx, cy, C_BYELLOW, 8, 1.2);
    addScore(150, cx, cy, C_BGREEN);

    for (const nb of game.bricks) {
      if (!nb.alive || nb.type === "steel") continue;
      if (Math.abs(nb.col - b.col) <= 1 && Math.abs(nb.row - b.row) <= 1) {
        damageBrick(nb, 2, true);
      }
    }
  } else {
    if (!fromExplosion) OPL2.sfx("brick", Math.min(7, game.combo - 1));
    spawnDebris(cx, cy, b.colorReg, 7, 1.0);
    const comboBonus = Math.min(100, (game.combo >> 2) * 25);
    const basePts = b.type === "armor" || b.type === "idol" ? 100 : 50;
    const total = basePts + comboBonus;
    if (game.combo >= 4 && game.combo % 4 === 0) {
      addScore(total, cx, cy, C_BCYAN, "+" + total + "!");
    } else {
      addScore(total, fromExplosion ? undefined : cx, fromExplosion ? undefined : cy, C_BYELLOW);
    }
    maybeSpawnCapsule(cx, cy);
  }

  // World 5 Loom Crystal Note weaving
  if (game.worldIdx === 4 && (b.type === "loom" || (!fromExplosion && game.combo % 6 === 0))) {
    weaveLoomNote(cx, cy);
  }

  // Level 33 Voodoo Root Beer splash damage on LeChuck every 8 bricks broken!
  if (game.boss.active && game.boss.hp > 0) {
    game.boss.bricksBroken++;
    if (game.boss.bricksBroken % 8 === 0) {
      damageBoss(2, cx, cy, "ROOT BEER -2!");
    }
  }
}

function damageBoss(dmg, popX, popY, label) {
  if (!game.boss.active || game.boss.hp <= 0) return;
  game.boss.hp = Math.max(0, game.boss.hp - dmg);
  game.boss.flash = 0.14;
  OPL2.sfx("bossHit");
  triggerShake(3, 0.16, 7, C_BCYAN);
  addScore(250 * dmg, popX ?? game.boss.x, popY ?? game.boss.y, C_BGREEN, label || "+250");

  if (game.boss.hp <= 0) {
    // Grand LeChuck Spectral Defeat Explosion!
    OPL2.sfx("grog");
    OPL2.sfx("clear");
    triggerShake(6, 0.55, 13, C_WHITE);
    for (let k = 0; k < 5; k++) {
      spawnDebris(game.boss.x - 16 + k * 8, game.boss.y, k & 1 ? C_BGREEN : C_BYELLOW, 14, 1.7);
    }
    // Shatter all remaining cursed bricks on LeChuck's Ghost Galleon
    for (const br of game.bricks) {
      if (br.alive && br.type !== "steel") {
        br.alive = false;
        spawnDebris(br.x + 4, br.y + 3, br.colorReg, 3, 1.1);
      }
    }
    game.destructibleCount = 0;
    game.hazards = [];
    addScore(10000, 128, 60, C_BYELLOW, "LECHUCK BANISHED +10000!");
    game.state = STATE_VICTORY;
    game.stateTimer = 0;
  }
}

function clampPaddle() {
  const half = game.paddle.w * 0.5;
  if (game.paddle.x < PF_LEFT + half) game.paddle.x = PF_LEFT + half;
  if (game.paddle.x > PF_RIGHT - half) game.paddle.x = PF_RIGHT - half;
}

function launchOrFire() {
  OPL2.init();
  if (game.state === STATE_TITLE) {
    startNewGame(game.selectedLevel);
    return;
  }
  if (game.state === STATE_OVER || game.state === STATE_VICTORY) {
    game.state = STATE_TITLE;
    loadLevel(game.selectedLevel, true);
    return;
  }
  if (game.state === STATE_READY) {
    game.state = STATE_PLAYING;
  }
  if (game.state !== STATE_PLAYING) return;

  // Release any caught/stuck balls
  let released = false;
  for (const b of game.balls) {
    if (b.stuck) {
      b.stuck = false;
      const spd = getBaseBallSpeed();
      const ang = (b.stuckOff / Math.max(1, game.paddle.w * 0.5)) * 0.65 + (Math.random() - 0.5) * 0.12;
      b.vx = Math.sin(ang) * spd;
      b.vy = -Math.cos(ang) * spd;
      released = true;
    }
  }
  if (released) OPL2.sfx("paddle");

  // Fire Space-Ranger Twin Laser Bolts if in LASER mode!
  if (game.paddle.mode === "LASER" && game.paddle.laserCd <= 0 && game.lasers.length < 6) {
    game.paddle.laserCd = 0.24;
    OPL2.sfx("laser");
    game.lasers.push({ x: Math.round(game.paddle.x - 12), y: PADDLE_Y - 5, vy: -210 });
    game.lasers.push({ x: Math.round(game.paddle.x + 10), y: PADDLE_Y - 5, vy: -210 });
  }
}

function startNewGame(startStage = 0) {
  game.score = 0;
  game.lives = 3;
  game.paddle.mode = "STD";
  game.paddle.w = 34;
  loadLevel(startStage, false);
  game.state = STATE_READY;
  game.stateTimer = 1.3;
}

function loseLife() {
  if (game.paddle.invuln > 0) return;
  OPL2.sfx("die");
  triggerShake(4, 0.3, 9, C_BRED);
  spawnDebris(game.paddle.x, PADDLE_Y + 3, C_BRED, 16, 1.3);
  game.lives--;
  game.duelPips = 0;
  game.cutlassTimer = 0;
  if (game.lives <= 0) {
    game.state = STATE_OVER;
    game.stateTimer = 0;
  } else {
    resetPaddleAndBall(false);
    game.paddle.invuln = 1.5;
    game.state = STATE_READY;
    game.stateTimer = 1.0;
  }
}

// Enforce minimum vertical component so balls NEVER loop infinitely horizontally
function normalizeBallVelocity(b, targetSpeed) {
  let vx = b.vx;
  let vy = b.vy;
  const mag = Math.hypot(vx, vy) || 1;
  vx = (vx / mag) * targetSpeed;
  vy = (vy / mag) * targetSpeed;
  const minVy = targetSpeed * 0.24;
  if (Math.abs(vy) < minVy) {
    const signY = vy < 0 ? -1 : 1;
    const signX = vx < 0 ? -1 : 1;
    vy = signY * minVy;
    vx = signX * Math.sqrt(Math.max(1, targetSpeed * targetSpeed - vy * vy));
  }
  b.vx = vx;
  b.vy = vy;
}

// Corner-safe Circle vs AABB overlap test & resolution normal
function collideCircleAABB(cx, cy, r, rx, ry, rw, rh) {
  const nx = cx < rx ? rx : (cx > rx + rw ? rx + rw : cx);
  const ny = cy < ry ? ry : (cy > ry + rh ? ry + rh : cy);
  const dx = cx - nx;
  const dy = cy - ny;
  const distSq = dx * dx + dy * dy;
  if (distSq >= r * r) return null;

  if (distSq > 1e-6) {
    const dist = Math.sqrt(distSq);
    return { nx: dx / dist, ny: dy / dist, pen: r - dist, distSq };
  }
  // Center inside AABB fallback: push out along shallowest axis
  const leftPen = (cx + r) - rx;
  const rightPen = (rx + rw) - (cx - r);
  const topPen = (cy + r) - ry;
  const botPen = (ry + rh) - (cy - r);
  const minPen = Math.min(leftPen, rightPen, topPen, botPen);
  if (minPen === topPen) return { nx: 0, ny: -1, pen: topPen, distSq: 0 };
  if (minPen === botPen) return { nx: 0, ny: 1, pen: botPen, distSq: 0 };
  if (minPen === leftPen) return { nx: -1, ny: 0, pen: leftPen, distSq: 0 };
  return { nx: 1, ny: 0, pen: rightPen, distSq: 0 };
}

// ============================================================================
// MAIN SIMULATION STEP
// ============================================================================
const keys = { left: false, right: false, fire: false };

function update(dt) {
  game.animTick += dt;
  game.marqueePx += dt * 26;

  // Decay AdLib VU bars smoothly
  for (let i = 0; i < 4; i++) OPL2.vu[i] = Math.max(0, OPL2.vu[i] - dt * 2.8);

  // Decay screen shake & EGA Bayer flash
  if (game.shakeTime > 0) game.shakeTime = Math.max(0, game.shakeTime - dt);
  if (game.flashLevel > 0) game.flashLevel = Math.max(0, game.flashLevel - dt * 52);

  // Update debris particles & popups across states
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.life -= dt;
    if (p.life <= 0) { game.particles.splice(i, 1); continue; }
    p.vy += 155 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  for (let i = game.popups.length - 1; i >= 0; i--) {
    const pp = game.popups[i];
    pp.life -= dt;
    if (pp.life <= 0) { game.popups.splice(i, 1); continue; }
    pp.y += pp.vy * dt;
  }

  // Victory fireworks animation
  if (game.state === STATE_VICTORY) {
    game.stateTimer += dt;
    if (Math.random() < dt * 3.5) {
      const fx = 28 + Math.random() * 200;
      const fy = 26 + Math.random() * 90;
      const cols = [C_BYELLOW, C_BCYAN, C_BMAG, C_BGREEN, C_BRED, C_WHITE];
      const col = cols[(Math.random() * cols.length) | 0];
      spawnDebris(fx, fy, col, 16, 1.3);
      OPL2.sfx("brick", (Math.random() * 7) | 0);
    }
    return;
  }

  if (game.state === STATE_TITLE || game.state === STATE_PAUSED || game.state === STATE_OVER) {
    return;
  }

  if (game.state === STATE_CLEAR) {
    game.stateTimer -= dt;
    if (game.stateTimer <= 0) {
      if (game.levelIdx + 1 >= LEVEL_DEFS.length) {
        game.state = STATE_VICTORY;
        game.stateTimer = 0;
      } else {
        loadLevel(game.levelIdx + 1, false);
        game.state = STATE_READY;
        game.stateTimer = 1.2;
      }
    }
    return;
  }

  // Keyboard paddle movement
  const moveSpd = 172;
  if (keys.left) game.paddle.x -= moveSpd * dt;
  if (keys.right) game.paddle.x += moveSpd * dt;
  clampPaddle();

  if (game.paddle.laserCd > 0) game.paddle.laserCd = Math.max(0, game.paddle.laserCd - dt);
  if (game.paddle.invuln > 0) game.paddle.invuln = Math.max(0, game.paddle.invuln - dt);
  if (game.slowTimer > 0) game.slowTimer = Math.max(0, game.slowTimer - dt);
  if (game.cutlassTimer > 0) game.cutlassTimer = Math.max(0, game.cutlassTimer - dt);
  if (game.doubleScoreTimer > 0) game.doubleScoreTimer = Math.max(0, game.doubleScoreTimer - dt);
  if (game.insultBannerTimer > 0) game.insultBannerTimer = Math.max(0, game.insultBannerTimer - dt);

  if (game.state === STATE_READY) {
    for (const b of game.balls) {
      if (b.stuck) {
        b.x = game.paddle.x + b.stuckOff;
        b.y = PADDLE_Y - 3;
      }
    }
    game.stateTimer -= dt;
    if (game.stateTimer <= 0) game.state = STATE_PLAYING;
    return;
  }

  // Continuous auto-fire when holding Space in Space-Ranger LASER mode
  if (keys.fire && game.paddle.mode === "LASER" && game.paddle.laserCd <= 0) {
    launchOrFire();
  }

  // ---- ACTIVE WORLD MECHANIC UPDATES ----
  // World 2 (worldIdx === 1): Chron-o-John Era Phasing
  if (game.worldIdx === 1) {
    if (game.destructibleCount <= 6) {
      game.chronoEra = 1;
    } else {
      game.chronoTimer -= dt;
      if (game.chronoTimer <= 0) {
        game.chronoTimer = 6.0;
        game.chronoEra = (game.chronoEra + 1) % 3;
        OPL2.sfx("warp");
        triggerShake(1, 0.1, 5, game.chronoEra === 0 ? C_BCYAN : (game.chronoEra === 2 ? C_BMAG : C_BYELLOW));
      }
    }
  }

  // World 3 (worldIdx === 2): Atlantean Dart-Spitting Idols
  if (game.worldIdx === 2) {
    game.idolShotTimer -= dt;
    game.idolWarn = game.idolShotTimer < 0.75;
    if (game.idolShotTimer <= 0) {
      game.idolShotTimer = 3.2;
      const idols = game.bricks.filter((b) => b.alive && b.type === "idol");
      if (idols.length > 0 && game.hazards.length < 4) {
        const count = Math.min(2, idols.length);
        for (let k = 0; k < count; k++) {
          const id = idols[(Math.random() * idols.length) | 0];
          game.hazards.push({
            kind: "dart",
            x: id.x + 2, y: id.y + 6, w: 5, h: 9,
            vx: 0, vy: 76
          });
        }
        OPL2.sfx("dart");
      }
    }
  }

  // World 4 (worldIdx === 3): Orbital Gravity Wells motion
  if (game.worldIdx === 3) {
    for (let i = 0; i < game.gravityWells.length; i++) {
      const gw = game.gravityWells[i];
      gw.phase += dt * 1.15;
      const baseCx = game.gravityWells.length === 1 ? 128 : (i === 0 ? 78 : 178);
      gw.cx = baseCx + Math.cos(gw.phase) * 24;
      gw.cy = 138 + Math.sin(gw.phase * 1.5) * 9;
    }
  }

  // World 6 (worldIdx === 5): Sam & Max Moving Highway Road Walls
  if (game.worldIdx === 5) {
    for (const rw of game.roadWalls) {
      rw.x += rw.vx * dt;
      if (rw.x <= PF_LEFT + 2) { rw.x = PF_LEFT + 2; rw.vx = Math.abs(rw.vx); }
      if (rw.x + rw.w >= PF_RIGHT - 2) { rw.x = PF_RIGHT - 2 - rw.w; rw.vx = -Math.abs(rw.vx); }
    }
  }

  // World 7 (Level 33, worldIdx === 6): Ghost Pirate LeChuck Boss AI!
  if (game.boss.active && game.boss.hp > 0) {
    if (game.boss.flash > 0) game.boss.flash = Math.max(0, game.boss.flash - dt);
    const enraged = game.boss.hp <= 15;
    const spdMult = enraged ? 1.45 : 1.0;
    game.boss.x += game.boss.vx * spdMult * dt;
    game.boss.y = 24 + Math.sin(game.animTick * (enraged ? 4.2 : 2.4)) * (enraged ? 6 : 3);
    if (game.boss.x < PF_LEFT + 24) { game.boss.x = PF_LEFT + 24; game.boss.vx = Math.abs(game.boss.vx); }
    if (game.boss.x > PF_RIGHT - 24) { game.boss.x = PF_RIGHT - 24; game.boss.vx = -Math.abs(game.boss.vx); }

    game.boss.fireTimer -= dt;
    if (game.boss.fireTimer <= 0) {
      game.boss.fireTimer = enraged ? 1.9 : 2.8;
      if (game.hazards.length < 5) {
        const aimDx = game.paddle.x - game.boss.x;
        const aimLen = Math.hypot(aimDx, PADDLE_Y - game.boss.y) || 1;
        const skullSpd = enraged ? 86 : 72;
        game.hazards.push({
          kind: "skull",
          x: game.boss.x - 6, y: game.boss.y + 10, w: 10, h: 9,
          vx: (aimDx / aimLen) * skullSpd * 0.65,
          vy: skullSpd
        });
        OPL2.sfx("dart");
      }
    }
  }

  // ---- UPDATE LASERS ----
  for (let i = game.lasers.length - 1; i >= 0; i--) {
    const lz = game.lasers[i];
    lz.y += lz.vy * dt;
    if (lz.y < PF_TOP) { game.lasers.splice(i, 1); continue; }

    let consumed = false;
    // Laser vs LeChuck Boss
    if (game.boss.active && game.boss.hp > 0) {
      if (lz.x + 2 >= game.boss.x - 18 && lz.x <= game.boss.x + 18 &&
          lz.y <= game.boss.y + 14 && lz.y + 5 >= game.boss.y - 14) {
        damageBoss(1, lz.x, lz.y, "+250");
        game.lasers.splice(i, 1);
        continue;
      }
    }
    // Laser vs Hazards (shoot down Atlantean darts & Voodoo Skulls!)
    for (let h = game.hazards.length - 1; h >= 0; h--) {
      const hz = game.hazards[h];
      if (lz.x + 3 >= hz.x && lz.x <= hz.x + hz.w && lz.y <= hz.y + hz.h && lz.y + 6 >= hz.y) {
        spawnDebris(hz.x + 4, hz.y + 4, C_BYELLOW, 6, 0.9);
        addScore(75, hz.x, hz.y, C_BCYAN);
        game.hazards.splice(h, 1);
        consumed = true;
        break;
      }
    }
    if (consumed) { game.lasers.splice(i, 1); continue; }

    // Laser vs Bricks
    for (const br of game.bricks) {
      if (!isBrickTangible(br)) continue;
      if (lz.x + 2 >= br.x && lz.x <= br.x + br.w && lz.y <= br.y + br.h && lz.y + 5 >= br.y) {
        if (br.type === "steel") {
          OPL2.sfx("steel");
          spawnDebris(lz.x, lz.y, C_LGRAY, 3, 0.6);
        } else {
          damageBrick(br, 1, false);
        }
        consumed = true;
        break;
      }
    }
    if (consumed) game.lasers.splice(i, 1);
  }

  // ---- UPDATE CAPSULES ----
  const pLeft = game.paddle.x - game.paddle.w * 0.5;
  const pRight = game.paddle.x + game.paddle.w * 0.5;
  for (let i = game.capsules.length - 1; i >= 0; i--) {
    const cap = game.capsules[i];
    cap.y += cap.vy * dt;
    if (cap.y > PF_BOTTOM + 4) { game.capsules.splice(i, 1); continue; }
    if (cap.x + cap.w >= pLeft && cap.x <= pRight &&
        cap.y + cap.h >= PADDLE_Y && cap.y <= PADDLE_Y + 8) {
      const kind = cap.kind;
      game.capsules.splice(i, 1);
      applyCapsule(kind);
    }
  }

  // ---- UPDATE HAZARDS (Darts & LeChuck Voodoo Skulls) ----
  for (let i = game.hazards.length - 1; i >= 0; i--) {
    const hz = game.hazards[i];
    hz.x += hz.vx * dt;
    hz.y += hz.vy * dt;
    if (hz.x < PF_LEFT) { hz.x = PF_LEFT; hz.vx = Math.abs(hz.vx); }
    if (hz.x + hz.w > PF_RIGHT) { hz.x = PF_RIGHT - hz.w; hz.vx = -Math.abs(hz.vx); }
    if (hz.y > PF_BOTTOM + 4) { game.hazards.splice(i, 1); continue; }

    // Hazard vs Paddle
    if (hz.x + hz.w >= pLeft + 2 && hz.x <= pRight - 2 &&
        hz.y + hz.h >= PADDLE_Y + 1 && hz.y <= PADDLE_Y + 7) {
      game.hazards.splice(i, 1);
      if (game.cutlassTimer > 0) {
        // Golden Cutlass parries projectiles!
        OPL2.sfx("sword");
        addScore(150, game.paddle.x, PADDLE_Y - 8, C_BYELLOW, "PARRY +150!");
      } else if (game.paddle.mode === "EXPAND") {
        // Rubber chicken absorbs one hit and shrinks back to standard Vaus!
        game.paddle.mode = "STD";
        game.paddle.w = 34;
        game.paddle.invuln = 1.0;
        OPL2.sfx("armor");
        triggerShake(2, 0.15, 6, C_BYELLOW);
        spawnPopup(game.paddle.x, PADDLE_Y - 10, "SHRUNK!", C_BRED);
      } else {
        loseLife();
        return;
      }
    }
  }

  // ---- SUB-STEPPED CORNER-SAFE BALL PHYSICS ----
  const targetSpd = getBaseBallSpeed();
  for (let bi = game.balls.length - 1; bi >= 0; bi--) {
    const b = game.balls[bi];
    if (b.stuck) {
      b.x = game.paddle.x + b.stuckOff;
      b.y = PADDLE_Y - 3;
      b.holdTime += dt;
      if (b.holdTime > 4.5) {
        b.stuck = false;
        b.holdTime = 0;
        b.vx = 42;
        b.vy = -targetSpd;
      }
      continue;
    }

    // World 4 Orbital Gravity Well pull
    if (game.worldIdx === 3) {
      for (const gw of game.gravityWells) {
        const dx = gw.cx - b.x;
        const dy = gw.cy - b.y;
        const dist = Math.max(14, Math.hypot(dx, dy));
        if (dist < 76) {
          const pull = (5800 / (dist * dist)) * dt;
          b.vx += (dx / dist) * pull * 18;
          b.vy += (dy / dist) * pull * 18;
        }
      }
    }

    // Anti-stall safeguard: prevent infinite bounces in steel corridors
    b.stallTime = (b.stallTime || 0) + dt;
    if (b.stallTime > 10.0) {
      b.stallTime = 0;
      b.vy += (b.vy >= 0 ? 18 : -18);
      b.vx += (Math.random() - 0.5) * 24;
    }

    normalizeBallVelocity(b, targetSpd);
    const stepDist = targetSpd * dt;
    const steps = Math.max(1, Math.ceil(stepDist / 1.4));
    const subDt = dt / steps;

    let dropped = false;
    for (let s = 0; s < steps; s++) {
      b.x += b.vx * subDt;
      b.y += b.vy * subDt;

      // Playfield inner border pipes
      if (b.x - b.r < PF_LEFT) {
        b.x = PF_LEFT + b.r;
        b.vx = Math.abs(b.vx);
        OPL2.sfx("wall");
      } else if (b.x + b.r > PF_RIGHT) {
        b.x = PF_RIGHT - b.r;
        b.vx = -Math.abs(b.vx);
        OPL2.sfx("wall");
      }
      if (b.y - b.r < PF_TOP) {
        b.y = PF_TOP + b.r;
        b.vy = Math.abs(b.vy);
        OPL2.sfx("wall");
      }
      if (b.y - b.r > PF_BOTTOM + 4) {
        dropped = true;
        break;
      }

      // Ball vs Paddle
      if (b.vy > 0 && b.y + b.r >= PADDLE_Y && b.y - b.r <= PADDLE_Y + 6 &&
          b.x + b.r >= pLeft && b.x - b.r <= pRight) {
        const rel = Math.max(-1, Math.min(1, (b.x - game.paddle.x) / (game.paddle.w * 0.5)));
        const maxAngle = 66 * (Math.PI / 180);
        const ang = rel * maxAngle;
        b.vx = Math.sin(ang) * targetSpd;
        b.vy = -Math.cos(ang) * targetSpd;
        b.y = PADDLE_Y - b.r - 0.1;
        game.combo = 0;
        OPL2.sfx("paddle");

        // Compass Catch Power-Up ('C')
        if (game.paddle.mode === "CATCH") {
          b.stuck = true;
          b.stuckOff = b.x - game.paddle.x;
          b.holdTime = 0;
        }

        // World 1: Insult Sword-Fighting Duel Parry Progression!
        if (game.worldIdx === 0 && game.cutlassTimer <= 0) {
          game.duelPips++;
          const pair = INSULT_PAIRS[game.levelIdx % INSULT_PAIRS.length];
          if (game.duelPips === 1 || game.duelPips === 2) {
            game.insultBanner = pair[0];
            game.insultColor = C_BRED;
            game.insultBannerTimer = 2.6;
          } else if (game.duelPips >= 3) {
            game.duelPips = 0;
            game.cutlassTimer = 7.5;
            game.insultBanner = pair[1];
            game.insultColor = C_BGREEN;
            game.insultBannerTimer = 3.2;
            OPL2.sfx("sword");
            triggerShake(2, 0.14, 7, C_BYELLOW);
            spawnPopup(game.paddle.x, PADDLE_Y - 14, "CUTLASS PIERCE!", C_BYELLOW);
          }
        }
        break;
      }

      // Ball vs Sam & Max Moving Highway Road Walls (World 6)
      if (game.worldIdx === 5) {
        for (const rw of game.roadWalls) {
          const hitRw = collideCircleAABB(b.x, b.y, b.r, rw.x, rw.y, rw.w, rw.h);
          if (hitRw) {
            b.x += hitRw.nx * (hitRw.pen + 0.05);
            b.y += hitRw.ny * (hitRw.pen + 0.05);
            const dot = b.vx * hitRw.nx + b.vy * hitRw.ny;
            if (dot < 0) {
              b.vx -= 2 * dot * hitRw.nx;
              b.vy -= 2 * dot * hitRw.ny;
            }
            OPL2.sfx("steel");
            spawnDebris(b.x, b.y, C_ORANGE, 3, 0.6);
            break;
          }
        }
      }

      // Ball vs Ghost Pirate LeChuck Boss (Level 33)
      if (game.boss.active && game.boss.hp > 0 && game.boss.flash <= 0.04) {
        const hitBoss = collideCircleAABB(
          b.x, b.y, b.r,
          game.boss.x - 19, game.boss.y - 13, 38, 26
        );
        if (hitBoss) {
          b.x += hitBoss.nx * (hitBoss.pen + 0.3);
          b.y += hitBoss.ny * (hitBoss.pen + 0.3);
          const dot = b.vx * hitBoss.nx + b.vy * hitBoss.ny;
          if (dot < 0) {
            b.vx -= 2 * dot * hitBoss.nx;
            b.vy -= 2 * dot * hitBoss.ny;
          }
          damageBoss(game.cutlassTimer > 0 ? 3 : 2, b.x, b.y);
          break;
        }
      }

      // Seam-safe Ball vs Bricks: find closest overlapping tangible brick first
      let bestBrick = null;
      let bestHit = null;
      for (let k = 0; k < game.bricks.length; k++) {
        const br = game.bricks[k];
        if (!isBrickTangible(br)) continue;
        // Fast bounding reject
        if (b.x + b.r < br.x || b.x - b.r > br.x + br.w ||
            b.y + b.r < br.y || b.y - b.r > br.y + br.h) continue;
        const hit = collideCircleAABB(b.x, b.y, b.r, br.x, br.y, br.w, br.h);
        if (hit && (!bestHit || hit.distSq < bestHit.distSq)) {
          bestHit = hit;
          bestBrick = br;
        }
      }

      if (bestBrick && bestHit) {
        const canPierce = game.cutlassTimer > 0 && bestBrick.type !== "steel";
        if (!canPierce) {
          b.x += bestHit.nx * (bestHit.pen + 0.05);
          b.y += bestHit.ny * (bestHit.pen + 0.05);
          const dot = b.vx * bestHit.nx + b.vy * bestHit.ny;
          if (dot < 0) {
            b.vx -= 2 * dot * bestHit.nx;
            b.vy -= 2 * dot * bestHit.ny;
          }
          normalizeBallVelocity(b, targetSpd);
        } else {
          OPL2.sfx("sword");
        }

        if (bestBrick.type === "steel") {
          OPL2.sfx("steel");
          spawnDebris(b.x, b.y, C_LGRAY, 3, 0.5);
        } else {
          b.stallTime = 0;
          damageBrick(bestBrick, canPierce ? 2 : 1, false);
        }
      }
    }

    if (dropped) {
      game.balls.splice(bi, 1);
    }
  }

  // Check if all balls fell off bottom
  if (game.balls.length === 0 && game.state === STATE_PLAYING) {
    loseLife();
    return;
  }

  // Check Stage Clear condition (on Level 33, LeChuck must be banished; on 1-32, all non-steel bricks cleared)
  if (game.state === STATE_PLAYING && !game.boss.active && game.destructibleCount <= 0) {
    OPL2.sfx("clear");
    addScore(1000, 128, 96, C_BGREEN, "STAGE CLEAR +1000!");
    triggerShake(2, 0.2, 8, C_BYELLOW);
    game.state = STATE_CLEAR;
    game.stateTimer = 1.65;
  }
}

// ============================================================================
// 10. PURE EGA PIXEL-PERFECT RENDERER (320x200)
// ============================================================================
function drawParallaxWorld(worldIdx) {
  const wb = WORLD_BACKDROPS[worldIdx] || WORLD_BACKDROPS[0];
  // Compute parallax horizontal offsets from paddle X + subtle ambient drift
  const pan = game.paddle.x - 128;
  const drift = game.state === STATE_TITLE ? game.animTick * 8 : 0;

  const drawLayer = (img, factor) => {
    const rawOff = ((pan * factor + drift * factor) % BG_W + BG_W) % BG_W;
    const ox = Math.round(rawOff);
    // Clip to inner playfield [8..248, 8..200]
    ctx.drawImage(img, PF_LEFT - ox, PF_TOP);
    if (PF_LEFT - ox + BG_W < PF_RIGHT) {
      ctx.drawImage(img, PF_LEFT - ox + BG_W, PF_TOP);
    }
  };

  ctx.save();
  ctx.beginPath();
  ctx.rect(PF_LEFT, PF_TOP, 240, 192);
  ctx.clip();

  drawLayer(wb.far, 0.14);
  // Twinkling 4-shade EGA stars on top of far sky!
  const starRegCycle = [C_DGRAY, C_LGRAY, C_BCYAN, C_WHITE];
  const tickPhase = (game.animTick * 6) | 0;
  const farOff = Math.round((((pan * 0.14 + drift * 0.14) % BG_W) + BG_W) % BG_W);
  for (let i = 0; i < wb.stars.length; i++) {
    const st = wb.stars[i];
    const sx = PF_LEFT + ((st.x - farOff + BG_W) % BG_W);
    if (sx >= PF_LEFT && sx < PF_RIGHT) {
      ctx.fillStyle = EGA[starRegCycle[(st.phase + tickPhase) & 3]];
      ctx.fillRect(sx | 0, (PF_TOP + st.y) | 0, 1, 1);
    }
  }

  drawLayer(wb.mid, 0.32);
  drawLayer(wb.near, 0.56);
  ctx.restore();
}

function drawBricks() {
  const grogFrame = ((game.animTick * 7) | 0) % 3;
  const loomFrame = ((game.animTick * 4) | 0) & 1;
  const steelCycle = ((game.animTick * 5) | 0) % 24;

  for (let i = 0; i < game.bricks.length; i++) {
    const b = game.bricks[i];
    if (!b.alive) continue;
    let spr = null;
    if (b.type === "steel") {
      const glintIdx = ((b.col + b.row + steelCycle) % 24);
      spr = glintIdx === 0 ? STEEL_SPRITES[1] : (glintIdx === 1 ? STEEL_SPRITES[2] : STEEL_SPRITES[0]);
    } else if (b.type === "grog") {
      spr = GROG_SPRITES[(grogFrame + b.col) % 3];
    } else if (b.type === "idol") {
      spr = game.idolWarn ? IDOL_SPRITES.warn : (b.hp < b.maxHp ? IDOL_SPRITES.crack : IDOL_SPRITES.idle);
    } else if (b.type === "loom") {
      spr = LOOM_BRICK_SPRITES[(loomFrame + b.col) & 1];
    } else if (b.type === "tempo") {
      const solid = isBrickTangible(b);
      spr = TEMPO_SPRITES[b.ch + (solid ? "_solid" : "_ghost")];
    } else if (b.type === "armor") {
      spr = BRICK_SPRITES[b.hp < b.maxHp ? (b.ch + "_CRACK") : b.ch];
    } else {
      spr = BRICK_SPRITES[b.ch];
    }
    if (spr) ctx.drawImage(spr, b.x | 0, b.y | 0);
  }
}

function drawWorldEntities() {
  // World 4 Orbital Gravity Wells
  if (game.worldIdx === 3) {
    const gf = ((game.animTick * 9) | 0) % 3;
    for (const gw of game.gravityWells) {
      ctx.drawImage(GRAVITY_ORB_FRAMES[gf], (gw.cx - 6) | 0, (gw.cy - 6) | 0);
    }
  }

  // World 6 Sam & Max Highway Road Barricades
  if (game.worldIdx === 5) {
    for (const rw of game.roadWalls) {
      ctx.drawImage(HIGHWAY_BARRICADE_SPRITE, rw.x | 0, rw.y | 0);
    }
  }

  // Level 33 Animated Ghost Pirate LeChuck Boss!
  if (game.boss.active && game.boss.hp > 0) {
    const bf = ((game.animTick * 8) | 0) % 3;
    const spr = game.boss.flash > 0 ? LECHUCK_FLASH : LECHUCK_FRAMES[bf];
    ctx.drawImage(spr, (game.boss.x - 22) | 0, (game.boss.y - 16) | 0);
  }

  // Power-Up Capsules (18x9)
  const capShimmer = ((game.animTick * 6) | 0) & 1;
  for (const cap of game.capsules) {
    const pair = CAPSULE_SPRITES[cap.kind];
    if (pair) ctx.drawImage(pair[capShimmer], cap.x | 0, cap.y | 0);
  }

  // Lasers
  for (const lz of game.lasers) {
    ctx.drawImage(LASER_BOLT_SPRITE, lz.x | 0, lz.y | 0);
  }

  // Hazards (Atlantean Poison Darts & LeChuck Voodoo Skulls)
  const skullFrame = ((game.animTick * 8) | 0) & 1;
  for (const hz of game.hazards) {
    if (hz.kind === "skull") {
      ctx.drawImage(VOODOO_SKULL_FRAMES[skullFrame], (hz.x - 1) | 0, hz.y | 0);
    } else {
      ctx.drawImage(ATLANTEAN_DART_SPRITE, hz.x | 0, hz.y | 0);
    }
  }
}

function drawPaddleAndBalls() {
  if (game.state === STATE_TITLE) return;

  // Blink paddle cleanly during post-respawn invulnerability
  if (game.paddle.invuln <= 0 || (((game.animTick * 16) | 0) & 1) === 0) {
    let pSpr = PADDLE_STD;
    let yOff = 0;
    if (game.paddle.mode === "LASER") { pSpr = PADDLE_LASER; yOff = -2; }
    else if (game.paddle.mode === "EXPAND") { pSpr = PADDLE_CHICKEN; yOff = -1; }
    else if (game.paddle.mode === "CATCH") { pSpr = PADDLE_COMPASS; yOff = -2; }
    ctx.drawImage(pSpr, Math.round(game.paddle.x - pSpr.width * 0.5), PADDLE_Y + yOff);
  }

  // Balls (or spinning 9x9 Golden Cutlass during Insult-Duel Pierce Mode!)
  const cutlassFrame = ((game.animTick * 18) | 0) & 3;
  for (const b of game.balls) {
    if (game.cutlassTimer > 0) {
      ctx.drawImage(CUTLASS_FRAMES[cutlassFrame], Math.round(b.x - 4), Math.round(b.y - 4));
    } else {
      const bSpr = b.swan ? BALL_SWAN : (game.worldIdx === 1 && game.chronoEra !== 1 ? BALL_CHRONO : BALL_STEEL);
      ctx.drawImage(bSpr, Math.round(b.x - 2), Math.round(b.y - 2));
    }
  }
}

function drawEffectsAndBanners() {
  // EGA Debris Particles (pure crisp integer pixel blocks)
  for (const p of game.particles) {
    const px = p.x | 0;
    const py = p.y | 0;
    if (px >= PF_LEFT && px < PF_RIGHT && py >= PF_TOP && py < PF_BOTTOM) {
      ctx.fillStyle = EGA[C_BLACK];
      ctx.fillRect(px, py + 1, p.size, p.size);
      ctx.fillStyle = EGA[p.reg];
      ctx.fillRect(px, py, p.size, p.size);
    }
  }

  // Outlined Floating Score Popups (+150, PARRY!, 1UP!)
  for (const pp of game.popups) {
    const cx = Math.max(PF_LEFT + 14, Math.min(PF_RIGHT - 14, pp.x | 0));
    const cy = Math.max(PF_TOP + 4, pp.y | 0);
    drawTextCentered(ctx, pp.text, cx, cy, pp.reg, 1, false);
  }

  // World 1 Insult Sword-Fighting Duel Pixel Scroll Banner (auto-wrapped to fit playfield!)
  if (game.insultBannerTimer > 0 && game.insultBanner) {
    const twoLines = measureTextPx(game.insultBanner, 1) > 220;
    const bh = twoLines ? 20 : 11;
    const by = twoLines ? 159 : 168;
    dither(ctx, 12, by, 232, bh, C_BLACK, C_NAVY, 12);
    ctx.fillStyle = EGA[C_GOLD];
    ctx.fillRect(12, by, 232, 1);
    ctx.fillRect(12, by + bh - 1, 232, 1);
    drawWrappedCentered(ctx, game.insultBanner, 128, by + 2, 220, 9, game.insultColor);
  }

  // Pure EGA Scanline / 4x4 Bayer Stipple Flash (ZERO non-EGA alpha blending!)
  if (game.flashLevel >= 1) {
    const lvl = Math.min(12, game.flashLevel | 0);
    ctx.fillStyle = EGA[game.flashReg];
    for (let y = PF_TOP; y < PF_BOTTOM; y += 2) {
      const rowOff = (y & 3) * 4;
      for (let x = PF_LEFT; x < PF_RIGHT; x++) {
        if (BAYER4[rowOff + (x & 3)] < lvl) ctx.fillRect(x, y, 1, 1);
      }
    }
  }
}

// ============================================================================
// RIGHT-HAND 64x200 BAYER-DITHERED SCUMM HUD SIDEBAR (x = 256..319)
// ============================================================================
function pad7(n) {
  const s = String(Math.max(0, n | 0));
  return s.length >= 7 ? s : "0".repeat(7 - s.length) + s;
}

function pad2(n) {
  return n < 10 ? "0" + n : String(n);
}

function drawHUD() {
  const hx = 256;
  ctx.drawImage(HUD_BG_CANVAS, hx, 0);
  ctx.drawImage(HUD_LOGO_SPRITE, hx + 4, 3);

  // HI-SCORE (y = 20..38)
  drawTextCentered(ctx, "HI-SCORE", hx + 32, 20, C_GOLD, 1, false);
  drawTextCentered(ctx, pad7(game.hiScore), hx + 32, 30, C_WHITE, 1, false);

  // 1UP SCORE (y = 44..62)
  drawTextCentered(ctx, "1UP SCORE", hx + 32, 44, C_BCYAN, 1, false);
  const scoreCol = (game.score > 0 && game.score >= game.hiScore) ? C_BYELLOW : C_WHITE;
  drawTextCentered(ctx, pad7(game.score), hx + 32, 54, scoreCol, 1, false);

  // STAGE XX/33 & WORLD NAME (y = 68..88)
  const shownLvl = (game.state === STATE_TITLE ? game.selectedLevel : game.levelIdx) + 1;
  drawTextCentered(ctx, "STG " + pad2(shownLvl) + "/33", hx + 32, 69, C_BYELLOW, 1, false);
  const wbName = (WORLD_BACKDROPS[game.worldIdx] || WORLD_BACKDROPS[0]).name;
  drawTextCentered(ctx, wbName, hx + 32, 79, C_BGREEN, 1, false);

  // MINI-PADDLE LIVES (y = 94..107)
  drawTextPx(ctx, "P:", hx + 6, 97, C_GOLD, 1, false);
  const maxIcons = Math.min(3, game.lives);
  for (let i = 0; i < maxIcons; i++) {
    ctx.drawImage(PADDLE_MINI, hx + 17 + i * 14, 99);
  }
  if (game.lives > 3) {
    drawTextPx(ctx, "+" + (game.lives - 3), hx + 46, 97, C_BYELLOW, 1, false);
  }

  // ACTIVE WORLD MECHANIC UI / METER (y = 113..147)
  const mx = hx + 6;
  if (game.worldIdx === 0) {
    drawTextCentered(ctx, "DUEL MODE", hx + 32, 114, C_GOLD, 1, false);
    if (game.cutlassTimer > 0) {
      drawTextCentered(ctx, "CUTLASS!", hx + 32, 124, C_BYELLOW, 1, false);
      const bw = Math.round((game.cutlassTimer / 7.5) * 48);
      dither(ctx, mx + 2, 136, bw, 6, C_GOLD, C_BYELLOW, 10);
    } else {
      for (let p = 0; p < 3; p++) {
        const lit = p < game.duelPips;
        dither(ctx, mx + 3 + p * 16, 127, 13, 12, C_BLACK, lit ? C_BGREEN : C_DGRAY, lit ? 14 : 5);
      }
    }
  } else if (game.worldIdx === 1) {
    drawTextCentered(ctx, "ERA PHASE", hx + 32, 114, C_BCYAN, 1, false);
    const eraNames = ["1789 PAST", "1993 NOW", "2193 FUTR"];
    const eraCols  = [C_BCYAN, C_BYELLOW, C_BMAG];
    drawTextCentered(ctx, eraNames[game.chronoEra], hx + 32, 125, eraCols[game.chronoEra], 1, false);
    const bw = Math.round((game.chronoTimer / 6.0) * 48);
    dither(ctx, mx + 2, 137, bw, 5, C_BLUE, eraCols[game.chronoEra], 12);
  } else if (game.worldIdx === 2) {
    drawTextCentered(ctx, "DART TRAP", hx + 32, 114, C_ORANGE, 1, false);
    const idolsLeft = game.bricks.filter((b) => b.alive && b.type === "idol").length;
    drawTextCentered(ctx, "IDOLS:" + idolsLeft, hx + 32, 125, game.idolWarn ? C_BRED : C_BYELLOW, 1, false);
    const bw = Math.round((1 - Math.max(0, game.idolShotTimer) / 3.2) * 48);
    dither(ctx, mx + 2, 137, bw, 5, C_RED, C_BYELLOW, 11);
  } else if (game.worldIdx === 3) {
    drawTextCentered(ctx, "GRAV WELL", hx + 32, 114, C_VIOLET, 1, false);
    dither(ctx, mx + 4, 124, 44, 20, C_BLACK, C_INDIGO, 6);
    for (const gw of game.gravityWells) {
      const rx = mx + 4 + Math.round(((gw.cx - PF_LEFT) / 240) * 42);
      const ry = 124 + Math.round(((gw.cy - PF_TOP) / 192) * 18);
      ctx.fillStyle = EGA[C_BCYAN];
      ctx.fillRect(rx - 1, ry - 1, 3, 3);
    }
  } else if (game.worldIdx === 4) {
    drawTextCentered(ctx, "DISTAFF", hx + 32, 114, C_BMAG, 1, false);
    for (let n = 0; n < 4; n++) {
      const col = game.loomNotes[n];
      dither(ctx, mx + 3 + n * 12, 127, 10, 14, C_BLACK, col !== undefined ? col : C_DGRAY, col !== undefined ? 14 : 4);
      if (col !== undefined) drawTextPx(ctx, "♪", mx + 5 + n * 12, 130, C_WHITE, 1, false);
    }
  } else if (game.worldIdx === 5) {
    drawTextCentered(ctx, "SAM & MAX", hx + 32, 114, C_ORANGE, 1, false);
    drawTextCentered(ctx, "PATROL X2", hx + 32, 125, C_BYELLOW, 1, false);
    for (let r = 0; r < game.roadWalls.length; r++) {
      const lx = mx + 3 + Math.round(((game.roadWalls[r].x - PF_LEFT) / 220) * 40);
      ctx.fillStyle = EGA[C_ORANGE];
      ctx.fillRect(lx, 136 + r * 5, 8, 3);
    }
  } else {
    drawTextCentered(ctx, "LECHUCK", hx + 32, 114, C_BGREEN, 1, false);
    drawTextCentered(ctx, game.boss.hp + "/" + game.boss.maxHp, hx + 32, 125, C_BYELLOW, 1, false);
    const bw = Math.round((game.boss.hp / game.boss.maxHp) * 48);
    dither(ctx, mx + 2, 137, bw, 6, C_RED, C_BGREEN, 12);
  }

  // ACTIVE CAPSULE SLOTS (L, E, C, S, P at y = 153..172)
  const slots = [
    ["L", game.paddle.mode === "LASER", C_BRED],
    ["E", game.paddle.mode === "EXPAND", C_AZURE],
    ["C", game.paddle.mode === "CATCH", C_BGREEN],
    ["S", game.slowTimer > 0, C_BMAG],
    ["P", game.doubleScoreTimer > 0 || game.cutlassTimer > 0, C_BYELLOW]
  ];
  for (let i = 0; i < slots.length; i++) {
    const [lbl, active, col] = slots[i];
    const sx = hx + 5 + i * 11;
    dither(ctx, sx, 154, 10, 17, C_BLACK, active ? col : C_DGRAY, active ? 13 : 3);
    drawTextPx(ctx, lbl, sx + 3, 159, active ? C_WHITE : C_LGRAY, 1, false);
  }

  // SCROLLING ADLIB SONG MARQUEE + 4-CHANNEL OPL2 VU METER (y = 176..196)
  const trTitle = "♪ " + TRACKS[OPL2.trackIdx].title + (OPL2.muted ? " [MUTED] " : " • ADLIB OPL2 FM ") + "   ";
  const mWidth = measureTextPx(trTitle, 1);
  const scrollX = Math.round(game.marqueePx) % Math.max(1, mWidth);

  ctx.save();
  ctx.beginPath();
  ctx.rect(hx + 5, 177, 54, 10);
  ctx.clip();
  drawTextPx(ctx, trTitle, hx + 5 - scrollX, 178, OPL2.muted ? C_LGRAY : C_BGREEN, 1, false);
  drawTextPx(ctx, trTitle, hx + 5 - scrollX + mWidth, 178, OPL2.muted ? C_LGRAY : C_BGREEN, 1, false);
  ctx.restore();

  // Mini 4-voice OPL2 FM Channel Visualizer bars at y = 189..194
  for (let ch = 0; ch < 4; ch++) {
    const vw = Math.round(OPL2.vu[ch] * 11);
    const vx = hx + 6 + ch * 13;
    ctx.fillStyle = EGA[C_DGRAY];
    ctx.fillRect(vx, 190, 11, 4);
    if (vw > 0 && !OPL2.muted) {
      ctx.fillStyle = EGA[ch === 0 ? C_BYELLOW : (ch === 3 ? C_BRED : C_BGREEN)];
      ctx.fillRect(vx, 190, vw, 4);
    }
  }
}

// ============================================================================
// OVERLAYS: LIVE ATTRACT TITLE SCREEN, PAUSE, STAGE INTRO, GAME OVER & VICTORY
// ============================================================================
function drawBannerBox(x, y, w, h, borderReg, regA, regB) {
  x |= 0; y |= 0; w |= 0; h |= 0;
  ctx.fillStyle = EGA[C_BLACK];
  ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  dither(ctx, x, y, w, h, regA, regB, 7);
  ctx.fillStyle = EGA[borderReg];
  ctx.fillRect(x, y, w, 1);
  ctx.fillRect(x, y + h - 1, w, 1);
  ctx.fillRect(x, y, 1, h);
  ctx.fillRect(x + w - 1, y, 1, h);
}

function drawOverlays() {
  const def = LEVEL_DEFS[game.levelIdx];

  if (game.state === STATE_TITLE) {
    // Docked cleanly at y = 115..194 so 100% of the live backdrop, 30x16 mosaic & LeChuck are unobstructed!
    drawBannerBox(14, 115, 228, 79, C_GOLD, C_BLACK, C_INDIGO);
    drawTextCentered(ctx, "SCUMM-VAUS", 128, 119, C_BYELLOW, 2, true);
    drawTextCentered(ctx, "1990 LUCASARTS EGA ANTHOLOGY", 128, 137, C_BCYAN, 1, false);

    dither(ctx, 18, 147, 220, 23, C_BLACK, C_DARKRED, 8);
    const stgLabel = "◄ STAGE " + pad2(game.selectedLevel + 1) + "/33 ►";
    drawTextCentered(ctx, stgLabel, 128, 149, C_BGREEN, 1, false);
    drawTextCentered(ctx, def.title, 128, 160, C_WHITE, 1, false);
    drawTextCentered(ctx, "◄/► PREVIEW 1-33 • L/E/C/S/P CAPSULES", 128, 173, C_TAN, 1, false);

    if ((((game.animTick * 3) | 0) & 1) === 0) {
      drawTextCentered(ctx, "PRESS SPACE OR CLICK TO LAUNCH!", 128, 184, C_BYELLOW, 1, false);
    }
  } else if (game.state === STATE_READY) {
    drawBannerBox(18, 126, 220, 32, C_GOLD, C_BLACK, C_NAVY);
    drawTextCentered(ctx, "STG " + pad2(game.levelIdx + 1) + ": " + def.title, 128, 131, C_BYELLOW, 1, false);
    drawTextCentered(ctx, "GET READY, GUYBRUSH!", 128, 144, C_BCYAN, 1, false);
  } else if (game.state === STATE_PAUSED) {
    drawBannerBox(58, 82, 140, 36, C_BCYAN, C_BLACK, C_NAVY);
    drawTextCentered(ctx, "PAUSED", 128, 88, C_BYELLOW, 2, true);
    drawTextCentered(ctx, "PRESS P TO RESUME", 128, 107, C_WHITE, 1, false);
  } else if (game.state === STATE_CLEAR) {
    drawBannerBox(32, 80, 192, 38, C_BGREEN, C_BLACK, C_DTEAL);
    drawTextCentered(ctx, "STAGE CLEAR!", 128, 86, C_BGREEN, 2, true);
    drawTextCentered(ctx, "ENTERING NEXT CHAPTER...", 128, 106, C_BYELLOW, 1, false);
  } else if (game.state === STATE_OVER) {
    drawBannerBox(30, 72, 196, 54, C_BRED, C_BLACK, C_DARKRED);
    drawTextCentered(ctx, "GAME OVER", 128, 78, C_BRED, 2, true);
    drawTextCentered(ctx, "FINAL SCORE: " + pad7(game.score), 128, 99, C_WHITE, 1, false);
    drawTextCentered(ctx, "SPACE / CLICK FOR TITLE", 128, 112, C_BYELLOW, 1, false);
  } else if (game.state === STATE_VICTORY) {
    drawBannerBox(16, 48, 224, 96, C_GOLD, C_BLACK, C_INDIGO);
    drawTextCentered(ctx, "VICTORY!", 128, 54, C_BYELLOW, 3, true);
    drawTextCentered(ctx, "LECHUCK IS VAPORIZED IN", 128, 84, C_BGREEN, 1, false);
    drawTextCentered(ctx, "FIZZING VOODOO ROOT BEER!", 128, 95, C_BCYAN, 1, false);
    drawTextCentered(ctx, "ALL 33 EGA STAGES CONQUERED!", 128, 109, C_WHITE, 1, false);
    drawTextCentered(ctx, "FINAL SCORE: " + pad7(game.score), 128, 121, C_BYELLOW, 1, false);
    if ((((game.animTick * 3) | 0) & 1) === 0) {
      drawTextCentered(ctx, "CLICK OR SPACE TO CELEBRATE", 128, 133, C_BMAG, 1, false);
    }
  }
}

function render() {
  ctx.fillStyle = EGA[C_BLACK];
  ctx.fillRect(0, 0, 320, 200);

  // Integer pixel screen-shake offset on playfield
  let sx = 0, sy = 0;
  if (game.shakeTime > 0) {
    sx = Math.round((Math.random() * 2 - 1) * game.shakeMag);
    sy = Math.round((Math.random() * 2 - 1) * game.shakeMag);
  }

  ctx.save();
  ctx.translate(sx | 0, sy | 0);
  drawParallaxWorld(game.worldIdx);
  drawBricks();
  drawWorldEntities();
  drawPaddleAndBalls();
  drawEffectsAndBanners();
  ctx.drawImage(BORDER_CANVAS, 0, 0);
  drawOverlays();
  ctx.restore();

  drawHUD();
}

// ============================================================================
// 11. INPUT CONTROLS, RESPONSIVE INTEGER SCALING & MAIN RAF LOOP
// ============================================================================
function fitCabinetScale() {
  const maxW = Math.max(320, window.innerWidth - 56);
  const maxH = Math.max(200, window.innerHeight - 92);
  const scale = Math.max(1, Math.min(Math.floor(maxW / 320), Math.floor(maxH / 200)));
  canvas.style.width = (320 * scale) + "px";
  canvas.style.height = (200 * scale) + "px";
}
window.addEventListener("resize", fitCabinetScale);
fitCabinetScale();

function previewDelta(delta) {
  OPL2.init();
  game.selectedLevel = ((game.selectedLevel + delta) % LEVEL_DEFS.length + LEVEL_DEFS.length) % LEVEL_DEFS.length;
  loadLevel(game.selectedLevel, true);
  OPL2.sfx("paddle");
}

function togglePause() {
  if (game.state === STATE_PLAYING || game.state === STATE_READY) {
    game.state = STATE_PAUSED;
  } else if (game.state === STATE_PAUSED) {
    game.state = STATE_PLAYING;
  }
  const btn = document.getElementById("btn-pause");
  if (btn) btn.classList.toggle("active", game.state === STATE_PAUSED);
}

canvas.addEventListener("mousemove", (ev) => {
  const rect = canvas.getBoundingClientRect();
  if (!rect.width) return;
  const logicalX = ((ev.clientX - rect.left) / rect.width) * 320;
  game.paddle.x = logicalX;
  clampPaddle();
});

canvas.addEventListener("mousedown", (ev) => {
  if (ev.button !== 0) return;
  OPL2.init();
  if (game.state === STATE_TITLE) {
    const rect = canvas.getBoundingClientRect();
    const lx = ((ev.clientX - rect.left) / rect.width) * 320;
    const ly = ((ev.clientY - rect.top) / rect.height) * 200;
    // Allow clicking left/right stage selector arrows on Title Banner!
    if (ly >= 145 && ly <= 170 && lx >= 16 && lx <= 104) {
      previewDelta(-1);
      return;
    }
    if (ly >= 145 && ly <= 170 && lx >= 152 && lx <= 242) {
      previewDelta(1);
      return;
    }
  }
  launchOrFire();
});

window.addEventListener("keydown", (ev) => {
  const k = ev.key;
  if (k === "ArrowLeft" || k === "a" || k === "A") {
    keys.left = true;
    if (game.state === STATE_TITLE) previewDelta(-1);
    ev.preventDefault();
  } else if (k === "ArrowRight" || k === "d" || k === "D") {
    keys.right = true;
    if (game.state === STATE_TITLE) previewDelta(1);
    ev.preventDefault();
  } else if (k === " " || k === "Enter") {
    keys.fire = true;
    launchOrFire();
    ev.preventDefault();
  } else if (k === "p" || k === "P") {
    togglePause();
  } else if (k === "m" || k === "M") {
    OPL2.init();
    OPL2.setMuted(!OPL2.muted);
  }
});

window.addEventListener("keyup", (ev) => {
  const k = ev.key;
  if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
  if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  if (k === " " || k === "Enter") keys.fire = false;
});

// Arcade Cabinet Bezel Microswitch Buttons
document.getElementById("btn-crt").addEventListener("click", (ev) => {
  const sl = document.getElementById("scanlines");
  const isOff = sl.classList.toggle("off");
  ev.currentTarget.textContent = isOff ? "CRT: OFF" : "CRT: ON";
  ev.currentTarget.classList.toggle("active", !isOff);
});

document.getElementById("btn-sfx").addEventListener("click", () => {
  OPL2.init();
  OPL2.setMuted(!OPL2.muted);
});

document.getElementById("btn-pause").addEventListener("click", () => {
  togglePause();
});

// Initialize Live Attract Preview on Stage 01
loadLevel(0, true);

let lastTs = performance.now();
function frame(ts) {
  const rawDt = (ts - lastTs) / 1000;
  lastTs = ts;
  const dt = Math.min(0.033, Math.max(0.001, rawDt));
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
