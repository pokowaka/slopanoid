<script>
'use strict';
/* =============================================================================
 *  ARKANOID · THE SECRET OF BRICK ISLAND
 *  A single-file LucasArts tribute: 320x200 EGA canvas, 33 mosaic levels,
 *  and an AdLib/OPL2-flavoured FM synthesizer with a look-ahead tracker.
 * ===========================================================================*/

// ============================================================ EGA PALETTE
// The 64 EGA colour registers: every channel is one of 00 / 55 / AA / FF.
const LV = ['00', '55', 'aa', 'ff'];
const E = (r, g, b) => '#' + LV[r] + LV[g] + LV[b];
const EGA64 = Array.from({ length: 64 }, (_, i) =>

  w: [3, 3, 3], r: [3, 1, 1], e: [2, 0, 0], g: [1, 3, 1], f: [0, 2, 0], b: [1, 1, 3], d: [0, 0, 2], c: [1, 3, 3], y: [3, 3, 1],

// ============================================================ PIXEL HELPERS
const W = 320, H = 200, FX0 = 8, FX1 = 232, FY0 = 8, FW = 224, BW = 16, BH = 8, COLS = 14, BY0 = 20, PADY = 184;
const screen = document.getElementById('screen');
const X = screen.getContext('2d');
X.imageSmoothingEnabled = false;
let CX = X;
function R(x, y, w, h, c) { CX.fillStyle = c; CX.fillRect(Math.floor(x), Math.floor(y), Math.round(w), Math.round(h)); }

function mk(w, h, fn) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;

function grad(x, y, w, h, cols) {
  const n = cols.length - 1;
  for (let j = 0; j < h; j++) {
    const t = j / Math.max(1, h - 1) * n, i = Math.min(n - 1, Math.floor(t)), k = Math.round((t - i) * 4);

}

function seeded(s) { return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pad7 = n => String(Math.floor(n)).padStart(7, '0');
function sprite(rows, map, sc) {
  sc = sc || 1;
  return mk(rows[0].length * sc, rows.length * sc, () => rows.forEach((r, y) => [...r].forEach((ch, x) => { if (map[ch]) R(x * sc, y * sc, sc, sc, map[ch]); })));
}

// ============================================================ BITMAP FONTS (5x7 and 3x5)
const F5SRC = {

  O: '0e11111111110e', P: '1e11111e101010', Q: '0e11111115120d', R: '1e11111e141211', S: '0f10100e01011e', T: '1f040404040404', U: '1111111111110e',
  V: '11111111110a04', W: '1111111515150a', X: '11110a040a1111', Y: '11110a04040404', Z: '1f01020408101f',
  0: '0e11131519110e', 1: '040c040404040e', 2: '0e11010204081f', 3: '1f02040201110e', 4: '02060a121f0202', 5: '1f101e0101110e', 6: '0608101e11110e',
  7: '1f010204080808', 8: '0e11110e11110e', 9: '0e11110f01020c',
  ' ': '00000000000000', '.': '00000000000c0c', ',': '000000000c0408', '!': '04040404040004', '?': '0e110102040004', ':': '000c0c000c0c00',
  '-': '0000001f000000', '+': '0004041f040400', '/': '01010204081010', "'": '04040800000000', '"': '0a0a0000000000', '(': '02040808080402',

  '#': '0a0a1f0a1f0a0a', '%': '18190204081303', '_': '0000000000001f', '$': '040f140e051e04', '[': '0e08080808080e', ']': '0e02020202020e',
  '@': '0e11171517100e', '·': '0000000c0c0000',
};
const F3SRC = {
  A: '25755', B: '65656', C: '34443', D: '65556', E: '74647', F: '74644', G: '34553', H: '55755', I: '72227', J: '11152', K: '55655', L: '44447',
  M: '57755', N: '65555', O: '25552', P: '65644', Q: '25573', R: '65655', S: '34216', T: '72222', U: '55557', V: '55552', W: '55775', X: '55255',
  Y: '55222', Z: '71247', 0: '75557', 1: '26222', 2: '61247', 3: '61216', 4: '55711', 5: '74616', 6: '34652', 7: '71222', 8: '25252', 9: '75711',
  ' ': '00000', '.': '00002', ',': '00024', '!': '22202', '?': '61202', ':': '02020', '-': '00700', "'": '22000', '"': '55000', '&': '25253',
  '/': '11244', '(': '12221', ')': '42224', '#': '57575', '*': '05250', '+': '02720', '<': '12421', '>': '42124', '=': '07070', '@': '25743',

const FONTS = { 5: { w: 5, h: 7, adv: 6, rows: {} }, 3: { w: 3, h: 5, adv: 4, rows: {} } };
for (const k in F5SRC) { const s = F5SRC[k]; const rows = []; for (let i = 0; i < 7; i++) { const v = parseInt(s.substr(i * 2, 2), 16) || 0; rows.push([16, 8, 4, 2, 1].map(m => (v & m) ? 1 : 0)); } FONTS[5].rows[k] = rows; }

const glyphCache = new Map();
function glyph(fs, ch, col) {
  const key = fs + ch + col; let g = glyphCache.get(key); if (g) return g;
  const f = FONTS[fs], rows = f.rows[ch] || f.rows['?'];
  g = mk(f.w, f.h, () => rows.forEach((r, y) => r.forEach((on, x) => { if (on) P(x, y, col); })));
  glyphCache.set(key, g); return g;
}
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
const textW = (s, o) => { o = o || {}; const f = FONTS[o.f || 5], sc = o.s || 1; return norm(s).length * f.adv * sc - sc; };
function text(s, x, y, col, o) {
  o = o || {}; const fs = o.f || 5, f = FONTS[fs], sc = o.s || 1; s = norm(s);
  if (o.c) x -= Math.floor(textW(s, o) / 2); else if (o.r) x -= textW(s, o);
  x = Math.round(x); y = Math.round(y);
  const pass = (c, dx) => { for (let i = 0; i < s.length; i++) if (s[i] !== ' ') CX.drawImage(glyph(fs, s[i], c), x + i * f.adv * sc + dx, y + dx, f.w * sc, f.h * sc); };
  if (o.sh) pass(o.sh, sc);

  const lines = []; let cur = '';
  for (const w of norm(s).split(' ')) { const t = cur ? cur + ' ' + w : w; if (cur && textW(t, o) > maxW) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;

// ============================================================ ADLIB / OPL2-STYLE SYNTHESIZER
const Snd = (() => {
  let ctx = null, comp, master, music, echoIn, distIn, sfxBus, noise, on = true, pending = null;
  const chans = []; let chanIdx = 0;
  let song = null, songName = '', step = 0, nextT = 0, timer = null, onDone = null;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const SONGS = {};

  function distCurve(k) { const c = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; c[i] = (1 + k) * x / (1 + k * Math.abs(x)); } return c; }

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC();
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.2;
    master = ctx.createGain(); master.gain.value = on ? 0.8 : 0;
    comp.connect(master); master.connect(ctx.destination);
    music = ctx.createGain(); music.gain.value = 0.5; music.connect(comp);
    // tape-style echo send (feedback delay through a low-pass)
    const dl = ctx.createDelay(1.5); dl.delayTime.value = 0.36;
    const fb = ctx.createGain(); fb.gain.value = 0.42;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    echoIn = ctx.createGain(); echoIn.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(music);
    // overdrive chain for LeChuck's guitars
    distIn = ctx.createGain();
    const ws = ctx.createWaveShaper(); ws.curve = distCurve(45); ws.oversample = '2x';
    const dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 3400;
    const dg = ctx.createGain(); dg.gain.value = 0.42;
    distIn.connect(ws); ws.connect(dlp); dlp.connect(dg); dg.connect(music);
    // SFX: 4 dedicated channels -> bit-crusher -> own bus into the master compressor
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.55; sfxBus.connect(comp);
    const crusher = ctx.createWaveShaper(); crusher.curve = crushCurve(14); crusher.connect(sfxBus);
    for (let i = 0; i < 4; i++) { const g = ctx.createGain(); g.connect(crusher); chans.push({ g, nodes: [] }); }
    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    if (pending) { const p = pending; pending = null; play(p.name, p.cb); }
  }

  // ---------------------------------------------------------------- voice building blocks
  function osc(type, f, t) { const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); return o; }
  function outNode(send, dest) {
    const g = ctx.createGain(); g.connect(dest || music);

  }
  function adsr(p, t, a, d, s, r, dur, pk) {
    p.setValueAtTime(0.0001, t); p.linearRampToValueAtTime(pk, t + a);

  function fm(t, f, dur, vel, Pt, dest) {

    c.connect(g); g.connect(out);
    const end = t + dur + Pt.r + 0.15;
    if (Pt.vib) {
      const l = osc('sine', Pt.vibF || 5.5, t), lg = ctx.createGain();

  const PATCH = {
    pan:    { ratio: 3.5, i0: 2.4, i1: 0.15, it: 0.07, a: 0.003, d: 0.55, s: 0.0, r: 0.2, vol: 0.34, send: 0.25 },       // metallic steel drum
    brass:  { ratio: 1, i0: 0.4, i1: 2.6, it: 0.06, a: 0.03, d: 0.3, s: 0.75, r: 0.12, vol: 0.22, send: 0.12 },            // biting brass
    flute:  { ct: 'triangle', ratio: 2, i0: 0.5, i1: 0.25, it: 0.1, a: 0.06, d: 0.3, s: 0.85, r: 0.15, vol: 0.3, send: 0.35, vib: 0.007, vibF: 5, vibD: 0.3 },
    reed:   { ratio: 3, i0: 1.3, i1: 0.8, it: 0.1, a: 0.04, d: 0.3, s: 0.8, r: 0.12, vol: 0.16, send: 0.3 },               // hollow clarinet
    horn:   { ratio: 1, i0: 0.3, i1: 1.4, it: 0.08, a: 0.06, d: 0.4, s: 0.8, r: 0.2, vol: 0.16, send: 0.3 },
    chime:  { ratio: 3.5, i0: 5, i1: 0.05, it: 0.35, a: 0.002, d: 2.2, s: 0, r: 1.2, vol: 0.24, send: 0.75 },
    sax:    { ratio: 1, i0: 0.9, i1: 2.0, it: 0.08, a: 0.035, d: 0.3, s: 0.8, r: 0.1, vol: 0.26, send: 0.2, bend: -1.6, bendT: 0.09, vib: 0.013, vibF: 5.6, vibD: 0.25 },

    arp:    { ct: 'square', ratio: 1, i0: 0.1, i1: 0, it: 0.1, a: 0.002, d: 0.08, s: 0.3, r: 0.04, vol: 0.05, send: 0.3 },
  };
  // mischievous square lead with a fast-wobbling modulator (Purple Tentacle)
  function sqwob(t, f, dur, vel) {
    const out = outNode(0.15), g = ctx.createGain(); adsr(g.gain, t, 0.005, 0.2, 0.7, 0.06, dur, vel * 0.09);

  function bass(t, f, dur, vel) {

    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 6;

  }
  // slow sweeping 3-saw pad drenched in echo (Atlantis)
  function pad(t, f, dur, vel) {
    const out = outNode(0.6), g = ctx.createGain(); adsr(g.gain, t, 0.9, 1.0, 0.8, 1.4, dur, vel * 0.055);

  if (sub) wrap(sub, FW - 16, { f: 3 }).forEach((l, i) => text(l, cx, y + 18 + i * 6, subCol || WHITE, { f: 3, c: 1, sh: BLACK }));
}
function drawOverlays() {
  const cx = FX0 + FW / 2, o3 = { f: 3, c: 1 };
  if (banner && G.state === 'play') bigText(banner.s, 92, banner.c, banner.sub, WHITE);
  switch (G.state) {
    case 'intro': {
      const W0 = WORLDS[G.world], hint = wrap(W0.hint, 180, { f: 3 }), nm = wrap(LEVELS[G.level].n, 180, {}), h = 58 + nm.length * 9 + hint.length * 6;
      const top = 96 - h / 2;
      panel(FX0 + 12, top, FW - 24, h, E(3, 3, 1), 3);
      text('LEVEL ' + String(G.level + 1).padStart(2, '0'), cx, top + 6, E(3, 3, 1), { s: 2, c: 1, sh: BLACK });
      text(W0.name, cx, top + 24, E(3, 2, 0), o3);
      nm.forEach((l, i) => text(l, cx, top + 33 + i * 9, WHITE, { c: 1, sh: BLACK }));
      hint.forEach((l, i) => text(l, cx, top + 38 + nm.length * 9 + i * 6, E(1, 3, 3), o3));
      if ((G.t >> 4) & 1) text('GET READY!', cx, top + h - 9, E(3, 1, 1), o3);
      break;
    }
    case 'clear': bigText('LEVEL CLEAR!', 80, E(3, 3, 1), 'BONUS ' + G.bonus, E(1, 3, 3)); break;
    case 'dying': if (G.lives <= 1) bigText('LAST PADDLE LOST', 90, E(3, 1, 1)); break;
    case 'over':
      panel(FX0 + 16, 64, FW - 32, 70, E(3, 1, 1), 3);
      bigText('GAME OVER', 72, E(3, 1, 1), 'YOU FIGHT LIKE A DAIRY FARMER.', E(3, 3, 1));
      text('SCORE ' + pad7(G.score), cx, 104, WHITE, { c: 1 });
      if (G.st > 90 && (G.t >> 4) & 1) text('PRESS SPACE', cx, 120, E(1, 3, 3), o3);
      break;
    case 'bossdie': bigText('LECHUCK FALLS!', 100, E(1, 3, 1), 'THE VOODOO FORTRESS CRUMBLES'); break;
  }
  if (G.paused) { panel(FX0 + 50, 80, FW - 100, 36, WHITE, 3); bigText('PAUSED', 88, WHITE, 'P TO RESUME  ESC FOR MENU', E(1, 3, 3)); }
}
// the ARKANOID logo, built from tiny colour-cycling EGA bricks
function drawLogo(y) {
  const s = 'ARKANOID', rows = FONTS[5].rows, x0 = 160 - (s.length * 6 * 4 - 4) / 2;
  for (let i = 0; i < s.length; i++) rows[s[i]].forEach((r, gy) => r.forEach((on, gx) => {
    if (!on) return;
    const px = x0 + (i * 6 + gx) * 4, py = y + gy * 3, c = EGA64[[60, 62, 54, 38, 58, 57, 61, 63][(i + gy + (G.t >> 3)) % 8]];
    R(px, py, 4, 3, c); R(px, py + 2, 4, 1, BLACK); R(px + 3, py, 1, 3, BLACK); P(px, py, WHITE);
  }));
}
function drawMenu() {
  X.save(); X.beginPath(); X.rect(48, 8, 224, 192); X.clip();
  drawBG(G.menuWorld, 48, Math.sin(G.t * 0.01) * 0.5, G.t);
  dith(48, 8, 224, 192, BLACK, 2);
  X.restore();
  drawFrame(48);
  R(0, 0, 40, H, BLACK); R(280, 0, 40, H, BLACK);
  drawLogo(14);
  text('THE SECRET OF BRICK ISLAND', 160, 40, E(3, 3, 1), { c: 1, sh: E(2, 0, 0) });
  const w = WORLDS[G.menuWorld], o3 = { f: 3, c: 1 };
  panel(56, 51, 208, 34, E(1, 1, 3), 3);
  text('START IN WORLD', 160, 55, E(3, 1, 1), o3);
  text('<  ' + (G.menuWorld + 1) + '  >', 160, 62, (G.t >> 3) & 1 ? WHITE : E(1, 3, 3), { c: 1 });
  text(w.name, 160, 70, E(3, 2, 0), o3);
  const a = WORLD_START[G.menuWorld] + 1, b = G.menuWorld < 6 ? WORLD_START[G.menuWorld + 1] : 33;
  text(a === b ? 'LEVEL ' + a : 'LEVELS ' + a + '-' + b, 160, 76, E(2, 2, 2), o3);
  const legend = [['L', 'SPACE-RANGER BLASTERS'], ['E', 'RUBBER CHICKEN (WIDE)'], ['C', 'MAGNETIC COMPASS (CATCH)'], ['S', 'HOURGLASS (SLOW)'], ['P', 'GOLD GUY (EXTRA PADDLE)']];
  legend.forEach(([k, s], i) => { X.drawImage(capSprite(k, (G.t >> 3) % 4), 76, 88 + i * 9); text(s, 98, 89 + i * 9, WHITE, { f: 3 }); });
  const bl = [['g', 'GROG'], ['i', 'INSULT'], ['s', 'STEEL'], ['a', 'ARMOR']];
  bl.forEach(([t, s], i) => { const k = { t, col: t === 'a' ? COL.b : t === 'g' ? [3, 2, 0] : [3, 1, 1], hp: 2, max: 3, era: 0, note: 1 }; X.drawImage(brickSprite(k), 64 + i * 50, 136); text(s, 81 + i * 50, 137, E(2, 2, 2), { f: 3 }); });
  text('HIGH SCORE ' + pad7(G.hi), 160, 150, E(3, 3, 1), { c: 1, sh: BLACK });
  if ((G.t >> 4) & 1) text('PRESS SPACE OR CLICK TO START', 160, 164, WHITE, { c: 1, sh: BLACK });
  text('MOUSE / ARROWS: MOVE    SPACE / CLICK: LAUNCH + FIRE', 160, 178, E(1, 3, 3), o3);
  text('A LUCASARTS TRIBUTE  ·  33 LEVELS  ·  7 WORLDS', 160, 188, E(1, 1, 3), o3);
}
function drawVictory() {
  X.save(); X.beginPath(); X.rect(FX0, FY0, FW, H - FY0); X.clip();
  drawBG(4, FX0, Math.sin(G.t * 0.008) * 0.5, G.t);
  for (const p of parts) P(p.x, p.y, p.c);
  X.restore();
  const cx = FX0 + FW / 2, o3 = { f: 3, c: 1 };
  panel(FX0 + 10, 28, FW - 20, 132, E(3, 3, 1), 3);
  text('VICTORY!', cx, 36, E(3, 3, 1), { s: 2, c: 1, sh: E(2, 0, 0) });
  const lines = ['LECHUCK HAS BEEN BLASTED BACK', 'TO THE UNDERWORLD, BRICK ISLAND', 'IS FREE, AND GROG FLOWS AGAIN.', '', 'YOU ARE A MIGHTY PIRATE.'];
  lines.forEach((l, i) => text(l, cx, 58 + i * 7, WHITE, o3));
  text('FINAL SCORE', cx, 100, E(3, 1, 1), o3); text(pad7(G.score), cx, 107, WHITE, { s: 1, c: 1, sh: BLACK });
  if (G.score >= G.hi) text('NEW HIGH SCORE!', cx, 118, (G.t >> 3) & 1 ? E(3, 3, 1) : E(3, 1, 1), o3);
  text('WITH THANKS TO THE MAKERS OF MONKEY ISLAND,', cx, 130, E(1, 3, 3), o3);
  text('DAY OF THE TENTACLE, FATE OF ATLANTIS, X-WING,', cx, 136, E(1, 3, 3), o3);
  text('LOOM AND SAM & MAX', cx, 142, E(1, 3, 3), o3);
  if (G.st > 240 && (G.t >> 4) & 1) text('PRESS SPACE', cx, 151, E(3, 3, 1), o3);
}
function render() {
  CX = X;
  const sx = shake > 0 ? Math.round((Math.random() - 0.5) * 3) : 0, sy = shake > 0 ? Math.round((Math.random() - 0.5) * 3) : 0;
  X.setTransform(1, 0, 0, 1, sx, sy);
  R(-4, -4, W + 8, H + 8, BLACK);
  if (G.state === 'menu') drawMenu();
  else {
    if (G.state === 'victory') drawVictory(); else drawField();
    drawFrame(FX0); drawHUD(); drawOverlays();
  }
  X.setTransform(1, 0, 0, 1, 0, 0);
}

// ============================================================ INPUT
function action() {
  switch (G.state) {
    case 'menu': sfx('select'); newGame(); break;
    case 'intro': if (G.st > 20) setState('play'); break;
    case 'play': if (G.paused) { G.paused = false; sfx('pause'); } else if (ball && ball.stuck) launch(); else fireLaser(); break;
    case 'clear': if (G.st > 60) G.st = 999; break;
    case 'over': if (G.st > 90) toMenu(); break;
    case 'victory': if (G.st > 240) toMenu(); break;
  }
}
function pickWorld(d) { G.menuWorld = (G.menuWorld + d + 7) % 7; sfx('select'); }
window.addEventListener('keydown', e => {
  Snd.init();
  const k = e.key;
  if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(k)) e.preventDefault();
  const left = k === 'ArrowLeft' || k === 'a' || k === 'A', right = k === 'ArrowRight' || k === 'd' || k === 'D';
  if (left) { input.left = true; input.useMouse = false; }
  if (right) { input.right = true; input.useMouse = false; }
  if (k === ' ') input.fire = true;
  if (e.repeat) return;
  if (G.state === 'menu') {
    if (left) pickWorld(-1); else if (right) pickWorld(1);
    else if (k >= '1' && k <= '7') { G.menuWorld = +k - 1; sfx('select'); }
  }
  if (k === ' ' || k === 'Enter') action();
  else if (k === 'm' || k === 'M') Snd.toggle();
  else if ((k === 'p' || k === 'P') && G.state === 'play') { G.paused = !G.paused; sfx('pause'); }
  else if (k === 'Escape' && G.paused) toMenu();
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
  if (k === ' ') input.fire = false;
});
function pointerX(clientX) { const r = screen.getBoundingClientRect(); return (clientX - r.left) / r.width * W; }
function pointerY(clientY) { const r = screen.getBoundingClientRect(); return (clientY - r.top) / r.height * H; }
window.addEventListener('mousemove', e => { input.mouseX = pointerX(e.clientX); input.useMouse = true; });
screen.addEventListener('mousedown', e => {
  e.preventDefault(); Snd.init(); input.mouseDown = true;
  input.mouseX = pointerX(e.clientX); input.useMouse = true;
  if (G.state === 'menu') { const y = pointerY(e.clientY), x = input.mouseX; if (y > 51 && y < 85 && (x < 130 || x > 190)) { pickWorld(x < 130 ? -1 : 1); return; } }
  action();
});
window.addEventListener('mouseup', () => { input.mouseDown = false; });
screen.addEventListener('touchstart', e => { e.preventDefault(); Snd.init(); input.mouseX = pointerX(e.touches[0].clientX); input.useMouse = true; input.mouseDown = true; action(); }, { passive: false });
screen.addEventListener('touchmove', e => { e.preventDefault(); input.mouseX = pointerX(e.touches[0].clientX); input.useMouse = true; }, { passive: false });
screen.addEventListener('touchend', () => { input.mouseDown = false; });
screen.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', () => { input.left = input.right = input.fire = input.mouseDown = false; if (G.state === 'play') G.paused = true; });

// ============================================================ MAIN LOOP (fixed 60 Hz simulation)
let lastT = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - lastT); lastT = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(frame);
}
toMenu();
requestAnimationFrame(frame);
</script>
