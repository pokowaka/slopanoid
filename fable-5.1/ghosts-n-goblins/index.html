<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghosts 'n Goblins: The Cursed PC Gaming Museum</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;padding:0;height:100%;background:#07060a;overflow:hidden;font-family:monospace;color:#cbb;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a1424 0%,#07060a 70%);}
  #bezel{position:relative;padding:0;background:#141018;border-radius:6px;box-shadow:0 0 0 2px #2a2230,0 0 40px #000 inset;}
  #bezel.crt{padding:18px 22px;border-radius:26px;background:linear-gradient(160deg,#3a3440,#1a1620 50%,#0e0c12);box-shadow:0 0 0 3px #4a4252,0 0 60px #000,0 30px 60px #000;}
  #screen{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;}
  #bezel.crt #screen{border-radius:14px;box-shadow:0 0 30px rgba(120,160,255,.15) inset;}
  #bezel.crt::after{content:"";position:absolute;left:22px;right:22px;top:18px;bottom:18px;border-radius:14px;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0px,rgba(0,0,0,.28) 1px,rgba(0,0,0,0) 2px,rgba(0,0,0,0) 3px),
    radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%);
    mix-blend-mode:multiply;}
  #bezel.crt::before{content:"CAPCOM MUSEUM MONITOR  -  CPS-1 / VGA 320x200";position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:2px;color:#6a6072;}
  #help{position:fixed;left:8px;bottom:6px;font-size:11px;color:#6a6272;line-height:1.5;user-select:none;}
  #help b{color:#a89cb0}
  #help span{margin-right:12px}
</style>
</head>
<body>
<div id="wrap"><div id="bezel"><canvas id="screen" width="320" height="200"></canvas></div></div>
<div id="help">
  <span><b>A/D</b> move</span><span><b>W/S</b> aim/crouch/climb</span><span><b>SPACE/Z</b> jump</span><span><b>J/X/LMB</b> attack</span><span><b>E/C/RMB</b> eject armor / possess / magic</span><span><b>T</b> CRT</span><span><b>M</b> mute</span><span><b>P</b> pause</span>
</div>
<script>
'use strict';
/* =====================================================================
   GHOSTS 'N GOBLINS : THE CURSED PC GAMING MUSEUM
   A clean-room CPS-1 style action platformer.
   320x200 software framebuffer, 3 layer parallax, YM2151-style FM audio.
   ===================================================================== */

// ---------------------------------------------------------------- CONSTANTS
const W = 320, H = 200, TS = 16, MAP_H = 13;
const GRAV = 0.32, MAXFALL = 6.5;
const FRAME_MS = 1000 / 60;

// ---------------------------------------------------------------- UTIL
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function sgn(v) { return v < 0 ? -1 : v > 0 ? 1 : 0; }
function aabb(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function dist(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }
// deterministic RNG (mulberry32)
function RNG(seed) { let s = seed >>> 0; return function () { s += 0x6D2B79F5; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash2(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967296; }
const rnd = Math.random;
function rr(a, b) { return a + rnd() * (b - a); }
function ri(a, b) { return Math.floor(rr(a, b + 1)); }

// ---------------------------------------------------------------- PALETTE (CPS-1 flavoured)
function RGB(r, g, b) { return (0xFF000000 | (b << 16) | (g << 8) | r) >>> 0; }
const PAL = [
  RGB(0, 0, 0), RGB(255, 255, 255), RGB(204, 212, 228), RGB(140, 150, 172), RGB(80, 88, 112),          // 0-4 black white steel
  RGB(240, 190, 140), RGB(190, 130, 90), RGB(222, 32, 32), RGB(130, 10, 24), RGB(244, 204, 44),         // 5-9 skin red gold
  RGB(170, 120, 10), RGB(64, 184, 64), RGB(24, 92, 32), RGB(124, 82, 40), RGB(70, 46, 22),              // 10-14 dgold green brown
  RGB(232, 226, 200), RGB(160, 150, 120), RGB(52, 84, 224), RGB(22, 32, 112), RGB(84, 222, 232),         // 15-19 bone blue cyan
  RGB(144, 52, 184), RGB(60, 22, 92), RGB(240, 132, 32), RGB(252, 240, 84), RGB(112, 112, 124),          // 20-24 purple orange yellow gray
  RGB(50, 50, 62), RGB(20, 16, 46), RGB(240, 240, 204), RGB(124, 255, 60), RGB(252, 140, 172),           // 25-29 dgray nightsky moon toxic pink
  RGB(172, 172, 184), RGB(18, 14, 22), RGB(96, 24, 32), RGB(32, 160, 120), RGB(200, 100, 40),            // 30-34 lgray nearblack blood teal rust
  RGB(60, 90, 140), RGB(120, 60, 30), RGB(255, 80, 20), RGB(90, 200, 255), RGB(40, 40, 40)               // 35-39 slate wood fire ice coal
];
const C = {
  BLK: 0, WHT: 1, STL: 2, STM: 3, STD: 4, SKN: 5, SKD: 6, RED: 7, DRED: 8, GLD: 9, DGLD: 10, GRN: 11, DGRN: 12,
  BRN: 13, DBRN: 14, BONE: 15, BONED: 16, BLU: 17, DBLU: 18, CYN: 19, PUR: 20, DPUR: 21, ORG: 22, YEL: 23,
  GRY: 24, DGRY: 25, SKY: 26, MOON: 27, TOX: 28, PNK: 29, LGRY: 30, NBLK: 31, BLOOD: 32, TEAL: 33, RUST: 34,
  SLATE: 35, WOOD: 36, FIRE: 37, ICE: 38, COAL: 39
};
function mix(a, b, t) { // blend two ABGR colours
  const ar = a & 255, ag = (a >> 8) & 255, ab = (a >> 16) & 255, br = b & 255, bg = (b >> 8) & 255, bb = (b >> 16) & 255;
  return RGB((ar + (br - ar) * t) | 0, (ag + (bg - ag) * t) | 0, (ab + (bb - ab) * t) | 0);
}
function lighten(c, t) { return mix(c, 0xFFFFFFFF, t); }
function darken(c, t) { return mix(c, 0xFF000000, t); }

// ---------------------------------------------------------------- FRAMEBUFFER
const canvas = document.getElementById('screen');
const ctx2d = canvas.getContext('2d');
const imgData = ctx2d.createImageData(W, H);
const fb = new Uint32Array(imgData.data.buffer);
const bezel = document.getElementById('bezel');
let camX = 0, camY = 0, shakeX = 0, shakeY = 0;

const FB = {
  clear(c) { fb.fill(c); },
  px(x, y, c) { if (x >= 0 && y >= 0 && x < W && y < H) fb[y * W + x] = c; },
  rect(x, y, w, h, c) {
    x |= 0; y |= 0; w |= 0; h |= 0;
    let x0 = Math.max(0, x), y0 = Math.max(0, y), x1 = Math.min(W, x + w), y1 = Math.min(H, y + h);
    for (let yy = y0; yy < y1; yy++) { const o = yy * W; for (let xx = x0; xx < x1; xx++) fb[o + xx] = c; }
  },
  rectA(x, y, w, h, c, t) { // alpha blended rect
    x |= 0; y |= 0; w |= 0; h |= 0;
    let x0 = Math.max(0, x), y0 = Math.max(0, y), x1 = Math.min(W, x + w), y1 = Math.min(H, y + h);
    for (let yy = y0; yy < y1; yy++) { const o = yy * W; for (let xx = x0; xx < x1; xx++) fb[o + xx] = mix(fb[o + xx], c, t); }
  },
  box(x, y, w, h, c) { FB.hline(x, y, w, c); FB.hline(x, y + h - 1, w, c); FB.vline(x, y, h, c); FB.vline(x + w - 1, y, h, c); },
  hline(x, y, w, c) { FB.rect(x, y, w, 1, c); },
  vline(x, y, h, c) { FB.rect(x, y, 1, h, c); },
  line(x0, y0, x1, y1, c) {
    x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let err = dx + dy;
    for (let i = 0; i < 1000; i++) { FB.px(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
  },
  circle(cx, cy, r, c) {
    cx |= 0; cy |= 0; const r2 = r * r;
    for (let y = -r; y <= r; y++) { const yy = cy + y; if (yy < 0 || yy >= H) continue; const hw = Math.sqrt(r2 - y * y) | 0; FB.rect(cx - hw, yy, hw * 2 + 1, 1, c); }
  },
  ring(cx, cy, r, c) { const n = Math.max(8, r * 6) | 0; for (let i = 0; i < n; i++) { const a = i / n * 6.2832; FB.px((cx + Math.cos(a) * r) | 0, (cy + Math.sin(a) * r) | 0, c); } },
  // blit compiled sprite; flip horizontally when flip=true; optional tint colour (solid silhouette) and alpha
  blit(s, x, y, flip, tint, alpha) {
    x |= 0; y |= 0; const sw = s.w, sh = s.h, d = s.px;
    const x0 = Math.max(0, x), y0 = Math.max(0, y), x1 = Math.min(W, x + sw), y1 = Math.min(H, y + sh);
    for (let yy = y0; yy < y1; yy++) {
      const ro = (yy - y) * sw, o = yy * W;
      for (let xx = x0; xx < x1; xx++) {
        const sx = flip ? (sw - 1 - (xx - x)) : (xx - x);
        const c = d[ro + sx]; if (c === 0) continue;
        if (alpha !== undefined && alpha < 1) fb[o + xx] = mix(fb[o + xx], tint || c, alpha);
        else fb[o + xx] = tint || c;
      }
    }
  },
  blitScaled(s, x, y, sc, flip) { // nearest-neighbour integer scale
    for (let yy = 0; yy < s.h; yy++) for (let xx = 0; xx < s.w; xx++) { const c = s.px[yy * s.w + (flip ? s.w - 1 - xx : xx)]; if (c) FB.rect(x + xx * sc, y + yy * sc, sc, sc, c); }
  },
  present() { ctx2d.putImageData(imgData, 0, 0); }
};

// ---------------------------------------------------------------- SPRITE COMPILER
// rows: array of strings; legend: char -> palette index or raw colour. '.' and ' ' are transparent.
const sprCache = new Map();
function spr(rows, legend) {
  const h = rows.length, w = rows[0].length, px = new Uint32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x]; if (ch === '.' || ch === ' ' || ch === undefined) continue;
    let c = legend[ch]; if (c === undefined) continue;
    px[y * w + x] = (c < 256) ? PAL[c] : c;
  }
  return { w, h, px };
}
function sprVariant(key, rows, legend) { let s = sprCache.get(key); if (!s) { s = spr(rows, legend); sprCache.set(key, s); } return s; }
function flipV(s) { const o = { w: s.w, h: s.h, px: new Uint32Array(s.w * s.h) }; for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w; x++) o.px[(s.h - 1 - y) * s.w + x] = s.px[y * s.w + x]; return o; }

// ---------------------------------------------------------------- FONT (5x7 arcade)
const FONT_DATA = {
  A: '0E11111F111111', B: '1E11111E11111E', C: '0E1110101011 0E', D: '1E11111111111E', E: '1F10101E10101F', F: '1F10101E101010', G: '0E111017 11110F',
  H: '1111111F111111', I: '0E04040404040E', J: '070202020212 0C', K: '11121418141211', L: '1010101010101F', M: '111B1515111111', N: '11111915131111',
  O: '0E1111111111 0E', P: '1E11111E101010', Q: '0E111111151 20D', R: '1E11111E141211', S: '0F10100E01011E', T: '1F04040404 0404', U: '1111111111110E',
  V: '111111111 10A04', W: '111111151515 0A', X: '11110A040A1111', Y: '11110A04040404', Z: '1F01020408101F',
  '0': '0E11131519110E', '1': '040C040404040E', '2': '0E110102040 81F', '3': '1E01010E01011E', '4': '02060A121F0202', '5': '1F101E0101110E',
  '6': '0608101E11110E', '7': '1F010204080808', '8': '0E11110E11110E', '9': '0E11110F01020C', ' ': '00000000000000', '.': '0000000000 0C0C',
  ',': '00000000 0C0408', '!': '04040404040004', '?': '0E110102040004', ':': '000C0C000C0C00', '-': '0000001F000000', "'": '04040800000000',
  '/': '01010204081010', '(': '02040808080402', ')': '08040202020408', '+': '0004041F040400', '&': '0814140815120D', '%': '191A0204080B13',
  '>': '08040201020408', '<': '02040810080402', '_': '0000000000001F', '=': '00001F001F0000', '"': '0A0A0000000000', '*': '00150E1F0E1500', '#': '0A1F0A0A1F0A00',
  '[': '0E08080808080E', ']': '0E02020202020E'
};
const FONT = {};
for (const k in FONT_DATA) { const s = FONT_DATA[k].replace(/\s+/g, ''); const rows = []; for (let i = 0; i < 7; i++) rows.push(parseInt(s.substr(i * 2, 2), 16)); FONT[k] = rows; }
function text(str, x, y, c, shadow) {
  str = String(str).toUpperCase(); x |= 0; y |= 0;
  for (let i = 0; i < str.length; i++) {
    const g = FONT[str[i]] || FONT['?'];
    for (let r = 0; r < 7; r++) { const bits = g[r]; for (let b = 0; b < 5; b++) if (bits & (16 >> b)) { if (shadow !== undefined) FB.px(x + b + 1, y + r + 1, shadow); FB.px(x + b, y + r, c); } }
    x += 6;
  }
}
function textC(str, cx, y, c, shadow) { text(str, cx - str.length * 3, y, c, shadow); }
function textW(str) { return str.length * 6; }

// ---------------------------------------------------------------- INPUT
const keys = {}, pressed = {};
const KEYMAP = {
  a: 'left', arrowleft: 'left', d: 'right', arrowright: 'right', w: 'up', arrowup: 'up', s: 'down', arrowdown: 'down',
  ' ': 'jump', z: 'jump', j: 'attack', x: 'attack', e: 'action', c: 'action', enter: 'start', t: 'crt', p: 'pause', m: 'mute',
  escape: 'back', '1': 'w1', '2': 'w2', '3': 'w3', '4': 'w4', '5': 'w5', '6': 'w6', f: 'fs'
};
function onKey(e, down) {
  const k = e.key.toLowerCase(); const a = KEYMAP[k]; if (!a) return;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if (down && !keys[a]) pressed[a] = true;
  keys[a] = down; Audio.unlock();
}
window.addEventListener('keydown', e => onKey(e, true));
window.addEventListener('keyup', e => onKey(e, false));
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('mousedown', e => { const a = e.button === 2 ? 'action' : e.button === 0 ? 'attack' : null; if (!a) return; e.preventDefault(); if (!keys[a]) pressed[a] = true; keys[a] = true; Audio.unlock(); });
window.addEventListener('mouseup', e => { const a = e.button === 2 ? 'action' : e.button === 0 ? 'attack' : null; if (a) keys[a] = false; });
function clearPressed() { for (const k in pressed) pressed[k] = false; }

// ---------------------------------------------------------------- AUDIO : YM2151-style FM + PSG
const Audio = (() => {
  let ac = null, master, musicBus, sfxBus, noiseBuf, muted = false, unlocked = false;
  // ---- instrument patches (2-op FM: carrier + modulator; ratio = mod/car freq ratio; idx = modulation index (Hz per carrier Hz))
  const INST = {
    harp: { cw: 'triangle', ratio: 3.01, idx: 2.2, idxDec: 0.08, a: 0.004, d: 0.28, s: 0.0, r: 0.08, vol: 0.32 },
    organ: { cw: 'sine', ratio: 2.0, idx: 0.9, idxDec: 0.6, a: 0.03, d: 0.2, s: 0.8, r: 0.12, vol: 0.22, extra: [[2, 0.35], [3, 0.18], [0.5, 0.4]] },
    bass: { cw: 'square', ratio: 1.0, idx: 1.6, idxDec: 0.15, a: 0.004, d: 0.22, s: 0.15, r: 0.06, vol: 0.34, lp: 900 },
    lead: { cw: 'sawtooth', ratio: 1.0, idx: 1.1, idxDec: 0.3, a: 0.01, d: 0.25, s: 0.45, r: 0.1, vol: 0.2, lp: 2600 },
    bell: { cw: 'sine', ratio: 3.5, idx: 3.0, idxDec: 0.05, a: 0.002, d: 0.6, s: 0.0, r: 0.3, vol: 0.25 },
    choir: { cw: 'sine', ratio: 1.0, idx: 0.3, idxDec: 1.0, a: 0.15, d: 0.3, s: 0.7, r: 0.3, vol: 0.18, extra: [[1.005, 0.6], [2.003, 0.25]] },
    brass: { cw: 'sawtooth', ratio: 1.0, idx: 2.4, idxDec: 0.4, a: 0.04, d: 0.2, s: 0.6, r: 0.1, vol: 0.2, lp: 1800 },
    pluck: { cw: 'triangle', ratio: 2.0, idx: 1.4, idxDec: 0.1, a: 0.002, d: 0.14, s: 0.0, r: 0.05, vol: 0.28 }
  };
  const NOTE = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
  function midi(tok) { // "c#4" "bb3"
    let i = 0; let n = NOTE[tok[i++]]; if (tok[i] === '#') { n++; i++; } else if (tok[i] === 'b') { n--; i++; }
    const oct = parseInt(tok.substr(i)); return 12 * (oct + 1) + n;
  }
  function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function ensure() {
    if (ac) return true;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; }
    master = ac.createGain(); master.gain.value = 0.7;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6;
    master.connect(comp); comp.connect(ac.destination);
    musicBus = ac.createGain(); musicBus.gain.value = 0.8; musicBus.connect(master);
    sfxBus = ac.createGain(); sfxBus.gain.value = 1.0; sfxBus.connect(master);
    const len = ac.sampleRate * 1.5; noiseBuf = ac.createBuffer(1, len, ac.sampleRate); const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return true;
  }
  function unlock() { if (unlocked) return; if (!ensure()) return; if (ac.state === 'suspended') ac.resume(); unlocked = true; }
  // ---- FM voice
  function fm(inst, m, t, dur, vel, bus) {
    if (!ac) return; vel = vel === undefined ? 1 : vel; bus = bus || musicBus;
    const f = hz(m), p = INST[inst];
    const out = ac.createGain(); out.gain.setValueAtTime(0.0001, t);
    const peak = p.vol * vel;
    out.gain.linearRampToValueAtTime(peak, t + p.a);
    out.gain.setTargetAtTime(peak * Math.max(p.s, 0.0001), t + p.a, p.d / 3);
    const end = t + dur; out.gain.setTargetAtTime(0.0001, end, p.r / 3);
    let dest = out;
    if (p.lp) { const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = p.lp; lp.Q.value = 1.2; out.connect(lp); lp.connect(bus); } else out.connect(bus);
    const stopT = end + p.r + 0.15;
    const makeOp = (freq, gain) => {
      const car = ac.createOscillator(); car.type = p.cw; car.frequency.value = freq;
      const mod = ac.createOscillator(); mod.type = 'sine'; mod.frequency.value = freq * p.ratio;
      const mg = ac.createGain(); mg.gain.setValueAtTime(freq * p.idx, t); mg.gain.setTargetAtTime(freq * p.idx * p.idxDec, t, p.d / 2);
      mod.connect(mg); mg.connect(car.frequency);
      let g = dest; if (gain !== 1) { g = ac.createGain(); g.gain.value = gain; g.connect(dest); }
      car.connect(g); car.start(t); mod.start(t); car.stop(stopT); mod.stop(stopT);
    };
    makeOp(f, 1);
    if (p.extra) for (const [r, g] of p.extra) makeOp(f * r, g);
  }
  // ---- PSG / percussion
  function noise(t, dur, vol, hp, lp, bus) {
    if (!ac) return; const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let n = src; if (hp) { const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; n.connect(f); n = f; }
    if (lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; n.connect(f); n = f; }
    n.connect(g); g.connect(bus || musicBus); src.start(t); src.stop(t + dur + 0.02);
  }
  function tone(t, f0, f1, dur, vol, type, bus) { // PSG style sweep
    if (!ac) return; const o = ac.createOscillator(); o.type = type || 'square'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus || sfxBus); o.start(t); o.stop(t + dur + 0.02);
  }
  function drum(kind, t, vel) {
    vel = vel || 1;
    if (kind === 'k') { tone(t, 150, 40, 0.18, 0.5 * vel, 'sine', musicBus); noise(t, 0.03, 0.15 * vel, 0, 800); }
    else if (kind === 's') { noise(t, 0.14, 0.3 * vel, 900, 6000); tone(t, 220, 120, 0.08, 0.2 * vel, 'triangle', musicBus); }
    else if (kind === 'h') { noise(t, 0.04, 0.12 * vel, 7000, 0); }
    else if (kind === 'o') { noise(t, 0.18, 0.1 * vel, 6000, 0); }
    else if (kind === 't') { tone(t, 300, 90, 0.2, 0.3 * vel, 'sine', musicBus); }
    else if (kind === 'c') { noise(t, 0.5, 0.18 * vel, 3000, 0); }
  }
  // ---- Sequencer

// ---------------------------------------------------------------- TILES & WORLD BUILDER
const T = { EMPTY: 0, SOLID: 1, PLAT: 2, LADDER: 3, LADDERTOP: 4, SPIKE: 5, LIQUID: 6, CRACK: 7, GHOST: 8, CONVL: 9, CONVR: 10, GATE: 11, PLATE: 12 };
const SOLID_TILES = new Set([T.SOLID, T.CRACK, T.GHOST, T.CONVL, T.CONVR, T.GATE]);
const ONEWAY_TILES = new Set([T.PLAT, T.LADDERTOP]);

let world = null;
function newWorld(stage, wTiles) {
  return {
    stage, w: wTiles, pw: wTiles * TS, tiles: new Uint8Array(wTiles * MAP_H), skin: new Uint8Array(wTiles * MAP_H),
    spawns: [], objs: [], chests: [], decors: [], zones: [], arena: null, exitX: (wTiles - 3) * TS, startX: 24, startY: 0, minibosses: []
  };
}
function tileAt(tx, ty) {
  if (!world) return T.EMPTY; if (tx < 0 || tx >= world.w) return T.SOLID; if (ty < 0) return T.EMPTY; if (ty >= MAP_H) return T.EMPTY;
  return world.tiles[ty * world.w + tx];
}
function setTile(tx, ty, t, sk) { if (tx < 0 || tx >= world.w || ty < 0 || ty >= MAP_H) return; world.tiles[ty * world.w + tx] = t; if (sk !== undefined) world.skin[ty * world.w + tx] = sk; }
function isSolidTile(t, spectral) { if (t === T.GHOST) return true; return SOLID_TILES.has(t); }
function groundTopAt(px, fromY) { // first solid/oneway row at pixel column (skipping a solid ceiling); returns pixel y or MAP_H*TS
  const tx = Math.floor(px / TS); let ty = fromY !== undefined ? Math.max(0, Math.floor(fromY / TS)) : 0;
  while (ty < MAP_H && SOLID_TILES.has(tileAt(tx, ty))) ty++; // skip ceiling rows
  for (; ty < MAP_H; ty++) { const t = tileAt(tx, ty); if (SOLID_TILES.has(t) || ONEWAY_TILES.has(t)) return ty * TS; }
  return MAP_H * TS;
}
// Builder helpers (all tile coordinates; y counted as rows from top, h = height in tiles from bottom)
const B = {
  fill(x0, y0, x1, y1, t, sk) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) setTile(x, y, t, sk); },
  ground(x0, x1, h, sk) { B.fill(x0, MAP_H - h, x1, MAP_H - 1, T.SOLID, sk || 0); },
  clear(x0, x1) { B.fill(x0, 0, x1, MAP_H - 1, T.EMPTY, 0); },
  pit(x0, x1, kind) { B.clear(x0, x1); const t = kind === 'spike' ? T.SPIKE : T.LIQUID; B.fill(x0, MAP_H - 1, x1, MAP_H - 1, t, 0); },
  plat(x, y, len, sk) { for (let i = 0; i < len; i++) setTile(x + i, y, T.PLAT, sk || 0); },
  block(x, y, len, sk) { for (let i = 0; i < len; i++) setTile(x + i, y, T.SOLID, sk || 0); },
  ladder(x, y0, y1) { setTile(x, y0, T.LADDERTOP); for (let y = y0 + 1; y <= y1; y++) if (!SOLID_TILES.has(tileAt(x, y))) setTile(x, y, T.LADDER); },
  crack(x, y, len, sk) { for (let i = 0; i < len; i++) setTile(x + i, y, T.CRACK, sk || 0); },
  ghost(x, y, len) { for (let i = 0; i < len; i++) setTile(x + i, y, T.GHOST); },
  conv(x, y, len, dir) { for (let i = 0; i < len; i++) setTile(x + i, y, dir < 0 ? T.CONVL : T.CONVR); },
  gate(x, y0, y1, id) { for (let y = y0; y <= y1; y++) setTile(x, y, T.GATE); world.objs.push({ type: 'gate', tx: x, y0, y1, id }); },
  plate(x, y, id, kind) { world.objs.push({ type: 'plate', tx: x, ty: y, id, kind: kind || 'gate' }); },
  enemy(type, x, yBottomRow, opts) { world.spawns.push(Object.assign({ type, x: x * TS, y: yBottomRow * TS, dir: -1 }, opts || {})); },
  obj(o) { world.objs.push(o); },
  chest(x, kind, opts) { world.chests.push(Object.assign({ tx: x, kind, spawned: false }, opts || {})); },
  decor(kind, x, y, o) { world.decors.push(Object.assign({ kind, x: x * TS, y: y * TS }, o || {})); },
  zone(type, x0, x1, opts) { world.zones.push(Object.assign({ type, x0: x0 * TS, x1: x1 * TS }, opts || {})); },
  arena(x0, boss) { world.arena = { x: x0 * TS, boss, active: false, done: false }; },
  bridge(x, y, len) { for (let i = 0; i < len; i++) setTile(x + i, y, T.SOLID, 9); world.objs.push({ type: 'bridge', tx: x, ty: y, len }); },
  slicer(x, y0, y1, phase) { world.objs.push({ type: 'slicer', tx: x, y0, y1, phase: phase || 0 }); },
  piston(x, y0, y1, period, phase, wide) { world.objs.push({ type: 'piston', tx: x, y0, y1, period: period || 150, phase: phase || 0, wide: wide || 2 }); }
};

function buildStage(n) {
  const st = STAGES[n - 1];
  world = newWorld(st, st.w);
  st.build();
  world.startY = groundTopAt(world.startX) - 24;
  return world;
}

// ---------------------------------------------------------------- BACKGROUND LAYERS (3-layer parallax)
const lightning = { t: 0, bolt: null, next: 300 };
function skyGradient(top, bot) { for (let y = 0; y < H; y++) FB.hline(0, y, W, mix(top, bot, y / H)); }
function stars(seed, n, maxY) { const r = RNG(seed); for (let i = 0; i < n; i++) { const x = (r() * 640 - camX * 0.05) % 640; const y = r() * maxY; const c = r() < 0.2 ? PAL[C.WHT] : PAL[C.LGRY]; FB.px(((x % 640) + 640) % 640 % W, y | 0, c); } }
function moon(x, y, r, c) { FB.circle(x, y, r, c); FB.circle(x - r * 0.4, y - r * 0.3, r * 0.75, mix(c, PAL[C.SKY], 0.1)); }
function wrapX(x, span) { return ((x % span) + span) % span; }

function drawBackground(theme, time) {
  const px = camX, t = time;
  switch (theme) {
    case 'ship': {
      skyGradient(PAL[C.SKY], RGB(70, 40, 90)); stars(7, 60, 110); moon(260 - px * 0.03, 34, 14, PAL[C.MOON]);
      // far: distant island & clouds
      for (let i = 0; i < 5; i++) { const x = wrapX(i * 140 - px * 0.15 + 30, 640) - 100; FB.rect(x, 80 + (i % 2) * 6, 70, 6, RGB(40, 30, 60)); FB.rect(x + 15, 74 + (i % 2) * 6, 30, 8, RGB(40, 30, 60)); }
      FB.rect(0, 118, W, 82, RGB(24, 30, 70));
      // mid: sea waves and distant ghost ship hull
      for (let y = 120; y < 200; y += 6) { const c = mix(RGB(30, 40, 90), RGB(60, 90, 160), (y - 120) / 80); for (let x = -16; x < W + 16; x += 16) { const ox = wrapX(x - px * 0.4 + Math.sin(t * 0.05 + y) * 4, 16); FB.hline(x + ox - 16, y + ((Math.sin(t * 0.08 + x * 0.1) * 1.5) | 0), 9, c); } }
      const sx = wrapX(400 - px * 0.3, 900) - 200; FB.rect(sx, 108, 90, 14, RGB(30, 24, 36)); FB.rect(sx + 20, 70, 3, 40, RGB(30, 24, 36)); FB.rect(sx + 55, 62, 3, 48, RGB(30, 24, 36));
      FB.rect(sx + 6, 76, 14, 28, RGB(60, 60, 70)); FB.rect(sx + 41, 68, 14, 36, RGB(60, 60, 70));
      break;
    }
    case 'castle': {
      skyGradient(RGB(16, 12, 40), RGB(60, 30, 70)); stars(11, 50, 90); moon(60 - px * 0.03, 28, 12, PAL[C.MOON]);
      // far: castle silhouette with lit windows
      const cx = 140 - px * 0.12; FB.rect(cx, 60, 120, 80, RGB(30, 22, 48)); FB.rect(cx + 10, 40, 20, 100, RGB(30, 22, 48)); FB.rect(cx + 90, 46, 20, 94, RGB(30, 22, 48));
      for (let i = 0; i < 6; i++) FB.rect(cx + 10 + i * 20, 60, 10, 8, RGB(30, 22, 48));
      for (let i = 0; i < 4; i++) { const lit = Math.sin(t * 0.02 + i) > 0.3; FB.rect(cx + 24 + i * 24, 84 + (i % 2) * 20, 5, 9, lit ? PAL[C.ORG] : RGB(50, 40, 70)); }
      // mid: dead trees & fog
      for (let i = 0; i < 8; i++) { const x = wrapX(i * 90 - px * 0.45, 720) - 40; FB.rect(x, 110, 4, 60, RGB(28, 20, 24)); FB.line(x + 2, 120, x - 10, 100, RGB(28, 20, 24)); FB.line(x + 2, 128, x + 14, 104, RGB(28, 20, 24)); FB.line(x + 2, 112, x + 6, 96, RGB(28, 20, 24)); }
      for (let y = 150; y < 200; y += 2) FB.rectA(0, y, W, 2, RGB(140, 140, 170), 0.08 + 0.1 * Math.sin(y * 0.3 + t * 0.03));
      break;
    }
    case 'catacomb': {
      skyGradient(RGB(30, 20, 14), RGB(60, 40, 24));
      // far: sandstone wall with carvings
      for (let y = 8; y < 200; y += 12) for (let x = -24; x < W + 24; x += 24) { const ox = wrapX(x - px * 0.2 + ((y / 12) % 2) * 12, 24); FB.rect(x + ox - 24, y, 23, 11, RGB(72, 50, 30)); }
      for (let i = 0; i < 6; i++) { const x = wrapX(i * 110 - px * 0.2, 660) - 20; FB.rect(x, 40, 30, 100, RGB(50, 34, 20)); FB.rect(x + 4, 50, 22, 80, RGB(60, 42, 26)); }
      // mid: pillars and torchlight
      for (let i = 0; i < 6; i++) { const x = wrapX(i * 120 - px * 0.5 + 40, 720) - 20; FB.rect(x, 20, 12, 180, RGB(90, 64, 36)); FB.rect(x - 3, 20, 18, 6, RGB(110, 80, 44)); FB.rect(x + 2, 20, 2, 180, RGB(120, 90, 50)); }

function draw() {
  const time = G.frame + G.modeT;
  switch (G.mode) {
    case 'title': drawTitle(demoT); break;
    case 'map': drawMap(G.modeT); break;
    case 'intro': drawIntroCard(time); break;
    case 'play': drawPlay(time); if (G.paused) { FB.rectA(0, 80, W, 40, PAL[C.BLK], 0.7); textBigC('PAUSE', W / 2, 90, PAL[C.WHT], 2, PAL[C.DGRY]); textC('ESC: QUIT TO TITLE', W / 2, 110, PAL[C.LGRY]); } break;
    case 'clear': drawClear(time); break;
    case 'gameover': drawGameOver(G.modeT); break;
    case 'ending': drawEnding(G.modeT); break;
  }
  if (Audio.muted) text('MUTE', W - 30, H - 9, PAL[C.RED], PAL[C.BLK]);
  FB.present();
}

// ---------------------------------------------------------------- MAIN LOOP (locked 60 FPS)
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now; let n = 0;
  while (acc >= FRAME_MS && n < 3) { update(); acc -= FRAME_MS; n++; }
  if (n === 3) acc = 0;
  draw(); requestAnimationFrame(frame);
}
function fitCanvas() {
  const pad = G.crt ? 60 : 16; const sc = Math.max(1, Math.floor(Math.min((window.innerWidth - pad) / W, (window.innerHeight - pad - 30) / H)));
  canvas.style.width = (W * sc) + 'px'; canvas.style.height = (H * sc) + 'px';
}
window.addEventListener('resize', fitCanvas); fitCanvas();
requestAnimationFrame(frame);
</script>
