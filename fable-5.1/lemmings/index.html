<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemmings: Beat Tribe</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: monospace; color: #889; }
  #bezel { position: relative; padding: 0; line-height: 0; }
  body.crt #bezel { padding: 10px; background: #15161c; border-radius: 14px; box-shadow: 0 0 0 2px #2a2c36, 0 0 40px rgba(60, 220, 120, 0.12), inset 0 0 30px rgba(0, 0, 0, 0.8); }
  body.crt #bezel::after { content: ''; position: absolute; left: 10px; top: 10px; right: 10px; bottom: 10px; pointer-events: none; border-radius: 6px; box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.45); }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: -moz-crisp-edges; cursor: none; display: block; background: #000; }
  #help { position: fixed; left: 8px; bottom: 6px; font-size: 11px; opacity: 0.5; pointer-events: none; }
</style>
</head>
<body>
<div id="bezel"><canvas id="screen" width="320" height="200"></canvas></div>
<div id="help">LEMMINGS: BEAT TRIBE — 1-8 skills · ←/→ A/D scroll · P pause · F fast-forward · N nuke (x2) · -/+ rate · T mixer · M mute · C CRT · Esc menu</div>
<script src="sim.js"></script>
<script src="levels.js"></script>
<script src="solutions.js"></script>
<script src="audio.js"></script>
<script src="render.js"></script>
<script src="game.js"></script>
</body>
</html>
